<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruce Prints — the game, drawn</title>
<!--
  🧩 BRUCE PRINTS — the content browser.

  Left: the folders, one per system, exactly like Unreal's Content Browser.
  Right: the print, on a canvas you pan with a drag and zoom with the wheel.
  A node is a function; a wire is a call; the colour is what the function does.
  Every node carries the real file and line it was read from — click one and the
  inspector prints it, so a print can always be checked against the code.

  The graphs are generated by tools/bruceprints/build.mjs from the SHIPPED
  source. Nothing here is written by hand, which is the point: a hand-drawn
  diagram is out of date the day after it is drawn.
-->
<style>
  :root {
    --bg: #14161b; --panel: #1b1e25; --panel2: #22262f; --line: #2e333e;
    --ink: #d9dee8; --dim: #8b93a3; --wire: #cfd6e4;
    --event: #8d2b2b; --event2: #b03a3a; --fn: #1f4f7a; --fn2: #2b6ea8;
    --pure: #24613a; --pure2: #2f8049; --data: #5a2f7a; --data2: #7a41a6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.45 "Segoe UI", Roboto, system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 280px 1fr 300px; grid-template-rows: 44px 1fr; height: 100%; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 14px;
    background: linear-gradient(#232732, #1a1d24); border-bottom: 1px solid var(--line); }
  header b { letter-spacing: .14em; font-size: 12px; color: #ffcf70; }
  header .meta { color: var(--dim); font-size: 11px; }
  header .legend { margin-left: auto; display: flex; gap: 12px; font-size: 11px; color: var(--dim); align-items: center; }
  header .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  nav { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px 0 40px; }
  nav .folder { padding: 7px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  nav .folder:hover { background: #232833; }
  nav .folder.open { background: #262c38; }
  nav .folder .n { margin-left: auto; color: var(--dim); font-size: 11px; }
  nav .print { padding: 5px 12px 5px 34px; cursor: pointer; color: var(--dim); font-size: 12px; }
  nav .print:hover { color: var(--ink); background: #232833; }
  nav .print.active { color: #ffcf70; background: #2a3040; }
  main { position: relative; overflow: hidden; background:
    radial-gradient(circle at 1px 1px, #232733 1px, transparent 0) 0 0 / 26px 26px, #171a20; cursor: grab; }
  main.drag { cursor: grabbing; }
  #stage { position: absolute; inset: 0; transform-origin: 0 0; }
  svg.wires { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .node { position: absolute; width: 258px; background: var(--panel2); border: 1px solid #10131a;
    border-radius: 7px; box-shadow: 0 6px 18px rgba(0,0,0,.45); overflow: hidden; }
  .node .hd { padding: 5px 9px; font-weight: 700; font-size: 12px; color: #fff;
    display: flex; align-items: center; gap: 6px; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .node.event .hd { background: linear-gradient(var(--event2), var(--event)); }
  .node.function .hd { background: linear-gradient(var(--fn2), var(--fn)); }
  .node.pure .hd { background: linear-gradient(var(--pure2), var(--pure)); }
  .node.data .hd { background: linear-gradient(var(--data2), var(--data)); }
  .node .bd { padding: 6px 9px 8px; font-size: 11px; color: var(--dim); }
  .node .pin { display: flex; align-items: center; gap: 6px; padding: 1px 0; color: #b9c1cf; }
  .node .pin b { width: 9px; height: 9px; border-radius: 50%; background: #7fd1ff; display: inline-block; }
  .node .pin.w b { background: #ff9f5a; }
  .node .sig { color: #9fb6cc; font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; word-break: break-all; }
  .node.sel { outline: 2px solid #ffcf70; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 12px; overflow: auto; }
  aside h3 { margin: 0 0 4px; font-size: 13px; color: #ffcf70; word-break: break-all; }
  aside .path { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: #8fd0ff; word-break: break-all; }
  aside .sec { margin-top: 14px; font-size: 11px; letter-spacing: .1em; color: var(--dim); }
  aside ul { margin: 4px 0 0; padding-left: 16px; }
  aside li { font-size: 11.5px; color: #b9c1cf; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  .empty { color: var(--dim); padding: 24px; }
  #zoom { position: absolute; right: 12px; bottom: 12px; background: #1c212b; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <b>🧩 BRUCE PRINTS</b>
    <span class="meta" id="meta">loading…</span>
    <span class="legend">
      <span><i style="background:#b03a3a"></i>event</span>
      <span><i style="background:#2b6ea8"></i>function</span>
      <span><i style="background:#2f8049"></i>pure</span>
      <span><i style="background:#7a41a6"></i>writes state</span>
      <span>drag to pan · wheel to zoom</span>
    </span>
  </header>
  <nav id="nav"></nav>
  <main id="main"><div id="stage"><svg class="wires" id="wires"></svg></div><div id="zoom">100%</div></main>
  <aside id="side"><div class="empty">Pick a print, then click a node.</div></aside>
</div>
<script>
const NAV = document.getElementById('nav'), STAGE = document.getElementById('stage'),
      WIRES = document.getElementById('wires'), MAIN = document.getElementById('main'),
      SIDE = document.getElementById('side'), ZOOM = document.getElementById('zoom');
let view = { x: 40, y: 20, k: 0.8 }, current = null;

function applyView() {
  STAGE.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')';
  ZOOM.textContent = Math.round(view.k * 100) + '%';
}
MAIN.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 1 / 1.12, k2 = Math.max(0.15, Math.min(2.2, view.k * f));
  const r = MAIN.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  view.x = mx - (mx - view.x) * (k2 / view.k); view.y = my - (my - view.y) * (k2 / view.k); view.k = k2;
  applyView();
}, { passive: false });
let drag = null;
MAIN.addEventListener('mousedown', (e) => { if (e.target.closest('.node')) return; drag = { x: e.clientX - view.x, y: e.clientY - view.y }; MAIN.classList.add('drag'); });
window.addEventListener('mousemove', (e) => { if (!drag) return; view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; applyView(); });
window.addEventListener('mouseup', () => { drag = null; MAIN.classList.remove('drag'); });

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function boot() {
  const man = await (await fetch('manifest.json?cb=' + Date.now())).json();
  document.getElementById('meta').textContent =
    man.systems.length + ' systems · ' + man.functions.toLocaleString() + ' functions read from ' + man.sources + ' sources · ' + new Date(man.generated).toLocaleString();
  NAV.innerHTML = man.systems.map((s) =>
    '<div class="folder" data-sys="' + s.id + '"><span>' + s.icon + '</span><span>' + esc(s.label) + '</span><span class="n">' + s.functions + '</span></div>' +
    s.prints.map((p) => '<div class="print" data-sys="' + s.id + '" data-print="' + p.name + '">' + esc(p.name) + ' <span class="n">(' + p.nodes + ')</span></div>').join('')
  ).join('');
  NAV.addEventListener('click', (e) => {
    const pr = e.target.closest('.print');
    if (pr) return load(pr.dataset.sys, pr.dataset.print, pr);
    const fo = e.target.closest('.folder');
    if (fo) { const first = NAV.querySelector('.print[data-sys="' + fo.dataset.sys + '"]'); if (first) load(fo.dataset.sys, first.dataset.print, first); }
  });
  /* #System/Print — the Content Browser links straight to a graph. */
  let want = null;
  try {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (h.indexOf('/') > 0) { const [sy, pr] = h.split('/'); want = NAV.querySelector('.print[data-sys="' + sy + '"][data-print="' + pr + '"]'); }
  } catch (e) {}
  const first = want || NAV.querySelector('.print');
  if (first) load(first.dataset.sys, first.dataset.print, first);
}

async function load(sys, print, el) {
  document.querySelectorAll('.print.active').forEach((n) => n.classList.remove('active'));
  if (el) el.classList.add('active');
  const g = await (await fetch(sys + '/' + print + '.bp.json?cb=' + Date.now())).json();
  current = g;
  STAGE.querySelectorAll('.node').forEach((n) => n.remove());
  const pos = {};
  for (const n of g.nodes) {
    pos[n.id] = n;
    const d = document.createElement('div');
    d.className = 'node ' + n.kind; d.style.left = n.x + 'px'; d.style.top = n.y + 'px'; d.dataset.id = n.id;
    d.innerHTML =
      '<div class="hd">' + (n.kind === 'event' ? '▶' : n.kind === 'pure' ? 'ƒ' : n.kind === 'data' ? '💾' : '⬡') + ' ' + esc(n.name) + (n.async ? ' <span style="opacity:.7">async</span>' : '') + '</div>' +
      '<div class="bd">' +
        '<div class="sig">(' + esc(n.params.join(', ')) + ')</div>' +
        (n.reads.length ? '<div class="pin"><b></b>reads ' + esc(n.reads.slice(0, 3).join(', ')) + (n.reads.length > 3 ? ' +' + (n.reads.length - 3) : '') + '</div>' : '') +
        (n.writes.length ? '<div class="pin w"><b></b>writes ' + esc(n.writes.slice(0, 3).join(', ')) + (n.writes.length > 3 ? ' +' + (n.writes.length - 3) : '') + '</div>' : '') +
      '</div>';
    d.onclick = () => select(n, d);
    STAGE.appendChild(d);
  }
  const H = 74;
  WIRES.innerHTML = g.edges.map((e) => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return '';
    const x1 = a.x + 258, y1 = a.y + 26, x2 = b.x, y2 = b.y + 26, dx = Math.max(60, Math.abs(x2 - x1) * 0.45);
    return '<path d="M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2 + '" fill="none" stroke="var(--wire)" stroke-width="1.6" opacity=".45"/>';
  }).join('');
  SIDE.innerHTML = '<div class="empty">' + esc(g.icon + ' ' + g.label) + ' — ' + g.nodes.length + ' nodes, ' + g.edges.length + ' calls. Click a node.</div>';
  view = { x: 40, y: 20, k: 0.8 }; applyView();
}

function select(n, el) {
  document.querySelectorAll('.node.sel').forEach((x) => x.classList.remove('sel'));
  el.classList.add('sel');
  const callers = current.edges.filter((e) => e.to === n.id).map((e) => e.from);
  const callees = current.edges.filter((e) => e.from === n.id).map((e) => e.to);
  SIDE.innerHTML =
    '<h3>' + esc(n.name) + '</h3>' +
    '<div class="path">' + esc(n.file) + ':' + n.line + '</div>' +
    '<div class="sec">SIGNATURE</div><div class="path">' + (n.async ? 'async ' : '') + esc(n.name) + '(' + esc(n.params.join(', ')) + ')</div>' +
    (n.reads.length ? '<div class="sec">READS</div><ul>' + n.reads.map((r) => '<li>' + esc(r) + '</li>').join('') + '</ul>' : '') +
    (n.writes.length ? '<div class="sec">WRITES</div><ul>' + n.writes.map((r) => '<li>' + esc(r) + '</li>').join('') + '</ul>' : '') +
    (callers.length ? '<div class="sec">CALLED BY</div><ul>' + callers.map((r) => '<li>' + esc(r) + '</li>').join('') + '</ul>' : '') +
    (callees.length ? '<div class="sec">CALLS</div><ul>' + callees.map((r) => '<li>' + esc(r) + '</li>').join('') + '</ul>' : '');
}
boot().catch((e) => { document.getElementById('meta').textContent = 'failed: ' + e.message; });
</script>
</body>
</html>
