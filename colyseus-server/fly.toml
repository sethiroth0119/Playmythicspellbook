# Fly.io deployment config for Mythic Spellbook MP server.
#
# Deploy:   cd colyseus-server && fly launch --no-deploy   (first time, picks region etc.)
#           fly deploy                                     (subsequent deploys)
#
# Secrets (set with `fly secrets set KEY=value`):
#   SUPABASE_URL              — https://ktsiasyjusesawtrwrjc.supabase.co
#   SUPABASE_JWT_AUDIENCE     — usually 'authenticated' (the Supabase default)
#   SUPABASE_SERVICE_ROLE_KEY — for writing match-end winner_id back to Supabase
#   CORS_ORIGINS              — comma-separated list of origins allowed to connect
#                                (e.g. 'https://playmythicspellbook.play-a3d.workers.dev,https://mythicspellbook.xyz')
#
# Pricing: free tier (shared-cpu-1x / 256MB) covers ~100 concurrent matches.
# Scale up when needed: `fly scale memory 1024` or `fly scale count 2`.

app = "mythicspellbook"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2567"
  NODE_ENV = "production"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  # ⚠ SINGLE MACHINE REQUIRED. Colyseus matchmaking (joinOrCreate/filterBy) only
  # works within one process — two machines = two separate room registries, so
  # paired players land on different servers and never meet. Keep at 1 until a
  # shared Redis presence + driver is added for true multi-node matchmaking.
  max_machines_running = 1
  processes = ["app"]

# Colyseus uses WebSockets — Fly's HTTP service handles WS upgrade out of the box,
# no extra config needed. The health check below keeps the machine warm.
[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
