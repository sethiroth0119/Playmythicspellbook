  /* veil: keeps the photo from fighting the map and the gold UI */
  #backdrop::after{
    content:"";position:absolute;inset:-10%;pointer-events:none;
    background:
      radial-gradient(115% 80% at 50% 44%, rgba(7,4,26,0) 0%, rgba(8,5,26,.42) 52%, rgba(4,2,16,.88) 100%),
      linear-gradient(180deg, rgba(12,7,34,.30) 0%, rgba(6,3,20,.18) 40%, rgba(4,2,16,.72) 100%);
  }
  #stage{position:fixed;inset:0;z-index:1;}
  .panel, #toast, #loader{z-index:3;}
  canvas{display:block;}

  .panel{
    position:fixed;
    background:linear-gradient(160deg,rgba(16,9,40,.92),rgba(9,5,24,.88));
    border:1px solid rgba(242,208,137,.28);
    box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 18px 50px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,225,170,.10);
    backdrop-filter:blur(6px);
  }
  .panel::before{
    content:"";position:absolute;inset:4px;border:1px solid rgba(242,208,137,.14);pointer-events:none;
  }

  /* ---- title ---- */
  #title{top:18px;left:18px;padding:14px 22px 12px;}
  #title h1{
    font-family:"Cinzel",serif;font-weight:700;margin:0;
    font-size:19px;letter-spacing:.18em;text-transform:uppercase;
    color:#ffe6b0;text-shadow:0 0 18px rgba(255,181,71,.55);
  }
  #title .sub{
    margin-top:5px;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;
    color:rgba(203,185,255,.62);
  }

  /* ---- legend ---- */
  #legend{top:96px;left:18px;padding:12px 16px 13px;width:206px;}
  #legend h2{
    font-family:"Cinzel",serif;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
    margin:0 0 9px;color:rgba(242,208,137,.72);font-weight:500;
  }
  .lg{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:12.5px;color:rgba(235,224,255,.82);cursor:default;}
  .lg .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;box-shadow:0 0 9px currentColor;background:currentColor;}
  .lg .ct{margin-left:auto;font-size:10.5px;color:rgba(203,185,255,.45);font-variant-numeric:tabular-nums;}

  /* ---- node inspector ---- */
  #inspect{top:18px;right:18px;width:246px;padding:15px 18px 16px;opacity:0;transform:translateY(-6px);transition:opacity .22s,transform .22s;pointer-events:none;}
  #inspect.on{opacity:1;transform:none;}
  #inspect .kind{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(203,185,255,.55);}
  #inspect h3{font-family:"Cinzel",serif;font-size:17px;margin:5px 0 8px;color:#ffe6b0;letter-spacing:.05em;}
  #inspect p{margin:0;font-size:13px;line-height:1.55;color:rgba(232,222,255,.74);font-style:italic;}
  #inspect .rw{display:flex;justify-content:space-between;font-size:11.5px;margin-top:11px;padding-top:9px;border-top:1px solid rgba(242,208,137,.16);color:rgba(203,185,255,.6);letter-spacing:.06em;}
  #inspect .rw b{color:var(--gold);font-weight:500;}

  /* ---- run status ---- */
  #status{bottom:18px;left:18px;padding:12px 18px;display:flex;gap:22px;align-items:center;}
  .stat .k{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(203,185,255,.5);}
  .stat .v{font-family:"Cinzel",serif;font-size:17px;color:#ffe6b0;margin-top:2px;letter-spacing:.06em;}
  .stat .v.hp{color:#ff7a8c;}
  #reset{
    font-family:"Cinzel",serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    background:transparent;border:1px solid rgba(242,208,137,.34);color:var(--gold);
    padding:8px 13px;cursor:pointer;transition:.18s;
  }
  #reset:hover{background:rgba(242,208,137,.12);border-color:rgba(242,208,137,.7);}
  #reset:focus-visible{outline:2px solid var(--arcane);outline-offset:2px;}

  /* ---- hint ---- */
  #hint{bottom:20px;right:18px;font-size:11px;letter-spacing:.13em;color:rgba(203,185,255,.42);text-align:right;line-height:1.8;text-transform:uppercase;}
  #hint b{color:rgba(242,208,137,.66);font-weight:500;}

  /* ---- toast ---- */
  #toast{
    position:fixed;left:50%;top:78px;transform:translate(-50%,-14px);
    font-family:"Cinzel",serif;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
    color:#ffe6b0;padding:10px 26px;
    background:linear-gradient(180deg,rgba(24,12,52,.94),rgba(10,5,26,.9));
    border-top:1px solid rgba(242,208,137,.4);border-bottom:1px solid rgba(242,208,137,.4);
    opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
    text-shadow:0 0 16px rgba(255,181,71,.6);
  }
  #toast.on{opacity:1;transform:translate(-50%,0);}

  /* ---- loader ---- */
  #loader{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;background:var(--void);z-index:20;transition:opacity .6s;}
  #loader.gone{opacity:0;pointer-events:none;}
  #loader .rune{width:44px;height:44px;border:2px solid rgba(242,208,137,.2);border-top-color:var(--ember);border-radius:50%;animation:spin 1.1s linear infinite;}
  #loader span{font-family:"Cinzel",serif;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:rgba(203,185,255,.55);}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- drop state ---- */
  body.dropping::after{
    content:"Drop a map.json";position:fixed;inset:14px;z-index:15;pointer-events:none;
    border:1px dashed rgba(124,255,178,.6);
    font-family:"Cinzel",serif;font-size:12px;letter-spacing:.3em;text-transform:uppercase;
    color:#7CFFB2;display:grid;place-content:center;background:rgba(10,40,26,.28);
  }

  @media (max-width:860px){
    #legend{display:none}
    #inspect{width:190px;top:auto;bottom:96px;right:12px}
    #title{padding:10px 14px}
    #title h1{font-size:14px}
    #hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #loader .rune{animation:none}
  }
</style>
</head>

/* ---- fail loudly, never silently ---- */
function showFatal(msg){
  const l = document.getElementById('loader');
  l.classList.remove('gone');
  l.innerHTML = '<span style="color:#ff7a8c;letter-spacing:.2em">The ascent could not be charted</span>'
    + '<code style="max-width:560px;font:12px/1.6 ui-monospace,monospace;color:rgba(203,185,255,.7);'
    + 'text-align:center;white-space:pre-wrap;word-break:break-word">' + msg + '</code>';
}
addEventListener('error', e => showFatal(e.message + (e.lineno ? '  (line ' + e.lineno + ')' : '')));
if(!window.THREE){
  showFatal('three.js did not load. Check the network connection or the CDN script tag.');
  throw new Error('three.js missing');
}

/* ---- shared glow sprite texture ---- */
const glowTex = (()=>{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d').createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.22,'rgba(255,255,255,.62)');
  g.addColorStop(0.55,'rgba(255,255,255,.16)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
})();
function glowAt(color, size, opacity, x, y, z){
  const s = glow(color, size, opacity);
  s.position.set(x||0, y||0, z||0);
  return s;
}
function glow(color, size, opacity){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map:glowTex, color, transparent:true, opacity:opacity===undefined?0.85:opacity,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
  s.scale.set(size,size,1);
  return s;
}

/* ------------------------------------------------------------
   ENVIRONMENT — void, stars, nebula, crystal spires
   ------------------------------------------------------------ */
function buildSky(){
  // starfield
  const N = 2600, pos = new Float32Array(N*3), col = new Float32Array(N*3);
  const tint = [new THREE.Color(0xffffff), new THREE.Color(0x9fd6ff), new THREE.Color(0xc9a4ff), new THREE.Color(0xffd9a0)];
  for(let i=0;i<N;i++){
    const r = 700 + Math.random()*900;
    const th = Math.random()*Math.PI*2, ph = Math.acos(Math.random()*2-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph)*0.6 + 120;
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
    const c = tint[(Math.random()*tint.length)|0];
    const b = 0.35 + Math.random()*0.65;
    col[i*3]=c.r*b; col[i*3+1]=c.g*b; col[i*3+2]=c.b*b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({
    size:2.6, vertexColors:true, transparent:true, opacity:.9,
    blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
  }));
  stars.renderOrder = -2;
  scene.add(stars);

  // nebula clouds
  const clouds = [
    [0xff2244, 0, 300, -420, 620, .30],
    [0x6a2bd0, -420, 140, -260, 700, .22],
    [0x2a6fd0, 430, 120, -180, 660, .18],
    [0x4a1f9e, 0, -180, 120, 900, .14]
  ];
  clouds.forEach(([c,x,y,z,s,o])=>{ const q = glow(c, s, o); q.position.set(x,y,z); q.renderOrder=-1; scene.add(q); });
}

function buildCrystals(){
  const grp = new THREE.Group();
  const geo = new THREE.ConeGeometry(1, 1, 5);
  for(let i=0;i<70;i++){
    const ang = Math.random()*Math.PI*2;
    const rad = 210 + Math.random()*300;
    const purple = Math.random() > .45;
    const mat = new THREE.MeshStandardMaterial({
      color: purple?0x7a3ff0:0x2a7fe0, emissive: purple?0x5a1fd0:0x1a5fc0,
      emissiveIntensity:.75, roughness:.25, metalness:.4, flatShading:true,
      transparent:true, opacity:.86
    });
    const h = 40 + Math.random()*130;
    const m = new THREE.Mesh(geo, mat);
    m.scale.set(6+Math.random()*13, h, 6+Math.random()*13);
    m.position.set(Math.cos(ang)*rad, -110 + Math.random()*150, Math.sin(ang)*rad - 20);
    m.rotation.set((Math.random()-.5)*.5, Math.random()*3, (Math.random()-.5)*.5);
    grp.add(m);
    if(Math.random()>.55){
      const q = glow(purple?0x8a4fff:0x2ea0ff, 46, .35);
      q.position.copy(m.position); q.position.y += h*.35; grp.add(q);
    }
  }
  scene.add(grp);
}

/* ------------------------------------------------------------
   ISLANDS — a chiseled rock pillar with a paved platform on top
   ------------------------------------------------------------ */
function buildIsland(radius, warm){
  // a bound platform model is fitted to the chamber's own footprint
  if(Assets.ready('island')) return Assets.make('island', radius*2);

  const grp = new THREE.Group();

  // top platform: tiered discs
  const top = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius*0.98, 3.4, 18), warm?M.pavingWarm:M.paving);
  top.position.y = 0; grp.add(top);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(radius*0.99, 1.15, 6, 24), M.rock);
  rim.rotation.x = Math.PI/2; rim.position.y = 1.5; grp.add(rim);

  const inner = new THREE.Mesh(new THREE.CylinderGeometry(radius*0.7, radius*0.72, 0.7, 18), warm?M.pavingWarm:M.paving);
  inner.position.y = 1.9; inner.material = inner.material.clone();
  inner.material.color.multiplyScalar(1.12); grp.add(inner);

  const lip = new THREE.Mesh(new THREE.CylinderGeometry(radius*1.06, radius*0.9, 3.0, 16), M.rock);
  lip.position.y = -3.0; grp.add(lip);

  // pillar body: stacked, jittered rock drums narrowing downward
  let r = radius*0.94, y = -5.5;
  for(let i=0;i<6;i++){
    const h = 9 + Math.random()*12;
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(r, r*(0.78+Math.random()*0.12), h, 9), i<2?M.rock:M.rockDark);
    drum.position.set((Math.random()-.5)*r*0.16, y - h/2, (Math.random()-.5)*r*0.16);
    drum.rotation.y = Math.random()*Math.PI;
    grp.add(drum);
    y -= h*0.94; r *= 0.80 + Math.random()*0.07;
    if(r < radius*0.16) break;
  }
  // final spike
  const tip = new THREE.Mesh(new THREE.ConeGeometry(r*1.1, 24+Math.random()*20, 7), M.rockDark);
  tip.position.set(0, y-12, 0); tip.rotation.y = Math.random()*3; tip.scale.y = -1;
  tip.position.y = y - 12; grp.add(tip);

  // clinging shards
  for(let i=0;i<5;i++){
    const s = new THREE.Mesh(new THREE.ConeGeometry(2+Math.random()*3, 10+Math.random()*16, 5), M.rockDark);
    const a = Math.random()*Math.PI*2, d = radius*(0.55+Math.random()*0.5);
    s.position.set(Math.cos(a)*d, -8-Math.random()*30, Math.sin(a)*d);
    s.rotation.set((Math.random()-.5)*1.6, Math.random()*3, (Math.random()-.5)*1.6);
    grp.add(s);
  }
  return grp;
}

  boss(){

};

/* ------------------------------------------------------------
   BRIDGES
   ------------------------------------------------------------ */
function bridgeCurve(a, b, flat){
  const A = a.clone(), B = b.clone();
  const mid = A.clone().add(B).multiplyScalar(.5);
  const span = A.distanceTo(B);
  mid.y -= flat ? -span*0.012 : (span * 0.055 + 2);   // sag, or a slight rise for stairs
  const q1 = A.clone().lerp(mid,.55); q1.y -= span*0.012;
  const q2 = B.clone().lerp(mid,.55); q2.y -= span*0.012;
  return new THREE.CatmullRomCurve3([A,q1,mid,q2,B]);
}
function offsetCurve(curve, side){
  const up = new THREE.Vector3(0,1,0), pts = [];
  for(let i=0;i<=24;i++){
    const t = i/24, p = curve.getPoint(t), tan = curve.getTangent(t);
    const off = new THREE.Vector3().crossVectors(tan, up).normalize().multiplyScalar(side);
    pts.push(p.add(off).add(new THREE.Vector3(0, 2.6, 0)));
  }
  return new THREE.CatmullRomCurve3(pts);
}
function ropeBridge(curve){
  const g = new THREE.Group();
  const modelled = Assets.ready('bridge_plank');

  /* Spacing comes from the model's own depth, so a chunky plank tiles further
     apart than a thin one without you tuning a number by hand. */
  const stepLen = modelled
    ? Math.max(1.5, Assets.proto('bridge_plank').userData.size.z * 1.02)
    : 4.4;
  const steps = Math.max(8, Math.round(curve.getLength()/stepLen));
  const plank = modelled ? null : new THREE.BoxGeometry(7.4, 0.7, 3.0);

  for(let i=0;i<steps;i++){
    const p0 = curve.getPoint(i/steps), p1 = curve.getPoint((i+1)/steps);
    const m = modelled ? Assets.make('bridge_plank')
                       : new THREE.Mesh(plank, i%3===0 ? M.woodDark : M.wood);
    m.position.copy(p0).lerp(p1,.5);
    m.lookAt(p1);
    if(!modelled) m.rotation.z += (Math.random()-.5)*0.09;
    g.add(m);
  }

  // the hand-built rope rails step aside once a plank model supplies the detail
  if(!modelled){
    [-3.5,3.5].forEach(side=>{
      g.add(new THREE.Mesh(new THREE.TubeGeometry(offsetCurve(curve,side), 26, 0.34, 5, false), M.rope));
      const low = new THREE.Mesh(new THREE.TubeGeometry(offsetCurve(curve,side), 26, 0.22, 5, false), M.rope);
      low.position.y = -2.2; g.add(low);
    });
  }

  [0,1].forEach(t=>{
    const p = curve.getPoint(t), tan = curve.getTangent(t);
    [-4,4].forEach(side=>{
      const off = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0,1,0)).normalize().multiplyScalar(side);
      if(Assets.ready('bridge_post')){
        const post = Assets.make('bridge_post');
        post.position.copy(p).add(off); post.position.y += 1.4;
        post.lookAt(post.position.x + tan.x, post.position.y, post.position.z + tan.z);
        g.add(post);
      }else{
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.9,8,6), M.woodDark);
        post.position.copy(p).add(off); post.position.y += 2.6; g.add(post);
        const cap = new THREE.Mesh(new THREE.SphereGeometry(1.0, 8, 6), M.gold);
        cap.position.copy(post.position); cap.position.y += 4.2; g.add(cap);
      }
    });
  });
  return g;
}

function stairBridge(curve){
  const g = new THREE.Group();
  const modelled = Assets.ready('stair_step');
  const stepLen = modelled
    ? Math.max(1.2, Assets.proto('stair_step').userData.size.z * 1.02)
    : 3.2;
  const steps = Math.max(8, Math.round(curve.getLength()/stepLen));

  for(let i=0;i<steps;i++){
    const t0 = i/steps;
    const p0 = curve.getPoint(t0), p1 = curve.getPoint((i+1)/steps);
    let m;
    if(modelled) m = Assets.make('stair_step');
    else {
      const w = 15 - Math.sin(t0*Math.PI)*3.5;
      m = new THREE.Mesh(new THREE.BoxGeometry(w, 2.6, 4.2), i%2 ? M.paving : M.rock);
    }
    m.position.copy(p0).lerp(p1,.5); m.lookAt(p1);
    g.add(m);
  }
  if(!modelled){
    [-1,1].forEach(side=>{
      const rail = new THREE.Mesh(new THREE.TubeGeometry(offsetCurve(curve, side*7.6), 30, 0.8, 5, false), M.rock);
      rail.position.y = -1.4; g.add(rail);
    });
  }
  return g;
}

function arcaneBridge(curve){
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.TubeGeometry(curve, 44, 0.55, 8, false), emissive(0xc79bff, 2.6));
  const halo = new THREE.Mesh(new THREE.TubeGeometry(curve, 44, 2.4, 8, false),
    new THREE.MeshBasicMaterial({color:0x8a3fff, transparent:true, opacity:.24, blending:THREE.AdditiveBlending, depthWrite:false}));
  g.add(core, halo);
  // travelling motes
  const motes = [];
  for(let i=0;i<7;i++){
    const q = glow(0xd0a8ff, 7, .9);
    q.userData.t = Math.random(); g.add(q); motes.push(q);
  }
  g.userData.motes = motes; g.userData.curve = curve;
  ANIM.arcane.push(g);
  return g;
}


/* ------------------------------------------------------------
   WORLD ASSEMBLY
   ------------------------------------------------------------ */
const ANIM = { arcane:[], flames:[], bobs:[], spins:[], rings:[], gibs:[] };
const NODES = {};      // id -> { def, type, group, pos, ring, halo, state }
const EDGES = [];      // { a, b, curve, group, trail }
let TIER_H = 15;       // vertical rise per tier (overridden by map.json)
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function labelPlane(text, w, color){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const x = c.getContext('2d');
  x.clearRect(0,0,1024,256);
  x.font = '700 150px Cinzel, Georgia, serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = color; x.shadowBlur = 40;
  x.fillStyle = color; x.letterSpacing = '28px';
  x.fillText(text, 512, 138);
  x.fillText(text, 512, 138);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w/4),
    new THREE.MeshBasicMaterial({map:t, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
  m.rotation.x = -Math.PI/2;
  return m;
}

function buildWorld(){
  MAP_DATA.nodes.forEach(def=>{
    const T = TYPES[def.type];
    const g = new THREE.Group();
    g.position.set(def.x, def.tier * TIER_H, def.z);

    const warm = def.type==='start' || def.type==='camp' || def.type==='shop' || def.type==='treasure';
    const isle = buildIsland(T.r, warm);
    g.add(isle);

    const iconSlot = 'icon_' + def.type;
    const icon = Assets.ready(iconSlot) ? Assets.make(iconSlot) : ICONS[def.type]();
    icon.position.y = 2.4;
    g.add(icon);
    if(icon.userData.flame) ANIM.flames.push(...[].concat(icon.userData.flame));
    if(icon.userData.bob)   ANIM.bobs.push(icon.userData.bob);
    if(icon.userData.spin)  ANIM.spins.push(icon.userData.spin);

    // dressing
    if(def.type==='battle'){
      for(let i=0;i<2;i++){
        const b = banner();
        b.position.set(Math.cos(i?0.9:2.24)*T.r*0.82, 2, Math.sin(i?0.9:2.24)*T.r*0.82);
        b.rotation.y = -(i?0.9:2.24); g.add(b);
      }
      for(let i=0;i<2;i++){
        const t = torch(0xff5a30);
        t.position.set(Math.cos(i?4.0:5.4)*T.r*0.82, 2, Math.sin(i?4.0:5.4)*T.r*0.82);
        g.add(t); if(t.userData.flame) ANIM.flames.push(t.userData.flame);
      }
    }
    if(def.type==='start' || def.type==='shop' || def.type==='boss'){
      const n = def.type==='boss' ? 6 : 4;
      for(let i=0;i<n;i++){
        const a = i/n*Math.PI*2 + .4;
        const t = torch(def.type==='boss'?0xff2233:0xffa030);
        t.position.set(Math.cos(a)*T.r*0.84, 2, Math.sin(a)*T.r*0.84);
        g.add(t); if(t.userData.flame) ANIM.flames.push(t.userData.flame);
      }
    }
    if(def.type==='start'){
      const lbl = labelPlane('START', 42, '#ffca6a');
      lbl.position.set(0, 2.5, T.r*0.52); g.add(lbl);
    }

    // state ring on the platform lip
    const ring = new THREE.Mesh(new THREE.TorusGeometry(T.r*1.1, 0.9, 6, 40),
      new THREE.MeshBasicMaterial({color:T.ring, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false}));
    ring.rotation.x = Math.PI/2; ring.position.y = 3.2; g.add(ring);

    const halo = glow(T.color, T.r*3.2, 0);
    halo.position.y = 6; g.add(halo);

    // invisible click target
    const hh = def.type==='boss' ? 86 : 34;
    const hit = new THREE.Mesh(new THREE.CylinderGeometry(T.r*1.15, T.r*1.15, hh, 12),
      new THREE.MeshBasicMaterial({visible:false}));
    hit.position.y = hh/2 - 4; hit.userData.nodeId = def.id; g.add(hit);

    scene.add(g);
    NODES[def.id] = { def, T, group:g, ring, halo, hit, isle, icon,
                      slot:'icon_'+def.type,
                      pos:new THREE.Vector3(def.x, def.tier*TIER_H, def.z), state:'locked' };
    ANIM.rings.push(NODES[def.id]);
  });

  // bridges
  MAP_DATA.edges.forEach(([a,b,style])=>{
    const A = NODES[a], B = NODES[b];
    const dir = B.pos.clone().sub(A.pos).setY(0).normalize();
    const p0 = A.pos.clone().add(dir.clone().multiplyScalar(A.T.r*0.96)); p0.y += 2;
    const p1 = B.pos.clone().sub(dir.clone().multiplyScalar(B.T.r*0.96)); p1.y += 2;
    const curve = bridgeCurve(p0, p1, style==='stair');
    const grp = style==='arcane' ? arcaneBridge(curve)
              : style==='stair'  ? stairBridge(curve)
              : ropeBridge(curve);
    scene.add(grp);

    // hidden "walked" trail, revealed once the span is crossed
    const trail = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.9, 6, false),
      new THREE.MeshBasicMaterial({color:0xffc86a, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false}));
    trail.position.y = 3.2; scene.add(trail);

    EDGES.push({a, b, curve, group:grp, trail, style});
  });

  const bn = Object.values(NODES).find(n=>n.def.type==='boss');
  const sn = Object.values(NODES).find(n=>n.def.type==='start');
  if(bn) bossLight.position.set(bn.pos.x, bn.pos.y+40, bn.pos.z+10);
  if(sn) startLight.position.set(sn.pos.x, sn.pos.y+18, sn.pos.z);
}

function startId(){
  const n = MAP_DATA.nodes.find(n=>n.type==='start') || MAP_DATA.nodes[0];
  return n && n.id;
}

/* tear the map down so a new one can be built in its place */
function clearWorld(){
  Object.values(NODES).forEach(n=> scene.remove(n.group));
  EDGES.forEach(e=>{ scene.remove(e.group); scene.remove(e.trail); });
  ANIM.gibs.forEach(g=> scene.remove(g.m));
  ['arcane','flames','bobs','spins','rings','gibs'].forEach(k=> ANIM[k].length = 0);
  Object.keys(NODES).forEach(k=> delete NODES[k]);
  EDGES.length = 0;
}

/* Rebind a model and the world rebuilds around it. The run survives the swap:
   where you are, what you cleared, vigor and gold all carry over. */
let rebuildPending = false;
function scheduleRebuild(){
  if(rebuildPending) return;        // loading six slots should rebuild once, not six times
  rebuildPending = true;
  setTimeout(()=>{ rebuildPending = false; rebuildWorld(); }, 0);
}
function rebuildWorld(){
  const at = RUN.at, cleared = new Set(RUN.cleared);
  clearWorld();
  buildWorld();
  RUN.at = NODES[at] ? at : startId();
  RUN.cleared = cleared;
  Train.lastCurve = null; Train.lastDir = 1;
  EDGES.forEach(e=>{ if(cleared.has(e.a) && cleared.has(e.b)) e.trail.material.opacity = 0.55; });
  snapPlayer();
  refresh();
}

/* read a map.json written by the editor */
function loadManifest(j){
  if(!j || !j.nodes || !j.nodes.length) throw new Error('no nodes in map');
  MAP_DATA.meta  = j.meta || MAP_DATA.meta;
  MAP_DATA.nodes = j.nodes.map(n => Array.isArray(n)
    ? {id:n[0], type:n[1], x:n[2], z:n[3], tier:n[4]} : n);
  MAP_DATA.edges = (j.edges||[]).map(e => Array.isArray(e)
    ? e : [e.from, e.to, e.style || 'rope']);
  if(j.tierHeight) TIER_H = j.tierHeight;

  Object.entries(j.models || {}).forEach(([k,v])=>{
    if(!MODELS[k] || !v) return;
    if(v.fit !== undefined) MODELS[k].fit = v.fit;
    if(v.y   !== undefined) MODELS[k].y   = v.y;
    if(v.ry  !== undefined) MODELS[k].ry  = v.ry;
    if(v.file){ MODELS[k].url = v.file; MODELS[k].file = v.file; }
  });

  clearWorld();
  buildWorld();
  Train.lastCurve = null; Train.lastDir = 1;
  RUN.at = startId(); RUN.cleared = new Set([RUN.at]);
  RUN.hp = 80; RUN.gold = 120; RUN.moving = false; RUN.selected = null;
  snapPlayer(); renderLegend(); refresh();

  document.querySelector('#title h1').textContent = MAP_DATA.meta.name || 'Untitled Ascent';
  const tiers = Math.max(...MAP_DATA.nodes.map(n=>n.tier)) + 1;
  document.querySelector('#title .sub').textContent =
    'Run 001 · ' + tiers + ' Tiers · Seed ' + (MAP_DATA.meta.seed || '—');

  Object.keys(MODELS).filter(k=>MODELS[k].url).forEach(k=>Assets.apply(k, true));
}

/* ------------------------------------------------------------
   ASSET PIPELINE — GLB models with procedural stand-ins
   ------------------------------------------------------------
   Every visual slot below can be backed by a .glb. Until one is
   bound, the primitive version renders in its place, so the map
   is always playable while art is still being made.

   fit = target size in world units. Models are auto-scaled to it
   and seated on the platform, so export scale doesn't matter.
   ------------------------------------------------------------ */
const MODELS = {
  island:        { url:null, fit:0,  y:0,   ry:0, label:"Platform",   axis:"xz" },
  bridge_plank:  { url:null, fit:8,  y:0,   ry:0, label:"Bridge plank" },
  bridge_post:   { url:null, fit:9,  y:0,   ry:0, label:"Bridge post"  },
  stair_step:    { url:null, fit:15, y:0,   ry:0, label:"Stair step"   },
  torch:         { url:null, fit:10, y:0,   ry:0, label:"Torch"        },
  banner:        { url:null, fit:15, y:0,   ry:0, label:"Banner"       },
  icon_start:    { url:null, fit:18, y:2.4, ry:0, label:"Bonfire"   },
  icon_camp:     { url:null, fit:16, y:2.4, ry:0, label:"Camp"      },
  icon_battle:   { url:null, fit:20, y:2.4, ry:0, label:"Skirmish"  },
  icon_shop:     { url:null, fit:18, y:2.4, ry:0, label:"Market"    },
  icon_mystery:  { url:null, fit:20, y:2.4, ry:0, label:"Mystery"   },
  icon_treasure: { url:null, fit:16, y:2.4, ry:0, label:"Vault"     },
  icon_elite:    { url:null, fit:32, y:2.4, ry:0, label:"Bone gate" },
  icon_boss:     { url:null, fit:62, y:2.4, ry:0, label:"Castle (boss)" },
  gib:           { url:null, fit:6,  y:0,   ry:0, label:"Gib set"   },
  // ⚠ url null by default — a bare "train.glb" resolves against THIS page's
  // directory and 404s in an embed. The procedural stand-in is the default;
  // a host/map.json may still supply a real path.
  train:         { url:null, fit:24, y:0, ry:180, label:"Train", cars:"auto", lift:0.34 }
};

const Assets = {
  loader: window.THREE && THREE.GLTFLoader ? new THREE.GLTFLoader() : null,
  cache: new Map(),          // url  -> raw gltf scene
  src: {},                   // slot -> raw gltf scene
  protoCache: new Map(),     // slot|fit -> measured, scaled, seated prototype

  available(){ return !!this.loader; },

  // is a real model bound to this slot yet?
  ready(slot){ return !!this.src[slot]; },

  /* Measuring a model is the expensive part, cloning is cheap. Prototypes are
     built once per slot+size and every use after that is a clone of it, which
     is what makes a 400-plank bridge affordable. */
  proto(slot, fit){
    const key = slot + '|' + (fit || MODELS[slot].fit);
    if(!this.protoCache.has(key))
      this.protoCache.set(key, this.instance(this.src[slot], MODELS[slot], fit));
    return this.protoCache.get(key);
  },
  make(slot, fit){ return this.proto(slot, fit).clone(true); },
  forget(slot){
    [...this.protoCache.keys()].forEach(k=>{ if(k.indexOf(slot + '|') === 0) this.protoCache.delete(k); });
  },

  load(url){
    if(this.cache.has(url)) return Promise.resolve(this.cache.get(url));
    if(!this.loader) return Promise.reject(new Error('GLTFLoader unavailable'));
    return new Promise((res, rej)=>{
      this.loader.load(url, g=>{ this.cache.set(url, g.scene); res(g.scene); }, undefined, rej);
    });
  },

  // clone, auto-scale to `fit`, centre on XZ, seat base at y=0
  instance(src, cfg, fitOverride){
    const o = src.clone(true);
    o.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(o);
    const size = box.getSize(new THREE.Vector3());
    const ctr  = box.getCenter(new THREE.Vector3());
    const target = fitOverride || cfg.fit;
    let k = 1;
    if(target > 0){
      const ref = cfg.axis === 'xz' ? Math.max(size.x, size.z) : Math.max(size.x, size.y, size.z);
      if(ref > 0.0001) k = target / ref;
    }
    const wrap = new THREE.Group();
    o.scale.setScalar(k);
    o.position.set(-ctr.x*k, -box.min.y*k, -ctr.z*k);
    wrap.add(o);
    wrap.rotation.y = (cfg.ry||0) * Math.PI/180;
    wrap.position.y = cfg.y || 0;
    wrap.userData.isModel = true;
    wrap.userData.size = size.clone().multiplyScalar(k);   // dimensions after fitting
    if(cfg.lift) liftEmissive(wrap, cfg.lift);
    return wrap;
  },

  // swap a slot across every node that uses it
  apply(slot, quiet){
    const cfg = MODELS[slot];
    if(!cfg || !cfg.url) return Promise.resolve(false);
    return this.load(cfg.url).then(src=>{
      this.src[slot] = src;
      this.forget(slot);
      if(slot === 'train') Train.build(this.make('train'));
      else scheduleRebuild();       // islands, bridges, stairs, props, icons
      return true;
    }).catch(err=>{
      if(!quiet) toast('Could not read that model');
      cfg.url = null; cfg.file = null;
      console.warn('[assets] ' + slot + ':', err.message || err);
      return false;
    });
  },

  // bind a local file with no server involved
  bindFile(slot, file){
    const url = URL.createObjectURL(file);
    MODELS[slot].url = url;
    MODELS[slot].file = file.name;
    return this.apply(slot).then(ok=>{
      if(ok) toast(file.name + ' → ' + MODELS[slot].label);
      else { MODELS[slot].url = null; MODELS[slot].file = null; }
    });
  }
};

/* ---- dropping files onto the map ----
   Model paths are authored in the editor and travel inside map.json.
   Dropping a .glb here is only a preview shortcut: it binds for this
   session, which helps before the files are being served. */
function slotFromName(name){
  const stem = name.replace(/\.(glb|gltf)$/i,'').toLowerCase();
  if(MODELS['icon_'+stem]) return 'icon_'+stem;
  if(MODELS[stem]) return stem;
  return null;
}
function ingest(files){
  const map = [...files].find(f=>/\.json$/i.test(f.name));
  if(map){
    const fr = new FileReader();
    fr.onload = ()=>{
      try{ loadManifest(JSON.parse(fr.result)); frameMap(); toast('Loaded ' + map.name); }
      catch(err){ toast('That map could not be read'); console.error(err); }
    };
    fr.readAsText(map);
    return;
  }
  if(!Assets.available()){ toast('GLTFLoader did not load'); return; }
  const list = [...files].filter(f=>/\.(glb|gltf)$/i.test(f.name));
  if(!list.length){ toast('Drop a map.json, or a .glb to preview it'); return; }
  list.forEach(f=>{
    const slot = slotFromName(f.name) || (RUN.selected && NODES[RUN.selected].slot);
    if(!slot){ toast('Name it after a slot, e.g. boss.glb'); return; }
    Assets.bindFile(slot, f);
  });
}
['dragenter','dragover'].forEach(t=> addEventListener(t, e=>{ e.preventDefault(); document.body.classList.add('dropping'); }));
['dragleave','drop'].forEach(t=> addEventListener(t, e=>{
  e.preventDefault();
  if(t==='dragleave' && e.relatedTarget) return;
  document.body.classList.remove('dropping');
  if(t==='drop') ingest(e.dataTransfer.files);
}));

/* ------------------------------------------------------------
   GIBS — break a model into its parts and throw them
   ------------------------------------------------------------ */
function meshesOf(obj){
  const out = []; obj.traverse(c=>{ if(c.isMesh) out.push(c); }); return out;
}
function spawnGibs(node, count){
  const cached = Assets.ready('gib') ? Assets.src.gib : null;
  const src = cached ? Assets.instance(cached, MODELS.gib) : node.icon;
  if(!src) return;
  src.updateMatrixWorld(true);
  const parts = meshesOf(src);
  if(!parts.length) return;
  const origin = node.pos.clone(); origin.y += 10;
  const n = Math.min(count || 12, 16);
  for(let i=0;i<n;i++){
    const from = parts[i % parts.length];
    const m = new THREE.Mesh(from.geometry, from.material.clone());
    m.material.transparent = true;
    const k = 0.28 + Math.random()*0.3;
    m.scale.copy(from.getWorldScale(new THREE.Vector3())).multiplyScalar(k);
    m.position.copy(origin).add(new THREE.Vector3((Math.random()-.5)*8, Math.random()*6, (Math.random()-.5)*8));
    scene.add(m);
    ANIM.gibs.push({
      m,
      vel: new THREE.Vector3((Math.random()-.5)*46, 26+Math.random()*30, (Math.random()-.5)*46),
      spin: new THREE.Vector3((Math.random()-.5)*9, (Math.random()-.5)*9, (Math.random()-.5)*9),
      floor: node.pos.y + 3,
      life: 2.4 + Math.random()*0.9
    });
  }
}
function stepGibs(dt){
  for(let i=ANIM.gibs.length-1;i>=0;i--){
    const g = ANIM.gibs[i];
    g.vel.y -= 92*dt;
    g.m.position.addScaledVector(g.vel, dt);
    g.m.rotation.x += g.spin.x*dt; g.m.rotation.y += g.spin.y*dt; g.m.rotation.z += g.spin.z*dt;
    if(g.m.position.y < g.floor && g.vel.y < 0){
      g.m.position.y = g.floor;
      g.vel.y *= -0.34; g.vel.x *= 0.62; g.vel.z *= 0.62; g.spin.multiplyScalar(0.5);
    }
    g.life -= dt;
    if(g.life < 0.7) g.m.material.opacity = Math.max(0, g.life/0.7);
    if(g.life <= 0){ scene.remove(g.m); g.m.material.dispose(); ANIM.gibs.splice(i,1); }
  }
}

/* ------------------------------------------------------------
   THE TRAIN — the piece that runs the line between stations
   ------------------------------------------------------------
   Motion is arc-length based, so speed stays constant whatever
   the span length, and every carriage rides the same rail a
   fixed distance behind the one in front.
   ------------------------------------------------------------ */

// pull away slowly, cruise, then brake into the platform
function trainEase(k){
  const a = 0.20, b = 0.34, tot = a/2 + (1-a-b) + b/2;
  let s;
  if(k < a)          s = k*k/(2*a);
  else if(k <= 1-b)  s = a/2 + (k-a);
  else { const u = 1-k; s = a/2 + (1-a-b) + b/2 - u*u/(2*b); }
  return s/tot;
}

const Train = {
  group: new THREE.Group(),
  cars: [], smoke: [],
  len: 24, spacing: 26, lift: 2.6, speed: 42,   // speed = world units per second
  moving: false, lastCurve: null, lastDir: 1, puffAt: 0,
  lamp: null,

  // if the model runs backwards, turn it end for end
  flip(){
    this.cars.forEach(c=>{ if(c.children[0]) c.children[0].rotation.y += Math.PI; });
    MODELS.train.ry = (MODELS.train.ry + 180) % 360;
    toast('Train turned around');
  },

  build(proto){
    proto.updateMatrixWorld(true);
    const box  = new THREE.Box3().setFromObject(proto);
    const size = box.getSize(new THREE.Vector3());

    // point the long axis down the track: lookAt aligns +Z with travel
    const yaw  = size.x > size.z ? -Math.PI/2 : 0;
    const long = Math.max(size.x, size.z), wide = Math.max(0.001, Math.min(size.x, size.z));

    // a model already 3x longer than it is wide is a whole train, not a locomotive
    const want = MODELS.train.cars;
    const extra = want === 'auto' ? (long/wide > 3 ? 0 : 2) : Math.max(0, want|0);

    this.len = long;
    this.spacing = long * 1.08;

    this.cars.forEach(c=> this.group.remove(c));
    this.cars = [];
    for(let i=0;i<=extra;i++){
      const car = new THREE.Group();
      const inner = i === 0 ? proto : proto.clone(true);
      inner.rotation.y += yaw;
      car.add(inner);
      this.group.add(car);
      this.cars.push(car);
    }
    this.attachLamp();
    this.parkAt(NODES[RUN.at] || Object.values(NODES)[0]);
    return this;
  },

  attachLamp(){
    if(!this.cars.length) return;
    const head = this.cars[0];
    const light = new THREE.PointLight(0xffd9a0, 2.2, 110, 2);
    light.position.set(0, this.len*0.16, this.len*0.42);
    head.add(light);
    const beam = glow(0xffe0a8, this.len*0.9, .7);
    beam.position.copy(light.position);
    head.add(beam);
    this.lamp = light;
  },

  // place every car along the rail, head at arc-length u, dir = travel sense
  setPose(curve, u, dir){
    if(!this.cars.length) return;
    const L = Math.max(1, curve.getLength());
    const t = performance.now()*0.001;
    this.cars.forEach((car, i)=>{
      const back = (i * this.spacing) / L;
      const cu = Math.max(0, Math.min(1, u - dir*back));
      const p = curve.getPointAt(cu);
      car.position.set(p.x, p.y + this.lift, p.z);

      const au = Math.max(0, Math.min(1, cu + dir*0.02));
      if(Math.abs(au - cu) > 1e-5){
        const look = curve.getPointAt(au);
        car.lookAt(look.x, look.y + this.lift, look.z);
      }
      // rail sway, strongest on the locomotive
      if(this.moving){
        car.rotation.z += Math.sin(t*6.5 + i*1.3) * 0.018;
        car.position.y += Math.sin(t*11 + i*2.1) * 0.14;
      }
    });
  },

  parkAt(node){
    if(!node || !this.cars.length) return;
    if(this.lastCurve){
      this.setPose(this.lastCurve, this.lastDir > 0 ? 1 : 0, this.lastDir);
      return;
    }
    // no history yet: sit on the bonfire facing up the map
    const p = node.pos;
    const line = new THREE.CatmullRomCurve3([
      new THREE.Vector3(p.x, p.y, p.z + this.spacing*3),
      new THREE.Vector3(p.x, p.y, p.z),
      new THREE.Vector3(p.x, p.y, p.z - this.spacing)
    ]);
    this.setPose(line, 0.75, 1);
  },

  // chimney smoke, emitted only under power
  puff(){
    if(!this.cars.length) return;
    const s = glow(0xd6dcea, this.len*0.34, .42);
    const head = this.cars[0];
    s.position.copy(head.position);
    s.position.y += this.len*0.22;
    s.position.x += (Math.random()-.5)*this.len*0.1;
    scene.add(s);
    this.smoke.push({s, life:1.7, vy:10+Math.random()*8, dx:(Math.random()-.5)*7, dz:(Math.random()-.5)*7});
  },
  step(dt){
    if(this.moving && (this.puffAt -= dt) <= 0){ this.puff(); this.puffAt = 0.085; }
    for(let i=this.smoke.length-1;i>=0;i--){
      const q = this.smoke[i];
      q.life -= dt;
      q.s.position.y += q.vy*dt;
      q.s.position.x += q.dx*dt;
      q.s.position.z += q.dz*dt;
      const k = Math.max(0, q.life/1.7);
      q.s.material.opacity = k*0.42;
      q.s.scale.setScalar(this.len*0.34*(1 + (1-k)*1.6));
      if(q.life <= 0){ scene.remove(q.s); this.smoke.splice(i,1); }
    }
  }
};
scene.add(Train.group);

/* a near-black model vanishes against a dark scene: let its own texture glow */
function liftEmissive(obj, amt){
  if(!amt) return;
  obj.traverse(c=>{
    if(!c.isMesh || !c.material || c.material.userData.lifted) return;
    c.material = c.material.clone();
    c.material.userData.lifted = true;
    if(c.material.map){
      c.material.emissiveMap = c.material.map;
      c.material.emissive = new THREE.Color(amt, amt, amt);
    }else if(c.material.color){
      c.material.emissive = c.material.color.clone().multiplyScalar(amt);
    }
    c.material.emissiveIntensity = 1;
  });
}

/* ---- stand-in rolling stock, used until a GLB is bound ---- */
function buildStandInTrain(){
  const L = 24, unit = L/3;
  const g = new THREE.Group();

  const loco = new THREE.Group();
  const deck = new THREE.Mesh(new THREE.BoxGeometry(unit*0.9, unit*0.22, L*0.62), M.steel);
  deck.position.y = unit*0.42; loco.add(deck);
  const boiler = new THREE.Mesh(new THREE.CylinderGeometry(unit*0.36, unit*0.36, L*0.42, 12), M.keep);
  boiler.rotation.x = Math.PI/2; boiler.position.set(0, unit*0.72, L*0.10); loco.add(boiler);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(unit*0.82, unit*0.62, L*0.20), M.woodDark);
  cab.position.set(0, unit*0.85, -L*0.20); loco.add(cab);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(unit*0.95, unit*0.1, L*0.24), M.gold);
  roof.position.set(0, unit*1.18, -L*0.20); loco.add(roof);
  const stack = new THREE.Mesh(new THREE.CylinderGeometry(unit*0.15, unit*0.2, unit*0.5, 8), M.rockDark);
  stack.position.set(0, unit*1.12, L*0.26); loco.add(stack);
  for(let i=0;i<3;i++){
    [-1,1].forEach(sx=>{
      const w = new THREE.Mesh(new THREE.CylinderGeometry(unit*0.2, unit*0.2, unit*0.09, 10), M.rockDark);
      w.rotation.z = Math.PI/2;
      w.position.set(sx*unit*0.44, unit*0.2, -L*0.18 + i*L*0.19);
      loco.add(w);
    });
  }
  g.add(loco);

  for(let c=1;c<=2;c++){
    const car = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(unit*0.84, unit*0.6, L*0.30), M.wood);
    body.position.y = unit*0.62; car.add(body);
    const top = new THREE.Mesh(new THREE.BoxGeometry(unit*0.92, unit*0.09, L*0.33), M.gold);
    top.position.y = unit*0.96; car.add(top);
    for(let i=0;i<3;i++){
      const win = new THREE.Mesh(new THREE.BoxGeometry(unit*0.86, unit*0.2, L*0.055), emissive(0xffd27a, 1.6));
      win.position.set(0, unit*0.68, -L*0.09 + i*L*0.09); car.add(win);
    }
    [-1,1].forEach(sx=> [0,1].forEach(i=>{
      const w = new THREE.Mesh(new THREE.CylinderGeometry(unit*0.16, unit*0.16, unit*0.08, 10), M.rockDark);
      w.rotation.z = Math.PI/2;
      w.position.set(sx*unit*0.42, unit*0.16, -L*0.10 + i*L*0.20);
      car.add(w);
    }));
    car.position.z = -c*L*0.36;
    g.add(car);
  }
  return g;
}

/* ------------------------------------------------------------
   RUN STATE
   ------------------------------------------------------------ */
const RUN = { at:'start', cleared:new Set(['start']), hp:80, maxHp:100, gold:120, moving:false, selected:null };

/* ------------------------------------------------------------
   🔌 HOST BRIDGE  (added for the Mythic Spellbook embed)
   ------------------------------------------------------------
   Standalone, this page runs its own placeholder economy (REWARD).
   Embedded in an iframe, the HOST game owns every outcome: real
   battles, shops, relics, currency, story. This page becomes a pure
   VIEW + navigation layer. The host is authoritative on run state.

   host → map :  ascent:loadMap     { map, run? }   load a map.json (+ optional run)
                 ascent:setRun      { run }         authoritative run state
                 ascent:resolveNode { run, message? } encounter resolved → resume
                 ascent:toast       { message }
   map  → host:  ascent:ready       { build }
                 ascent:nodeEnter   { nodeId, nodeType, tier }   ⟵ the battle hook
                 ascent:select      { nodeId }      player inspected a node
                 ascent:runComplete { nodeId }
   ------------------------------------------------------------ */
const ASCENT_BUILD = 'ascent-v1';
const HOST = {
  on: false,                 // flips true on the first host message
  post(type, data){
    try{
      if(window.parent && window.parent !== window)
        window.parent.postMessage(Object.assign({ type, build: ASCENT_BUILD }, data || {}), '*');
    }catch(e){}
  }
};
// Highest tier present in the loaded map (HUD "x / y"). Falls back to 6.
function _tierMax(){
  try{
    const ts = Object.values(NODES).map(n => n.def.tier | 0);
    return ts.length ? Math.max.apply(null, ts) : 6;
  }catch(e){ return 6; }
}
// Apply an authoritative run snapshot from the host.
function _applyHostRun(r){
  if(!r || typeof r !== 'object') return;
  if(typeof r.at === 'string' && NODES[r.at]) RUN.at = r.at;
  if(Array.isArray(r.cleared)) RUN.cleared = new Set(r.cleared.filter(id => NODES[id]));
  if(typeof r.hp === 'number')    RUN.hp    = r.hp;
  if(typeof r.maxHp === 'number') RUN.maxHp = r.maxHp;
  if(typeof r.gold === 'number')  RUN.gold  = r.gold;
  RUN.cleared.add(RUN.at);           // standing on it means it's reached
  RUN.moving = false;
  try{ snapPlayer(); refresh(); }catch(e){}
}
window.addEventListener('message', (ev)=>{
  const d = ev.data;
  if(!d || typeof d !== 'object' || typeof d.type !== 'string') return;
  if(d.type.indexOf('ascent:') !== 0) return;
  HOST.on = true;                    // a host is talking to us
  try{
    if(d.type === 'ascent:loadMap'){
      if(d.map) { loadManifest(d.map); }
      if(d.run) _applyHostRun(d.run); else { try{ refresh(); }catch(e){} }
      try{ frameMap(); }catch(e){}
      return;
    }
    if(d.type === 'ascent:setRun' || d.type === 'ascent:resolveNode'){
      _applyHostRun(d.run);
      if(d.message) toast(d.message);
      return;
    }
    if(d.type === 'ascent:toast'){ if(d.message) toast(d.message); return; }
  }catch(err){ try{ console.warn('[ascent host]', err); }catch(_){ } }
});
// Public handle for same-origin hosts that would rather call than post.
window.AscentMap = {
  build: ASCENT_BUILD,
  load(map, run){ HOST.on = true; loadManifest(map); if(run) _applyHostRun(run); try{ frameMap(); }catch(e){} },
  setRun: _applyHostRun,
  get run(){ return { at:RUN.at, cleared:[...RUN.cleared], hp:RUN.hp, maxHp:RUN.maxHp, gold:RUN.gold }; },
  travel: (id)=>travel(id),
  inspect: (id)=>inspect(id),
  toast: (m)=>toast(m)
};

function neighborsUp(id){
  const t = NODES[id].def.tier;
  return EDGES.filter(e => (e.a===id && NODES[e.b].def.tier > t) || (e.b===id && NODES[e.a].def.tier > t))
              .map(e => e.a===id ? e.b : e.a);
}
function edgeBetween(a,b){
  return EDGES.find(e => (e.a===a&&e.b===b) || (e.a===b&&e.b===a));
}

function refresh(){
  const open = new Set(neighborsUp(RUN.at));
  Object.values(NODES).forEach(n=>{
    const id = n.def.id;
    n.state = id===RUN.at ? 'here' : RUN.cleared.has(id) ? 'done' : open.has(id) ? 'open' : 'locked';
    const o = {here:1.0, open:0.75, done:0.30, locked:0.10}[n.state];
    n.ring.material.opacity = o;
    n.halo.material.opacity = {here:.55, open:.4, done:.12, locked:.05}[n.state];
    n.ring.material.color.setHex(n.state==='here' ? 0xffe6b0 : n.state==='open' ? n.T.ring : n.T.color);
    n.group.traverse(c=>{ if(c.isSprite && c!==n.halo) c.material.opacity = n.state==='locked' ? 0.42 : 0.85; });
  });
  // Tier max comes from the loaded map (was hardcoded "/ 6", which lied on any
  // map that wasn't 7 rungs tall).
  document.getElementById('sTier').textContent  = NODES[RUN.at].def.tier + ' / ' + _tierMax();
  document.getElementById('sHp').textContent    = RUN.hp;
  document.getElementById('sGold').textContent  = RUN.gold;
  document.getElementById('sClear').textContent = RUN.cleared.size;
}

const REWARD = {
  camp:     ()=>{ RUN.hp = Math.min(RUN.maxHp, RUN.hp+30); return 'Rested — vigor restored'; },
  battle:   ()=>{ RUN.hp = Math.max(1, RUN.hp-18); RUN.gold += 45; return 'Skirmish won — 45 gold'; },
  shop:     ()=>{ RUN.gold -= 60; return 'Relic purchased — 60 gold'; },
  mystery:  ()=>{ const good = Math.random()>.4; if(good){RUN.gold+=70;} else {RUN.hp=Math.max(1,RUN.hp-12);}
                  return good ? 'The rune favours you — 70 gold' : 'The rune bites — 12 vigor lost'; },
  treasure: ()=>{ RUN.gold += 130; return 'Vault opened — 130 gold'; },
  elite:    ()=>{ RUN.hp = Math.max(1, RUN.hp-32); RUN.gold += 110; return 'Bone gate broken — 110 gold'; },
  boss:     ()=>{ return 'The Crimson Keep stands open'; },
  start:    ()=>'' 
};

function travel(to){
  if(RUN.moving) return;
  const e = edgeBetween(RUN.at, to);
  if(!e) return;
  RUN.moving = true;
  const forward = e.a === RUN.at;
  const dir = forward ? 1 : -1;
  const span = e.curve.getLength();
  const dur = Math.max(1000, Math.min(3400, (span / Train.speed) * 1000));
  const t0 = performance.now();
  Train.moving = true;

  (function step(now){
    const k = Math.min(1, (now-t0)/dur);
    const eased = trainEase(k);
    Train.setPose(e.curve, forward ? eased : 1-eased, dir);
    const p = Train.cars.length ? Train.cars[0].position : e.curve.getPoint(eased);
    e.trail.material.opacity = Math.max(e.trail.material.opacity, eased*0.55);
    camTarget.lerp(new THREE.Vector3(p.x*0.4, p.y+10, p.z*0.4), 0.035); applyCam();
    if(k<1) requestAnimationFrame(step);
    else{
      Train.lastCurve = e.curve; Train.lastDir = dir; Train.moving = false;
      RUN.at = to;
      const ty = NODES[to].def.type;
      // 💥 Cosmetic debris — independent of who resolves the encounter.
      if(ty === 'battle' || ty === 'elite') spawnGibs(NODES[to], ty === 'elite' ? 16 : 11);
      if(HOST.on){
        // 🔌 EMBEDDED. The host game owns every outcome (real battles, shops,
        // relics, story). We only report the arrival and then WAIT — the host
        // replies with ascent:resolveNode carrying the authoritative run state.
        // `cleared` is deliberately NOT set here; the host decides.
        snapPlayer(); refresh(); RUN.moving = false;
        HOST.post('ascent:nodeEnter', { nodeId: to, nodeType: ty, tier: NODES[to].def.tier });
      } else {
        // 🎮 STANDALONE demo — the built-in placeholder economy.
        RUN.cleared.add(to);
        const msg = REWARD[ty] ? REWARD[ty]() : '';
        if(msg) toast(msg);
        snapPlayer(); refresh(); RUN.moving = false;
        if(ty==='boss') setTimeout(()=>toast('Run complete — restart to descend again'), 2200);
      }
    }
  })(t0);
}
function snapPlayer(){ Train.parkAt(NODES[RUN.at]); }

/* ------------------------------------------------------------
   UI
   ------------------------------------------------------------ */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('on'), 2400);
}
const insp = document.getElementById('inspect');
function inspect(id){
  if(!id){ insp.classList.remove('on'); return; }
  const n = NODES[id];
  // 📖 Per-node authoring wins over the generic per-TYPE flavour. The host's
  // campaign nodes carry their own name/story/kind, so a "Skirmish" can read
  // as "Ambush at the Sunken Depot" with its own narrative line.
  const d = n.def || {};
  document.getElementById('iKind').textContent = d.kind  || n.T.kind;
  document.getElementById('iName').textContent = d.name  || n.T.label;
  document.getElementById('iDesc').textContent = d.story || d.desc || n.T.desc;
  document.getElementById('iL').textContent    = d.statL || n.T.statL;
  document.getElementById('iR').textContent = n.state==='done' ? 'Cleared'
    : n.state==='locked' ? 'Unreachable' : (d.statR || n.T.statR);
  insp.classList.add('on');
  HOST.post('ascent:select', { nodeId: id, nodeType: d.type });
}
function renderLegend(){
  const counts = {};
  MAP_DATA.nodes.forEach(n=> counts[n.type] = (counts[n.type]||0)+1);
  document.getElementById('legendList').innerHTML =
    Object.keys(TYPES).filter(k=>counts[k]).map(k=>{
      const c = '#' + TYPES[k].color.toString(16).padStart(6,'0');
      return `<div class="lg"><i class="dot" style="color:${c}"></i>${TYPES[k].label}<span class="ct">${counts[k]}</span></div>`;
    }).join('');
}
document.getElementById('reset').addEventListener('click', ()=>{
  RUN.at=startId(); RUN.cleared=new Set([RUN.at]); RUN.hp=80; RUN.gold=120; RUN.moving=false;
  EDGES.forEach(e=> e.trail.material.opacity = 0);
  Train.lastCurve = null; Train.lastDir = 1;
  snapPlayer(); refresh(); inspect(null); toast('New run — the bonfire is lit');
});

function frameMap(){
  const xs = MAP_DATA.nodes.map(n=>n.x), zs = MAP_DATA.nodes.map(n=>n.z);
  const cx = (Math.min(...xs)+Math.max(...xs))/2;
  const cz = (Math.min(...zs)+Math.max(...zs))/2;
  const spread = Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...zs)-Math.min(...zs), 60);
  camTarget.set(cx, (Math.max(...MAP_DATA.nodes.map(n=>n.tier))*TIER_H)/2, cz);
  cam.dist = Math.max(120, spread*1.5);
  applyCam();
}

/* ------------------------------------------------------------
   CAMERA CONTROLS (orbit / zoom / pan, written for r128)
   ------------------------------------------------------------ */
const cam = { theta:0, phi:0.86, dist:250, min:90, max:620 };
const camTarget = new THREE.Vector3(0, 24, -6);
let drag = null, moved = 0;

function applyCam(){
  cam.phi = Math.max(0.18, Math.min(1.42, cam.phi));
  cam.dist = Math.max(cam.min, Math.min(cam.max, cam.dist));
  camera.position.set(
    camTarget.x + cam.dist*Math.sin(cam.phi)*Math.sin(cam.theta),
    camTarget.y + cam.dist*Math.cos(cam.phi),
    camTarget.z + cam.dist*Math.sin(cam.phi)*Math.cos(cam.theta)
  );
  camera.lookAt(camTarget);
  if(BACKDROP.enabled && BACKDROP.parallax){
    const dx = Math.sin(cam.theta) * 26;
    const dy = (cam.phi - 0.86) * -46;
    backdrop.style.transform = `scale(1.09) translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
  }
}
const el = renderer.domElement;
el.addEventListener('contextmenu', e=>e.preventDefault());
el.addEventListener('pointerdown', e=>{
  el.setPointerCapture(e.pointerId);
  drag = {x:e.clientX, y:e.clientY, btn:e.button}; moved = 0;
});
el.addEventListener('pointermove', e=>{
  const r = el.getBoundingClientRect();
  pointer.x = ((e.clientX-r.left)/r.width)*2 - 1;
  pointer.y = -((e.clientY-r.top)/r.height)*2 + 1;
  if(!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  moved += Math.abs(dx)+Math.abs(dy);
  if(drag.btn === 2 || e.shiftKey){
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    const up    = new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    const k = cam.dist*0.0016;
    camTarget.addScaledVector(right, -dx*k).addScaledVector(up, dy*k);
  }else{
    cam.theta -= dx*0.005;
    cam.phi   -= dy*0.005;
  }
  drag.x = e.clientX; drag.y = e.clientY;
  applyCam();
});
addEventListener('pointerup', ()=>{ drag = null; });
el.addEventListener('wheel', e=>{ e.preventDefault(); cam.dist *= 1 + Math.sign(e.deltaY)*0.09; applyCam(); }, {passive:false});
addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft')  cam.theta += .09;
  if(e.key==='ArrowRight') cam.theta -= .09;
  if(e.key==='ArrowUp')    cam.dist  *= .93;
  if(e.key==='ArrowDown')  cam.dist  *= 1.07;
  applyCam();
});

/* ---- picking ---- */
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2(-2,-2);
let hovered = null;
function pick(){
  ray.setFromCamera(pointer, camera);
  const hits = ray.intersectObjects(Object.values(NODES).map(n=>n.hit), false);
  return hits.length ? hits[0].object.userData.nodeId : null;
}
el.addEventListener('click', ()=>{
  if(moved > 6) return;
  const id = pick();
  if(!id) return;
  RUN.selected = id;
  inspect(id);
  if(NODES[id].state === 'open') travel(id);
  else if(NODES[id].state === 'locked') toast('No span leads there yet');
});

/* ------------------------------------------------------------
   BOOT + LOOP
   ------------------------------------------------------------ */
// with a photograph behind the map, the procedural sky and the crystal
// spires just get in the way — they are off unless you ask for them
if(BACKDROP.enabled ? BACKDROP.stars    : true) buildSky();
if(BACKDROP.enabled ? BACKDROP.crystals : true) buildCrystals();
buildWorld();
Train.build(buildStandInTrain());
snapPlayer();
refresh();
applyCam();
renderLegend();
// bind any pre-set urls in MODELS on startup
Object.keys(MODELS).filter(k=>MODELS[k].url).forEach(k=>Assets.apply(k, true));

// 🔌 Tell a host we're alive so it can push the real campaign map. Posted
// repeatedly for a short while because the host may attach its listener after
// the iframe loads; it stops as soon as the host answers (HOST.on).
(function announce(){
  let tries = 0;
  const t = setInterval(()=>{
    if(HOST.on || tries++ > 20) return clearInterval(t);
    HOST.post('ascent:ready', { tierMax: _tierMax() });
  }, 250);
  HOST.post('ascent:ready', { tierMax: _tierMax() });
})();

// opening sweep
if(!REDUCED){
  const t0 = performance.now();
  const from = {theta:-0.9, phi:1.25, dist:520}, to = {theta:0, phi:0.86, dist:250};
  (function intro(now){
    const k = Math.min(1, (now-t0)/2600);
    const e = 1-Math.pow(1-k, 3);
    cam.theta = from.theta + (to.theta-from.theta)*e;
    cam.phi   = from.phi   + (to.phi-from.phi)*e;
    cam.dist  = from.dist  + (to.dist-from.dist)*e;
    applyCam();
    if(k<1) requestAnimationFrame(intro);
  })(t0);
}

const clock = new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const t = clock.getElapsedTime();
  const now = performance.now();
  const dt = Math.min(0.05, (now - (frame.last || now)) / 1000); frame.last = now;
  if(ANIM.gibs.length) stepGibs(dt);
  Train.step(dt);

  // hover feedback
  if(!drag){
    const id = pick();
    if(id !== hovered){
      hovered = id;
      el.style.cursor = id && NODES[id].state==='open' ? 'pointer' : 'default';
      if(id) inspect(id);
    }
  }

  if(!REDUCED){
    ANIM.flames.forEach((f,i)=>{
      const s = 0.85 + Math.sin(t*7 + i*1.7)*0.13 + Math.sin(t*13.3 + i)*0.06;
      f.scale.set(s, 0.9+s*0.22, s);
    });
    ANIM.bobs.forEach((b,i)=>{
      b.position.y = (b.userData.y0 !== undefined ? b.userData.y0 : (b.userData.y0 = b.position.y)) + Math.sin(t*1.5+i)*1.5;
      b.rotation.y = Math.sin(t*0.5+i)*0.25;
    });
    ANIM.spins.forEach(s=>{ s.rotation.z += 0.02; });
    ANIM.arcane.forEach(g=>{
      g.userData.motes.forEach((m,i)=>{
        m.userData.t = (m.userData.t + 0.0035) % 1;
        m.position.copy(g.userData.curve.getPoint(m.userData.t));
        m.material.opacity = 0.35 + Math.sin(m.userData.t*Math.PI)*0.6;
      });
    });
    if(Train.lamp) Train.lamp.intensity = 2.0 + Math.sin(t*3.1)*0.25;
  }

  // node ring pulse
  ANIM.rings.forEach((n,i)=>{
    if(n.state==='here') n.ring.material.opacity = 0.7 + Math.sin(t*3)*0.3;
    else if(n.state==='open') n.ring.material.opacity = 0.5 + Math.sin(t*2.2+i)*0.22;
  });
  bossLight.intensity = 2.6 + Math.sin(t*2.3)*0.9 + (Math.random()<0.02?2.5:0);

  renderer.render(scene, camera);
  if(!frame.shown){ frame.shown = true; document.getElementById('loader').classList.add('gone'); }
}
frame();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});



</script>
</body>
