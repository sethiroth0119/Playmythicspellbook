<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tribute Summon — Zevran Kallix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{ --gold:#F5C453; --bone:#EAF2FF; --display:'Anton',Impact,'Arial Narrow Bold',sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
/* checkerboard is the PAGE — the canvas layer itself is fully transparent */
body{
  display:grid;place-items:center;padding:16px;
  background:transparent;
}
#wrap{position:relative;width:100%;max-width:1280px;aspect-ratio:16/9}
  /* PREVIEW-ONLY backdrop — visible when you open this file directly; removed
     in-game (iframe) so the battlefield shows through. */
  #previewbg{ position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }
  /* 👑 Card art — RIGHT side (opposite the nameplate). Filled from ?art= at
     runtime (the summoning unit's card); demo default below. */
  #cardframe{ position:absolute; left:50%; top:48%; z-index:5;
    height:74%; aspect-ratio:1024/1536; background:center/contain no-repeat;
    background-image:url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/azathoth.png");
    transform:translate(-50%,-50%) scale(0.82); opacity:0;
    filter:drop-shadow(0 20px 52px rgba(0,0,0,0.72)); pointer-events:none; will-change:transform,opacity,filter; }
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}

.plate{position:absolute;left:5.2%;bottom:9%;pointer-events:none;opacity:0;--np:0}
.plate .eyebrow{
  font-family:var(--display);font-size:clamp(8px,.9vw,11px);letter-spacing:.44em;
  color:var(--gold);margin-bottom:6px;
  clip-path:inset(0 calc((1 - var(--np)) * 100%) 0 0);
}
.plate .pname{
  font-family:var(--display);font-size:clamp(26px,4.8vw,60px);line-height:.92;
  letter-spacing:.06em;color:var(--bone);
  text-shadow:0 0 26px rgba(42,107,255,.9), 0 0 62px rgba(143,216,255,.45), 0 3px 0 #050a1c;
  clip-path:inset(0 calc((1 - var(--np)) * 100%) 0 0);
  transform:translateX(calc((1 - var(--np)) * -18px));
}
.plate .rule{
  height:1px;margin-top:9px;width:calc(var(--np) * 300px);max-width:46vw;
  background:linear-gradient(90deg,var(--gold),rgba(245,196,83,0));
}
</style>
</head>

<div id="previewbg"></div>
<div id="wrap">
  <canvas id="c"></canvas>

    <div class="pname" id="pName">ZEVRAN KALLIX</div>
    <div class="rule"></div>

</div>

  {t:5.05, id:'material', label:'MATERIALIZE'},
  {t:6.20, id:'descent',  label:'DESCENT'},
  {t:6.65, id:'name',     label:'NAMEPLATE'},
  {t:7.30, id:'idle',     label:'IDLE'}
];
const B = {}; BEATS.forEach(b => B[b.id] = b.t);

/* ============================================================
   stage
   ============================================================ */
const W = 1280, H = 720;
const vcv = document.getElementById('c');
const vctx = vcv.getContext('2d');
/* transparent 1280x720 VFX layer, blitted through a master fade */
const cv = document.createElement('canvas');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
let dpr = 1, master = 1, holdT = 0;

function resize(){
  const r = vcv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  vcv.width  = cv.width  = Math.max(2, Math.round(r.width  * dpr));
  vcv.height = cv.height = Math.max(2, Math.round(r.height * dpr));
  vctx.imageSmoothingEnabled = true;
  vctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', resize);

const clamp = (v,a=0,b=1) => v < a ? a : v > b ? b : v;
const seg = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,u) => a + (b-a)*u;
const eOut = u => 1 - Math.pow(1-u, 3);
const eIO  = u => u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u+2,3)/2;
const pulse = (t,a,b) => Math.sin(seg(t,a,b)*Math.PI);
function hash(i,s){ const x = Math.sin(i*127.1 + s*311.7) * 43758.5453; return x - Math.floor(x); }

const P = CFG.palette;
function rgba(hex,a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* geometry */
const CARD = {w:240, h:356, y:332};
const SLOT = [400, 880];                 // tribute rest positions
const NODE = {x:640, y:332};             // convergence point
const UNIT = {w:432, h:618, cx:640, cy:352};
UNIT.x = UNIT.cx - UNIT.w/2; UNIT.y = UNIT.cy - UNIT.h/2;
const GROUND = 668;

/* ============================================================
   assets
   ============================================================ */
const imgT = [new Image(), new Image()], imgU = new Image();
let loaded = 0;
const onload = () => { if(++loaded === 3) init(); };
imgT[0].onload = imgT[1].onload = imgU.onload = onload;
imgT[0].src = CFG.tributes[0]; imgT[1].src = CFG.tributes[1]; imgU.src = CFG.unit;

let unitWhite, unitDark, maskCv, maskCtx, maskImg, edgeCv, edgeCtx, edgeImg, noise, bias;
let MW, MH, shards = [], motes = [];

function init(){
  /* white-hot silhouette — used inside the rift and on the burst */
  unitWhite = document.createElement('canvas');
  unitWhite.width = imgU.width; unitWhite.height = imgU.height;
  const uw = unitWhite.getContext('2d');
  uw.drawImage(imgU,0,0);
  uw.globalCompositeOperation = 'source-in';
  uw.fillStyle = '#fff'; uw.fillRect(0,0,unitWhite.width,unitWhite.height);

  unitDark = document.createElement('canvas');
  unitDark.width = imgU.width; unitDark.height = imgU.height;
  const ud = unitDark.getContext('2d');
  ud.drawImage(imgU,0,0);
  ud.globalCompositeOperation = 'source-in';
  ud.fillStyle = '#081228'; ud.fillRect(0,0,unitDark.width,unitDark.height);

  /* dissolve mask buffers */
  MW = 190; MH = Math.round(MW * imgU.height / imgU.width);
  maskCv = document.createElement('canvas'); maskCv.width=MW; maskCv.height=MH;
  maskCtx = maskCv.getContext('2d'); maskImg = maskCtx.createImageData(MW,MH);
  edgeCv = document.createElement('canvas'); edgeCv.width=MW; edgeCv.height=MH;
  edgeCtx = edgeCv.getContext('2d'); edgeImg = edgeCtx.createImageData(MW,MH);

  noise = new Float32Array(MW*MH); bias = new Float32Array(MW*MH);
  const grid = [];
  for(let o=0;o<3;o++){
    const s = 6 << o, g = new Float32Array((s+1)*(s+1));
    for(let i=0;i<g.length;i++) g[i] = Math.random();
    grid.push({s,g});
  }
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    let v=0, amp=0.62, tot=0;
    for(const {s,g} of grid){
      const fx=(x/MW)*s, fy=(y/MH)*s;
      const x0=Math.floor(fx), y0=Math.floor(fy), tx=fx-x0, ty=fy-y0;
      const a=g[y0*(s+1)+x0], b=g[y0*(s+1)+x0+1], c=g[(y0+1)*(s+1)+x0], d=g[(y0+1)*(s+1)+x0+1];
      const sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
      const top = a+(b-a)*sx, bot = c+(d-c)*sx;
      v += (top + (bot-top)*sy) * amp;
      tot += amp; amp *= 0.5;
    }
    const i = y*MW+x;
    noise[i] = v/tot;
    bias[i]  = (y/MH) * 0.5;              // descends from the rift: top first
  }
  for(let i=0;i<MW*MH;i++){ maskImg.data[i*4]=255; maskImg.data[i*4+1]=255; maskImg.data[i*4+2]=255; }
  const ec = parseInt(P.charge.slice(1),16);
  for(let i=0;i<MW*MH;i++){ edgeImg.data[i*4]=ec>>16&255; edgeImg.data[i*4+1]=ec>>8&255; edgeImg.data[i*4+2]=ec&255; }

  buildShards();
  for(let i=0;i<130;i++) motes.push({
    x:hash(i,1)*W, y:hash(i,2)*H, r:0.4+hash(i,3)*1.6,
    a:0.15+hash(i,4)*0.5, sp:0.25+hash(i,5)*1.1, hue:hash(i,6)
  });

  document.getElementById('pName').textContent = CFG.name;
  document.getElementById('pEyebrow').innerHTML = CFG.eyebrow;
  resize();
  if(reduced){ CFG.loop = false; t = CFG.duration; } else playing = true;
  requestAnimationFrame(frame);
}

/* both tributes are cut into a grid; every piece is aimed at a real point
   on the Archon's body, sampled from its own alpha channel */
const COLS = 9, ROWS = 13;
function buildShards(){
  const sw = 140, sh = Math.round(140 * imgU.height / imgU.width);
  const sc = document.createElement('canvas'); sc.width=sw; sc.height=sh;
  const sx = sc.getContext('2d'); sx.drawImage(imgU,0,0,sw,sh);
  const d = sx.getImageData(0,0,sw,sh).data, pts=[];
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++)
    if(d[(y*sw+x)*4+3] > 120) pts.push([x/sw, y/sh]);

  const cw = CARD.w/COLS, ch = CARD.h/ROWS;
  let n = 0;
  for(let k=0;k<2;k++){
    const sxw = imgT[k].width/COLS, syh = imgT[k].height/ROWS;
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const i = n++;
      const nx = (c+0.5)/COLS, ny = (r+0.5)/ROWS;
      let best = pts[0], bd = 9;
      for(let q=0;q<26;q++){
        const p = pts[(Math.random()*pts.length)|0];
        const dd = (p[0]-nx)**2 + (p[1]-ny)**2*0.6;
        if(dd < bd){ bd = dd; best = p; }
      }
      shards.push({
        card:k, sx:c*sxw, sy:r*syh, sw:sxw, sh:syh,
        ox:(nx-0.5)*CARD.w, oy:(ny-0.5)*CARD.h, w:cw+1.2, h:ch+1.2,
        ring: 88 + hash(i,10)*52,
        dir: k ? -1 : 1,
        spin: (hash(i,11)-0.5)*3,
        tx: UNIT.x + best[0]*UNIT.w, ty: UNIT.y + best[1]*UNIT.h,
        arrive: 0.30 + hash(i,12)*0.55,
        out: 70 + hash(i,13)*150,
        oa: hash(i,14)*Math.PI*2,
        jx:(hash(i,15)-0.5), jy:(hash(i,16)-0.5)
      });
    }
  }
}

/* ============================================================
   camera shake
   ============================================================ */
const SHAKE = [
  {t:B.cardin+0.68, a:6,  d:0.30},
  {t:B.link,        a:8,  d:0.34},
  {t:B.fracture,    a:9,  d:0.40},
  {t:B.gate,        a:12, d:0.55},
  {t:B.burst,       a:28, d:0.52},
  {t:B.descent,     a:20, d:0.55}
];
function shakeAt(t){
  let x=0,y=0;
  for(const s of SHAKE){
    if(t < s.t) continue;
    const k = Math.exp(-(t-s.t)/s.d*3.2) * s.a;
    if(k < 0.05) continue;
    x += Math.sin((t-s.t)*97)*k; y += Math.cos((t-s.t)*123)*k*0.7;
  }
  return [x,y];
}

/* ============================================================
   background / seals
   ============================================================ */
function drawBg(t){
  const chargeU = seg(t,0,B.gate);
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(640,400,40, 640,400, 600);
  g.addColorStop(0, rgba(P.arc, 0.09 + chargeU*0.16));
  g.addColorStop(0.45, rgba(P.arc, 0.05));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(640,400,600,0,7); ctx.fill();

  const pullIn = seg(t,0,B.burst), blow = seg(t,B.burst,B.burst+1.5);
  for(let i=0;i<motes.length;i++){
    const s = motes[i];
    const dx = 640-s.x, dy = 400-s.y, dist = Math.hypot(dx,dy)||1;
    const px = s.x + (dx/dist)*pullIn*90 - (dx/dist)*eOut(blow)*480;
    const py = s.y + (dy/dist)*pullIn*90 - (dy/dist)*eOut(blow)*480 - ((amb*s.sp*14)%H)*0.06;
    const fall = clamp(1 - Math.hypot(px-640,(py-400)*1.35)/560);
    if(fall <= 0) continue;
    const av = s.a * (0.6 + 0.4*Math.sin(amb*3+i)) * fall;
    ctx.fillStyle = s.hue > 0.6 ? rgba(P.charge, av) : rgba(P.core, av*0.9);
    ctx.fillRect(px, py, s.r, s.r);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function seal(cx, cy, R, up, fade, col, speedK){
  if(up <= 0) return;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1, 0.30);
  ctx.globalCompositeOperation = 'lighter';
  const r = R*eOut(up);

  const pool = ctx.createRadialGradient(0,0,8, 0,0, r*1.15);
  pool.addColorStop(0, rgba(col, 0.5*up*fade));
  pool.addColorStop(0.55, rgba(col, 0.12*up*fade));
  pool.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(0,0,r*1.15,0,7); ctx.fill();

  [[1,0.55,1.6],[0.78,-0.9,1],[0.52,1.5,1]].forEach(([k,sp,lw],ri)=>{
    ctx.strokeStyle = rgba(ri===1?P.gold:P.charge, 0.5*up*fade);
    ctx.lineWidth = lw*2.2;
    ctx.beginPath(); ctx.arc(0,0,r*k,0,7); ctx.stroke();
    const n = 12 + ri*10;
    for(let i=0;i<n;i++){
      const a = amb*sp*speedK + i/n*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*k*0.94, Math.sin(a)*r*k*0.94);
      ctx.lineTo(Math.cos(a)*r*k*1.06, Math.sin(a)*r*k*1.06);
      ctx.stroke();
    }
  });
  ctx.strokeStyle = rgba(col, 0.45*up*fade); ctx.lineWidth = 3;
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = amb*0.35*speedK + i/6*Math.PI*2, rr = r*0.86;
    i ? ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr) : ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

/* soft-edged light column — sliced so it has no hard vertical borders */
function column(cx, halfW, h, col, alpha){
  if(alpha <= 0.002) return;
  ctx.globalCompositeOperation = 'lighter';
  const SL = 22;
  for(let i=0;i<SL;i++){
    const u = (i+0.5)/SL, fx = cx - halfW + u*halfW*2;
    const soft = Math.pow(Math.sin(u*Math.PI), 1.6);
    const lg = ctx.createLinearGradient(0,GROUND,0,GROUND-h);
    lg.addColorStop(0, rgba(col, alpha*soft));
    lg.addColorStop(0.75, rgba(col, alpha*0.16*soft));
    lg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(fx, GROUND-h, halfW*2/SL + 1, h);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawSeals(t){
  const twin = seg(t, B.charge, B.seal), twinFade = 1 - seg(t, B.fracture, B.gate);
  for(let k=0;k<2;k++) seal(SLOT[k], GROUND, 150, twin, twinFade, CFG.tributeTint[k], 1.4);

  const main = seg(t, B.seal, B.seal+0.8);
  const mainFade = 1 - seg(t, B.burst, B.burst+0.4)*0.5;
  seal(NODE.x, GROUND, 330, main, mainFade, P.arc, 1);

  column(640, 190, 600, P.arc, 0.26*main*(1 - seg(t,B.burst,B.burst+0.4)));
  /* the tributes' own light rising as they are consumed */
  const burn = seg(t, B.offer, B.fracture) * (1 - seg(t, B.fracture, B.gate));
  for(let k=0;k<2;k++) column(SLOT[k], 90, 420, CFG.tributeTint[k], 0.24*burn);
}

/* ============================================================
   tribute cards
   ============================================================ */
function cardT(k, t){
  const u = seg(t, B.cardin, B.seal), e = eOut(u);
  const dir = k ? 1 : -1;
  const x = lerp(640 + dir*1080, SLOT[k], e);
  const y = lerp(520, CARD.y, e) + Math.sin(t*1.6 + k*2)*6*seg(t,B.seal,B.seal+0.5);
  const rotY = (1-e) * Math.PI * 3.5 * -dir;
  let tilt = lerp(dir*0.55, dir*0.10, e);
  let sc = lerp(0.42, 1, e);

  /* offering: lift, turn to face the node, swell */
  const o = eOut(seg(t, B.offer, B.fracture));
  const vib = seg(t, B.offer, B.fracture);
  return {
    x: x + Math.sin(t*80+k)*vib*3,
    y: y - 30*o + Math.cos(t*71+k)*vib*2.5,
    rotY, tilt: tilt + dir*0.14*o, sc: sc*(1 + 0.07*o)
  };
}

function drawCardBack(w,h,col){
  ctx.fillStyle = '#0A0716'; roundRect(-w/2,-h/2,w,h,10); ctx.fill();
  ctx.strokeStyle = rgba(P.gold,0.85); ctx.lineWidth = 3;
  roundRect(-w/2+7,-h/2+7,w-14,h-14,7); ctx.stroke();
  ctx.save(); ctx.rotate(Math.PI/4);
  const s = w*0.24;
  ctx.fillStyle = rgba(col,0.9); ctx.fillRect(-s/2,-s/2,s,s);
  ctx.strokeStyle = rgba(P.gold,0.9); ctx.lineWidth = 2; ctx.strokeRect(-s/2,-s/2,s,s);
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawCards(t){
  if(t < B.cardin || t >= B.fracture) return;
  for(let k=0;k<2;k++){
    const T = cardT(k,t), col = CFG.tributeTint[k];
    const w = CARD.w*T.sc, h = CARD.h*T.sc;
    const heat = seg(t, B.link, B.fracture);

    ctx.save();
    ctx.translate(T.x, T.y); ctx.rotate(T.tilt);
    const face = Math.cos(T.rotY);
    ctx.transform(Math.abs(face) < 0.02 ? 0.02 : face, 0, 0, 1, 0, 0);

    ctx.globalCompositeOperation = 'lighter';
    const bl = ctx.createRadialGradient(0,0,10,0,0,h*0.85);
    bl.addColorStop(0, rgba(col, 0.30 + heat*0.55)); bl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = bl; ctx.fillRect(-w,-h,w*2,h*2);
    ctx.globalCompositeOperation = 'source-over';

    if(face >= 0) ctx.drawImage(imgT[k], -w/2, -h/2, w, h);
    else { ctx.save(); ctx.scale(-1,1); drawCardBack(w,h,col); ctx.restore(); }

    /* ignition: the card takes on its own colour before it is spent */
    const ig = seg(t, B.offer, B.fracture);
    if(ig > 0){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = ig*0.5;
      ctx.fillStyle = rgba(col, 1);
      roundRect(-w/2,-h/2,w,h,8); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.strokeStyle = rgba(P.gold, 0.45 + heat*0.55); ctx.lineWidth = 2.5;
    roundRect(-w/2,-h/2,w,h,8); ctx.stroke();

    if(heat > 0){
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(P.charge, 0.7*heat); ctx.lineWidth = 1.4;
      for(let i=0;i<6;i++){
        const s = Math.floor(t*22) + i + k*40;
        ctx.beginPath();
        let px = -w/2, py = (hash(s,20)-0.5)*h;
        ctx.moveTo(px,py);
        for(let q=0;q<6;q++){ px += w/6; py += (hash(s+q*7,21)-0.5)*h*0.22; ctx.lineTo(px,py); }
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }
}

/* tether between the two tributes, running through the node */
function drawLink(t){
  const u = seg(t, B.link, B.link+0.35) * (1 - seg(t, B.fracture, B.fracture+0.25));
  if(u <= 0.01) return;
  const A = cardT(0,t), C = cardT(1,t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for(let pass=0; pass<2; pass++){
    ctx.lineWidth = pass ? 1.6 : 6;
    ctx.strokeStyle = pass ? `rgba(255,255,255,${0.85*u})` : rgba(P.charge, 0.35*u);
    ctx.beginPath();
    const s = Math.floor(t*26)*7 + pass;
    for(let i=0;i<=16;i++){
      const p = i/16;
      const x = lerp(A.x, C.x, p);
      const y = lerp(A.y, C.y, p) + Math.sin(p*Math.PI)*-40
              + (hash(s+i,30)-0.5)*34*Math.sin(p*Math.PI);
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  /* node */
  const np = 0.6 + 0.4*Math.sin(t*14);
  const ng = ctx.createRadialGradient(NODE.x,NODE.y-40,2, NODE.x,NODE.y-40, 90*u);
  ng.addColorStop(0, `rgba(255,255,255,${0.9*u*np})`);
  ng.addColorStop(0.35, rgba(P.charge, 0.5*u*np));
  ng.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = ng; ctx.beginPath(); ctx.arc(NODE.x,NODE.y-40,90*u,0,7); ctx.fill();
  ctx.restore();
}

/* ============================================================
   shards — vortex in, compress into the rift, absorbed
   ============================================================ */
let originCache = null;
function shardOrigin(s){
  if(!originCache) originCache = [cardT(0,B.fracture), cardT(1,B.fracture)];
  const T = originCache[s.card];
  return [T.x + s.ox*T.sc, T.y + s.oy*T.sc];
}
function shardAt(s, t){
  const [ox,oy] = shardOrigin(s);
  const r0 = Math.hypot(ox-NODE.x, oy-NODE.y) || 1;
  const a0 = Math.atan2(oy-NODE.y, ox-NODE.x);
  const u = seg(t, B.fracture, B.gate);        // vortex
  const v = seg(t, B.gate, B.burst);           // compression into the rift
  const ang = a0 + s.dir * (eIO(u)*5.0 + v*7.0);
  let r = lerp(r0, s.ring, eIO(u));
  if(v > 0) r = lerp(r, 18, eOut(v));
  const sqx = lerp(1, 0.26, eOut(v)), sqy = lerp(0.9, 1.85, eOut(v));
  return [
    NODE.x + Math.cos(ang)*r*sqx,
    NODE.y + Math.sin(ang)*r*sqy,
    ang + Math.PI/2,
    lerp(1, 0.55, eIO(u)) * lerp(1, 0.55, eOut(v))
  ];
}
function drawShards(t){
  if(t < B.fracture) return;
  for(let i=0;i<shards.length;i++){
    const s = shards[i];
    let x,y,rot,sc,alpha = 1;
    if(t < B.burst){
      [x,y,rot,sc] = shardAt(s, t);
      const j = seg(t,B.fracture,B.fracture+0.15)*(1-seg(t,B.fracture+0.1,B.fracture+0.4));
      x += s.jx*j*14; y += s.jy*j*14;
    } else {
      const w = seg(t, B.burst, B.burst + 0.30 + s.arrive);
      if(w >= 1) continue;
      const ew = eOut(w);
      const [bx,by] = shardAt(s, B.burst);
      const mx = bx + Math.cos(s.oa)*s.out, my = by + Math.sin(s.oa)*s.out;
      const iw = 1-ew;
      x = iw*iw*bx + 2*iw*ew*mx + ew*ew*s.tx;
      y = iw*iw*by + 2*iw*ew*my + ew*ew*s.ty;
      rot = s.spin*ew*4; sc = lerp(0.55, 0.22, ew);
      alpha = 1 - seg(w, 0.72, 1);
    }
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot); ctx.globalAlpha = alpha;
    ctx.drawImage(imgT[s.card], s.sx, s.sy, s.sw, s.sh, -s.w/2*sc, -s.h/2*sc, s.w*sc, s.h*sc);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha*0.32;
    ctx.fillStyle = rgba(CFG.tributeTint[s.card], 1);
    ctx.fillRect(-s.w/2*sc, -s.h/2*sc, s.w*sc, s.h*sc);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   the rift
   ============================================================ */
function riftPath(hw, y0, y1){
  ctx.beginPath();
  ctx.moveTo(640, y0);
  ctx.quadraticCurveTo(640+hw, (y0+y1)/2, 640, y1);
  ctx.quadraticCurveTo(640-hw, (y0+y1)/2, 640, y0);
  ctx.closePath();
}
function drawRift(t){
  const open = seg(t, B.gate, B.burst);
  const blow = seg(t, B.burst, B.burst+0.45);
  if(open <= 0 || blow >= 1) return;
  const hw = lerp(4, 150, eOut(open)) + eOut(blow)*420;
  const fade = 1 - blow;
  const y0 = UNIT.y - 20, y1 = UNIT.y + UNIT.h + 20;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  /* glow bleed */
  const gg = ctx.createRadialGradient(640,NODE.y,10, 640,NODE.y, 520);
  gg.addColorStop(0, rgba(P.core, 0.55*fade*open));
  gg.addColorStop(0.4, rgba(P.core, 0.16*fade*open));
  gg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(640,NODE.y,520,0,7); ctx.fill();

  /* the tear itself, with the Archon's silhouette showing through it */
  ctx.save();
  riftPath(hw, y0, y1); ctx.clip();
  const lg = ctx.createLinearGradient(640-hw,0,640+hw,0);
  lg.addColorStop(0, rgba(P.core, 0.15*fade));
  lg.addColorStop(0.5, `rgba(255,255,255,${0.9*fade})`);
  lg.addColorStop(1, rgba(P.core, 0.15*fade));
  ctx.fillStyle = lg; ctx.fillRect(640-hw, y0, hw*2, y1-y0);
  ctx.globalAlpha = 0.82*fade*eOut(open);
  ctx.globalCompositeOperation = 'source-atop';
  ctx.drawImage(unitDark, UNIT.x, UNIT.y, UNIT.w, UNIT.h);
  ctx.restore();

  /* hot core slit + jagged edges */
  ctx.globalAlpha = fade;
  ctx.strokeStyle = `rgba(255,255,255,${0.85*fade})`;
  ctx.lineWidth = 2 + open*3;
  ctx.beginPath(); ctx.moveTo(640, y0+18); ctx.lineTo(640, y1-18); ctx.stroke();
  ctx.strokeStyle = rgba(P.charge, 0.7*fade);
  ctx.lineWidth = 2; riftPath(hw, y0, y1); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   the Archon
   ============================================================ */
function drawUnit(t){
  if(t < B.burst) return;
  const mat = seg(t, B.material, B.descent);
  const set = seg(t, B.descent, B.descent+0.5);
  const drop = (1-eOut(set)) * -26;
  const bob = Math.sin(amb*1.2)*5*set;

  ctx.save();
  ctx.translate(UNIT.cx, UNIT.cy + drop + bob);
  const dx = -UNIT.w/2, dy = -UNIT.h/2;

  const aur = seg(t, B.material, B.descent+0.3);
  if(aur > 0){
    ctx.globalCompositeOperation = 'lighter';
    const p = 0.75 + 0.25*Math.sin(amb*2.2);
    const ag = ctx.createRadialGradient(0,0,20, 0,0, UNIT.w*0.95);
    ag.addColorStop(0, rgba(P.core, 0.30*aur*p));
    ag.addColorStop(0.5, rgba(P.charge, 0.14*aur*p));
    ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0,0,UNIT.w*0.95,0,7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  if(mat >= 1){
    ctx.drawImage(imgU, dx, dy, UNIT.w, UNIT.h);
  } else if(mat > 0){
    const th = mat*1.55 - 0.28;
    const md = maskImg.data, ed = edgeImg.data;
    for(let i=0, n=MW*MH; i<n; i++){
      const v = th - (noise[i] + bias[i]);
      md[i*4+3] = clamp(v*11)*255;
      ed[i*4+3] = clamp(1 - Math.abs(v)*13)*255;
    }
    maskCtx.putImageData(maskImg,0,0);
    edgeCtx.putImageData(edgeImg,0,0);

    let tmp = drawUnit._tmp;
    if(!tmp){ tmp = drawUnit._tmp = document.createElement('canvas');
      tmp.width = imgU.width; tmp.height = imgU.height; }
    const tc = tmp.getContext('2d');
    tc.clearRect(0,0,tmp.width,tmp.height);
    tc.drawImage(imgU,0,0);
    tc.globalCompositeOperation = 'destination-in';
    tc.drawImage(maskCv,0,0,tmp.width,tmp.height);
    ctx.drawImage(tmp, dx, dy, UNIT.w, UNIT.h);

    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(edgeCv, dx, dy, UNIT.w, UNIT.h);
    ctx.globalCompositeOperation = 'source-over';
  }

  const sil = Math.max(pulse(t, B.burst, B.material+0.4), pulse(t, B.descent, B.descent+0.25)*0.5);
  if(sil > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = sil;
    ctx.drawImage(unitWhite, dx, dy, UNIT.w, UNIT.h);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}

/* ============================================================
   impacts
   ============================================================ */
function drawImpact(t){
  for(const [start, count, col, R, cy] of [
    [B.burst,   3, P.core,   560, NODE.y],
    [B.descent, 2, P.charge, 380, UNIT.cy]
  ]){
    for(let k=0;k<count;k++){
      const u = seg(t, start + k*0.07, start + 0.85 + k*0.12);
      if(u <= 0 || u >= 1) continue;
      const r = eOut(u)*R, a = Math.pow(1-u,1.7)*0.8;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.translate(640, cy);
      ctx.lineWidth = (1-u)*15 + 1;
      [[-3,P.charge],[0,col],[3,P.arc]].forEach(([off,cc])=>{
        ctx.strokeStyle = rgba(cc, a*0.5);
        ctx.beginPath(); ctx.arc(0,0,Math.max(r+off,1),0,7); ctx.stroke();
      });
      ctx.restore();
    }
  }

  const fl = Math.pow(1 - seg(t, B.burst, B.burst+0.45), 2.2) * (t>=B.burst?1:0);
  if(fl > 0.002){
    ctx.globalCompositeOperation = 'lighter';
    const FR = 700;
    const fg = ctx.createRadialGradient(640,NODE.y,20, 640,NODE.y, FR);
    fg.addColorStop(0, `rgba(255,255,255,${fl})`);
    fg.addColorStop(0.30, rgba(P.charge, fl*0.6));
    fg.addColorStop(0.62, `rgba(255,255,255,${fl*0.14})`);
    fg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(640,NODE.y,FR,0,7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  const du = seg(t, B.descent, B.descent+1.0);
  if(du > 0 && du < 1){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<24;i++){
      const a = hash(i,40)*Math.PI*2;
      const r = eOut(du)*(140+hash(i,41)*230);
      ctx.fillStyle = rgba(P.charge, (1-du)*0.22);
      ctx.beginPath();
      ctx.arc(640+Math.cos(a)*r, GROUND - Math.sin(du*Math.PI)*(16+hash(i,42)*50) + Math.sin(a)*r*0.18,
              6+hash(i,43)*20, 0, 7);
      ctx.fill();
    }
    ctx.restore();
  }

  /* ambient sparks once the Archon is alive */
  const em = seg(t, B.descent, B.descent+0.6);
  if(em > 0){
    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<40;i++){
      const life = ((amb*0.30 + hash(i,50)) % 1);
      const x = 640 + (hash(i,51)-0.5)*520 + Math.sin(amb*1.4+i)*16;
      const y = GROUND - life*560;
      const a = Math.sin(life*Math.PI)*0.6*em;
      ctx.fillStyle = rgba(hash(i,52)>0.5 ? P.charge : P.core, a);
      const s = 1.2 + hash(i,53)*2.2;
      ctx.fillRect(x,y,s,s*2.2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

function render(t){
  const [sx,sy] = shakeAt(t);
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(sx,sy);
  drawBg(t); drawSeals(t); drawLink(t);
  drawRift(t); drawImpact(t);   /* cosmic FX only — demo cards/silhouette/shards removed; the real card is the centered #cardframe DOM */
  ctx.restore();

  vctx.setTransform(1,0,0,1,0,0);
  vctx.clearRect(0,0,vcv.width,vcv.height);
  vctx.globalAlpha = master;
  vctx.drawImage(cv, 0, 0);
  vctx.globalAlpha = 1;
}

/* ============================================================
   audio
   ============================================================ */
let ac = null, soundOn = CFG.sound, fired = new Set();
function ensureAudio(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(ac.state === 'suspended') ac.resume();
}
function tone(type,f0,f1,dur,gain,when=0){
  if(!ac) return;
  const t0 = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(gain, t0+dur*0.12);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+dur+0.05);
}
function noiseHit(dur,gain,type='lowpass',f=900,when=0){
  if(!ac) return;
  const t0 = ac.currentTime + when;
  const n = Math.floor(ac.sampleRate*dur);
  const buf = ac.createBuffer(1,n,ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const s = ac.createBufferSource(); s.buffer = buf;
  const bq = ac.createBiquadFilter(); bq.type = type; bq.frequency.value = f;
  const g = ac.createGain(); g.gain.value = gain;
  s.connect(bq).connect(g).connect(ac.destination); s.start(t0);
}
const CUES = {
  cardin:  () => { tone('triangle',900,240,0.35,0.08); tone('triangle',760,200,0.35,0.08,0.09);
                   noiseHit(0.25,0.08,'highpass',2400); },
  seal:    () => { tone('sine',90,55,0.5,0.15); tone('sawtooth',110,760,2.6,0.04); },
  link:    () => { tone('square',280,1500,0.5,0.035); noiseHit(0.4,0.06,'bandpass',2000); },
  offer:   () => { tone('sawtooth',180,540,0.9,0.05); noiseHit(0.7,0.06,'bandpass',900); },
  fracture:() => { noiseHit(0.6,0.14,'highpass',1500); tone('sawtooth',420,1900,0.5,0.05); },
  gate:    () => { tone('sawtooth',60,240,1.1,0.10); noiseHit(0.9,0.10,'bandpass',600); },
  burst:   () => { tone('sine',190,30,0.75,0.32); noiseHit(0.95,0.24,'lowpass',1400);
                   noiseHit(0.5,0.14,'highpass',3200); },
  material:() => { [392,523,659,784].forEach((f,i)=>tone('triangle',f,f*1.5,1.0,0.045,i*0.10)); },
  descent: () => { tone('sine',140,24,0.9,0.34); noiseHit(0.75,0.2,'lowpass',700); },
  name:    () => { tone('triangle',1200,700,0.3,0.055); noiseHit(0.2,0.06,'highpass',3000); }
};

/* ============================================================
   transport
   ============================================================ */
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let t = 0, amb = 0, playing = false, speed = 1, last = performance.now();
const elPlate = document.getElementById('plate');
const elCard = document.getElementById('cardframe');

/* seek(0) is the trigger — call it from the game when the tribute resolves */
function seek(v){
  t = clamp(v, 0, CFG.duration);
  holdT = 0; master = 1;
  fired.clear();
  BEATS.forEach(b => { if(t >= b.t) fired.add(b.id); });
  playing = true;
  ensureAudio();
}
vcv.addEventListener('pointerdown', () => seek(0));
document.addEventListener('pointerdown', function once(){
  if(soundOn) ensureAudio();
  document.removeEventListener('pointerdown', once);
});

function frame(now){
  const dt = Math.min((now - last)/1000, 0.05); last = now;
  amb += dt;
  if(playing && t < CFG.duration) t = Math.min(t + dt*speed, CFG.duration);

  if(CFG.loop && t >= CFG.duration){
    holdT += dt;
    master = 1 - clamp((holdT - CFG.hold)/0.45);
    if(holdT > CFG.hold + 0.45) seek(0);
  }

  if(soundOn && ac){
    for(const b of BEATS)
      if(t >= b.t && !fired.has(b.id)){ fired.add(b.id); CUES[b.id] && CUES[b.id](); }
  } else BEATS.forEach(b => { if(t >= b.t) fired.add(b.id); });

  render(t);

  const np = seg(t, B.name, B.name+0.5);
  elPlate.style.opacity = (CFG.showName && np > 0) ? master : 0;
  elPlate.style.setProperty('--np', eOut(np).toFixed(3));

  /* 👑 Real result card (DOM #cardframe): fade+scale IN -> hold+pulse -> BURST out,
     timed to hand off to the game's sprite reveal (_playSummonSpriteReveal). */
  if (elCard) {
    const IN = 0.30, HOLD = 4.70, END = 6.20;
    let op, sc, glow;
    if (t < IN)        { op = 0; sc = 0.82; glow = 0; }
    else if (t < HOLD) { const u = clamp((t - IN) / 0.6); op = u; sc = 0.82 + 0.18 * eOut(u); glow = 0.35 + 0.22 * Math.sin(amb * 3.2); }
    else if (t < END)  { const b = clamp((t - HOLD) / (END - HOLD)); op = 1 - b * b; sc = 1 + 0.55 * eOut(b); glow = 0.55 + 0.45 * (1 - b); }
    else               { op = 0; sc = 1.55; glow = 0; }
    elCard.style.opacity = (op * master).toFixed(3);
    elCard.style.transform = 'translate(-50%,-50%) scale(' + sc.toFixed(3) + ')';
    elCard.style.filter = 'drop-shadow(0 18px 46px rgba(0,0,0,0.7)) drop-shadow(0 0 ' + Math.round(16 + glow * 64) + 'px rgba(124,63,228,' + (0.35 + glow * 0.5).toFixed(2) + '))';
  }

  requestAnimationFrame(frame);
}
</script>
<script>
// In-game (iframe): drop the preview backdrop, CLEAR the demo card + nameplate so a
// missing override never leaks the demo unit, hide the file's own plate (the game shows
// its own toast), play once, and lay a dark cinematic scrim so the effect reads on any board.
try {
  if (window.self !== window.top) {
    const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove();
    const _cf0 = document.getElementById('cardframe'); if (_cf0) _cf0.style.backgroundImage = 'none';
    const _pn0 = document.getElementById('pName'); if (_pn0) _pn0.textContent = '';
    // Keep the file's NAMEPLATE (fills with the real name via postMessage, animates in at
    // the 'name' beat). NO backdrop — fully transparent (user: "remove the background all
    // together", no white / no dim scrim).
    try { CFG.loop = false; } catch (e) {}
  }
} catch (e) {}
// ?art=<url> fills the card; ?name=<text> overrides the nameplate (in-game the game passes the summoning unit's).
try { const _q = new URLSearchParams(location.search); const _a = _q.get('art'); if (_a) { const _c = document.getElementById('cardframe'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } const _n = _q.get('name'); if (_n) { const _p = document.getElementById('pName'); if (_p) _p.textContent = _n; } } catch (e) {}
// The game delivers the REAL card art + name (base64-safe) via postMessage — apply it.
try {
  window.addEventListener('message', function (ev) {
    try {
      const d = ev && ev.data; if (!d || d.type !== 'mvfx') return;
      if (d.art) { const _c = document.getElementById('cardframe'); if (_c) _c.style.backgroundImage = 'url("' + String(d.art).replace(/"/g, '%22') + '")'; }
      if (typeof d.name === 'string' && d.name) { const _p = document.getElementById('pName'); if (_p) _p.textContent = d.name; }
    } catch (e) {}
  }, false);
} catch (e) {}
</script>
