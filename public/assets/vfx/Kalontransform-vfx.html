<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transform VFX — Cenregon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --violet:#7C3FE4; --ember:#FF3B24; --gold:#F5C453; --bone:#F6EFE3;
  --display:'Anton',Impact,'Arial Narrow Bold',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
/* the checkerboard is the PAGE, not the effect — the canvas layer is transparent */
body{
  display:grid;place-items:center;padding:16px;
  background:transparent;
}
#wrap{position:relative;width:100%;max-width:1280px;aspect-ratio:16/9}
  /* PREVIEW-ONLY backdrop — visible when you open this file directly; removed
     in-game (iframe) so the battlefield shows through. */
  #previewbg{ position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }
  /* 👑 Card art — RIGHT side (opposite the nameplate). Filled from ?art= at
     runtime (the summoning unit's card); demo default below. */
  #cardframe{ position:absolute; right:0.5%; top:50%; transform:translateY(-50%); z-index:5;
    height:58%; aspect-ratio:1024/1536; background:center/contain no-repeat;
    background-image:url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/Cenregon The Final Hope Kalon Mode.png");
    filter:drop-shadow(0 20px 52px rgba(0,0,0,0.72)); pointer-events:none; }
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}

.plate{position:absolute;left:5.2%;bottom:9.5%;pointer-events:none;opacity:0;--np:0}
.plate .eyebrow{
  font-family:var(--display);
  font-size:clamp(8px,.9vw,11px);letter-spacing:.44em;color:var(--gold);margin-bottom:6px;
  clip-path:inset(0 calc((1 - var(--np)) * 100%) 0 0);
}
.plate .pname{
  font-family:var(--display);
  font-size:clamp(28px,5.2vw,64px);line-height:.92;letter-spacing:.06em;color:var(--bone);
  text-shadow:0 0 26px rgba(124,63,228,.85), 0 0 60px rgba(255,59,36,.4), 0 3px 0 #12091f;
  clip-path:inset(0 calc((1 - var(--np)) * 100%) 0 0);
  transform:translateX(calc((1 - var(--np)) * -18px));
}
.plate .rule{
  height:1px;margin-top:9px;width:calc(var(--np) * 260px);max-width:44vw;
  background:linear-gradient(90deg,var(--gold),rgba(245,196,83,0));
}
</style>
</head>
<body>
<div id="previewbg"></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="cardframe"></div>
  <div class="plate" id="plate">
    <div class="eyebrow" id="pEyebrow">ASCENDED FORM</div>
    <div class="pname" id="pName">CENREGON</div>
    <div class="rule"></div>
  </div>
</div>

/* ============================================================
   stage / helpers
   ============================================================ */
const W = 1280, H = 720;
const vcv = document.getElementById('c');
const vctx = vcv.getContext('2d');
/* the VFX layer itself — fixed 1280x720, fully transparent, blitted through a
   master fade so the whole effect can be faded in/out by the game */
const cv = document.createElement('canvas');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
let dpr = 1, master = 1, holdT = 0;

function resize(){
  const r = vcv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  vcv.width  = cv.width  = Math.max(2, Math.round(r.width  * dpr));
  vcv.height = cv.height = Math.max(2, Math.round(r.height * dpr));
  vctx.imageSmoothingEnabled = true;
  vctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', resize);

const clamp = (v,a=0,b=1) => v < a ? a : v > b ? b : v;
const seg = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,u) => a + (b-a)*u;
const eOut = u => 1 - Math.pow(1-u, 3);
const eIn  = u => u*u*u;
const eBack= u => { const c=1.9; return 1 + (c+1)*Math.pow(u-1,3) + c*Math.pow(u-1,2); };
const pulse = (t,a,b) => { const u = seg(t,a,b); return Math.sin(u*Math.PI); };

/* deterministic per-index randoms so scrubbing never desyncs */
function hash(i,s){ let x = Math.sin(i*127.1 + s*311.7) * 43758.5453; return x - Math.floor(x); }

const P = CFG.palette;
function rgba(hex,a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* geometry */
const CARD = {x:640, y:316, w:312, h:429};
const UNIT = {w:589, h:553, cx:640, bottom:662};
UNIT.x = UNIT.cx - UNIT.w/2; UNIT.y = UNIT.bottom - UNIT.h;

/* ============================================================
   assets
   ============================================================ */
const imgCard = new Image(), imgUnit = new Image();
let ready = 0;
imgCard.onload = imgUnit.onload = () => { if(++ready === 2) init(); };
imgCard.src = CFG.card; imgUnit.src = CFG.unit;

let unitWhite, maskCv, maskCtx, maskImg, edgeCv, edgeCtx, edgeImg, noise, bias;
let MW, MH, shards = [], stars = [];

function init(){
  /* white-hot silhouette of the unit */
  unitWhite = document.createElement('canvas');
  unitWhite.width = imgUnit.width; unitWhite.height = imgUnit.height;
  const uw = unitWhite.getContext('2d');
  uw.drawImage(imgUnit,0,0);
  uw.globalCompositeOperation = 'source-in';
  uw.fillStyle = '#fff'; uw.fillRect(0,0,unitWhite.width,unitWhite.height);

  /* dissolve mask buffers (low-res, scaled up — noise reads chunky on purpose) */
  MW = 200; MH = Math.round(MW * imgUnit.height / imgUnit.width);
  maskCv = document.createElement('canvas'); maskCv.width=MW; maskCv.height=MH;
  maskCtx = maskCv.getContext('2d'); maskImg = maskCtx.createImageData(MW,MH);
  edgeCv = document.createElement('canvas'); edgeCv.width=MW; edgeCv.height=MH;
  edgeCtx = edgeCv.getContext('2d'); edgeImg = edgeCtx.createImageData(MW,MH);

  noise = new Float32Array(MW*MH); bias = new Float32Array(MW*MH);
  const grid = [];
  for(let o=0;o<3;o++){
    const s = 6 << o, g = new Float32Array((s+1)*(s+1));
    for(let i=0;i<g.length;i++) g[i] = Math.random();
    grid.push({s,g});
  }
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    let v=0, amp=0.62, tot=0;
    for(const {s,g} of grid){
      const fx=(x/MW)*s, fy=(y/MH)*s;
      const x0=Math.floor(fx), y0=Math.floor(fy), tx=fx-x0, ty=fy-y0;
      const a=g[y0*(s+1)+x0], b=g[y0*(s+1)+x0+1], c=g[(y0+1)*(s+1)+x0], d=g[(y0+1)*(s+1)+x0+1];
      const sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
      v += (a+(b-a)*sx + ((c+(d-c)*sx)-(a+(b-a)*sx))*sy) * amp;
      tot += amp; amp *= 0.5;
    }
    const i = y*MW+x;
    noise[i] = v/tot;
    bias[i]  = (1 - y/MH) * 0.5;          // bottom materialises first
  }
  for(let i=0;i<MW*MH;i++){ maskImg.data[i*4]=255; maskImg.data[i*4+1]=255; maskImg.data[i*4+2]=255; }
  const ec = parseInt(P.core.slice(1),16);
  for(let i=0;i<MW*MH;i++){ edgeImg.data[i*4]=ec>>16&255; edgeImg.data[i*4+1]=ec>>8&255; edgeImg.data[i*4+2]=ec&255; }

  buildShards();
  for(let i=0;i<150;i++) stars.push({
    x:hash(i,1)*W, y:hash(i,2)*H, r:0.4+hash(i,3)*1.5,
    a:0.15+hash(i,4)*0.55, sp:0.25+hash(i,5)*1.1, hue:hash(i,6)
  });

  document.getElementById('pName').textContent = CFG.name;
  document.getElementById('pEyebrow').textContent = CFG.eyebrow;
  resize();
  if(reduced) CFG.loop = false;
  if(!reduced) playing = true;
  else t = CFG.duration;
  requestAnimationFrame(frame);
}

/* shards: cut the card into a grid, aim each at a real point on the unit's body */
const COLS = 10, ROWS = 14;
function buildShards(){
  /* sample opaque pixels of the unit */
  const sw = 150, sh = Math.round(150 * imgUnit.height / imgUnit.width);
  const sc = document.createElement('canvas'); sc.width=sw; sc.height=sh;
  const sx = sc.getContext('2d'); sx.drawImage(imgUnit,0,0,sw,sh);
  const d = sx.getImageData(0,0,sw,sh).data, pts=[];
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++)
    if(d[(y*sw+x)*4+3] > 130) pts.push([x/sw, y/sh]);

  const cw = CARD.w/COLS, ch = CARD.h/ROWS;
  const sxw = imgCard.width/COLS, syh = imgCard.height/ROWS;
  let n = 0;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const i = n++;
    const nx = (c+0.5)/COLS, ny = (r+0.5)/ROWS;
    /* pick the closest of a few random body points to keep the artwork's layout readable */
    let best = pts[0], bd = 9;
    for(let k=0;k<26;k++){
      const p = pts[(Math.random()*pts.length)|0];
      const dd = (p[0]-nx)**2 + (p[1]-ny)**2*0.6;
      if(dd < bd){ bd = dd; best = p; }
    }
    const ang = (nx-0.5)*2.6 + (hash(i,11)-0.5)*1.5 - Math.PI/2 + (ny-0.5)*1.4;
    shards.push({
      sx: c*sxw, sy: r*syh, sw: sxw, sh: syh,
      ox: (nx-0.5)*CARD.w, oy: (ny-0.5)*CARD.h, w: cw+1.2, h: ch+1.2,
      dir: ang, spd: 300 + hash(i,12)*620,
      spin: (hash(i,13)-0.5)*11,
      tx: UNIT.x + best[0]*UNIT.w, ty: UNIT.y + best[1]*UNIT.h,
      arrive: 0.55 + hash(i,14)*0.95,
      jx: (hash(i,15)-0.5), jy: (hash(i,16)-0.5)
    });
  }
}

/* ============================================================
   camera shake — impulse list, sampled not integrated
   ============================================================ */
const SHAKE = [
  {t:B.seal,     a:7,  d:0.34},
  {t:B.lock,     a:5,  d:0.30},
  {t:B.burst,    a:26, d:0.50},
  {t:B.impact,   a:19, d:0.55}
];
function shakeAt(t){
  let x=0,y=0;
  for(const s of SHAKE){
    if(t < s.t) continue;
    const k = Math.exp(-(t-s.t)/s.d*3.2) * s.a;
    if(k < 0.05) continue;
    x += Math.sin((t-s.t)*97)*k; y += Math.cos((t-s.t)*123)*k*0.7;
  }
  return [x,y];
}

/* ============================================================
   draw
   ============================================================ */
function drawBg(t){
  /* additive charge haze — brightens whatever is underneath, never darkens it */
  const chargeU = seg(t,0,B.fracture);
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(640,430,40, 640,430, 600);
  g.addColorStop(0, rgba(P.arc, 0.10 + chargeU*0.15));
  g.addColorStop(0.45, rgba(P.arc, 0.05));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(640,430,600,0,7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* dust drawn inward during charge, blown out at burst */
  const pullIn = seg(t,0,B.burst), blow = seg(t,B.burst,B.burst+1.4);
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<stars.length;i++){
    const s = stars[i];
    const dx = 640-s.x, dy = 430-s.y, dist = Math.hypot(dx,dy)||1;
    const drift = amb*s.sp*14;
    let px = s.x + (dx/dist)*pullIn*70 - (dx/dist)*eOut(blow)*520;
    let py = s.y + (dy/dist)*pullIn*70 - (dy/dist)*eOut(blow)*520 - (drift%H)*0.06;
    const tw = 0.6 + 0.4*Math.sin(amb*3 + i);
    const fall = clamp(1 - Math.hypot(px-640, (py-430)*1.35)/560);
    if(fall <= 0) continue;
    const av = s.a*tw*fall;
    ctx.fillStyle = s.hue > 0.72 ? rgba(P.arc, av) : `rgba(200,215,255,${av*0.8})`;
    ctx.fillRect(px, py, s.r, s.r);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawSeal(t){
  const up = seg(t, B.seal, B.seal+0.7);
  if(up <= 0) return;
  const fade = 1 - seg(t, B.burst, B.burst+0.35)*0.55;
  const R = 300 * eOut(up);
  ctx.save();
  ctx.translate(640, GROUND); ctx.scale(1, 0.30);
  ctx.globalCompositeOperation = 'lighter';

  const pool = ctx.createRadialGradient(0,0,10, 0,0, R*1.15);
  pool.addColorStop(0, rgba(P.arc, 0.55*up*fade));
  pool.addColorStop(0.55, rgba(P.arc, 0.14*up*fade));
  pool.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(0,0,R*1.15,0,7); ctx.fill();

  const rings = [[1,0.55,1.6],[0.78,-0.9,1],[0.52,1.5,1]];
  rings.forEach(([k,sp,lw],ri)=>{
    ctx.strokeStyle = rgba(ri===1?P.gold:P.charge, 0.55*up*fade);
    ctx.lineWidth = lw*2.2;
    ctx.beginPath(); ctx.arc(0,0,R*k,0,7); ctx.stroke();
    /* tick marks encode the ring's rotation */
    const n = 12 + ri*10;
    for(let i=0;i<n;i++){
      const a = amb*sp + i/n*Math.PI*2;
      const r0 = R*k*0.94, r1 = R*k*1.06;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
      ctx.lineTo(Math.cos(a)*r1, Math.sin(a)*r1);
      ctx.stroke();
    }
  });
  /* hexagon */
  ctx.strokeStyle = rgba(P.core, 0.5*up*fade); ctx.lineWidth = 3;
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = amb*0.35 + i/6*Math.PI*2, r = R*0.86;
    i ? ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';

  /* light column rising out of the seal */
  const col = up * (1 - seg(t,B.burst,B.burst+0.4));
  if(col > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    const SL = 26, halfW = 200;
    for(let i=0;i<SL;i++){
      const u = (i+0.5)/SL, fx = 640 - halfW + u*halfW*2;
      const soft = Math.pow(Math.sin(u*Math.PI), 1.6);      // no hard vertical edges
      const lg = ctx.createLinearGradient(0,GROUND,0,GROUND-600);
      lg.addColorStop(0, rgba(P.arc, 0.30*col*soft));
      lg.addColorStop(0.75, rgba(P.arc, 0.05*col*soft));
      lg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(fx, GROUND-600, halfW*2/SL + 1, 600);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

function cardTransform(t){
  /* entry: arcs up from below, spinning face-down, snaps face-up */
  const u = seg(t, B.cardin, B.seal);
  const e = eOut(u);
  const x = lerp(640, CARD.x, e);
  const y = lerp(H+280, CARD.y, e) + Math.sin(t*1.6)*7*seg(t,B.seal,B.seal+0.4);
  const rotY = (1-e) * Math.PI * 3.5;
  const tilt = (1-e) * 0.5;
  const sc = lerp(0.42, 1, e);
  /* vibration once the lances lock on */
  const vib = seg(t, B.lock, B.fracture);
  return {x: x + Math.sin(t*80)*vib*3, y: y + Math.cos(t*71)*vib*2.5, rotY, tilt, sc};
}

function drawCardBack(w,h){
  ctx.fillStyle = '#0B0716'; roundRect(-w/2,-h/2,w,h,10); ctx.fill();
  ctx.strokeStyle = rgba(P.gold,0.85); ctx.lineWidth = 3;
  roundRect(-w/2+7,-h/2+7,w-14,h-14,7); ctx.stroke();
  ctx.strokeStyle = rgba(P.gold,0.3); ctx.lineWidth = 1;
  roundRect(-w/2+16,-h/2+16,w-32,h-32,4); ctx.stroke();
  ctx.save(); ctx.rotate(Math.PI/4);
  const s = w*0.24;
  ctx.fillStyle = rgba(P.arc,0.9); ctx.fillRect(-s/2,-s/2,s,s);
  ctx.strokeStyle = rgba(P.gold,0.9); ctx.lineWidth = 2; ctx.strokeRect(-s/2,-s/2,s,s);
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawCard(t){
  if(t < B.cardin || t >= B.fracture) return;
  const T = cardTransform(t);
  const w = CARD.w*T.sc, h = CARD.h*T.sc;

  /* motion trail on the way in */
  const inU = seg(t,B.cardin,B.seal);
  if(inU > 0 && inU < 1){
    ctx.globalAlpha = 0.16;
    for(let k=1;k<=4;k++){
      const tt = t - k*0.035; if(tt < B.cardin) break;
      const G = cardTransform(tt);
      ctx.save(); ctx.translate(G.x,G.y); ctx.rotate(G.tilt);
      ctx.transform(Math.cos(G.rotY),0,0,1,0,0);
      ctx.fillStyle = rgba(P.arc,0.6);
      roundRect(-CARD.w*G.sc/2,-CARD.h*G.sc/2,CARD.w*G.sc,CARD.h*G.sc,9); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(T.x, T.y); ctx.rotate(T.tilt);
  const face = Math.cos(T.rotY);
  ctx.transform(Math.abs(face) < 0.02 ? 0.02 : face, 0, 0, 1, 0, 0);

  /* backlight */
  ctx.globalCompositeOperation = 'lighter';
  const bl = ctx.createRadialGradient(0,0,10,0,0,h*0.8);
  const heat = 0.25 + seg(t,B.lock,B.fracture)*0.75;
  bl.addColorStop(0, rgba(P.arc, 0.5*heat)); bl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = bl; ctx.fillRect(-w,-h,w*2,h*2);
  ctx.globalCompositeOperation = 'source-over';

  if(face >= 0){
    ctx.drawImage(imgCard, -w/2, -h/2, w, h);
  } else {
    ctx.save(); ctx.scale(-1,1); drawCardBack(w,h); ctx.restore();
  }

  /* edge rim + charge seams */
  ctx.strokeStyle = rgba(P.gold, 0.5 + seg(t,B.lock,B.fracture)*0.5);
  ctx.lineWidth = 2.5;
  roundRect(-w/2,-h/2,w,h,8); ctx.stroke();

  const arc = seg(t,B.lock,B.fracture);
  if(arc > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(P.charge, 0.75*arc);
    ctx.lineWidth = 1.4;
    for(let i=0;i<7;i++){
      const s = Math.floor(t*22) + i;
      ctx.beginPath();
      let px = -w/2, py = (hash(s,20)-0.5)*h;
      ctx.moveTo(px,py);
      for(let k=0;k<6;k++){
        px += w/6; py += (hash(s+k*7,21)-0.5)*h*0.22;
        ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  /* light lances converging on the card */
  if(arc > 0 && t < B.burst){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<6;i++){
      const a = i/6*Math.PI*2 + 0.3;
      const far = 900, u = eOut(arc);
      const x1 = T.x + Math.cos(a)*far, y1 = T.y + Math.sin(a)*far*0.7;
      const x2 = T.x + Math.cos(a)*lerp(far, w*0.5, u), y2 = T.y + Math.sin(a)*lerp(far, h*0.5, u)*0.7;
      const lg = ctx.createLinearGradient(x1,y1,x2,y2);
      lg.addColorStop(0,'rgba(0,0,0,0)'); lg.addColorStop(1, rgba(P.charge, 0.55*arc));
      ctx.strokeStyle = lg; ctx.lineWidth = 2 + arc*4;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawShards(t){
  if(t < B.fracture) return;
  const frac = seg(t, B.fracture, B.burst);
  const T = cardTransform(t);
  for(let i=0;i<shards.length;i++){
    const s = shards[i];
    let x,y,rot,sc,alpha;
    if(t < B.burst){
      const j = frac * 7;
      x = T.x + s.ox + s.jx*j; y = T.y + s.oy + s.jy*j;
      rot = (hash(i,30)-0.5)*frac*0.25; sc = 1; alpha = 1;
    } else {
      const dur = 0.42 + s.arrive;
      const u = seg(t, B.burst, B.burst + dur);
      const eu = eOut(u);
      const ox = T.x + s.ox, oy = T.y + s.oy;
      const bx = ox + Math.cos(s.dir)*s.spd*0.55;
      const by = oy + Math.sin(s.dir)*s.spd*0.55;
      /* quadratic: blown outward, then reeled into the body */
      const iu = 1-eu;
      x = iu*iu*ox + 2*iu*eu*bx + eu*eu*s.tx;
      y = iu*iu*oy + 2*iu*eu*by + eu*eu*s.ty;
      rot = s.spin*eu; sc = lerp(1, 0.3, eu*eu);
      alpha = 1 - seg(u, 0.78, 1);
      if(u >= 1) continue;
    }
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot); ctx.globalAlpha = alpha;
    ctx.drawImage(imgCard, s.sx, s.sy, s.sw, s.sh, -s.w/2*sc, -s.h/2*sc, s.w*sc, s.h*sc);
    if(t < B.burst){ /* glowing seams while it holds together */
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(P.charge, 0.5*frac);
      ctx.lineWidth = 1; ctx.strokeRect(-s.w/2, -s.h/2, s.w, s.h);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawUnit(t){
  if(t < B.burst) return;
  const mat = seg(t, B.material, B.impact);
  const settle = seg(t, B.impact, B.impact+0.45);
  const squash = 1 - Math.sin(settle*Math.PI)*0.045;
  const hover = Math.sin(amb*1.5)*3*settle;

  ctx.save();
  ctx.translate(UNIT.cx, UNIT.bottom + hover);
  ctx.scale(1/squash, squash);
  const dx = -UNIT.w/2, dy = -UNIT.h;

  /* aura behind */
  const aur = seg(t,B.material,B.impact+0.3);
  if(aur>0){
    ctx.globalCompositeOperation = 'lighter';
    const p = 0.75 + 0.25*Math.sin(amb*2.4);
    const ag = ctx.createRadialGradient(0,-UNIT.h*0.5,20, 0,-UNIT.h*0.5, UNIT.w*0.72);
    ag.addColorStop(0, rgba(P.core, 0.34*aur*p));
    ag.addColorStop(0.5, rgba(P.arc, 0.20*aur*p));
    ag.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ag;
    ctx.fillRect(-UNIT.w, -UNIT.h*1.3, UNIT.w*2, UNIT.h*1.5);
    ctx.globalCompositeOperation = 'source-over';
  }

  if(mat >= 1){
    ctx.drawImage(imgUnit, dx, dy, UNIT.w, UNIT.h);
  } else if(mat > 0){
    /* noise dissolve, bottom-up, with a burning edge */
    const th = mat*1.55 - 0.28;
    const md = maskImg.data, ed = edgeImg.data;
    for(let i=0, n=MW*MH; i<n; i++){
      const v = th - (noise[i] + bias[i]);
      md[i*4+3] = clamp(v*11)*255;
      ed[i*4+3] = clamp(1 - Math.abs(v)*13)*255;
    }
    maskCtx.putImageData(maskImg,0,0);
    edgeCtx.putImageData(edgeImg,0,0);

    let tmp = drawUnit._tmp;
    if(!tmp){
      tmp = drawUnit._tmp = document.createElement('canvas');
      tmp.width = imgUnit.width; tmp.height = imgUnit.height;
    }
    const tc = tmp.getContext('2d');
    tc.clearRect(0,0,tmp.width,tmp.height);
    tc.drawImage(imgUnit,0,0);
    tc.globalCompositeOperation = 'destination-in';
    tc.drawImage(maskCv,0,0,tmp.width,tmp.height);
    ctx.drawImage(tmp, dx, dy, UNIT.w, UNIT.h);

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.95;
    ctx.drawImage(edgeCv, dx, dy, UNIT.w, UNIT.h);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* white-hot silhouette punched through the flash, and again on impact */
  const sil = Math.max(pulse(t, B.burst, B.material+0.35), pulse(t, B.impact, B.impact+0.22)*0.55);
  if(sil > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = sil;
    ctx.drawImage(unitWhite, dx, dy, UNIT.w, UNIT.h);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  /* contact shadow */
  if(mat > 0.2){
    ctx.save(); ctx.globalCompositeOperation = 'multiply';
    const sg = ctx.createRadialGradient(UNIT.cx, GROUND, 5, UNIT.cx, GROUND, 240);
    sg.addColorStop(0,'rgba(0,0,0,0.42)'); sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = sg; ctx.beginPath();
    ctx.ellipse(UNIT.cx, GROUND, 240, 34, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
}

function drawImpact(t){
  /* burst shockwaves */
  for(const [start, count, color] of [[B.burst,3,P.core],[B.impact,2,P.gold]]){
    for(let k=0;k<count;k++){
      const u = seg(t, start + k*0.07, start + 0.85 + k*0.12);
      if(u <= 0 || u >= 1) continue;
      const r = eOut(u) * (start===B.burst ? 600 : 400);
      const a = Math.pow(1-u, 1.7) * (start===B.burst ? 0.85 : 0.55);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.translate(640, start===B.burst ? CARD.y : GROUND);
      if(start===B.impact) ctx.scale(1,0.22);
      ctx.lineWidth = (1-u)*16 + 1;
      [[-3,P.charge],[0,color],[3,P.arc]].forEach(([off,cc])=>{
        ctx.strokeStyle = rgba(cc, a*0.55);
        ctx.beginPath(); ctx.arc(0,0,Math.max(r+off,1),0,7); ctx.stroke();
      });
      ctx.restore();
    }
  }

  /* full-frame flash */
  const fl = Math.pow(1 - seg(t, B.burst, B.burst+0.42), 2.2) * (t>=B.burst?1:0);
  if(fl > 0.002){
    ctx.globalCompositeOperation = 'lighter';
    const FR = 700;
    const fg = ctx.createRadialGradient(640,CARD.y,20, 640,CARD.y, FR);
    fg.addColorStop(0, `rgba(255,255,255,${fl})`);
    fg.addColorStop(0.30, rgba(P.charge, fl*0.55));
    fg.addColorStop(0.62, `rgba(255,255,255,${fl*0.14})`);
    fg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(640,CARD.y,FR,0,7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ground dust ring on the landing */
  const du = seg(t, B.impact, B.impact+1.0);
  if(du > 0 && du < 1){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<26;i++){
      const a = hash(i,40)*Math.PI*2;
      const r = eOut(du)*(160+hash(i,41)*260);
      const x = 640 + Math.cos(a)*r, y = GROUND - Math.sin(du*Math.PI)*(20+hash(i,42)*60) + Math.sin(a)*r*0.18;
      ctx.fillStyle = rgba(P.gold, (1-du)*0.25);
      ctx.beginPath(); ctx.arc(x,y, 6+hash(i,43)*22, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  /* ambient embers once it's alive */
  const em = seg(t, B.impact, B.impact+0.6);
  if(em > 0){
    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<44;i++){
      const life = ((amb*0.32 + hash(i,50)) % 1);
      const x = 640 + (hash(i,51)-0.5)*560 + Math.sin(amb*1.4 + i)*16;
      const y = GROUND - life*520;
      const a = Math.sin(life*Math.PI) * 0.65 * em;
      ctx.fillStyle = rgba(hash(i,52)>0.5?P.core:P.gold, a);
      const s = 1.2 + hash(i,53)*2.4;
      ctx.fillRect(x,y,s,s*2.2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

function render(t){
  const [sx,sy] = shakeAt(t);
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(sx,sy);
  drawBg(t); drawSeal(t); drawCard(t); drawUnit(t); drawShards(t); drawImpact(t);
  ctx.restore();

  vctx.setTransform(1,0,0,1,0,0);
  vctx.clearRect(0,0,vcv.width,vcv.height);
  vctx.globalAlpha = master;
  vctx.drawImage(cv, 0, 0);
  vctx.globalAlpha = 1;
}

/* ============================================================
   audio — synthesised stinger, no assets
   ============================================================ */
let ac = null, soundOn = CFG.sound, fired = new Set();
function ensureAudio(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(ac.state === 'suspended') ac.resume();
}
function tone(type, f0, f1, dur, gain, when=0){
  if(!ac) return;
  const t0 = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0+dur*0.12);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+dur+0.05);
}
function noiseHit(dur, gain, type='lowpass', f=900, when=0){
  if(!ac) return;
  const t0 = ac.currentTime + when;
  const n = Math.floor(ac.sampleRate*dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 2.2);
  const s = ac.createBufferSource(); s.buffer = buf;
  const bq = ac.createBiquadFilter(); bq.type = type; bq.frequency.value = f;
  const g = ac.createGain(); g.gain.value = gain;
  s.connect(bq).connect(g).connect(ac.destination); s.start(t0);
}
const CUES = {
  cardin:  () => { tone('triangle', 900, 240, 0.35, 0.09); noiseHit(0.25, 0.10, 'highpass', 2400); },
  seal:    () => { tone('sine', 90, 55, 0.5, 0.16); tone('sawtooth', 120, 900, 1.6, 0.045); },
  lock:    () => { tone('square', 300, 1400, 0.55, 0.035); noiseHit(0.4, 0.05,'bandpass',1800); },
  fracture:() => { noiseHit(0.5, 0.13, 'highpass', 1500); tone('sawtooth', 400, 1900, 0.45, 0.05); },
  burst:   () => { tone('sine', 180, 32, 0.7, 0.32); noiseHit(0.9, 0.24,'lowpass',1400); noiseHit(0.5,0.14,'highpass',3000); },
  material:() => { [523,659,784].forEach((f,i)=>tone('triangle', f, f*1.5, 0.9, 0.05, i*0.09)); },
  impact:  () => { tone('sine', 150, 26, 0.85, 0.34); noiseHit(0.7, 0.2,'lowpass',700); },
  name:    () => { tone('triangle', 1200, 700, 0.3, 0.06); noiseHit(0.2,0.07,'highpass',3000); }
};

/* ============================================================
   transport
   ============================================================ */
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let t = 0, amb = 0, playing = false, speed = 1, last = performance.now();
const elPlate = document.getElementById('plate');

/* seek(0) is the trigger — call it from the game when a unit transforms */
function seek(v){
  t = clamp(v, 0, CFG.duration);
  holdT = 0; master = 1;
  fired.clear();
  BEATS.forEach(b => { if(t >= b.t) fired.add(b.id); });
  playing = true;
  ensureAudio();
}
vcv.addEventListener('pointerdown', () => seek(0));

document.addEventListener('pointerdown', function once(){
  if(soundOn) ensureAudio();
  document.removeEventListener('pointerdown', once);
});

function frame(now){
  const dt = Math.min((now - last)/1000, 0.05); last = now;
  amb += dt;
  if(playing && t < CFG.duration) t = Math.min(t + dt*speed, CFG.duration);

  /* preview loop: hold the idle pose, fade the layer out, replay */
  if(CFG.loop && t >= CFG.duration){
    holdT += dt;
    master = 1 - clamp((holdT - CFG.hold)/0.45);
    if(holdT > CFG.hold + 0.45) seek(0);
  }

  if(soundOn && ac){
    for(const b of BEATS){
      if(t >= b.t && !fired.has(b.id)){ fired.add(b.id); CUES[b.id] && CUES[b.id](); }
    }
  } else { BEATS.forEach(b => { if(t >= b.t) fired.add(b.id); }); }

  render(t);

  /* nameplate */
  const np = seg(t, B.name, B.name+0.5);
  elPlate.style.opacity = (CFG.showName && np > 0) ? master : 0;
  elPlate.style.setProperty('--np', eOut(np).toFixed(3));

  requestAnimationFrame(frame);
}
</script>
<script>
// In-game (iframe): drop the preview backdrop, CLEAR the demo card + nameplate so a
// missing override never leaks the "Cenregon" demo unit, and lay a dark cinematic
// scrim so the transform reads dramatically instead of washing out on a light board.
try {
  if (window.self !== window.top) {
    const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove();
    const _cf0 = document.getElementById('cardframe'); if (_cf0) _cf0.style.backgroundImage = 'none';
    const _pn0 = document.getElementById('pName'); if (_pn0) _pn0.textContent = '';
    const _scrim = document.createElement('div');
    _scrim.id = 'ingamebg';
    _scrim.style.cssText = 'position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 46%, rgba(6,8,15,0.86) 0%, rgba(6,8,15,0.66) 44%, rgba(6,8,15,0.32) 74%, rgba(6,8,15,0) 100%);';
    document.body.appendChild(_scrim);
  }
} catch (e) {}
// ?art=<url> fills the card; ?name=<text> overrides the nameplate (in-game the game passes the summoning unit's).
try { const _q = new URLSearchParams(location.search); const _a = _q.get('art'); if (_a) { const _c = document.getElementById('cardframe'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } const _n = _q.get('name'); if (_n) { const _p = document.getElementById('pName'); if (_p) _p.textContent = _n; } } catch (e) {}
// The game delivers the REAL card art + name via postMessage (base64-safe, not limited
// by iframe src length) once this frame loads — apply it so the correct unit shows.
try {
  window.addEventListener('message', function (ev) {
    try {
      const d = ev && ev.data; if (!d || d.type !== 'mvfx') return;
      if (d.art) { const _c = document.getElementById('cardframe'); if (_c) _c.style.backgroundImage = 'url("' + String(d.art).replace(/"/g, '%22') + '")'; }
      if (typeof d.name === 'string' && d.name) { const _p = document.getElementById('pName'); if (_p) _p.textContent = d.name; }
    } catch (e) {}
  }, false);
} catch (e) {}
</script>
