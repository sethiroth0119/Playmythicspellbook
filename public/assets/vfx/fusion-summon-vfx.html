<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusion Summon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{ --gold:#F5C453; --bone:#F6EFE3; --display:'Anton',Impact,'Arial Narrow Bold',sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
/* checkerboard is the PAGE — the canvas layer itself is fully transparent */
body{
  display:grid;place-items:center;padding:16px;
  background:transparent;
}
#wrap{position:relative;width:100%;max-width:1280px;aspect-ratio:16/9}
  /* PREVIEW-ONLY backdrop — visible when you open this file directly; removed
     in-game (iframe) so the battlefield shows through. */
  #previewbg{ position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }
  /* 👑 Card art — RIGHT side (opposite the nameplate). Filled from ?art= at
     runtime (the summoning unit's card); demo default below. */
  #cardframe{ position:absolute; left:50%; top:48%; z-index:5;
    height:74%; aspect-ratio:1024/1536; background:center/contain no-repeat;
    background-image:url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/Cenregon The Final Hope Kalon Mode.png");
    transform:translate(-50%,-50%) scale(0.82); opacity:0;
    filter:drop-shadow(0 20px 52px rgba(0,0,0,0.72)); pointer-events:none; will-change:transform,opacity,filter; }
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}

.plate{position:absolute;left:5.2%;bottom:9%;pointer-events:none;opacity:0;--np:0}
.plate .eyebrow{
  font-family:var(--display);font-size:clamp(8px,.9vw,11px);letter-spacing:.44em;
  color:var(--gold);margin-bottom:6px;
  clip-path:inset(0 calc((1 - var(--np)) * 100%) 0 0);
}
.plate .pname{
  font-family:var(--display);font-size:clamp(26px,5vw,62px);line-height:.92;
  letter-spacing:.06em;color:var(--bone);
  text-shadow:0 0 26px rgba(124,63,228,.85), 0 0 60px rgba(255,59,36,.42), 0 3px 0 #12091f;
  clip-path:inset(0 calc((1 - var(--np)) * 100%) 0 0);
  transform:translateX(calc((1 - var(--np)) * -18px));
}
.plate .rule{
  height:1px;margin-top:9px;width:calc(var(--np) * 300px);max-width:46vw;
  background:linear-gradient(90deg,var(--gold),rgba(245,196,83,0));
}
</style>
</head>
<body>
<div id="previewbg"></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="cardframe"></div>
  <div class="plate" id="plate">
    <div class="eyebrow" id="pEyebrow">FUSION &nbsp;//&nbsp; CENREGON</div>
    <div class="pname" id="pName">CENREGON</div>
    <div class="rule"></div>
  </div>
</div>

function resize(){

}

const clamp = (v,a=0,b=1) => v < a ? a : v > b ? b : v;
const seg = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,u) => a + (b-a)*u;
const eOut = u => 1 - Math.pow(1-u, 3);
const eIO  = u => u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u+2,3)/2;
const pulse = (t,a,b) => Math.sin(seg(t,a,b)*Math.PI);
function hash(i,s){ const x = Math.sin(i*127.1 + s*311.7) * 43758.5453; return x - Math.floor(x); }

const P = CFG.palette;
function rgba(hex,a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
function mix(h1,h2,u){
  const a = parseInt(h1.slice(1),16), b = parseInt(h2.slice(1),16);
  const r = Math.round(lerp(a>>16&255, b>>16&255, u));
  const g = Math.round(lerp(a>>8&255, b>>8&255, u));
  const bl= Math.round(lerp(a&255, b&255, u));
  return '#' + ((1<<24) + (r<<16) + (g<<8) + bl).toString(16).slice(1);
}

const imgM = [new Image(), new Image()], imgU = new Image();
let loaded = 0;
const done = () => { if(++loaded === 3) init(); };
imgM[0].onload = imgM[1].onload = imgU.onload = done;

let unitWhite, maskCv, maskCtx, maskImg, edgeCv, edgeCtx, edgeImg, noise, bias;
let MW, MH, shards = [], motes = [], strips = [];

const STRIPS = 18;

function init(){
  unitWhite = document.createElement('canvas');
  unitWhite.width = imgU.width; unitWhite.height = imgU.height;
  const uw = unitWhite.getContext('2d');
  uw.drawImage(imgU,0,0);
  uw.globalCompositeOperation = 'source-in';
  uw.fillStyle = '#fff'; uw.fillRect(0,0,unitWhite.width,unitWhite.height);

  MW = 200; MH = Math.round(MW * imgU.height / imgU.width);
  maskCv = document.createElement('canvas'); maskCv.width=MW; maskCv.height=MH;
  maskCtx = maskCv.getContext('2d'); maskImg = maskCtx.createImageData(MW,MH);
  edgeCv = document.createElement('canvas'); edgeCv.width=MW; edgeCv.height=MH;
  edgeCtx = edgeCv.getContext('2d'); edgeImg = edgeCtx.createImageData(MW,MH);

  noise = new Float32Array(MW*MH); bias = new Float32Array(MW*MH);
  const grid = [];
  for(let o=0;o<3;o++){
    const s = 6 << o, g = new Float32Array((s+1)*(s+1));
    for(let i=0;i<g.length;i++) g[i] = Math.random();
    grid.push({s,g});
  }
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    let v=0, amp=0.62, tot=0;
    for(const {s,g} of grid){
      const fx=(x/MW)*s, fy=(y/MH)*s;
      const x0=Math.floor(fx), y0=Math.floor(fy), tx=fx-x0, ty=fy-y0;
      const a=g[y0*(s+1)+x0], b=g[y0*(s+1)+x0+1], c=g[(y0+1)*(s+1)+x0], d=g[(y0+1)*(s+1)+x0+1];
      const sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
      const top = a+(b-a)*sx, bot = c+(d-c)*sx;
      v += (top + (bot-top)*sy)*amp; tot += amp; amp *= 0.5;
    }
    const i = y*MW+x;
    noise[i] = v/tot;
    bias[i]  = (1 - y/MH) * 0.5;      // builds from the ground up
  }
  for(let i=0;i<MW*MH;i++){ maskImg.data[i*4]=255; maskImg.data[i*4+1]=255; maskImg.data[i*4+2]=255; }
  const ec = parseInt(P.core.slice(1),16);
  for(let i=0;i<MW*MH;i++){ edgeImg.data[i*4]=ec>>16&255; edgeImg.data[i*4+1]=ec>>8&255; edgeImg.data[i*4+2]=ec&255; }

  /* the weave: alternating vertical slices, each cut from its own material
     at the matching position, so the two artworks interlock in register */
  for(let i=0;i<STRIPS;i++){
    const k = i % 2;
    strips.push({
      k, i,
      u0: i/STRIPS, u1: (i+1)/STRIPS,
      delay: 0.03*Math.abs(i - (STRIPS-1)/2) + hash(i,60)*0.05
    });
  }

  buildShards();
  for(let i=0;i<140;i++) motes.push({
    x:hash(i,1)*W, y:hash(i,2)*H, r:0.4+hash(i,3)*1.6,
    a:0.15+hash(i,4)*0.5, sp:0.25+hash(i,5)*1.1, hue:hash(i,6)
  });

  document.getElementById('pName').textContent = CFG.name;
  document.getElementById('pEyebrow').innerHTML = CFG.eyebrow;
  resize();
  if(reduced){ CFG.loop = false; t = CFG.duration; } else playing = true;
  requestAnimationFrame(frame);
}

/* shards inherit the weave: column parity decides which material the piece
   came from, and every piece is aimed at a real point on the fusion's body */
const COLS = 12, ROWS = 14;
function buildShards(){
  const sw = 150, sh = Math.round(150 * imgU.height / imgU.width);
  const sc = document.createElement('canvas'); sc.width=sw; sc.height=sh;
  const sx = sc.getContext('2d'); sx.drawImage(imgU,0,0,sw,sh);
  const d = sx.getImageData(0,0,sw,sh).data, pts=[];
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++)
    if(d[(y*sw+x)*4+3] > 130) pts.push([x/sw, y/sh]);

  const cw = CARD.w/COLS, ch = CARD.h/ROWS;
  let n = 0;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const i = n++, k = c % 2;
    const nx = (c+0.5)/COLS, ny = (r+0.5)/ROWS;
    let best = pts[0], bd = 9;
    for(let q=0;q<26;q++){
      const p = pts[(Math.random()*pts.length)|0];
      const dd = (p[0]-nx)**2 + (p[1]-ny)**2*0.6;
      if(dd < bd){ bd = dd; best = p; }
    }
    shards.push({
      card:k,
      sx:(c/COLS)*imgM[k].width, sy:(r/ROWS)*imgM[k].height,
      sw:imgM[k].width/COLS, sh:imgM[k].height/ROWS,
      ox:(nx-0.5)*CARD.w, oy:(ny-0.5)*CARD.h, w:cw+1.2, h:ch+1.2,
      dir: hash(i,10)*Math.PI*2, out: 200 + hash(i,11)*460,
      spin: (hash(i,12)-0.5)*10,
      tx: UNIT.x + best[0]*UNIT.w, ty: UNIT.y + best[1]*UNIT.h,
      arrive: 0.55 + hash(i,13)*0.9
    });
  }
}

/* ============================================================
   camera shake
   ============================================================ */
const SHAKE = [
  {t:B.cardin+0.62, a:6,  d:0.30},
  {t:B.glyph,       a:7,  d:0.34},
  {t:B.spiral,      a:6,  d:0.30},
  {t:B.merge,       a:22, d:0.45},
  {t:B.compress,    a:10, d:0.50},
  {t:B.burst,       a:28, d:0.52},
  {t:B.impact,      a:20, d:0.55}
];
function shakeAt(t){
  let x=0,y=0;
  for(const s of SHAKE){
    if(t < s.t) continue;
    const k = Math.exp(-(t-s.t)/s.d*3.2) * s.a;
    if(k < 0.05) continue;
    x += Math.sin((t-s.t)*97)*k; y += Math.cos((t-s.t)*123)*k*0.7;
  }
  return [x,y];
}

/* ============================================================
   background, seal, fusion glyph
   ============================================================ */
function drawBg(t){
  const chargeU = seg(t,0,B.burst);
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(640,400,40, 640,400, 600);
  g.addColorStop(0, rgba(P.arc, 0.09 + chargeU*0.16));
  g.addColorStop(0.45, rgba(P.arc, 0.05));
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(640,400,600,0,7); ctx.fill();

  const pullIn = seg(t,0,B.burst), blow = seg(t,B.burst,B.burst+1.5);
  for(let i=0;i<motes.length;i++){
    const s = motes[i];
    const dx = 640-s.x, dy = 400-s.y, dist = Math.hypot(dx,dy)||1;
    const px = s.x + (dx/dist)*pullIn*95 - (dx/dist)*eOut(blow)*500;
    const py = s.y + (dy/dist)*pullIn*95 - (dy/dist)*eOut(blow)*500 - ((amb*s.sp*14)%H)*0.06;
    const fall = clamp(1 - Math.hypot(px-640,(py-400)*1.35)/560);
    if(fall <= 0) continue;
    const av = s.a*(0.6 + 0.4*Math.sin(amb*3+i))*fall;
    ctx.fillStyle = s.hue > 0.6 ? rgba(P.arc, av) : rgba(P.gold, av*0.8);
    ctx.fillRect(px, py, s.r, s.r);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawSeal(t){
  const up = seg(t, B.glyph, B.glyph+0.7);
  if(up <= 0) return;
  const fade = 1 - seg(t, B.burst, B.burst+0.4)*0.55;
  const R = 320*eOut(up);
  ctx.save();
  ctx.translate(640, GROUND); ctx.scale(1,0.30);
  ctx.globalCompositeOperation = 'lighter';
  const pool = ctx.createRadialGradient(0,0,8, 0,0, R*1.15);
  pool.addColorStop(0, rgba(P.arc, 0.5*up*fade));
  pool.addColorStop(0.55, rgba(P.arc, 0.12*up*fade));
  pool.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(0,0,R*1.15,0,7); ctx.fill();
  [[1,0.55,1.6],[0.78,-0.9,1],[0.52,1.5,1]].forEach(([k,sp,lw],ri)=>{
    ctx.strokeStyle = rgba(ri===1?P.gold:P.charge, 0.5*up*fade);
    ctx.lineWidth = lw*2.2;
    ctx.beginPath(); ctx.arc(0,0,R*k,0,7); ctx.stroke();
    const n = 12 + ri*10;
    for(let i=0;i<n;i++){
      const a = amb*sp + i/n*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*R*k*0.94, Math.sin(a)*R*k*0.94);
      ctx.lineTo(Math.cos(a)*R*k*1.06, Math.sin(a)*R*k*1.06);
      ctx.stroke();
    }
  });
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';

  const col = up*(1 - seg(t,B.burst,B.burst+0.4));
  if(col > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    const SL = 22, halfW = 190;
    for(let i=0;i<SL;i++){
      const u = (i+0.5)/SL, fx = 640 - halfW + u*halfW*2;
      const soft = Math.pow(Math.sin(u*Math.PI),1.6);
      const lg = ctx.createLinearGradient(0,GROUND,0,GROUND-600);
      lg.addColorStop(0, rgba(P.arc, 0.28*col*soft));
      lg.addColorStop(0.75, rgba(P.arc, 0.05*col*soft));
      lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(fx, GROUND-600, halfW*2/SL + 1, 600);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* two interlocking spiral arms — the fusion sigil the materials orbit inside */
function drawGlyph(t){
  const up = seg(t, B.charge, B.glyph+0.5);
  const fade = 1 - seg(t, B.merge, B.compress);
  const a = up*fade;
  if(a <= 0.01) return;
  ctx.save();
  ctx.translate(CEN.x, CEN.y);
  ctx.globalCompositeOperation = 'lighter';
  const spin = amb*0.55 + seg(t,B.orbit,B.merge)*4.2;

  for(let arm=0; arm<2; arm++){
    ctx.strokeStyle = rgba(CFG.matTint[arm], 0.55*a);
    ctx.lineWidth = 3;
    ctx.beginPath();
    for(let s=0;s<=90;s++){
      const p = s/90;
      const th = p*Math.PI*2.6 + arm*Math.PI + spin*(arm?-1:1);
      const r = 42 + p*260;
      const x = Math.cos(th)*r, y = Math.sin(th)*r*0.5;
      s ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  ctx.strokeStyle = rgba(P.gold, 0.5*a); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0,0,300,150,0,0,7); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0,0,60,30,0,0,7); ctx.stroke();

  const cg = ctx.createRadialGradient(0,0,4, 0,0, 150);
  cg.addColorStop(0, `rgba(255,255,255,${0.5*a*(0.7+0.3*Math.sin(t*9))})`);
  cg.addColorStop(0.4, rgba(P.charge, 0.18*a));
  cg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0,0,150,0,7); ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   the two materials: fly in, then orbit each other into a helix
   ============================================================ */
function cardT(k, t){
  const dir = k ? 1 : -1;
  const inU = eOut(seg(t, B.cardin, B.glyph));
  const restX = CEN.x + dir*ORBIT_R, restY = CEN.y;
  let x = lerp(CEN.x + dir*1120, restX, inU);
  let y = lerp(500, restY, inU);
  let rotY = (1-inU)*Math.PI*3.5*-dir;
  let tilt = lerp(dir*0.5, dir*0.08, inU);
  let sc = lerp(0.42, 1, inU), z = 1;

  /* orbit: accelerating revolutions on a tilted ellipse, radius closing in */
  const ou = seg(t, B.orbit, B.merge);
  if(ou > 0){
    const turns = 2.35;
    const ang = (k ? Math.PI : 0) + Math.pow(ou,1.55)*turns*Math.PI*2;
    const r = ORBIT_R*(1 - eIO(ou));
    z = Math.sin(ang);                       // depth for scale + draw order
    /* after the helix beat the two also swap height, out of phase */
    const hx = seg(t, B.spiral, B.merge);
    x = CEN.x + Math.cos(ang)*r;
    y = CEN.y + Math.sin(ang)*r*0.42 + Math.sin(ang*1.5)*70*hx;
    sc = (1 - eIO(ou)*0.42) * (0.86 + 0.14*(z+1)/2);
    tilt = -Math.cos(ang)*0.55 + ou*(k?-1:1)*1.2;
    rotY = ou*turns*Math.PI*2*(k?-1:1)*0.35;
  }
  return {x,y,rotY,tilt,sc,z};
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawCardBack(w,h,col){
  ctx.fillStyle = '#0A0716'; roundRect(-w/2,-h/2,w,h,10); ctx.fill();
  ctx.strokeStyle = rgba(P.gold,0.85); ctx.lineWidth = 3;
  roundRect(-w/2+7,-h/2+7,w-14,h-14,7); ctx.stroke();
  ctx.save(); ctx.rotate(Math.PI/4);
  const s = w*0.24;
  ctx.fillStyle = rgba(col,0.9); ctx.fillRect(-s/2,-s/2,s,s);
  ctx.strokeStyle = rgba(P.gold,0.9); ctx.lineWidth = 2; ctx.strokeRect(-s/2,-s/2,s,s);
  ctx.restore();
}

function drawOneCard(k, t, T){
  const col = CFG.matTint[k];
  const w = CARD.w*T.sc, h = CARD.h*T.sc;
  const heat = seg(t, B.orbit, B.merge);

  /* ribbon trail — sampled from the same pure function, so it never desyncs */
  if(heat > 0){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(col, 0.30*heat); ctx.lineJoin = 'round';
    for(let pass=0;pass<2;pass++){
      ctx.lineWidth = pass ? 4 : 16;
      ctx.globalAlpha = pass ? 0.5*heat : 0.18*heat;
      ctx.beginPath();
      for(let q=0;q<=12;q++){
        const tt = t - q*0.028;
        if(tt < B.orbit) break;
        const G = cardT(k, tt);
        q ? ctx.lineTo(G.x,G.y) : ctx.moveTo(G.x,G.y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.save();
  ctx.translate(T.x, T.y); ctx.rotate(T.tilt);
  const face = Math.cos(T.rotY);
  ctx.transform(Math.abs(face) < 0.02 ? 0.02 : face, 0, 0, 1, 0, 0);

  ctx.globalCompositeOperation = 'lighter';
  const bl = ctx.createRadialGradient(0,0,10,0,0,h*0.85);
  bl.addColorStop(0, rgba(col, 0.28 + heat*0.5)); bl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = bl; ctx.fillRect(-w,-h,w*2,h*2);
  ctx.globalCompositeOperation = 'source-over';

  if(face >= 0) ctx.drawImage(imgM[k], -w/2, -h/2, w, h);
  else { ctx.save(); ctx.scale(-1,1); drawCardBack(w,h,col); ctx.restore(); }

  const ig = seg(t, B.spiral, B.merge);
  if(ig > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = ig*0.45; ctx.fillStyle = rgba(col,1);
    roundRect(-w/2,-h/2,w,h,8); ctx.fill();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  ctx.strokeStyle = rgba(P.gold, 0.45 + heat*0.55); ctx.lineWidth = 2.5;
  roundRect(-w/2,-h/2,w,h,8); ctx.stroke();
  ctx.restore();
}

function drawCards(t){
  if(t < B.cardin || t >= B.merge) return;
  const A = {k:0, T:cardT(0,t)}, C = {k:1, T:cardT(1,t)};
  const order = A.T.z <= C.T.z ? [A,C] : [C,A];   // back to front
  for(const o of order) drawOneCard(o.k, t, o.T);
}

/* ============================================================
   the weave — alternating slices of both cards lock into one plate,
   then the plate compresses into an orb
   ============================================================ */
function plateT(t){
  const v = eIO(seg(t, B.compress, B.burst));
  const pop = lerp(0.76, 1, eOut(seg(t, B.merge, B.merge+0.25)));
  return {
    rot: v*1.75,
    sx: pop * lerp(1, 0.13, v),
    sy: pop * lerp(1, 0.38, v),
    v
  };
}
function drawWeave(t){
  if(t < B.merge || t >= B.burst) return;
  const T = plateT(t);
  ctx.save();
  ctx.translate(CEN.x, CEN.y); ctx.rotate(T.rot); ctx.scale(T.sx, T.sy);

  for(const s of strips){
    const u = seg(t, B.merge + s.delay, B.merge + s.delay + 0.26);
    if(u <= 0) continue;
    const e = eOut(u);
    const dir = s.k ? 1 : -1;
    const x0 = (s.u0 - 0.5)*CARD.w;
    const wSt = CARD.w/STRIPS;
    const x = lerp(x0 + dir*520, x0, e);
    const y = lerp(dir*90, 0, e);
    const img = imgM[s.k];

    ctx.save();
    ctx.globalAlpha = Math.min(1, u*2);
    ctx.drawImage(img,
      s.u0*img.width, 0, img.width/STRIPS, img.height,
      x, y - CARD.h/2, wSt + 1, CARD.h);
    /* seam flare as each slice lands */
    ctx.globalCompositeOperation = 'lighter';
    const flare = Math.pow(1 - u, 2);
    ctx.globalAlpha = flare*0.9;
    ctx.fillStyle = rgba(CFG.matTint[s.k], 1);
    ctx.fillRect(x, y - CARD.h/2, wSt + 1, CARD.h);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* the join lines between the interlocked slices */
  const lock = seg(t, B.merge+0.2, B.compress);
  if(lock > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(255,255,255,${0.55*lock*(1-T.v)})`;
    ctx.lineWidth = 1.6;
    for(let i=1;i<STRIPS;i++){
      const x = (i/STRIPS - 0.5)*CARD.w;
      ctx.beginPath(); ctx.moveTo(x,-CARD.h/2); ctx.lineTo(x,CARD.h/2); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  /* orb swallowing the plate */
  if(T.v > 0){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const R = 60 + T.v*130;
    const og = ctx.createRadialGradient(CEN.x,CEN.y,4, CEN.x,CEN.y, R);
    const c = mix(CFG.matTint[0], CFG.matTint[1], 0.5);
    og.addColorStop(0, `rgba(255,255,255,${0.95*T.v})`);
    og.addColorStop(0.35, rgba(c, 0.6*T.v));
    og.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = og; ctx.beginPath(); ctx.arc(CEN.x,CEN.y,R,0,7); ctx.fill();
    ctx.restore();
  }
}

/* ============================================================
   shards — blown out of the orb, then absorbed by the fusion
   ============================================================ */
function drawShards(t){
  if(t < B.burst) return;
  const T = plateT(B.burst);
  for(let i=0;i<shards.length;i++){
    const s = shards[i];
    const u = seg(t, B.burst, B.burst + 0.45 + s.arrive);
    if(u >= 1) continue;
    const eu = eOut(u);
    /* origin: where this piece sat inside the compressed plate */
    const cos = Math.cos(T.rot), sin = Math.sin(T.rot);
    const lx = s.ox*T.sx, ly = s.oy*T.sy;
    const ox = CEN.x + lx*cos - ly*sin, oy = CEN.y + lx*sin + ly*cos;
    const bx = ox + Math.cos(s.dir)*s.out, by = oy + Math.sin(s.dir)*s.out;
    const iu = 1-eu;
    const x = iu*iu*ox + 2*iu*eu*bx + eu*eu*s.tx;
    const y = iu*iu*oy + 2*iu*eu*by + eu*eu*s.ty;
    const sc = lerp(1, 0.28, eu*eu);
    const alpha = 1 - seg(u, 0.75, 1);

    ctx.save();
    ctx.translate(x,y); ctx.rotate(s.spin*eu); ctx.globalAlpha = alpha;
    ctx.drawImage(imgM[s.card], s.sx, s.sy, s.sw, s.sh, -s.w/2*sc, -s.h/2*sc, s.w*sc, s.h*sc);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha*0.3;
    ctx.fillStyle = rgba(CFG.matTint[s.card], 1);
    ctx.fillRect(-s.w/2*sc, -s.h/2*sc, s.w*sc, s.h*sc);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   the fusion
   ============================================================ */
function drawUnit(t){
  if(t < B.burst) return;
  const mat = seg(t, B.material, B.impact);
  const set = seg(t, B.impact, B.impact+0.45);
  const squash = 1 - Math.sin(set*Math.PI)*0.045;
  const hover = Math.sin(amb*1.5)*3*set;

  ctx.save();
  ctx.translate(UNIT.cx, UNIT.bottom + hover);
  ctx.scale(1/squash, squash);
  const dx = -UNIT.w/2, dy = -UNIT.h;

  const aur = seg(t, B.material, B.impact+0.3);
  if(aur > 0){
    ctx.globalCompositeOperation = 'lighter';
    const p = 0.75 + 0.25*Math.sin(amb*2.4);
    const ag = ctx.createRadialGradient(0,-UNIT.h*0.5,20, 0,-UNIT.h*0.5, UNIT.w*0.72);
    ag.addColorStop(0, rgba(P.core, 0.32*aur*p));
    ag.addColorStop(0.5, rgba(P.arc, 0.19*aur*p));
    ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0,-UNIT.h*0.5, UNIT.w*0.72, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  if(mat >= 1){
    ctx.drawImage(imgU, dx, dy, UNIT.w, UNIT.h);
  } else if(mat > 0){
    const th = mat*1.55 - 0.28;
    const md = maskImg.data, ed = edgeImg.data;
    for(let i=0, n=MW*MH; i<n; i++){
      const v = th - (noise[i] + bias[i]);
      md[i*4+3] = clamp(v*11)*255;
      ed[i*4+3] = clamp(1 - Math.abs(v)*13)*255;
    }
    maskCtx.putImageData(maskImg,0,0);
    edgeCtx.putImageData(edgeImg,0,0);

    let tmp = drawUnit._tmp;
    if(!tmp){ tmp = drawUnit._tmp = document.createElement('canvas');
      tmp.width = imgU.width; tmp.height = imgU.height; }
    const tc = tmp.getContext('2d');
    tc.clearRect(0,0,tmp.width,tmp.height);
    tc.drawImage(imgU,0,0);
    tc.globalCompositeOperation = 'destination-in';
    tc.drawImage(maskCv,0,0,tmp.width,tmp.height);
    ctx.drawImage(tmp, dx, dy, UNIT.w, UNIT.h);

    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(edgeCv, dx, dy, UNIT.w, UNIT.h);
    ctx.globalCompositeOperation = 'source-over';
  }

  const sil = Math.max(pulse(t, B.burst, B.material+0.35), pulse(t, B.impact, B.impact+0.22)*0.55);
  if(sil > 0.01){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = sil;
    ctx.drawImage(unitWhite, dx, dy, UNIT.w, UNIT.h);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  if(mat > 0.2){
    ctx.save(); ctx.globalCompositeOperation = 'multiply';
    const sg = ctx.createRadialGradient(UNIT.cx,GROUND,5, UNIT.cx,GROUND,240);
    sg.addColorStop(0,'rgba(0,0,0,0.42)'); sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = sg; ctx.beginPath();
    ctx.ellipse(UNIT.cx,GROUND,240,34,0,0,7); ctx.fill();
    ctx.restore();
  }
}

/* ============================================================
   impacts
   ============================================================ */
function drawImpact(t){
  for(const [start,count,col,R,cy,flat] of [
    [B.merge,  2, P.charge, 300, CEN.y,   0],
    [B.burst,  3, P.core,   600, CEN.y,   0],
    [B.impact, 2, P.gold,   400, GROUND,  1]
  ]){
    for(let k=0;k<count;k++){
      const u = seg(t, start + k*0.07, start + 0.85 + k*0.12);
      if(u <= 0 || u >= 1) continue;
      const r = eOut(u)*R, a = Math.pow(1-u,1.7)*0.8;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.translate(640, cy);
      if(flat) ctx.scale(1,0.22);
      ctx.lineWidth = (1-u)*15 + 1;
      [[-3,P.charge],[0,col],[3,P.arc]].forEach(([off,cc])=>{
        ctx.strokeStyle = rgba(cc, a*0.5);
        ctx.beginPath(); ctx.arc(0,0,Math.max(r+off,1),0,7); ctx.stroke();
      });
      ctx.restore();
    }
  }

  for(const [start,dur,cy,amp] of [[B.merge,0.35,CEN.y,0.55],[B.burst,0.45,CEN.y,1]]){
    const fl = Math.pow(1 - seg(t,start,start+dur), 2.2)*(t>=start?1:0)*amp;
    if(fl <= 0.002) continue;
    ctx.globalCompositeOperation = 'lighter';
    const FR = 700;
    const fg = ctx.createRadialGradient(640,cy,20, 640,cy,FR);
    fg.addColorStop(0, `rgba(255,255,255,${fl})`);
    fg.addColorStop(0.30, rgba(P.charge, fl*0.55));
    fg.addColorStop(0.62, `rgba(255,255,255,${fl*0.14})`);
    fg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(640,cy,FR,0,7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  const du = seg(t, B.impact, B.impact+1.0);
  if(du > 0 && du < 1){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<26;i++){
      const a = hash(i,40)*Math.PI*2;
      const r = eOut(du)*(150+hash(i,41)*250);
      ctx.fillStyle = rgba(P.gold,(1-du)*0.24);
      ctx.beginPath();
      ctx.arc(640+Math.cos(a)*r, GROUND - Math.sin(du*Math.PI)*(18+hash(i,42)*55) + Math.sin(a)*r*0.18,
              6+hash(i,43)*21,0,7);
      ctx.fill();
    }
    ctx.restore();
  }

  const em = seg(t, B.impact, B.impact+0.6);
  if(em > 0){
    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<42;i++){
      const life = ((amb*0.32 + hash(i,50)) % 1);
      const x = 640 + (hash(i,51)-0.5)*540 + Math.sin(amb*1.4+i)*16;
      const y = GROUND - life*520;
      const a = Math.sin(life*Math.PI)*0.62*em;
      ctx.fillStyle = rgba(hash(i,52)>0.5 ? P.core : P.gold, a);
      const s = 1.2 + hash(i,53)*2.3;
      ctx.fillRect(x,y,s,s*2.2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

function render(t){
  const [sx,sy] = shakeAt(t);
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(sx,sy);
  drawBg(t); drawSeal(t); drawGlyph(t);
  drawWeave(t); drawImpact(t);   /* cosmic FX only — demo cards/silhouette/shards removed; the real card is the centered #cardframe DOM */
  ctx.restore();

  vctx.setTransform(1,0,0,1,0,0);
  vctx.clearRect(0,0,vcv.width,vcv.height);
  vctx.globalAlpha = master;
  vctx.drawImage(cv, 0, 0);
  vctx.globalAlpha = 1;
}

/* ============================================================
   audio
   ============================================================ */
let ac = null, soundOn = CFG.sound, fired = new Set();
function ensureAudio(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(ac.state === 'suspended') ac.resume();
}
function tone(type,f0,f1,dur,gain,when=0){
  if(!ac) return;
  const t0 = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(gain, t0+dur*0.12);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+dur+0.05);
}
function noiseHit(dur,gain,type='lowpass',f=900,when=0){
  if(!ac) return;
  const t0 = ac.currentTime + when;
  const n = Math.floor(ac.sampleRate*dur);
  const buf = ac.createBuffer(1,n,ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const s = ac.createBufferSource(); s.buffer = buf;
  const bq = ac.createBiquadFilter(); bq.type = type; bq.frequency.value = f;
  const g = ac.createGain(); g.gain.value = gain;
  s.connect(bq).connect(g).connect(ac.destination); s.start(t0);
}
const CUES = {
  cardin:  () => { tone('triangle',900,240,0.35,0.08); tone('triangle',760,200,0.35,0.08,0.09);
                   noiseHit(0.25,0.08,'highpass',2400); },
  glyph:   () => { tone('sine',90,55,0.5,0.15); tone('sawtooth',110,700,2.2,0.04); },
  orbit:   () => { tone('sawtooth',200,520,1.4,0.045); noiseHit(1.0,0.05,'bandpass',1200); },
  spiral:  () => { tone('square',320,1500,0.6,0.035); noiseHit(0.5,0.06,'bandpass',2000); },
  merge:   () => { tone('sine',220,60,0.5,0.26); noiseHit(0.45,0.16,'highpass',1800);
                   [523,659].forEach((f,i)=>tone('triangle',f,f*1.4,0.5,0.05,i*0.06)); },
  compress:() => { tone('sawtooth',80,900,0.8,0.06); noiseHit(0.7,0.07,'bandpass',900); },
  burst:   () => { tone('sine',190,30,0.75,0.32); noiseHit(0.95,0.24,'lowpass',1400);
                   noiseHit(0.5,0.14,'highpass',3200); },
  material:() => { [392,523,659,784].forEach((f,i)=>tone('triangle',f,f*1.5,1.0,0.045,i*0.10)); },
  impact:  () => { tone('sine',150,26,0.85,0.34); noiseHit(0.7,0.2,'lowpass',700); },
  name:    () => { tone('triangle',1200,700,0.3,0.055); noiseHit(0.2,0.06,'highpass',3000); }
};

/* ============================================================
   transport
   ============================================================ */
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let t = 0, amb = 0, playing = false, speed = 1, last = performance.now();
const elPlate = document.getElementById('plate');
const elCard = document.getElementById('cardframe');

/* seek(0) is the trigger — call it from the game when the fusion resolves */
function seek(v){
  t = clamp(v, 0, CFG.duration);
  holdT = 0; master = 1;
  fired.clear();
  BEATS.forEach(b => { if(t >= b.t) fired.add(b.id); });
  playing = true;
  ensureAudio();
}
vcv.addEventListener('pointerdown', () => seek(0));
document.addEventListener('pointerdown', function once(){
  if(soundOn) ensureAudio();
  document.removeEventListener('pointerdown', once);
});

function frame(now){
  const dt = Math.min((now - last)/1000, 0.05); last = now;
  amb += dt;
  if(playing && t < CFG.duration) t = Math.min(t + dt*speed, CFG.duration);

  if(CFG.loop && t >= CFG.duration){
    holdT += dt;
    master = 1 - clamp((holdT - CFG.hold)/0.45);
    if(holdT > CFG.hold + 0.45) seek(0);
  }

  if(soundOn && ac){
    for(const b of BEATS)
      if(t >= b.t && !fired.has(b.id)){ fired.add(b.id); CUES[b.id] && CUES[b.id](); }
  } else BEATS.forEach(b => { if(t >= b.t) fired.add(b.id); });

  render(t);

  const np = seg(t, B.name, B.name+0.5);
  elPlate.style.opacity = (CFG.showName && np > 0) ? master : 0;
  elPlate.style.setProperty('--np', eOut(np).toFixed(3));

  /* 👑 Real result card (DOM #cardframe): fade+scale IN -> hold+pulse -> BURST out,
     timed to hand off to the game's sprite reveal (_playSummonSpriteReveal). */
  if (elCard) {
    const IN = 0.30, HOLD = 4.55, END = 6.05;
    let op, sc, glow;
    if (t < IN)        { op = 0; sc = 0.82; glow = 0; }
    else if (t < HOLD) { const u = clamp((t - IN) / 0.6); op = u; sc = 0.82 + 0.18 * eOut(u); glow = 0.35 + 0.22 * Math.sin(amb * 3.2); }
    else if (t < END)  { const b = clamp((t - HOLD) / (END - HOLD)); op = 1 - b * b; sc = 1 + 0.55 * eOut(b); glow = 0.55 + 0.45 * (1 - b); }
    else               { op = 0; sc = 1.55; glow = 0; }
    elCard.style.opacity = (op * master).toFixed(3);
    elCard.style.transform = 'translate(-50%,-50%) scale(' + sc.toFixed(3) + ')';
    elCard.style.filter = 'drop-shadow(0 18px 46px rgba(0,0,0,0.7)) drop-shadow(0 0 ' + Math.round(16 + glow * 64) + 'px rgba(124,63,228,' + (0.35 + glow * 0.5).toFixed(2) + '))';
  }

  requestAnimationFrame(frame);
}
</script>
<script>
// In-game (iframe): drop the preview backdrop, CLEAR the demo card + nameplate so a
// missing override never leaks the demo unit, hide the file's own plate (the game shows
// its own toast), play once, and lay a dark cinematic scrim so the effect reads on any board.
try {
  if (window.self !== window.top) {
    const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove();
    const _cf0 = document.getElementById('cardframe'); if (_cf0) _cf0.style.backgroundImage = 'none';
    const _pn0 = document.getElementById('pName'); if (_pn0) _pn0.textContent = '';
    const _pl0 = document.getElementById('plate'); if (_pl0) _pl0.style.display = 'none';
    try { CFG.loop = false; } catch (e) {}
    const _scrim = document.createElement('div');
    _scrim.id = 'ingamebg';
    _scrim.style.cssText = 'position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 46%, rgba(6,8,15,0.86) 0%, rgba(6,8,15,0.66) 44%, rgba(6,8,15,0.32) 74%, rgba(6,8,15,0) 100%);';
    document.body.appendChild(_scrim);
  }
} catch (e) {}
// ?art=<url> fills the card; ?name=<text> overrides the nameplate (in-game the game passes the summoning unit's).
try { const _q = new URLSearchParams(location.search); const _a = _q.get('art'); if (_a) { const _c = document.getElementById('cardframe'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } const _n = _q.get('name'); if (_n) { const _p = document.getElementById('pName'); if (_p) _p.textContent = _n; } } catch (e) {}
// The game delivers the REAL card art + name (base64-safe) via postMessage — apply it.
try {
  window.addEventListener('message', function (ev) {
    try {
      const d = ev && ev.data; if (!d || d.type !== 'mvfx') return;
      if (d.art) { const _c = document.getElementById('cardframe'); if (_c) _c.style.backgroundImage = 'url("' + String(d.art).replace(/"/g, '%22') + '")'; }
      if (typeof d.name === 'string' && d.name) { const _p = document.getElementById('pName'); if (_p) _p.textContent = d.name; }
    } catch (e) {}
  }, false);
} catch (e) {}
</script>
