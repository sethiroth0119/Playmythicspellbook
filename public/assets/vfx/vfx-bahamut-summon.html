<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · BAHAMUT SUMMON</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — lets you SEE the transparency when you open this
     file directly. In-game (loaded in an iframe over the battlefield) it is
     removed so the FIELD shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change: transform, filter; }
    /* 👑 The unit's REAL card — the full framed ACE card PNG (frame + scene baked in).
     Displayed as-is; the VFX plays around it. In-game ?art can swap it. */
  #card { position:relative; z-index:200; height:78vh; max-height:680px;
    aspect-ratio: 1024 / 1536; background: center/contain no-repeat;
    background-image: url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/Bahamut King Of Good Dragons.png");
    filter: drop-shadow(0 26px 64px rgba(0,0,0,0.72)); }

  

  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px; z-index:200;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(3,5,10,0.94)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#06101f; background:#6fb0ff; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(111,176,255,0.4); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#7d8ba6; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#6fb0ff; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"><div id="card"></div></div>

<script src="three.min.js"></script>
<script>
/* =====================================================================
   DragonSummonVFX — Master Duel style fly-in + roar
   ---------------------------------------------------------------------
   Beats:  storm → seal → flight approach → landing slam → ROAR → settle
   The sprite is driven by shader keys derived from the art itself:
     · wing-flap UV displacement (outer/upper region only)
     · radial zoom motion blur on approach
     · lightning-vein key (blue-dominance) that crackles during the roar
     · chest-core + eye keys driven independently
     · alpha-derived rim light so the roar back-lights the silhouette
   ===================================================================== */
class DragonSummonVFX {
  constructor(opts = {}) {
    this.src = opts.src;
    this.duration = opts.duration || 4.9;
    this.aspect = opts.spriteAspect || (640 / 960);
    this.headUV = opts.headUV || { x: 0.50, y: 0.705 };
    this.coreUV = opts.coreUV || { x: 0.50, y: 0.595 };
    this.onSeal = opts.onSeal || null;
    this.onLand = opts.onLand || null;
    this.onRoar = opts.onRoar || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 60;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.shakeK = this.reduced ? 0.15 : 1;

    this.ROARS = [0.505, 0.590, 0.678];
    this._t = -1; this._raf = null;
    this._flags = {};
    this._shake = 0;
    this._build();
  }

  // ================================================================ setup
  _build() {
    const r = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position: "fixed", inset: "0", pointerEvents: "none",
      zIndex: String(this.zIndex), opacity: "0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -30, 30);
    this.camera.position.z = 15;

    this.NOISE = `
      float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
    `;

    this._buildDim(a);
    this._buildStorm(a);
    this._buildSeal();
    this._buildPillar();
    this._buildSpeedLines(a);
    this._buildSprite();
    this._buildRoarRings();
    this._buildShock();
    this._buildDebris();
    this._buildBolts();
    this._buildFlash(a);
    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  _fullQuad(aspect, mat, z) {
    const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(2 * aspect, 2), mat);
    m.position.z = z; this.scene.add(m); return m;
  }

  // ---- vignette dim ------------------------------------------------------
  _buildDim(aspect) {
    this.dimU = { uAmt: { value: 0 } };
    this.dimMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: this.dimU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `varying vec2 vUv; uniform float uAmt;
        void main(){
          float d = length(vUv-0.5)*1.42;
          float a = uAmt*(0.34+0.66*smoothstep(0.1,1.0,d));
          if(a<0.004) discard;
          gl_FragColor = vec4(0.006,0.010,0.024,a);
        }`
    });
    this.dim = this._fullQuad(aspect, this.dimMat, -8);
  }

  // ---- rolling storm -----------------------------------------------------
  _buildStorm(aspect) {
    this.stormU = { uT:{value:0}, uTime:{value:0}, uAspect:{value:aspect} };
    this.stormMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: this.stormU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uT, uTime, uAspect;
        ${this.NOISE}
        void main(){
          vec2 p = vec2(vUv.x*uAspect, vUv.y);
          vec2 q = vec2(fbm(p*1.6 + vec2(uTime*0.13,0.0)),
                        fbm(p*1.6 + vec2(3.1,1.7) - vec2(uTime*0.09,0.0)));
          float n = fbm(p*2.0 + 2.2*q + vec2(uTime*0.07,0.0));
          float top = smoothstep(0.05, 0.85, vUv.y);
          float dens = smoothstep(0.38, 0.86, n) * top;
          vec3 col = mix(vec3(0.02,0.03,0.07), vec3(0.13,0.19,0.34), n);
          col += vec3(0.10,0.20,0.45)*pow(smoothstep(0.7,1.0,n),3.0);
          float a = dens*0.80*uT;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
    this.storm = this._fullQuad(aspect, this.stormMat, -7);
  }

  // ---- summoning seal on the ground --------------------------------------
  _buildSeal() {
    this.sealU = { uT:{value:0}, uTime:{value:0} };
    this.sealMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: this.sealU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uT, uTime;
        float ring(float d, float r, float w){ return smoothstep(w,0.0,abs(d-r)); }
        void main(){
          vec2 p = vUv-0.5;
          float d = length(p)*2.0;
          float ang = atan(p.y,p.x);
          float open = smoothstep(0.0,1.0,uT);
          float R = open;

          float g = 0.0;
          g += ring(d, 0.94*R, 0.020);
          g += ring(d, 0.86*R, 0.008)*0.7;
          g += ring(d, 0.52*R, 0.014)*0.85;
          g += ring(d, 0.30*R, 0.008)*0.6;

          // rune ticks on the outer band, counter-rotating inner spokes
          float a1 = ang + uTime*0.55;
          float ticks = step(0.62, fract(a1/6.2831*24.0)) * ring(d,0.90*R,0.045);
          float a2 = ang - uTime*0.85;
          float spokes = step(0.90, fract(a2/6.2831*12.0)) * smoothstep(0.52*R,0.30*R,d);
          g += ticks*0.9 + spokes*0.55;

          // sweeping radar line
          float sweep = pow(max(0.0, cos(ang - uTime*2.1)), 24.0) * smoothstep(0.95*R,0.0,d);
          g += sweep*0.5;

          vec3 col = mix(vec3(0.20,0.55,1.0), vec3(0.80,0.93,1.0), g);
          float a = clamp(g,0.0,1.5) * smoothstep(0.0,0.15,uT) * (1.0-smoothstep(0.80,1.0,uT));
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
    this.seal = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.3, 2.3), this.sealMat);
    this.seal.position.set(0, -0.72, -6);
    this.seal.scale.set(1, 0.30, 1);           // foreshortened onto the ground
    this.scene.add(this.seal);
  }

  // ---- light pillar ------------------------------------------------------
  _buildPillar() {
    this.pillarU = { uT:{value:0}, uTime:{value:0} };
    this.pillarMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: this.pillarU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uT, uTime;
        ${this.NOISE}
        void main(){
          float x = abs(vUv.x-0.5)*2.0;
          float core = pow(1.0-clamp(x,0.0,1.0), 3.0);
          float flick = 0.75 + 0.25*vnoise(vec2(vUv.y*8.0 - uTime*4.0, uTime*1.3));
          float rise = smoothstep(0.0,0.55,vUv.y)*smoothstep(1.0,0.55,vUv.y);
          float a = core*flick*rise*uT*0.9;
          if(a<0.004) discard;
          vec3 col = mix(vec3(0.25,0.60,1.0), vec3(0.92,0.97,1.0), core);
          gl_FragColor = vec4(col,a);
        }`
    });
    this.pillar = new THREE.Mesh(new THREE.PlaneBufferGeometry(1.1, 2.4), this.pillarMat);
    this.pillar.position.set(0, 0.15, -5);
    this.scene.add(this.pillar);
  }

  // ---- radial speed lines -------------------------------------------------
  _buildSpeedLines(aspect) {
    this.slU = { uAmt:{value:0}, uTime:{value:0}, uAspect:{value:aspect}, uCy:{value:0.0} };
    this.slMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: this.slU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uAmt, uTime, uAspect, uCy;
        float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; return fract(p*(p+p)); }
        void main(){
          vec2 p = vec2((vUv.x-0.5)*uAspect, vUv.y-0.5-uCy);
          float d = length(p);
          float ang = atan(p.y,p.x);
          float id = floor(ang/6.2831*140.0);
          float r = hash11(id);
          float lane = step(0.55, fract(ang/6.2831*140.0 + r*0.3));
          float streak = smoothstep(0.15+r*0.25, 0.95, d) * lane;
          streak *= 0.4 + 0.6*fract(r*7.0 + uTime*2.2);
          float a = streak*uAmt*0.55;
          if(a<0.004) discard;
          gl_FragColor = vec4(0.70,0.86,1.0,a);
        }`
    });
    this.speed = this._fullQuad(aspect, this.slMat, 3);
  }

  // ---- the dragon ---------------------------------------------------------
  _buildSprite() {
    const tex = new THREE.TextureLoader().load(this.src);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;

    this.sprU = {
      uMap:{value:tex}, uTime:{value:0},
      uBlur:{value:0},     // radial zoom motion blur
      uFlap:{value:0},     // wing beat amplitude
      uFlapSpd:{value:9.0},
      uSplit:{value:0},    // chromatic separation
      uShade:{value:0},    // silhouette → lit
      uVolt:{value:0},     // lightning veins
      uCore:{value:0},     // chest core
      uEye:{value:0},      // eye glow
      uRim:{value:0},      // alpha-derived rim light
      uAlpha:{value:0},
      uHead:{value:new THREE.Vector2(this.headUV.x, this.headUV.y)},
      uCoreP:{value:new THREE.Vector2(this.coreUV.x, this.coreUV.y)}
    };

    this.sprMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: this.sprU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv;
        uniform sampler2D uMap;
        uniform float uTime,uBlur,uFlap,uFlapSpd,uSplit,uShade,uVolt,uCore,uEye,uRim,uAlpha;
        uniform vec2 uHead, uCoreP;
        ${this.NOISE}

        // wing beat: only the outer/upper region moves
        vec2 flapUV(vec2 uv){
          float outer = smoothstep(0.13, 0.48, abs(uv.x-0.5));
          float upper = smoothstep(0.16, 0.62, uv.y);
          float w = outer*upper*uFlap;
          float f = sin(uTime*uFlapSpd);
          uv.x = 0.5 + (uv.x-0.5)*(1.0 - f*0.17*w);
          uv.y -= f*0.052*w;
          // membrane ripple travelling along the span
          uv.y += sin(abs(uv.x-0.5)*26.0 - uTime*uFlapSpd*1.4)*0.007*w;
          return uv;
        }

        void main(){
          vec2 uv = flapUV(vUv);

          // ---- radial zoom motion blur -------------------------------
          vec4 acc = vec4(0.0); float ws = 0.0;
          for(int i=0;i<8;i++){
            float s = float(i)/7.0;
            vec2 su = 0.5 + (uv-0.5)*(1.0 - s*uBlur);
            float w = 1.0 - s*0.72;
            acc += texture2D(uMap, su)*w; ws += w;
          }
          vec4 base = acc/ws;

          // ---- chromatic separation ----------------------------------
          vec2 dir = uv-0.5; float dl = max(length(dir),1e-4); dir /= dl;
          vec3 tex = base.rgb;
          if (uSplit > 0.0005){
            tex.r = texture2D(uMap, uv + dir*uSplit).r;
            tex.b = texture2D(uMap, uv - dir*uSplit).b;
          }
          float texA = base.a;
          if (texA < 0.008) discard;

          float lum = dot(tex, vec3(0.299,0.587,0.114));
          float blue = clamp((tex.b - tex.r)*2.4, 0.0, 1.0);

          vec3 col = tex * mix(0.10, 1.0, uShade);

          // ---- lightning veins in the wings --------------------------
          float volt = smoothstep(0.07,0.40,tex.b-tex.r)*smoothstep(0.08,0.50,lum);
          float crackle = smoothstep(0.48,0.92, fbm(uv*13.0 + vec2(0.0,-uTime*2.6)));
          col += vec3(0.34,0.66,1.0)*volt*uVolt*(0.55 + crackle*1.05);

          // ---- chest core --------------------------------------------
          float nearCore = smoothstep(0.26,0.0, distance(uv, uCoreP));
          float core = smoothstep(0.42,0.90,lum)*blue*nearCore;
          col += (tex + vec3(0.45,0.72,1.0))*core*uCore;

          // ---- eyes ---------------------------------------------------
          float nearHead = smoothstep(0.13,0.0, distance(uv, uHead));
          float eye = smoothstep(0.50,0.92,lum)*nearHead;
          col += vec3(0.72,0.90,1.0)*eye*uEye*(0.7+0.3*sin(uTime*9.0));

          // ---- rim light from the alpha silhouette --------------------
          if (uRim > 0.001){
            float px = 0.0055;
            float aL = texture2D(uMap, uv-vec2(px,0.0)).a;
            float aR = texture2D(uMap, uv+vec2(px,0.0)).a;
            float aD = texture2D(uMap, uv-vec2(0.0,px)).a;
            float aU = texture2D(uMap, uv+vec2(0.0,px)).a;
            float edge = clamp(texA - min(min(aL,aR),min(aD,aU)), 0.0, 1.0);
            col += vec3(0.45,0.72,1.0)*edge*uRim*3.2;
          }

          float a = texA*uAlpha;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });

    const h = 1.62, w = h * this.aspect;
    this.sprite = new THREE.Mesh(new THREE.PlaneBufferGeometry(w, h), this.sprMat);
    this.spriteH = h;
    this.sprite.position.z = 0;
    this.scene.add(this.sprite);
  }

  // ---- roar shockwave rings ------------------------------------------------
  _buildRoarRings() {
    const mk = () => new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uT:{value:1} },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uT;
        void main(){
          float d = length(vUv-0.5)*2.0;
          float rad = pow(uT,0.55)*1.02;
          float w = mix(0.075,0.006,uT);
          float ring = smoothstep(w,0.0,abs(d-rad));
          float inner = smoothstep(0.03,0.0,abs(d-rad*0.92))*0.4;
          float a = (ring+inner)*(1.0-uT)*1.6;
          if(a<0.004) discard;
          vec3 col = mix(vec3(0.95,0.99,1.0), vec3(0.25,0.58,1.0), uT);
          gl_FragColor = vec4(col,a);
        }`
    });
    this.rings = [];
    for (let i = 0; i < 3; i++) {
      const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.6, 3.6), mk());
      m.position.z = 2; m.visible = false;
      m.userData.p = 1;
      this.scene.add(m); this.rings.push(m);
    }
  }

  // ---- landing shockwave on the ground -------------------------------------
  _buildShock() {
    this.shockU = { uT:{value:1} };
    this.shockMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: this.shockU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uT;
        void main(){
          float d = length(vUv-0.5)*2.0;
          float rad = pow(uT,0.5)*1.02;
          float ring = smoothstep(mix(0.10,0.012,uT),0.0,abs(d-rad));
          float a = ring*(1.0-uT)*1.5;
          if(a<0.004) discard;
          gl_FragColor = vec4(mix(vec3(1.0),vec3(0.35,0.65,1.0),uT), a);
        }`
    });
    this.shock = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.6, 3.6), this.shockMat);
    this.shock.position.set(0, -0.72, 1);
    this.shock.scale.set(1, 0.32, 1);
    this.shock.visible = false;
    this.scene.add(this.shock);
  }

  // ---- debris blown outward -------------------------------------------------
  _buildDebris() {
    this.N = 300;
    this.vel = new Float32Array(this.N*3);
    this.seed = new Float32Array(this.N);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(this.N*3),3));
    const cv = document.createElement("canvas"); cv.width=cv.height=64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(235,246,255,1)");
    gr.addColorStop(0.35,"rgba(110,180,255,0.5)");
    gr.addColorStop(1,"rgba(40,90,200,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.debMat = new THREE.PointsMaterial({
      size:0.022, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.debris = new THREE.Points(g, this.debMat);
    this.debris.position.z = 2.5; this.debris.visible = false;
    this.scene.add(this.debris);
  }

  _fireDebris(cy, power) {
    const pos = this.debris.geometry.attributes.position.array;
    for (let i=0;i<this.N;i++){
      const ang = Math.random()*Math.PI*2;
      pos[i*3]   = Math.cos(ang)*0.10;
      pos[i*3+1] = cy + Math.sin(ang)*0.08;
      pos[i*3+2] = 0;
      const sp = (0.5+Math.random()*1.7)*power;
      this.vel[i*3]   = Math.cos(ang)*sp;
      this.vel[i*3+1] = Math.sin(ang)*sp*0.7 + 0.25;
      this.seed[i] = Math.random()*6.28;
    }
    this.debris.geometry.attributes.position.needsUpdate = true;
    this.debris.visible = true; this.debMat.opacity = 1;
  }

  // ---- forked lightning ------------------------------------------------------
  _buildBolts() {
    this.bcv = document.createElement("canvas");
    this.bcv.width = 1024; this.bcv.height = 640;
    this.bctx = this.bcv.getContext("2d");
    this.btex = new THREE.CanvasTexture(this.bcv);
    this.btex.minFilter = THREE.LinearFilter;
    this.boltMat = new THREE.MeshBasicMaterial({
      map:this.btex, transparent:true, depthWrite:false,
      blending:THREE.AdditiveBlending, opacity:0
    });
    const a = innerWidth/innerHeight;
    this.bolts = this._fullQuad(a, this.boltMat, -6);
  }

  _strike(n) {
    const c = this.bctx, W = this.bcv.width, H = this.bcv.height;
    c.clearRect(0,0,W,H);
    c.lineCap = "round"; c.lineJoin = "round";
    for (let k=0;k<n;k++){
      const x0 = W*(0.12+Math.random()*0.76);
      const path = [[x0,0]];
      let x = x0, y = 0;
      while (y < H*(0.55+Math.random()*0.4)) {
        y += 18+Math.random()*40;
        x += (Math.random()-0.5)*90;
        path.push([x,y]);
      }
      for (const pass of [
        {w:16, col:"rgba(60,120,255,0.25)"},
        {w:7,  col:"rgba(120,180,255,0.6)"},
        {w:2.4,col:"rgba(240,250,255,0.95)"}
      ]) {
        c.strokeStyle = pass.col; c.lineWidth = pass.w;
        c.beginPath(); c.moveTo(path[0][0],path[0][1]);
        for (let i=1;i<path.length;i++) c.lineTo(path[i][0],path[i][1]);
        c.stroke();
        // forks
        for (let i=2;i<path.length-1;i+=3){
          if (Math.random()<0.55){
            c.beginPath(); c.moveTo(path[i][0],path[i][1]);
            c.lineTo(path[i][0]+(Math.random()-0.5)*150, path[i][1]+40+Math.random()*70);
            c.lineWidth = pass.w*0.5; c.stroke();
          }
        }
      }
    }
    this.btex.needsUpdate = true;
    this.boltMat.opacity = 1;
  }

  _buildFlash(aspect) {
    this.flashMat = new THREE.MeshBasicMaterial({
      color:0xcfe6ff, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    this.flash = this._fullQuad(aspect, this.flashMat, 8);
  }

  // ============================================================== control
  play() {
    this._flags = {};
    this._shake = 0;
    this.debris.visible=false; this.debMat.opacity=0;
    this.shock.visible=false; this.flashMat.opacity=0; this.boltMat.opacity=0;
    this.rings.forEach(r=>{ r.visible=false; r.userData.p=1; });
    if (this._t < 0) {
      this._t = 0;
      this.renderer.domElement.style.opacity = "1";
      this._clock = new THREE.Clock();
      this._loop();
    } else this._t = 0;
    return this;
  }

  _emitRing(cy) {
    const r = this.rings.find(x => !x.visible) || this.rings[0];
    r.visible = true; r.userData.p = 0;
    r.position.y = cy;
    r.material.uniforms.uT.value = 0;
  }

  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    const dt = Math.min(this._clock.getDelta(), 0.05);
    const el = this._clock.elapsedTime;
    if (this._t < 0) return;

    this._t += dt / this.duration;
    const T = Math.min(this._t, 1);
    const F = this._flags;

    // ================= timeline =====================================
    // 0.00–0.12 storm gathers, board dims
    // 0.10–0.24 summoning seal + light pillar
    // 0.22–0.44 flight approach: silhouette scales in, motion blur, wings beat
    // 0.44–0.50 landing slam: shockwave, debris, flash, hard shake
    // 0.50–0.72 ROAR ×3: rings, rim light, veins crank, violent shake
    // 0.72–1.00 settle and fade
    const storm   = sm(T,0.00,0.16) * (1 - sm(T,0.90,1.0));
    const sealT   = sm(T,0.10,0.26) * (1 - sm(T,0.44,0.56));
    const approach= sm(T,0.22,0.46);
    const land    = sm(T,0.44,0.50);
    const roarWin = sm(T,0.49,0.53) * (1 - sm(T,0.70,0.78));
    const outro   = sm(T,0.84,1.00);

    this.dimU.uAmt.value = sm(T,0.01,0.14)*(1-outro)*0.95;
    this.stormU.uT.value = storm; this.stormU.uTime.value = el;
    this.sealU.uT.value = sealT;  this.sealU.uTime.value = el;
    this.seal.scale.set(1.0 + sealT*0.25, (1.0 + sealT*0.25)*0.30, 1);
    this.pillarU.uT.value = sm(T,0.12,0.24)*(1-sm(T,0.38,0.50));
    this.pillarU.uTime.value = el;

    // ---- sprite -----------------------------------------------------
    // approach: comes in from above/behind, overshoots, settles
    const ap = approach;
    const scale = 0.06 + ap*0.98 + land*(1-land)*0.34;
    const posY  = 0.62 - ap*0.66 + (1-ap)*0.0;
    this.sprite.scale.set(scale, scale, 1);
    this.sprite.position.y = posY + Math.sin(el*1.1)*0.010*ap;
    this.sprite.rotation.z = (1-ap)*0.16 - 0.0;

    this.sprU.uTime.value = el;
    this.sprU.uAlpha.value = sm(T,0.21,0.30)*(1-outro);
    this.sprU.uBlur.value  = (1-ap)*0.26 + land*(1-land)*0.30;
    this.sprU.uFlap.value  = (1-ap)*1.0 + 0.28;         // hard beats inbound, idle after
    this.sprU.uFlapSpd.value = 11.0 - ap*7.0;
    this.sprU.uShade.value = sm(T,0.30,0.47);
    this.sprU.uSplit.value = (1-ap)*0.012 + land*(1-land)*0.05;

    // ---- roar pulses --------------------------------------------------
    let roarPunch = 0, roarShake = 0;
    for (let i=0;i<this.ROARS.length;i++){
      const r0 = this.ROARS[i];
      const q = THREE.MathUtils.clamp((T-r0)/0.075, 0, 1);
      if (T >= r0) {
        const env = Math.pow(1-q, 2);
        roarPunch = Math.max(roarPunch, env);
        roarShake = Math.max(roarShake, env);
      }
      if (!F["roar"+i] && T >= r0) {
        F["roar"+i] = true;
        const headY = this.sprite.position.y + (this.headUV.y-0.5)*this.spriteH*scale;
        this._emitRing(headY);
        this._fireDebris(headY, 1.0 - i*0.18);
        this.flashMat.opacity = Math.max(this.flashMat.opacity, 0.30 - i*0.06);
        this._strike(1 + (i===0?1:0));
        this._shake = Math.max(this._shake, (0.9 - i*0.16)*this.shakeK);
        if (this.onRoar) this.onRoar(i);
      }
    }

    this.sprU.uVolt.value = (sm(T,0.30,0.48)*0.45 + roarWin*0.85 + roarPunch*1.5)*(1-outro);
    this.sprU.uCore.value = (sm(T,0.34,0.48)*0.35 + roarWin*0.6 + roarPunch*1.4)*(1-outro);
    this.sprU.uEye.value  = (sm(T,0.28,0.42)*0.8 + roarPunch*1.2)*(1-outro);
    this.sprU.uRim.value  = (roarWin*0.35 + roarPunch*0.85)*(1-outro);
    // roar makes the whole silhouette flex
    const flex = 1 + roarPunch*0.055;
    this.sprite.scale.set(scale*flex*(1+roarPunch*0.02), scale*flex, 1);

    // ---- speed lines ---------------------------------------------------
    this.slU.uAmt.value = (1-ap)*0.85*sm(T,0.22,0.30) + roarPunch*0.9;
    this.slU.uTime.value = el;
    this.slU.uCy.value = (this.sprite.position.y)*0.5;

    // ---- landing beat ---------------------------------------------------
    if (!F.seal && T >= 0.11) { F.seal = true; this._strike(1); if (this.onSeal) this.onSeal(); }
    if (!F.land && T >= 0.445) {
      F.land = true;
      this.shock.visible = true; this.shockU.uT.value = 0;
      this._fireDebris(-0.66, 1.35);
      this.flashMat.opacity = 0.7;
      this._strike(2);
      this._shake = 1.0*this.shakeK;
      if (this.onLand) this.onLand();
    }
    if (this.shock.visible) {
      this.shockU.uT.value += dt/0.9;
      if (this.shockU.uT.value >= 1) this.shock.visible = false;
    }

    // ---- rings ----------------------------------------------------------
    for (const r of this.rings) {
      if (!r.visible) continue;
      r.userData.p += dt/0.85;
      r.material.uniforms.uT.value = Math.min(r.userData.p, 1);
      r.scale.setScalar(1 + r.userData.p*0.25);
      if (r.userData.p >= 1) r.visible = false;
    }

    // ---- debris ---------------------------------------------------------
    if (this.debris.visible) {
      const pos = this.debris.geometry.attributes.position.array;
      for (let i=0;i<this.N;i++){
        this.vel[i*3+1] -= 0.9*dt;
        this.vel[i*3]   *= (1-0.6*dt);
        pos[i*3]   += (this.vel[i*3] + Math.sin(el*2.2+this.seed[i])*0.18)*dt;
        pos[i*3+1] += this.vel[i*3+1]*dt;
      }
      this.debris.geometry.attributes.position.needsUpdate = true;
      this.debMat.opacity = Math.max(0, this.debMat.opacity - dt*0.85);
      if (this.debMat.opacity <= 0.01) this.debris.visible = false;
    }

    // ---- flash + bolts ----------------------------------------------------
    if (this.flashMat.opacity > 0)
      this.flashMat.opacity = Math.max(0, this.flashMat.opacity - dt*2.6);
    if (this.boltMat.opacity > 0)
      this.boltMat.opacity = Math.max(0, this.boltMat.opacity - dt*3.4);

    // ---- camera shake ------------------------------------------------------
    this._shake = Math.max(0, this._shake - dt*2.6);
    const s = this._shake;
    this.camera.position.x = (Math.random()-0.5)*0.10*s;
    this.camera.position.y = (Math.random()-0.5)*0.10*s;

    this.renderer.render(this.scene, this.camera);

    if (this._t >= 1) {
      this._t = -1;
      cancelAnimationFrame(this._raf); this._raf = null;
      this.renderer.domElement.style.opacity = "0";
      this.camera.position.set(0,0,15);
      this.renderer.clear();
      if (this.onComplete) this.onComplete();
    }

    function sm(v,e0,e1){
      const t = THREE.MathUtils.clamp((v-e0)/(e1-e0),0,1);
      return t*t*(3-2*t);
    }
  }

  _resize() {
    const a = innerWidth/innerHeight;
    this.renderer.setSize(innerWidth, innerHeight);
    this.camera.left=-a; this.camera.right=a;
    this.camera.updateProjectionMatrix();
    for (const m of [this.dim,this.storm,this.speed,this.bolts,this.flash]) {
      m.geometry.dispose();
      m.geometry = new THREE.PlaneBufferGeometry(2*a,2);
    }
    this.stormU.uAspect.value = a;
    this.slU.uAspect.value = a;
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize", this._onResize);
    this.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

const field = document.getElementById("field");
const shake = (px, ms) => field.animate(
  [{transform:"translate(0,0)"},
   {transform:`translate(${-px}px,${px*0.7}px)`},
   {transform:`translate(${px*0.8}px,${-px*0.6}px)`},
   {transform:`translate(${-px*0.35}px,${px*0.25}px)`},
   {transform:"translate(0,0)"}],
  {duration:ms, easing:"ease-out"});

const fx = new DragonSummonVFX({
  src: BAHAMUT,
  onSeal(){ field.animate([{filter:"brightness(1)"},{filter:"brightness(0.5)"}],
    {duration:900, easing:"ease-out", fill:"forwards"}); },
  onLand(){ shake(14, 480); },
  onRoar(i){ shake(11 - i*2, 380); },
  onComplete(){ field.animate([{filter:"brightness(0.5)"},{filter:"brightness(1)"}],
    {duration:700, easing:"ease-out", fill:"forwards"}); }
});
// In-game the file loads inside an iframe over the battlefield — drop the preview
// backdrop there so the FIELD shows through. Standalone keeps it so you can see it.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Optional ?art=<url> overrides the card image (in-game passes the summoned unit's own card art).
try { const _a = new URLSearchParams(location.search).get('art'); if (_a) { const _c = document.getElementById('card'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } } catch (e) {}
document.addEventListener('click', () => fx.play());
fx.play();
</script>
