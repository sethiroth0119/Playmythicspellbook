<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · BUNNY KAGE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — lets you SEE the transparency when you open this
     file directly. In-game (loaded in an iframe over the battlefield) it is
     removed so the FIELD shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change: transform, filter; }
    /* 👑 The unit's REAL card — the full framed ACE card PNG (frame + scene baked in).
     Displayed as-is; the VFX plays around it. In-game ?art can swap it. */
  #card { position:relative; z-index:200; height:78vh; max-height:680px;
    aspect-ratio: 1024 / 1536; background: center/contain no-repeat;
    background-image: url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/Bunny Kage.png");
    filter: drop-shadow(0 26px 64px rgba(0,0,0,0.72)); }

  

  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px; z-index:200;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(4,4,7,0.94)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#120a1e; background:#b48cff; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(180,140,255,0.4); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#847ba0; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#b48cff; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"><div id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   SigilMoonVFX — an eye opens, a sigil turns, a moon rises, smoke clears
   ---------------------------------------------------------------------
   Beats: dark → a great EYE opens with a rotating MAGIC SIGIL in the iris
          → the eye closes and a MOON rises in its place → a smoke bomb
          bursts at ground level → the smoke clears and he is standing
          there, backlit by the moon, his sigils burning
   Notable work:
     · the eye is a real lens: the lid is an almond curve that opens, and
       the iris is corrected to a circle in WORLD units, not UV, so it
       stays round in a wide quad
     · the moon's craters are worley cells lit by a finite-difference
       normal, so they cast directional relief instead of looking painted
     · smoke is domain-warped fbm in two layers with him between them
   ===================================================================== */
class SigilMoonVFX {
  constructor(opts = {}) {
    this.src = opts.src;
    this.moonSrc = opts.moonSrc;
    this.duration = opts.duration || 6.4;
    this.aspect = opts.spriteAspect || (1024 / 1376);
    this.emblemUV = opts.emblemUV || { x: 0.34, y: 0.72 };
    this.orbUV = opts.orbUV || { x: 0.123, y: 0.521 };
    this.groundY = opts.groundY != null ? opts.groundY : -0.80;
    this.onEye = opts.onEye || null;
    this.onMoon = opts.onMoon || null;
    this.onSmoke = opts.onSmoke || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 60;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.shakeK = this.reduced ? 0.2 : 1;

    this.EYE_Y = 0.30;
    this._t = -1; this._raf = null; this._flags = {}; this._shake = 0;
    this._build();
  }

  // ================================================================ setup
  _build() {
    const r = new THREE.WebGLRenderer({ alpha:true, antialias:true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position:"fixed", inset:"0", pointerEvents:"none",
      zIndex:String(this.zIndex), opacity:"0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -30, 30);
    this.camera.position.z = 15;

    this.NOISE = `
      float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      vec2 hash22(vec2 p){
        p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
        return fract(sin(p)*43758.5453);
      }
      float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
      float worley(vec2 p){
        vec2 i=floor(p), f=fract(p); float d=1.0;
        for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
          vec2 g=vec2(float(x),float(y));
          d=min(d, length(g + hash22(i+g) - f));
        }
        return d;
      }
      float ringf(float d, float r, float w){ return smoothstep(w,0.0,abs(d-r)); }
    `;

    this._buildDim(a);
    this._buildMoonHalo();
    this._buildMoon();
    this._buildClouds(a);
    this._buildEye();
    this._buildSigil();
    this._buildSmoke(-2.0, 0.0);      // back smoke
    this._buildSprite();
    this._buildSmoke(3.0, 1.0);       // front smoke
    this._buildTalismans();
    this._buildMotes();
    this._buildFlash(a);

    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  _fullQuad(aspect, mat, z) {
    const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(2*aspect, 2), mat);
    m.position.z = z; this.scene.add(m); return m;
  }

  _buildDim(aspect) {
    this.dimU = { uAmt:{value:0} };
    this.dimMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.dimU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`varying vec2 vUv; uniform float uAmt;
        void main(){
          float d=length(vUv-0.5)*1.42;
          float a=uAmt*(0.34+0.66*smoothstep(0.05,1.0,d));
          if(a<0.004) discard;
          gl_FragColor=vec4(0.008,0.008,0.016,a);
        }`
    });
    this.dim = this._fullQuad(aspect, this.dimMat, -9);
  }

  // ---- moon ------------------------------------------------------------
  _buildMoonHalo() {
    this.mhU = { uAmt:{value:0}, uTime:{value:0} };
    this.mhMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.mhU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        void main(){
          float d=length(vUv-0.5)*2.0;
          float g=pow(smoothstep(1.0,0.0,d),2.3);
          float ring=smoothstep(0.12,0.0,abs(d-0.44))*0.35;
          float a=(g*0.8+ring)*uAmt;
          if(a<0.004) discard;
          gl_FragColor=vec4(mix(vec3(0.42,0.50,0.78),vec3(0.92,0.95,1.0),g),a);
        }`
    });
    this.halo = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.6,3.6), this.mhMat);
    this.halo.position.set(0, this.EYE_Y, -8);
    this.scene.add(this.halo);
  }

  _buildMoon() {
    const tex = new THREE.TextureLoader().load(this.moonSrc);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
    this.moU = { uMap:{value:tex}, uAmt:{value:0}, uTime:{value:0} };
    this.moMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.moU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform sampler2D uMap; uniform float uAmt,uTime;
        void main(){
          vec4 t = texture2D(uMap, vUv);
          if (t.a < 0.01) discard;
          vec2 p = (vUv-0.5)*2.0;
          float d = min(length(p), 1.0);
          vec3 col = t.rgb;

          // sit it in the scene: cool it very slightly, then shade it as a
          // sphere lit from upper-left. the limb term also removes the pale
          // fringe left behind by keying the art off its white background.
          col *= vec3(0.93,0.97,1.06);
          vec3 n = normalize(vec3(p, sqrt(max(0.0, 1.0 - d*d))));
          float lam = clamp(dot(n, normalize(vec3(-0.34,0.40,0.85))), 0.0, 1.0);
          col *= 0.78 + 0.32*lam;
          col *= pow(max(0.0, 1.0 - d*d*0.90), 0.14);

          gl_FragColor = vec4(col, t.a*uAmt);
        }`
    });
    this.moon = new THREE.Mesh(new THREE.PlaneBufferGeometry(1.62,1.62), this.moMat);
    this.moon.position.set(0, this.EYE_Y, -7);
    this.scene.add(this.moon);
  }

  _buildClouds(aspect) {
    this.clU = { uAmt:{value:0}, uTime:{value:0}, uAspect:{value:aspect} };
    this.clMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.clU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime,uAspect;
        ${this.NOISE}
        void main(){
          vec2 p=vec2(vUv.x*uAspect, vUv.y);
          float n=fbm(vec2(p.x*1.5 + uTime*0.09, p.y*5.0));
          float band=pow(smoothstep(0.50,0.92,n),1.8);
          float zone=smoothstep(0.30,0.62,vUv.y)*smoothstep(0.98,0.72,vUv.y);
          float a=band*zone*uAmt*0.55;
          if(a<0.004) discard;
          gl_FragColor=vec4(0.06,0.06,0.11,a);
        }`
    });
    this.clouds = this._fullQuad(aspect, this.clMat, -6.5);
  }

  // ---- the eye ------------------------------------------------------------
  _buildEye() {
    this.eyU = { uOpen:{value:0}, uAmt:{value:0}, uTime:{value:0}, uRatio:{value:0.95/1.7} };
    this.eyMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.eyU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uOpen,uAmt,uTime,uRatio;
        ${this.NOISE}
        void main(){
          vec2 p=(vUv-0.5)*2.0;

          // ---- eyelid: an almond that opens ------------------------
          float lid = uOpen*pow(max(0.0,1.0-p.x*p.x), 0.60);
          float inside = smoothstep(0.0,0.055, lid-abs(p.y));
          if(inside<=0.002) discard;

          // circular in WORLD units, not uv — the quad is wide
          vec2 q = vec2(p.x, p.y*uRatio);
          float d = length(q);
          float ang = atan(q.y,q.x);

          // sclera with faint veins
          vec3 col = vec3(0.10,0.07,0.16);
          float vein = pow(smoothstep(0.62,1.0, fbm(vec2(ang*3.0, d*7.0))),3.0);
          col += vec3(0.35,0.12,0.30)*vein*0.45;

          // iris
          float iris = smoothstep(0.47,0.43,d);
          float fib = fbm(vec2(ang*7.0, d*9.0 - uTime*0.25));
          float rings = 0.5+0.5*sin(d*46.0 - uTime*0.8);
          vec3 irisCol = mix(vec3(0.22,0.05,0.48), vec3(0.72,0.36,1.0), fib);
          irisCol += vec3(0.55,0.30,1.0)*rings*0.22;
          irisCol += vec3(0.85,0.70,1.0)*pow(smoothstep(0.42,0.47,d),3.0)*0.8;   // limbal ring
          col = mix(col, irisCol, iris);

          // pupil
          float pupil = smoothstep(0.165,0.135,d);
          col = mix(col, vec3(0.015,0.005,0.03), pupil);
          col += vec3(0.9,0.75,1.0)*smoothstep(0.17,0.155,d)*0.5;

          // specular highlight
          col += vec3(1.0)*smoothstep(0.10,0.0, length(q-vec2(-0.15,0.16)))*0.55;

          float a = inside*uAmt;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
    this.eye = new THREE.Mesh(new THREE.PlaneBufferGeometry(1.7,0.95), this.eyMat);
    this.eye.position.set(0, this.EYE_Y, -5);
    this.scene.add(this.eye);
  }

  // ---- the magic symbol turning in the iris ---------------------------------
  _buildSigil() {
    this.sgU = { uAmt:{value:0}, uTime:{value:0} };
    this.sgMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.sgU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        ${this.NOISE}
        void main(){
          vec2 p=(vUv-0.5)*2.0;
          float d=length(p);
          float ang=atan(p.y,p.x);
          if(d>1.05) discard;

          float g=0.0;
          g += ringf(d,0.96,0.013);
          g += ringf(d,0.88,0.006)*0.7;
          g += ringf(d,0.40,0.009)*0.8;

          // rune ticks around the outer band
          float a1 = ang + uTime*0.45;
          g += step(0.58, fract(a1/6.2831*40.0))*ringf(d,0.92,0.045)*0.9;

          // two counter-rotating triangles = hexagram
          for(int k=0;k<2;k++){
            float rot = uTime*(k==0?0.55:-0.55) + float(k)*1.0472;
            float aa = mod(ang+rot, 2.0944) - 1.0472;
            float poly = cos(aa)*d;
            g += smoothstep(0.016,0.0, abs(poly-0.56))*0.85;
          }

          // three tomoe orbiting the ring
          for(int i=0;i<3;i++){
            float a0 = uTime*0.9 + float(i)*2.0944;
            vec2 c = vec2(cos(a0),sin(a0))*0.70;
            g += smoothstep(0.095,0.0, length(p-c));            // head
            float da = ang - a0;
            da = atan(sin(da), cos(da));                        // wrap to -pi..pi
            float onRing = smoothstep(0.052,0.0, abs(d-0.70));
            float taper = smoothstep(-1.05,-0.05,da)*smoothstep(0.0,-0.35,da);
            g += onRing*taper*0.9;
          }

          float a = clamp(g,0.0,1.6)*uAmt;
          if(a<0.004) discard;
          vec3 col = mix(vec3(0.66,0.30,1.0), vec3(0.96,0.90,1.0), clamp(g,0.0,1.0));
          gl_FragColor = vec4(col,a);
        }`
    });
    this.sigil = new THREE.Mesh(new THREE.PlaneBufferGeometry(0.86,0.86), this.sgMat);
    this.sigil.position.set(0, this.EYE_Y, -4.5);
    this.scene.add(this.sigil);
  }

  // ---- smoke bomb (built twice: behind and in front of him) ------------------
  _buildSmoke(z, front) {
    const u = { uT:{value:1}, uTime:{value:0}, uFront:{value:front} };
    const mat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:u,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uT,uTime,uFront;
        ${this.NOISE}
        void main(){
          vec2 p = vUv-0.5;
          float grow = smoothstep(0.0,0.55,uT);
          float d = length(p*vec2(1.0,1.55))/max(grow,0.03);
          float puff = smoothstep(0.52,0.02,d);
          float ph = uFront*3.3;
          vec2 q = vec2(fbm(vUv*3.0+vec2(uTime*0.42+ph,0.0)),
                        fbm(vUv*3.0+vec2(2.4,1.6)-vec2(uTime*0.30,0.0)));
          float n = fbm(vUv*4.4 + 2.6*q + vec2(-uTime*0.22, uTime*0.34));
          float a = puff*smoothstep(0.20,0.76,n)*(1.0-smoothstep(0.42,1.0,uT));
          a *= mix(0.95,0.62,uFront);
          if(a<0.004) discard;
          vec3 col = mix(vec3(0.13,0.11,0.18), vec3(0.72,0.70,0.80), n);
          col += vec3(0.42,0.16,0.72)*pow(n,3.5)*0.55;     // chakra tint in the billows
          gl_FragColor = vec4(col,a);
        }`
    });
    const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.4,2.6), mat);
    m.position.set(0, this.groundY+0.72, z);
    m.visible = false;
    m.userData.u = u;
    this.scene.add(m);
    if (front > 0.5) this.smokeFront = m; else this.smokeBack = m;
    return m;
  }

  // ---- him ---------------------------------------------------------------------
  _buildSprite() {
    const tex = new THREE.TextureLoader().load(this.src);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;

    this.sprU = {
      uMap:{value:tex}, uTime:{value:0},
      uShade:{value:0}, uRim:{value:0},
      uSigil:{value:0},     // the purple vortexes and headband emblem
      uSwirl:{value:0},     // rotation applied to those vortex regions
      uCloth:{value:0},
      uSmoke:{value:0},     // smoke clinging to him
      uAlpha:{value:0},
      uOrb:{value:new THREE.Vector2(this.orbUV.x, this.orbUV.y)},
      uEmblem:{value:new THREE.Vector2(this.emblemUV.x, this.emblemUV.y)}
    };

    this.sprMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.sprU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform sampler2D uMap;
        uniform float uTime,uShade,uRim,uSigil,uSwirl,uCloth,uSmoke,uAlpha;
        uniform vec2 uOrb, uEmblem;
        ${this.NOISE}

        float violetKey(vec3 c, float l){
          return smoothstep(0.04,0.26, min(c.r,c.b)-c.g)*smoothstep(0.06,0.50,l);
        }

        void main(){
          // scarf tails and cloak drift — upper right, where they stream
          vec2 uv = vUv;
          float tails = smoothstep(0.52,1.0,vUv.x)*smoothstep(0.30,0.92,vUv.y);
          float ears  = smoothstep(0.80,1.0,vUv.y)*smoothstep(0.14,0.42,abs(vUv.x-0.34));
          float w = (tails + ears*0.7)*uCloth;
          uv.x += sin(vUv.y*8.0 - uTime*1.7)*0.013*w;
          uv.y += sin(vUv.x*10.0 + uTime*1.3)*0.006*w;

          // ---- the vortex orbs actually SPIN -------------------------
          // rotate uv locally around each vortex centre, weighted by how
          // close the fragment is, so the galaxies turn in place
          for(int k=0;k<2;k++){
            vec2 c = (k==0) ? uOrb : uEmblem;
            float rad = (k==0) ? 0.115 : 0.048;
            vec2 rel = uv - c;
            float dd = length(rel);
            float wgt = smoothstep(rad, 0.0, dd)*uSwirl;
            if (wgt > 0.001) {
              float ang = uTime*(k==0?1.5:2.6)*wgt;
              float s=sin(ang), co=cos(ang);
              uv = c + mat2(co,-s,s,co)*rel;
            }
          }

          vec4 base = texture2D(uMap, uv);
          float texA = base.a;
          if(texA<0.008) discard;
          vec3 tex = base.rgb;
          float lum = dot(tex, vec3(0.299,0.587,0.114));

          vec3 col = tex * mix(0.08, 1.0, uShade);

          // ---- chakra sigils: headband emblem + every galaxy ---------
          float vio = violetKey(tex, lum);
          float shimmer = 0.72 + 0.28*fbm(vec2(uv.x*16.0, uv.y*16.0 - uTime*2.2));
          col += vec3(0.62,0.26,1.0)*vio*uSigil*shimmer*2.3;
          col += vec3(0.92,0.80,1.0)*pow(vio,2.6)*uSigil*1.5;

          // ---- moonlight rim: cool, from behind ----------------------
          if(uRim > 0.001){
            float px = 0.0055;
            float aL = texture2D(uMap, uv-vec2(px,0.0)).a;
            float aR = texture2D(uMap, uv+vec2(px,0.0)).a;
            float aD = texture2D(uMap, uv-vec2(0.0,px)).a;
            float aU = texture2D(uMap, uv+vec2(0.0,px)).a;
            float edge = clamp(texA - min(min(aL,aR),min(aD,aU)), 0.0, 1.0);
            float fromAbove = 0.55+0.45*smoothstep(0.1,0.9,vUv.y);
            col += vec3(0.74,0.82,1.0)*edge*uRim*fromAbove*3.1;
          }

          // ---- smoke still hanging on him ----------------------------
          float sm = smoothstep(0.42,0.90, fbm(vec2(uv.x*4.5, uv.y*3.0 - uTime*0.9)));
          col = mix(col, col*0.45 + vec3(0.42,0.40,0.50), sm*uSmoke*0.85);

          float a = texA*uAlpha;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });

    const h = 1.72, w = h*this.aspect;
    this.spriteH = h;
    this.sprite = new THREE.Mesh(new THREE.PlaneBufferGeometry(w,h), this.sprMat);
    this.sprite.position.set(0, this.groundY + h*0.5, 0);
    this.scene.add(this.sprite);
  }

  // ---- paper talismans thrown out by the smoke bomb -------------------------------
  _buildTalismans() {
    const cv = document.createElement("canvas"); cv.width=64; cv.height=128;
    const c = cv.getContext("2d");
    c.fillStyle = "#ddd4c2"; c.fillRect(8,4,48,120);
    c.fillStyle = "#7a2020";
    c.fillRect(20,18,24,5); c.fillRect(20,34,24,4);
    c.fillRect(24,48,16,4); c.fillRect(20,62,24,4);
    c.fillRect(26,78,12,4); c.fillRect(20,94,24,5);
    c.strokeStyle="rgba(60,50,40,0.5)"; c.lineWidth=2; c.strokeRect(8,4,48,120);
    const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter;

    this.tal = [];
    this.talDummy = new THREE.Object3D();
    const n = 26;
    this.talInst = new THREE.InstancedMesh(
      new THREE.PlaneBufferGeometry(0.5,1.0),
      new THREE.MeshBasicMaterial({ map:tex, transparent:true, alphaTest:0.3,
        side:THREE.DoubleSide, depthWrite:false }),
      n
    );
    this.talInst.frustumCulled = false;
    this.talInst.position.z = 2.5;
    this.scene.add(this.talInst);
    for (let i=0;i<n;i++) this.tal.push({ i, live:false });
    this._parkTal();
  }

  _parkTal() {
    for (const t of this.tal) {
      t.live = false;
      this.talDummy.scale.setScalar(0); this.talDummy.updateMatrix();
      this.talInst.setMatrixAt(t.i, this.talDummy.matrix);
    }
    this.talInst.instanceMatrix.needsUpdate = true;
  }

  _burstTal() {
    for (const t of this.tal) {
      const ang = Math.random()*Math.PI*2;
      const sp = 0.45 + Math.random()*1.5;
      t.live = true;
      t.x = (Math.random()*2-1)*0.18;
      t.y = this.groundY + 0.3 + Math.random()*0.4;
      t.vx = Math.cos(ang)*sp;
      t.vy = Math.abs(Math.sin(ang))*sp*0.8 + 0.35;
      t.size = 0.10 + Math.random()*0.07;
      t.rx = Math.random()*6.28; t.ry = Math.random()*6.28; t.rz = Math.random()*6.28;
      t.wrx = (Math.random()-0.5)*6; t.wry = (Math.random()-0.5)*7; t.wrz = (Math.random()-0.5)*5;
      t.bob = 0.8+Math.random()*1.5; t.phase = Math.random()*6.28;
      t.drag = 1.2+Math.random()*1.0;
    }
  }

  _updateTal(dt, el, fade) {
    for (const t of this.tal) {
      if (!t.live) continue;
      t.vx += (0.10 - t.vx)*t.drag*dt;
      t.vy += (-0.30 + Math.sin(el*t.bob+t.phase)*0.35 - t.vy)*t.drag*0.7*dt;
      t.x += t.vx*dt; t.y += t.vy*dt;
      t.rx += t.wrx*dt; t.ry += t.wry*dt;
      t.rz += (t.wrz + Math.sin(el*t.bob+t.phase)*1.2)*dt;
      if (t.y < this.groundY-0.04) { t.y = this.groundY-0.04; t.vy = 0; t.vx *= 0.88; }
      this.talDummy.position.set(t.x,t.y,0);
      this.talDummy.rotation.set(t.rx,t.ry,t.rz);
      this.talDummy.scale.setScalar(t.size*fade);
      this.talDummy.updateMatrix();
      this.talInst.setMatrixAt(t.i, this.talDummy.matrix);
    }
    this.talInst.instanceMatrix.needsUpdate = true;
  }

  _buildMotes() {
    this.M = 240;
    this.mseed = new Float32Array(this.M);
    const g = new THREE.BufferGeometry();
    const arr = new Float32Array(this.M*3);
    for (let i=0;i<this.M;i++){
      arr[i*3]=(Math.random()*2-1)*1.5;
      arr[i*3+1]=-1+Math.random()*2;
      this.mseed[i]=Math.random()*6.28;
    }
    g.setAttribute("position", new THREE.BufferAttribute(arr,3));
    const cv=document.createElement("canvas"); cv.width=cv.height=64;
    const c=cv.getContext("2d");
    const gr=c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(240,230,255,1)");
    gr.addColorStop(0.35,"rgba(170,100,255,0.45)");
    gr.addColorStop(1,"rgba(110,40,200,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.moteMat = new THREE.PointsMaterial({
      size:0.014, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.motes = new THREE.Points(g, this.moteMat);
    this.motes.position.z = 2.2;
    this.scene.add(this.motes);
  }

  _buildFlash(aspect) {
    this.flashMat = new THREE.MeshBasicMaterial({
      color:0xd8c8ff, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    this.flash = this._fullQuad(aspect, this.flashMat, 8);
  }

  // ============================================================== control
  play() {
    this._flags = {}; this._shake = 0;
    this._parkTal();
    this.smokeBack.visible=false; this.smokeFront.visible=false;
    this.flashMat.opacity=0;
    if (this._t < 0) {
      this._t = 0;
      this.renderer.domElement.style.opacity = "1";
      this._clock = new THREE.Clock();
      this._loop();
    } else this._t = 0;
    return this;
  }

  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    const dt = Math.min(this._clock.getDelta(), 0.05);
    const el = this._clock.elapsedTime;
    if (this._t < 0) return;

    this._t += dt / this.duration;
    const T = Math.min(this._t, 1);
    const F = this._flags;

    // ================== timeline ====================================
    // 0.00–0.10  dark
    // 0.06–0.24  the EYE opens
    // 0.16–0.36  the SIGIL turns in the iris
    // 0.34–0.44  the eye closes
    // 0.40–0.58  the MOON rises in its place
    // 0.56–0.64  SMOKE BOMB
    // 0.62–0.80  the smoke clears — he is standing there
    // 0.76–1.00  sigils burn, moonlit, settle
    const dark    = sm(T,0.00,0.10);
    const eyeOpen = sm(T,0.06,0.24)*(1 - sm(T,0.34,0.44));
    const sigil   = sm(T,0.16,0.30)*(1 - sm(T,0.34,0.42));
    const moon    = sm(T,0.40,0.58)*(1 - sm(T,0.94,1.00));
    const smoke   = sm(T,0.56,0.62);
    const clear   = sm(T,0.62,0.80);
    const hold    = sm(T,0.74,0.88);
    const outro   = sm(T,0.93,1.00);

    this.dimU.uAmt.value = sm(T,0.01,0.10)*(1-outro)*0.94;

    // ---- eye + sigil ----------------------------------------------------
    this.eyU.uAmt.value = eyeOpen;
    this.eyU.uOpen.value = sm(T,0.06,0.22)*(1 - sm(T,0.34,0.43));
    this.eyU.uTime.value = el;
    this.sgU.uAmt.value = sigil*0.95;
    this.sgU.uTime.value = el;
    this.sigil.scale.setScalar(0.6 + sigil*0.45);
    if (!F.eye && T >= 0.07) { F.eye = true; if (this.onEye) this.onEye(); }

    // ---- moon -----------------------------------------------------------
    this.moU.uAmt.value = moon; this.moU.uTime.value = el;
    this.mhU.uAmt.value = moon*0.50; this.mhU.uTime.value = el;
    this.clU.uAmt.value = moon*0.9; this.clU.uTime.value = el;
    // rises into place as it fades in
    const my = this.EYE_Y - 0.22 + moon*0.22;
    this.moon.position.y = my; this.halo.position.y = my;
    this.moon.scale.setScalar(0.86 + moon*0.14);
    if (!F.moon && T >= 0.42) { F.moon = true; if (this.onMoon) this.onMoon(); }

    // ---- smoke bomb -------------------------------------------------------
    if (!F.smoke && T >= 0.565) {
      F.smoke = true;
      this.smokeBack.visible = true; this.smokeBack.userData.u.uT.value = 0;
      this.smokeFront.visible = true; this.smokeFront.userData.u.uT.value = 0;
      this._burstTal();
      this.flashMat.opacity = 0.5;
      this._shake = 0.7*this.shakeK;
      if (this.onSmoke) this.onSmoke();
    }
    for (const s of [this.smokeBack, this.smokeFront]) {
      if (!s.visible) continue;
      s.userData.u.uT.value += dt/2.3;
      s.userData.u.uTime.value = el;
      if (s.userData.u.uT.value >= 1) s.visible = false;
    }
    this._updateTal(dt, el, 1-outro);

    // ---- him ---------------------------------------------------------------
    const sc = 0.94 + clear*0.06;
    this.sprite.scale.set(sc, sc, 1);
    this.sprite.position.set(0,
      this.groundY + this.spriteH*0.5*sc + hold*0.012*Math.sin(el*1.6), 0);

    this.sprU.uTime.value = el;
    this.sprU.uAlpha.value = sm(T,0.58,0.68)*(1-outro);
    this.sprU.uShade.value = sm(T,0.62,0.80);
    this.sprU.uRim.value = (clear*0.55 + hold*0.35)*(1-outro);
    this.sprU.uSigil.value = (clear*0.55 + hold*0.95)*(1-outro);
    this.sprU.uSwirl.value = (clear*0.6 + hold*1.0)*(1-outro);
    this.sprU.uCloth.value = 1.25 - hold*0.55;
    this.sprU.uSmoke.value = (1 - clear)*0.9;

    // ---- motes ---------------------------------------------------------------
    {
      const pos = this.motes.geometry.attributes.position.array;
      for (let i=0;i<this.M;i++){
        pos[i*3+1] += (0.05 + 0.05*Math.sin(this.mseed[i]))*dt;
        pos[i*3]   += Math.sin(el*0.8 + this.mseed[i])*0.05*dt;
        if (pos[i*3+1] > 1.05) { pos[i*3+1] = -1.02; pos[i*3] = (Math.random()*2-1)*1.5; }
      }
      this.motes.geometry.attributes.position.needsUpdate = true;
      this.moteMat.opacity = (sigil*0.45 + hold*0.65)*(1-outro);
    }

    if (this.flashMat.opacity > 0)
      this.flashMat.opacity = Math.max(0, this.flashMat.opacity - dt*2.2);

    this._shake = Math.max(0, this._shake - dt*2.4);
    this.camera.position.x = (Math.random()-0.5)*0.07*this._shake;
    this.camera.position.y = (Math.random()-0.5)*0.07*this._shake;

    this.renderer.render(this.scene, this.camera);

    if (this._t >= 1) {
      this._t = -1;
      cancelAnimationFrame(this._raf); this._raf = null;
      this.renderer.domElement.style.opacity = "0";
      this.camera.position.set(0,0,15);
      this.renderer.clear();
      if (this.onComplete) this.onComplete();
    }

    function sm(v,e0,e1){
      const t = THREE.MathUtils.clamp((v-e0)/(e1-e0),0,1);
      return t*t*(3-2*t);
    }
  }

  _resize() {
    const a = innerWidth/innerHeight;
    this.renderer.setSize(innerWidth, innerHeight);
    this.camera.left=-a; this.camera.right=a;
    this.camera.updateProjectionMatrix();
    for (const m of [this.dim,this.clouds,this.flash]) {
      m.geometry.dispose();
      m.geometry = new THREE.PlaneBufferGeometry(2*a,2);
    }
    this.clU.uAspect.value = a;
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize", this._onResize);
    this.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

const field = document.getElementById("field");
const shake = (px, ms) => field.animate(
  [{transform:"translate(0,0)"},
   {transform:`translate(${-px}px,${px*0.6}px)`},
   {transform:`translate(${px*0.75}px,${-px*0.5}px)`},
   {transform:"translate(0,0)"}],
  {duration:ms, easing:"ease-out"});

const fx = new SigilMoonVFX({
  src: BUNNY,
  moonSrc: MOON,
  onEye(){ field.animate([{filter:"brightness(1)"},{filter:"brightness(0.4)"}],
    {duration:900, easing:"ease-out", fill:"forwards"}); },
  onMoon(){ field.animate([{filter:"brightness(0.4)"},{filter:"brightness(0.62)"}],
    {duration:1000, easing:"ease-out", fill:"forwards"}); },
  onSmoke(){ shake(10, 420); },
  onComplete(){ field.animate([{filter:"brightness(0.62)"},{filter:"brightness(1)"}],
    {duration:800, easing:"ease-out", fill:"forwards"}); }
});
// In-game the file loads inside an iframe over the battlefield — drop the preview
// backdrop there so the FIELD shows through. Standalone keeps it so you can see it.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Optional ?art=<url> overrides the card image (in-game passes the summoned unit's own card art).
try { const _a = new URLSearchParams(location.search).get('art'); if (_a) { const _c = document.getElementById('card'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } } catch (e) {}
document.addEventListener('click', () => fx.play());
fx.play();
