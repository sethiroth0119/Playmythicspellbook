<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · DAVID THE SEA WONDER</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — lets you SEE the transparency when you open this
     file directly. In-game (loaded in an iframe over the battlefield) it is
     removed so the FIELD shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change: transform, filter; }
    /* 👑 The unit's REAL card — the full framed ACE card PNG (frame + scene baked in).
     Displayed as-is; the VFX plays around it. In-game ?art can swap it. */
  #card { position:relative; z-index:200; height:78vh; max-height:680px;
    aspect-ratio: 1024 / 1536; background: center/contain no-repeat;
    background-image: url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/David the Sea Wonder.png");
    filter: drop-shadow(0 26px 64px rgba(0,0,0,0.72)); }

  

  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px; z-index:200;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(3,6,8,0.94)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#0a1a1c; background:#66d6d2; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(102,214,210,0.4); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#7d8d8c; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#66d6d2; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"><div id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   TidalArrivalVFX — rides in inside a wave that bursts apart
   ---------------------------------------------------------------------
   Beats: sea floods in → a wave wall rises → surges forward carrying him
          → BURST → water sheets off him → drains away
   The trick that sells it: the wave is TWO layers with the sprite
   sandwiched between them. The back wall is the body of the wave; the
   front sheet is translucent and drawn over him. He is therefore
   genuinely inside the water, not standing in front of a picture of it.
   While submerged his sprite is tinted, refraction-wobbled and lit by
   caustics; all three release on the burst.
   ===================================================================== */
class TidalArrivalVFX {
  constructor(opts = {}) {
    this.src = opts.src;
    this.duration = opts.duration || 5.6;
    this.aspect = opts.spriteAspect || (1016 / 1469);
    this.groundY = opts.groundY != null ? opts.groundY : -0.80;
    this.onSurge = opts.onSurge || null;
    this.onBurst = opts.onBurst || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 60;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.shakeK = this.reduced ? 0.2 : 1;

    this.BURST = 0.545;
    this._t = -1; this._raf = null; this._flags = {}; this._shake = 0;
    this._build();
  }

  // ================================================================ setup
  _build() {
    const r = new THREE.WebGLRenderer({ alpha:true, antialias:true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position:"fixed", inset:"0", pointerEvents:"none",
      zIndex:String(this.zIndex), opacity:"0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -30, 30);
    this.camera.position.z = 15;

    this.NOISE = `
      float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
    `;

    this._buildDim(a);
    this._buildFlood(a);
    this.waveBack  = this._buildWave(a, -4, 0.0);
    this._buildSprite();
    this.waveFront = this._buildWave(a,  2.0, 1.0);
    this._buildMist(a);
    this._buildFoamRings();
    this._buildDroplets();
    this._buildSpray();
    this._buildFlash(a);

    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  _fullQuad(aspect, mat, z) {
    const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(2*aspect, 2), mat);
    m.position.z = z; this.scene.add(m); return m;
  }

  _buildDim(aspect) {
    this.dimU = { uAmt:{value:0} };
    this.dimMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.dimU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`varying vec2 vUv; uniform float uAmt;
        void main(){
          float d=length(vUv-0.5)*1.42;
          float a=uAmt*(0.30+0.70*smoothstep(0.05,1.0,d));
          if(a<0.004) discard;
          gl_FragColor=vec4(0.004,0.020,0.026,a);
        }`
    });
    this.dim = this._fullQuad(aspect, this.dimMat, -9);
  }

  // ---- flooded ground: level rises, then drains ---------------------------
  _buildFlood(aspect) {
    this.flU = { uLevel:{value:0}, uTime:{value:0}, uAspect:{value:aspect},
                 uRing:{value:1}, uGround:{value:this.groundY} };
    this.flMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.flU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uLevel,uTime,uAspect,uRing;
        ${this.NOISE}
        void main(){
          vec2 p = vec2((vUv.x-0.5)*uAspect, vUv.y);
          // surface line low on screen, wobbling
          float surf = 0.06 + uLevel*0.20 + (fbm(vec2(p.x*3.0, uTime*0.8))-0.5)*0.035*uLevel;
          float water = smoothstep(surf, surf-0.012, vUv.y);
          if (water <= 0.002) discard;

          float depth = clamp((surf - vUv.y)/max(surf,0.02), 0.0, 1.0);
          vec3 col = mix(vec3(0.10,0.44,0.46), vec3(0.02,0.14,0.20), pow(depth,0.55));

          // moving highlights + foam lace on the surface
          float lace = fbm(vec2(p.x*7.0 - uTime*1.3, vUv.y*10.0 + uTime*0.7));
          col += vec3(0.22,0.55,0.55)*pow(smoothstep(0.55,1.0,lace),2.0)*0.5;
          float rim = smoothstep(0.030,0.0, abs(vUv.y-surf))*(0.4+smoothstep(0.35,0.8,lace));
          col = mix(col, vec3(0.92,0.98,0.99), rim);

          // burst ring travelling across the surface
          float d = length(vec2(p.x, (vUv.y-surf)*3.0));
          float tr = smoothstep(0.06,0.0, abs(d - uRing*1.5))*(1.0-uRing);
          col = mix(col, vec3(0.95,1.0,1.0), tr);

          float a = clamp(water*0.88 + rim*0.6 + tr, 0.0, 1.0)*smoothstep(0.0,0.06,uLevel);
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
    this.flood = this._fullQuad(aspect, this.flMat, -6);
  }

  // ---- wave wall (used twice: body behind him, sheet in front) -------------
  _buildWave(aspect, z, front) {
    const u = { uRise:{value:0}, uTime:{value:0}, uAspect:{value:aspect},
                uFront:{value:front}, uAmt:{value:0} };
    const mat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:u,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform float uRise,uTime,uAspect,uFront,uAmt;
        ${this.NOISE}
        void main(){
          vec2 p = vec2((vUv.x-0.5)*uAspect, vUv.y);

          // crest profile — the front sheet is phase-shifted so the two
          // layers never line up and the wave reads as having volume
          float ph = uFront*1.9;
          float prof = 0.74 + 0.26*sin(p.x*1.45 + uTime*0.55 + ph);
          float rough = (fbm(vec2(p.x*2.3, uTime*0.75 + ph*2.0))-0.5)*0.24;
          float h = uRise*(prof + rough);
          if (h <= 0.01) discard;

          float body = smoothstep(h, h-0.05, vUv.y);
          if (body <= 0.002) discard;

          float depth = clamp((h - vUv.y)/max(h,0.05), 0.0, 1.0);
          vec3 deep    = vec3(0.008,0.11,0.17);
          vec3 shallow = vec3(0.10,0.52,0.52);
          vec3 col = mix(shallow, deep, pow(depth,0.55));

          // light punching through the thin upper face
          col += vec3(0.16,0.58,0.50)*pow(1.0-depth, 2.6)*1.25;

          // water racing down the face
          float st = fbm(vec2(p.x*9.0 + ph, vUv.y*3.2 - uTime*1.7));
          col += vec3(0.26,0.62,0.62)*pow(smoothstep(0.55,1.0,st),2.0)*0.55;

          // crest foam + churn
          float lace = fbm(vec2(p.x*8.0 - uTime*1.5, vUv.y*8.0 + uTime*0.85) + ph);
          float rim  = smoothstep(0.085,0.0, abs(vUv.y-h))*(0.45+smoothstep(0.30,0.75,lace));
          float boil = smoothstep(0.62,0.96,lace)*smoothstep(0.30,0.0, h-vUv.y)*0.85;
          float foam = clamp(rim+boil, 0.0, 1.0);
          col = mix(col, vec3(0.93,0.99,1.0), foam);

          float a = (body*mix(0.94,0.50,uFront) + foam*0.85)*uAmt;
          if(a<0.004) discard;
          gl_FragColor = vec4(col, clamp(a,0.0,1.0));
        }`
    });
    const m = this._fullQuad(aspect, mat, z);
    m.userData.u = u;
    return m;
  }

  // ---- him -----------------------------------------------------------------
  _buildSprite() {
    const tex = new THREE.TextureLoader().load(this.src);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;

    this.sprU = {
      uMap:{value:tex}, uTime:{value:0},
      uSub:{value:1},      // 1 = inside the water
      uWobble:{value:0},   // refraction
      uSheet:{value:0},    // water running off him
      uCoat:{value:0},     // coat + hair drift
      uShade:{value:0},
      uRim:{value:0},
      uGlint:{value:0}, uGlintPos:{value:-0.25},
      uAlpha:{value:0}
    };

    this.sprMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.sprU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform sampler2D uMap;
        uniform float uTime,uSub,uWobble,uSheet,uCoat,uShade,uRim,uGlint,uGlintPos,uAlpha;
        ${this.NOISE}

        void main(){
          // ---- refraction while he is still inside the wave ----------
          vec2 uv = vUv;
          uv.x += sin(vUv.y*21.0 + uTime*3.1)*0.011*uWobble;
          uv.y += sin(vUv.x*16.0 - uTime*2.5)*0.008*uWobble;

          // ---- coat tails and hat plume drift ------------------------
          float tails = smoothstep(0.46, 0.0, vUv.y);
          float sides = smoothstep(0.16, 0.46, abs(vUv.x-0.5));
          float w = (tails*0.9 + sides*0.5)*uCoat;
          uv.x += sin(vUv.y*7.5 - uTime*1.6)*0.015*w;
          uv.y += sin(vUv.x*9.0 + uTime*1.2)*0.006*w;

          vec4 base = texture2D(uMap, uv);
          float texA = base.a;
          if (texA < 0.008) discard;
          vec3 tex = base.rgb;
          float lum = dot(tex, vec3(0.299,0.587,0.114));

          vec3 col = tex * mix(0.10, 1.0, uShade);

          // ---- submerged: tint toward the water, plus caustics --------
          vec3 tint = vec3(0.04,0.26,0.30);
          col = mix(col, tint + col*0.30, uSub*0.88);
          float ca = pow(smoothstep(0.55,1.0, fbm(vec2(uv.x*7.5, uv.y*5.0 - uTime*0.95))), 2.0);
          col += vec3(0.30,0.85,0.82)*ca*uSub*0.85;

          // ---- water sheeting off him after the burst -----------------
          float sh = smoothstep(0.60,1.0, fbm(vec2(uv.x*26.0, uv.y*3.2 + uTime*4.4)));
          col += vec3(0.62,0.88,1.0)*sh*uSheet*1.5;

          // ---- gold trim glint on the reveal --------------------------
          float gold = smoothstep(0.12,0.55,lum)
                     * smoothstep(0.03,0.20, tex.r-tex.b)
                     * smoothstep(0.24,0.03, tex.r-tex.g);
          float sweep = exp(-pow((vUv.y - uGlintPos)*6.0, 2.0));
          col += vec3(1.0,0.86,0.44)*gold*sweep*uGlint*2.6;

          // ---- rim from the water light --------------------------------
          if(uRim > 0.001){
            float px = 0.0055;
            float aL = texture2D(uMap, uv-vec2(px,0.0)).a;
            float aR = texture2D(uMap, uv+vec2(px,0.0)).a;
            float aD = texture2D(uMap, uv-vec2(0.0,px)).a;
            float aU = texture2D(uMap, uv+vec2(0.0,px)).a;
            float edge = clamp(texA - min(min(aL,aR),min(aD,aU)), 0.0, 1.0);
            col += vec3(0.60,0.92,1.0)*edge*uRim*3.0;
          }

          float a = texA*uAlpha;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });

    const h = 1.76, w = h*this.aspect;
    this.spriteH = h;
    this.sprite = new THREE.Mesh(new THREE.PlaneBufferGeometry(w,h), this.sprMat);
    this.sprite.position.set(0, this.groundY + h*0.5, 0);
    this.scene.add(this.sprite);
  }

  // ---- mist wall thrown out by the burst ------------------------------------
  _buildMist(aspect) {
    this.miU = { uT:{value:1}, uTime:{value:0}, uAspect:{value:aspect} };
    this.miMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.miU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uT,uTime,uAspect;
        ${this.NOISE}
        void main(){
          vec2 p = vec2((vUv.x-0.5)*uAspect, vUv.y-0.35);
          float grow = smoothstep(0.0,0.75,uT);
          float d = length(p*vec2(0.62,1.35))/max(grow,0.03);
          float puff = smoothstep(0.62,0.03,d);
          vec2 q = vec2(fbm(vUv*3.0+vec2(uTime*0.4,0.0)), fbm(vUv*3.0+vec2(1.9,2.4)));
          float n = fbm(vUv*4.2 + 2.2*q + vec2(-uTime*0.3, uTime*0.25));
          float a = puff*smoothstep(0.22,0.75,n)*(1.0-smoothstep(0.35,1.0,uT))*0.85;
          if(a<0.004) discard;
          vec3 col = mix(vec3(0.34,0.55,0.58), vec3(0.90,0.97,0.99), n);
          gl_FragColor = vec4(col,a);
        }`
    });
    this.mist = this._fullQuad(aspect, this.miMat, 3.0);
    this.mist.visible = false;
  }

  _buildFoamRings() {
    const mk = () => new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:{ uT:{value:1}, uTime:{value:0} },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uT,uTime;
        ${this.NOISE}
        void main(){
          float d=length(vUv-0.5)*2.0;
          float rad=pow(uT,0.52)*1.04;
          float n=fbm(vUv*8.0+vec2(-uTime*0.7,uTime*0.4));
          float w=mix(0.13,0.010,uT)*(0.55+n*0.9);
          float ring=smoothstep(w,0.0,abs(d-rad));
          float a=ring*smoothstep(0.25,0.8,n)*(1.0-uT)*1.5;
          if(a<0.004) discard;
          gl_FragColor=vec4(mix(vec3(1.0),vec3(0.55,0.90,0.94),uT),a);
        }`
    });
    this.ringA = new THREE.Mesh(new THREE.PlaneBufferGeometry(4.4,4.4), mk());
    this.ringA.position.z = 3.4; this.ringA.visible=false;
    this.ringB = new THREE.Mesh(new THREE.PlaneBufferGeometry(4.0,4.0), mk());
    this.ringB.position.set(0,this.groundY,3.3);
    this.ringB.scale.set(1,0.28,1); this.ringB.visible=false;
    this.scene.add(this.ringA, this.ringB);
  }

  // ---- the burst itself: a lot of water going everywhere -----------------------
  _buildDroplets() {
    this.N = 760;
    this.vel = new Float32Array(this.N*3);
    this.seed = new Float32Array(this.N);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(this.N*3),3));
    const cv = document.createElement("canvas"); cv.width=cv.height=64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(255,255,255,1)");
    gr.addColorStop(0.42,"rgba(190,240,250,0.5)");
    gr.addColorStop(1,"rgba(120,200,220,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.dropMat = new THREE.PointsMaterial({
      size:0.020, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.drops = new THREE.Points(g, this.dropMat);
    this.drops.position.z = 4.0; this.drops.visible=false;
    this.scene.add(this.drops);
  }

  _burstDroplets() {
    const pos = this.drops.geometry.attributes.position.array;
    for (let i=0;i<this.N;i++){
      const ang = Math.random()*Math.PI*2;
      const rad = Math.pow(Math.random(),0.6)*0.30;
      pos[i*3]   = Math.cos(ang)*rad;
      pos[i*3+1] = this.groundY + 0.55 + Math.sin(ang)*rad*1.4;
      pos[i*3+2] = 0;
      const sp = 0.7 + Math.random()*2.6;
      this.vel[i*3]   = Math.cos(ang)*sp;
      this.vel[i*3+1] = Math.sin(ang)*sp*0.85 + 0.55;
      this.seed[i] = Math.random()*6.28;
    }
    this.drops.geometry.attributes.position.needsUpdate = true;
    this.drops.visible = true; this.dropMat.opacity = 1;
  }

  // ---- ambient spray hanging in the air ------------------------------------------
  _buildSpray() {
    this.M = 220;
    this.mseed = new Float32Array(this.M);
    const g = new THREE.BufferGeometry();
    const arr = new Float32Array(this.M*3);
    for (let i=0;i<this.M;i++){
      arr[i*3]   = (Math.random()*2-1)*1.5;
      arr[i*3+1] = -1 + Math.random()*1.6;
      this.mseed[i] = Math.random()*6.28;
    }
    g.setAttribute("position", new THREE.BufferAttribute(arr,3));
    const cv = document.createElement("canvas"); cv.width=cv.height=64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(235,252,255,1)");
    gr.addColorStop(0.4,"rgba(140,215,230,0.35)");
    gr.addColorStop(1,"rgba(90,170,200,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.sprayMat = new THREE.PointsMaterial({
      size:0.013, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.spray = new THREE.Points(g, this.sprayMat);
    this.spray.position.z = 3.6;
    this.scene.add(this.spray);
  }

  _buildFlash(aspect) {
    this.flashMat = new THREE.MeshBasicMaterial({
      color:0xd8f6ff, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    this.flash = this._fullQuad(aspect, this.flashMat, 8);
  }

  // ============================================================== control
  play() {
    this._flags = {}; this._shake = 0;
    this.drops.visible=false; this.dropMat.opacity=0;
    this.mist.visible=false;
    this.ringA.visible=false; this.ringB.visible=false;
    this.flashMat.opacity=0; this.flU.uRing.value=1;
    if (this._t < 0) {
      this._t = 0;
      this.renderer.domElement.style.opacity = "1";
      this._clock = new THREE.Clock();
      this._loop();
    } else this._t = 0;
    return this;
  }

  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    const dt = Math.min(this._clock.getDelta(), 0.05);
    const el = this._clock.elapsedTime;
    if (this._t < 0) return;

    this._t += dt / this.duration;
    const T = Math.min(this._t, 1);
    const F = this._flags;
    const B = this.BURST;

    // ================== timeline ====================================
    // 0.00–0.10  the sea floods in, board goes storm-dark
    // 0.06–0.36  a wave wall rises
    // 0.22–0.54  it surges forward carrying him — he resolves inside it
    // 0.545      BURST: the wave blows apart
    // 0.55–0.72  water sheets off him, gold trim catches the light
    // 0.66–0.88  the flood drains away
    // 0.88–1.00  settle
    const flood  = sm(T,0.00,0.14);
    const rise   = sm(T,0.06,0.36);
    const surge  = sm(T,0.22,B);
    const post   = sm(T,B,B+0.10);
    const reveal = sm(T,B,0.72);
    const drain  = sm(T,0.66,0.92);
    const outro  = sm(T,0.90,1.00);

    this.dimU.uAmt.value = sm(T,0.01,0.12)*(1-outro)*0.92;

    this.flU.uLevel.value = (flood*0.55 + surge*0.45)*(1-drain*0.92);
    this.flU.uTime.value = el;
    if (this.flU.uRing.value < 1) this.flU.uRing.value = Math.min(1, this.flU.uRing.value + dt/1.4);

    // ---- the wave: builds, peaks, then collapses on the burst ---------
    const waveH = (rise*0.55 + surge*0.55) * (1 - sm(T,B,B+0.075));
    for (const w of [this.waveBack, this.waveFront]) {
      w.userData.u.uRise.value = waveH;
      w.userData.u.uTime.value = el;
      w.userData.u.uAmt.value = (1 - sm(T,B,B+0.08))*(1-outro);
    }

    // ---- him: carried forward inside it -------------------------------
    const carry = surge;
    const sc = 0.74 + carry*0.26 + post*(1-post)*0.10;
    this.sprite.scale.set(sc, sc, 1);
    this.sprite.position.set(
      Math.sin(el*1.3)*0.020*(1-carry),
      this.groundY + this.spriteH*0.5*sc + (1-carry)*0.16 + Math.sin(el*1.7)*0.012*(1-reveal),
      0
    );
    this.sprite.rotation.z = Math.sin(el*0.9)*0.018*(1-reveal*0.8);

    this.sprU.uTime.value = el;
    this.sprU.uAlpha.value = sm(T,0.20,0.30)*(1-outro);
    this.sprU.uSub.value = 1 - reveal;                       // releases on the burst
    this.sprU.uWobble.value = (1 - reveal)*1.25;
    this.sprU.uSheet.value = sm(T,B,B+0.05)*(1 - sm(T,0.70,0.88))*1.0;
    this.sprU.uCoat.value = 1.4 - reveal*0.9;
    this.sprU.uShade.value = sm(T,0.30,0.62);
    this.sprU.uRim.value = (0.30 + surge*0.35 + post*0.55)*(1-outro);

    const gl = sm(T,0.62,0.66)*(1 - sm(T,0.80,0.88));
    this.sprU.uGlint.value = gl;
    this.sprU.uGlintPos.value = -0.25 + THREE.MathUtils.clamp((T-0.62)/0.16,0,1)*1.5;

    // ---- beats ---------------------------------------------------------
    if (!F.surge && T >= 0.24) { F.surge = true; if (this.onSurge) this.onSurge(); }
    if (!F.burst && T >= B) {
      F.burst = true;
      this._burstDroplets();
      this.mist.visible = true; this.miU.uT.value = 0;
      this.ringA.visible = true; this.ringA.material.uniforms.uT.value = 0;
      this.ringB.visible = true; this.ringB.material.uniforms.uT.value = 0;
      this.flU.uRing.value = 0;
      this.flashMat.opacity = 0.85;
      this._shake = 1.15*this.shakeK;
      if (this.onBurst) this.onBurst();
    }

    if (this.mist.visible) {
      this.miU.uT.value += dt/2.0; this.miU.uTime.value = el;
      if (this.miU.uT.value >= 1) this.mist.visible = false;
    }
    for (const r of [this.ringA, this.ringB]) {
      if (!r.visible) continue;
      r.material.uniforms.uT.value += dt/1.0;
      r.material.uniforms.uTime.value = el;
      if (r.material.uniforms.uT.value >= 1) r.visible = false;
    }

    // ---- droplets ------------------------------------------------------
    if (this.drops.visible) {
      const pos = this.drops.geometry.attributes.position.array;
      for (let i=0;i<this.N;i++){
        this.vel[i*3+1] -= 3.1*dt;
        this.vel[i*3]   *= (1 - 0.5*dt);
        pos[i*3]   += (this.vel[i*3] + Math.sin(el*2.6+this.seed[i])*0.18)*dt;
        pos[i*3+1] += this.vel[i*3+1]*dt;
        if (pos[i*3+1] < this.groundY - 0.04) { pos[i*3+1] = this.groundY - 0.04; this.vel[i*3+1] = 0; this.vel[i*3] *= 0.45; }
      }
      this.drops.geometry.attributes.position.needsUpdate = true;
      this.dropMat.opacity = Math.max(0, this.dropMat.opacity - dt*0.75);
      if (this.dropMat.opacity <= 0.01) this.drops.visible = false;
    }

    // ---- hanging spray ---------------------------------------------------
    {
      const pos = this.spray.geometry.attributes.position.array;
      for (let i=0;i<this.M;i++){
        pos[i*3+1] += (0.06 + 0.05*Math.sin(this.mseed[i]))*dt;
        pos[i*3]   += Math.sin(el*0.9 + this.mseed[i])*0.05*dt;
        if (pos[i*3+1] > 1.05) { pos[i*3+1] = -1.0; pos[i*3] = (Math.random()*2-1)*1.5; }
      }
      this.spray.geometry.attributes.position.needsUpdate = true;
      this.sprayMat.opacity = (surge*0.35 + post*0.55)*(1-outro)*(1-drain*0.6);
    }

    if (this.flashMat.opacity > 0)
      this.flashMat.opacity = Math.max(0, this.flashMat.opacity - dt*2.8);

    this._shake = Math.max(0, this._shake - dt*2.3);
    this.camera.position.x = (Math.random()-0.5)*0.11*this._shake;
    this.camera.position.y = (Math.random()-0.5)*0.11*this._shake;

    this.renderer.render(this.scene, this.camera);

    if (this._t >= 1) {
      this._t = -1;
      cancelAnimationFrame(this._raf); this._raf = null;
      this.renderer.domElement.style.opacity = "0";
      this.camera.position.set(0,0,15);
      this.renderer.clear();
      if (this.onComplete) this.onComplete();
    }

    function sm(v,e0,e1){
      const t = THREE.MathUtils.clamp((v-e0)/(e1-e0),0,1);
      return t*t*(3-2*t);
    }
  }

  _resize() {
    const a = innerWidth/innerHeight;
    this.renderer.setSize(innerWidth, innerHeight);
    this.camera.left=-a; this.camera.right=a;
    this.camera.updateProjectionMatrix();
    for (const m of [this.dim,this.flood,this.waveBack,this.waveFront,this.mist,this.flash]) {
      m.geometry.dispose();
      m.geometry = new THREE.PlaneBufferGeometry(2*a,2);
    }
    this.flU.uAspect.value = a;
    this.miU.uAspect.value = a;
    this.waveBack.userData.u.uAspect.value = a;
    this.waveFront.userData.u.uAspect.value = a;
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize", this._onResize);
    this.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

const field = document.getElementById("field");
const shake = (px, ms) => field.animate(
  [{transform:"translate(0,0)"},
   {transform:`translate(${-px}px,${px*0.7}px)`},
   {transform:`translate(${px*0.8}px,${-px*0.55}px)`},
   {transform:`translate(${-px*0.35}px,${px*0.25}px)`},
   {transform:"translate(0,0)"}],
  {duration:ms, easing:"ease-out"});

const fx = new TidalArrivalVFX({
  src: DAVID,
  onSurge(){ field.animate([{filter:"brightness(1)"},{filter:"brightness(0.5)"}],
    {duration:900, easing:"ease-out", fill:"forwards"}); },
  onBurst(){ shake(17, 560);
    field.animate([{filter:"brightness(0.5)"},{filter:"brightness(0.85)"}],
      {duration:700, easing:"ease-out", fill:"forwards"}); },
  onComplete(){ field.animate([{filter:"brightness(0.85)"},{filter:"brightness(1)"}],
    {duration:750, easing:"ease-out", fill:"forwards"}); }
});
// In-game the file loads inside an iframe over the battlefield — drop the preview
// backdrop there so the FIELD shows through. Standalone keeps it so you can see it.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Optional ?art=<url> overrides the card image (in-game passes the summoned unit's own card art).
try { const _a = new URLSearchParams(location.search).get('art'); if (_a) { const _c = document.getElementById('card'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } } catch (e) {}
document.addEventListener('click', () => fx.play());
fx.play();
</script>
