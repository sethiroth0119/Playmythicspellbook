<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · DIVINE RAIN</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — lets you SEE the transparency when you open this
     file directly. In-game (loaded in an iframe over the battlefield) it is
     removed so the FIELD shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change: transform, filter; }
    /* 👑 The unit's REAL card — the full framed ACE card PNG (frame + scene baked in).
     Displayed as-is; the VFX plays around it. In-game ?art can swap it. */
  #card { position:relative; z-index:200; height:78vh; max-height:680px;
    aspect-ratio: 1024 / 1536; background: center/contain no-repeat;
    background-image: url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/Divine Rain.png");
    filter: drop-shadow(0 26px 64px rgba(0,0,0,0.72)); }

  

  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px; z-index:200;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(5,6,10,0.94)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#1a1208; background:#e8c79a; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(232,199,154,0.35); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#8e8378; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#e8c79a; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"><div id="card"></div></div>

<script src="three.min.js"></script>
<script>
/* =====================================================================
   DivineDescentVFX — descends through a shaft of light, in the rain
   ---------------------------------------------------------------------
   Beats: sky parts → light opens → she forms in the beam → slow float
          down → touchdown ripple → eyes ignite, gleam sweep → settle
   Sprite keys derived from the art itself:
     · cloth/hair drift (hem + outer-upper displacement, not whole-body)
     · warm rim light from the alpha silhouette (she is backlit)
     · top-down light-forming reveal with a bright leading edge
     · red-dominance eye key, metal + gold keys for the gleam sweep
   ===================================================================== */
class DivineDescentVFX {
  constructor(opts = {}) {
    this.src = opts.src;
    this.duration = opts.duration || 5.4;
    this.aspect = opts.spriteAspect || (469 / 740);
    this.eyeUV = opts.eyeUV || { x: 0.481, y: 0.886 };
    this.groundY = opts.groundY != null ? opts.groundY : -0.80;
    this.onOpen = opts.onOpen || null;
    this.onLand = opts.onLand || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 60;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    this._t = -1; this._raf = null; this._flags = {};
    this._build();
  }

  // ================================================================ setup
  _build() {
    const r = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position: "fixed", inset: "0", pointerEvents: "none",
      zIndex: String(this.zIndex), opacity: "0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -30, 30);
    this.camera.position.z = 15;

    this.NOISE = `
      float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
    `;

    this._buildDim(a);
    this._buildClouds(a);
    this._buildShaft();
    this.rainBack  = this._buildRain(a, -6, { cells: 34, speed: 1.15, thin: 0.16, slant: 0.14, bright: 0.50 });
    this._buildWater();
    this._buildAureole();
    this._buildSprite();
    this._buildEyeGlow();
    this._buildDroplets();
    this._buildMotes();
    this.rainFront = this._buildRain(a,  5, { cells: 13, speed: 2.05, thin: 0.34, slant: 0.18, bright: 0.34 });
    this._buildFlash(a);

    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  _fullQuad(aspect, mat, z) {
    const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(2 * aspect, 2), mat);
    m.position.z = z; this.scene.add(m); return m;
  }

  // ---- dim ---------------------------------------------------------------
  _buildDim(aspect) {
    this.dimU = { uAmt: { value: 0 } };
    this.dimMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: this.dimU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `varying vec2 vUv; uniform float uAmt;
        void main(){
          float d = length(vUv-0.5)*1.42;
          float a = uAmt*(0.30+0.70*smoothstep(0.08,1.0,d));
          if(a<0.004) discard;
          gl_FragColor = vec4(0.010,0.010,0.018,a);
        }`
    });
    this.dim = this._fullQuad(aspect, this.dimMat, -9);
  }

  // ---- parting cloud ceiling ----------------------------------------------
  _buildClouds(aspect) {
    this.cloudU = { uT:{value:0}, uTime:{value:0}, uAspect:{value:aspect} };
    this.cloudMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: this.cloudU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uT,uTime,uAspect;
        ${this.NOISE}
        void main(){
          vec2 p = vec2(vUv.x*uAspect, vUv.y);
          vec2 q = vec2(fbm(p*1.5+vec2(uTime*0.055,0.0)), fbm(p*1.5+vec2(2.7,1.1)));
          float n = fbm(p*1.9 + 2.0*q);
          float top = smoothstep(0.18,0.98,vUv.y);
          // the ceiling parts over the beam
          float part = smoothstep(0.34,0.0, abs(vUv.x-0.5)) * uT;
          float dens = smoothstep(0.34,0.84,n)*top*(1.0-part*0.85);
          vec3 col = mix(vec3(0.035,0.036,0.05), vec3(0.20,0.20,0.25), n);
          // light spilling through the gap
          col += vec3(0.55,0.48,0.36)*part*smoothstep(0.5,1.0,n)*1.1;
          float a = dens*0.88*smoothstep(0.0,0.12,uT);
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
    this.clouds = this._fullQuad(aspect, this.cloudMat, -8);
  }

  // ---- volumetric shaft of light ------------------------------------------
  _buildShaft() {
    this.shaftU = { uT:{value:0}, uTime:{value:0}, uWide:{value:0} };
    this.shaftMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: this.shaftU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uT,uTime,uWide;
        ${this.NOISE}
        void main(){
          float x = abs(vUv.x-0.5);
          // narrow at the top, spreading toward the ground
          float w = mix(0.055, 0.30*(0.7+uWide), 1.0-vUv.y);
          float core = smoothstep(w,0.0,x);
          float soft = smoothstep(w*2.6,0.0,x)*0.42;
          // drifting volumetric striations
          float st = vnoise(vec2(x*24.0, vUv.y*2.0 - uTime*0.22));
          float vol = 0.58 + 0.42*st;
          float foot = smoothstep(0.0,0.14,vUv.y);
          float a = (core*0.85 + soft)*vol*foot*uT;
          if(a<0.004) discard;
          vec3 col = mix(vec3(1.00,0.86,0.62), vec3(1.00,0.99,0.95), core);
          gl_FragColor = vec4(col,a);
        }`
    });
    this.shaft = new THREE.Mesh(new THREE.PlaneBufferGeometry(1.9, 2.1), this.shaftMat);
    this.shaft.position.set(0, 0.05, -7);
    this.scene.add(this.shaft);
  }

  // ---- layered rain --------------------------------------------------------
  _buildRain(aspect, z, cfg) {
    const u = {
      uAmt:{value:0}, uTime:{value:0}, uAspect:{value:aspect},
      uCells:{value:cfg.cells}, uSpeed:{value:cfg.speed},
      uThin:{value:cfg.thin}, uSlant:{value:cfg.slant}, uBright:{value:cfg.bright}
    };
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: u,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uAmt,uTime,uAspect,uCells,uSpeed,uThin,uSlant,uBright;
        float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
        void main(){
          vec2 uv = vec2(vUv.x*uAspect, vUv.y);
          float acc = 0.0;
          // three parallax depths per layer
          for(int i=0;i<3;i++){
            float fi = float(i);
            float sc = uCells*(1.0 + fi*0.8);
            vec2 p = uv;
            p.x += p.y*uSlant;
            p *= vec2(sc, sc*0.30);
            p.y -= uTime*uSpeed*(1.0 + fi*0.6);
            vec2 id = floor(p);
            float r = hash21(id);
            vec2 f = fract(p)-0.5;
            f.x += (r-0.5)*0.55;
            float streak = smoothstep(uThin*(1.0+fi*0.35),0.0,abs(f.x))
                         * smoothstep(0.5,0.0,abs(f.y));
            acc += streak*step(0.40,r)*(1.0 - fi*0.24);
          }
          float a = clamp(acc,0.0,1.0)*uAmt*uBright;
          if(a<0.004) discard;
          gl_FragColor = vec4(0.70,0.80,1.0,a);
        }`
    });
    const m = this._fullQuad(aspect, mat, z);
    m.userData.u = u;
    return m;
  }

  // ---- wet ground: ambient splashes + touchdown ring ------------------------
  _buildWater() {
    this.waterU = { uT:{value:0}, uTime:{value:0}, uRing:{value:1} };
    this.waterMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: this.waterU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uT,uTime,uRing;
        float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
        void main(){
          vec2 p = (vUv-0.5)*2.0;
          float d = length(p);

          // rain hitting standing water
          vec2 q = vUv*10.0;
          vec2 id = floor(q); vec2 f = fract(q)-0.5;
          float r = hash21(id);
          float ph = fract(uTime*0.85 + r*7.31);
          float rad = ph*0.42;
          float sp = smoothstep(0.06,0.0,abs(length(f)-rad))*(1.0-ph);

          // touchdown ring
          float tr = smoothstep(0.055,0.0,abs(d - uRing*1.02))*(1.0-uRing);
          float tr2 = smoothstep(0.030,0.0,abs(d - uRing*0.78))*(1.0-uRing)*0.6;

          float vign = smoothstep(1.1,0.15,d);
          float a = (sp*0.40*uT + (tr+tr2)*1.5)*vign;
          if(a<0.004) discard;
          vec3 col = mix(vec3(0.62,0.74,0.95), vec3(1.0,0.94,0.82), tr+tr2);
          gl_FragColor = vec4(col,a);
        }`
    });
    this.water = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.0, 3.0), this.waterMat);
    this.water.position.set(0, this.groundY, -2);
    this.water.scale.set(1, 0.30, 1);
    this.scene.add(this.water);
  }

  // ---- halo behind her ------------------------------------------------------
  _buildAureole() {
    this.auU = { uAmt:{value:0}, uTime:{value:0} };
    this.auMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: this.auU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uAmt,uTime;
        void main(){
          vec2 p = vUv-0.5;
          float d = length(p)*2.0;
          float ang = atan(p.y,p.x);
          float glow = pow(smoothstep(1.0,0.0,d), 2.6);
          float rays = pow(0.5+0.5*sin(ang*22.0 + uTime*0.30),4.0)*smoothstep(1.0,0.15,d)*0.55;
          float a = (glow*0.85 + rays)*uAmt;
          if(a<0.004) discard;
          vec3 col = mix(vec3(1.0,0.80,0.52), vec3(1.0,0.97,0.90), glow);
          gl_FragColor = vec4(col,a);
        }`
    });
    this.aureole = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.2, 2.2), this.auMat);
    this.aureole.position.z = -3;
    this.scene.add(this.aureole);
  }

  // ---- her ------------------------------------------------------------------
  _buildSprite() {
    const tex = new THREE.TextureLoader().load(this.src);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;

    this.sprU = {
      uMap:{value:tex}, uTime:{value:0},
      uForm:{value:0},    // top-down light reveal
      uDrift:{value:0},   // cloth + hair motion
      uShade:{value:0},   // silhouette → lit
      uRim:{value:0},     // backlit edge
      uEye:{value:0},     // red eye ignition
      uGleam:{value:0}, uGleamPos:{value:-0.2},
      uWet:{value:0},
      uAlpha:{value:0},
      uEyeUV:{value:new THREE.Vector2(this.eyeUV.x, this.eyeUV.y)}
    };

    this.sprMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: this.sprU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv;
        uniform sampler2D uMap;
        uniform float uTime,uForm,uDrift,uShade,uRim,uEye,uGleam,uGleamPos,uWet,uAlpha;
        uniform vec2 uEyeUV;
        ${this.NOISE}

        // gown hem sways most; hair drifts at the outer upper edges
        vec2 clothUV(vec2 uv){
          float hem  = smoothstep(0.60, 0.0, uv.y);
          float hair = smoothstep(0.52, 1.0, uv.y)*smoothstep(0.10, 0.40, abs(uv.x-0.5));
          float w = (hem + hair*0.75)*uDrift;
          uv.x += sin(uv.y*6.5 - uTime*1.05 + uv.x*3.4)*0.018*w;
          uv.y += sin(uv.x*8.5 + uTime*0.85)*0.007*w;
          return uv;
        }

        void main(){
          vec2 uv = clothUV(vUv);
          vec4 base = texture2D(uMap, uv);
          float texA = base.a;
          if (texA < 0.008) discard;
          vec3 tex = base.rgb;

          float lum = dot(tex, vec3(0.299,0.587,0.114));
          float mx = max(max(tex.r,tex.g),tex.b);
          float mn = min(min(tex.r,tex.g),tex.b);
          float sat = mx-mn;

          // ---- forms out of the light, top down ----------------------
          float th = (1.0 - uForm*1.18) + (fbm(vUv*5.0)-0.5)*0.055;
          float e = 0.14;
          float m = smoothstep(th, th+e, vUv.y);
          float band = m*(1.0-m)*4.0;

          vec3 col = tex * mix(0.06, 1.0, uShade);

          // ---- backlit rim from the alpha silhouette ------------------
          if (uRim > 0.001){
            float px = 0.0055;
            float aL = texture2D(uMap, uv-vec2(px,0.0)).a;
            float aR = texture2D(uMap, uv+vec2(px,0.0)).a;
            float aD = texture2D(uMap, uv-vec2(0.0,px)).a;
            float aU = texture2D(uMap, uv+vec2(0.0,px)).a;
            float edge = clamp(texA - min(min(aL,aR),min(aD,aU)), 0.0, 1.0);
            // stronger along the top since the light is above her
            float fromAbove = 0.55 + 0.45*smoothstep(0.1,0.9,vUv.y);
            col += vec3(1.0,0.88,0.66)*edge*uRim*fromAbove*3.4;
          }

          // ---- gleam sweep across blade and gold ----------------------
          float metal = smoothstep(0.10,0.42,lum)*(1.0-clamp(sat*3.2,0.0,1.0));
          float gold  = smoothstep(0.14,0.55,lum)
                      * smoothstep(0.02,0.20, tex.r-tex.b)
                      * smoothstep(0.26,0.04, tex.r-tex.g);
          float sweep = exp(-pow((vUv.y - uGleamPos)*6.5, 2.0));
          col += (vec3(1.0,0.97,0.90)*metal + vec3(1.0,0.84,0.38)*gold)*sweep*uGleam*2.3;

          // ---- eyes ignite --------------------------------------------
          float nearEye = smoothstep(0.060,0.0, distance(vUv, uEyeUV));
          float redKey  = smoothstep(0.10,0.45,lum)*smoothstep(0.04,0.26, tex.r-tex.g);
          col += vec3(1.0,0.17,0.12)*nearEye*redKey*uEye*5.0;

          // ---- rain running over her ----------------------------------
          float rn = smoothstep(0.62,1.0, vnoise(vec2(vUv.x*64.0, vUv.y*3.5 - uTime*3.1)));
          col += vec3(0.55,0.66,0.88)*rn*0.11*uWet;

          // ---- forming edge glows like the beam -----------------------
          col += vec3(1.0,0.92,0.74)*band*2.0;

          float a = texA*m*uAlpha;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });

    const h = 1.74, w = h*this.aspect;
    this.spriteH = h;
    this.sprite = new THREE.Mesh(new THREE.PlaneBufferGeometry(w, h), this.sprMat);
    this.scene.add(this.sprite);
  }

  // ---- small additive bloom right at the eyes -------------------------------
  _buildEyeGlow() {
    this.egMat = new THREE.MeshBasicMaterial({
      color: 0xff2a1c, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const cv = document.createElement("canvas"); cv.width=cv.height=64;
    const c = cv.getContext("2d");
    const g = c.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,"rgba(255,255,255,1)");
    g.addColorStop(0.25,"rgba(255,90,60,0.6)");
    g.addColorStop(1,"rgba(255,40,20,0)");
    c.fillStyle=g; c.fillRect(0,0,64,64);
    this.egMat.map = new THREE.CanvasTexture(cv);
    this.eyeGlow = new THREE.Mesh(new THREE.PlaneBufferGeometry(0.34,0.20), this.egMat);
    this.eyeGlow.position.z = 1;
    this.scene.add(this.eyeGlow);
  }

  // ---- splash droplets on touchdown -----------------------------------------
  _buildDroplets() {
    this.N = 240;
    this.vel = new Float32Array(this.N*3);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(this.N*3),3));
    const cv = document.createElement("canvas"); cv.width=cv.height=64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(245,250,255,1)");
    gr.addColorStop(0.4,"rgba(160,200,255,0.45)");
    gr.addColorStop(1,"rgba(90,140,220,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.dropMat = new THREE.PointsMaterial({
      size:0.016, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.drops = new THREE.Points(g, this.dropMat);
    this.drops.position.z = 2; this.drops.visible = false;
    this.scene.add(this.drops);
  }

  _splash() {
    const pos = this.drops.geometry.attributes.position.array;
    for (let i=0;i<this.N;i++){
      const ang = Math.random()*Math.PI*2;
      const rad = Math.pow(Math.random(),0.6)*0.30;
      pos[i*3]   = Math.cos(ang)*rad;
      pos[i*3+1] = this.groundY + 0.01;
      pos[i*3+2] = 0;
      this.vel[i*3]   = Math.cos(ang)*(0.25+Math.random()*0.75);
      this.vel[i*3+1] = 0.45+Math.random()*0.95;
    }
    this.drops.geometry.attributes.position.needsUpdate = true;
    this.drops.visible = true; this.dropMat.opacity = 1;
  }

  // ---- light motes rising against the rain -----------------------------------
  _buildMotes() {
    this.M = 150;
    this.mseed = new Float32Array(this.M);
    const g = new THREE.BufferGeometry();
    const arr = new Float32Array(this.M*3);
    for (let i=0;i<this.M;i++){
      arr[i*3]   = (Math.random()*2-1)*0.9;
      arr[i*3+1] = -1 + Math.random()*2;
      arr[i*3+2] = 0;
      this.mseed[i] = Math.random()*6.28;
    }
    g.setAttribute("position", new THREE.BufferAttribute(arr,3));
    const cv = document.createElement("canvas"); cv.width=cv.height=64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(255,246,225,1)");
    gr.addColorStop(0.4,"rgba(255,215,150,0.4)");
    gr.addColorStop(1,"rgba(255,190,110,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.moteMat = new THREE.PointsMaterial({
      size:0.013, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.motes = new THREE.Points(g, this.moteMat);
    this.motes.position.z = 1.5;
    this.scene.add(this.motes);
  }

  _buildFlash(aspect) {
    this.flashMat = new THREE.MeshBasicMaterial({
      color:0xfff0d8, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    this.flash = this._fullQuad(aspect, this.flashMat, 8);
  }

  // ============================================================== control
  play() {
    this._flags = {};
    this.drops.visible=false; this.dropMat.opacity=0;
    this.flashMat.opacity=0;
    this.waterU.uRing.value = 1;
    if (this._t < 0) {
      this._t = 0;
      this.renderer.domElement.style.opacity = "1";
      this._clock = new THREE.Clock();
      this._loop();
    } else this._t = 0;
    return this;
  }

  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    const dt = Math.min(this._clock.getDelta(), 0.05);
    const el = this._clock.elapsedTime;
    if (this._t < 0) return;

    this._t += dt / this.duration;
    const T = Math.min(this._t, 1);
    const F = this._flags;

    // ================== timeline ====================================
    // 0.00–0.14  sky darkens, rain starts
    // 0.10–0.30  cloud ceiling parts, shaft of light opens
    // 0.18–0.36  she forms inside the beam, backlit silhouette
    // 0.30–0.64  slow float down, cloth drifting, colour resolving
    // 0.62–0.70  touchdown: ripple ring, splash, soft light pulse
    // 0.68–0.86  eyes ignite, gleam sweeps the blade and gold
    // 0.86–1.00  settle and fade
    const rainAmt = sm(T,0.00,0.13)*(1 - sm(T,0.88,1.0));
    const open    = sm(T,0.08,0.30);
    const form    = sm(T,0.18,0.38);
    const fall    = sm(T,0.28,0.64);
    const land    = sm(T,0.62,0.70);
    const outro   = sm(T,0.88,1.00);

    this.dimU.uAmt.value   = sm(T,0.01,0.14)*(1-outro)*0.95;
    this.cloudU.uT.value   = open*(1-outro); this.cloudU.uTime.value = el;
    this.shaftU.uT.value   = (open*0.95)*(1 - sm(T,0.74,0.95));
    this.shaftU.uWide.value = fall;
    this.shaftU.uTime.value = el;

    this.rainBack.userData.u.uAmt.value  = rainAmt;
    this.rainFront.userData.u.uAmt.value = rainAmt*0.8;
    this.rainBack.userData.u.uTime.value  = el;
    this.rainFront.userData.u.uTime.value = el;

    this.waterU.uT.value = rainAmt; this.waterU.uTime.value = el;

    // ---- descent ------------------------------------------------------
    // easeOutSine: fast at first, feathering to almost nothing on contact
    const ease = Math.sin(fall * Math.PI * 0.5);
    const landedY = this.groundY + this.spriteH*0.5;
    const y = 0.92 - ease*(0.92 - landedY);
    const sway = (1-fall)*0.045;
    this.sprite.position.set(Math.sin(el*0.75)*sway, y + Math.sin(el*1.25)*0.012*(1-land*0.7), 0);
    this.sprite.rotation.z = Math.sin(el*0.6)*0.022*(1-fall*0.75);
    const sc = 0.94 + fall*0.06;
    this.sprite.scale.set(sc, sc, 1);

    this.sprU.uTime.value = el;
    this.sprU.uForm.value = form;
    this.sprU.uAlpha.value = sm(T,0.17,0.26)*(1-outro);
    this.sprU.uDrift.value = 1.35 - fall*0.85;          // billowing → gentle idle
    this.sprU.uShade.value = sm(T,0.30,0.58);
    this.sprU.uRim.value   = (0.85 - fall*0.35 + land*0.5)*(1-outro);
    this.sprU.uWet.value   = sm(T,0.20,0.45)*(1-outro);

    // shaft and halo follow her down
    this.shaft.position.x = this.sprite.position.x;
    this.aureole.position.set(this.sprite.position.x, this.sprite.position.y + 0.18, -3);
    this.aureole.scale.setScalar(0.75 + fall*0.45 + land*0.25);
    this.auU.uAmt.value = (form*0.30 + sm(T,0.60,0.76)*0.45)*(1-outro);
    this.auU.uTime.value = el;

    // ---- eyes ----------------------------------------------------------
    const eyeAmt = sm(T,0.66,0.80)*(1-outro);
    this.sprU.uEye.value = eyeAmt*(0.75 + 0.25*Math.sin(el*3.1));
    const ex = this.sprite.position.x + (this.eyeUV.x-0.5)*this.spriteH*this.aspect*sc;
    const ey = this.sprite.position.y + (this.eyeUV.y-0.5)*this.spriteH*sc;
    this.eyeGlow.position.set(ex, ey, 1);
    this.egMat.opacity = eyeAmt*0.55;

    // ---- gleam sweep -----------------------------------------------------
    const gl = sm(T,0.70,0.74)*(1 - sm(T,0.84,0.90));
    this.sprU.uGleam.value = gl;
    this.sprU.uGleamPos.value = -0.25 + THREE.MathUtils.clamp((T-0.70)/0.16,0,1)*1.5;

    // ---- motes -----------------------------------------------------------
    {
      const pos = this.motes.geometry.attributes.position.array;
      for (let i=0;i<this.M;i++){
        pos[i*3+1] += (0.05 + 0.05*Math.sin(this.mseed[i]))*dt;
        pos[i*3]   += Math.sin(el*0.7 + this.mseed[i])*0.02*dt;
        if (pos[i*3+1] > 1.05) pos[i*3+1] = -1.05;
      }
      this.motes.geometry.attributes.position.needsUpdate = true;
      this.moteMat.opacity = (form*0.5 + sm(T,0.58,0.75)*0.5)*(1-outro)*0.9;
    }

    // ---- touchdown -------------------------------------------------------
    if (!F.open && T >= 0.09) { F.open = true; if (this.onOpen) this.onOpen(); }
    if (!F.land && T >= 0.625) {
      F.land = true;
      this.waterU.uRing.value = 0;
      this._splash();
      this.flashMat.opacity = 0.30;
      if (this.onLand) this.onLand();
    }
    if (this.waterU.uRing.value < 1) {
      this.waterU.uRing.value = Math.min(1, this.waterU.uRing.value + dt/1.5);
    }
    if (this.drops.visible) {
      const pos = this.drops.geometry.attributes.position.array;
      for (let i=0;i<this.N;i++){
        this.vel[i*3+1] -= 2.2*dt;
        pos[i*3]   += this.vel[i*3]*dt;
        pos[i*3+1] += this.vel[i*3+1]*dt;
        if (pos[i*3+1] < this.groundY) { pos[i*3+1] = this.groundY; this.vel[i*3+1] = 0; this.vel[i*3] *= 0.5; }
      }
      this.drops.geometry.attributes.position.needsUpdate = true;
      this.dropMat.opacity = Math.max(0, this.dropMat.opacity - dt*0.9);
      if (this.dropMat.opacity <= 0.01) this.drops.visible = false;
    }
    if (this.flashMat.opacity > 0)
      this.flashMat.opacity = Math.max(0, this.flashMat.opacity - dt*1.4);

    this.renderer.render(this.scene, this.camera);

    if (this._t >= 1) {
      this._t = -1;
      cancelAnimationFrame(this._raf); this._raf = null;
      this.renderer.domElement.style.opacity = "0";
      this.renderer.clear();
      if (this.onComplete) this.onComplete();
    }

    function sm(v,e0,e1){
      const t = THREE.MathUtils.clamp((v-e0)/(e1-e0),0,1);
      return t*t*(3-2*t);
    }
  }

  _resize() {
    const a = innerWidth/innerHeight;
    this.renderer.setSize(innerWidth, innerHeight);
    this.camera.left=-a; this.camera.right=a;
    this.camera.updateProjectionMatrix();
    for (const m of [this.dim,this.clouds,this.rainBack,this.rainFront,this.flash]) {
      m.geometry.dispose();
      m.geometry = new THREE.PlaneBufferGeometry(2*a,2);
    }
    this.cloudU.uAspect.value = a;
    this.rainBack.userData.u.uAspect.value = a;
    this.rainFront.userData.u.uAspect.value = a;
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize", this._onResize);
    this.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

const field = document.getElementById("field");
const fx = new DivineDescentVFX({
  src: DIVINE,
  onOpen(){ field.animate([{filter:"brightness(1)"},{filter:"brightness(0.42)"}],
    {duration:1100, easing:"ease-out", fill:"forwards"}); },
  onLand(){ field.animate(
    [{transform:"translate(0,0)"},{transform:"translate(0,3px)"},{transform:"translate(0,0)"}],
    {duration:520, easing:"ease-out"}); },
  onComplete(){ field.animate([{filter:"brightness(0.42)"},{filter:"brightness(1)"}],
    {duration:800, easing:"ease-out", fill:"forwards"}); }
});
// In-game the file loads inside an iframe over the battlefield — drop the preview
// backdrop there so the FIELD shows through. Standalone keeps it so you can see it.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Optional ?art=<url> overrides the card image (in-game passes the summoned unit's own card art).
try { const _a = new URLSearchParams(location.search).get('art'); if (_a) { const _c = document.getElementById('card'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } } catch (e) {}
document.addEventListener('click', () => fx.play());
fx.play();
</script>
