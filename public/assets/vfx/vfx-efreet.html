<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · EFREET</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — lets you SEE the transparency when you open this
     file directly. In-game (loaded in an iframe over the battlefield) it is
     removed so the FIELD shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change: transform, filter; }
    /* 👑 The unit's REAL card — the full framed ACE card PNG (frame + scene baked in).
     Displayed as-is; the VFX plays around it. In-game ?art can swap it. */
  #card { position:relative; z-index:200; height:78vh; max-height:680px;
    aspect-ratio: 1024 / 1536; background: center/contain no-repeat;
    background-image: url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/Efreet.png");
    filter: drop-shadow(0 26px 64px rgba(0,0,0,0.72)); }

  

  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px; z-index:200;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(6,4,3,0.94)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#200d03; background:#ff9440; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(255,148,64,0.4); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#96806e; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#ff9440; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"><div id="card"></div></div>

<script src="three.min.js"></script>
<script>
/* =====================================================================
   MeteorCrashVFX — crash-lands and the ground erupts in flame
   ---------------------------------------------------------------------
   Beats: shadow telegraph → IMPACT → fissures race outward → flame
          geysers erupt along them in a wave → sustained burn
   Sprite work:
     · DILATED-ALPHA FLAME AURA — alpha is sampled downward and maxed to
       build a band just outside his silhouette, then multiplied by
       upward-scrolling noise and written into alpha, so real flame licks
       off his body instead of stopping at the sprite edge
     · molten key (r − b) drives his cracks with a slow breath + fast flicker
     · non-uniform impact squash with an elastic recovery
     · heat-shimmer UV wobble weighted to his lower half
   ===================================================================== */
class MeteorCrashVFX {
  constructor(opts = {}) {
    this.src = opts.src;
    this.duration = opts.duration || 5.8;
    this.aspect = opts.spriteAspect || (962 / 1127);
    this.groundY = opts.groundY != null ? opts.groundY : -0.80;
    this.onIncoming = opts.onIncoming || null;
    this.onImpact = opts.onImpact || null;
    this.onErupt = opts.onErupt || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 60;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.shakeK = this.reduced ? 0.2 : 1;

    this.IMPACT = 0.27;
    this._t = -1; this._raf = null; this._flags = {}; this._shake = 0;
    this._build();
  }

  // ================================================================ setup
  _build() {
    const r = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position: "fixed", inset: "0", pointerEvents: "none",
      zIndex: String(this.zIndex), opacity: "0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -30, 30);
    this.camera.position.z = 15;

    this.NOISE = `
      float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
    `;

    this._buildDim(a);
    this._buildEmberWind(a);
    this._buildGroundGlow();
    this._buildShadow();
    this._buildFissures();
    this._buildFireWall();
    this._buildGeysers();
    this._buildSprite();
    this._buildRings();
    this._buildDust();
    this._buildEmbers();
    this._buildShimmer(a);
    this._buildFlash(a);

    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  _fullQuad(aspect, mat, z) {
    const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(2 * aspect, 2), mat);
    m.position.z = z; this.scene.add(m); return m;
  }

  _buildDim(aspect) {
    this.dimU = { uAmt:{value:0} };
    this.dimMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.dimU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`varying vec2 vUv; uniform float uAmt;
        void main(){
          float d=length(vUv-0.5)*1.42;
          float a=uAmt*(0.30+0.70*smoothstep(0.05,1.0,d));
          if(a<0.004) discard;
          gl_FragColor=vec4(0.020,0.010,0.006,a);
        }`
    });
    this.dim = this._fullQuad(aspect, this.dimMat, -9);
  }

  _buildEmberWind(aspect) {
    this.ewU = { uAmt:{value:0}, uTime:{value:0}, uAspect:{value:aspect} };
    this.ewMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.ewU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime,uAspect;
        ${this.NOISE}
        void main(){
          vec2 p = vec2(vUv.x*uAspect, vUv.y);
          float n = fbm(p*2.2 + vec2(uTime*0.10, -uTime*0.45));
          float glow = pow(smoothstep(0.55,1.0,n),2.2);
          float low = smoothstep(1.0,0.05,vUv.y);
          float a = glow*low*uAmt*0.40;
          if(a<0.004) discard;
          gl_FragColor = vec4(mix(vec3(0.55,0.12,0.02), vec3(1.0,0.52,0.10), glow), a);
        }`
    });
    this.ewind = this._fullQuad(aspect, this.ewMat, -8);
  }

  // ---- molten pool of light on the ground ---------------------------------
  _buildGroundGlow() {
    this.ggU = { uAmt:{value:0}, uTime:{value:0} };
    this.ggMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.ggU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        ${this.NOISE}
        void main(){
          vec2 p=(vUv-0.5)*2.0; float d=length(p);
          float n=fbm(vUv*4.5+vec2(-uTime*0.35,uTime*0.2));
          float pool=pow(smoothstep(1.0,0.0,d),1.8)*(0.55+0.45*n);
          float a=pool*uAmt;
          if(a<0.004) discard;
          gl_FragColor=vec4(mix(vec3(0.72,0.14,0.01),vec3(1.0,0.70,0.22),pool),a);
        }`
    });
    this.gglow = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.2,3.2), this.ggMat);
    this.gglow.position.set(0, this.groundY, -6);
    this.gglow.scale.set(1,0.26,1);
    this.scene.add(this.gglow);
  }

  // ---- incoming shadow telegraph --------------------------------------------
  _buildShadow() {
    this.shU = { uT:{value:0}, uTime:{value:0} };
    this.shMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.shU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uT,uTime;
        void main(){
          vec2 p=(vUv-0.5)*2.0; float d=length(p);
          // shrinks and hardens as he gets closer
          float r = mix(0.95, 0.30, uT);
          float core = smoothstep(r, r*mix(0.55,0.92,uT), d);
          // warning ring pulsing outward
          float ph = fract(uTime*1.6);
          float ring = smoothstep(0.055,0.0, abs(d - (r + ph*0.5)))*(1.0-ph)*mix(0.3,1.0,uT);
          float a = core*mix(0.35,0.86,uT)*uT;
          if(a+ring<0.006) discard;
          vec3 col = vec3(0.02,0.01,0.005);
          gl_FragColor = vec4(mix(col, vec3(1.0,0.45,0.08), min(ring*2.0,1.0)),
                              clamp(a + ring*0.85, 0.0, 1.0));
        }`
    });
    this.shadow = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.6,2.6), this.shMat);
    this.shadow.position.set(0, this.groundY, -5);
    this.shadow.scale.set(1,0.28,1);
    this.scene.add(this.shadow);
  }

  // ---- radial fissures with lava inside --------------------------------------
  _buildFissures() {
    this.fcv = document.createElement("canvas");
    this.fcv.width = this.fcv.height = 768;
    this.fctx = this.fcv.getContext("2d");
    this.ftex = new THREE.CanvasTexture(this.fcv);
    this.ftex.minFilter = THREE.LinearFilter;
    this.fisMat = new THREE.MeshBasicMaterial({
      map:this.ftex, transparent:true, depthWrite:false, opacity:0
    });
    this.fissures = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.2,3.2), this.fisMat);
    this.fissures.position.set(0, this.groundY, -4);
    this.fissures.scale.set(1,0.28,1);
    this.scene.add(this.fissures);
    this._fissureTree();
  }

  _fissureTree() {
    this.fsegs = [];
    const self = this;
    for (let i=0;i<13;i++){
      const ang = (i/13)*Math.PI*2 + Math.random()*0.35;
      (function br(x,y,an,len,w,d,t0){
        if (d>3 || len<10) return;
        let px=x, py=y, a2=an;
        for (let k=0;k<3;k++){
          a2 += (Math.random()-0.5)*0.72;
          const l = len/3;
          const nx = px+Math.cos(a2)*l, ny = py+Math.sin(a2)*l;
          self.fsegs.push({x1:px,y1:py,x2:nx,y2:ny,w,t:t0+(k/3)*0.09});
          px=nx; py=ny;
        }
        if (Math.random()<0.85) br(px,py,a2+0.72,len*0.62,w*0.62,d+1,t0+0.08);
        if (Math.random()<0.85) br(px,py,a2-0.72,len*0.62,w*0.62,d+1,t0+0.08);
      })(384,384,ang, 78+Math.random()*66, 11, 0, 0);
    }
  }

  _drawFissures(T, time) {
    const c = this.fctx;
    c.clearRect(0,0,768,768);
    c.lineCap = "round";
    // scorched ground under the cracks
    const g = c.createRadialGradient(384,384,10,384,384,340);
    g.addColorStop(0,"rgba(30,10,4,0.9)");
    g.addColorStop(0.5,"rgba(22,8,3,0.55)");
    g.addColorStop(1,"rgba(22,8,3,0)");
    c.fillStyle=g;
    c.beginPath(); c.arc(384,384,340*Math.min(1,T/0.35),0,6.283); c.fill();

    const breathe = 0.7 + 0.3*Math.sin(time*2.2);
    for (const s of this.fsegs) {
      const p = Math.min(1,(T - s.t)/0.10);
      if (p<=0) continue;
      const ex = s.x1 + (s.x2-s.x1)*p, ey = s.y1 + (s.y2-s.y1)*p;
      // outer rock lip
      c.strokeStyle = "rgba(14,8,5,0.95)"; c.lineWidth = s.w*1.7;
      c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(ex,ey); c.stroke();
      // molten core, glowing
      c.save();
      c.shadowColor = "rgba(255,120,20,0.95)"; c.shadowBlur = 22;
      c.strokeStyle = `rgba(255,${Math.round(120+70*breathe)},30,${0.85*breathe+0.15})`;
      c.lineWidth = s.w*0.55;
      c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(ex,ey); c.stroke();
      c.strokeStyle = "rgba(255,238,190,0.9)"; c.lineWidth = s.w*0.20;
      c.beginPath(); c.moveTo(s.x1,s.y1); c.lineTo(ex,ey); c.stroke();
      c.restore();
    }
    this.ftex.needsUpdate = true;
  }

  // ---- shared fire shader ------------------------------------------------------
  _fireMaterial(extra) {
    const u = Object.assign({ uT:{value:0}, uTime:{value:0}, uSeed:{value:Math.random()*10} }, extra||{});
    return new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, uniforms:u,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uT,uTime,uSeed;
        ${this.NOISE}
        void main(){
          float env = sin(clamp(uT,0.0,1.0)*3.14159);
          if (env <= 0.004) discard;
          float y = vUv.y/max(env,0.03);
          if (y > 1.0) discard;
          float n = fbm(vec2(vUv.x*4.2 + uSeed*7.0, y*2.6 - uTime*3.6 + uSeed*3.0));
          float w = mix(0.44, 0.09, pow(y,0.75));
          float x = abs(vUv.x-0.5);
          float d = smoothstep(w*(0.55+n*0.95), 0.0, x);
          d *= smoothstep(1.0,0.50,y)*smoothstep(0.0,0.08,y);
          d *= (0.5 + n*0.85);
          d = clamp(d,0.0,1.0);
          vec3 col = mix(vec3(0.70,0.05,0.005), vec3(1.0,0.42,0.03), d);
          col = mix(col, vec3(1.0,0.90,0.58), pow(d,2.8));
          float a = d*0.95;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
  }

  // ---- broad wall of flame across the ground ------------------------------------
  _buildFireWall() {
    this.fwMat = this._fireMaterial();
    this.fwall = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.6, 1.0), this.fwMat);
    this.fwall.position.set(0, this.groundY + 0.5, -3.2);
    this.fwall.visible = false;
    this.scene.add(this.fwall);
    // widen the wall: stretch the noise laterally by scaling the mesh
    this.fwall.scale.set(1, 1, 1);
  }

  // ---- flame geysers along the fissures -------------------------------------------
  _buildGeysers() {
    this.geysers = [];
    const xs = [-1.05,-0.72,-0.42,-0.16,0.18,0.46,0.78,1.10];
    xs.forEach((x,i) => {
      const mat = this._fireMaterial();
      const scale = 0.75 + Math.random()*0.7;
      const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(0.62*scale, 1.55*scale), mat);
      m.position.set(x, this.groundY + 0.77*scale, -2.8 + (i%2)*0.15);
      m.visible = false;
      m.userData = { p: 1, delay: Math.abs(x)*0.13 + Math.random()*0.05, dur: 1.05 + Math.random()*0.5 };
      this.scene.add(m);
      this.geysers.push(m);
    });
  }

  // ---- him -----------------------------------------------------------------------
  _buildSprite() {
    const tex = new THREE.TextureLoader().load(this.src);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;

    this.sprU = {
      uMap:{value:tex}, uTime:{value:0},
      uShade:{value:0}, uMolten:{value:0}, uBurn:{value:0},
      uRim:{value:0}, uHeat:{value:0}, uAlpha:{value:0}
    };

    this.sprMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.sprU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform sampler2D uMap;
        uniform float uTime,uShade,uMolten,uBurn,uRim,uHeat,uAlpha;
        ${this.NOISE}

        float moltenKey(vec3 c, float l){
          return smoothstep(0.10,0.42, c.r-c.b)*smoothstep(0.14,0.62,l);
        }

        void main(){
          // heat shimmer, weighted to his lower half where the ground burns
          float low = smoothstep(0.62,0.0,vUv.y);
          vec2 uv = vUv;
          uv.x += sin(vUv.y*46.0 - uTime*5.5)*0.0035*low*uHeat;
          uv.y += sin(vUv.x*38.0 + uTime*4.2)*0.0022*low*uHeat;

          vec4 base = texture2D(uMap, uv);
          float texA = base.a;
          vec3 tex = base.rgb;
          float lum = dot(tex, vec3(0.299,0.587,0.114));

          vec3 col = tex * mix(0.10, 1.0, uShade);

          // ---- molten cracks: slow breath under a fast flicker ---------
          float mk = moltenKey(tex, lum);
          float breath = 0.72 + 0.28*sin(uTime*1.7);
          float flicker = 0.80 + 0.20*fbm(vec2(uv.x*9.0, uv.y*9.0 - uTime*4.0));
          col += vec3(1.0,0.42,0.06)*mk*uMolten*breath*flicker*2.2;
          col += vec3(1.0,0.86,0.45)*pow(mk,2.4)*uMolten*1.3;

          // ---- DILATED-ALPHA FLAME AURA -------------------------------
          // max alpha sampled downward = a band sitting just above his
          // silhouette; noise turns it into flame that licks upward
          float dil = 0.0;
          for(int i=1;i<=6;i++){
            float s = float(i)/6.0;
            float wob = sin(float(i)*2.3 + uTime*3.0)*0.010;
            dil = max(dil, texture2D(uMap, uv - vec2(wob, s*0.055)).a);
          }
          float aura = clamp(dil - texA, 0.0, 1.0);
          float fl = fbm(vec2(uv.x*11.0, uv.y*4.5 - uTime*2.9));
          float flame = smoothstep(0.40,0.92, fl)*aura*uBurn;
          vec3 fcol = mix(vec3(1.0,0.26,0.02), vec3(1.0,0.88,0.52), pow(flame,2.0));
          col += fcol*flame*2.6;

          // ---- rim glow from the burning ground ------------------------
          if(uRim > 0.001){
            float px = 0.0055;
            float aL = texture2D(uMap, uv-vec2(px,0.0)).a;
            float aR = texture2D(uMap, uv+vec2(px,0.0)).a;
            float aD = texture2D(uMap, uv-vec2(0.0,px)).a;
            float aU = texture2D(uMap, uv+vec2(0.0,px)).a;
            float edge = clamp(texA - min(min(aL,aR),min(aD,aU)), 0.0, 1.0);
            float fromBelow = 0.5 + 0.5*smoothstep(0.9,0.1,vUv.y);
            col += vec3(1.0,0.50,0.14)*edge*uRim*fromBelow*3.0;
          }

          float a = max(texA, flame*0.85)*uAlpha;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });

    const h = 1.72, w = h*this.aspect;
    this.spriteH = h;
    this.sprite = new THREE.Mesh(new THREE.PlaneBufferGeometry(w,h), this.sprMat);
    this.sprite.position.set(0, this.groundY + h*0.5, 0);
    this.scene.add(this.sprite);
  }

  // ---- impact rings ----------------------------------------------------------------
  _buildRings() {
    const mk = (flat) => new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:{ uT:{value:1} },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uT;
        void main(){
          float d=length(vUv-0.5)*2.0;
          float rad=pow(uT,0.5)*1.03;
          float w=mix(0.11,0.010,uT);
          float ring=smoothstep(w,0.0,abs(d-rad));
          float a=ring*(1.0-uT)*1.7;
          if(a<0.004) discard;
          gl_FragColor=vec4(mix(vec3(1.0,0.97,0.86),vec3(1.0,0.34,0.03),uT),a);
        }`
    });
    this.ringGround = new THREE.Mesh(new THREE.PlaneBufferGeometry(4.2,4.2), mk());
    this.ringGround.position.set(0,this.groundY,1.0);
    this.ringGround.scale.set(1,0.28,1);
    this.ringGround.visible=false;
    this.ringAir = new THREE.Mesh(new THREE.PlaneBufferGeometry(4.0,4.0), mk());
    this.ringAir.position.set(0,this.groundY+0.25,1.1);
    this.ringAir.visible=false;
    this.scene.add(this.ringGround, this.ringAir);
  }

  // ---- impact dust -------------------------------------------------------------------
  _buildDust() {
    this.duU = { uT:{value:1}, uTime:{value:0} };
    this.duMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.duU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uT,uTime;
        ${this.NOISE}
        void main(){
          vec2 p=vUv-0.5;
          float grow=smoothstep(0.0,0.7,uT);
          float d=length(p*vec2(1.0,2.3))/max(grow,0.03);
          float puff=smoothstep(0.5,0.02,d);
          vec2 q=vec2(fbm(vUv*3.4+vec2(uTime*0.4,0.0)), fbm(vUv*3.4+vec2(2.1,1.7)));
          float n=fbm(vUv*4.6+2.4*q+vec2(uTime*0.3,-uTime*0.4));
          float a=puff*smoothstep(0.22,0.76,n)*(1.0-smoothstep(0.4,1.0,uT))*0.9;
          if(a<0.004) discard;
          vec3 col=mix(vec3(0.16,0.10,0.07), vec3(0.55,0.38,0.24), n);
          col += vec3(0.9,0.35,0.05)*pow(n,3.0)*(1.0-uT)*0.7;   // fire still in the dust
          gl_FragColor=vec4(col,a);
        }`
    });
    this.dust = new THREE.Mesh(new THREE.PlaneBufferGeometry(4.0,1.7), this.duMat);
    this.dust.position.set(0,this.groundY+0.4,1.3);
    this.dust.visible=false;
    this.scene.add(this.dust);
  }

  _buildEmbers() {
    this.N = 420;
    this.vel = new Float32Array(this.N*3);
    this.seed = new Float32Array(this.N);
    const g = new THREE.BufferGeometry();
    const arr = new Float32Array(this.N*3);
    g.setAttribute("position", new THREE.BufferAttribute(arr,3));
    const cv = document.createElement("canvas"); cv.width=cv.height=64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(255,246,215,1)");
    gr.addColorStop(0.35,"rgba(255,140,30,0.55)");
    gr.addColorStop(1,"rgba(220,60,5,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.embMat = new THREE.PointsMaterial({
      size:0.019, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.embers = new THREE.Points(g, this.embMat);
    this.embers.position.z = 2.0;
    this.scene.add(this.embers);
    this._seedEmbers();
  }

  _seedEmbers() {
    const pos = this.embers.geometry.attributes.position.array;
    for (let i=0;i<this.N;i++){
      pos[i*3]   = (Math.random()*2-1)*1.5;
      pos[i*3+1] = this.groundY - Math.random()*0.4;
      pos[i*3+2] = 0;
      this.vel[i*3]   = (Math.random()*2-1)*0.16;
      this.vel[i*3+1] = 0.22 + Math.random()*0.75;
      this.seed[i] = Math.random()*6.28;
    }
    this.embers.geometry.attributes.position.needsUpdate = true;
  }

  _buildShimmer(aspect) {
    this.shimU = { uAmt:{value:0}, uTime:{value:0} };
    this.shimMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.shimU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        ${this.NOISE}
        void main(){
          float low = smoothstep(0.55,0.0,vUv.y);
          float n = fbm(vec2(vUv.x*13.0, vUv.y*7.0 - uTime*1.9));
          float band = pow(smoothstep(0.52,0.95,n),2.2);
          float a = band*low*uAmt*0.16;
          if(a<0.004) discard;
          gl_FragColor = vec4(1.0,0.62,0.28,a);
        }`
    });
    this.shimmer = this._fullQuad(aspect, this.shimMat, 3.0);
  }

  _buildFlash(aspect) {
    this.flashMat = new THREE.MeshBasicMaterial({
      color:0xfff0d0, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    this.flash = this._fullQuad(aspect, this.flashMat, 8);
  }

  // ============================================================== control
  play() {
    this._flags = {}; this._shake = 0;
    this._fissureTree(); this._seedEmbers();
    this.ringGround.visible=false; this.ringAir.visible=false;
    this.dust.visible=false; this.fwall.visible=false;
    this.geysers.forEach(g=>{ g.visible=false; g.userData.p=1; });
    this.flashMat.opacity=0;
    if (this._t < 0) {
      this._t = 0;
      this.renderer.domElement.style.opacity = "1";
      this._clock = new THREE.Clock();
      this._loop();
    } else this._t = 0;
    return this;
  }

  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    const dt = Math.min(this._clock.getDelta(), 0.05);
    const el = this._clock.elapsedTime;
    if (this._t < 0) return;

    this._t += dt / this.duration;
    const T = Math.min(this._t, 1);
    const F = this._flags;
    const I = this.IMPACT;

    // ================== timeline ====================================
    // 0.00–0.10  air heats, ember wind rises
    // 0.06–0.27  a shadow appears below and SHRINKS — something is falling
    // 0.27       IMPACT: flash, shockwave, dust, huge shake
    // 0.27–0.40  he springs out of the squash; fissures race outward
    // 0.40–0.68  flame geysers erupt along them in an outward wave
    // 0.58–0.88  sustained burn: flame licks off him, cracks pulse
    // 0.88–1.00  settle and fade
    const heat    = sm(T,0.00,0.10);
    const fall    = sm(T,0.05,I);
    const post    = sm(T,I,I+0.10);
    const crack   = sm(T,I,I+0.16);
    const erupt   = sm(T,0.40,0.56);
    const burn    = sm(T,0.44,0.66);
    const outro   = sm(T,0.88,1.00);

    this.dimU.uAmt.value = sm(T,0.01,0.12)*(1-outro)*0.92;
    this.ewU.uAmt.value = (heat*0.55 + burn*0.75)*(1-outro); this.ewU.uTime.value = el;
    this.shimU.uAmt.value = (post*0.6 + burn)*(1-outro); this.shimU.uTime.value = el;

    // ---- telegraph -----------------------------------------------------
    this.shU.uT.value = fall*(1 - post);
    this.shU.uTime.value = el;
    this.shadow.scale.set(1 - fall*0.30, (1 - fall*0.30)*0.28, 1);

    this.ggU.uAmt.value = (fall*0.30 + crack*0.55 + burn*0.35)*(1-outro);
    this.ggU.uTime.value = el;
    this.gglow.scale.set(1 + crack*0.25, (1 + crack*0.25)*0.26, 1);

    // ---- IMPACT ---------------------------------------------------------
    if (!F.incoming && T >= 0.06) { F.incoming = true; if (this.onIncoming) this.onIncoming(); }
    if (!F.impact && T >= I) {
      F.impact = true;
      this.ringGround.visible = true; this.ringGround.material.uniforms.uT.value = 0;
      this.ringAir.visible = true;    this.ringAir.material.uniforms.uT.value = 0;
      this.dust.visible = true; this.duU.uT.value = 0;
      this.flashMat.opacity = 0.95;
      this._shake = 1.35*this.shakeK;
      if (this.onImpact) this.onImpact();
    }

    // ---- his squash + elastic recovery -----------------------------------
    let sx = 1, sy = 1, dy = 0;
    if (T < I) {
      // still falling — hidden until he lands
      this.sprU.uAlpha.value = 0;
    } else {
      const q = THREE.MathUtils.clamp((T - I)/0.13, 0, 1);
      const spring = Math.exp(-q*5.5)*Math.cos(q*15.0);
      sy = 1 - spring*0.30;
      sx = 1 + spring*0.22;
      dy = -spring*0.10;
      this.sprU.uAlpha.value = (1-outro);
    }
    const w = this.spriteH*this.aspect;
    this.sprite.scale.set(sx, sy, 1);
    this.sprite.position.set(0, this.groundY + this.spriteH*0.5*sy + dy, 0);

    this.sprU.uTime.value = el;
    this.sprU.uShade.value = sm(T,I,I+0.14);
    this.sprU.uMolten.value = (0.55 + post*0.5 + burn*0.65)*(1-outro*0.6);
    this.sprU.uBurn.value = (post*0.45 + burn*0.85)*(1-outro*0.5);
    this.sprU.uRim.value = (post*0.5 + burn*0.55)*(1-outro);
    this.sprU.uHeat.value = (post*0.6 + burn)*(1-outro);

    // ---- fissures ---------------------------------------------------------
    if (T >= I) {
      this._drawFissures(THREE.MathUtils.clamp((T-I)/0.20, 0, 1), el);
      this.fisMat.opacity = crack*(1 - outro*0.85);
      this.fissures.scale.set(1 + crack*0.06, (1 + crack*0.06)*0.28, 1);
    }

    // ---- rings + dust ------------------------------------------------------
    for (const r of [this.ringGround, this.ringAir]) {
      if (!r.visible) continue;
      r.material.uniforms.uT.value += dt/0.85;
      if (r.material.uniforms.uT.value >= 1) r.visible = false;
    }
    if (this.dust.visible) {
      this.duU.uT.value += dt/2.1; this.duU.uTime.value = el;
      if (this.duU.uT.value >= 1) this.dust.visible = false;
    }

    // ---- geysers erupt in an outward wave -----------------------------------
    if (!F.erupt && T >= 0.40) { F.erupt = true; if (this.onErupt) this.onErupt(); }
    if (T >= 0.40) {
      const since = T - 0.40;
      for (const g of this.geysers) {
        if (!g.visible && g.userData.p >= 1 && since >= g.userData.delay) {
          g.visible = true; g.userData.p = 0;
          g.material.uniforms.uSeed.value = Math.random()*10;
        }
        if (g.visible) {
          g.userData.p += dt/g.userData.dur;
          g.material.uniforms.uT.value = g.userData.p;
          g.material.uniforms.uTime.value = el;
          if (g.userData.p >= 1) {
            // relight while the ground is still burning
            if (T < 0.80 && Math.random() < 0.5) {
              g.userData.p = 0; g.userData.dur = 1.0 + Math.random()*0.6;
              g.material.uniforms.uSeed.value = Math.random()*10;
            } else g.visible = false;
          }
        }
      }
    }

    // ---- ground fire wall ----------------------------------------------------
    if (T >= I + 0.06) {
      this.fwall.visible = true;
      this.fwMat.uniforms.uT.value = THREE.MathUtils.clamp((T - (I+0.06))/0.72, 0, 1)*0.92 + 0.04;
      this.fwMat.uniforms.uTime.value = el;
      if (T > 0.92) this.fwall.visible = false;
    }

    // ---- embers ----------------------------------------------------------------
    {
      const pos = this.embers.geometry.attributes.position.array;
      for (let i=0;i<this.N;i++){
        this.vel[i*3+1] += 0.14*dt;
        pos[i*3]   += (this.vel[i*3] + Math.sin(el*1.9+this.seed[i])*0.20)*dt;
        pos[i*3+1] += this.vel[i*3+1]*dt;
        if (pos[i*3+1] > 1.1) {
          pos[i*3]   = (Math.random()*2-1)*1.5;
          pos[i*3+1] = this.groundY - Math.random()*0.3;
          this.vel[i*3+1] = 0.22 + Math.random()*0.75;
        }
      }
      this.embers.geometry.attributes.position.needsUpdate = true;
      this.embMat.opacity = (heat*0.25 + post*0.5 + burn*0.6)*(1-outro*0.7);
    }

    if (this.flashMat.opacity > 0)
      this.flashMat.opacity = Math.max(0, this.flashMat.opacity - dt*3.0);

    this._shake = Math.max(0, this._shake - dt*2.2);
    this.camera.position.x = (Math.random()-0.5)*0.13*this._shake;
    this.camera.position.y = (Math.random()-0.5)*0.13*this._shake;

    this.renderer.render(this.scene, this.camera);

    if (this._t >= 1) {
      this._t = -1;
      cancelAnimationFrame(this._raf); this._raf = null;
      this.renderer.domElement.style.opacity = "0";
      this.camera.position.set(0,0,15);
      this.renderer.clear();
      if (this.onComplete) this.onComplete();
    }

    function sm(v,e0,e1){
      const t = THREE.MathUtils.clamp((v-e0)/(e1-e0),0,1);
      return t*t*(3-2*t);
    }
  }

  _resize() {
    const a = innerWidth/innerHeight;
    this.renderer.setSize(innerWidth, innerHeight);
    this.camera.left=-a; this.camera.right=a;
    this.camera.updateProjectionMatrix();
    for (const m of [this.dim,this.ewind,this.shimmer,this.flash]) {
      m.geometry.dispose();
      m.geometry = new THREE.PlaneBufferGeometry(2*a,2);
    }
    this.ewU.uAspect.value = a;
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize", this._onResize);
    this.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

const field = document.getElementById("field");
const shake = (px, ms) => field.animate(
  [{transform:"translate(0,0)"},
   {transform:`translate(${-px}px,${px*0.75}px)`},
   {transform:`translate(${px*0.85}px,${-px*0.6}px)`},
   {transform:`translate(${-px*0.4}px,${px*0.3}px)`},
   {transform:"translate(0,0)"}],
  {duration:ms, easing:"ease-out"});

const fx = new MeteorCrashVFX({
  src: EFREET,
  onIncoming(){ field.animate([{filter:"brightness(1)"},{filter:"brightness(0.45)"}],
    {duration:800, easing:"ease-out", fill:"forwards"}); },
  onImpact(){ shake(20, 620); },
  onErupt(){ field.animate(
    [{filter:"brightness(0.45)"},{filter:"brightness(0.78) saturate(1.2)"}],
    {duration:900, easing:"ease-out", fill:"forwards"}); },
  onComplete(){ field.animate([{filter:"brightness(0.78)"},{filter:"brightness(1)"}],
    {duration:800, easing:"ease-out", fill:"forwards"}); }
});
// In-game the file loads inside an iframe over the battlefield — drop the preview
// backdrop there so the FIELD shows through. Standalone keeps it so you can see it.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Optional ?art=<url> overrides the card image (in-game passes the summoned unit's own card art).
try { const _a = new URLSearchParams(location.search).get('art'); if (_a) { const _c = document.getElementById('card'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } } catch (e) {}
document.addEventListener('click', () => fx.play());
fx.play();
</script>
