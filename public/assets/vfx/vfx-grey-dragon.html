<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · GREY DRAGON</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — lets you SEE the transparency when you open this file
     directly (simulates a battle behind it). In-game this element is removed and
     the real battlefield shows through. Delete #previewbg to see pure transparency. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center;
    background:transparent; will-change: transform, filter; }

  /* 👑 The unit's REAL card — the full framed ACE card PNG (gold frame + scene are
     baked into the image). We just DISPLAY it; the VFX plays around it. Sits above
     the VFX canvas so the card reads clearly. In-game this src is swapped for the
     summoned unit's own card art. */
  #card { position:relative; z-index:200; height:78vh; max-height:680px;
    aspect-ratio: 1024 / 1536; background: center/contain no-repeat;
    background-image: url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/Grey Dragon Dragonic Knight.png");
    filter: drop-shadow(0 26px 64px rgba(0,0,0,0.72)); }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"><div id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   DragonPyreVFX — dragon shadow → flame tornado → wings beating
   ---------------------------------------------------------------------
   Beats: dark falls → a dragon's shadow sweeps the field → a firestorm
          spins up where it passed → he resolves inside the vortex →
          the tornado disperses and he holds, wings beating
   Notable work:
     · the tornado uses an ASIN cylindrical mapping, so the fire
       compresses toward the silhouette edges the way a rotating volume
       actually does — it spins rather than scrolls
     · wing-flap mask fitted to THIS pose (v 0.52–0.88, body axis u=0.41),
       so the wings beat while his armour, head and greatsword stay rigid
     · every downstroke is detected in JS and fires a downdraft ring plus
       an ember gust, so the beats have consequences on the ground
   ===================================================================== */
class DragonPyreVFX {
  constructor(opts = {}) {
    this.src = opts.src;
    this.duration = opts.duration || 6.2;
    this.aspect = opts.spriteAspect || (1251 / 1592);
    this.bodyX = opts.bodyX != null ? opts.bodyX : 0.41;   // his centre line in UV
    this.groundY = opts.groundY != null ? opts.groundY : -0.80;
    this.onShadow = opts.onShadow || null;
    this.onTornado = opts.onTornado || null;
    this.onReveal = opts.onReveal || null;
    this.onBeat = opts.onBeat || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 60;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.shakeK = this.reduced ? 0.2 : 1;

    this._t = -1; this._raf = null; this._flags = {}; this._shake = 0;
    this._prevFlap = 0;
    this._build();
  }

  // ================================================================ setup
  _build() {
    const r = new THREE.WebGLRenderer({ alpha:true, antialias:true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position:"fixed", inset:"0", pointerEvents:"none",
      zIndex:String(this.zIndex), opacity:"0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -30, 30);
    this.camera.position.z = 15;

    this.NOISE = `
      float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
    `;

    this._buildDim(a);
    this._buildEmberWind(a);
    this._buildScorch();
    this._buildDragonShadow();
    this._buildTornado();
    this._buildSprite();
    this._buildOrbitEmbers();
    this._buildDownRings();
    this._buildEmbers();
    this._buildShimmer(a);
    this._buildFlash(a);

    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  _fullQuad(aspect, mat, z) {
    const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(2*aspect, 2), mat);
    m.position.z = z; this.scene.add(m); return m;
  }

  _buildDim(aspect) {
    this.dimU = { uAmt:{value:0} };
    this.dimMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.dimU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`varying vec2 vUv; uniform float uAmt;
        void main(){
          float d=length(vUv-0.5)*1.42;
          float a=uAmt*(0.32+0.68*smoothstep(0.05,1.0,d));
          if(a<0.004) discard;
          gl_FragColor=vec4(0.016,0.010,0.006,a);
        }`
    });
    this.dim = this._fullQuad(aspect, this.dimMat, -9);
  }

  _buildEmberWind(aspect) {
    this.ewU = { uAmt:{value:0}, uTime:{value:0}, uAspect:{value:aspect} };
    this.ewMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.ewU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime,uAspect;
        ${this.NOISE}
        void main(){
          vec2 p = vec2(vUv.x*uAspect, vUv.y);
          float n = fbm(p*2.1 + vec2(uTime*0.12, -uTime*0.42));
          float glow = pow(smoothstep(0.56,1.0,n),2.2);
          float low = smoothstep(1.0,0.05,vUv.y);
          float a = glow*low*uAmt*0.38;
          if(a<0.004) discard;
          gl_FragColor = vec4(mix(vec3(0.50,0.13,0.02), vec3(1.0,0.55,0.12), glow), a);
        }`
    });
    this.ewind = this._fullQuad(aspect, this.ewMat, -8);
  }

  // ---- scorched, glowing ground ------------------------------------------
  _buildScorch() {
    this.scU = { uAmt:{value:0}, uTime:{value:0} };
    this.scMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.scU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        ${this.NOISE}
        void main(){
          vec2 p=(vUv-0.5)*2.0; float d=length(p);
          float n=fbm(vUv*5.0+vec2(-uTime*0.3,uTime*0.2));
          float pool=pow(smoothstep(1.0,0.0,d),1.7)*(0.5+0.5*n);
          float a=pool*uAmt;
          if(a<0.004) discard;
          gl_FragColor=vec4(mix(vec3(0.62,0.14,0.01),vec3(1.0,0.68,0.24),pool),a);
        }`
    });
    this.scorch = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.0,3.0), this.scMat);
    this.scorch.position.set(0, this.groundY, -6);
    this.scorch.scale.set(1,0.26,1);
    this.scene.add(this.scorch);
  }

  // ---- the dragon's shadow --------------------------------------------------
  _buildDragonShadow() {
    this.dcv = document.createElement("canvas");
    this.dcv.width = this.dcv.height = 700;
    this.dctx = this.dcv.getContext("2d");
    this.dtex = new THREE.CanvasTexture(this.dcv);
    this.dtex.minFilter = THREE.LinearFilter;
    const geo = new THREE.PlaneBufferGeometry(2.6, 2.6);
    this.penMat = new THREE.MeshBasicMaterial({ map:this.dtex, transparent:true, opacity:0, depthWrite:false });
    this.umbMat = new THREE.MeshBasicMaterial({ map:this.dtex, transparent:true, opacity:0, depthWrite:false });
    this.penumbra = new THREE.Mesh(geo, this.penMat);
    this.umbra = new THREE.Mesh(geo.clone(), this.umbMat);
    this.penumbra.position.z = -5.2;
    this.umbra.position.z = -5.0;
    this.scene.add(this.penumbra, this.umbra);
  }

  _drawDragon(t, flapSpeed) {
    const c = this.dctx;
    c.clearRect(0,0,700,700);
    c.save();
    c.translate(350,350);
    c.shadowColor = "rgba(0,0,0,1)";
    c.shadowBlur = 12;
    c.fillStyle = "rgba(0,0,0,0.95)";

    const flap = Math.sin(t*flapSpeed);
    const spread = 0.28 + 0.72*(0.5+0.5*flap);
    const lift = flap*11;
    const tail = Math.sin(t*flapSpeed*0.4)*22;

    // tail
    c.beginPath();
    c.moveTo(-50,-12);
    c.quadraticCurveTo(-160,-9+tail*0.45,-252,tail);
    c.quadraticCurveTo(-160,9+tail*0.45,-50,12);
    c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(-250,tail); c.lineTo(-288,tail-20); c.lineTo(-270,tail); c.lineTo(-288,tail+20);
    c.closePath(); c.fill();

    // hind legs
    for (const s of [-1,1]) {
      c.beginPath();
      c.moveTo(-18,s*15);
      c.quadraticCurveTo(-44,s*46,-72,s*39);
      c.quadraticCurveTo(-48,s*28,-24,s*11);
      c.closePath(); c.fill();
    }

    // body
    c.beginPath(); c.ellipse(0, lift*0.25, 70, 26, 0, 0, 6.2832); c.fill();

    // neck + head
    c.beginPath();
    c.moveTo(52,-13);
    c.quadraticCurveTo(104,-24,138,-27);
    c.lineTo(192,-32); c.lineTo(151,-15); c.lineTo(145,-2);
    c.quadraticCurveTo(101,7,52,13);
    c.closePath(); c.fill();
    c.beginPath(); c.moveTo(142,-28); c.lineTo(120,-54); c.lineTo(136,-30); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(131,-26); c.lineTo(103,-47); c.lineTo(123,-28); c.closePath(); c.fill();

    // wings
    for (const s of [-1,1]) {
      const tipY = s*(36 + spread*268);
      const tipX = 11 - spread*50;
      c.beginPath();
      c.moveTo(32,s*13);
      c.bezierCurveTo(68,s*(42+spread*76), 49,s*(118+spread*118), tipX, tipY);
      c.quadraticCurveTo(-32,s*(64+spread*182), -49,s*(47+spread*126));
      c.quadraticCurveTo(-32,s*(49+spread*103), -58,s*(32+spread*79));
      c.quadraticCurveTo(-36,s*(32+spread*60), -60,s*(19+spread*38));
      c.quadraticCurveTo(-38,s*21, -32,s*15);
      c.closePath(); c.fill();

      c.save();
      c.globalAlpha = 0.5; c.lineWidth = 5;
      c.strokeStyle = "rgba(0,0,0,1)"; c.lineCap = "round";
      for (const [jx,jy] of [[-49,47+spread*126],[-58,32+spread*79],[-60,19+spread*38]]) {
        c.beginPath(); c.moveTo(26,s*11); c.lineTo(jx, s*jy); c.stroke();
      }
      c.beginPath(); c.moveTo(26,s*11); c.lineTo(tipX,tipY); c.stroke();
      c.restore();
    }
    c.restore();
    this.dtex.needsUpdate = true;
  }

  // ---- the firestorm --------------------------------------------------------
  _buildTornado() {
    this.toU = { uAmt:{value:0}, uTime:{value:0}, uOpen:{value:0}, uBurst:{value:0} };
    this.toMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.toU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform float uAmt,uTime,uOpen,uBurst;
        ${this.NOISE}
        void main(){
          // width profile: pinched at the base, flaring upward, blown out
          // laterally as the vortex disperses
          float prof = mix(0.13, 0.46, pow(vUv.y, 0.72));
          prof *= (0.25 + uOpen*0.75) * (1.0 + uBurst*2.4);
          float xx = (vUv.x-0.5)/max(prof,0.001);
          if (abs(xx) > 1.0) discard;

          // ---- ASIN cylindrical mapping ---------------------------------
          // maps the flat quad onto a rotating volume, so the fire
          // compresses toward the silhouette edges instead of sliding
          float ang = asin(clamp(xx,-1.0,1.0));
          float around = ang/3.14159265;
          float u = around + uTime*0.62 - vUv.y*0.80;

          float n = fbm(vec2(u*7.5, vUv.y*3.4 - uTime*2.5));
          float spiral = 0.5 + 0.5*sin(around*6.2831*2.0 + vUv.y*15.0 - uTime*7.5);
          float dens = n*0.78 + spiral*0.42;

          // limb darkening at the silhouette edges reads as roundness
          dens *= 1.0 - pow(abs(xx), 2.4)*0.85;
          dens *= smoothstep(0.0,0.09,vUv.y)*smoothstep(1.0,0.66,vUv.y);
          dens *= uOpen;

          float d = clamp(dens,0.0,1.0);
          if (d < 0.006) discard;
          vec3 col = mix(vec3(0.60,0.05,0.004), vec3(1.0,0.40,0.03), d);
          col = mix(col, vec3(1.0,0.90,0.60), pow(d,2.7));
          float a = d*uAmt*(1.0-uBurst*0.85);
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
    this.tornado = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.4, 2.3), this.toMat);
    this.tornado.position.set(0, this.groundY + 1.15, -2.0);
    this.tornado.visible = false;
    this.scene.add(this.tornado);

    // a second, thinner core in front of him so he sits inside the column
    this.toFrontMat = this.toMat.clone();
    this.toFrontMat.uniforms = {
      uAmt:{value:0}, uTime:{value:0}, uOpen:{value:0}, uBurst:{value:0}
    };
    this.tornadoFront = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.0, 2.3), this.toFrontMat);
    this.tornadoFront.position.set(0, this.groundY + 1.15, 2.0);
    this.tornadoFront.visible = false;
    this.scene.add(this.tornadoFront);
  }

  // ---- him ------------------------------------------------------------------
  _buildSprite() {
    const tex = new THREE.TextureLoader().load(this.src);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;

    this.sprU = {
      uMap:{value:tex}, uTime:{value:0},
      uFlap:{value:0}, uFlapSpd:{value:5.4}, uBodyX:{value:this.bodyX},
      uShade:{value:0}, uRim:{value:0}, uBurn:{value:0},
      uGlint:{value:0}, uGlintPos:{value:-0.25},
      uHeat:{value:0}, uAlpha:{value:0}
    };

    this.sprMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.sprU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform sampler2D uMap;
        uniform float uTime,uFlap,uFlapSpd,uBodyX,uShade,uRim,uBurn,uGlint,uGlintPos,uHeat,uAlpha;
        ${this.NOISE}

        // mask fitted to this pose: wings live at v 0.52–0.88, outboard of
        // his body axis. armour, head and greatsword are excluded.
        vec2 flapUV(vec2 uv){
          float outer = smoothstep(0.13, 0.34, abs(uv.x - uBodyX));
          float band  = smoothstep(0.48, 0.60, uv.y) * smoothstep(0.95, 0.82, uv.y);
          float w = outer*band*uFlap;
          float f = sin(uTime*uFlapSpd);
          // downstroke pulls the wing in and down, upstroke sweeps it out
          uv.x = uBodyX + (uv.x-uBodyX)*(1.0 - f*0.20*w);
          uv.y -= f*0.060*w;
          // membrane ripple travelling out along the span
          uv.y += sin(abs(uv.x-uBodyX)*22.0 - uTime*uFlapSpd*1.5)*0.009*w;
          return uv;
        }

        void main(){
          vec2 uv = flapUV(vUv);
          float low = smoothstep(0.60,0.0,vUv.y);
          uv.x += sin(vUv.y*44.0 - uTime*5.0)*0.0032*low*uHeat;

          vec4 base = texture2D(uMap, uv);
          float texA = base.a;
          if(texA < 0.008) discard;
          vec3 tex = base.rgb;
          float lum = dot(tex, vec3(0.299,0.587,0.114));
          float mx = max(max(tex.r,tex.g),tex.b), mn = min(min(tex.r,tex.g),tex.b);

          vec3 col = tex * mix(0.08, 1.0, uShade);

          // ---- fire licking off the wings and shoulders ----------------
          float dil = 0.0;
          for(int i=1;i<=5;i++){
            float s = float(i)/5.0;
            float wob = sin(float(i)*2.4 + uTime*3.2)*0.010;
            dil = max(dil, texture2D(uMap, uv - vec2(wob, s*0.048)).a);
          }
          float aura = clamp(dil - texA, 0.0, 1.0);
          float fl = fbm(vec2(uv.x*11.0, uv.y*4.6 - uTime*2.9));
          float flame = smoothstep(0.45,0.93, fl)*aura*uBurn;
          col += mix(vec3(1.0,0.28,0.02), vec3(1.0,0.88,0.52), pow(flame,2.0))*flame*2.5;

          // ---- rim lit by the firestorm ---------------------------------
          if(uRim > 0.001){
            float px = 0.0055;
            float aL = texture2D(uMap, uv-vec2(px,0.0)).a;
            float aR = texture2D(uMap, uv+vec2(px,0.0)).a;
            float aD = texture2D(uMap, uv-vec2(0.0,px)).a;
            float aU = texture2D(uMap, uv+vec2(0.0,px)).a;
            float edge = clamp(texA - min(min(aL,aR),min(aD,aU)), 0.0, 1.0);
            col += vec3(1.0,0.52,0.16)*edge*uRim*3.2;
          }

          // ---- steel glint sweeping the armour and greatsword ----------
          float steel = smoothstep(0.10,0.45,lum)*(1.0 - clamp((mx-mn)*3.4,0.0,1.0));
          float sweep = exp(-pow((vUv.y - uGlintPos)*6.2, 2.0));
          col += vec3(1.0,0.94,0.82)*steel*sweep*uGlint*2.4;

          float a = max(texA, flame*0.8)*uAlpha;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });

    const h = 1.74, w = h*this.aspect;
    this.spriteH = h;
    this.sprite = new THREE.Mesh(new THREE.PlaneBufferGeometry(w,h), this.sprMat);
    this.sprite.position.set(0, this.groundY + h*0.5, 0);
    this.scene.add(this.sprite);
  }

  // ---- embers spiralling up the vortex ----------------------------------------
  _buildOrbitEmbers() {
    this.O = 320;
    this.oTheta = new Float32Array(this.O);
    this.oY = new Float32Array(this.O);
    this.oSpin = new Float32Array(this.O);
    this.oRise = new Float32Array(this.O);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(this.O*3),3));
    const cv = document.createElement("canvas"); cv.width=cv.height=64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(255,245,210,1)");
    gr.addColorStop(0.35,"rgba(255,145,35,0.55)");
    gr.addColorStop(1,"rgba(215,60,5,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.orbMat = new THREE.PointsMaterial({
      size:0.017, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.orbit = new THREE.Points(g, this.orbMat);
    this.orbit.position.z = 2.4;
    this.scene.add(this.orbit);
    this._seedOrbit();
  }

  _seedOrbit() {
    for (let i=0;i<this.O;i++){
      this.oTheta[i] = Math.random()*Math.PI*2;
      this.oY[i] = Math.random();
      this.oSpin[i] = 2.2 + Math.random()*2.4;
      this.oRise[i] = 0.22 + Math.random()*0.42;
    }
  }

  // ---- downdraft rings, one per wing beat ---------------------------------------
  _buildDownRings() {
    const mk = () => new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:{ uT:{value:1}, uTime:{value:0} },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uT,uTime;
        ${this.NOISE}
        void main(){
          float d=length(vUv-0.5)*2.0;
          float rad=pow(uT,0.55)*1.02;
          float n=fbm(vUv*7.0+vec2(-uTime*0.5,uTime*0.3));
          float w=mix(0.15,0.02,uT)*(0.5+n);
          float ring=smoothstep(w,0.0,abs(d-rad));
          float a=ring*smoothstep(0.28,0.8,n)*(1.0-uT)*0.95;
          if(a<0.004) discard;
          gl_FragColor=vec4(mix(vec3(1.0,0.80,0.48),vec3(0.75,0.32,0.08),uT),a);
        }`
    });
    this.dRings = [];
    for (let i=0;i<4;i++){
      const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.2,3.2), mk());
      m.position.set(0, this.groundY, 1.0);
      m.scale.set(1,0.26,1);
      m.visible = false; m.userData.p = 1;
      this.scene.add(m); this.dRings.push(m);
    }
  }

  _emitDownRing() {
    const r = this.dRings.find(x=>!x.visible) || this.dRings[0];
    r.visible = true; r.userData.p = 0;
    r.material.uniforms.uT.value = 0;
  }

  _buildEmbers() {
    this.N = 380;
    this.vel = new Float32Array(this.N*3);
    this.seed = new Float32Array(this.N);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(this.N*3),3));
    const cv = document.createElement("canvas"); cv.width=cv.height=64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(255,244,205,1)");
    gr.addColorStop(0.35,"rgba(255,140,30,0.55)");
    gr.addColorStop(1,"rgba(220,60,5,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.embMat = new THREE.PointsMaterial({
      size:0.018, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.embers = new THREE.Points(g, this.embMat);
    this.embers.position.z = 2.2;
    this.scene.add(this.embers);
    this._seedEmbers();
  }

  _seedEmbers() {
    const pos = this.embers.geometry.attributes.position.array;
    for (let i=0;i<this.N;i++){
      pos[i*3]   = (Math.random()*2-1)*1.5;
      pos[i*3+1] = this.groundY - Math.random()*0.35;
      this.vel[i*3]   = (Math.random()*2-1)*0.14;
      this.vel[i*3+1] = 0.20 + Math.random()*0.62;
      this.seed[i] = Math.random()*6.28;
    }
    this.embers.geometry.attributes.position.needsUpdate = true;
  }

  _gustEmbers() {
    const pos = this.embers.geometry.attributes.position.array;
    for (let i=0;i<this.N;i++){
      if (pos[i*3+1] < this.groundY + 0.55) {
        this.vel[i*3]   += (pos[i*3] >= 0 ? 1 : -1)*(0.35 + Math.random()*0.5);
        this.vel[i*3+1] += 0.18 + Math.random()*0.3;
      }
    }
  }

  _buildShimmer(aspect) {
    this.shimU = { uAmt:{value:0}, uTime:{value:0} };
    this.shimMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.shimU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        ${this.NOISE}
        void main(){
          float low=smoothstep(0.58,0.0,vUv.y);
          float n=fbm(vec2(vUv.x*13.0, vUv.y*7.0 - uTime*1.9));
          float band=pow(smoothstep(0.52,0.95,n),2.2);
          float a=band*low*uAmt*0.15;
          if(a<0.004) discard;
          gl_FragColor=vec4(1.0,0.66,0.32,a);
        }`
    });
    this.shimmer = this._fullQuad(aspect, this.shimMat, 3.0);
  }

  _buildFlash(aspect) {
    this.flashMat = new THREE.MeshBasicMaterial({
      color:0xffe0b0, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    this.flash = this._fullQuad(aspect, this.flashMat, 8);
  }

  // ============================================================== control
  play() {
    this._flags = {}; this._shake = 0; this._prevFlap = 0;
    this._seedEmbers(); this._seedOrbit();
    this.tornado.visible=false; this.tornadoFront.visible=false;
    this.dRings.forEach(r=>{ r.visible=false; r.userData.p=1; });
    this.flashMat.opacity=0;
    if (this._t < 0) {
      this._t = 0;
      this.renderer.domElement.style.opacity = "1";
      this._clock = new THREE.Clock();
      this._loop();
    } else this._t = 0;
    return this;
  }

  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    const dt = Math.min(this._clock.getDelta(), 0.05);
    const el = this._clock.elapsedTime;
    if (this._t < 0) return;

    this._t += dt / this.duration;
    const T = Math.min(this._t, 1);
    const F = this._flags;

    // ================== timeline ====================================
    // 0.00–0.13  dark falls, ember wind
    // 0.10–0.36  a DRAGON'S SHADOW sweeps across the field
    // 0.30–0.54  a FLAME TORNADO spins up where it passed
    // 0.48–0.68  he resolves inside the vortex core
    // 0.64–0.80  the tornado bursts outward and disperses
    // 0.66–1.00  he holds, WINGS BEATING, each downstroke hitting the ground
    // 0.92–1.00  settle
    const dark    = sm(T,0.00,0.13);
    const shadowW = sm(T,0.09,0.16)*(1 - sm(T,0.32,0.40));
    const spin    = sm(T,0.30,0.54);
    const reveal  = sm(T,0.48,0.68);
    const burst   = sm(T,0.64,0.80);
    const hold    = sm(T,0.66,0.80);
    const outro   = sm(T,0.92,1.00);

    this.dimU.uAmt.value = (sm(T,0.01,0.12)*0.92)*(1-outro);
    this.ewU.uAmt.value = (dark*0.4 + spin*0.7 + hold*0.5)*(1-outro);
    this.ewU.uTime.value = el;
    this.shimU.uAmt.value = (spin*0.7 + hold*0.8)*(1-outro);
    this.shimU.uTime.value = el;
    this.scU.uAmt.value = (spin*0.55 + hold*0.45)*(1-outro);
    this.scU.uTime.value = el;

    // ---- dragon shadow flyover -----------------------------------------
    {
      const cross = THREE.MathUtils.clamp((T-0.10)/0.26, 0, 1);
      const eased = cross<0.5 ? 2*cross*cross : 1 - Math.pow(-2*cross+2,2)/2;
      const a = this.camera.right;
      const x = a*1.5 - eased*a*3.0;
      const y = 0.62 - eased*1.05;
      const near = Math.sin(THREE.MathUtils.clamp(cross,0,1)*Math.PI);
      const s = 1.5 - near*0.42;
      this._drawDragon(el, this.reduced ? 3.0 : 6.0);
      for (const m of [this.penumbra, this.umbra]) {
        m.position.set(x,y,m.position.z);
        m.rotation.z = Math.PI - 0.18;
      }
      this.penumbra.scale.setScalar(s*1.55);
      this.umbra.scale.setScalar(s);
      this.penMat.opacity = shadowW*(0.15 + near*0.16);
      this.umbMat.opacity = shadowW*(0.30 + near*0.44);
      this.dimU.uAmt.value += shadowW*near*0.22;
      if (!F.shadow && T >= 0.10) { F.shadow = true; if (this.onShadow) this.onShadow(); }
    }

    // ---- the firestorm ---------------------------------------------------
    if (T >= 0.28) {
      this.tornado.visible = true; this.tornadoFront.visible = true;
      const open = spin;
      const bu = burst;
      for (const [m,amt] of [[this.toU,1.0],[this.toFrontMat.uniforms,0.55]]) {
        m.uAmt.value = amt*(1 - sm(T,0.74,0.86))*(1-outro);
        m.uTime.value = el;
        m.uOpen.value = open;
        m.uBurst.value = bu;
      }
      const sw = 1 + burst*1.1;
      this.tornado.scale.set(sw, 1 + spin*0.10, 1);
      this.tornadoFront.scale.set(sw*0.9, 1 + spin*0.10, 1);
      if (T > 0.88) { this.tornado.visible = false; this.tornadoFront.visible = false; }
      if (!F.tornado && T >= 0.30) {
        F.tornado = true; this._shake = 0.55*this.shakeK;
        if (this.onTornado) this.onTornado();
      }
    }
    if (!F.burst && T >= 0.645) {
      F.burst = true;
      this.flashMat.opacity = 0.6;
      this._shake = 0.95*this.shakeK;
      this._emitDownRing();
    }
    if (!F.reveal && T >= 0.50) { F.reveal = true; if (this.onReveal) this.onReveal(); }

    // ---- orbiting embers --------------------------------------------------
    {
      const pos = this.orbit.geometry.attributes.position.array;
      const base = this.groundY;
      for (let i=0;i<this.O;i++){
        this.oTheta[i] += this.oSpin[i]*dt*(0.4 + spin);
        this.oY[i] += this.oRise[i]*dt*(0.3 + spin*0.9);
        if (this.oY[i] > 1) this.oY[i] -= 1;
        const yy = this.oY[i];
        const rad = (0.14 + Math.pow(yy,0.72)*0.52)*(0.25 + spin*0.75)*(1 + burst*2.2);
        pos[i*3]   = Math.sin(this.oTheta[i])*rad;
        pos[i*3+1] = base + yy*2.05;
        pos[i*3+2] = 0;
      }
      this.orbit.geometry.attributes.position.needsUpdate = true;
      this.orbMat.opacity = (spin*0.9)*(1 - sm(T,0.78,0.92))*(1-outro);
    }

    // ---- him ---------------------------------------------------------------
    const sc = 0.88 + reveal*0.12;
    this.sprite.scale.set(sc, sc, 1);
    this.sprite.position.set(0, this.groundY + this.spriteH*0.5*sc + hold*0.02*Math.sin(el*2.7), 0);

    this.sprU.uTime.value = el;
    this.sprU.uAlpha.value = sm(T,0.44,0.56)*(1-outro);
    this.sprU.uShade.value = sm(T,0.52,0.72);
    this.sprU.uRim.value = (reveal*0.75 - hold*0.20 + 0.25)*(1-outro);
    this.sprU.uBurn.value = (reveal*0.55 + hold*0.55)*(1-outro*0.6);
    this.sprU.uHeat.value = (spin*0.6 + hold*0.8)*(1-outro);
    // wings: a couple of settling beats during the reveal, then a steady hover
    this.sprU.uFlap.value = reveal*0.55 + hold*1.0;
    this.sprU.uFlapSpd.value = 7.2 - hold*2.0;

    const gl = sm(T,0.72,0.76)*(1 - sm(T,0.88,0.94));
    this.sprU.uGlint.value = gl;
    this.sprU.uGlintPos.value = -0.25 + THREE.MathUtils.clamp((T-0.72)/0.17,0,1)*1.5;

    // ---- detect each downstroke and make it hit the ground ---------------
    if (this.sprU.uFlap.value > 0.35) {
      const f = Math.sin(el*this.sprU.uFlapSpd.value);
      if (this._prevFlap >= 0 && f < 0) {
        this._emitDownRing();
        this._gustEmbers();
        this._shake = Math.max(this._shake, 0.30*this.shakeK);
        if (this.onBeat) this.onBeat();
      }
      this._prevFlap = f;
    }

    for (const r of this.dRings) {
      if (!r.visible) continue;
      r.userData.p += dt/1.1;
      r.material.uniforms.uT.value = Math.min(r.userData.p,1);
      r.material.uniforms.uTime.value = el;
      if (r.userData.p >= 1) r.visible = false;
    }

    // ---- embers ------------------------------------------------------------
    {
      const pos = this.embers.geometry.attributes.position.array;
      for (let i=0;i<this.N;i++){
        this.vel[i*3+1] += 0.11*dt;
        this.vel[i*3]   *= (1 - 0.9*dt);
        pos[i*3]   += (this.vel[i*3] + Math.sin(el*1.8+this.seed[i])*0.18)*dt;
        pos[i*3+1] += this.vel[i*3+1]*dt;
        if (pos[i*3+1] > 1.1) {
          pos[i*3]   = (Math.random()*2-1)*1.5;
          pos[i*3+1] = this.groundY - Math.random()*0.3;
          this.vel[i*3] = (Math.random()*2-1)*0.14;
          this.vel[i*3+1] = 0.20 + Math.random()*0.62;
        }
      }
      this.embers.geometry.attributes.position.needsUpdate = true;
      this.embMat.opacity = (dark*0.2 + spin*0.5 + hold*0.65)*(1-outro*0.7);
    }

    if (this.flashMat.opacity > 0)
      this.flashMat.opacity = Math.max(0, this.flashMat.opacity - dt*2.6);

    this._shake = Math.max(0, this._shake - dt*2.4);
    this.camera.position.x = (Math.random()-0.5)*0.09*this._shake;
    this.camera.position.y = (Math.random()-0.5)*0.09*this._shake;

    this.renderer.render(this.scene, this.camera);

    if (this._t >= 1) {
      this._t = -1;
      cancelAnimationFrame(this._raf); this._raf = null;
      this.renderer.domElement.style.opacity = "0";
      this.camera.position.set(0,0,15);
      this.renderer.clear();
      if (this.onComplete) this.onComplete();
    }

    function sm(v,e0,e1){
      const t = THREE.MathUtils.clamp((v-e0)/(e1-e0),0,1);
      return t*t*(3-2*t);
    }
  }

  _resize() {
    const a = innerWidth/innerHeight;
    this.renderer.setSize(innerWidth, innerHeight);
    this.camera.left=-a; this.camera.right=a;
    this.camera.updateProjectionMatrix();
    for (const m of [this.dim,this.ewind,this.shimmer,this.flash]) {
      m.geometry.dispose();
      m.geometry = new THREE.PlaneBufferGeometry(2*a,2);
    }
    this.ewU.uAspect.value = a;
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize", this._onResize);
    this.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

const field = document.getElementById("field");
const shake = (px, ms) => field.animate(
  [{transform:"translate(0,0)"},
   {transform:`translate(${-px}px,${px*0.7}px)`},
   {transform:`translate(${px*0.8}px,${-px*0.55}px)`},
   {transform:"translate(0,0)"}],
  {duration:ms, easing:"ease-out"});

const fx = new DragonPyreVFX({
  src: GREY,
  onShadow(){ field.animate([{filter:"brightness(1)"},{filter:"brightness(0.42)"}],
    {duration:1000, easing:"ease-out", fill:"forwards"}); },
  onTornado(){ shake(9, 420); },
  onReveal(){ field.animate(
    [{filter:"brightness(0.42)"},{filter:"brightness(0.78) saturate(1.15)"}],
    {duration:900, easing:"ease-out", fill:"forwards"}); },
  onBeat(){ shake(4, 260); },
  onComplete(){ field.animate([{filter:"brightness(0.78)"},{filter:"brightness(1)"}],
    {duration:800, easing:"ease-out", fill:"forwards"}); }
});
// 🖼️ In-game the file is loaded inside an iframe over the battlefield — drop the
// preview backdrop there so the FIELD shows through (transparent). Standalone
// (opened directly) keeps the backdrop so you can see the transparency.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Optional: ?art=<url> overrides the card image (in-game passes the summoned
// unit's own card art so it always matches whatever you've set).
try { const _a = new URLSearchParams(location.search).get('art'); if (_a) { const _c = document.getElementById('card'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } } catch (e) {}
// Standalone preview: click anywhere to replay the cinematic.
document.addEventListener('click', () => fx.play());
fx.play();
