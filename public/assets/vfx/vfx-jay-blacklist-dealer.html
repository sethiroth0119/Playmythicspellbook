<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · JAY THE BLACKLIST DEALER</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — lets you SEE the transparency when you open this
     file directly. In-game (loaded in an iframe over the battlefield) it is
     removed so the FIELD shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change: transform, filter; }
    /* 👑 The unit's REAL card — the full framed ACE card PNG (frame + scene baked in).
     Displayed as-is; the VFX plays around it. In-game ?art can swap it. */
  #card { position:relative; z-index:200; height:78vh; max-height:680px;
    aspect-ratio: 1024 / 1536; background: center/contain no-repeat;
    background-image: url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/Jay the blacklist Dealer.png");
    filter: drop-shadow(0 26px 64px rgba(0,0,0,0.72)); }

  

  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px; z-index:200;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(3,5,9,0.94)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#06111f; background:#6fb2ff; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(111,178,255,0.4); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#7e879b; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#6fb2ff; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"><div id="card"></div></div>

<script src="three.min.js"></script>
<script>
/* =====================================================================
   CircleRiseVFX — a rune circle inscribes itself and he rises out of it
   ---------------------------------------------------------------------
   Beats: night → the magic circle draws itself open → a column of light
          erupts → he RISES OUT OF THE CIRCLE → energy sloughs off →
          sustained fire with arcane rounds → hold
   Notable work:
     · he is CLIPPED at the circle's plane in world space — the vertex
       stage passes world position down and the fragment stage discards
       anything below the ground line, so he is genuinely coming up
       through the circle rather than sliding up behind it. the crossing
       line burns while he passes it.
     · a real projectile system: bullets are instanced quads oriented to
       their own velocity and stretched by speed, with a muzzle flash and
       a small rune circle that snaps open at the barrel on every shot
   ===================================================================== */
class CircleRiseVFX {
  constructor(opts = {}) {
    this.src = opts.src;
    this.duration = opts.duration || 5.8;
    this.aspect = opts.spriteAspect || (623 / 908);
    this.muzzleUV = opts.muzzleUV || { x: 0.800, y: 0.868 };
    this.handUV = opts.handUV || { x: 0.116, y: 0.489 };
    this.groundY = opts.groundY != null ? opts.groundY : -0.80;
    this.onCircle = opts.onCircle || null;
    this.onRise = opts.onRise || null;
    this.onShot = opts.onShot || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 60;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.shakeK = this.reduced ? 0.2 : 1;

    // t, angle(rad), spread — all after he is out of the circle
    this.SHOTS = [
      [0.612,  0.02, 0.07], [0.655, -0.07, 0.07], [0.700,  0.09, 0.07],
      [0.748, -0.03, 0.07], [0.793,  0.06, 0.07], [0.836, -0.08, 0.07],
      [0.874,  0.03, 0.06]
    ];

    this._t = -1; this._raf = null; this._flags = {}; this._shake = 0;
    this._recoil = 0; this._circlePulse = 0; this._mcT = 1;
    this._build();
  }

  // ================================================================ setup
  _build() {
    const r = new THREE.WebGLRenderer({ alpha:true, antialias:true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position:"fixed", inset:"0", pointerEvents:"none",
      zIndex:String(this.zIndex), opacity:"0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -30, 30);
    this.camera.position.z = 15;

    this.NOISE = `
      float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
      float ringf(float d,float r,float w){ return smoothstep(w,0.0,abs(d-r)); }
    `;

    this._buildDim(a);
    this._buildGroundGlow();
    this._buildColumn();
    this._buildCircle();
    this._buildRiser();
    this._buildPulses();
    this._buildSprite();
    this._buildSeamGlow();
    this._buildBullets();
    this._buildMuzzle();
    this._buildMotes();
    this._buildFlash(a);

    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  _fullQuad(aspect, mat, z) {
    const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(2*aspect, 2), mat);
    m.position.z = z; this.scene.add(m); return m;
  }

  _buildDim(aspect) {
    this.dimU = { uAmt:{value:0} };
    this.dimMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.dimU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`varying vec2 vUv; uniform float uAmt;
        void main(){
          float d=length(vUv-0.5)*1.42;
          float a=uAmt*(0.32+0.68*smoothstep(0.05,1.0,d));
          if(a<0.004) discard;
          gl_FragColor=vec4(0.006,0.010,0.022,a);
        }`
    });
    this.dim = this._fullQuad(aspect, this.dimMat, -9);
  }

  _buildGroundGlow() {
    this.ggU = { uAmt:{value:0}, uTime:{value:0} };
    this.ggMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.ggU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        ${this.NOISE}
        void main(){
          vec2 p=(vUv-0.5)*2.0; float d=length(p);
          float n=fbm(vUv*4.5+vec2(-uTime*0.3,uTime*0.2));
          float pool=pow(smoothstep(1.0,0.0,d),1.8)*(0.55+0.45*n);
          float a=pool*uAmt;
          if(a<0.004) discard;
          gl_FragColor=vec4(mix(vec3(0.10,0.34,0.86),vec3(0.72,0.88,1.0),pool),a);
        }`
    });
    this.gglow = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.0,3.0), this.ggMat);
    this.gglow.position.set(0,this.groundY,-6);
    this.gglow.scale.set(1,0.26,1);
    this.scene.add(this.gglow);
  }

  // ---- column of light erupting from the circle -------------------------
  _buildColumn() {
    this.coU = { uAmt:{value:0}, uTime:{value:0}, uRise:{value:0} };
    this.coMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.coU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime,uRise;
        ${this.NOISE}
        void main(){
          float x = abs(vUv.x-0.5)*2.0;
          float w = mix(0.72, 0.30, pow(vUv.y,0.8));      // tapers upward
          float core = smoothstep(w,0.0,x);
          float soft = smoothstep(w*2.0,0.0,x)*0.40;
          // rising striations
          float st = vnoise(vec2(x*18.0, vUv.y*3.0 - uTime*2.2));
          float vol = 0.55 + 0.45*st;
          float top = smoothstep(uRise+0.05, uRise-0.30, vUv.y);
          float foot = smoothstep(0.0,0.06,vUv.y);
          float a = (core*0.85 + soft)*vol*top*foot*uAmt;
          if(a<0.004) discard;
          vec3 col = mix(vec3(0.16,0.46,1.0), vec3(0.86,0.95,1.0), core);
          gl_FragColor = vec4(col,a);
        }`
    });
    this.column = new THREE.Mesh(new THREE.PlaneBufferGeometry(1.55,2.5), this.coMat);
    this.column.position.set(0, this.groundY+1.25, -5);
    this.scene.add(this.column);
  }

  // ---- shared rune-circle shader ---------------------------------------
  _circleMaterial() {
    return new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:{ uT:{value:0}, uTime:{value:0}, uPulse:{value:0}, uGold:{value:0.45},
                 uDraw:{value:1} },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uT,uTime,uPulse,uGold,uDraw;
        ${this.NOISE}
        void main(){
          vec2 p=(vUv-0.5)*2.0;
          float d=length(p);
          float ang=atan(p.y,p.x);
          float open=smoothstep(0.0,1.0,uT);
          float R=open*(1.0+uPulse*0.05);
          if(d>R*1.06) discard;

          // the circle inscribes itself: a sweep hand draws it in
          float rel = fract((ang + 1.5707963)/6.2831853 + 1.0);
          float drawn = smoothstep(rel, rel-0.06, uDraw);

          float g=0.0, gold=0.0;
          g += ringf(d,0.97*R,0.014);
          g += ringf(d,0.90*R,0.006)*0.75;
          g += ringf(d,0.56*R,0.011)*0.85;
          g += ringf(d,0.30*R,0.006)*0.6;

          float a1 = ang + uTime*0.42;
          gold += step(0.55, fract(a1/6.2831*44.0))*ringf(d,0.935*R,0.038)*0.95;
          float a2 = ang - uTime*0.66;
          g += step(0.72, fract(a2/6.2831*22.0))*ringf(d,0.43*R,0.055)*0.7;

          for(int k=0;k<2;k++){
            float rot = uTime*(k==0?0.36:-0.36) + float(k)*1.0472;
            float aa = mod(ang+rot, 2.0944) - 1.0472;
            gold += smoothstep(0.017,0.0, abs(cos(aa)*d - 0.50*R))*0.8;
          }
          float sp = step(0.90, fract((ang + uTime*0.2)/6.2831*10.0));
          g += sp*smoothstep(0.56*R,0.30*R,d)*0.5;
          g += pow(max(0.0,cos(ang - uTime*1.7)),22.0)*smoothstep(R,0.0,d)*0.45;

          g *= drawn; gold *= drawn;
          // the drawing head glows brightest
          float head = smoothstep(0.035,0.0, abs(rel-uDraw))*(1.0-smoothstep(0.98,1.0,uDraw));
          g += head*ringf(d,0.935*R,0.09)*1.6;

          float amt = clamp(g,0.0,1.5)*(1.0+uPulse*0.9);
          float ga  = clamp(gold,0.0,1.5)*(1.0+uPulse*0.9);
          vec3 col = vec3(0.24,0.58,1.0)*amt + vec3(1.0,0.78,0.34)*ga*uGold;
          float a = clamp(amt+ga,0.0,1.6)*smoothstep(0.0,0.10,uT);
          if(a<0.005) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
  }

  _buildCircle() {
    this.ciMat = this._circleMaterial();
    this.circle = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.0,3.0), this.ciMat);
    this.circle.position.set(0,this.groundY,-4);
    this.circle.scale.set(1,0.28,1);
    this.scene.add(this.circle);
  }

  _buildRiser() {
    this.riMat = this._circleMaterial();
    this.riMat.uniforms.uGold.value = 0.30;
    this.riser = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.2,2.2), this.riMat);
    this.riser.position.set(0,this.groundY,-3.5);
    this.riser.scale.set(1,0.24,1);
    this.riser.visible = false;
    this.scene.add(this.riser);
  }

  _buildPulses() {
    const mk=()=> new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:{ uT:{value:1} },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uT;
        void main(){
          float d=length(vUv-0.5)*2.0;
          float rad=pow(uT,0.5)*1.03;
          float w=mix(0.09,0.010,uT);
          float ring=smoothstep(w,0.0,abs(d-rad));
          float a=ring*(1.0-uT)*1.35;
          if(a<0.004) discard;
          gl_FragColor=vec4(mix(vec3(0.90,0.96,1.0),vec3(0.20,0.52,1.0),uT),a);
        }`
    });
    this.pulses=[];
    for(let i=0;i<3;i++){
      const m=new THREE.Mesh(new THREE.PlaneBufferGeometry(3.6,3.6), mk());
      m.position.set(0,this.groundY,1.0);
      m.scale.set(1,0.28,1);
      m.visible=false; m.userData.p=1;
      this.scene.add(m); this.pulses.push(m);
    }
  }

  _emitPulse() {
    const r=this.pulses.find(x=>!x.visible)||this.pulses[0];
    r.visible=true; r.userData.p=0; r.material.uniforms.uT.value=0;
  }

  // ---- him -----------------------------------------------------------------
  _buildSprite() {
    const tex = new THREE.TextureLoader().load(this.src);
    tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;

    this.sprU = {
      uMap:{value:tex}, uTime:{value:0},
      uCoat:{value:0}, uShade:{value:0}, uRim:{value:0},
      uArc:{value:0}, uCling:{value:0},
      uGlint:{value:0}, uGlintPos:{value:-0.25},
      uAlpha:{value:0},
      uGround:{value:this.groundY},
      uSeam:{value:1},
      uMuzzle:{value:new THREE.Vector2(this.muzzleUV.x,this.muzzleUV.y)},
      uHand:{value:new THREE.Vector2(this.handUV.x,this.handUV.y)}
    };

    this.sprMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.sprU,
      vertexShader:`
        varying vec2 vUv; varying vec2 vWorld;
        void main(){
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position,1.0);
          vWorld = wp.xy;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader:`
        varying vec2 vUv; varying vec2 vWorld;
        uniform sampler2D uMap;
        uniform float uTime,uCoat,uShade,uRim,uArc,uCling,uGlint,uGlintPos,uAlpha,uGround,uSeam;
        uniform vec2 uMuzzle, uHand;
        ${this.NOISE}

        void main(){
          // coat tails stream upward as he comes up out of the circle
          vec2 uv = vUv;
          float tails = smoothstep(0.55,0.0,vUv.y);
          float sides = smoothstep(0.14,0.44,abs(vUv.x-0.46));
          float w = (tails*1.0 + sides*0.45)*uCoat;
          uv.x += sin(vUv.y*7.5 - uTime*2.0)*0.016*w;
          uv.y += sin(vUv.x*10.0 + uTime*1.5)*0.007*w;

          vec4 base = texture2D(uMap, uv);
          float texA = base.a;
          if(texA<0.008) discard;
          vec3 tex = base.rgb;
          float lum = dot(tex,vec3(0.299,0.587,0.114));

          // ---- CLIP AT THE CIRCLE'S PLANE ---------------------------
          // anything that has not yet come up through the circle simply
          // is not drawn; the crossing line burns while he passes it
          float ragged = (fbm(vec2(vWorld.x*7.0, uTime*0.7))-0.5)*0.030;
          float lo = uGround + ragged;
          float clip = smoothstep(lo-0.018, lo+0.026, vWorld.y);
          if (texA*clip < 0.006) discard;
          float seam = clip*(1.0-clip)*4.0*uSeam;

          vec3 col = tex*mix(0.10,1.0,uShade);

          // ---- arcane blue: the pistol and his off hand ---------------
          float blue = smoothstep(0.05,0.30, tex.b-tex.r)*smoothstep(0.10,0.55,lum);
          float nearW = smoothstep(0.16,0.0, distance(vUv,uMuzzle))
                      + smoothstep(0.13,0.0, distance(vUv,uHand));
          float crackle = smoothstep(0.44,0.94, fbm(vUv*20.0+vec2(0.0,-uTime*3.2)));
          col += vec3(0.26,0.66,1.0)*blue*(0.35+nearW*0.8)*uArc*(0.65+crackle*0.95)*2.4;

          // ---- circle energy sloughing off him -----------------------
          float cl = smoothstep(0.55,1.0, fbm(uv*vec2(7.0,3.4)+vec2(0.0,uTime*2.6)));
          col += vec3(0.30,0.68,1.0)*cl*uCling*1.6;

          // ---- gold trim glint ----------------------------------------
          float gold = smoothstep(0.14,0.55,lum)
                     * smoothstep(0.03,0.20, tex.r-tex.b)
                     * smoothstep(0.26,0.04, tex.r-tex.g);
          float sweep = exp(-pow((vUv.y-uGlintPos)*6.2,2.0));
          col += vec3(1.0,0.84,0.40)*gold*sweep*uGlint*2.4;

          // ---- rim lit from the circle below ---------------------------
          if(uRim>0.001){
            float px=0.0055;
            float aL=texture2D(uMap,uv-vec2(px,0.0)).a;
            float aR=texture2D(uMap,uv+vec2(px,0.0)).a;
            float aD=texture2D(uMap,uv-vec2(0.0,px)).a;
            float aU=texture2D(uMap,uv+vec2(0.0,px)).a;
            float edge=clamp(texA-min(min(aL,aR),min(aD,aU)),0.0,1.0);
            float fromBelow=0.5+0.5*smoothstep(0.9,0.1,vUv.y);
            col += vec3(0.42,0.72,1.0)*edge*uRim*fromBelow*3.0;
          }

          col += vec3(0.72,0.90,1.0)*seam*2.6;

          float a=texA*clip*uAlpha;
          if(a<0.004) discard;
          gl_FragColor=vec4(col,a);
        }`
    });

    const h=1.74, w=h*this.aspect;
    this.spriteH=h;
    this.sprite=new THREE.Mesh(new THREE.PlaneBufferGeometry(w,h), this.sprMat);
    this.sprite.position.set(0,this.groundY+h*0.5,0);
    this.scene.add(this.sprite);
  }

  // ---- a bright band on the circle where he is breaking through -----------
  _buildSeamGlow() {
    this.sgU = { uAmt:{value:0}, uTime:{value:0} };
    this.sgMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.sgU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        ${this.NOISE}
        void main(){
          float x = abs(vUv.x-0.5)*2.0;
          float y = abs(vUv.y-0.5)*2.0;
          float n = fbm(vec2(vUv.x*9.0 - uTime*0.9, uTime*0.5));
          float band = smoothstep(1.0,0.0,y)*smoothstep(1.0,0.15,x)*(0.55+0.45*n);
          float a = band*uAmt;
          if(a<0.004) discard;
          gl_FragColor = vec4(mix(vec3(0.30,0.66,1.0),vec3(0.92,0.98,1.0),band), a);
        }`
    });
    this.seam = new THREE.Mesh(new THREE.PlaneBufferGeometry(1.6,0.30), this.sgMat);
    this.seam.position.set(0,this.groundY,1.6);
    this.scene.add(this.seam);
  }

  // ---- projectiles ------------------------------------------------------------
  _buildBullets() {
    const cv=document.createElement("canvas"); cv.width=256; cv.height=64;
    const c=cv.getContext("2d");
    const g=c.createLinearGradient(0,0,256,0);
    g.addColorStop(0,"rgba(40,110,255,0)");
    g.addColorStop(0.55,"rgba(70,150,255,0.35)");
    g.addColorStop(0.88,"rgba(190,230,255,0.95)");
    g.addColorStop(1,"rgba(255,255,255,1)");
    c.fillStyle=g;
    for(let x=0;x<256;x++){
      const t=x/255;
      const hh=2 + Math.pow(t,2.2)*22;
      c.fillRect(x,32-hh/2,1,hh);
    }
    const hd=c.createRadialGradient(230,32,1,230,32,30);
    hd.addColorStop(0,"rgba(255,255,255,1)");
    hd.addColorStop(0.4,"rgba(140,200,255,0.5)");
    hd.addColorStop(1,"rgba(60,130,255,0)");
    c.fillStyle=hd; c.fillRect(200,2,60,60);

    const tex=new THREE.CanvasTexture(cv); tex.minFilter=THREE.LinearFilter;
    this.B = 44;
    this.bullets=[];
    this.bDummy=new THREE.Object3D();
    this.bInst=new THREE.InstancedMesh(
      new THREE.PlaneBufferGeometry(1,1),
      new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false,
        blending:THREE.AdditiveBlending }),
      this.B
    );
    this.bInst.frustumCulled=false;
    this.bInst.position.z=3.2;
    this.scene.add(this.bInst);
    for(let i=0;i<this.B;i++) this.bullets.push({i,live:false});
    this._parkBullets();
  }

  _parkBullets() {
    for(const b of this.bullets){
      b.live=false;
      this.bDummy.scale.setScalar(0); this.bDummy.updateMatrix();
      this.bInst.setMatrixAt(b.i,this.bDummy.matrix);
    }
    this.bInst.instanceMatrix.needsUpdate=true;
  }

  _fire(x,y,ang,spread,n) {
    let fired=0;
    for(const b of this.bullets){
      if(b.live) continue;
      const a=ang+(Math.random()-0.5)*spread*2.0;
      const sp=3.4+Math.random()*1.5;
      b.live=true; b.x=x; b.y=y; b.a=a;
      b.vx=Math.cos(a)*sp; b.vy=Math.sin(a)*sp;
      b.life=0; b.dur=0.55+Math.random()*0.25;
      b.len=0.30+Math.random()*0.18;
      b.wid=0.055+Math.random()*0.03;
      if(++fired>=n) break;
    }
  }

  _updateBullets(dt,fade) {
    for(const b of this.bullets){
      if(!b.live) continue;
      b.life+=dt;
      if(b.life>=b.dur){ b.live=false;
        this.bDummy.scale.setScalar(0); this.bDummy.updateMatrix();
        this.bInst.setMatrixAt(b.i,this.bDummy.matrix); continue; }
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      const q=b.life/b.dur;
      const grow=Math.min(1,b.life/0.05);
      const f=(1-Math.pow(q,2.2))*fade;
      this.bDummy.position.set(b.x,b.y,0);
      this.bDummy.rotation.set(0,0,b.a);
      this.bDummy.scale.set(b.len*grow*(0.7+q*0.6), b.wid*f, 1);
      this.bDummy.updateMatrix();
      this.bInst.setMatrixAt(b.i,this.bDummy.matrix);
    }
    this.bInst.instanceMatrix.needsUpdate=true;
  }

  // ---- muzzle flash + the rune circle at the barrel ----------------------------
  _buildMuzzle() {
    const cv=document.createElement("canvas"); cv.width=cv.height=128;
    const c=cv.getContext("2d");
    const g=c.createRadialGradient(64,64,1,64,64,60);
    g.addColorStop(0,"rgba(255,255,255,1)");
    g.addColorStop(0.3,"rgba(150,205,255,0.6)");
    g.addColorStop(1,"rgba(50,120,255,0)");
    c.fillStyle=g; c.fillRect(0,0,128,128);
    c.strokeStyle="rgba(220,240,255,0.9)"; c.lineWidth=6; c.lineCap="round";
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2 + Math.PI/4;
      c.beginPath(); c.moveTo(64,64);
      c.lineTo(64+Math.cos(a)*58, 64+Math.sin(a)*58); c.stroke();
    }
    this.mzMat=new THREE.MeshBasicMaterial({
      map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    this.muzzle=new THREE.Mesh(new THREE.PlaneBufferGeometry(0.5,0.5), this.mzMat);
    this.muzzle.position.z=3.4;
    this.scene.add(this.muzzle);

    this.mcMat=this._circleMaterial();
    this.mcMat.uniforms.uGold.value=0.55;
    this.mcirc=new THREE.Mesh(new THREE.PlaneBufferGeometry(0.62,0.62), this.mcMat);
    this.mcirc.position.z=3.3;
    this.mcirc.visible=false;
    this.scene.add(this.mcirc);
  }

  _buildMotes() {
    this.M=220;
    this.mseed=new Float32Array(this.M);
    const g=new THREE.BufferGeometry();
    const arr=new Float32Array(this.M*3);
    for(let i=0;i<this.M;i++){
      arr[i*3]=(Math.random()*2-1)*1.5;
      arr[i*3+1]=-1+Math.random()*2;
      this.mseed[i]=Math.random()*6.28;
    }
    g.setAttribute("position", new THREE.BufferAttribute(arr,3));
    const cv=document.createElement("canvas"); cv.width=cv.height=64;
    const c=cv.getContext("2d");
    const gr=c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(235,246,255,1)");
    gr.addColorStop(0.35,"rgba(110,180,255,0.45)");
    gr.addColorStop(1,"rgba(50,120,235,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.moteMat=new THREE.PointsMaterial({
      size:0.014, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.motes=new THREE.Points(g,this.moteMat);
    this.motes.position.z=2.6;
    this.scene.add(this.motes);
  }

  _buildFlash(aspect) {
    this.flashMat=new THREE.MeshBasicMaterial({
      color:0xc8e2ff, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    this.flash=this._fullQuad(aspect,this.flashMat,8);
  }

  // ============================================================== control
  play() {
    this._flags={}; this._shake=0; this._recoil=0; this._mcT=1; this._circlePulse=0;
    this._parkBullets();
    this.pulses.forEach(p=>{ p.visible=false; p.userData.p=1; });
    this.riser.visible=false; this.mcirc.visible=false;
    this.flashMat.opacity=0; this.mzMat.opacity=0;
    if(this._t<0){
      this._t=0;
      this.renderer.domElement.style.opacity="1";
      this._clock=new THREE.Clock();
      this._loop();
    } else this._t=0;
    return this;
  }

  _loop() {
    this._raf=requestAnimationFrame(()=>this._loop());
    const dt=Math.min(this._clock.getDelta(),0.05);
    const el=this._clock.elapsedTime;
    if(this._t<0) return;

    this._t+=dt/this.duration;
    const T=Math.min(this._t,1);
    const F=this._flags;

    // ================== timeline ====================================
    // 0.00–0.10  night, arcane dust in the air
    // 0.05–0.28  the circle INSCRIBES ITSELF, a sweep hand drawing it in
    // 0.24–0.38  a column of light erupts out of it
    // 0.28–0.58  he RISES OUT OF THE CIRCLE, clipped at its plane
    // 0.54–0.66  fully out; circle energy sloughs off him
    // 0.60–0.88  sustained fire
    // 0.90–1.00  hold and fade
    const night = sm(T,0.00,0.10);
    const draw  = sm(T,0.05,0.28);
    const col   = sm(T,0.24,0.38)*(1 - sm(T,0.58,0.74));
    const rise  = sm(T,0.28,0.58);
    const outT  = sm(T,0.54,0.68);
    const hold  = sm(T,0.62,0.80);
    const outro = sm(T,0.90,1.00);

    this.dimU.uAmt.value = sm(T,0.01,0.10)*(1-outro)*0.94;
    this.ggU.uAmt.value = (draw*0.45 + rise*0.35)*(1-outro);
    this.ggU.uTime.value = el;

    // ---- the circle draws itself, then holds -------------------------
    this.ciMat.uniforms.uT.value = Math.min(1, draw*1.15)*(1-outro);
    this.ciMat.uniforms.uDraw.value = THREE.MathUtils.clamp((T-0.05)/0.20, 0, 1);
    this.ciMat.uniforms.uTime.value = el;
    this.ciMat.uniforms.uPulse.value = this._circlePulse;
    this.circle.scale.set(1+this._circlePulse*0.03,(1+this._circlePulse*0.03)*0.28,1);
    if(!F.circle && T>=0.06){ F.circle=true; if(this.onCircle) this.onCircle(); }

    // ---- column of light --------------------------------------------
    this.coU.uAmt.value = col*0.95;
    this.coU.uTime.value = el;
    this.coU.uRise.value = 0.15 + rise*0.95;

    // ---- he rises out of it ------------------------------------------
    // eases out: quick at first, feathering as he clears the plane
    const ez = 1 - Math.pow(1-rise, 2.4);
    const landedY = this.groundY + this.spriteH*0.5;
    const belowY = this.groundY - this.spriteH*0.55;     // fully under the circle
    this.sprite.position.set(0, belowY + ez*(landedY-belowY), 0);
    this.sprite.scale.set(1,1,1);

    this.sprU.uTime.value=el;
    this.sprU.uAlpha.value=sm(T,0.27,0.34)*(1-outro);
    this.sprU.uSeam.value = 1 - outT*0.82;
    this.sprU.uCoat.value = 1.8 - hold*1.15;
    this.sprU.uShade.value = sm(T,0.34,0.60);
    this.sprU.uRim.value = (0.30 + rise*0.45 + hold*0.20)*(1-outro);
    this.sprU.uArc.value = (0.35 + outT*0.55 + hold*0.35)*(1-outro);
    this.sprU.uCling.value = rise*(1-rise)*4.0*0.55 + (1-outT)*0.20;

    // recoil
    this._recoil=Math.max(0,this._recoil-dt*7.0);
    this.sprite.position.x-=this._recoil*0.045;
    this.sprite.rotation.z=-this._recoil*0.035;

    const gl=sm(T,0.66,0.70)*(1-sm(T,0.86,0.92));
    this.sprU.uGlint.value=gl;
    this.sprU.uGlintPos.value=-0.25+THREE.MathUtils.clamp((T-0.66)/0.17,0,1)*1.5;

    // ---- the breach band on the circle --------------------------------
    this.sgU.uAmt.value = (rise*(1-rise)*4.0*0.85 + col*0.25)*(1-outro);
    this.sgU.uTime.value = el;
    this.seam.scale.set(0.7 + rise*0.55, 1, 1);

    // ---- a ring lifts with him ----------------------------------------
    if(!F.rise && T>=0.29){
      F.rise=true; this.riser.visible=true; this._emitPulse();
      this._shake=0.35*this.shakeK;
      if(this.onRise) this.onRise();
    }
    if(this.riser.visible){
      const rp=THREE.MathUtils.clamp((T-0.29)/0.34,0,1);
      this.riMat.uniforms.uT.value=(1-Math.pow(rp,3.0))*draw;
      this.riMat.uniforms.uDraw.value=1;
      this.riMat.uniforms.uTime.value=el;
      this.riMat.uniforms.uPulse.value=this._circlePulse*0.5;
      this.riser.position.y=this.groundY+rp*1.9;
      this.riser.scale.set(1-rp*0.25,(1-rp*0.25)*0.24,1);
      if(rp>=1) this.riser.visible=false;
    }

    // ---- muzzle world position ----------------------------------------
    const w = this.spriteH*this.aspect, hh = this.spriteH;
    const mx = this.sprite.position.x + (this.muzzleUV.x-0.5)*w;
    const my = this.sprite.position.y + (this.muzzleUV.y-0.5)*hh;

    // ---- scheduled shots -----------------------------------------------
    for(let i=0;i<this.SHOTS.length;i++){
      const [st,ang,spread]=this.SHOTS[i];
      if(!F["s"+i] && T>=st){
        F["s"+i]=true;
        this._fire(mx,my,ang,spread, 1 + (Math.random()<0.35?1:0));
        this.mzMat.opacity=1;
        this._recoil=1;
        this._circlePulse=1;
        this.flashMat.opacity=Math.max(this.flashMat.opacity,0.14);
        this._shake=Math.max(this._shake,0.26*this.shakeK);
        this.mcirc.visible=true; this._mcT=0;
        if(this.onShot) this.onShot(i);
      }
    }
    this.muzzle.position.set(mx,my,3.4);
    this.muzzle.rotation.z=el*3.0;
    this.muzzle.scale.setScalar(0.7+this.mzMat.opacity*0.7);
    if(this.mzMat.opacity>0) this.mzMat.opacity=Math.max(0,this.mzMat.opacity-dt*9.0);

    if(this.mcirc.visible){
      this._mcT+=dt/0.34;
      this.mcMat.uniforms.uT.value=Math.min(1,this._mcT*2.2);
      this.mcMat.uniforms.uDraw.value=1;
      this.mcMat.uniforms.uTime.value=el;
      this.mcMat.uniforms.uPulse.value=Math.max(0,1-this._mcT*2.0);
      this.mcirc.position.set(mx+0.10,my,3.3);
      this.mcirc.scale.setScalar(0.6+this._mcT*0.5);
      if(this._mcT>=1) this.mcirc.visible=false;
    }

    this._circlePulse=Math.max(0,this._circlePulse-dt*4.0);
    this._updateBullets(dt, 1-outro);

    for(const r of this.pulses){
      if(!r.visible) continue;
      r.userData.p += dt/0.9;
      r.material.uniforms.uT.value=Math.min(r.userData.p,1);
      if(r.userData.p>=1) r.visible=false;
    }

    // ---- motes ---------------------------------------------------------
    {
      const pos=this.motes.geometry.attributes.position.array;
      for(let i=0;i<this.M;i++){
        pos[i*3+1]+=(0.05+0.05*Math.sin(this.mseed[i]))*dt;
        pos[i*3]  +=Math.sin(el*0.8+this.mseed[i])*0.05*dt;
        if(pos[i*3+1]>1.05){ pos[i*3+1]=-1.02; pos[i*3]=(Math.random()*2-1)*1.5; }
      }
      this.motes.geometry.attributes.position.needsUpdate=true;
      this.moteMat.opacity=(night*0.25+draw*0.45+hold*0.35)*(1-outro);
    }

    if(this.flashMat.opacity>0)
      this.flashMat.opacity=Math.max(0,this.flashMat.opacity-dt*3.0);

    this._shake=Math.max(0,this._shake-dt*2.5);
    this.camera.position.x=(Math.random()-0.5)*0.09*this._shake;
    this.camera.position.y=(Math.random()-0.5)*0.09*this._shake;

    this.renderer.render(this.scene,this.camera);

    if(this._t>=1){
      this._t=-1;
      cancelAnimationFrame(this._raf); this._raf=null;
      this.renderer.domElement.style.opacity="0";
      this.camera.position.set(0,0,15);
      this.renderer.clear();
      if(this.onComplete) this.onComplete();
    }

    function sm(v,e0,e1){
      const t=THREE.MathUtils.clamp((v-e0)/(e1-e0),0,1);
      return t*t*(3-2*t);
    }
  }

  _resize() {
    const a=innerWidth/innerHeight;
    this.renderer.setSize(innerWidth,innerHeight);
    this.camera.left=-a; this.camera.right=a;
    this.camera.updateProjectionMatrix();
    for(const m of [this.dim,this.flash]){
      m.geometry.dispose();
      m.geometry=new THREE.PlaneBufferGeometry(2*a,2);
    }
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize",this._onResize);
    this.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

const field = document.getElementById("field");
const shake = (px,ms) => field.animate(
  [{transform:"translate(0,0)"},
   {transform:`translate(${-px}px,${px*0.7}px)`},
   {transform:`translate(${px*0.8}px,${-px*0.55}px)`},
   {transform:"translate(0,0)"}],
  {duration:ms, easing:"ease-out"});

const fx = new CircleRiseVFX({
  src: JAY,
  onCircle(){ field.animate([{filter:"brightness(1)"},{filter:"brightness(0.48)"}],
    {duration:900, easing:"ease-out", fill:"forwards"}); },
  onRise(){ shake(6,340); },
  onShot(i){ shake(3,180); },
  onComplete(){ field.animate([{filter:"brightness(0.48)"},{filter:"brightness(1)"}],
    {duration:780, easing:"ease-out", fill:"forwards"}); }
});
// In-game the file loads inside an iframe over the battlefield — drop the preview
// backdrop there so the FIELD shows through. Standalone keeps it so you can see it.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Optional ?art=<url> overrides the card image (in-game passes the summoned unit's own card art).
try { const _a = new URLSearchParams(location.search).get('art'); if (_a) { const _c = document.getElementById('card'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } } catch (e) {}
document.addEventListener('click', () => fx.play());
fx.play();
</script>
