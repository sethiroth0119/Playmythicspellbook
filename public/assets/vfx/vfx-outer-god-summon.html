<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · OUTER GOD SUMMON</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — lets you SEE the transparency when you open this
     file directly. In-game (loaded in an iframe over the battlefield) it is
     removed so the FIELD shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change: transform, filter; }
    /* 👑 The unit's REAL card — the full framed ACE card PNG (frame + scene baked in).
     Displayed as-is; the VFX plays around it. In-game ?art can swap it. */
  #card { position:relative; z-index:200; height:78vh; max-height:680px;
    aspect-ratio: 1024 / 1536; background: center/contain no-repeat;
    background-image: url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/azathoth.png");
    filter: drop-shadow(0 26px 64px rgba(0,0,0,0.72)); }

  

  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px; z-index:200;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(4,4,6,0.94)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#1a0f06; background:#ffab53; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(255,171,83,0.4); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#9a8672; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#ffab53; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"><div id="card"></div></div>

<script src="three.min.js"></script>
<script>
/* =====================================================================
   OuterGodSummonVFX — sprite-driven summon sequence
   ---------------------------------------------------------------------
   Built around a single transparent PNG. The sprite is not just faded in:
     · polar-space noise displacement makes the tentacles writhe, anchored
       at the core so the centre stays stable
     · a burning-edge noise dissolve materialises it out of ember static
     · the glowing core and the eyes are isolated by luminance/hue keying
       and driven independently, so nothing had to be masked by hand
   Swap `src` for any transparent creature art and it all still works.

   const fx = new OuterGodSummonVFX({ src: '...' });
   fx.play();
   ===================================================================== */
class OuterGodSummonVFX {
  constructor(opts = {}) {
    this.src = opts.src;
    this.duration = opts.duration || 4.4;
    this.coreUV = opts.coreUV || { x: 0.50, y: 0.54 };   // where the burning core sits
    this.onRift = opts.onRift || null;
    this.onIgnite = opts.onIgnite || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 50;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    this._t = -1; this._rifted = false; this._ignited = false; this._raf = null;
    this._build();
  }

  _build() {
    const r = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position: "fixed", inset: "0", pointerEvents: "none",
      zIndex: String(this.zIndex), opacity: "0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -20, 20);
    this.camera.position.z = 10;

    this.NOISE = `
      float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
    `;

    this._buildDim(a);
    this._buildRift();
    this._buildCoreGlow();
    this._buildSprite();
    this._buildShock();
    this._buildEmbers();
    this._buildFlash(a);
    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  // ---- reality dims and the edges close in -----------------------------
  _buildDim(aspect) {
    this.dimU = { uAmt: { value: 0 } };
    this.dimMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: this.dimU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uAmt;
        void main(){
          float d = length(vUv - 0.5) * 1.42;
          float a = uAmt * (0.28 + 0.72 * smoothstep(0.15, 1.0, d));
          if (a < 0.004) discard;
          gl_FragColor = vec4(0.015, 0.012, 0.02, a);
        }`
    });
    this.dim = new THREE.Mesh(new THREE.PlaneBufferGeometry(2 * aspect, 2), this.dimMat);
    this.dim.position.z = -4;
    this.scene.add(this.dim);
  }

  // ---- the tear the thing comes through --------------------------------
  _buildRift() {
    this.riftU = { uT: { value: 0 }, uTime: { value: 0 } };
    this.riftMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: this.riftU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uT, uTime;
        ${this.NOISE}
        void main(){
          vec2 p = vUv - 0.5;
          float ang = atan(p.y, p.x);
          float d = length(p) * 2.0;

          // torn, non-circular aperture
          float wob = (fbm(vec2(ang * 2.6, uTime * 0.4)) - 0.5) * 0.30;
          float open = smoothstep(0.0, 0.30, uT) * (1.0 - smoothstep(0.72, 1.0, uT));
          float rad = (0.16 + open * 0.62) * (1.0 + wob);

          float voidM = smoothstep(rad, rad - 0.22, d);
          float ring  = smoothstep(0.10, 0.0, abs(d - rad));

          vec3 col = vec3(0.02, 0.01, 0.03) * voidM;
          // chromatic fringe on the tear itself
          col += vec3(1.00, 0.42, 0.08) * ring * 0.85;
          col += vec3(0.55, 0.18, 0.90) * smoothstep(0.16, 0.0, abs(d - rad * 1.06)) * 0.4;

          float a = clamp(voidM * 0.92 + ring, 0.0, 1.0) * open;
          if (a < 0.004) discard;
          gl_FragColor = vec4(col, a);
        }`
    });
    this.rift = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.6, 2.6), this.riftMat);
    this.rift.position.z = -3;
    this.scene.add(this.rift);
  }

  // ---- additive bloom sitting behind the burning core -------------------
  _buildCoreGlow() {
    this.glowU = { uAmt: { value: 0 }, uTime: { value: 0 } };
    this.glowMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: this.glowU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uAmt, uTime;
        ${this.NOISE}
        void main(){
          vec2 p = vUv - 0.5;
          float d = length(p) * 2.0;
          float ang = atan(p.y, p.x);

          float core = pow(smoothstep(0.62, 0.0, d), 2.4);
          // licking flame rays
          float rays = fbm(vec2(ang * 3.4, d * 4.0 - uTime * 1.6));
          rays = pow(smoothstep(0.42, 0.95, rays), 2.0) * smoothstep(0.75, 0.10, d);

          vec3 col = mix(vec3(1.0, 0.34, 0.03), vec3(1.0, 0.86, 0.55), pow(core, 1.6));
          float a = (core * 0.85 + rays * 0.45) * uAmt;
          if (a < 0.004) discard;
          gl_FragColor = vec4(col, a);
        }`
    });
    this.glow = new THREE.Mesh(new THREE.PlaneBufferGeometry(1.9, 1.9), this.glowMat);
    this.glow.position.z = -1;
    this.scene.add(this.glow);
  }

  // ---- the entity itself -------------------------------------------------
  _buildSprite() {
    const tex = new THREE.TextureLoader().load(this.src, () => { this._ready = true; });
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;

    this.sprU = {
      uMap:      { value: tex },
      uTime:     { value: 0 },
      uDissolve: { value: 0 },   // 0 hidden → 1 fully materialised
      uWrithe:   { value: 1 },   // tentacle displacement amplitude
      uSplit:    { value: 0 },   // radial rgb separation
      uCore:     { value: 0 },   // burning-core boost
      uEye:      { value: 0 },   // eye-glint boost
      uShade:    { value: 0 }    // 0 = pure silhouette, 1 = fully lit
    };

    this.sprMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: this.sprU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv;
        uniform sampler2D uMap;
        uniform float uTime, uDissolve, uWrithe, uSplit, uCore, uEye, uShade;
        ${this.NOISE}

        // polar-space displacement: tips writhe, core stays anchored
        vec2 writhe(vec2 uv, float amp){
          vec2 d = uv - 0.5;
          float r = length(d) * 2.0;
          float ang = atan(d.y, d.x);
          float fall = smoothstep(0.20, 0.98, r);
          float n1 = vnoise(vec2(ang * 2.3, r * 3.1 - uTime * 0.55));
          float n2 = vnoise(vec2(ang * 4.3 + 3.7, r * 5.2 + uTime * 0.44));
          float n3 = vnoise(vec2(ang * 7.9 - 1.4, r * 8.0 - uTime * 0.9));
          float dA = ((n1 - 0.5) * 0.155 + (n3 - 0.5) * 0.055) * amp * fall;
          float dR = ((n2 - 0.5) * 0.105) * amp * fall;
          float nr = r * (1.0 + dR);
          float na = ang + dA;
          return 0.5 + vec2(cos(na), sin(na)) * nr * 0.5;
        }

        void main(){
          vec2 uv = writhe(vUv, uWrithe);
          if (uv.x < -0.02 || uv.x > 1.02 || uv.y < -0.02 || uv.y > 1.02) discard;

          // radial chromatic separation
          vec2 dir = uv - 0.5;
          float dl = max(length(dir), 0.0001);
          dir /= dl;
          vec4 cr = texture2D(uMap, uv + dir * uSplit);
          vec4 cg = texture2D(uMap, uv);
          vec4 cb = texture2D(uMap, uv - dir * uSplit);
          vec3 tex = vec3(cr.r, cg.g, cb.b);
          float texA = max(cg.a, max(cr.a, cb.a));
          if (texA < 0.01) discard;

          float lum  = dot(tex, vec3(0.299, 0.587, 0.114));
          float warm = clamp((tex.r - tex.b) * 2.2, 0.0, 1.0);

          // ---- ember-static dissolve with a burning edge -----------------
          float dn = fbm(vUv * 5.5 + vec2(uTime * 0.06, -uTime * 0.11));
          float edge = 0.15;
          float th = (1.0 - uDissolve) * (1.0 + edge) - edge * 0.5;
          float m = smoothstep(th, th + edge, dn);
          float burn = m * (1.0 - m) * 4.0;

          // ---- shading ---------------------------------------------------
          vec3 col = tex * mix(0.14, 1.0, uShade);

          // burning core, keyed by luminance + warmth
          float core = smoothstep(0.40, 0.86, lum) * warm;
          col += (tex + vec3(1.0, 0.52, 0.10)) * core * uCore;

          // eyes: bright, green-yellow, not warm
          float eye = smoothstep(0.26, 0.62, lum)
                    * smoothstep(0.0, 0.22, tex.g - tex.b)
                    * (1.0 - warm);
          float flick = 0.55 + 0.45 * sin(uTime * 2.7 + vUv.x * 26.0 + vUv.y * 17.0);
          col += vec3(0.78, 0.98, 0.22) * eye * flick * uEye;

          // dissolve edge burns the same colour as the core
          col += vec3(1.0, 0.40, 0.05) * burn * 2.1;

          float a = texA * m;
          if (a < 0.004) discard;
          gl_FragColor = vec4(col, a);
        }`
    });

    this.sprite = new THREE.Mesh(new THREE.PlaneBufferGeometry(1, 1), this.sprMat);
    this.sprite.position.z = 0;
    this.scene.add(this.sprite);
  }

  // ---- ignition shockwave -------------------------------------------------
  _buildShock() {
    this.shockU = { uT: { value: 1 } };
    this.shockMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: this.shockU,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uT;
        void main(){
          float d = length(vUv - 0.5) * 2.0;
          float rad = uT * 1.05;
          float w = mix(0.055, 0.008, uT);
          float ring = smoothstep(w, 0.0, abs(d - rad));
          float a = ring * (1.0 - uT) * 1.5;
          if (a < 0.004) discard;
          vec3 col = mix(vec3(1.0, 0.95, 0.82), vec3(1.0, 0.42, 0.06), uT);
          gl_FragColor = vec4(col, a);
        }`
    });
    this.shock = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.4, 3.4), this.shockMat);
    this.shock.position.z = 1;
    this.shock.visible = false;
    this.scene.add(this.shock);
  }

  _buildEmbers() {
    this.N = 340;
    this.vel = new Float32Array(this.N * 3);
    this.seed = new Float32Array(this.N);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(this.N * 3), 3));

    const cv = document.createElement("canvas"); cv.width = cv.height = 64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32, 32, 1, 32, 32, 31);
    gr.addColorStop(0, "rgba(255,242,205,1)");
    gr.addColorStop(0.35, "rgba(255,150,40,0.55)");
    gr.addColorStop(1, "rgba(220,80,10,0)");
    c.fillStyle = gr; c.fillRect(0, 0, 64, 64);

    this.emberMat = new THREE.PointsMaterial({
      size: 0.022, map: new THREE.CanvasTexture(cv), transparent: true,
      opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending,
      sizeAttenuation: false
    });
    this.embers = new THREE.Points(g, this.emberMat);
    this.embers.position.z = 2;
    this.embers.visible = false;
    this.scene.add(this.embers);
  }

  _fireEmbers() {
    const pos = this.embers.geometry.attributes.position.array;
    for (let i = 0; i < this.N; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.pow(Math.random(), 0.7) * 0.35;
      pos[i*3]   = Math.cos(ang) * rad;
      pos[i*3+1] = Math.sin(ang) * rad;
      pos[i*3+2] = 0;
      const sp = 0.35 + Math.random() * 1.25;
      this.vel[i*3]   = Math.cos(ang) * sp;
      this.vel[i*3+1] = Math.sin(ang) * sp * 0.75 + 0.32;
      this.seed[i] = Math.random() * 6.28;
    }
    this.embers.geometry.attributes.position.needsUpdate = true;
    this.embers.visible = true;
    this.emberMat.opacity = 1;
  }

  _buildFlash(aspect) {
    this.flashMat = new THREE.MeshBasicMaterial({
      color: 0xffd9a0, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.flash = new THREE.Mesh(new THREE.PlaneBufferGeometry(2 * aspect, 2), this.flashMat);
    this.flash.position.z = 5;
    this.scene.add(this.flash);
  }

  // ---------------------------------------------------------------- control
  play() {
    this._rifted = false; this._ignited = false;
    this.embers.visible = false; this.emberMat.opacity = 0;
    this.shock.visible = false;
    this.flashMat.opacity = 0;
    if (this._t < 0) {
      this._t = 0;
      this.renderer.domElement.style.opacity = "1";
      this._clock = new THREE.Clock();
      this._loop();
    } else this._t = 0;
    return this;
  }

  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    const dt = Math.min(this._clock.getDelta(), 0.05);
    const el = this._clock.elapsedTime * (this.reduced ? 0.45 : 1);
    if (this._t < 0) return;

    this._t += dt / this.duration;
    const T = Math.min(this._t, 1);

    // ===================== timeline ====================================
    // 0.00–0.16  rift tears open
    // 0.12–0.34  emergence: silhouette, heavy writhe, chromatic split
    // 0.34–0.44  core ignition: shockwave, embers, flash
    // 0.44–0.80  manifest: slow ominous writhe, core pulse, eye glints
    // 0.80–1.00  recede back through the tear
    const riftT   = sm(T, 0.00, 0.18);
    const emerge  = sm(T, 0.12, 0.36);
    const ignite  = sm(T, 0.34, 0.44);
    const present = emerge * (1 - sm(T, 0.82, 0.99));
    const recede  = sm(T, 0.80, 1.00);

    this.riftU.uT.value = T; this.riftU.uTime.value = el;
    this.dimU.uAmt.value = (sm(T, 0.02, 0.22) * (1 - sm(T, 0.86, 1.0))) * 0.92;

    // ---- sprite -------------------------------------------------------
    const pulse = 0.5 + 0.5 * Math.sin(el * 2.3);
    const breathe = 1 + Math.sin(el * 1.15) * 0.012;
    const punch = 1 + (1 - Math.pow(1 - Math.min(1, ignite), 3)) * 0.06 * (1 - ignite);

    this.sprU.uTime.value = el;
    this.sprU.uDissolve.value = present;
    // writhe is violent on arrival, settles into a slow undulation, spikes on exit
    this.sprU.uWrithe.value = (1.9 - emerge * 1.25) + recede * 2.6 + pulse * 0.10;
    this.sprU.uSplit.value  = (1 - emerge) * 0.030 + recede * 0.045 + ignite * (1 - ignite) * 0.05;
    this.sprU.uShade.value  = sm(T, 0.26, 0.46);
    this.sprU.uCore.value   = ignite * (0.55 + pulse * 0.55) * (1 - recede);
    this.sprU.uEye.value    = sm(T, 0.40, 0.58) * (0.5 + pulse * 0.6) * (1 - recede);

    const scale = (0.30 + emerge * 1.28) * breathe * punch * (1 - recede * 0.30);
    this.sprite.scale.set(scale, scale, 1);
    this.sprite.rotation.z = Math.sin(el * 0.42) * 0.035 + recede * 0.18;
    this.sprite.position.y = -0.02 + Math.sin(el * 0.8) * 0.012;

    // rift and glow track the sprite's core
    const coreOffY = (this.coreUV.y - 0.5) * scale;
    this.rift.scale.setScalar(0.55 + emerge * 0.75);
    this.rift.position.y = coreOffY;
    this.glow.position.y = coreOffY;
    this.glow.scale.setScalar(scale * (0.42 + pulse * 0.10) * (0.5 + ignite * 0.9));
    this.glowU.uAmt.value = ignite * (0.55 + pulse * 0.45) * (1 - recede);
    this.glowU.uTime.value = el;

    // ---- ignition beats -------------------------------------------------
    if (!this._rifted && T >= 0.02) { this._rifted = true; if (this.onRift) this.onRift(); }
    if (!this._ignited && T >= 0.35) {
      this._ignited = true;
      this._fireEmbers();
      this.shock.visible = true;
      this.shockU.uT.value = 0;
      this.shock.position.y = coreOffY;
      this.flashMat.opacity = 0.55;
      if (this.onIgnite) this.onIgnite();
    }
    if (this.shock.visible) {
      this.shockU.uT.value += dt / 0.85;
      if (this.shockU.uT.value >= 1) this.shock.visible = false;
    }
    if (this.flashMat.opacity > 0) {
      this.flashMat.opacity = Math.max(0, this.flashMat.opacity - dt * 2.2);
    }

    // ---- embers ---------------------------------------------------------
    if (this.embers.visible) {
      const pos = this.embers.geometry.attributes.position.array;
      for (let i = 0; i < this.N; i++) {
        this.vel[i*3+1] += 0.20 * dt;                       // they rise, not fall
        this.vel[i*3]   *= (1 - 0.55 * dt);
        pos[i*3]   += (this.vel[i*3] + Math.sin(el * 1.9 + this.seed[i]) * 0.22) * dt;
        pos[i*3+1] += this.vel[i*3+1] * dt;
      }
      this.embers.geometry.attributes.position.needsUpdate = true;
      this.emberMat.opacity = (1 - sm(T, 0.42, 0.95)) * 0.95;
      if (this.emberMat.opacity <= 0.01) this.embers.visible = false;
    }

    this.renderer.render(this.scene, this.camera);

    if (this._t >= 1) {
      this._t = -1;
      cancelAnimationFrame(this._raf); this._raf = null;
      this.renderer.domElement.style.opacity = "0";
      this.renderer.clear();
      if (this.onComplete) this.onComplete();
    }

    function sm(v, e0, e1) {
      const t = THREE.MathUtils.clamp((v - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    }
  }

  _resize() {
    const a = innerWidth / innerHeight;
    this.renderer.setSize(innerWidth, innerHeight);
    this.camera.left = -a; this.camera.right = a;
    this.camera.updateProjectionMatrix();
    for (const m of [this.dim, this.flash]) {
      m.geometry.dispose();
      m.geometry = new THREE.PlaneBufferGeometry(2 * a, 2);
    }
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize", this._onResize);
    this.scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
