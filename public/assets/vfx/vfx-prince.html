<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · PRINCE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — lets you SEE the transparency when you open this
     file directly. In-game (loaded in an iframe over the battlefield) it is
     removed so the FIELD shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change: transform, filter; }
    /* 👑 The unit's REAL card — the full framed ACE card PNG (frame + scene baked in).
     Displayed as-is; the VFX plays around it. In-game ?art can swap it. */
  #card { position:relative; z-index:200; height:78vh; max-height:680px;
    aspect-ratio: 1024 / 1536; background: center/contain no-repeat;
    background-image: url("../Units/unit frames/New units/Mythic Spellbook units frames part 1/Prince Changer of Adams.png");
    filter: drop-shadow(0 26px 64px rgba(0,0,0,0.72)); }

  

  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px; z-index:200;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(6,3,3,0.94)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#1e0c05; background:#e8a44f; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(232,164,79,0.4); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#998172; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#e8a44f; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"><div id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   RiftSlashVFX — he cuts a realm open, then burns with a crimson aura
   ---------------------------------------------------------------------
   Beats: dark → his blade heats → a SLASH sweeps across the screen →
          the cut WIDENS INTO A RIFT with another realm behind it →
          wind and embers pour through → CRIMSON AURA ignites on him
   Notable work:
     · the slash, the rift and the spill all share ONE arc definition —
       a circle centre/radius plus an angular span. every effect works in
       (t along the arc, e across it) space, so the tear opens exactly
       along the path the blade travelled
     · the arc's start angle is solved from his actual sword tip, found
       by scanning the art, so the cut begins on the blade
     · the aura is dilated-alpha flame in crimson, licking off his real
       silhouette rather than a glow sprite behind him
     · nine pairs of DEMON EYES open in the dark behind him on staggered
       delays, each blinking and tracking on its own clock
   ===================================================================== */
class RiftSlashVFX {
  constructor(opts = {}) {
    this.src = opts.src;
    this.duration = opts.duration || 6.0;
    this.aspect = opts.spriteAspect || (1019 / 1282);
    this.tipUV = opts.tipUV || { x: 0.011, y: 0.086 };
    this.hiltUV = opts.hiltUV || { x: 0.310, y: 0.461 };
    this.groundY = opts.groundY != null ? opts.groundY : -0.80;
    this.onCharge = opts.onCharge || null;
    this.onSlash = opts.onSlash || null;
    this.onRift = opts.onRift || null;
    this.onAura = opts.onAura || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 60;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.shakeK = this.reduced ? 0.2 : 1;

    this.SLASH = 0.255;
    // the arc: solved so t=0 sits on his sword tip and it exits top-right
    this.ARC = { cx: 1.693, cy: -1.665, r: 2.572, a0: 2.736, a1: 1.350 };

    this._t = -1; this._raf = null; this._flags = {}; this._shake = 0;
    this._build();
  }

  // ================================================================ setup
  _build() {
    const r = new THREE.WebGLRenderer({ alpha:true, antialias:true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position:"fixed", inset:"0", pointerEvents:"none",
      zIndex:String(this.zIndex), opacity:"0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -30, 30);
    this.camera.position.z = 15;

    this.NOISE = `
      float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
    `;

    // every arc-based shader shares this preamble
    this.ARC_GLSL = `
      uniform float uAspect;
      uniform vec2  uC;
      uniform float uR, uA0, uA1;
      // returns false if the fragment is outside the arc's angular span
      bool arcCoords(vec2 uv, out float t, out float e, out float dist){
        vec2 p = vec2((uv.x-0.5)*uAspect, uv.y-0.5) - uC;
        dist = length(p);
        float ang = atan(p.y, p.x);
        t = (ang - uA0)/(uA1 - uA0);
        e = dist - uR;
        return (t >= -0.02 && t <= 1.02);
      }
    `;

    this._buildDim(a);
    this._buildRealmSpill(a);
    this._buildRift(a);
    this._buildSlash(a);
    this._buildDemonEyes();
    this._buildAuraGlow();
    this._buildSprite();
    this._buildBladeGlow();
    this._buildAuraRing();
    this._buildEmbers();
    this._buildWisps();
    this._buildFlash(a);

    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  _fullQuad(aspect, mat, z) {
    const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(2*aspect, 2), mat);
    m.position.z = z; this.scene.add(m); return m;
  }

  _arcUniforms(aspect, extra) {
    const A = this.ARC;
    return Object.assign({
      uAspect:{value:aspect},
      uC:{value:new THREE.Vector2(A.cx, A.cy)},
      uR:{value:A.r}, uA0:{value:A.a0}, uA1:{value:A.a1},
      uTime:{value:0}
    }, extra||{});
  }

  _buildDim(aspect) {
    this.dimU = { uAmt:{value:0} };
    this.dimMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.dimU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`varying vec2 vUv; uniform float uAmt;
        void main(){
          float d=length(vUv-0.5)*1.42;
          float a=uAmt*(0.32+0.68*smoothstep(0.05,1.0,d));
          if(a<0.004) discard;
          gl_FragColor=vec4(0.018,0.008,0.006,a);
        }`
    });
    this.dim = this._fullQuad(aspect, this.dimMat, -9);
  }

  // ---- light spilling out of the cut into the room -----------------------
  _buildRealmSpill(aspect) {
    this.spU = this._arcUniforms(aspect, { uAmt:{value:0}, uOpen:{value:0} });
    this.spMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.spU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform float uAmt,uOpen;
        ${this.ARC_GLSL}
        ${this.NOISE}
        void main(){
          float t,e,d;
          if(!arcCoords(vUv,t,e,d)) discard;
          float w = uOpen*0.30*pow(max(sin(clamp(t,0.0,1.0)*3.14159),0.0),0.6);
          if(w<=0.001) discard;
          float g = smoothstep(w*5.5, 0.0, abs(e));
          float n = 0.75 + 0.25*fbm(vec2(t*7.0 - uTime*0.5, e*4.0));
          float a = g*n*uAmt*0.55;
          if(a<0.004) discard;
          gl_FragColor = vec4(mix(vec3(0.85,0.22,0.05), vec3(1.0,0.76,0.42), g), a);
        }`
    });
    this.spill = this._fullQuad(aspect, this.spMat, -6);
  }

  // ---- the rift: another realm seen through the cut ------------------------
  _buildRift(aspect) {
    this.rfU = this._arcUniforms(aspect, { uOpen:{value:0}, uAmt:{value:0} });
    this.rfMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.rfU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform float uOpen,uAmt;
        ${this.ARC_GLSL}
        ${this.NOISE}
        void main(){
          float t,e,d;
          if(!arcCoords(vUv,t,e,d)) discard;
          float tc = clamp(t,0.0,1.0);

          // the lens: widest at mid-arc, pinched to nothing at both ends,
          // with a torn edge
          float torn = (fbm(vec2(t*9.0, uTime*0.5))-0.5)*0.35;
          float w = uOpen*0.30*pow(max(sin(tc*3.14159),0.0),0.62)*(1.0+torn);
          if(w<=0.001) discard;

          float ee = abs(e)/max(w,0.0001);
          if(ee > 1.0) discard;

          // ---- what lies on the other side --------------------------
          vec2 rp = vec2(tc*4.2 - uTime*0.22, (e/max(w,0.0001))*1.5);
          vec2 q = vec2(fbm(rp*1.5), fbm(rp*1.5+vec2(3.1,1.7)));
          float n = fbm(rp*2.1 + 2.3*q + vec2(uTime*0.10,0.0));
          vec3 col = mix(vec3(0.05,0.008,0.015), vec3(0.86,0.26,0.05), pow(n,1.25));
          col = mix(col, vec3(1.0,0.84,0.46), pow(n,4.2));
          // a distant sun burning down the spine of the tear
          col += vec3(1.0,0.72,0.36)*pow(1.0-ee,7.0)*1.5;

          // ---- the torn edge itself ---------------------------------
          float edge = smoothstep(0.72,1.0,ee);
          col = mix(col, vec3(1.0,0.94,0.78), edge*0.9);

          float a = (1.0 - smoothstep(0.94,1.0,ee))*uAmt;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
    this.rift = this._fullQuad(aspect, this.rfMat, -5);
  }

  // ---- the blade trail ------------------------------------------------------
  _buildSlash(aspect) {
    this.slU = this._arcUniforms(aspect, { uProg:{value:0}, uAmt:{value:0}, uW:{value:0.055} });
    this.slMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.slU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform float uProg,uAmt,uW;
        ${this.ARC_GLSL}
        ${this.NOISE}
        void main(){
          float t,e,d;
          if(!arcCoords(vUv,t,e,d)) discard;
          float tc = clamp(t,0.0,1.0);

          // the trail is drawn behind the leading edge and thins as it ages
          float head = smoothstep(uProg, uProg-0.015, tc);
          float age  = clamp((uProg - tc)/0.55, 0.0, 1.0);
          if(head<=0.001) discard;

          float w = uW*pow(max(sin(tc*3.14159),0.0),0.45)*(1.0-age*0.55);
          float band = smoothstep(w, 0.0, abs(e));
          float core = smoothstep(w*0.24, 0.0, abs(e));

          float n = 0.7+0.3*fbm(vec2(t*14.0, e*22.0 - uTime*2.0));
          float amt = (band*0.75 + core*1.6)*n*head*(1.0-age*0.85);

          vec3 col = mix(vec3(1.0,0.20,0.03), vec3(1.0,0.95,0.82), core);
          float a = amt*uAmt;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
    this.slash = this._fullQuad(aspect, this.slMat, 4);
  }


  // ---- demon eyes watching from the other side --------------------------
  _buildDemonEyes() {
    // one quad draws one PAIR of eyes. the almond lid is the same curve as a
    // real eye, and the iris is sized in WORLD units so it stays circular in
    // a wide quad — it is deliberately taller than the opening, so the lid
    // crops it and you only ever see a burning band. that reads as a slit.
    const mkMat = () => new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:{ uOpen:{value:0}, uAmt:{value:0}, uTime:{value:0},
                 uLook:{value:0}, uSeed:{value:Math.random()*10} },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform float uOpen,uAmt,uTime,uLook,uSeed;
        ${this.NOISE}
        void main(){
          vec2 uv = (vUv-0.5)*2.0;
          vec3 col = vec3(0.0);
          float a = 0.0;

          for(int i=0;i<2;i++){
            float sgn = (i==0) ? -1.0 : 1.0;
            // local frame for this eye: x spans the eye, y spans its height
            vec2 p = vec2((uv.x - sgn*0.50)/0.42, uv.y/0.30);
            if (abs(p.x) > 1.35) continue;

            // eyelid: an almond that opens
            float lid = uOpen*pow(max(0.0,1.0-clamp(p.x*p.x,0.0,1.0)),0.52);
            float ins = smoothstep(0.0,0.10, lid-abs(p.y));
            if(ins<=0.001) continue;

            // iris, circular in world units (the eye is wide and short)
            vec2 q = vec2(p.x - uLook*0.26, p.y*0.2435);
            float d = length(q);
            float glow = pow(smoothstep(1.05,0.0,d),1.5);

            // vertical slit pupil
            float slit = smoothstep(0.13,0.01,abs(q.x))*smoothstep(0.85,0.10,d);

            float flick = 0.80 + 0.20*fbm(vec2(uSeed*3.0, uTime*2.6));
            vec3 c = mix(vec3(0.72,0.02,0.005), vec3(1.0,0.38,0.10), glow);
            c += vec3(1.0,0.86,0.58)*pow(glow,4.5)*1.1;
            c *= (1.0 - slit*0.94)*flick;

            col += c*ins;
            a = max(a, ins*(0.30+glow*0.80));
          }

          // a dull red bloom hanging around the pair
          float halo = pow(smoothstep(1.6,0.0,length(uv*vec2(0.8,1.9))),2.4);
          col += vec3(0.55,0.04,0.01)*halo*uOpen*0.55;
          a = max(a, halo*uOpen*0.30);

          a *= uAmt;
          if(a<0.005) discard;
          gl_FragColor = vec4(col, clamp(a,0.0,1.0));
        }`
    });

    //  x,     y,     scale,  z,     delay
    const layout = [
      [-1.12,  0.50, 0.34, -7.4, 0.00],
      [ 1.06,  0.34, 0.30, -7.2, 0.12],
      [-0.66,  0.88, 0.22, -7.0, 0.22],
      [ 0.72,  0.82, 0.24, -6.8, 0.07],
      [-1.34, -0.14, 0.26, -6.6, 0.29],
      [ 1.28, -0.08, 0.31, -6.4, 0.16],
      [-0.40, -0.46, 0.19, -6.2, 0.36],
      [ 0.46, -0.54, 0.20, -6.0, 0.26],
      [ 0.02,  1.05, 0.38, -5.8, 0.41]
    ];

    this.eyes = [];
    for (const [x,y,s,z,delay] of layout) {
      const mat = mkMat();
      const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.2*s, 0.78*s), mat);
      m.position.set(x,y,z);
      m.rotation.z = (Math.random()-0.5)*0.18;
      this.scene.add(m);
      this.eyes.push({
        mesh:m, mat, delay,
        blinkT: 1.5 + Math.random()*4.0,
        blinking: 0,
        seed: Math.random()*6.28,
        drift: 0.4 + Math.random()*0.5
      });
    }
  }

  _resetDemonEyes() {
    for (const e of this.eyes) {
      e.blinkT = 1.5 + Math.random()*4.0;
      e.blinking = 0;
      e.mat.uniforms.uOpen.value = 0;
      e.mat.uniforms.uAmt.value = 0;
    }
  }

  _updateDemonEyes(dt, el, amt, T) {
    for (const e of this.eyes) {
      // each pair opens on its own delay once the rift is torn
      const local = THREE.MathUtils.clamp((T - (0.29 + e.delay*0.30))/0.10, 0, 1);
      let open = local*local*(3-2*local);

      // blinks
      e.blinkT -= dt;
      if (e.blinkT <= 0 && e.blinking === 0) {
        e.blinking = 0.0001;
        e.blinkT = 2.2 + Math.random()*4.5;
      }
      if (e.blinking > 0) {
        e.blinking += dt;
        if (e.blinking > 0.17) e.blinking = 0;
      }
      if (e.blinking > 0) {
        open *= 1 - Math.sin(Math.min(e.blinking/0.17,1)*Math.PI);
      }

      e.mat.uniforms.uOpen.value = open;
      e.mat.uniforms.uAmt.value = amt;
      e.mat.uniforms.uTime.value = el;
      e.mat.uniforms.uLook.value = Math.sin(el*e.drift + e.seed)*0.45;
      // they lean in slightly as the aura builds
      const s = 1 + amt*0.06;
      e.mesh.scale.set(s, s, 1);
    }
  }

  // ---- crimson glow behind him ------------------------------------------------
  _buildAuraGlow() {
    this.agU = { uAmt:{value:0}, uTime:{value:0} };
    this.agMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.agU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        ${this.NOISE}
        void main(){
          vec2 p=(vUv-0.5)*2.0;
          float d=length(p*vec2(1.25,0.85));
          float ang=atan(p.y,p.x);
          float g=pow(smoothstep(1.0,0.0,d),2.2);
          float lick=fbm(vec2(ang*3.0, d*3.5 - uTime*1.8));
          g += pow(smoothstep(0.5,1.0,lick),2.5)*smoothstep(1.0,0.15,d)*0.55;
          float pulse=0.82+0.18*sin(uTime*2.6);
          float a=g*uAmt*pulse;
          if(a<0.004) discard;
          gl_FragColor=vec4(mix(vec3(0.85,0.07,0.02),vec3(1.0,0.55,0.22),g),a);
        }`
    });
    this.auraGlow = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.6,2.6), this.agMat);
    this.auraGlow.position.set(0,this.groundY+0.85,-3);
    this.scene.add(this.auraGlow);
  }

  // ---- him ---------------------------------------------------------------------
  _buildSprite() {
    const tex = new THREE.TextureLoader().load(this.src);
    tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;

    this.sprU = {
      uMap:{value:tex}, uTime:{value:0},
      uCloak:{value:0}, uShade:{value:0}, uRim:{value:0},
      uAura:{value:0},      // crimson flame off his silhouette
      uBlade:{value:0},     // the sword heating up
      uGlint:{value:0}, uGlintPos:{value:-0.25},
      uAlpha:{value:0},
      uTip:{value:new THREE.Vector2(this.tipUV.x,this.tipUV.y)},
      uHilt:{value:new THREE.Vector2(this.hiltUV.x,this.hiltUV.y)}
    };

    this.sprMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.sprU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform sampler2D uMap;
        uniform float uTime,uCloak,uShade,uRim,uAura,uBlade,uGlint,uGlintPos,uAlpha;
        uniform vec2 uTip,uHilt;
        ${this.NOISE}

        // distance from a point to the blade segment, in uv space
        float segDist(vec2 p, vec2 a, vec2 b){
          vec2 ab=b-a, ap=p-a;
          float h=clamp(dot(ap,ab)/dot(ab,ab),0.0,1.0);
          return length(ap-ab*h);
        }

        void main(){
          // the cloak is huge and ragged — it flies in the realm-wind. his
          // face, armour plates and sword arm stay rigid.
          vec2 uv = vUv;
          float outer = smoothstep(0.20,0.50,abs(vUv.x-0.50));
          float lower = smoothstep(0.78,0.10,vUv.y);
          float w = outer*lower*uCloak;
          uv.x += sin(vUv.y*6.5 - uTime*1.9 + vUv.x*3.0)*0.020*w;
          uv.y += sin(vUv.x*9.0 + uTime*1.4)*0.008*w;

          vec4 base = texture2D(uMap, uv);
          float texA = base.a;
          if(texA<0.008) discard;
          vec3 tex = base.rgb;
          float lum = dot(tex,vec3(0.299,0.587,0.114));

          vec3 col = tex*mix(0.09,1.0,uShade);

          // ---- the blade heats along its length ---------------------
          float bd = segDist(vUv, uTip, uHilt);
          float blade = smoothstep(0.055,0.0,bd)*smoothstep(0.05,0.35,lum+0.25);
          float heat = 0.65+0.35*fbm(vec2(vUv.x*20.0, vUv.y*20.0 - uTime*3.4));
          col += mix(vec3(1.0,0.16,0.02), vec3(1.0,0.90,0.62), pow(uBlade,1.6))
               * blade*uBlade*heat*3.0;

          // ---- CRIMSON AURA licking off his silhouette ---------------
          float dil=0.0;
          for(int i=1;i<=6;i++){
            float s=float(i)/6.0;
            float wob=sin(float(i)*2.4+uTime*3.0)*0.011;
            dil=max(dil, texture2D(uMap, uv - vec2(wob, s*0.052)).a);
          }
          float aura = clamp(dil-texA,0.0,1.0);
          float fl = fbm(vec2(uv.x*10.0, uv.y*4.4 - uTime*2.7));
          float flame = smoothstep(0.42,0.92, fl)*aura*uAura;
          col += mix(vec3(1.0,0.10,0.02), vec3(1.0,0.66,0.30), pow(flame,1.8))*flame*2.8;

          // ---- gold armour glint --------------------------------------
          float gold = smoothstep(0.16,0.58,lum)
                     * smoothstep(0.04,0.22, tex.r-tex.b)
                     * smoothstep(0.28,0.06, tex.r-tex.g);
          float sweep = exp(-pow((vUv.y-uGlintPos)*6.0,2.0));
          col += vec3(1.0,0.86,0.44)*gold*sweep*uGlint*2.5;

          // ---- rim lit by the rift ------------------------------------
          if(uRim>0.001){
            float px=0.0055;
            float aL=texture2D(uMap,uv-vec2(px,0.0)).a;
            float aR=texture2D(uMap,uv+vec2(px,0.0)).a;
            float aD=texture2D(uMap,uv-vec2(0.0,px)).a;
            float aU=texture2D(uMap,uv+vec2(0.0,px)).a;
            float edge=clamp(texA-min(min(aL,aR),min(aD,aU)),0.0,1.0);
            col += vec3(1.0,0.44,0.16)*edge*uRim*3.1;
          }

          float a = max(texA, flame*0.82)*uAlpha;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });

    const h=1.72, w=h*this.aspect;
    this.spriteH=h;
    this.sprite=new THREE.Mesh(new THREE.PlaneBufferGeometry(w,h), this.sprMat);
    this.sprite.position.set(0,this.groundY+h*0.5,0);
    this.scene.add(this.sprite);
  }

  // ---- additive bloom running along the blade ------------------------------------
  _buildBladeGlow() {
    const cv=document.createElement("canvas"); cv.width=256; cv.height=64;
    const c=cv.getContext("2d");
    const g=c.createLinearGradient(0,0,256,0);
    g.addColorStop(0,"rgba(255,120,30,0)");
    g.addColorStop(0.25,"rgba(255,90,20,0.55)");
    g.addColorStop(0.75,"rgba(255,190,90,0.85)");
    g.addColorStop(1,"rgba(255,120,30,0)");
    c.fillStyle=g;
    for(let x=0;x<256;x++){
      const t=Math.sin(x/255*Math.PI);
      const hh=Math.max(2, t*26);
      c.fillRect(x,32-hh/2,1,hh);
    }
    this.bgMat=new THREE.MeshBasicMaterial({
      map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    const h=this.spriteH, w=h*this.aspect;
    const dx=(this.hiltUV.x-this.tipUV.x)*w, dy=(this.hiltUV.y-this.tipUV.y)*h;
    const len=Math.hypot(dx,dy), ang=Math.atan2(dy,dx);
    const mx=((this.tipUV.x+this.hiltUV.x)*0.5-0.5)*w;
    const my=((this.tipUV.y+this.hiltUV.y)*0.5-0.5)*h;
    this.bladeGlow=new THREE.Mesh(new THREE.PlaneBufferGeometry(len*1.06,0.17), this.bgMat);
    this.bladeGlow.position.set(mx, this.groundY+h*0.5+my, 1.2);
    this.bladeGlow.rotation.z=ang;
    this.scene.add(this.bladeGlow);
  }

  // ---- aura ring on the ground ----------------------------------------------------
  _buildAuraRing() {
    this.arU = { uAmt:{value:0}, uTime:{value:0} };
    this.arMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.arU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        ${this.NOISE}
        void main(){
          vec2 p=(vUv-0.5)*2.0;
          float d=length(p);
          float ang=atan(p.y,p.x);
          float n=fbm(vec2(ang*3.5, d*3.0 - uTime*1.2));
          float ring=smoothstep(0.16,0.0,abs(d-0.80))*(0.5+n);
          float pool=pow(smoothstep(1.0,0.0,d),2.2)*0.55;
          float a=(ring*0.9+pool)*uAmt;
          if(a<0.004) discard;
          gl_FragColor=vec4(mix(vec3(0.90,0.09,0.02),vec3(1.0,0.62,0.26),ring),a);
        }`
    });
    this.auraRing = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.8,2.8), this.arMat);
    this.auraRing.position.set(0,this.groundY,-2);
    this.auraRing.scale.set(1,0.26,1);
    this.scene.add(this.auraRing);
  }

  // ---- embers pouring out of the rift ---------------------------------------------
  _buildEmbers() {
    this.N=380;
    this.vel=new Float32Array(this.N*3);
    this.seed=new Float32Array(this.N);
    const g=new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(this.N*3),3));
    const cv=document.createElement("canvas"); cv.width=cv.height=64;
    const c=cv.getContext("2d");
    const gr=c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(255,240,205,1)");
    gr.addColorStop(0.35,"rgba(255,120,30,0.55)");
    gr.addColorStop(1,"rgba(210,40,5,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.embMat=new THREE.PointsMaterial({
      size:0.018, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.embers=new THREE.Points(g,this.embMat);
    this.embers.position.z=2.0;
    this.scene.add(this.embers);
    this._seedEmbers();
  }

  // spawn embers ON the arc so they look like they came through the tear
  _seedEmbers() {
    const A=this.ARC;
    const pos=this.embers.geometry.attributes.position.array;
    for(let i=0;i<this.N;i++){
      const t=Math.random();
      const ang=A.a0 + (A.a1-A.a0)*t;
      const rr=A.r + (Math.random()*2-1)*0.16*Math.sin(t*Math.PI);
      pos[i*3]   = A.cx + Math.cos(ang)*rr;
      pos[i*3+1] = A.cy + Math.sin(ang)*rr;
      pos[i*3+2] = 0;
      // pushed outward from the tear, then they rise
      const nx=Math.cos(ang), ny=Math.sin(ang);
      const s=(Math.random()<0.5?-1:1);
      this.vel[i*3]   = nx*s*(0.15+Math.random()*0.5);
      this.vel[i*3+1] = ny*s*(0.15+Math.random()*0.5) + 0.15;
      this.seed[i]=Math.random()*6.28;
    }
    this.embers.geometry.attributes.position.needsUpdate=true;
  }

  // ---- aura wisps rising off him --------------------------------------------------
  _buildWisps() {
    this.M=200;
    this.wseed=new Float32Array(this.M);
    const g=new THREE.BufferGeometry();
    const arr=new Float32Array(this.M*3);
    for(let i=0;i<this.M;i++){
      arr[i*3]=(Math.random()*2-1)*0.55;
      arr[i*3+1]=this.groundY+Math.random()*1.7;
      this.wseed[i]=Math.random()*6.28;
    }
    g.setAttribute("position", new THREE.BufferAttribute(arr,3));
    const cv=document.createElement("canvas"); cv.width=cv.height=64;
    const c=cv.getContext("2d");
    const gr=c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(255,220,190,1)");
    gr.addColorStop(0.35,"rgba(255,60,20,0.5)");
    gr.addColorStop(1,"rgba(190,20,5,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.wispMat=new THREE.PointsMaterial({
      size:0.016, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.wisps=new THREE.Points(g,this.wispMat);
    this.wisps.position.z=1.6;
    this.scene.add(this.wisps);
  }

  _buildFlash(aspect) {
    this.flashMat=new THREE.MeshBasicMaterial({
      color:0xffd9b0, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    this.flash=this._fullQuad(aspect,this.flashMat,8);
  }

  // ============================================================== control
  play() {
    this._flags={}; this._shake=0;
    this._seedEmbers();
    this._resetDemonEyes();
    this.flashMat.opacity=0; this.bgMat.opacity=0;
    if(this._t<0){
      this._t=0;
      this.renderer.domElement.style.opacity="1";
      this._clock=new THREE.Clock();
      this._loop();
    } else this._t=0;
    return this;
  }

  _loop() {
    this._raf=requestAnimationFrame(()=>this._loop());
    const dt=Math.min(this._clock.getDelta(),0.05);
    const el=this._clock.elapsedTime;
    if(this._t<0) return;

    this._t+=dt/this.duration;
    const T=Math.min(this._t,1);
    const F=this._flags;
    const S=this.SLASH;

    // ================== timeline ====================================
    // 0.00–0.12  dark; he stands in silhouette
    // 0.10–0.25  his blade heats to white
    // 0.255      THE SLICE — the trail rips across the screen
    // 0.28–0.50  the cut widens into a rift onto another realm
    // 0.46–0.70  wind and embers pour through
    // 0.56–0.86  CRIMSON AURA ignites around him
    // 0.88–1.00  hold and fade
    const dark   = sm(T,0.00,0.12);
    const charge = sm(T,0.10,S);
    const cut    = sm(T,S,S+0.035);
    const open   = sm(T,S+0.02,0.50);
    const pour   = sm(T,0.46,0.70);
    const aura   = sm(T,0.56,0.78);
    const outro  = sm(T,0.90,1.00);

    this.dimU.uAmt.value = sm(T,0.01,0.12)*(1-outro)*0.94;

    // ---- blade charge ----------------------------------------------
    this.sprU.uBlade.value = (charge*0.9 + cut*0.6)*(1 - sm(T,0.44,0.62))*(1-outro);
    this.bgMat.opacity = (charge*0.75 + cut*0.5)*(1 - sm(T,0.42,0.60));
    this.bladeGlow.scale.set(1, 0.8 + charge*0.6, 1);
    if(!F.charge && T>=0.11){ F.charge=true; if(this.onCharge) this.onCharge(); }

    // ---- the slash: the trail's head races along the arc -------------
    const prog = THREE.MathUtils.clamp((T - S)/0.075, 0, 1.35);
    this.slU.uProg.value = prog;
    this.slU.uTime.value = el;
    this.slU.uAmt.value = (T >= S ? 1 : 0) * (1 - sm(T,S+0.16,S+0.34))*(1-outro);
    if(!F.slash && T>=S){
      F.slash=true;
      this.flashMat.opacity=0.9;
      this._shake=1.2*this.shakeK;
      if(this.onSlash) this.onSlash();
    }

    // ---- the rift widens along the same arc ---------------------------
    this.rfU.uOpen.value = open;
    this.rfU.uAmt.value = open*(1 - sm(T,0.92,1.0));
    this.rfU.uTime.value = el;
    this.spU.uOpen.value = open;
    this.spU.uAmt.value = open*(1 - sm(T,0.92,1.0));
    this.spU.uTime.value = el;
    if(!F.rift && T>=S+0.05){ F.rift=true; if(this.onRift) this.onRift(); }

    // ---- demon eyes: they open once the rift is torn and burn
    //      brightest while his aura is up
    this._updateDemonEyes(dt, el, (open*0.75 + aura*0.35)*(1-outro), T);

    // ---- him -----------------------------------------------------------
    this.sprU.uTime.value=el;
    this.sprU.uAlpha.value=sm(T,0.02,0.10)*(1-outro);
    this.sprU.uShade.value=sm(T,0.14,0.42);
    this.sprU.uCloak.value=0.55 + pour*1.15;      // the realm-wind takes the cloak
    this.sprU.uRim.value=(open*0.65 + aura*0.35)*(1-outro);
    this.sprU.uAura.value=aura*1.0*(1-outro*0.5);
    this.sprite.position.y = this.groundY + this.spriteH*0.5 + aura*0.012*Math.sin(el*2.4);

    const gl=sm(T,0.62,0.66)*(1-sm(T,0.84,0.90));
    this.sprU.uGlint.value=gl;
    this.sprU.uGlintPos.value=-0.25+THREE.MathUtils.clamp((T-0.62)/0.17,0,1)*1.5;

    if(!F.aura && T>=0.57){
      F.aura=true;
      this._shake=Math.max(this._shake,0.55*this.shakeK);
      this.flashMat.opacity=Math.max(this.flashMat.opacity,0.28);
      if(this.onAura) this.onAura();
    }

    this.agU.uAmt.value = aura*0.55*(1-outro);
    this.agU.uTime.value = el;
    this.auraGlow.scale.setScalar(0.85 + aura*0.30);
    this.arU.uAmt.value = aura*0.75*(1-outro);
    this.arU.uTime.value = el;
    this.auraRing.scale.set(1+aura*0.10,(1+aura*0.10)*0.26,1);

    // ---- embers through the tear ---------------------------------------
    {
      const pos=this.embers.geometry.attributes.position.array;
      for(let i=0;i<this.N;i++){
        this.vel[i*3+1]+=0.16*dt;
        this.vel[i*3]  *=(1-0.5*dt);
        pos[i*3]   += (this.vel[i*3] + Math.sin(el*1.9+this.seed[i])*0.20)*dt;
        pos[i*3+1] += this.vel[i*3+1]*dt;
        if(pos[i*3+1]>1.15) pos[i*3+1]=-1.15;
      }
      this.embers.geometry.attributes.position.needsUpdate=true;
      this.embMat.opacity=(open*0.5+pour*0.5)*(1-outro);
    }

    // ---- aura wisps rising off him ---------------------------------------
    {
      const pos=this.wisps.geometry.attributes.position.array;
      for(let i=0;i<this.M;i++){
        pos[i*3+1]+=(0.30+0.30*Math.sin(this.wseed[i]))*dt;
        pos[i*3]  +=Math.sin(el*2.2+this.wseed[i])*0.10*dt;
        if(pos[i*3+1]>this.groundY+1.95){
          pos[i*3+1]=this.groundY-0.05;
          pos[i*3]=(Math.random()*2-1)*0.55;
        }
      }
      this.wisps.geometry.attributes.position.needsUpdate=true;
      this.wispMat.opacity=aura*0.85*(1-outro);
    }

    if(this.flashMat.opacity>0)
      this.flashMat.opacity=Math.max(0,this.flashMat.opacity-dt*3.2);

    this._shake=Math.max(0,this._shake-dt*2.6);
    this.camera.position.x=(Math.random()-0.5)*0.12*this._shake;
    this.camera.position.y=(Math.random()-0.5)*0.12*this._shake;

    this.renderer.render(this.scene,this.camera);

    if(this._t>=1){
      this._t=-1;
      cancelAnimationFrame(this._raf); this._raf=null;
      this.renderer.domElement.style.opacity="0";
      this.camera.position.set(0,0,15);
      this.renderer.clear();
      if(this.onComplete) this.onComplete();
    }

    function sm(v,e0,e1){
      const t=THREE.MathUtils.clamp((v-e0)/(e1-e0),0,1);
      return t*t*(3-2*t);
    }
  }

  _resize() {
    const a=innerWidth/innerHeight;
    this.renderer.setSize(innerWidth,innerHeight);
    this.camera.left=-a; this.camera.right=a;
    this.camera.updateProjectionMatrix();
    for(const m of [this.dim,this.spill,this.rift,this.slash,this.flash]){
      m.geometry.dispose();
      m.geometry=new THREE.PlaneBufferGeometry(2*a,2);
    }
    for(const u of [this.spU,this.rfU,this.slU]) u.uAspect.value=a;
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize",this._onResize);
    this.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

const field = document.getElementById("field");
const shake = (px,ms) => field.animate(
  [{transform:"translate(0,0)"},
   {transform:`translate(${-px}px,${px*0.7}px)`},
   {transform:`translate(${px*0.8}px,${-px*0.55}px)`},
   {transform:`translate(${-px*0.35}px,${px*0.25}px)`},
   {transform:"translate(0,0)"}],
  {duration:ms, easing:"ease-out"});

const fx = new RiftSlashVFX({
  src: PRINCE,
  onCharge(){ field.animate([{filter:"brightness(1)"},{filter:"brightness(0.45)"}],
    {duration:800, easing:"ease-out", fill:"forwards"}); },
  onSlash(){ shake(19,600); },
  onRift(){ field.animate(
    [{filter:"brightness(0.45)"},{filter:"brightness(0.75) saturate(1.2)"}],
    {duration:900, easing:"ease-out", fill:"forwards"}); },
  onAura(){ shake(8,380); },
  onComplete(){ field.animate([{filter:"brightness(0.75)"},{filter:"brightness(1)"}],
    {duration:800, easing:"ease-out", fill:"forwards"}); }
});
// In-game the file loads inside an iframe over the battlefield — drop the preview
// backdrop there so the FIELD shows through. Standalone keeps it so you can see it.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Optional ?art=<url> overrides the card image (in-game passes the summoned unit's own card art).
try { const _a = new URLSearchParams(location.search).get('art'); if (_a) { const _c = document.getElementById('card'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } } catch (e) {}
document.addEventListener('click', () => fx.play());
fx.play();
</script>
