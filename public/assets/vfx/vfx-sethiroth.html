<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · SETHIROTH</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — lets you SEE the transparency when you open this
     file directly. In-game (loaded in an iframe over the battlefield) it is
     removed so the FIELD shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change: transform, filter; }
    /* 👑 The unit's REAL card — the full framed ACE card PNG (frame + scene baked in).
     Displayed as-is; the VFX plays around it. In-game ?art can swap it. */
  #card { position:relative; z-index:200; height:78vh; max-height:680px;
    aspect-ratio: 1024 / 1536; background: center/contain no-repeat;
    background-image: url("../Units/unit frames/Sethiroth The First Abra User.png");
    filter: drop-shadow(0 26px 64px rgba(0,0,0,0.72)); }

  

  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px; z-index:200;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(5,3,9,0.94)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#140820; background:#c07dff; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 22px rgba(192,125,255,0.4); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#8a7ba0; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#c07dff; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"><div id="card"></div></div>

<script src="three.min.js"></script>
<script>
/* =====================================================================
   PortalWalkVFX — tears a rift open and walks him out of it
   ---------------------------------------------------------------------
   The emergence is real, not a fade: his sprite is CLIPPED to the portal
   aperture in world space (the vertex stage passes world position down,
   the fragment stage tests it against the ellipse). You physically cannot
   see the parts of him that haven't cleared the hole yet. The clip lifts
   as he steps through, and the intersection line glows while it does.

   Other keys taken from the art:
     · one violet key — min(r,b) − g — lights the blade AND the arm veins
     · that key is re-sampled in a ring to bloom the sword past its own
       silhouette, so the blade glows into the air around it
     · cloak/hair flutter masked to his right side only
     · gait bob so he reads as walking, damping as he stops
   ===================================================================== */
class PortalWalkVFX {
  constructor(opts = {}) {
    this.src = opts.src;
    this.duration = opts.duration || 5.6;
    this.aspect = opts.spriteAspect || (685 / 901);
    this.groundY = opts.groundY != null ? opts.groundY : -0.82;
    this.onTear = opts.onTear || null;
    this.onStep = opts.onStep || null;
    this.onSeal = opts.onSeal || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 60;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.shakeK = this.reduced ? 0.2 : 1;

    this.portalC = new THREE.Vector2(0.02, 0.16);
    this.portalR = new THREE.Vector2(0.02, 0.20);

    this._t = -1; this._raf = null; this._flags = {}; this._shake = 0;
    this._build();
  }

  // ================================================================ setup
  _build() {
    const r = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position: "fixed", inset: "0", pointerEvents: "none",
      zIndex: String(this.zIndex), opacity: "0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -30, 30);
    this.camera.position.z = 15;

    this.NOISE = `
      float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
      float vnoise(vec2 p){
        vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                   mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }
    `;

    this._buildDim(a);
    this._buildSpill();
    this._buildPortal();
    this._buildFloorPool();
    this._buildSprite();
    this._buildArcs();
    this._buildEmbers();
    this._buildFlash(a);

    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  _fullQuad(aspect, mat, z) {
    const m = new THREE.Mesh(new THREE.PlaneBufferGeometry(2 * aspect, 2), mat);
    m.position.z = z; this.scene.add(m); return m;
  }

  _buildDim(aspect) {
    this.dimU = { uAmt:{value:0} };
    this.dimMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.dimU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`varying vec2 vUv; uniform float uAmt;
        void main(){
          float d = length(vUv-0.5)*1.42;
          float a = uAmt*(0.32+0.68*smoothstep(0.05,1.0,d));
          if(a<0.004) discard;
          gl_FragColor = vec4(0.012,0.006,0.020,a);
        }`
    });
    this.dim = this._fullQuad(aspect, this.dimMat, -9);
  }

  // ---- violet light the portal throws into the room -----------------------
  _buildSpill() {
    this.spillU = { uAmt:{value:0}, uTime:{value:0} };
    this.spillMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.spillU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        void main(){
          vec2 p = (vUv-0.5)*2.0;
          float d = length(p*vec2(0.72,1.0));
          float g = pow(smoothstep(1.0,0.0,d), 2.4);
          float pulse = 0.82 + 0.18*sin(uTime*3.2);
          float a = g*uAmt*pulse;
          if(a<0.004) discard;
          gl_FragColor = vec4(mix(vec3(0.42,0.10,0.85), vec3(0.86,0.62,1.0), g), a);
        }`
    });
    this.spill = new THREE.Mesh(new THREE.PlaneBufferGeometry(3.0,3.0), this.spillMat);
    this.spill.position.set(this.portalC.x, this.portalC.y, -6);
    this.scene.add(this.spill);
  }

  // ---- the rift ------------------------------------------------------------
  _buildPortal() {
    this.pU = {
      uT:{value:0}, uTime:{value:0},
      uRx:{value:0.02}, uRy:{value:0.20},
      uBreak:{value:0}          // ripple where he pushes through
    };
    this.pMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.pU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv;
        uniform float uT,uTime,uRx,uRy,uBreak;
        ${this.NOISE}
        void main(){
          vec2 p = (vUv-0.5)*2.4;                 // quad is 2.4 units
          float ang = atan(p.y,p.x);

          // torn, breathing aperture
          float wob = (fbm(vec2(ang*3.2, uTime*0.55))-0.5)*0.22;
          float rx = uRx*(1.0+wob), ry = uRy*(1.0+wob*0.45);
          float d = length(vec2(p.x/max(rx,0.001), p.y/max(ry,0.001)));

          float inside = smoothstep(1.0, 0.90, d);

          // vortex depth: angle warped by 1/d gives the pull-inward spiral
          float sw = fbm(vec2(ang*1.7 + 2.4/max(d,0.20) - uTime*1.15, d*2.4 - uTime*0.35));
          vec3 interior = mix(vec3(0.020,0.004,0.050), vec3(0.40,0.07,0.72), pow(sw,1.5));
          interior += vec3(0.80,0.34,1.0)*pow(smoothstep(0.68,1.0,sw),3.0)*0.9;

          // streaks racing inward
          float streak = pow(0.5+0.5*sin(ang*26.0 + uTime*2.2),8.0)*smoothstep(1.0,0.15,d)*0.45;
          interior += vec3(0.62,0.26,1.0)*streak;

          // ripple rings when he breaks the surface
          float rip = sin(d*16.0 - uTime*7.0)*0.5+0.5;
          interior += vec3(0.70,0.35,1.0)*pow(rip,4.0)*uBreak*smoothstep(1.0,0.2,d)*0.9;

          float rim = smoothstep(0.17,0.0, abs(d-1.0));
          vec3 col = interior*inside;
          col += mix(vec3(0.88,0.38,1.0), vec3(1.0,0.94,1.0), pow(rim,3.0))*rim*1.5;

          float a = clamp(inside*0.96 + rim*1.25, 0.0, 1.0)*uT;
          if(a<0.004) discard;
          gl_FragColor = vec4(col,a);
        }`
    });
    this.portal = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.4,2.4), this.pMat);
    this.portal.position.set(this.portalC.x, this.portalC.y, -4);
    this.scene.add(this.portal);
  }

  // ---- light pooling on the floor ------------------------------------------
  _buildFloorPool() {
    this.fpU = { uAmt:{value:0}, uTime:{value:0} };
    this.fpMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:this.fpU,
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        varying vec2 vUv; uniform float uAmt,uTime;
        ${this.NOISE}
        void main(){
          vec2 p = (vUv-0.5)*2.0;
          float d = length(p);
          float n = fbm(vUv*5.0 + vec2(-uTime*0.4, uTime*0.25));
          float pool = smoothstep(1.0,0.0,d)*(0.55+0.45*n);
          float a = pool*uAmt;
          if(a<0.004) discard;
          gl_FragColor = vec4(mix(vec3(0.34,0.07,0.70), vec3(0.80,0.52,1.0), pool), a);
        }`
    });
    this.pool = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.6,2.6), this.fpMat);
    this.pool.position.set(this.portalC.x, this.groundY, -3);
    this.pool.scale.set(1,0.24,1);
    this.scene.add(this.pool);
  }

  // ---- him -------------------------------------------------------------------
  _buildSprite() {
    const tex = new THREE.TextureLoader().load(this.src);
    tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;

    this.sprU = {
      uMap:{value:tex}, uTime:{value:0},
      uEmerge:{value:0},        // 0 = still inside the hole, 1 = fully through
      uFlutter:{value:0},
      uShade:{value:0},
      uRim:{value:0},
      uVoid:{value:0},          // blade + arm veins
      uCling:{value:0},         // portal energy streaming off him
      uAlpha:{value:0},
      uPortalC:{value:this.portalC.clone()},
      uPortalR:{value:this.portalR.clone()}
    };

    this.sprMat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, uniforms:this.sprU,
      vertexShader:`
        varying vec2 vUv; varying vec2 vWorld;
        void main(){
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position,1.0);
          vWorld = wp.xy;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader:`
        varying vec2 vUv; varying vec2 vWorld;
        uniform sampler2D uMap;
        uniform float uTime,uEmerge,uFlutter,uShade,uRim,uVoid,uCling,uAlpha;
        uniform vec2 uPortalC, uPortalR;
        ${this.NOISE}

        // cloak sweeps to his left (screen right); hair trails the same way
        vec2 flutterUV(vec2 uv){
          float cloak = smoothstep(0.46, 1.00, uv.x)*smoothstep(0.05,0.70,uv.y);
          float hair  = smoothstep(0.52, 1.00, uv.y)*smoothstep(0.44,0.92,uv.x);
          float w = (cloak + hair*0.85)*uFlutter;
          uv.x += sin(uv.y*7.0 - uTime*1.9 + uv.x*4.0)*0.017*w;
          uv.y += sin(uv.x*10.0 + uTime*1.4)*0.008*w;
          return uv;
        }

        float violetKey(vec3 c, float l){
          return smoothstep(0.05,0.28, min(c.r,c.b)-c.g)*smoothstep(0.08,0.55,l);
        }

        void main(){
          vec2 uv = flutterUV(vUv);
          vec4 base = texture2D(uMap, uv);
          float texA = base.a;
          vec3 tex = base.rgb;
          float lum = dot(tex, vec3(0.299,0.587,0.114));

          // ---- APERTURE CLIP: he is only visible where he has cleared
          //      the hole, tested against the ellipse in world space ------
          vec2 rel = (vWorld - uPortalC) / max(uPortalR, vec2(0.001));
          float pd = length(rel);
          float ragged = (fbm(vec2(atan(rel.y,rel.x)*3.0, uTime*0.5))-0.5)*0.16;
          float inAperture = smoothstep(1.04+ragged, 0.90+ragged, pd);
          float clip = clamp(inAperture + uEmerge*1.7, 0.0, 1.0);
          // the intersection line burns while he is crossing it
          float seam = inAperture*(1.0-inAperture)*4.0*(1.0-uEmerge);

          if (texA*clip < 0.006) discard;

          vec3 col = tex * mix(0.07, 1.0, uShade);

          // ---- blade + arm veins, one key ----------------------------
          float vio = violetKey(tex, lum);
          float crackle = smoothstep(0.44,0.94, fbm(uv*18.0 + vec2(0.0,-uTime*3.0)));
          col += vec3(0.72,0.26,1.0)*vio*uVoid*(0.6+crackle*1.0)*2.4;

          // ---- ring-sampled bloom so the sword glows past its outline --
          float bloom = 0.0;
          for(int i=0;i<8;i++){
            float ai = float(i)*0.7853981;
            vec4 s = texture2D(uMap, uv + vec2(cos(ai),sin(ai))*0.016);
            float sl = dot(s.rgb, vec3(0.299,0.587,0.114));
            bloom += violetKey(s.rgb, sl)*s.a;
          }
          bloom *= 0.125;
          col += vec3(0.62,0.20,1.0)*bloom*uVoid*1.7;

          // ---- backlit rim from the rift ------------------------------
          if(uRim > 0.001){
            float px = 0.0055;
            float aL = texture2D(uMap, uv-vec2(px,0.0)).a;
            float aR = texture2D(uMap, uv+vec2(px,0.0)).a;
            float aD = texture2D(uMap, uv-vec2(0.0,px)).a;
            float aU = texture2D(uMap, uv+vec2(0.0,px)).a;
            float edge = clamp(texA - min(min(aL,aR),min(aD,aU)), 0.0, 1.0);
            col += vec3(0.78,0.36,1.0)*edge*uRim*3.2;
          }

          // ---- portal energy clinging and sloughing off ---------------
          float cl = smoothstep(0.55,1.0, fbm(uv*vec2(7.0,3.2) + vec2(0.0, uTime*2.4)));
          col += vec3(0.70,0.30,1.0)*cl*uCling*1.5;

          // ---- seam burn ---------------------------------------------
          col += vec3(0.92,0.62,1.0)*seam*2.6;

          float a = max(texA*clip, bloom*uVoid*0.75) * uAlpha;
          if(a<0.004) discard;
          gl_FragColor = vec4(col, a);
        }`
    });

    const h = 1.80, w = h*this.aspect;
    this.spriteH = h;
    this.sprite = new THREE.Mesh(new THREE.PlaneBufferGeometry(w,h), this.sprMat);
    this.scene.add(this.sprite);
  }

  // ---- discharge arcs around the rim -----------------------------------------
  _buildArcs() {
    this.acv = document.createElement("canvas");
    this.acv.width = 1024; this.acv.height = 1024;
    this.actx = this.acv.getContext("2d");
    this.atex = new THREE.CanvasTexture(this.acv);
    this.atex.minFilter = THREE.LinearFilter;
    this.arcMat = new THREE.MeshBasicMaterial({
      map:this.atex, transparent:true, depthWrite:false,
      blending:THREE.AdditiveBlending, opacity:0
    });
    this.arcs = new THREE.Mesh(new THREE.PlaneBufferGeometry(2.6,2.6), this.arcMat);
    this.arcs.position.set(this.portalC.x, this.portalC.y, -3.5);
    this.scene.add(this.arcs);
  }

  _drawArcs(rx, ry) {
    const c = this.actx, S = 1024, cx = S/2, cy = S/2;
    const sx = (S/2)/1.2, sy = (S/2)/1.2;     // quad is 2.4 units wide
    c.clearRect(0,0,S,S);
    c.lineCap = "round"; c.lineJoin = "round";
    const n = 4 + Math.floor(Math.random()*4);
    for (let k=0;k<n;k++){
      const a0 = Math.random()*Math.PI*2;
      let x = cx + Math.cos(a0)*rx*sx;
      let y = cy - Math.sin(a0)*ry*sy;
      const pts = [[x,y]];
      let ang = a0 + (Math.random()-0.5)*1.2;
      const steps = 4 + Math.floor(Math.random()*4);
      const len = 70 + Math.random()*150;
      for (let i=0;i<steps;i++){
        ang += (Math.random()-0.5)*1.5;
        x += Math.cos(ang)*(len/steps);
        y += Math.sin(ang)*(len/steps);
        pts.push([x,y]);
      }
      for (const pass of [
        {w:15, col:"rgba(120,25,255,0.22)"},
        {w:6,  col:"rgba(190,110,255,0.55)"},
        {w:2,  col:"rgba(245,230,255,0.95)"}
      ]) {
        c.strokeStyle = pass.col; c.lineWidth = pass.w;
        c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
        for (let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]);
        c.stroke();
      }
    }
    this.atex.needsUpdate = true;
  }

  // ---- void embers -------------------------------------------------------------
  _buildEmbers() {
    this.N = 300;
    this.vel = new Float32Array(this.N*3);
    this.seed = new Float32Array(this.N);
    const g = new THREE.BufferGeometry();
    const arr = new Float32Array(this.N*3);
    for (let i=0;i<this.N;i++){
      const ang = Math.random()*Math.PI*2, rad = 0.3+Math.random()*1.1;
      arr[i*3]   = this.portalC.x + Math.cos(ang)*rad;
      arr[i*3+1] = this.portalC.y + Math.sin(ang)*rad;
      this.vel[i*3]   = -Math.cos(ang)*(0.10+Math.random()*0.22);
      this.vel[i*3+1] = -Math.sin(ang)*(0.10+Math.random()*0.22);
      this.seed[i] = Math.random()*6.28;
    }
    g.setAttribute("position", new THREE.BufferAttribute(arr,3));
    const cv = document.createElement("canvas"); cv.width=cv.height=64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32,32,1,32,32,31);
    gr.addColorStop(0,"rgba(245,225,255,1)");
    gr.addColorStop(0.35,"rgba(170,80,255,0.5)");
    gr.addColorStop(1,"rgba(110,20,220,0)");
    c.fillStyle=gr; c.fillRect(0,0,64,64);
    this.embMat = new THREE.PointsMaterial({
      size:0.017, map:new THREE.CanvasTexture(cv), transparent:true, opacity:0,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false
    });
    this.embers = new THREE.Points(g, this.embMat);
    this.embers.position.z = 1.5;
    this.scene.add(this.embers);
  }

  _buildFlash(aspect) {
    this.flashMat = new THREE.MeshBasicMaterial({
      color:0xd6a8ff, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    this.flash = this._fullQuad(aspect, this.flashMat, 8);
  }

  // ============================================================== control
  play() {
    this._flags = {}; this._shake = 0;
    this.flashMat.opacity = 0; this.arcMat.opacity = 0;
    if (this._t < 0) {
      this._t = 0;
      this.renderer.domElement.style.opacity = "1";
      this._clock = new THREE.Clock();
      this._loop();
    } else this._t = 0;
    return this;
  }

  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    const dt = Math.min(this._clock.getDelta(), 0.05);
    const el = this._clock.elapsedTime;
    if (this._t < 0) return;

    this._t += dt / this.duration;
    const T = Math.min(this._t, 1);
    const F = this._flags;

    // ================== timeline ====================================
    // 0.00–0.09  a seam of light splits the air
    // 0.07–0.24  the seam TEARS open into the rift
    // 0.22–0.32  a shape moves inside the aperture
    // 0.28–0.58  he walks out — clipped to the hole, backlit, gait bobbing
    // 0.54–0.68  fully through, energy sloughs off him
    // 0.64–0.78  the rift collapses and seals behind him
    // 0.74–0.92  blade and arm veins burn to full
    // 0.92–1.00  hold and fade
    const seam    = sm(T,0.00,0.09);
    const tear    = sm(T,0.07,0.26);
    const emerge  = sm(T,0.28,0.60);
    const through = sm(T,0.54,0.70);
    const seal    = sm(T,0.64,0.80);
    const ignite  = sm(T,0.72,0.90);
    const outro   = sm(T,0.92,1.00);

    this.dimU.uAmt.value = sm(T,0.01,0.12)*(1-outro)*0.95;

    // ---- aperture geometry -------------------------------------------
    const rx = 0.018 + tear*0.40*(1-seal);
    const ry = 0.16 + Math.min(tear*1.0,1)*0.78 - seal*0.90;
    this.pU.uRx.value = Math.max(rx, 0.002);
    this.pU.uRy.value = Math.max(ry, 0.002);
    this.pU.uT.value = (seam*0.6 + tear)*(1-seal)*(1-outro);
    this.pU.uTime.value = el;
    this.pU.uBreak.value = emerge*(1-emerge)*4.0;
    this.portalR.set(Math.max(rx*1.2,0.002)*1.2, Math.max(ry,0.002)*1.2);
    this.sprU.uPortalR.value.copy(this.portalR);

    const lit = (tear*(1-seal*0.85))*(1-outro);
    this.spillU.uAmt.value = lit*0.42; this.spillU.uTime.value = el;
    this.spill.scale.setScalar(0.5 + tear*0.65);
    this.fpU.uAmt.value = lit*0.5; this.fpU.uTime.value = el;
    this.fpU.uTime.value = el;

    // ---- his walk out --------------------------------------------------
    // steps toward camera: scales up and settles lower
    const walk = emerge;
    const landedY = this.groundY + this.spriteH*0.5;
    const startY = this.portalC.y + 0.10;
    const sc = 0.34 + walk*0.66;
    const gaitAmt = walk*(1-through*0.9);
    const gait = Math.abs(Math.sin(el*5.2))*0.014*gaitAmt;
    const rock = Math.sin(el*2.6)*0.014*gaitAmt;

    this.sprite.scale.set(sc, sc, 1);
    this.sprite.position.set(
      this.portalC.x + walk*(-0.02) + rock*0.4,
      startY - walk*(startY - landedY) + gait,
      0
    );
    this.sprite.rotation.z = rock;

    this.sprU.uTime.value = el;
    this.sprU.uAlpha.value = sm(T,0.24,0.32)*(1-outro);
    this.sprU.uEmerge.value = emerge;
    this.sprU.uFlutter.value = 1.5 - through*0.85;
    this.sprU.uShade.value = sm(T,0.36,0.62);
    this.sprU.uRim.value = (0.95 - through*0.45 + ignite*0.25)*(1-outro);
    this.sprU.uCling.value = emerge*(1-emerge)*4.0*0.55 + (1-through)*0.15;
    this.sprU.uVoid.value = (0.30 + ignite*1.30)*(1-outro);

    // ---- beats ----------------------------------------------------------
    if (!F.tear && T >= 0.075) {
      F.tear = true;
      this.flashMat.opacity = 0.45;
      this._shake = 0.75*this.shakeK;
      if (this.onTear) this.onTear();
    }
    if (!F.step && T >= 0.30) { F.step = true; if (this.onStep) this.onStep(); }
    if (!F.seal && T >= 0.655) {
      F.seal = true;
      this.flashMat.opacity = Math.max(this.flashMat.opacity, 0.38);
      this._shake = Math.max(this._shake, 0.6*this.shakeK);
      if (this.onSeal) this.onSeal();
    }

    // arcs crackle around the rim while it is open
    const arcAmt = (tear*(1-seal))*(1-outro);
    if (arcAmt > 0.05) {
      if (!this._arcT || el - this._arcT > 0.06) {
        this._drawArcs(this.pU.uRx.value, this.pU.uRy.value);
        this._arcT = el;
      }
      this.arcMat.opacity = arcAmt*0.7;
    } else this.arcMat.opacity = 0;

    // ---- embers get pulled toward the rift, then disperse ---------------
    {
      const pos = this.embers.geometry.attributes.position.array;
      const pull = (1-seal);
      for (let i=0;i<this.N;i++){
        pos[i*3]   += (this.vel[i*3]*pull + Math.sin(el*1.5+this.seed[i])*0.06)*dt;
        pos[i*3+1] += (this.vel[i*3+1]*pull + 0.10*(1-pull) + Math.cos(el*1.2+this.seed[i])*0.05)*dt;
        const dx = pos[i*3]-this.portalC.x, dy = pos[i*3+1]-this.portalC.y;
        if (dx*dx+dy*dy < 0.02) {          // swallowed — respawn out wide
          const ang = Math.random()*Math.PI*2, rad = 0.8+Math.random()*0.7;
          pos[i*3]   = this.portalC.x + Math.cos(ang)*rad;
          pos[i*3+1] = this.portalC.y + Math.sin(ang)*rad;
          this.vel[i*3]   = -Math.cos(ang)*(0.10+Math.random()*0.22);
          this.vel[i*3+1] = -Math.sin(ang)*(0.10+Math.random()*0.22);
        }
      }
      this.embers.geometry.attributes.position.needsUpdate = true;
      this.embMat.opacity = (tear*0.65 + ignite*0.35)*(1-outro);
    }

    if (this.flashMat.opacity > 0)
      this.flashMat.opacity = Math.max(0, this.flashMat.opacity - dt*2.0);

    this._shake = Math.max(0, this._shake - dt*2.4);
    this.camera.position.x = (Math.random()-0.5)*0.06*this._shake;
    this.camera.position.y = (Math.random()-0.5)*0.06*this._shake;

    this.renderer.render(this.scene, this.camera);

    if (this._t >= 1) {
      this._t = -1;
      cancelAnimationFrame(this._raf); this._raf = null;
      this.renderer.domElement.style.opacity = "0";
      this.camera.position.set(0,0,15);
      this.renderer.clear();
      if (this.onComplete) this.onComplete();
    }

    function sm(v,e0,e1){
      const t = THREE.MathUtils.clamp((v-e0)/(e1-e0),0,1);
      return t*t*(3-2*t);
    }
  }

  _resize() {
    const a = innerWidth/innerHeight;
    this.renderer.setSize(innerWidth, innerHeight);
    this.camera.left=-a; this.camera.right=a;
    this.camera.updateProjectionMatrix();
    for (const m of [this.dim,this.flash]) {
      m.geometry.dispose();
      m.geometry = new THREE.PlaneBufferGeometry(2*a,2);
    }
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize", this._onResize);
    this.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

const field = document.getElementById("field");
const shake = (px, ms) => field.animate(
  [{transform:"translate(0,0)"},
   {transform:`translate(${-px}px,${px*0.6}px)`},
   {transform:`translate(${px*0.75}px,${-px*0.5}px)`},
   {transform:"translate(0,0)"}],
  {duration:ms, easing:"ease-out"});

const fx = new PortalWalkVFX({
  src: SETHIROTH,
  onTear(){ shake(11, 420);
    field.animate([{filter:"brightness(1)"},{filter:"brightness(0.48)"}],
      {duration:900, easing:"ease-out", fill:"forwards"}); },
  onSeal(){ shake(8, 380); },
  onComplete(){ field.animate([{filter:"brightness(0.48)"},{filter:"brightness(1)"}],
    {duration:750, easing:"ease-out", fill:"forwards"}); }
});
// In-game the file loads inside an iframe over the battlefield — drop the preview
// backdrop there so the FIELD shows through. Standalone keeps it so you can see it.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Optional ?art=<url> overrides the card image (in-game passes the summoned unit's own card art).
try { const _a = new URLSearchParams(location.search).get('art'); if (_a) { const _c = document.getElementById('card'); if (_c) _c.style.backgroundImage = 'url("' + _a + '")'; } } catch (e) {}
document.addEventListener('click', () => fx.play());
fx.play();
