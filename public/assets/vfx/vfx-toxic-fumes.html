<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · TOXIC FUMES</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — visible when you open this file directly; removed
     in-game (iframe) so the board shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change:transform; }


  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(6,9,4,0.92)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#131a08; background:#c9ef62; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(201,239,98,0.35); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#8a9a68; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#c9ef62; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   ToxicFumesVFX — one-shot corrosive gas cloud for effect resolution
   ---------------------------------------------------------------------
   const fx = new ToxicFumesVFX({ vents: [-0.6, 0.0, 0.7] });  // screen x
   fx.play();
   ===================================================================== */
class ToxicFumesVFX {
  constructor(opts = {}) {
    this.duration = opts.duration || 3.0;
    this.vents = opts.vents || [-0.62, -0.05, 0.58];
    this.onVent = opts.onVent || null;
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 50;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    this._t = -1; this._vented = false; this._raf = null;
    this._build();
  }

  _build() {
    const r = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position: "fixed", inset: "0", pointerEvents: "none",
      zIndex: String(this.zIndex), opacity: "0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -10, 10);
    this.camera.position.z = 5;

    this._buildTint(a);
    this._buildGas(a);
    this._buildMotes();
    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  // sickly wash that sits under the gas and colours the whole board
  _buildTint(aspect) {
    this.tintMat = new THREE.MeshBasicMaterial({
      color: 0x89c22a, transparent: true, opacity: 0, depthWrite: false
    });
    this.tint = new THREE.Mesh(new THREE.PlaneBufferGeometry(2 * aspect, 2), this.tintMat);
    this.tint.position.z = -2;
    this.scene.add(this.tint);
  }

  _buildGas(aspect) {
    this.gasU = {
      uT: { value: 0 }, uTime: { value: 0 }, uAspect: { value: aspect },
      uVentA: { value: this.vents[0] || 0 },
      uVentB: { value: this.vents[1] || 0 },
      uVentC: { value: this.vents[2] || 0 }
    };
    this.gasMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: this.gasU,
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uT, uTime, uAspect, uVentA, uVentB, uVentC;

        float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
        float vnoise(vec2 p){
          vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
          return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                     mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
        }
        float fbm(vec2 p){
          float v=0.0, a=0.5;
          for(int i=0;i<5;i++){ v += a*vnoise(p); p*=2.03; a*=0.5; }
          return v;
        }

        float jet(float x, float cx, float w){ float d=(x-cx)/w; return exp(-d*d); }

        void main(){
          vec2 p = vec2(vUv.x*uAspect, vUv.y);
          float T = uT;
          float t = uTime;

          // ---- domain warp: this is what makes it churn, not scroll ------
          vec2 q = vec2(fbm(p*2.1 + vec2(0.0, -t*0.30)),
                        fbm(p*2.1 + vec2(5.2, 1.3) + vec2(0.0, -t*0.24)));
          vec2 r = vec2(fbm(p*2.1 + 2.8*q + vec2(1.7, 9.2) + t*0.10),
                        fbm(p*2.1 + 2.8*q + vec2(8.3, 2.8) - t*0.13));
          float f = fbm(p*2.4 + 3.2*r);

          // ---- the gas ceiling climbs, hangs, then sinks ----------------
          float rise = smoothstep(0.02, 0.52, T);
          float sink = smoothstep(0.76, 1.00, T);
          float ceiling = mix(-0.28, 1.05, rise) - sink * 1.45;

          // early jets punch above the ceiling at each vent
          float jets = (jet(p.x, uVentA, 0.16) + jet(p.x, uVentB, 0.14) + jet(p.x, uVentC, 0.17))
                       * 0.42 * smoothstep(0.0, 0.14, T) * (1.0 - smoothstep(0.16, 0.44, T));
          ceiling += jets;

          // ragged top edge
          ceiling += (fbm(vec2(p.x*2.6, t*0.5)) - 0.5) * 0.30;

          float mask = smoothstep(ceiling, ceiling - 0.52, p.y);
          float dens = smoothstep(0.30, 0.88, f) * mask;

          // ---- colour: dark bile core → hot acid rim --------------------
          vec3 core = vec3(0.08, 0.15, 0.03);
          vec3 body = vec3(0.34, 0.60, 0.09);
          vec3 hot  = vec3(0.76, 0.98, 0.24);
          vec3 col = mix(core, body, smoothstep(0.28, 0.72, f));
          col = mix(col, hot, pow(smoothstep(0.62, 0.98, f), 2.2));

          // caustic shimmer through the thin edges
          col += vec3(0.42, 0.62, 0.10) * pow(1.0 - dens, 3.0) * dens * 1.4;

          float alpha = dens * 0.88 * (1.0 - smoothstep(0.90, 1.0, T));
          if (alpha < 0.003) discard;
          gl_FragColor = vec4(col, alpha);
        }`
    });
    this.gas = new THREE.Mesh(new THREE.PlaneBufferGeometry(2 * aspect, 2), this.gasMat);
    this.scene.add(this.gas);
  }

  // corrosive motes drifting up through the cloud
  _buildMotes() {
    this.N = 220;
    this.vel = new Float32Array(this.N * 3);
    this.seed = new Float32Array(this.N);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(this.N * 3), 3));

    const cv = document.createElement("canvas"); cv.width = cv.height = 64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32, 32, 1, 32, 32, 31);
    gr.addColorStop(0, "rgba(230,255,150,1)");
    gr.addColorStop(0.4, "rgba(160,220,60,0.42)");
    gr.addColorStop(1, "rgba(120,180,30,0)");
    c.fillStyle = gr; c.fillRect(0, 0, 64, 64);

    this.moteMat = new THREE.PointsMaterial({
      size: 0.02, map: new THREE.CanvasTexture(cv), transparent: true,
      opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending,
      sizeAttenuation: false
    });
    this.motes = new THREE.Points(g, this.moteMat);
    this.motes.position.z = 0.5;
    this.scene.add(this.motes);
  }

  _seedMotes() {
    const a = this.camera.right;
    const pos = this.motes.geometry.attributes.position.array;
    for (let i = 0; i < this.N; i++) {
      // cluster around the vents, scatter the rest
      const v = this.vents[i % this.vents.length];
      const near = Math.random() < 0.6;
      pos[i*3]   = near ? v + (Math.random()*2-1) * 0.3 : (Math.random()*2-1) * a;
      pos[i*3+1] = -1.05 - Math.random() * 0.5;
      pos[i*3+2] = 0;
      this.vel[i*3]   = (Math.random()*2-1) * 0.14;
      this.vel[i*3+1] = 0.30 + Math.random() * 0.75;
      this.seed[i] = Math.random() * 6.28;
    }
    this.motes.geometry.attributes.position.needsUpdate = true;
  }

  play() {
    this._vented = false;
    this._seedMotes();
    if (this._t < 0) {
      this._t = 0;
      this.renderer.domElement.style.opacity = "1";
      this._clock = new THREE.Clock();
      this._loop();
    } else this._t = 0;
    return this;
  }

  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    const dt = Math.min(this._clock.getDelta(), 0.05);
    const el = this._clock.elapsedTime;
    if (this._t < 0) return;

    this._t += dt / this.duration;
    const T = Math.min(this._t, 1);
    this.gasU.uT.value = T;
    this.gasU.uTime.value = el * (this.reduced ? 0.5 : 1);

    if (!this._vented && T >= 0.03) { this._vented = true; if (this.onVent) this.onVent(); }

    // tint peaks while the cloud is thickest
    const hang = Math.sin(Math.min(T / 0.9, 1) * Math.PI);
    this.tintMat.opacity = hang * 0.17;

    // motes rise with turbulent drift
    const pos = this.motes.geometry.attributes.position.array;
    for (let i = 0; i < this.N; i++) {
      pos[i*3]   += (this.vel[i*3] + Math.sin(el * 1.7 + this.seed[i]) * 0.16) * dt;
      pos[i*3+1] += this.vel[i*3+1] * dt;
      if (pos[i*3+1] > 1.1) pos[i*3+1] = -1.1;
    }
    this.motes.geometry.attributes.position.needsUpdate = true;
    this.moteMat.opacity = hang * 0.85;

    this.renderer.render(this.scene, this.camera);

    if (this._t >= 1) {
      this._t = -1;
      cancelAnimationFrame(this._raf); this._raf = null;
      this.renderer.domElement.style.opacity = "0";
      this.renderer.clear();
      if (this.onComplete) this.onComplete();
    }
  }

  _resize() {
    const a = innerWidth / innerHeight;
    this.renderer.setSize(innerWidth, innerHeight);
    this.camera.left = -a; this.camera.right = a;
    this.camera.updateProjectionMatrix();
    this.gasU.uAspect.value = a;
    for (const m of [this.gas, this.tint]) {
      m.geometry.dispose();
      m.geometry = new THREE.PlaneBufferGeometry(2 * a, 2);
    }
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize", this._onResize);
    this.scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

/* ------------------------------- demo harness ------------------------- */
const field = document.getElementById("field");
const fx = new ToxicFumesVFX({
  onVent() {
    field.animate(
      [{ filter: "saturate(1)" }, { filter: "saturate(0.6) hue-rotate(18deg)" }, { filter: "saturate(1)" }],
      { duration: 2400, easing: "ease-in-out" }
    );
  }
});
// In-game (iframe) drop the preview backdrop so the board shows through.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Standalone preview: click anywhere to replay.
document.addEventListener('click', () => { try { fx.play(); } catch (e) {} });
fx.play();
</script>
</body>
</html>
