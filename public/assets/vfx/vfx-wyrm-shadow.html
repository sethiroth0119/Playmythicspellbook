<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX · WYRM SHADOW</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }

  /* PREVIEW-ONLY backdrop — visible when you open this file directly; removed
     in-game (iframe) so the board shows through. */
  #previewbg { position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 50% 42%, #23303f 0%, #0d151d 68%, #060a0f 100%),
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(120,160,200,0.05) 46px 47px); }

  #field { position:fixed; inset:0; display:grid; place-items:center; background:transparent; will-change:transform; }


  #bar { position:fixed; bottom:0; left:0; right:0; padding:20px 24px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(10,7,5,0.92)); }
  button { appearance:none; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; padding:12px 22px; border-radius:2px;
    color:#1c1109; background:#f2b96a; border:none; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(242,185,106,0.35); }
  button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #tag { color:#9a8368; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  #tag b { color:#f2b96a; font-weight:600; }
</style>
</head>
<body>

<div id="previewbg"></div>
<div id="field"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   WyrmShadowVFX — one-shot dragon flyover for card effect resolution
   ---------------------------------------------------------------------
   const fx = new WyrmShadowVFX({ direction: -1 });   // -1 = R→L, 1 = L→R
   fx.play();
   ===================================================================== */
class WyrmShadowVFX {
  constructor(opts = {}) {
    this.duration = opts.duration || 3.2;
    this.direction = opts.direction || -1;     // travel direction
    this.onPass = opts.onPass || null;         // fires at closest approach
    this.onComplete = opts.onComplete || null;
    this.zIndex = opts.zIndex != null ? opts.zIndex : 50;
    this.reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    this._t = -1;
    this._passed = false;
    this._raf = null;
    this._build();
  }

  // ---------------------------------------------------------------- setup
  _build() {
    const r = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    r.setSize(innerWidth, innerHeight);
    r.setClearColor(0x000000, 0);
    Object.assign(r.domElement.style, {
      position: "fixed", inset: "0", pointerEvents: "none",
      zIndex: String(this.zIndex), opacity: "0"
    });
    document.body.appendChild(r.domElement);
    this.renderer = r;

    this.scene = new THREE.Scene();
    const a = innerWidth / innerHeight;
    this.camera = new THREE.OrthographicCamera(-a, a, 1, -1, -10, 10);
    this.camera.position.z = 5;

    this._buildDim(a);
    this._buildSilhouette();
    this._buildDust();
    this._buildFlash(a);
    this._onResize = () => this._resize();
    addEventListener("resize", this._onResize);
  }

  // global light drop as the wyrm eclipses the field
  _buildDim(aspect) {
    this.dimMat = new THREE.MeshBasicMaterial({
      color: 0x0a0705, transparent: true, opacity: 0, depthWrite: false
    });
    this.dim = new THREE.Mesh(new THREE.PlaneBufferGeometry(2 * aspect, 2), this.dimMat);
    this.dim.position.z = -2;
    this.scene.add(this.dim);
  }

  // warm rim flash when the sun comes back
  _buildFlash(aspect) {
    this.flashMat = new THREE.MeshBasicMaterial({
      color: 0xffc27a, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.flash = new THREE.Mesh(new THREE.PlaneBufferGeometry(2 * aspect, 2), this.flashMat);
    this.flash.position.z = 1;
    this.scene.add(this.flash);
  }

  _buildSilhouette() {
    this.cv = document.createElement("canvas");
    this.cv.width = this.cv.height = 640;
    this.ctx = this.cv.getContext("2d");
    this.tex = new THREE.CanvasTexture(this.cv);
    this.tex.minFilter = THREE.LinearFilter;

    // two stacked quads: soft penumbra underneath, tighter umbra on top
    const geo = new THREE.PlaneBufferGeometry(2.4, 2.4);
    this.penMat = new THREE.MeshBasicMaterial({
      map: this.tex, transparent: true, opacity: 0, depthWrite: false
    });
    this.umbMat = new THREE.MeshBasicMaterial({
      map: this.tex, transparent: true, opacity: 0, depthWrite: false
    });
    this.penumbra = new THREE.Mesh(geo, this.penMat);
    this.umbra = new THREE.Mesh(geo.clone(), this.umbMat);
    this.penumbra.position.z = -1.5;
    this.umbra.position.z = -1.0;
    this.scene.add(this.penumbra, this.umbra);
  }

  _drawWyrm(time, flapSpeed) {
    const c = this.ctx;
    c.clearRect(0, 0, 640, 640);
    c.save();
    c.translate(320, 320);
    c.shadowColor = "rgba(0,0,0,1)";
    c.shadowBlur = 10;
    c.fillStyle = "rgba(0,0,0,0.94)";

    const flap = Math.sin(time * flapSpeed);
    const spread = 0.30 + 0.70 * (0.5 + 0.5 * flap);   // wing extension 0.3→1
    const lift = flap * 10;
    const tailWave = Math.sin(time * flapSpeed * 0.42) * 20;

    // --- tail ---
    c.beginPath();
    c.moveTo(-46, -11);
    c.quadraticCurveTo(-150, -8 + tailWave * 0.45, -238, tailWave);
    c.quadraticCurveTo(-150, 8 + tailWave * 0.45, -46, 11);
    c.closePath(); c.fill();
    // tail spade
    c.beginPath();
    c.moveTo(-236, tailWave);
    c.lineTo(-272, tailWave - 19);
    c.lineTo(-256, tailWave);
    c.lineTo(-272, tailWave + 19);
    c.closePath(); c.fill();

    // --- hind legs tucked ---
    for (const s of [-1, 1]) {
      c.beginPath();
      c.moveTo(-16, s * 14);
      c.quadraticCurveTo(-40, s * 42, -66, s * 36);
      c.quadraticCurveTo(-44, s * 26, -22, s * 10);
      c.closePath(); c.fill();
    }

    // --- body ---
    c.beginPath();
    c.ellipse(0, lift * 0.25, 66, 24, 0, 0, Math.PI * 2);
    c.fill();

    // --- neck + head ---
    c.beginPath();
    c.moveTo(48, -12);
    c.quadraticCurveTo(96, -22, 128, -25);
    c.lineTo(178, -30);   // snout
    c.lineTo(140, -14);
    c.lineTo(134, -2);
    c.quadraticCurveTo(94, 6, 48, 12);
    c.closePath(); c.fill();
    // horns
    c.beginPath(); c.moveTo(132, -26); c.lineTo(112, -50); c.lineTo(126, -28); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(122, -24); c.lineTo(96, -44); c.lineTo(114, -26); c.closePath(); c.fill();

    // --- wings: membrane with scalloped trailing edge + finger struts ---
    for (const s of [-1, 1]) {
      const tipY = s * (34 + spread * 250);
      const tipX = 10 - spread * 46;
      c.beginPath();
      c.moveTo(30, s * 12);
      // leading edge sweeping out to the tip
      c.bezierCurveTo(64, s * (40 + spread * 70), 46, s * (110 + spread * 110), tipX, tipY);
      // scalloped trailing edge folding back to the shoulder
      c.quadraticCurveTo(-30, s * (60 + spread * 170), -46, s * (44 + spread * 118));
      c.quadraticCurveTo(-30, s * (46 + spread * 96), -54, s * (30 + spread * 74));
      c.quadraticCurveTo(-34, s * (30 + spread * 56), -56, s * (18 + spread * 36));
      c.quadraticCurveTo(-36, s * 20, -30, s * 14);
      c.closePath(); c.fill();

      // wing finger struts, slightly darker core
      c.save();
      c.globalAlpha = 0.5;
      c.lineWidth = 5; c.strokeStyle = "rgba(0,0,0,1)"; c.lineCap = "round";
      const joints = [[-46, 44 + spread * 118], [-54, 30 + spread * 74], [-56, 18 + spread * 36]];
      for (const [jx, jy] of joints) {
        c.beginPath(); c.moveTo(24, s * 10); c.lineTo(jx, s * jy); c.stroke();
      }
      c.beginPath(); c.moveTo(24, s * 10); c.lineTo(tipX, tipY); c.stroke();
      c.restore();
    }

    c.restore();
    this.tex.needsUpdate = true;
  }

  _buildDust() {
    this.N = 260;
    this.vel = new Float32Array(this.N * 3);
    this.seed = new Float32Array(this.N);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(this.N * 3), 3));

    const cv = document.createElement("canvas"); cv.width = cv.height = 64;
    const c = cv.getContext("2d");
    const gr = c.createRadialGradient(32, 32, 1, 32, 32, 31);
    gr.addColorStop(0, "rgba(255,225,175,1)");
    gr.addColorStop(0.4, "rgba(230,160,80,0.45)");
    gr.addColorStop(1, "rgba(200,120,50,0)");
    c.fillStyle = gr; c.fillRect(0, 0, 64, 64);

    this.dustMat = new THREE.PointsMaterial({
      size: 0.024, map: new THREE.CanvasTexture(cv), transparent: true,
      opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending,
      sizeAttenuation: false
    });
    this.dust = new THREE.Points(g, this.dustMat);
    this.dust.position.z = 0.5;
    this.dust.visible = false;
    this.scene.add(this.dust);
  }

  _kickDust(cx) {
    const pos = this.dust.geometry.attributes.position.array;
    for (let i = 0; i < this.N; i++) {
      pos[i*3]   = cx + (Math.random() * 2 - 1) * 0.9;
      pos[i*3+1] = -1.05 + Math.random() * 0.35;
      pos[i*3+2] = 0;
      this.vel[i*3]   = (Math.random() * 2 - 1) * 0.9 + this.direction * 0.6;
      this.vel[i*3+1] = 0.5 + Math.random() * 1.5;
      this.seed[i] = Math.random() * 6.28;
    }
    this.dust.geometry.attributes.position.needsUpdate = true;
    this.dust.visible = true;
    this.dustMat.opacity = 1;
  }

  // ---------------------------------------------------------------- control
  play() {
    this._passed = false;
    this.dust.visible = false;
    this.dustMat.opacity = 0;
    this.flashMat.opacity = 0;
    if (this._t < 0) {
      this._t = 0;
      this.renderer.domElement.style.opacity = "1";
      this._clock = new THREE.Clock();
      this._loop();
    } else this._t = 0;
    return this;
  }

  _loop() {
    this._raf = requestAnimationFrame(() => this._loop());
    const dt = Math.min(this._clock.getDelta(), 0.05);
    const el = this._clock.elapsedTime;
    if (this._t < 0) return;

    this._t += dt / this.duration;
    const T = Math.min(this._t, 1);
    const a = this.camera.right;

    // ---- flight path: crosses the frame between T 0.18 and 0.82 ----------
    const cross = THREE.MathUtils.clamp((T - 0.18) / 0.64, 0, 1);
    const eased = cross < 0.5 ? 2*cross*cross : 1 - Math.pow(-2*cross + 2, 2) / 2;
    const span = a * 2.6;
    const x = this.direction * (span * 0.5 - eased * span);
    const y = 0.55 - eased * 1.15 + Math.sin(eased * Math.PI) * 0.18;   // diagonal sweep

    // "altitude": low at the middle of the pass — shadow tightens and darkens
    const near = Math.sin(Math.min(Math.max(cross, 0), 1) * Math.PI);   // 0→1→0
    const scale = 1.55 - near * 0.45;

    this._drawWyrm(el, this.reduced ? 3.0 : 6.2);

    for (const m of [this.penumbra, this.umbra]) {
      m.position.set(x, y, m.position.z);
      m.rotation.z = (this.direction > 0 ? 0 : Math.PI) + (this.direction * -0.20);
    }
    // penumbra: bigger, softer, always trailing the umbra slightly
    this.penumbra.scale.setScalar(scale * 1.55);
    this.umbra.scale.setScalar(scale);

    const onscreen = smooth(T, 0.14, 0.22) * (1 - smooth(T, 0.80, 0.90));
    this.penMat.opacity = onscreen * (0.16 + near * 0.16);
    this.umbMat.opacity = onscreen * (0.30 + near * 0.42);

    // ---- ambient light drop --------------------------------------------
    this.dimMat.opacity = onscreen * (0.10 + near * 0.30);

    // ---- closest approach beat ------------------------------------------
    if (!this._passed && cross >= 0.5) {
      this._passed = true;
      this._kickDust(x);
      if (this.onPass) this.onPass();
    }

    // ---- downdraft dust --------------------------------------------------
    if (this.dust.visible) {
      const pos = this.dust.geometry.attributes.position.array;
      for (let i = 0; i < this.N; i++) {
        this.vel[i*3+1] -= 0.55 * dt;
        pos[i*3]   += (this.vel[i*3] + Math.sin(el * 2.4 + this.seed[i]) * 0.22) * dt;
        pos[i*3+1] += this.vel[i*3+1] * dt;
      }
      this.dust.geometry.attributes.position.needsUpdate = true;
      this.dustMat.opacity = Math.max(0, 1 - (T - 0.50) / 0.45) * 0.8;
      if (this.dustMat.opacity <= 0.01) this.dust.visible = false;
    }

    // ---- sun returns -----------------------------------------------------
    const ret = smooth(T, 0.80, 0.87) * (1 - smooth(T, 0.87, 0.99));
    this.flashMat.opacity = ret * 0.22;

    this.renderer.render(this.scene, this.camera);

    if (this._t >= 1) {
      this._t = -1;
      cancelAnimationFrame(this._raf); this._raf = null;
      this.renderer.domElement.style.opacity = "0";
      this.renderer.clear();
      if (this.onComplete) this.onComplete();
    }

    function smooth(v, e0, e1) {
      const t = THREE.MathUtils.clamp((v - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    }
  }

  _resize() {
    const a = innerWidth / innerHeight;
    this.renderer.setSize(innerWidth, innerHeight);
    this.camera.left = -a; this.camera.right = a;
    this.camera.updateProjectionMatrix();
    for (const m of [this.dim, this.flash]) {
      m.geometry.dispose();
      m.geometry = new THREE.PlaneBufferGeometry(2 * a, 2);
    }
  }

  destroy() {
    cancelAnimationFrame(this._raf);
    removeEventListener("resize", this._onResize);
    this.scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

/* ------------------------------- demo harness ------------------------- */
const field = document.getElementById("field");
const fx = new WyrmShadowVFX({
  onPass() {
    field.animate(
      [{ transform: "translate(0,0)" }, { transform: "translate(4px,3px)" },
       { transform: "translate(-3px,-2px)" }, { transform: "translate(0,0)" }],
      { duration: 420, easing: "ease-out" }
    );
  }
});
// In-game (iframe) drop the preview backdrop so the board shows through.
try { if (window.self !== window.top) { const _pb = document.getElementById('previewbg'); if (_pb) _pb.remove(); } } catch (e) {}
// Standalone preview: click anywhere to replay.
document.addEventListener('click', () => { try { fx.play(); } catch (e) {} });
fx.play();
</script>
</body>
</html>
