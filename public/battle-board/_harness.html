let boardReady = false;      // board:ready seen
let pushedAt   = 0;          // performance.now() when the scenario finished going out
let rectsSeen  = 0;          // board:rects since the push — proof the iframe's RAF runs
let lastRects  = null;       // …and the newest payload, for anchor-staleness tests
const errors   = [];

function note(msg, isErr) {
  if (isErr) errors.push(msg);
  if (!readEl) return;
  readEl.innerHTML = String(msg).replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;');
  readEl.className = 'read' + (isErr ? ' err' : '');
}

if (SHOT) document.body.classList.add('shot');

/* ── 📐 THE IN-GAME HOST RECT — measured, not guessed ──────────────────
   The game sizes #bb-stage-host to `.board-area`'s bounding rect
   (`_bbStageTrack`, index.html:104381-104425) and stretches the iframe to
   inset:0 inside it. That rect is NOT the viewport, and the difference is not
   cosmetic: `VIEW.scale` (battle-board:441) fits the vertical FOV to the
   SAFE-BOX HEIGHT, and EMBEDDED zeroes SAFE (:2917) — so vertical FOV is pinned
   to the host's HEIGHT and horizontal FOV falls out of its ASPECT (CONTRACT
   §1.6). A full-viewport host frames the board differently from a match, which
   is precisely the "right in the rig, wrong in the game" error this file exists
   to prevent.

   The numbers below are a MEASUREMENT of the live cascade, not a reading of the
   CSS. Method: load /index.html in headless Chromium, append an empty
   `.battle-screen > .battle-grid > .battle-center > .board-area` into #app,
   force root zoom to 1 (the battle screen is exempt from the UI auto-scale —
   index.html:209104 sets z=1 when App.screen==='battle'), read the rect.
   Re-measure the same way if the rail widths move.

       viewport      .board-area (CSS px)
       1600 × 900     801.6 × 688   at (490.4, 5.6)
       1440 × 900     781.6 × 692   at (370.4, 5.6)
       1920 × 1080   1111.2 × 868   at (496.0, 9.6)

   The arithmetic reproduces the first two to under a pixel and 1920 to ~1%.
   Its inputs are the ones the cascade really uses:
     rail L   chrome.css:97-99    440 / 320 / 280 by breakpoint — it OVERRIDES
                                  index.html:7082-7089's 560/400/330
     rail R   chrome.css:114-115  248 / 228 — index.html's --btl-rail-r lies
                                  about this and says so in its own comment
     grid     index.html:6921-6928  gap 1rem, +20px rail offset, +24px right
                                  reservation, padding-right .75rem
     height   index.html:6926     min-height: calc(100vh - 1.2rem - 190px) */
function boardAreaRect(W, H) {
  const railL = (W >= 1600) ? 440 : (W >= 1280 ? 320 : 280);
  const railR = (W > 1500) ? 248 : 228;
  const left  = 14 + (railL + 20) + 16;          /* #app inset + column 1 + gap */
  return { left: left, top: 6,
           width:  Math.max(240, W - left - 16 - (railR + 24) - 20),
           height: Math.max(200, H - 22 - 190) };
}

/* Which box this scene mounts into. An as-shipped scene gets the in-game rect,
   because a capture that claims to be the game must be framed like the game. A
   target-state scene keeps the full viewport: a bigger, lower-framed picture
   that no match produces — which is fine, it is a fixture, and the watermark
   says so. `?host=full|boardarea` overrides either way for a direct A/B. */
const HOSTMODE = (QS.get('host') === 'full' || QS.get('host') === 'boardarea')
  ? QS.get('host') : (SCENE.shipped ? 'boardarea' : 'full');
let hostBox = { left:0, top:0, width:0, height:0 };

function sizeHost() {
  const W = window.innerWidth || 1600, H = window.innerHeight || 900;
  const r = (HOSTMODE === 'boardarea') ? boardAreaRect(W, H)
                                       : { left:0, top:0, width:W, height:H };
  host.style.left = r.left + 'px'; host.style.top = r.top + 'px';
  host.style.width = r.width + 'px'; host.style.height = r.height + 'px';
  hostBox = r;
  paintMark();
  paintGuides();
}
window.addEventListener('resize', sizeHost);

/* 📐 Draw the furniture the game puts around the board, from the SAME numbers
   boardAreaRect uses so the two cannot drift. Nothing here is rendered — these
   are outlines of the space a match spends on HUD, which is the whole reason
   the board's rect is not the viewport. */
function paintGuides() {
  const box = document.getElementById('h-guides');
  if (!box) return;
  box.innerHTML = '';
  document.body.classList.toggle('guides', HOSTMODE === 'boardarea');
  if (HOSTMODE !== 'boardarea') return;
  const W = window.innerWidth || 1600, H = window.innerHeight || 900;
  const railL = (W >= 1600) ? 440 : (W >= 1280 ? 320 : 280);   /* chrome.css:97-99   */
  const railR = (W > 1500) ? 248 : 228;                        /* chrome.css:114-115 */
  const HAND  = 190;                                           /* index.html:6927    */
  const parts = [
    { l:14,        t:6, w:railL,  h:H - HAND - 12, s:'HUD RAIL · .battle-left', c:'' },
    { l:W - railR - 12, t:6, w:railR, h:H - HAND - 12, s:'DECK RAIL · .bp-wrap', c:'' },
    { l:0,         t:H - HAND, w:W, h:HAND, s:'HAND STRIP · position:fixed', c:'' },
    { l:hostBox.left, t:hostBox.top, w:hostBox.width, h:hostBox.height,
      s:'.board-area — the stage host', c:'board' }
  ];
  for (const p of parts) {
    const d = document.createElement('div');
    d.className = p.c;
    d.style.left = p.l + 'px'; d.style.top = p.t + 'px';
    d.style.width = p.w + 'px'; d.style.height = p.h + 'px';
    d.textContent = p.s;
    box.appendChild(d);
  }
}

/* 🏷 The watermark. Kind first because that is the thing a stray PNG loses. */
function paintMark() {
  const el = document.getElementById('h-mark');
  if (!el) return;
  el.innerHTML = '<b class="' + (SCENE.shipped ? 'ship' : 'fix') + '">' +
    (SCENE.shipped ? '◆ AS-SHIPPED' : '◇ TARGET-STATE FIXTURE') + '</b>' +
    ' · scene=' + NAME +
    ' · host ' + (HOSTMODE === 'boardarea' ? '.board-area' : 'viewport') + ' ' +
    Math.round(hostBox.width) + '×' + Math.round(hostBox.height);
  const hb = document.getElementById('h-host');
  if (hb) hb.textContent = (HOSTMODE === 'boardarea' ? '.board-area (in-game)' : 'full viewport')
    + ' · ' + Math.round(hostBox.width) + '×' + Math.round(hostBox.height);
}

/* chrome. Every chip is labelled, not just the active one — the panel has to
   answer "which of these are real" without clicking through five of them. */
(function paintChrome() {
  const pv = document.getElementById('h-prov');
  if (pv) {
    pv.textContent = SCENE.shipped ? '◆ AS-SHIPPED' : '◇ TARGET-STATE FIXTURE';
    pv.className = 'prov ' + (SCENE.shipped ? 'ship' : 'fix');
  }
  const d = document.getElementById('h-desc');
  if (d) d.textContent = SCENE.desc || '';
  const box = document.getElementById('h-scenes');
  if (!box) return;
  for (const k of Object.keys(SCENES)) {
    const a = document.createElement('a');
    a.href = '?scene=' + k; a.textContent = k;
    a.className = (SCENES[k].shipped ? 'ship' : 'fix') + (k === NAME ? ' on' : '');
    a.title = SCENES[k].shipped ? 'as-shipped — the game can send this today'
                                : 'target-state fixture — the game cannot send this today';
    box.appendChild(a);
  }
})();

/* The iframe, mounted the way _bbStageMount does (index.html:104155-104163):
   same src + cache-buster, hidden until `load` so the browser's white
   pre-paint frame never shows, with a belt-and-braces timer behind it. */
sizeHost();

const frame = document.createElement('iframe');
frame.className = 'bb-stage';
frame.setAttribute('aria-hidden', 'true');
frame.setAttribute('tabindex', '-1');
frame.src = 'index.html?v=' + BB_VER;
frame.addEventListener('load', () => frame.classList.add('ready'));
setTimeout(() => frame.classList.add('ready'), 4000);
host.insertBefore(frame, catch_);

/* _bbStagePost — index.html:103820. Same envelope, same same-origin target. */
function post(type, detail) {
  if (!frame.contentWindow) return;
  try {
    frame.contentWindow.postMessage(Object.assign({ type: 'board:' + type }, detail || {}),
                                    location.origin);
  } catch (e) { note('post ' + type + ' failed: ' + e.message, true); }
}

/* The push order is copied from the `board:ready` branch at index.html:104147-104149:
   init → units (which pushes defs first) → paint → tombs → surfaces. Order is
   load-bearing: `applyUnits` mints a placeholder def for any key it has not
   seen (battle-board/index.html:2795-2800), so defs must land first or a unit
   spends its first frames as a procedural body. */
async function pushScene() {
  post('init', bridgeInitPayload(SCENE));

  /* _bbStagePushLocation (index.html:103936) registers the entry and THEN
     switches, because setLocation() hard-bails on an id it has never seen.
     init already carried the table; doing it again costs nothing and keeps
     the harness on the same code path the game uses mid-match. */
  post('locations', { locations: bridgeLocations() });
  post('location', { id: SCENE.location });
  post('timeOfDay', { key: SCENE.timeOfDay });

  /* _bbStagePushUnits — index.html:104041: defs(force) first, then the FULL
     roster. The game always sends the whole list; withholding a unit and
     asking for a summon ceremony instead is a documented past bug. */
  const defs = await bridgeDefs(SCENE);
  post('defs', { defs: defs });
  post('units', { units: bridgeUnitList(SCENE) });

  post('paint', bridgePaint(SCENE));
  post('tele', bridgeTele(SCENE));
  post('tombs', bridgeTombs(SCENE));
  post('structs', bridgeStructs(SCENE));
  post('surfaces', bridgeSurfaces(SCENE));
  post('events', await bridgeEvents(SCENE));

  pushedAt = performance.now();
  rectsSeen = 0;
  note('scene "' + NAME + '" pushed · ' + (SCENE.units || []).length + ' units');
}

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  const d = e.data;
  if (!d || typeof d.type !== 'string' || d.type.indexOf('board:') !== 0) return;
  if (!frame.contentWindow || e.source !== frame.contentWindow) return;

  if (d.type === 'board:ready') {
    boardReady = true;
    pushScene().catch(err => note('pushScene: ' + (err && err.message || err), true));
    return;
  }
  /* board:rects is EMBEDDED-only, throttled to 4/sec while the camera is at
     rest and published EVERY FRAME while it moves (the anchors are what every
     VFX and cinematic hangs off, and at 78°/s a 250ms-old box is ~84px stale).
     It is published from inside frame() itself, so receiving them is direct
     evidence the stage's RAF loop is alive — which is what the ready gate below
     wants, and what a parent-side rAF count could never prove.
     The payload is KEPT, not just counted: it is the only way to measure that
     staleness from outside the iframe, which is how the 4/sec desync was
     quantified in the first place. See __harness.rects(). */
  if (d.type === 'board:rects') { rectsSeen++; lastRects = d; return; }
  if (d.type === 'board:tileClick') {
    note('tileClick ' + d.x + ',' + d.z + (d.unitId ? ' → unit ' + d.unitId : ''));
    return;
  }
  if (d.type === 'board:tileHover') {
    if (d.x >= 0) note('hover ' + d.x + ',' + d.z + (d.unitId ? ' · ' + d.unitId : ''));
    return;
  }
});

/* Forwarded pointer — `_bbStageCatcher`, index.html:104344-104353. Normalised
   against the STAGE HOST (not the catcher), which is the fix for the "clicks
   land one tile over" bug the game's comment records. */
function norm(e) {
  const r = host.getBoundingClientRect();
  return { nx: (e.clientX - r.left) / Math.max(1, r.width),
           ny: (e.clientY - r.top) / Math.max(1, r.height) };
}
catch_.addEventListener('click', (e) => { const n = norm(e); post('pointer', { kind:'click', nx:n.nx, ny:n.ny }); });
catch_.addEventListener('mousemove', (e) => { const n = norm(e); post('pointer', { kind:'move', nx:n.nx, ny:n.ny }); });
catch_.addEventListener('mouseleave', () => post('pointer', { kind:'move', nx:-1, ny:-1 }));

/* ── ⌨ KEY FORWARDING — NO LONGER A STUB ───────────────────────────────
   .gauntlet/BAR.md requirement #2 is "Camera: WASD moves it, Q/E turns it".
   This rig forwarded the two messages below long before anything received
   them, because CONTRACT §2 Tier 2 is explicit that an embedded free camera
   needs HOST-FORWARDED KEYS: an iframe that never holds focus receives no
   `keydown` for exactly the reason it receives no mouse events (§1.4), so a
   camera built and tested only against the standalone preview's local listener
   would be dead in the game and dead here.

   The board now has both receivers (`handleHostMessage`, cases `key` and
   `camera`), and the GAME sends both messages from `_bbCamKeysBind`
   (index.html) in the same shapes and the same units this rig does — that
   pairing is the whole reason to keep both:

     board:key    {down, code, key, repeat}   key EDGES. The board keeps the
                  held set and integrates it in update(dt) against its own
                  clock, which is what makes camera speed independent of either
                  side's frame rate. It is also the only shape that can carry
                  R (reset the view), which is an edge and not an axis.
     board:camera {dx, dz, yaw}               resolved intent, re-sent every
                  animation frame while a camera key is held, with dt already
                  applied. `dz` is a delta along the board's +Z, i.e. toward
                  the NEAR edge, so S is positive and W is negative.

   ⚠ The board reads the pulse as an intent SIGN and never accumulates it, so
   sending both shapes does not drive the camera twice. A rig (or a host) that
   integrated deltas on the board's behalf WOULD double-count, at whatever
   ratio the two clocks happened to sit at, and it would look like a tuning
   problem rather than a bug.

   ⚠ `g` and `1`-`4` are claimed by the board's own local listener and are
   inert here for the focus reason above — they are forwarded as `board:key`
   but the board only maps WASD/QE/R out of that message. Use
   `__harness.post('timeOfDay',{key:'night'})` for time of day.

   For a deterministic capture, do not hold a key for a guessed number of
   milliseconds — reach into the stage and set the pose:
     __harness.cam().set(90, 0, 0)   → yaw 90°, no pan, no easing
     __harness.cam().get()           → { yawDeg, pan, moving, terrainKey, … } */
const CAMKEYS = { KeyW:'fwd', KeyS:'back', KeyA:'left', KeyD:'right', KeyQ:'yawL', KeyE:'yawR', KeyR:'reset' };
const held = Object.create(null);
let camSent = 0, camRaf = 0, camLast = 0;

function camStep(t) {
  camRaf = 0;
  const dt = camLast ? Math.min(0.1, (t - camLast) / 1000) : 0.016;
  camLast = t;
  const dx  = (held.KeyD ? 1 : 0) - (held.KeyA ? 1 : 0);
  const dz  = (held.KeyS ? 1 : 0) - (held.KeyW ? 1 : 0);
  const yaw = (held.KeyE ? 1 : 0) - (held.KeyQ ? 1 : 0);
  if (!dx && !dz && !yaw) { camLast = 0; return; }
  /* Units are per-second and world-ish: 6 tiles/s pan, 90°/s turn. They are the
     harness's guess — the board will own the real rates once it owns a camera. */
  post('camera', { dx: dx * 6 * dt, dz: dz * 6 * dt, yaw: yaw * (Math.PI / 2) * dt });
  camSent++;
  camRaf = requestAnimationFrame(camStep);
}
function pumpCam() { if (!camRaf) camRaf = requestAnimationFrame(camStep); }

window.addEventListener('keydown', (e) => {
  if (e.repeat && CAMKEYS[e.code]) { pumpCam(); return; }   /* the rAF pump owns repeats */
  post('key', { down: true, code: e.code, key: e.key, repeat: !!e.repeat });
  if (CAMKEYS[e.code]) {
    /* R is an EDGE (reset), not an axis — it goes out as board:key and must
       never enter the held set, or the rAF pump would spin forever on a key
       that contributes nothing to dx/dz/yaw. */
    if (e.code !== 'KeyR') { held[e.code] = true; pumpCam(); }
    note('key ' + e.code + ' ↓ → board:key + board:camera (' + CAMKEYS[e.code] + ')');
  } else {
    note('key ' + e.code + ' ↓ → board:key (the board maps WASD/QE/R only)');
  }
});
window.addEventListener('keyup', (e) => {
  post('key', { down: false, code: e.code, key: e.key, repeat: false });
  if (CAMKEYS[e.code]) delete held[e.code];
});
/* A window that loses focus never delivers the keyup, which would leave a key
   stuck down and the rAF pump running forever. */
window.addEventListener('blur', () => { for (const k in held) delete held[k]; });

/* ── READY GATE ──────────────────────────────────────────────────────
   __harnessReady flips only when all three of the required conditions hold:
     1. the stage reported board:ready,
     2. the scenario finished going out (pushedAt is set — and it is set AFTER
        the awaited sprite slicing, so no unit can still be an empty def), and
     3. one full second of real animation has elapsed since that push, which is
        checked by BOTH wall clock and ≥3 board:rects (4/sec ⇒ ≥0.75 s of
        frames actually rendered).
   The degraded escape hatch exists because rAF genuinely does not fire in some
   embedded viewers (CLAUDE.md's Browser-pane note). Rather than hang a
   screenshotter for 30 s, give up after 6 s, flip ready anyway, and SAY SO on
   `window.__harnessDegraded` so nobody mistakes a frozen board for a rendered
   one. */
const readyTick = setInterval(() => {
  if (window.__harnessReady) { clearInterval(readyTick); return; }
  if (!boardReady || !pushedAt) return;
  const age = performance.now() - pushedAt;
  if (age >= 1000 && rectsSeen >= 3) { window.__harnessReady = true; clearInterval(readyTick); return; }
  if (age >= 6000) {
    window.__harnessDegraded = 'no board:rects after ' + Math.round(age) +
      'ms — the stage RAF loop is probably not running';
    note(window.__harnessDegraded, true);
    window.__harnessReady = true; clearInterval(readyTick);
  }
}, 100);

/* Driver handle: `__harness.post('timeOfDay',{key:'night'})`,
   `__harness.push()` to re-send, `__harness.scenes` to enumerate. */
window.__harness = {
  scene: NAME, scenes: Object.keys(SCENES), data: SCENE,
  shipped: !!SCENE.shipped, kind: KIND, hostMode: HOSTMODE,
  post: post, push: pushScene, frame: frame,
  errors: errors,
  /* HEXSPEC §4's round-trip assertion, run inside the stage. gw() and
     worldToTile() are hand-derived analytic inverses with nothing else tying
     them together, so this is the only thing that can catch a parity slip —
     and a parity slip is invisible in a screenshot. Same-origin iframe, so we
     call straight into it rather than inventing a protocol message for a test
     hook the game must never fire. */
  hexCheck: (opts) => {
    const w = frame.contentWindow;
    if (!w || typeof w.__bbHexCheck !== 'function')
      return { ok:false, error:'board has no __bbHexCheck (not loaded yet?)' };
    return w.__bbHexCheck(opts);
  },
  /* 🎥 The stage's camera probe, reached straight through the same-origin
     iframe. `set(yawDeg, panX, panZ)` jumps to a pose with no easing (the
     clamp still runs), which is the only way a screenshot rig can assert the
     angle a capture was taken at — yaw is not visible in a PNG. `get()`
     reports the pose AND the live terrainKey, so a test can prove the baked
     ground layer actually re-keyed when the camera moved. */
  cam: () => {
    const w = frame.contentWindow;
    return (w && w.__bbCam) || { error: 'board has no __bbCam (not loaded yet?)' };
  },
  /* The most recent board:rects payload as the HOST sees it — {rects, tiles}.
     Compare against the board's own live unitScreenBox() to measure how stale
     an anchored overlay is at any moment. */
  rects: () => lastRects,
  /* `camSent` counts board:camera posts that left the parent. */
  state: () => ({ boardReady, pushedAt, rectsSeen, ready: window.__harnessReady,
                  degraded: window.__harnessDegraded || null,
                  shipped: !!SCENE.shipped, hostMode: HOSTMODE,
                  host: { w: Math.round(hostBox.width), h: Math.round(hostBox.height) },
                  heldKeys: Object.keys(held), camSent: camSent })
};

})();
</script>
</body>
</html>
