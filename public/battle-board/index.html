<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythic Spellbook — Battle Board (Stage Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=EB+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   MYTHIC SPELLBOOK — BATTLE BOARD / STAGE PROTOTYPE
   Single file, no libraries, no external art. Procedural everything.

  ╔═════════════════════════════════════════════════════════════════════════╗
  ║  PORT BRIEF FOR CLAUDE CODE — THREE.JS + WEBGPU                          ║
  ║                                                                            ║
  ║  This file is the ART + BEHAVIOUR TARGET, not the shipping renderer.       ║
  ║  It is written with a hand-rolled perspective projector so the camera,     ║
  ║  lighting, sprite motion and summon choreography can be tuned and seen     ║
  ║  today. Port it to Three.js with the WebGPURenderer, keeping every         ║
  ║  number below — they are the look.                                         ║
  ║                                                                            ║
  ║  1) CAMERA — match exactly. See CONFIG.camera.                            ║
  ║       PerspectiveCamera(fov 38°, near .1, far 200)                        ║
  ║       fov 39.5° · position (0, 9.04, 9.76) · lookAt (0, 0.30, 0.20)       ║
  ║       ≈ 41° downward pitch — the low hero angle from the reference.       ║
  ║       Board is 8 wide × 7 deep, tiles of 1 world unit. NOT ortho.        ║
  ║       Keep the projection centre biased to SAFE.centre (below) so the      ║
  ║       stage sits in the gap between the UI panels.                        ║
  ║                                                                            ║
  ║  2) RENDERER — WebGPU first, WebGL2 fallback:                             ║
  ║       new THREE.WebGPURenderer({ antialias:true })                        ║
  ║       renderer.setPixelRatio(min(devicePixelRatio, 2))                    ║
  ║       ACESFilmic tone mapping, exposure 1.05, sRGB output.                ║
  ║       Post chain: bloom (strength .55, radius .4, threshold .82) →        ║
  ║       subtle vignette → film grain 0.015. The glow on runes, braziers     ║
  ║       and summons is expected to come from bloom, not from the sprites.   ║
  ║                                                                            ║
  ║  3) SPRITES — "crisp" is the requirement. Rules:                          ║
  ║       • Units are camera-facing billboards on a PlaneGeometry, NOT        ║
  ║         full 3D meshes. Use THREE.Sprite or a Y-billboarded plane so      ║
  ║         they never lean with the camera.                                  ║
  ║       • Texture filter: magFilter = NearestFilter (or LinearMipmap +      ║
  ║         anisotropy 8 for painted art). NO blur on the silhouette.         ║
  ║       • alphaTest 0.5 so edges stay hard and they cast crisp shadows.     ║
  ║       • Sprite sheets: 8-frame idle, 8-frame walk, 6-frame attack,        ║
  ║         6-frame hurt, 10-frame death, driven at 12fps by UV offset in     ║
  ║         a custom material — NOT by swapping textures per frame.           ║
  ║       • Movement is tile-to-tile with the exact easing in moveUnit():     ║
  ║         cubic ease-in-out over 340ms + a 0.28-unit hop arc + squash on    ║
  ║         take-off and land + dust burst on landing. Snap to tile centre    ║
  ║         at the end — never leave a unit off-grid.                         ║
  ║       • Position rounding: snap final screen position to whole device     ║
  ║         pixels to stop shimmer on slow drifts.                            ║
  ║                                                                            ║
  ║  4) SUMMON — the Yu-Gi-Oh beat, sequenced in summonSequence():            ║
  ║       t0     card lifts out of the hand, tilts to face the camera, glow   ║
  ║       160ms  card flies along a bezier to the target tile, rotating flat  ║
  ║       520ms  card lands face-down, tile rune circle ignites               ║
  ║       640ms  card FLIPS face-up (rotateY 180°) — the reveal               ║
  ║       780ms  white flash + shockwave ring + pillar of light from the tile ║
  ║       820ms  UNIT RISES out of the tile (y −1.1 → 0) over 420ms with a    ║
  ║              back-ease, scaling 0.7 → 1.0                                 ║
  ║       900ms  CARD DISSOLVES into embers and is destroyed. The card must   ║
  ║              never return — the sprite is now the unit of record.         ║
  ║       1350ms landing thump, dust ring, unit enters idle loop              ║
  ║       In Three.js the flying card is a textured plane in the same scene   ║
  ║       (so it lights correctly), not a DOM element.                        ║
  ║                                                                            ║
  ║  5) DYNAMIC LIGHT — the sun/moon MUST match the battle's time of day.     ║
  ║       BATTLE.timeOfDay is the source of truth and comes from the match    ║
  ║       state (the Weather card: Daytime / Dusk / Night / Dawn). Each       ║
  ║       preset in TIME_PRESETS gives azimuth, elevation, colour, intensity, ║
  ║       ambient, sky gradient and fog. Build them as:                       ║
  ║         DirectionalLight (sun or moon)  — castShadow, PCFSoft, 2048 map,  ║
  ║           shadow camera fitted to the board bounds                        ║
  ║         HemisphereLight  (sky → ground bounce)                            ║
  ║         AmbientLight     (preset.ambient)                                 ║
  ║         + rim light opposite the key, tinted by preset.rim                ║
  ║       Shadows: unit shadow direction and length are derived from the      ║
  ║       light vector (see lightVector()) — at dusk they stretch long        ║
  ║       across the tiles, at noon they pool underfoot. Braziers add         ║
  ║       PointLights (flicker 8Hz, radius 4) that survive at night when      ║
  ║       the sun preset dims out.                                            ║
  ║       When the weather card flips mid-match, LERP between presets over    ║
  ║       ~2.5s — never cut.                                                  ║
  ║                                                                            ║
  ║  6) BATTLEMAP EDITOR — THIS map object is the format. Point the editor    ║
  ║     at it and let it read/write the same JSON:                            ║
  ║         MAP = { id, name, cols, rows, timeOfDay, ground,                  ║
  ║                 tiles:[{x,z,type,prop,elev,rot}], spawns:{mine,foe} }     ║
  ║       tile.type : 'normal' | 'blocked' | 'hazard' | 'objective' | 'spawn' ║
  ║       tile.prop : null | 'house' | 'wreck' | 'crater' | 'barricade'       ║
  ║                   | 'pylon' | 'bones'                                     ║
  ║       tile.elev : world units of raise (0, .18, .36 …) — the renderer     ║
  ║                   already offsets geometry, shadows and unit feet by it.  ║
  ║       Editing a tile should hot-reload the stage with no page refresh —   ║
  ║       call buildStage() again, which is pure from MAP.                    ║
  ║       Props are billboards too; swap them for GLTF instances if you       ║
  ║       want parallax, but keep the same anchor + footprint.                ║
  ║                                                                            ║
  ║  7) UI SAFE AREAS — NO UI IS DRAWN HERE ON PURPOSE. The stage is inset    ║
  ║     to leave the gutters the existing battle HUD needs (matching the      ║
  ║     live screenshot):  left 384 · right 244 · top 78 · bottom 292 (css    ║
  ║     px at 1440p, scaled proportionally). SAFE in CONFIG. Mount the        ║
  ║     existing HUD as transparent DOM over this canvas — do not rebuild     ║
  ║     it, and do not let the stage grow into those gutters.                 ║
  ║     Press G to toggle the guide overlay while developing.                 ║
  ║                                                                            ║
  ║  8) KEEP THESE FUNCTIONS — port them 1:1, they are the game board API:    ║
  ║       buildStage()            rebuild everything from MAP                 ║
  ║       tileAt(x,z) / tileKey   grid lookup                                 ║
  ║       spawnUnit(def,x,z,side) place a unit instantly                      ║
  ║       summonUnit(cardId,x,z)  the full card→sprite ceremony               ║
  ║       moveUnit(id,x,z)        crisp tween with hop + dust                 ║
  ║       attackUnit(id,tid)      lunge, impact flash, damage float           ║
  ║       killUnit(id)            death dissolve → grave                      ║
  ║       setTimeOfDay(key)       lerp the whole lighting rig                 ║
  ║       focusTile(x,z) / clearFocus()                                       ║
  ║       Board.on('tileClick'|'unitClick'|'cardPlayed'|'summonComplete')     ║
  ║     These already dispatch CustomEvents — replace the demo bodies, keep   ║
  ║     the signatures so the HUD wiring never changes.                       ║
  ╚═════════════════════════════════════════════════════════════════════════╝ */
:root{ --gold:#d2a44e; --gold-hi:#f6dc95; }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:100%; height:100%; overflow:hidden; background:#05040a; }
body{ font-family:"EB Garamond",serif; color:#e9dab2; user-select:none; }
/* NOTE: <canvas> is a REPLACED element — `inset:0` alone does NOT stretch it
   (it falls back to the intrinsic 300x150). Always size it explicitly. */
#stage{ position:fixed; top:0; left:0; width:100vw; height:100vh; display:block;
        /* THE OPENING (see THE REVEAL) scales this element. transform-origin is
           the camera's optical centre, NOT 50% 50% — CONFIG.viewShiftY lifts the
           projection, so pulling back about the box centre slides the horizon.
           `will-change` is what promotes the canvas to its own compositor layer,
           which is the entire reason the opening survives a blocked main thread. */
        transform-origin:50% 46%; will-change:transform; }

/* ══════════════════════════════════════════════════════════════════════════
   THE VEIL — the darkness the board is revealed out of.
   Opacity only, on its own layer, so it animates on the COMPOSITOR. It must
   never take a pointer event: input is live from the first frame and the
   opening is not allowed to stand in front of it. */
#veil{ position:fixed; inset:0; z-index:9; pointer-events:none; opacity:0;
       will-change:opacity; contain:strict;
       background:radial-gradient(118% 88% at 50% 46%,
         rgba(3,2,7,.72) 0%, rgba(2,1,5,.94) 44%, #010104 76%); }

/* summon card — DOM overlay in the prototype; becomes a textured plane in Three.js */
.flycard{
  position:fixed; z-index:6; width:186px; height:260px; border-radius:10px;
  transform-style:preserve-3d; pointer-events:none; will-change:transform,opacity;
  transition:none;
}
.flycard .face, .flycard .back{
  position:absolute; inset:0; border-radius:7px; backface-visibility:hidden; overflow:hidden;
  border:2px solid rgba(246,220,149,.85);
  box-shadow:0 10px 26px rgba(0,0,0,.8), 0 0 26px rgba(246,220,149,.4);
}
.flycard .back{
  transform:rotateY(180deg);
  background:radial-gradient(60% 45% at 50% 45%, rgba(140,70,220,.5), transparent 70%), linear-gradient(160deg,#1b1430,#0a0714);
  display:grid; place-items:center; color:rgba(246,220,149,.75); font-size:58px;
}
.flycard .face{ display:flex; flex-direction:column; }
.flycard .art{ flex:1; display:grid; place-items:center; }
.flycard .nm{
  padding:8px 5px; text-align:center; font-family:"Cinzel",serif; font-weight:700; font-size:15px;
  letter-spacing:.04em; color:#f6dc95; background:linear-gradient(180deg, rgba(12,9,18,.9), rgba(6,4,10,.95));
  border-top:1px solid rgba(246,220,149,.4);
}

/* hand — placeholder cards so the summon can be demoed. The REAL hand is part of
   the existing HUD; Claude Code replaces this strip with it. */
.hand{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  display:flex; gap:15px; z-index:5; pointer-events:auto;
}
.hcard{
  width:186px; height:260px; border-radius:10px; position:relative; cursor:pointer;
  border:2px solid rgba(210,164,78,.6); overflow:hidden;
  background:linear-gradient(170deg,#161024,#08050e);
  box-shadow:0 10px 22px rgba(0,0,0,.75);
  transition:transform .22s cubic-bezier(.2,.9,.3,1.3), box-shadow .22s, border-color .22s;
}
.hcard:hover{ transform:translateY(-20px) scale(1.05); border-color:rgba(246,220,149,.9); box-shadow:0 18px 34px rgba(0,0,0,.8), 0 0 26px rgba(246,220,149,.35); }
.hcard.armed{ transform:translateY(-26px) scale(1.07); border-color:#f6dc95; box-shadow:0 0 0 2px rgba(246,220,149,.5), 0 0 34px rgba(246,220,149,.55); }
.hcard .cost{
  position:absolute; top:9px; left:9px; z-index:2; width:44px; height:44px; border-radius:50%;
  display:grid; place-items:center; font-family:"Cinzel",serif; font-weight:900; font-size:21px;
  color:#f6ecd2; border:1.5px solid rgba(246,220,149,.8); background:rgba(8,6,14,.9);
}
.hcard .art{ position:absolute; inset:0; display:grid; place-items:center; }
.hcard .nm{
  position:absolute; left:0; right:0; bottom:0; padding:8px 4px; text-align:center;
  font-family:"Cinzel",serif; font-weight:700; font-size:15px; color:#f6dc95;
  background:linear-gradient(180deg, rgba(10,8,16,.5), rgba(6,4,10,.96));
}
.hcard .el{
  position:absolute; left:0; right:0; bottom:34px; text-align:center;
  font-family:"Cinzel",serif; font-weight:700; font-size:12px; letter-spacing:.16em;
}

.hint{
  position:fixed; left:50%; bottom:296px; transform:translateX(-50%); z-index:7;
  font-size:12.5px; font-style:italic; color:#6e6350; white-space:nowrap;
  animation:hintFade 7s ease forwards; pointer-events:none;
}
@keyframes hintFade{ 0%,70%{ opacity:1; } 100%{ opacity:0; } }
/* 🛈 the tile readout — see TILE TOOLTIP */
#tileTip{ position:fixed; left:0; top:0; z-index:40; pointer-events:none; opacity:0;
  transform:translate(-50%,-100%); transition:opacity .18s ease; min-width:170px; max-width:250px;
  padding:8px 11px 9px; border-radius:8px; border:1px solid rgba(120,190,255,.55);
  background:linear-gradient(180deg,rgba(10,20,38,.94),rgba(6,12,24,.94));
  box-shadow:0 6px 20px rgba(0,0,0,.6), 0 0 14px rgba(70,150,255,.25);
  color:#dce9ff; font:12px/1.35 system-ui,sans-serif; }
#tileTip.on{ opacity:1; }
#tileTip .tt-h{ font-weight:700; font-size:13px; color:#fff; margin-bottom:4px; letter-spacing:.02em; }
#tileTip .tt-r{ display:flex; justify-content:space-between; gap:10px; }
#tileTip .tt-k{ color:#8fb2dc; }
#tileTip .tt-v{ text-align:right; }
#tileTip .tt-up{ color:#8ff0a4; }
#tileTip .tt-dn{ color:#ff9a8a; }
#tileTip .tt-n{ color:#9fb0c8; font-size:11px; margin-top:4px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<!-- the darkness the opening pulls out of — see THE REVEAL -->
<div id="veil" aria-hidden="true"></div>
<div id="tileTip" role="tooltip" aria-hidden="true"></div>
<!-- The demo hand + hint are STANDALONE ONLY. Embedded, the real hand is
     the game's own HUD mounted as transparent DOM over this canvas. -->
<div class="hand" id="hand"></div>
<div class="hint" id="hint">click a card, then a tile — or click a unit and a tile to move it</div>


<script>window.BB_BUILD='v121v168-graveart';
"use strict";
/* 🔌 BBX — THE STAGE HOOK SEAM.
   The board page is a classic (non-module) script, so it cannot `import`.
   Optional ES modules under /src/battle/stage/*.js attach themselves here and
   this file calls them defensively, once per frame, ALWAYS with a working
   fallback behind them. Module scripts are deferred, so for the first frame or
   two none of these exist — every call site must be optional-chained. A missing
   module must degrade, never throw: `frame()` is wrapped in a one-shot crash
   guard (frameErr) and a thrown hook would freeze the board on a red error card.
     window.BBX.vista    = { draw(api), grade(api) }
     window.BBX.tilefx   = { drawStates(api), drawSurfaces(api), drawStatesOver(api) }
     window.BBX.dressing = { build(api), items(api) }
     window.BBX.terrain  = { detail(api, g, tile) }   ← baked, see bakeTerrain()
   `api` is rebuilt every frame by buildApi(). Do NOT rename any of its keys:
   three sibling modules are written against it verbatim. */
window.BBX = window.BBX || {};
/* ══════════════════════════════════════════════════════════════════
   CONFIG — camera + UI safe areas. Port these numbers verbatim.
   ══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  camera:{ fov:39.5*Math.PI/180, pos:{x:0,y:9.04,z:9.76}, target:{x:0,y:0.30,z:0.20} },
  /* The arena (board + its four pillars) is taller above the floor than below
     it, so it does not sit centred in the safe box on its own. This nudges the
     whole projection so the scene is optically centred, which is what lets the
     FOV be tightened without the pillar tops clipping. */
  viewShiftY: -40,
  /* gutters reserved for the EXISTING battle HUD (added by Claude Code) */
  SAFE:{ left:384, right:244, top:78, bottom:292 },
  /* `tile` is now the hex CIRCUMRADIUS (centre → vertex) in world units; it
     used to be the edge length of a square cell. 1/√3 is not arbitrary: it
     makes hexW = tile*√3 = 1.0, so one pointy-top hex is exactly as WIDE as
     the 1.0 square it replaces. Unit sprites are sized from `def.h` in world
     units and know nothing about the lattice, so keeping the width fixed is
     what keeps a unit the same size relative to its tile as before the hex
     conversion — pick any other number and every sprite silently rescales. */
  tile: 1/Math.sqrt(3), wall:0.30
};

/* ══════════════════════════════════════════════════════════════════
   MAP — THE BATTLEMAP EDITOR OWNS THIS OBJECT. Read/write as JSON.
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   LOCATIONS — a LOCATION CARD swaps the board art (and optionally the
   time of day). Register every location here; the editor and the card
   database both read this table.
     image     : ground texture, laid flat on the play plane in perspective
     backdrop  : the environment BEHIND the board — the world this location
                 sits in. Drawn behind the arena and graded by the sky, so a
                 location card changes the whole horizon, not just the floor.
     horizon   : 0..1 down the BACKDROP art, where its ground line sits. That
                 line is anchored to the board's far edge, so getting it wrong
                 slides the whole world up or down. Defaults to 0.62.
     timeOfDay : null keeps the current sky, or force 'dawn|day|dusk|night'
     tint      : optional extra colour grade over the ground
   Play one with:  Board.setLocation('dark-forest')
   ══════════════════════════════════════════════════════════════════ */
const LOCATIONS = {
  /* 🚫 THE NEUTRAL DEFAULT — TABLETOP BAR §6 / Ask G. `backdrop:null` means
     "no painted scenery plate behind the board", and it is a real VALUE now,
     not an omission: loadLocation() below has an else arm that CLEARS the sky,
     and syncBackdropPlates() has a branch for an explicitly-null src. Before
     those two existed a null backdrop silently meant "keep the previous sky",
     which is why public/index.html's _bbLocationBackdrop() carries a "⚠ NEVER
     RETURNS null" comment. That comment describes the bug this pair fixes.
     ⚠ This mirrors the GAME's own default id: a battle with no location card
     in play resolves to 'battlefield' (public/index.html _bbActiveLocationId),
     so the standalone page and a real match now open on the same world. */
  'battlefield':{ name:'Battlefield', image:'../assets/board/locations/dark-forest-ground.jpg', backdrop:null, timeOfDay:null, tint:null },
  'dark-forest':{ name:'The Dark Forest', image:'../assets/board/locations/dark-forest-ground.jpg', backdrop:'../assets/board/locations/dark-forest-backdrop.jpg', timeOfDay:null, tint:null },
  /* Register the rest as their art lands — same shape:
  'open-field'   :{ name:'Open Field',    image:'assets/loc/open-field.jpg',
                    backdrop:'assets/loc/open-field-bg.jpg',    timeOfDay:'day'   },
  'infected-city':{ name:'Infected City', image:'assets/loc/infected-city.jpg',timeOfDay:'dusk'  },
  'crystal-caves':{ name:'Crystal Caves', image:'assets/loc/crystal-caves.jpg',timeOfDay:'night' },
  */
};
/* ⚠ WAS 'dark-forest'. See the 'battlefield' entry above: the forest is a
   location CARD and keeps its art; it is no longer what an unconfigured board
   shows. setLocations() preserves whatever DEFAULT_LOCATION names, and the
   host registers its own 'battlefield' row over this one. */
const DEFAULT_LOCATION = 'battlefield';
/* The HOST registers every playable location (from the card database /
   Battlemap Editor) with Board.setLocations({...}). Same shape as above. */
function setLocations(table, keepDefault){
  if (!table || typeof table !== 'object') return;
  if (!keepDefault) for (const k in LOCATIONS) if (k !== DEFAULT_LOCATION) delete LOCATIONS[k];
  for (const k in table){
    const L = table[k]; if (!L) continue;
    LOCATIONS[k] = { name:L.name || k, image:L.image || null, backdrop:L.backdrop || null,
                     timeOfDay:L.timeOfDay || null, tint:L.tint || null,
                     /* 0..1 down the BACKDROP art, where its ground line is.
                        Anchored to the board's far edge — see syncBackdropPlates. */
                     horizon:(typeof L.horizon === 'number') ? L.horizon : 0.62 };
  }
}

/* 📐 BOARD SIZE — ONE source of truth in this file. HEXSPEC §7 pins the shipped
   board to BOARD_W × BOARD_H on the GAME side and requires the canvas to be FED
   from them, never to re-type them; the host does that through `board:init` /
   `board:map`. This object is only the fallback for a payload that carries no
   dimensions (the standalone preview, and any host that predates the resize).
   Do not write 14 or 12 anywhere else in this file. */
const BOARD_DEFAULT = { cols:14, rows:12 };

const MAP = {
  id:'ruins-downtown-01', name:'Overgrown Downtown',
  cols: BOARD_DEFAULT.cols, rows: BOARD_DEFAULT.rows,
  timeOfDay:'day',
  location: DEFAULT_LOCATION,
  ground:{ base:'#6b5c3e', accent:'#8a7846' },
  tiles:[
    { x:6, z:1, prop:'barricade' },
    { x:7, z:2, prop:'pylon', elev:0.18 },
    { x:0, z:3, prop:'bones' },
    { x:5, z:3, prop:'crater', type:'hazard' },
    { x:3, z:3, type:'objective' },
    { x:4, z:3, type:'objective' },
    { x:2, z:4, prop:'crater', type:'hazard' },
    { x:0, z:5, prop:'pylon', elev:0.18 },
    { x:6, z:6, prop:'bones' }
  ],
  /* live board events — the game's EVENT SYSTEM owns this list. EMPTY by design:
     the host pushes the match's real events via board:init / board:events. It used
     to hold three hardcoded demos, which is why the stage showed events that were
     not in the game. */
  events:[],
  spawns:{ mine:[[2,6],[3,6],[4,6],[5,6]], foe:[[2,0],[3,0],[4,0],[5,0]] }
};

/* ══════════════════════════════════════════════════════════════════
   TIME OF DAY — sun/moon presets. BATTLE.timeOfDay drives the rig.
   ══════════════════════════════════════════════════════════════════ */
const TIME_PRESETS = {
  dawn:{ az:-0.85, elev:0.20, key:'#ffb46a', keyI:0.95, ambient:'#3a3350', ambI:0.42,
         sky:['#1a1230','#4a2c3a','#8a5a44'], fog:'#2a1c2a', rim:'#7fa8ff', body:'sun', disc:'#ffd9a0', haze:.34 },
  /* 🔴 `day` az WAS 0.28 AND THAT IS WHY THE BOARD'S CAST SHADOW COULD NOT BE SEEN.
     az/elev are the ONLY inputs to lightVector(), and the board's shadow is thrown
     along it by shadowSweep() in vista.js at length PLINTH_H/(lv.y + .22). At
     az 0.28 the sun sat 16 degrees off dead-behind: lv.x = sin(.28)cos(.78) = 0.196,
     so of the 3.47 world the shadow reached, only 0.68 of it was LATERAL — about
     40 px — against a board whose kerb foot already stands 0.645 outside the lattice
     and whose skirt reaches a further 1.0 (SKIRT_REACH). The shadow was real and
     measurable every round and it landed underneath the thing casting it. Four
     rounds measured it; none asked where it went. See the PLINTH_H note in vista.js
     for the full history — this row is the other half of it.
     0.95 rad = 54 degrees off dead-behind: lv.x = sin(.95)cos(.78) = 0.578, lateral

/* 🌐 CROSS-ORIGIN ART GOES THROUGH OUR OWN PROXY, AND IT HAS TO.

     Access to image at 'https://cdn.phototourl.com/pro/….png' from origin
     'https://playmythicspellbook.com' has been blocked by CORS policy:
     No 'Access-Control-Allow-Origin' header is present.

   frame lists, _lastFrame — speaks in the host's URLs, so keying on the proxied
   one would miss every lookup and re-request the image forever. */

    if (!src || /^data:|^blob:/.test(src)) return src;
    const u = new URL(src, location.href);
    if (u.origin === location.origin) return src;
    return '/api/art/proxy?url=' + encodeURIComponent(u.toString());
  } catch (e){ return src; }
}

    rec.img.onerror = () => { rec.ok = false; rec.bad = true; };

   given seed actually placed. That is a six-fold regression in board-boot
   bandwidth for art the match cannot show.

   that is not on the board costs nothing; one that arrives later (the host
   pushing a new map) re-enters through the same path, because terrainKey()

   <img> is a LAZY image: whatever draws it may have to decode it, at its own

   accelerated band still decoded — cc's GPU decode cache is keyed by scale).

   is filtered to the live map, counting the whole table would fold in nineteen
   files that are never fetched on this board — the count could never reach them,
   which is harmless for the key's identity but makes it a number nobody can
   reason about. Counting the requested set keeps "one more painting arrived"
   meaning exactly that. */

  for (let i = 0; i < srcs.length; i++){ const r = ART_CACHE[srcs[i]]; if (r && r.ok) n++; }

/* Paint one tile's art onto its projected top face. `P` is the slab hexagon,
   `col` the lit swatch the slab would otherwise be — laid over the art in
   MULTIPLY at low strength so the painting still takes the board's light
   (day, dusk, night, the lambert falloff and the height lift all come through
   `col`) instead of glowing at one fixed exposure. */
function drawTileArt(art, P, col, tx, tz){
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < P.length; i++){
    if (P[i].x < minX) minX = P[i].x; if (P[i].x > maxX) maxX = P[i].x;
    if (P[i].y < minY) minY = P[i].y; if (P[i].y > maxY) maxY = P[i].y;
  }
  const bw = maxX - minX, bh = maxY - minY;
  if (!(bw > 2) || !(bh > 2)) return false;
  /* A hair of overscan so the painting meets the inset edge with no halo —
     "make them connect" — the clip is what keeps it inside the cell. */
  const ox = bw * .02, oy = bh * .02;
  ctx.save();
  pathPoly(P); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  try { ctx.imageSmoothingQuality = 'high'; } catch (e) {}
  /* 🧱 `crop` — SAMPLE THE MATERIAL, NOT THE WHOLE PICTURE.
     The elemental paintings are complete walled arenas: a stone rim, corner
     pillars, and the element in the middle. Drawn whole into a ~60px cell that
     is an entire arena shrunk 19x, and 168 of them read as one repeating
     texture — "the tiles are placed into the tiles" rather than being them.
     A cropped entry samples the CENTRE of its top face instead, so the cell
     wears lava or ice or crystal and the board's own cliffs, seams and light
     supply the edges (which is what they already do for the five city
     surfaces, and why those never had this problem).
     ⚠ OPT-IN PER ENTRY. The legacy paintings are not arenas — Street 1.png is
     a flat top-down plate at top:1 and the grass and water are already tile
     material — so cropping them would simply zoom in on art that was right.
     No `crop`, no change in behaviour. */
  const _cr = +art.crop || 0;
  if (_cr > 0 && _cr < 1){
    const iw = art.img.width || 1, ih = art.img.height || 1;
    const faceH = ih * art.top;
    const sw = iw * _cr, sh = faceH * _cr;
    /* 🎲 SLIDE THE WINDOW PER CELL. A fixed centre crop hands every lava tile
       the identical pixels, so a lava region becomes one image stamped forty
       times — the repetition the crop exists to cure, just at a smaller scale.
       The window slides within whatever margin the crop leaves, seeded from the
       cell so it is stable: the ground is baked once and re-baked on every
       light change, and a Math.random() here would make the whole field crawl
       every time the sun moved. Same rule the rest of this file follows.
       Kept off the very edge (0.86) so a sample never clips the arena's stone
       rim back into frame. */
    const mx = Math.max(0, iw - sw), my = Math.max(0, faceH - sh);
    const jx = (_sHash(tx | 0, tz | 0, 901) - 0.5) * 0.86 + 0.5;
    const jy = (_sHash(tx | 0, tz | 0, 902) - 0.5) * 0.86 + 0.5;
    ctx.drawImage(art.img, mx * jx, my * jy, sw, sh,
                  minX - ox, minY - oy, bw + ox * 2, bh + oy * 2);
  } else {
    ctx.drawImage(art.img, minX - ox, minY - oy, bw + ox * 2, (bh + oy * 2) / art.top);
  }
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = mixHexRaw(col, '#ffffff', .45);
  pathPoly(P); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  return true;
}

/* 🧱 THE TABLETOP RIM — what makes a hex a PIECE rather than a patch.
   Owner: "it still looks painted on instead of looking like a 2.5d where it IS

   border around it, side walls under that. drawTileArt samples the CONTENT — it
   has to, because a whole arena at 60px is a smudge, which is what the crop
   fixed — and the border went with it. Without a border the material reads as
   ground seen through a hex-shaped window, which is exactly "painted on".
   So the border is DRAWN rather than sampled. Outside-in:
     • a stone kerb on the outer edge, widest and darkest, clipped inside the
       tile so it can never bleed onto a neighbour
     • an inner shadow, so the content sits DOWN inside the frame instead of
       floating on top of it
     • a LIT chamfer just inside the kerb — this is the whole illusion. A flat
       edge with a bright line along it reads as a bevel, and a bevel is what
       tells the eye the piece has thickness.
   ⚠ THE LIGHT DECIDES WHICH EDGES ARE BRIGHT. A rim of uniform brightness is a
   drawn outline, which is the "grid drawn on a photo" read this board took the
   cell division out of its stroke to avoid. The chamfer is lit per edge off
   LIGHT.key, so sunward edges catch and the rest fall away and the frame turns
   with the time of day like everything else here.
   🔴 IT USED TO SAY "ELEMENTAL SURFACES ONLY", AND THAT WAS A REASONED CHOICE,
   NOT AN OVERSIGHT — 🧨 OVERRIDDEN 2026-09-14, piece tile-edge-physical.
   The argument it made was good: "the five city surfaces are continuous ground,
   and a road with a stone frame around every hex is a tiled floor, not a
   street". What overrules it is TABLETOP-BAR §3, which is the owner's LOUDEST
   note ("make it where it is like each tiles are different realms … not painted
   together like the screenshot"), spelled out as §3.1 — every tile has a visible
   boundary on ALL SIDES — and §3.3 — that boundary must be a PHYSICAL edge, and
   "a flat stroked hex outline is the cheap version and does not pass on its
   own". Under the old gate the ≥60% of the board §4 wants to be basics got
   exactly that cheap version and nothing else: the 1px rgba(210,205,190,.10)
   outline further down this file was the ONLY mark a grass or asphalt tile ever
   received on all six of its edges.
   THE OLD ARGUMENT IS ANSWERED RATHER THAN IGNORED, and rimSpec() below is the
   answer: the kerb stops being STONE. A road is edged in its own concrete, turf
   in its own cut earth, standing water in the dark wet line where it meets the
   bank. What §3 asks for is that the piece END somewhere; it never asked for
   sandstone around a carriageway. If a future reader wants the gate back, the
   thing to argue with is §3.1, not this function.
   ⚠ COST, MEASURED AND NOT GUESSED. This used to run on ~18% of a board (the
   ELEM_TEX keys); it now runs on all 168 field tiles. Parked that is one bake.
   MOVING IT IS EVERY FRAME — drawBoard bypasses the terrain cache while
   CAMERA.moving, deliberately, and a host board:camera pulse can set that even
   though this page's own WASD keys are currently dead (camAction returns null
   at its first statement). So the moving frame time is the number that decides
   this, and on the frozen .gauntlet/tabletop 'mixed' fixture, A/B'd in one page
   session against this same function gated back to ELEM_TEX:
     1600x900   bake 39.4 → 44.1 ms  (+4.7, +12%)   field sweep 22.6 → 29.4 ms
     802x688    bake 21.5 → 25.8 ms  (+4.3, +20%)   field sweep  7.0 → 11.4 ms
   i.e. ~28 microseconds of extra paint per tile, flat in the number of tiles.
   Keep the op count per tile where it is — one clip, two clipped strokes, six
   open segments — and if a later piece needs it back, the cheap lever is the
   r > 6 early-out, not thinning the kerb. */
function drawTileRim(P, S, lv, surf){
  if (!P || P.length < 3) return;
  let cx = 0, cy = 0, r = 0;
  for (let i = 0; i < P.length; i++){ cx += P[i].x; cy += P[i].y; }
  cx /= P.length; cy /= P.length;
  for (let i = 0; i < P.length; i++) r = Math.max(r, Math.hypot(P[i].x - cx, P[i].y - cy));
  if (!(r > 6)) return;                    /* too small to frame legibly */
  const R = rimSpec(surf, S);
  const w = Math.max(R.wMin, r * R.wf);    /* kerb width, scales with zoom */
  const stone = R.col;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.save(); pathPoly(P); ctx.clip();
  ctx.strokeStyle = rgba(stone, .92); ctx.lineWidth = w * 2;
  pathPoly(P); ctx.stroke();
  /* 🩶 THE CONTACT SEAM — the half of §3.1 a kerb cannot do on its own, and the
     ONLY mark in this file that lands on all six edges of every field tile
     unconditionally.
     WHY IT IS NEEDED AT ALL. The per-edge seam+lip loop in paintTileRec draws
     only where drop[] says there is a STEP, deliberately: an unconditional black
     rule there is the exact bug that loop was written to kill, because it cut a
     same-rung shelf into 168 loose counters. But that leaves a FLUSH boundary
     between two same-surface, same-height tiles with nothing on it, and §3.1's
     own test — a pixel 2px inside an edge must differ from one 2px outside —
     fails there. So the seam moved INSIDE the tile.
     ⚠ AND THAT IS THE WHOLE DIFFERENCE FROM THE BUG, so do not undo it by
     moving this stroke out of the clip. Clipped, a stroke centred on the
     hexagon keeps only its INNER half: this tile darkens its own last ~0.5w of
     material and paints nothing into the joint or onto its neighbour. The rule
     that failed was un-clipped, so it straddled the boundary and the two
     neighbours' strokes stacked into a double-width black line laid over the
     ground — a drawn lattice, not a physical edge.
     It is also not uniform round the tile, which is the other half of why this
     reads as a bevel instead of as a grid: the lit chamfer below sits just
     inside it and is lit PER EDGE off LIGHT.key, so a sunward edge is
     dark-then-bright and the opposite edge is dark-then-dark. That asymmetry
     across a shared boundary is what makes two flush neighbours separable. */
  ctx.strokeStyle = rgba(mixHexRaw(S.lo, '#000000', .45), R.seamA);
  ctx.lineWidth = w * R.seamW;
  pathPoly(P); ctx.stroke();
  ctx.restore();
  const lx = (lv && lv.x) || 0, lz = (lv && lv.z) || 0;
  const lh = Math.hypot(lx, lz) || 1;
  /* 📏 THE CHAMFER SITS A NUMBER OF PIXELS INSIDE THE EDGE, NOT A FRACTION OF
     THE TILE — and this line was 0.93, measured and changed 2026-09-14.
     0.93 is 7% of the circumradius. At the 1600x900 capture every gauntlet
     screenshot is taken at, r = 25.8 and that is 1.8px inside the edge: the
     bevel lands exactly where a critic's "2px inside the edge" sample goes and
     §3.1's test moves hard (median |ΔL| across a flush grass/grass edge 16.1 →
     29.1). At the rect the GAME ships, 802x688, r = 12.0 and the same 7% is
     0.84px — SUB-PIXEL. Measured there the same test went 12.0 → 11.3, i.e. the
     whole bevel illusion evaporated at the only size that matters, while the
     1600x900 number said it had worked. That is the exact failure mode
     TABLETOP-BAR §9 warns about: a rig reporting a confident number about a
     frame the player never sees.
     So the inset is now derived from the KERB WIDTH, which already carries a
     px floor (rimSpec wMin), and floored again in px. The fraction is recovered
     from r rather than written down, so a zoomed-in camera still gets a
     proportional bevel and a zoomed-out one still gets a visible one. The .70
     clamp is a guard, not a tuning: on a tile small enough that the inset eats
     the whole hexagon the chamfer would otherwise invert through the centre. */
  const ci = Math.max(1.3, w * .82);
  const k  = Math.max(.70, 1 - ci / r);
  for (let i = 0; i < P.length; i++){
    const j = (i + 1) % P.length;
    const ex = (P[i].x + P[j].x) / 2 - cx, ey = (P[i].y + P[j].y) / 2 - cy;
    const el = Math.hypot(ex, ey) || 1;
    /* screen y grows downward, so the light's z maps to -y */
    const lam = clamp(.5 + ((ex / el) * (lx / lh) + (ey / el) * (-lz / lh)) * .5, 0, 1);
    ctx.strokeStyle = rgba(mixHexRaw(stone, LIGHT.key, .18 + lam * R.lit), .30 + lam * .48);
    ctx.lineWidth = Math.max(1, w * .62);
    ctx.beginPath();
    ctx.moveTo(cx + (P[i].x - cx) * k, cy + (P[i].y - cy) * k);
    ctx.lineTo(cx + (P[j].x - cx) * k, cy + (P[j].y - cy) * k);
    ctx.stroke();
  }
  ctx.restore();
}

/* 🧱 WHAT MATERIAL IS THIS TILE'S EDGE MADE OF — the price of dropping the
   ELEM_TEX gate, and the thing that answers the objection it was making.
   DERIVED FROM THE TILE'S OWN SURF ENTRY, NOT FROM A NEW TABLE, and that is
   deliberate: §8.2 already asks three tables (_SURF_ORDER / SURF / TILE_ART) to
   stay in sync, a fourth keyed by surface is a fourth thing to forget when the
   owner drops the next plate in (§4.1 promises a new surface is one table row),
   and a surface this file has never heard of still comes out with a correct
   looking edge instead of sandstone. Four families, chosen by how the material
   actually terminates in the world rather than by hue:
     wf    kerb width as a share of the tile's circumradius
     wMin  floor in CSS px, AND IT IS THE HALF OF THIS TABLE THAT WAS MEASURED
           RATHER THAN CHOSEN. Every wf lands between 2.6 and 3.0px at the
           1600x900 capture the gauntlet shoots (r = 25.8) and between 1.2 and
           1.4px at the 802x688 rect the game ships (r = 12.0) — i.e. at the
           size the player plays at, a rim specified only as a fraction is a
           hairline again, which is the exact thing §3.3 refuses. The floors
           below bite ONLY at the small rect: at 1600x900 r*wf wins every time,
           so raising them changes no gauntlet screenshot and changes the
           in-game board a lot. Set against the reference plates, whose painted
           stone rim runs 13-18% of the tile radius.
     lit   how hard the chamfer takes the key — a wet or matte edge catches less
     seamW/seamA  the contact seam, see drawTileRim */
function rimSpec(surf, S){
  /* The 19 elemental plates are PAINTED as walled dioramas — cut-stone rim,
     side walls under it (BAR §1.2) — so the drawn stone kerb is continuous with
     the painting. UNCHANGED from what shipped: surface-tables won this round on
     these tiles and this piece has no business re-tuning them. */
  if (ELEM_TEX[surf]) return { col: mixHexRaw('#6d6455', S.lo, .34), wf:.115, wMin:1.4, lit:.52, seamW:.55, seamA:.34 };
  /* 🛣 ASPHALT — the surface the old gate existed to protect. A carriageway is
     edged in a kerbstone, which is the road's own aggregate seen in shadow, so
     it is mixed out of S.grit and S.lo and not out of '#6d6455'. Narrow: a kerb
     is a lip beside the tarmac, and a wide one is the "tiled floor" the gate
     warned about. The new Street plate already paints kerbstones INSIDE its own
     art (§4.1), so this reads as a continuation of them. */
  if (surf === 'asphalt') return { col: mixHexRaw(S.grit, S.lo, .60), wf:.075, wMin:1.8, lit:.40, seamW:1.15, seamA:.44 };
  /* 💧 WATER has no kerb at all in nature; what reads at the edge of standing
     water is the dark wet line where it meets the bank. So: the thinnest kerb,
     the deepest seam, and the least chamfer — a mirror does not have a bevel. */
  if (surf === 'water')   return { col: mixHexRaw(S.lo, '#000000', .28), wf:.060, wMin:1.6, lit:.24, seamW:1.25, seamA:.46 };
  /* 🌱 EVERYTHING ELSE — grass, dirt, rubble, mud, sand, and any surface added
     after this was written. A cut earth lip: the tile's own shadow colour
     lifted just enough by its own grit to read as a cut FACE rather than as a
     line someone drew. This is the branch that covers the majority of a §4
     board, so it is the one the §3.1 test is actually scored on. */
  return { col: mixHexRaw(S.lo, S.grit, .26), wf:.100, wMin:2.0, lit:.42, seamW:1.10, seamA:.42 };
}

/* ══════════════════════════════════════════════════════════════════
   🖌 SPRITE FILTERING — decided by WHAT THE ART IS, not by which way it
   is being scaled. Read this before touching imageSmoothingEnabled below.
   ══════════════════════════════════════════════════════════════════
   THE RULE THAT WAS HERE, AND WHY IT WAS WRONG TWICE OVER:

       const upscaling = dw > img.width;
       c.imageSmoothingEnabled = !upscaling;   // "crisp when upscaling"

   1. `dw` IS IN CSS PIXELS AND `img.width` IS IN DEVICE PIXELS. The context
      carries the DPR transform (resize() does setTransform(DPR,…)) plus the
      unit's own scaleX/scaleY, so a sprite whose `dw` is 62 covers 124 real
      pixels at DPR 2. Measured on this page, embedded sizing, one 128px-class
      sprite (85x128 — the Atelier's small preset):
        1920x1080 @2  dw 62 vs src 85 → judged DOWNSCALE, truly 1.46x UPSCALE
        2560x1440 @2  dw 82 vs src 85 → judged DOWNSCALE, truly 1.93x UPSCALE
      So on every retina display the test reports the opposite of the truth,
      and the branch that was supposed to protect pixel art never ran — while
      pixel art got smoothed at 1.3–1.7x, which is the "my sprites went to
      mush" complaint.
   2. WHEN IT DID FIRE (3840x2160 @1: dw 123 vs src 85, factor 1.45) it turned
      smoothing OFF for PAINTERLY art, which is the "units look blocky on a
      large board" complaint. Nearest-neighbour at 1.2–2x is the worst case
      there is: it duplicates whole rows and columns in an irregular pattern,
      so a painted edge grows a visible staircase.
   Both reports are the same line, read from the two ends.

   WHAT REPLACES IT
   • The scale is measured in DEVICE pixels, from the live transform.
   • A DOWNSCALE is always smoothed at 'high'. Nearest on a downscale is never
     right for anything — it drops whole source rows, pixel art included — so
     there is nothing to classify and no probe cost on the common path (every
     real unit at every viewport we measured is a 0.05x–0.97x downscale).
   • An UPSCALE asks what the art is, once per decoded image:
       - `def.pixel === true|false` wins outright if the host ever sets it.
         Nothing sets it today; it is the escape hatch for art we misjudge.
       - otherwise the image is MEASURED (see isPixelArt).
   • Pixel art additionally gets its destination rect snapped to whole DEVICE
     pixels, not whole CSS pixels as the old comment claimed. It matters on a
     fractional-DPR display (Windows 125%/150% scaling is common and survives
     the min(dpr,2) clamp): an integer CSS rect is a HALF-device-pixel rect
     there, and a nearest-sampled sprite on a half-pixel grid shimmers.
   ⚠ THE SMOOTHED RECT KEEPS ITS Math.round(), AND THAT WAS MEASURED, NOT
     ASSUMED. The suspicion was that the integer destination quantises position
     and makes slow pans step. It does not: the sub-pixel position lives in the
     CTM translate, which paintSprite never rounds — rounding the rect only
     offsets it by <0.5px. Sliding one sprite across 8 steps of 1/8 CSS px at
     DPR 2 (85x128 source, 41x62 dest) and measuring the alpha-weighted
     centroid, the step should be 0.250 device px every time:
        rounded to CSS px (shipped)  max deviation 0.0071 px  ( 2.8%)
        exact float rect             max deviation 0.0317 px  (12.7%)
        rounded to device px         max deviation 0.0329 px  (13.2%)
     The integer rect is the SMOOTHEST of the three, because a stable integer
     footprint keeps the resample kernel identical at every phase. Removing it
     would have been a regression sold as a fix.
   ⚠ INERT DEBUG SWITCH, same contract as vista.js's __vistaOff: setting
     `window.__bbSpriteLegacy = 1` restores the old CSS-px rule so both builds
     can be measured on one page. Read at call time, never cached. */
const PX_PROBE = { SOFT_MAX: 0.08, FLAT_MIN: 0.35, TILE: 64, MIN_PAIRS: 400, PER_FRAME: 4 };
let _pxCanvas = null, _pxCtx = null, _pxBudget = PX_PROBE.PER_FRAME;
/* decoded image → is-pixel-art. Weak so a texture that falls out of ART_CACHE
   takes its verdict with it; keyed by the Image OBJECT, which artImage already
   guarantees is one-per-src. */
const _pxVerdict = new WeakMap();
/* ── THE MEASUREMENT, AND THE NUMBERS BEHIND THE THRESHOLDS ───────────────
   Over horizontally adjacent pairs of fully-opaque pixels, sampled 1:1 (never
   resampled — resampling would manufacture the very anti-aliasing we are
   looking for) from four 64x64 windows spread across the image:
     flat = fraction of pairs that are byte-identical
     soft = fraction of pairs separated by 1..6 levels  ← the anti-aliasing ramp
   Measured on this page over the real art in this repo:
     Atelier 512 (341x512)   flat 0.059  soft 0.762
     Atelier 256 (170x256)   flat 0.045  soft 0.630
     Atelier 128 (85x128)    flat 0.040  soft 0.556
     card art    (768x1152)  flat 0.046  soft 0.888
     Shield of Athena        flat 0.019  soft 0.452
     Chair.png (flat shaded) flat 0.001  soft 0.152   ← worst painterly case
     pixel art   (96x144)    flat 0.718  soft 0.000
     pixel art blown to 512  flat 0.963  soft 0.000   ← "crisp" Atelier upload
   The two populations do not overlap on either axis, so BOTH must agree.
   ⚠ A tainted (cross-origin, no CORS header) texture throws on getImageData.
   That verdict is "painterly", which is the right default in this game — the
   whole library is painted illustration — and it is cached, so it throws once. */
function isPixelArt(img, def){
  if (def && typeof def.pixel === 'boolean') return def.pixel;
  const seen = _pxVerdict.get(img);
  if (seen !== undefined) return seen;
  /* ⚠ OUT OF BUDGET: answer "painterly" WITHOUT caching it, so this texture is
     asked again next frame. Caching here would freeze a wrong verdict forever. */
  if (_pxBudget <= 0) return false;
  _pxBudget--;
  let px = false;
  try {
    const S = PX_PROBE.TILE;
    const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
    if (!_pxCanvas){
      _pxCanvas = document.createElement('canvas');
      _pxCanvas.width = _pxCanvas.height = S*2;        /* the four windows, packed */
      _pxCtx = _pxCanvas.getContext('2d', { willReadFrequently:true });
    }
    const g = _pxCtx;
    let flat = 0, soft = 0, pairs = 0;
    /* Four windows, not one: a sprite can easily have a flat-coloured region
       (a cape, a shield) that on its own reads exactly like pixel art. Spread
       out, one such region cannot carry the verdict. */
    const spots = [[.25,.25],[.75,.25],[.25,.75],[.75,.75]];
    const sw = Math.min(S, W), sh = Math.min(S, H);
    g.clearRect(0, 0, S*2, S*2);
    g.imageSmoothingEnabled = false;
    for (let n = 0; n < 4; n++){
      const sx = clamp(Math.round(W*spots[n][0] - sw/2), 0, Math.max(0, W - sw));
      const sy = clamp(Math.round(H*spots[n][1] - sh/2), 0, Math.max(0, H - sh));
      g.drawImage(img, sx, sy, sw, sh, (n & 1)*S, (n >> 1)*S, sw, sh);  /* 1:1 — no resampling */
    }
    /* ONE readback for all four windows. Four separate getImageData calls cost
       ~1.3ms per probe here; packed into one this is 0.1-0.5ms (median 0.3 over
       the 85-180px sources that can actually reach the probe) — the readback's
       fixed cost dominates, not the 16k-pixel loop. Pairs never straddle a
       window seam: the inner loop stops one column short of each window's
       right edge. */
    const d = g.getImageData(0, 0, S*2, S*2).data;
    const RW = S*2;
    for (let n = 0; n < 4; n++){
      const ox = (n & 1)*S, oy = (n >> 1)*S;
      for (let y = 0; y < sh; y++){
        const row = (oy + y)*RW;
        for (let x = 0; x + 1 < sw; x++){
          const i = (row + ox + x)*4, j = i + 4;
          if (d[i+3] < 250 || d[j+3] < 250) continue;   /* edges of the matte lie */
          pairs++;
          const dd = Math.max(Math.abs(d[i]-d[j]), Math.abs(d[i+1]-d[j+1]), Math.abs(d[i+2]-d[j+2]));
          if (dd === 0) flat++; else if (dd <= 6) soft++;
        }
      }
    }
    /* too little opaque area to judge (a sprite that is mostly matte) — say
       painterly, because smoothing a pixel sprite is recoverable and blocking
       a painted one is the complaint we are here to close. */
    if (pairs >= PX_PROBE.MIN_PAIRS){
      px = (soft/pairs) <= PX_PROBE.SOFT_MAX && (flat/pairs) >= PX_PROBE.FLAT_MIN;
    }
  } catch (e){ px = false; }
  _pxVerdict.set(img, px);
  return px;
}
/* ── 📐 THE VISIBLE BOX — measured once per texture, cached beside the
   pixel-art verdict ────────────────────────────────────────────────────────
   THE ONE FIT RULE ON THE BATTLEFIELD: a sprite's VISIBLE alpha box is fitted
   so its height is exactly unitWorldH(def) world units (= `k` screen px in
   spriteBlit), its width is capped at one tile, and its feet sit on the tile
   centre. Source padding and aspect no longer change the drawn size — before
   this, the FULL image was fitted to k, so an Atelier export with a 40%
   transparent margin drew 40% smaller than a tight one of the same creature,
   and two units of the same "size" were rarely the same size.
   The box is measured on a ≤VB_RES sample of the frame (alpha > VB_ALPHA — a
   sample that is even 3% covered counts, so an anti-aliased rim is inside the
   box without growing it) and stored as FRACTIONS of the sampled rect:
   {x0,y0,x1,y1} in 0..1. 256 samples put the box within 0.4% of the truth on a
   512px frame; growing it by a sample, as a first cut did, put it 3% over.
   Then each of the four edges is REFINED at 1:1 from a strip two coarse
   samples wide around it (≤ a few thousand pixels per edge), so the box is
   exact to the source pixel — which is what lets fitSprite land a hard edge on
   a device-pixel boundary instead of half a sample off it. Keyed by the
   Image object (WeakMap, so a texture that falls out of ART_CACHE takes its box
   with it) and, for a sheet, by the frame rect inside it.
   ⚠ A tainted texture throws on getImageData → the full box, cached, so the
     sprite falls back to the old behaviour rather than vanishing.
   ⚠ A frame that is (nearly) empty returns the full box too: fitting a
     one-pixel speck to a whole unit height is a worse picture than nothing.
   PER DEF, NOT PER FRAME, once it reaches the blit: an attack lunge or a hair
   flick changes the alpha extent frame to frame, and fitting each frame on its
   own would make the unit pulse in scale — exactly the "getting bigger and
   smaller" this wave exists to end. So spriteBlit fits against the UNION of the
   def's measured frame boxes (def._vbox), which grows monotonically while the
   set decodes and is stable from then on; applyDefs clears it when the frame
   list changes. */
const VB_RES = 256, VB_ALPHA = 8;
const _vbVerdict = new WeakMap();
let _vbCanvas = null, _vbCtx = null;
function visibleBox(img, sx, sy, sw, sh){
  if (!img) return null;
  const full = (sw === (img.naturalWidth || img.width) && sh === (img.naturalHeight || img.height) && !sx && !sy);
  const key = full ? 'full' : (sx + ',' + sy + ',' + sw + ',' + sh);
  let m = _vbVerdict.get(img);
  if (m && m[key]) return m[key];
  if (!m){ m = {}; _vbVerdict.set(img, m); }
  let box = { x0:0, y0:0, x1:1, y1:1 };
  try {
    const sc = Math.min(1, VB_RES / Math.max(sw, sh));
    const mw = Math.max(1, Math.round(sw * sc)), mh = Math.max(1, Math.round(sh * sc));
    if (!_vbCanvas){
      _vbCanvas = document.createElement('canvas');
      _vbCanvas.width = _vbCanvas.height = VB_RES;
      _vbCtx = _vbCanvas.getContext('2d', { willReadFrequently:true });
    }
    const g = _vbCtx;
    g.clearRect(0, 0, VB_RES, VB_RES);
    g.imageSmoothingEnabled = true;
    g.drawImage(img, sx, sy, sw, sh, 0, 0, mw, mh);
    const d = g.getImageData(0, 0, mw, mh).data;
    let ax = mw, ay = mh, bx = -1, by = -1;
    for (let y = 0; y < mh; y++){
      const row = y * mw;
      for (let x = 0; x < mw; x++){
        if (d[(row + x) * 4 + 3] > VB_ALPHA){
          if (x < ax) ax = x; if (x > bx) bx = x; if (y < ay) ay = y; if (y > by) by = y;
        }
      }
    }
    /* a box smaller than 5% of the frame either way is "empty" → full */
    if (bx >= 0 && (bx - ax + 1) >= mw * 0.05 && (by - ay + 1) >= mh * 0.05){
      box = { x0: ax / mw, y0: ay / mh, x1: (bx + 1) / mw, y1: (by + 1) / mh };
      /* refine at 1:1 — a strip around each coarse edge, in SOURCE pixels */
      if (sc < 1){
        const inv = 1 / sc;
        const strip = (fx0, fy0, fw, fh) => {

function syncBackdropPlates(){

       arrived yet": plateNeed() answers null for both and the early return then
       leaves BACKDROP.img holding the PREVIOUS location's plate forever.
       BACKDROP.src is written in exactly two places — the onload above (a
       loaded Image) and the else arm above (null) — so `=== null` here is the
       explicit case and nothing else.
       ⚠ THE ONE INVARIANT still has to hold, and it is easier here than on the
       art path: there is at most ONE image in play (prev), so the shared
       horizon is simply prev's own best plating — the MIN over a single member.
       prev is kept rather than dropped so the outgoing world cross-fades out
       instead of popping; update()'s existing tick releases it at fade 1.
       The key carries W/H because plateNeed() answers null before buildStage
       and must be re-asked once the viewport exists. */
    if (BACKDROP.src === null){
      const key = 'none|' + (BACKDROP.prevSrc ? BACKDROP.prevSrc.src : '-') + '|' + W + 'x' + H;
      if (BACKDROP.plateKey === key) return;
      BACKDROP.img = null;
      const p = plateNeed(BACKDROP.prevSrc, BACKDROP.prevSrcHorizon);
      if (p){
        const hz = Math.max(HZ_STEP, Math.floor((p.hRow / p.h) / HZ_STEP) * HZ_STEP);

           policy as the art path below, and the same reason. */
        if (ip){ BACKDROP.prev = ip; BACKDROP.horizon = hz; }
        else   { BACKDROP.prev = null; BACKDROP.prevSrc = null; }
      } else {

      BACKDROP.plateKey = key;
      return;
    }
    const a = plateNeed(BACKDROP.src, BACKDROP.srcHorizon); if (!a) return;
    const b = plateNeed(BACKDROP.prevSrc, BACKDROP.prevSrcHorizon);
    let hz = a.hRow / a.h;
    if (b) hz = Math.min(hz, b.hRow / b.h);

      BACKDROP.img  = a.src;

      BACKDROP.prev = null; BACKDROP.prevSrc = null;

/* ⚠ NO LONGER THE GROUND PATH. The terrain renderer (see bakeTerrain) paints
   per-tile sand-and-rock material with elevation, bevels and contact shadows;
   this flat affine-band projection cannot follow a heightfield and is kept only
   as the reference implementation for laying art flat on the play plane. The
   location's art now drives the ground's COLOUR through sampleGroundTint(). */
function drawGroundSlices(img, alpha){
  /* ±cols/2 × ±rows/2 was only ever the board's extent while a tile was 1×1
     world units. A hex row is hexW wide and hexV deep and neither is 1, so
     this went through boardExtent() like the other five extent sites — and
     now goes through groundExtent(), which is the SAME quad drawBoard clips
     to. These two must not drift: the slices are blitted as axis-aligned
     rects and the clip is a projected quad, so a slice range wider than the
     clip is invisible, and one narrower leaves a bare wedge of apron showing
     through the location art. */
  const g = groundExtent();
  const halfW = g.x, zFar = -g.far, depth = g.far + g.near;
  const N = 150;                       /* depth bands — raise for more accuracy */
  ctx.globalAlpha = alpha;
  for (let i=0;i<N;i++){
    const t0 = i/N, t1 = (i+1)/N;
    const z0 = zFar + t0*depth, z1 = zFar + t1*depth;
    /* 🎥 gp(), not a world point: the bands are perpendicular to the CAMERA's
       ground-forward axis, not to world Z. That is what keeps each band
       projecting to a horizontal trapezoid — which is the entire reason the
       four corners below can be reduced to one axis-aligned drawImage rect.
       Band the ground in world Z under yaw and every rect is a sheared quad
       squeezed into an upright box, i.e. the photograph smears sideways.
       At yaw 0 with no pan gp(u,v) is (u,0,v) and nothing about this moves. */
    const L0 = project(gp(-halfW, z0)), R0 = project(gp(halfW, z0));
    const L1 = project(gp(-halfW, z1)), R1 = project(gp(halfW, z1));
    if (!L0||!R0||!L1||!R1) continue;
    const dx = Math.min(L0.x, L1.x), dw = Math.max(R0.x, R1.x) - dx;
    const dy = L0.y, dh = (L1.y - L0.y) + 1.2;   /* +1.2 hides seams */
    if (dw <= 0 || dh <= 0) continue;
    const sy = t0*img.naturalHeight, sh = Math.max(1, (t1-t0)*img.naturalHeight);
    ctx.drawImage(img, 0, sy, img.naturalWidth, sh, dx, dy, dw, dh);
  }
  ctx.globalAlpha = 1;
}

/* celestial art — swap these data URLs for real texture files in the engine */
const SUN_IMG = new Image(); SUN_IMG.src = '../assets/board/sun.png';
const MOON_IMG = new Image(); MOON_IMG.src = '../assets/board/moon.png';
const cv = document.getElementById('stage');
/* `let`, not `const`, for exactly one reason: terrainLayer() points this at an

   what lets the same code draw into either target without threading a context
   argument through twenty functions. Nothing else may reassign it. */
let ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let units = [], particles = [], effects = [];
let uid = 1, selected = null, armedCard = null, focus = null, hoverTile = null;
let showGuides = false;
let T = 0, last = 0;
let LIGHT = { ...TIME_PRESETS[BATTLE.timeOfDay] };
let lightLerp = null;

let lightPending = null;

const rnd = (a,b) => a + Math.random()*(b-a);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1-t, 3);
const easeInOut = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const easeBack = t => { const c=1.70158+1, s=1.70158; return 1 + c*Math.pow(t-1,3) + s*Math.pow(t-1,2); };
function hexRgb(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
/* ⚠ mixHex RETURNS "rgb(r,g,b)", NOT A HEX STRING. It is a fillStyle, and only

   whole terrain pass was built on chained mixes and came out near-black for it —

/* ── responsive sizing, projection centred on the SAFE box ── */
let VIEW = { cx:0, cy:0, scale:1 };
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  /* Viewport is the source of truth. clientWidth is a poor fallback here because
     a <canvas> is a REPLACED element: `inset:0` does not stretch it, so clientWidth
     can report the intrinsic 300x150 and collapse the whole stage.
     (clientWidth/clientHeight are also READ-ONLY — never assign to them.) */
  W = Math.max(1, window.innerWidth || cv.clientWidth || 1280);
  H = Math.max(1, window.innerHeight || cv.clientHeight || 720);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* Reserved UI gutters, scaled to the viewport. */
  const k = clamp(W/1920, .5, 1.15);
  const S = CONFIG.SAFE;
  let l = S.left*k, r = S.right*k, t = S.top*k, b = S.bottom*k;

  if (t + b > maxV){ const s = maxV/(t+b); t *= s; b *= s; }
  VIEW.cx = l + (W - l - r)/2;
  VIEW.cy = t + (H - t - b)/2 + (CONFIG.viewShiftY || 0) * clamp(H/1080, .6, 1.2);

     Cleared here rather than re-baked, so a drag-resize costs one bake at the
     end instead of one per resize event.
     🔀 MERGE HYBRID (battlefield-hex): this used to clear TERRAIN.poly and call
     seedPickPolys() alongside. Both are gone — see seedPickPolys' own note —
     because picking is no longer a hit-test over cached polygons at all. The
     cache being cleared is now theirs (TERR), and its key already names the

  if (typeof TERR !== 'undefined' && TERR) TERR.key = '';
}
/* The braziers are clamped to the host box by seedBraziers(), so a window
   resize has to re-anchor them too — they are the one piece of scenery whose
   position is a function of the FRAME and not of the board.
   🟥🟦 The platforms are the same kind of scenery (seedPlatforms sizes them to
   the room the fitted frame leaves), and for the same reason they are seeded
   AFTER applyFit() and never before — they read the fit, they must not feed it. */
addEventListener('resize', () => { applyFit(); seedBraziers(); seedPlatforms(); });

/* ══════════════════════════════════════════════════════════════════

const sub = (a,b) => ({x:a.x-b.x, y:a.y-b.y, z:a.z-b.z});
const dot = (a,b) => a.x*b.x + a.y*b.y + a.z*b.z;
const cross = (a,b) => ({ x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x });

let CAM = null;
function buildCam(){
  const c = CONFIG.camera;

function project(p){

/* ══════════════════════════════════════════════════════════════════
   HEX LATTICE — pointy-top, odd-r offset. HEXSPEC §1–§3, binding.
   Vertices at i*60°−30°, so one point is up. Odd ROWS (gz odd) are
   shifted +½ column to the right; no other row is shifted.
     SIZE = CONFIG.tile   circumradius, centre → vertex
     hexW = SIZE*√3       full width, = centre-to-centre along a row
     hexV = SIZE*1.5      centre-to-centre between adjacent rows
     tileR = SIZE*√3/2    INRADIUS, centre → edge midpoint
   The last one matters more than it looks: on a square cell the
   circumradius and "half a tile" were the same number, so every ground
   circle in this file was written as a bare fraction of 0.5. On a hex
   they differ by √3/2, and a radius that fits inside the tile has to be
   a fraction of the INRADIUS, not of the circumradius.

const SQRT3 = Math.sqrt(3);
function hexSize(){ return CONFIG.tile; }
function hexW(){ return CONFIG.tile * SQRT3; }
function hexV(){ return CONFIG.tile * 1.5; }
function tileR(){ return CONFIG.tile * SQRT3 / 2; }

/* Odd rows shift +½ column (HEXSPEC §2). HEXSPEC writes that as `(gz & 1)*0.5`
   and for an integer row that is exactly what this returns. But gw() is also
   called with FRACTIONAL rows — moveUnit and the lunge tween write `u.z`
   straight through — and a bitwise `&` truncates, so a unit crossing from row 2
   to row 3 would snap half a hex sideways the instant it passed z=3. Interpolate
   the shift instead: that traces the straight world-space line between the two
   hex centres, which is the path the tween is supposed to describe.
   `&` (never `%`) for the parity: in JS `-1 % 2` is -1 and would shift the wrong
   way, while `-1 & 1` is 1, i.e. correct. */
function rowShift(gz){
  const f = Math.floor(gz), t = gz - f;
  return t === 0 ? (f & 1) * 0.5 : lerp((f & 1) * 0.5, ((f+1) & 1) * 0.5, t);
}
/* grid (col,row) → world. Board centred on origin. HEXSPEC §3. */
function gw(gx, gz, y){
  return { x:(gx + rowShift(gz) - (MAP.cols-1)/2) * hexW(),
           y:y||0,
           z:(gz - (MAP.rows-1)/2) * hexV() };
}
/* The six WORLD corners of one tile, shared by tilePoly (which projects them),
   the surface-FX clip and the cliff-face normals — three things that must agree
   about where a tile's edges are or the paint drifts off the tile it belongs to.
   `inset` is RADIAL: it shrinks the circumradius. It used to be an edge offset
   on a square, which is a different quantity. */
function hexCorners(gx, gz, inset, y){
  const a = gw(gx, gz, y);
  const R = hexSize() - (inset || 0);
  const pts = [];
  for (let i=0;i<6;i++){
    const ang = i*Math.PI/3 - Math.PI/6;         /* pointy-top, HEXSPEC §1 */
    pts.push({ x:a.x + Math.cos(ang)*R, y:a.y, z:a.z + Math.sin(ang)*R });
  }

}

/* boardExtent() — the ONE answer to "how far does the LATTICE reach", as half
   extents from the origin, in world units. Six sites used to spell ±MAP.cols/2
   and ±MAP.rows/2 inline (apron, ground-art clip, ground slices, frame,
   braziers, backdrop anchor); all of them were only right while a tile was one
   world unit square. Because odd rows are shifted +½ column the tile centres
   are NOT symmetric about the origin — take the wider side for both so the
   frame stays optically centred instead of leaning left.
   ⚠ Four of those six (apron, ground-art clip, ground slices, backdrop anchor)
   have since moved to groundExtent() below, which answers a different question
   and answers it in terms of the FRAME. This one still owns the frame band,
   the braziers, the motes and the shards — everything whose position is a
   statement about the play field rather than about the picture. */
function boardExtent(){
  return { x:(MAP.cols + 1)/2 * hexW(),
           z:(MAP.rows - 1)/2 * hexV() + hexSize() };
}

/* 🌍 GROUND EXTENT — how far the DIORAMA reaches. That is a different question
   from how far the LATTICE reaches, and until this wave the file only had the
   one answer. The gold frame, the braziers and the motes genuinely want the
   lattice's edge and still call boardExtent(). The apron, the location art and
   the ground slices do not: BAR R1 is explicit that "the map IS the frame — the diorama fills the screen edge to
   edge, there is no small board plate floating in the middle of a painting",
   and a floor that stopped at ext+wall left the bottom third of the in-game
   host rect as bare backdrop with a gold-railed plate hovering above it.
   So walk the floor out until it leaves the box: cast the screen row just
   below the box back onto y=0 and take that as the NEAR reach, then take the
   half-width the box subtends at that depth. The FAR reach stays at the
   lattice, deliberately — the backdrop's horizon is anchored to it (see
   drawOneBackdrop) and pushing the floor past the horizon would erase the sky
   the reference has, trading one wrong picture for another.

   ground texture to stretch across a floor it has no texels for, and the
   clamp is also what keeps this cheap enough to call per frame. */
function groundExtent(){
  const e = boardExtent();
  /* 🎥 The board's reach measured ALONG THE CAMERA'S ground axes, not along
     the world's. boardExtent() is a world-axis half-extent pair; once the
     camera can turn, "how far away is the far edge" is the support function of
     that rectangle in the eye's own −V direction, which is |e.x·sin yaw| +
     |e.z·cos yaw|. At yaw 0 that is e.z and at 90° it is e.x — take the world
     answer at 90° and the lattice sticks out past the apron that is supposed
     to be under it, with the location photograph laid over the far columns. */
  const cy = Math.abs(Math.cos(CAMERA.yaw)), sy = Math.abs(Math.sin(CAMERA.yaw));
  /* …measured from the PAN ORIGIN, which is where gp() puts the quad, and not
     from the world origin, which is where the board is. Pan the focus a third
     of the way across the field and the board's far edge is now a third of the
     field FURTHER from the quad's centre than it was; without this term the
     apron's far edge lands in the middle of the lattice and the location
     photograph is laid over the back rows. */
  /* SIGNED, and that is the whole point. The board's centre sits at
     (sU, sV) in the frame, so the board occupies V ∈ [sV−supV, sV+supV]: the
     far reach only has to cover supV−sV and the near reach only supV+sV.
     ⚠ THE BUG THIS REPLACES: this used |frameV(0,0)| and added it to BOTH,
     which grows the quad in the direction the board is NOT in as well. Because
     skirtRange() bounds the skirt by this quad, panning 2.67 away from the
     centre roughly DOUBLED the quad's depth and, with the same treatment on U,
     its area — and the painted skirt went from 164 cells to 342-368. Measured
     as a bake of 18-39 ms at every yaw with pan (0,0) and 130-300 ms as soon as
     pan and a non-cardinal yaw were combined, which is the one input
     combination the free camera exists to allow. Each axis had been varied with
     the other at zero, so nothing caught it.
     At pan (0,0) sU and sV are 0 and every number below is bit-identical to
     what shipped, which is why the resting framing does not move. */
  const sU = frameU(0, 0), sV = frameV(0, 0);
  const supV = e.x*sy + e.z*cy;           /* board's support toward the eye */
  const supU = e.x*cy + e.z*sy;           /*        …and across the frame   */
  const nearV = Math.max(supV + sV, hexV());
  const farV  = Math.max(supV - sV, hexV());
  /* U is the one axis where the quad really is symmetric about the frame
     origin, so the pan offset cannot simply be signed away. It is dropped from
     the FLOOR instead: out.x below is set from the frustum's own floor
     footprint, and anything the pan pushes off to one side is by definition
     outside the frustum, i.e. not in the picture. Leaving |sU| in the floor
     forced the quad wider than the frame at every panned pose and was the last
     surviving arm of the cliff — a held E+D still baked 185 ms with the V axis
     already fixed, on 366 painted skirt cells. The old value is kept as the
     CEILING so the degenerate-camera guard has the headroom it had. */
  const out = { x:supU, near:nearV, far:farV };
  const capU = (supU + Math.abs(sU)) * 3;
  if (!CAM || !VIEW.box) return out;
  const a = (VIEW.cy - (VIEW.box.t + VIEW.box.h + 24)) / VIEW.scale;
  const d = { x:CAM.u.x*a + CAM.f.x, y:CAM.u.y*a + CAM.f.y, z:CAM.u.z*a + CAM.f.z };
  if (d.y < -1e-3){                       /* ray must actually meet the floor */
    const t = -CAM.pos.y / d.y;
    /* also has to stay IN FRONT of the eye — a degenerate camera would
       otherwise ask for a floor that begins behind the near clip, where
       project() returns null and the whole apron silently disappears.
       ⚠ Measured in the CAMERA-ALIGNED ground frame (frameV), not in world Z.
       "How far does the floor have to reach toward the viewer" is a question
       about the viewer; taking the world-Z of the hit answered it correctly
       only while the eye sat on the +Z axis, and under yaw it reads the
       LATERAL distance instead and collapses the apron to nothing at 90°.
       At yaw 0 with no pan frameV(x,z) === z, so this is the same number. */
    /* The LOWER bound is the board's own near reach (so the apron never stops
       short of the lattice); the UPPER bound keeps the old headroom, measured
       off the board's support rather than off the new tighter nearV — shrinking
       the ceiling with the floor would let a pan clip the floor the frustum
       genuinely needs and leave bare apron in the foreground. */
    out.near = clamp(frameV(CAM.pos.x + d.x*t, CAM.pos.z + d.z*t),
                     nearV, Math.min((supV + Math.abs(sV))*3, frameV(CAM.pos.x, CAM.pos.z) - 1));

  /* Half-width is measured at the FAR row, not the near one. Screen offset is

     top corners where the floor has already run out. */
  const depth = dot(sub(gp(0, -out.far), CAM.pos), CAM.f);

    out.x = clamp((VIEW.box.w/2 + 24)*depth/VIEW.scale + Math.abs(latticeCentreX()),

}

let TILE_INDEX = null;

/* 🏞 SKIRT STATE. Declared beside TILE_INDEX because rebuildTileIndex() writes
