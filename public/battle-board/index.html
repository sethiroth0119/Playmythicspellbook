     ⚠ This is not left as a comment: the point-in-OWN-hexagon count is a
     binding assert in .gauntlet/tabletop/_reach-ink.mjs, tested with the
     renderer's own tilePoly() rather than re-derived geometry, and negative-
     controlled by re-running the identical arithmetic at rows=1.60 in the same
     frame — which must come back 0/36 or the gate refuses to report.

     ⚠ THE ROBUSTNESS LIMIT, stated rather than papered over. Row pitch is a
     function of the CAMERA PITCH as well as depth: flatten the camera and the
     rows crowd together, so this rise shrinks in px while a sprite's screen
     height does not. That used to be the worry, back when the float was
     believed to be doing the occluding; it is not one any more, because the
     pass order does that and the pass order is camera-independent. What the
     camera CAN still move is the CEILING above — how many rows of lift a
     hexagon's own projected footprint tolerates before the anchor leaves it.
     The fit searches 34°-52° (CAM_FIT) and both the plateau and the 0.6/0.7
     cliff were measured at the fit the 14×12 board settles on. If the camera
     rig ever goes properly free and a player can flatten it below that band,
     re-measure the plateau with _crit-reach-r2e.mjs rather than assuming 0.40
     carries. */
  rows: 0.40,
  /* Fraction of the hex INRADIUS (tileR — not the circumradius; see HEXSPEC §3
     for why every ground radius in this file is a fraction of the inradius).
     0.16 is a mark, not a tile: ~7px tall on the near row. */
  r: 0.16
};
try { window.__bbReach = REACH_CUE; } catch (e) {}

/* ONE colour literal, TWO readers. §12.3.3: the cue and the contour must be
   incapable of disagreeing, and "both happen to spell #7fe4ff" is not that —
   it is two copies waiting to drift the first time somebody re-tunes one. The
   contour is deliberately NOT palette-driven (telePal() is the ROUTE's
   palette, not the region's), so this is a literal rather than TELE_PAL.mine. */
const TELE_MOVE_COL = '#7fe4ff';

/* The pip ANCHORS: one world point per tile in the set, at the tile's OWN
   ground height. The float is applied later, in teleReachPoints(), so the
   cache holds pure geometry — that keeps REACH_CUE out of the cache's
   invalidation inputs (otherwise the __bbReach debug hook would silently do
   nothing on a parked camera) and makes the anchor literally the same quantity
   teleContour's corners are built from: the tile's ground. */
function telePips(set){
  if (!set || !set.size) return [];
  const out = [];
  for (const key of set){
    const c = key.indexOf(','); if (c < 0) continue;
    const gx = +key.slice(0,c), gz = +key.slice(c+1);
    if (!isFinite(gx) || !isFinite(gz)) continue;
    out.push(gw(gx, gz, tileElev(gx, gz)));
  }
  return out;
}

/* WHERE THE MARKS ACTUALLY LAND, in screen px. Separated from the painter on
   purpose and this is not tidiness: every gate that scores this piece
   (.gauntlet/tabletop/_reach-probe.mjs, _reach-pixels.mjs, _reach-sweep.mjs)
   reads THIS function out of the page. A probe that re-derived the positions
   would be grading its own arithmetic and would stay green through a painter
   that draws somewhere else entirely — which is the failure mode this whole
   pass keeps meeting in new clothes.

   Two projections per tile: the tile's ground centre, and a point one lattice
   row NEARER at the same height. The screen distance between them IS the row
   pitch at that depth, which is the unit the float is measured in. Sampling it
   per tile rather than once for the board is the entire fix for the 1.84×
   drift the world-space version had. */
function teleReachPoints(){
  const A = teleLoops().pips;
  if (!A || !A.length) return [];
  const V = hexV(), rows = REACH_CUE.rows;
  const out = [];
  for (const a of A){
    const g  = project({ x:a.x, y:a.y, z:a.z });
    if (!g) continue;                      /* behind the near plane, CONTRACT R17 */
    const nb = project({ x:a.x, y:a.y, z:a.z + V });
    /* No neighbour projection (the row in front is off-camera) → fall back to
       the tile's own inradius in px, which is the same order as a row pitch.
       Skipping the pip instead would drop a reachable tile out of the cue and
       make it disagree with the contour, which is the one thing it may not do. */
    const pitch = nb ? Math.abs(nb.y - g.y) : tileR() * g.s;
    out.push({ x:g.x, y:g.y - rows * pitch, r:Math.max(2.0, tileR() * g.s * REACH_CUE.r) });
  }
  return out;
}

/* Contour geometry is WORLD space, so it survives every camera move and only
   has to be rebuilt when the SET or the TERRAIN changes. TELE.rev is bumped by
   both the `paint` and the `tele` message handlers; TILE_INDEX identity covers
   a new map (rebuildTileIndex() mints a fresh Map). Without this the boundary
   trace ran 60x/second for a set that changes on a click. */
const TELE_CACHE = { rev:-1, idx:null, move:null, threat:null, pips:null };
function teleLoops(){
  if (TELE_CACHE.rev !== TELE.rev || TELE_CACHE.idx !== TILE_INDEX){
    if (!TILE_INDEX) rebuildTileIndex();
    TELE_CACHE.rev = TELE.rev;
    TELE_CACHE.idx = TILE_INDEX;
    TELE_CACHE.move   = teleContour(PAINT.move);
    /* 🔒 §12.3.3 — THE CUE AND THE CONTOUR MAY NOT DISAGREE, and this line is
       the whole mechanism. Both are built here, from the SAME PAINT.move, in
       the same statement block, behind the same TELE.rev/TILE_INDEX guard, so
       there is no instant at which one has been rebuilt and the other has not.
       Deriving the pips at draw time from a second read of PAINT.move would
       look identical and would be exactly the bug: the air cue would be one
       click ahead of the ground cue for a frame, and a telegraph that can show
       two different answers is worse than one cue. */
    TELE_CACHE.pips   = telePips(PAINT.move);
    TELE_CACHE.threat = teleContour(TELE.threat);
  }
  return TELE_CACHE;
}

/* One fill for a whole region. Every hexagon goes into a SINGLE path and is
   filled once with the default nonzero winding, so the union comes out at a
   flat alpha — filling tile by tile double-darkens every shared edge and turns
   a region back into the checkerboard BAR R3 rejects. The −0.012 inset is a
   hair of OVERLAP, which is what closes the antialiasing hairlines between
   neighbours; nonzero winding makes the overlap free. */
function teleWash(set, colour, alpha){
  if (!set || !set.size) return;
  ctx.beginPath();
  let any = false;
  for (const key of set){
    const c = key.indexOf(','); if (c < 0) continue;
    const gx = +key.slice(0,c), gz = +key.slice(c+1);
    const P = tilePoly(gx, gz, -0.012); if (!P) continue;
    ctx.moveTo(P[0].x, P[0].y);
    for (let i=1;i<6;i++) ctx.lineTo(P[i].x, P[i].y);
    ctx.closePath(); any = true;
  }
  if (any){ ctx.fillStyle = rgba(colour, alpha); ctx.fill(); }
}

/* Stroke pre-chained loops. Points are projected ONCE and both the glow pass
   and the core pass reuse them — projecting per pass doubled the cost of the
   one thing on this board that runs over a whole region. A point behind the
   near plane (project() → null, CONTRACT R17) breaks the subpath rather than
   joining across the screen, which is what a bare `continue` would draw. */
function teleStroke(loops, colour, coreW, glowW, alpha){
  if (!loops || !loops.length) return;
  const runs = [];
  for (const L of loops){
    let run = null;
    for (const w of L){
      const p = project(w);
      if (!p){ run = null; continue; }
      if (!run){ run = [p]; runs.push(run); } else run.push(p);
    }
  }
  if (!runs.length) return;
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (let pass=0; pass<2; pass++){
    ctx.strokeStyle = rgba(colour, pass ? alpha : alpha*0.26);
    ctx.lineWidth   = pass ? coreW : glowW;
    ctx.beginPath();
    for (const r of runs){
      ctx.moveTo(r[0].x, r[0].y);
      for (let i=1;i<r.length;i++) ctx.lineTo(r[i].x, r[i].y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

/* Two routes, two palettes. `mine` is the cyan XCOM ribbon; `foe` is the red
   the attack arc has always used for an enemy swing (drawTeleArc's '#ff5a4a'),
   so the enemy's move and the enemy's attack read as one actor's intent while
   staying unmistakably not-mine. Deliberately NOT the threat wash's orange
   (#ff7a30): a route is one line the enemy walks, a threat region is every
   tile it could reach, and BAR R2 is explicit that two questions get two
   colours. `mark` is the destination hexagon and cursor diamond, kept a step
   paler than the ribbon so the endpoint reads as a marker rather than more
   line. */
const TELE_PAL = {
  mine: { glow:'#8fe8ff', core:'#63d8ff', mark:'#dffaff' },
  /* `mark` stays a tint of the ribbon rather than the near-white the player
     side uses: measured on the aitele capture, a #ffdcd4 destination hexagon
     read as plain white next to the red route, which put the one element that
     answers "where is it STOPPING" back into the player's colour family. */
  foe:  { glow:'#ffa392', core:'#ff5a4a', mark:'#ffb3a0' }
};
function telePal(){ return TELE_PAL[TELE.side] || TELE_PAL.mine; }

/* The walked route, on the ground, bending exactly where the game's BFS bends.
   Points are the TILE CENTRES of TELE.path in order — no smoothing through
   them, because a spline that cuts a corner draws the unit walking over a tile
   the path never contained. */
function drawTelePath(t){
  const P = TELE.path;
  if (!P || P.length < 2) return;
  const pts = [];
  for (const k of P){
    const c = k.indexOf(','); if (c < 0) return;
    const gx = +k.slice(0,c), gz = +k.slice(c+1);
    const p = project(gw(gx, gz, tileElev(gx,gz) + 0.05));
    if (!p) return;                       /* partial route > no route is FALSE */
    pts.push(p);
  }
  const s = pts[pts.length-1].s;
  const core = Math.max(2.2, tileR() * s * 0.17);
  const PAL = telePal();
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  /* dark casing first — the route has to read over wet asphalt AND over pale
     rubble, and a single bright line reads over neither */
  ctx.strokeStyle = 'rgba(4,10,16,0.68)'; ctx.lineWidth = core + Math.max(3, core*0.9);
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.strokeStyle = rgba(PAL.glow, 0.30); ctx.lineWidth = core * 2.1;
  ctx.stroke();
  ctx.strokeStyle = rgba(PAL.core, 0.92); ctx.lineWidth = core;
  ctx.stroke();

  /* Direction chevrons, marching along the route. They are what makes it a
     telegraph rather than a drawn line: without them the picture says where
     but not which way. Phase runs with T so the route reads as flowing toward
     the destination. */
  /* Chevron placement walks ONE running distance along the whole polyline
     rather than resetting per segment — a per-segment phase makes the spacing
     jump at every bend, and every bend is the interesting part of this route. */
  const step = Math.max(22, core * 5.2);
  let travelled = 0;
  let next = step - ((t * 46) % step);
  const chev = (cx, cy, ux, uy, scale) => {
    const w = core * 0.62 * scale, h = core * 0.78 * scale;
    ctx.beginPath();
    ctx.moveTo(cx - ux*w - uy*h, cy - uy*w + ux*h);
    ctx.lineTo(cx + ux*w*1.35,   cy + uy*w*1.35);
    ctx.lineTo(cx - ux*w + uy*h, cy - uy*w - ux*h);
    /* dark casing UNDER a bright mark, never the other way round: dark
       chevrons on a light ribbon read as hazard tape, not as direction. */
    ctx.strokeStyle = 'rgba(4,10,16,0.8)'; ctx.lineWidth = Math.max(2.4, core*0.62); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.96)'; ctx.lineWidth = Math.max(1.2, core*0.30); ctx.stroke();
  };
  for (let i=1;i<pts.length;i++){
    const a = pts[i-1], b = pts[i];
    const dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy);
    if (len < 0.001) continue;
    const ux = dx/len, uy = dy/len;
    while (next <= travelled + len){
      const d = next - travelled;
      chev(a.x + ux*d, a.y + uy*d, ux, uy, 1);
      next += step;
    }
    travelled += len;
  }
  /* The head, sitting ON the destination and pointing into it. XCOM's route
     line ends in a marker; without the head the ribbon just stops. */
  const pE = pts[pts.length-1], pP = pts[pts.length-2];
  const hx = pE.x-pP.x, hy = pE.y-pP.y, hlen = Math.hypot(hx,hy) || 1;
  ctx.save();
  ctx.lineJoin = 'miter';
  chev(pE.x, pE.y, hx/hlen, hy/hlen, 2.0);
  ctx.restore();
  ctx.restore();
}

/* Destination marker: the hexagon the unit will stand on, plus the floating
   cursor diamond BAR R2 asks for, on a dropline so its foot is unambiguous. */
function drawTeleDest(t){
  const d = TELE.dest; if (!d) return;
  const e = tileElev(d.x, d.z);
  const P = tilePoly(d.x, d.z, 0.06, e + 0.055);
  const pulse = 0.5 + Math.sin(t*3.4)*0.5;
  const PAL = telePal();
  ctx.save();
  if (P){
    pathPoly(P); ctx.fillStyle = rgba(PAL.mark, 0.10 + pulse*0.10); ctx.fill();
    pathPoly(P); ctx.strokeStyle = 'rgba(4,10,16,0.6)'; ctx.lineWidth = 5; ctx.stroke();
    pathPoly(P); ctx.strokeStyle = rgba(PAL.mark, 0.95); ctx.lineWidth = 2.6; ctx.stroke();
  }
  const foot = project(gw(d.x, d.z, e + 0.06));
  const head = project(gw(d.x, d.z, e + 0.62 + pulse*0.06));
  if (foot && head){
    ctx.strokeStyle = rgba(PAL.glow, 0.5); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(foot.x, foot.y); ctx.lineTo(head.x, head.y); ctx.stroke();
    const r = Math.max(5, tileR() * head.s * 0.30);
    ctx.beginPath();
    ctx.moveTo(head.x, head.y - r); ctx.lineTo(head.x + r*0.72, head.y);
    ctx.lineTo(head.x, head.y + r); ctx.lineTo(head.x - r*0.72, head.y);
    ctx.closePath();
    ctx.fillStyle = rgba(PAL.mark, 0.9); ctx.fill();
    ctx.strokeStyle = 'rgba(4,10,16,0.75)'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}

/* The GROUND half of the telegraph, composited after the surface FX so a route
   across a fire tile still reads. Order is deliberate: threat underneath (it is
   context), then my own reachable region, then the route on top of both. */
function drawTeleGround(t){
  const C = teleLoops();
  if (TELE.threat.size){
    teleWash(TELE.threat, '#ff7a30', 0.13 + Math.sin(t*1.6)*0.02);
    teleStroke(C.threat, '#ff8a3c', 3.0, 9, 0.92);
  }
  /* 🔀 MERGE HYBRID (battlefield-hex) — THE MOVE REGION HAS TWO OWNERS AND ONLY
     ONE MAY DRAW IT. Both branches independently solved "don't draw the
     reachable set as a checkerboard of outlined cells", and both landed on the
     same answer: one region, one traced contour.
       · theirs — this teleWash + teleStroke, drawn OVER the surface FX.
       · ours   — BBX.tilefx.drawStates (src/battle/stage/tilefx.js), drawn
                  UNDER the actors from drawBoard().
     Both read the same PAINT.move Set, so wiring both without this guard paints
     the region twice: two washes stacked and two contours, one of them offset
     by a whole compositing layer. That is not a cosmetic nit — tilefx.js
     carries MEASURED luma contracts over the move pool's interior (see its
     header: "B−R measured −47.6 → +17.5 over the move region"), and a second
     wash on top invalidates every one of them.
     tilefx wins when it is present: it is our shipped, tuned module and this is
     the DEFAULT RESOLUTION RULE — preserve our shipped behaviour, graft theirs
     on top. When it is absent (their harness, a 404, a cold frame before the
     deferred module lands) this runs and the region is still drawn. The threat
     wash, the walked route and the destination marker are theirs alone and are
     never gated — they have no counterpart on our side. */
  /* 🎯 THE WASH STAYS GATED. THE CONTOUR NO LONGER IS — and the split is the
     whole point of this change.
     ══════════════════════════════════════════════════════════════════════════
     Asked for: "when the player clicks on a unit or hero, give a better tile
     highlight so players can see where they can go."

     What tilefx draws on the boundary today is deliberately NOT a contour. Its
     rim is a BROKEN GLINT — alpha 0.040-0.046, hashed per sub-segment, skipping
     ~44% of them — because its own header records "a hard stroke tracing the
     full perimeter of a pool" being rejected as reading like a sticker. That is
     a real design position and the interior tuning behind it is measured
     (ON-OFF luma >= +40, actual +46.6). None of that is touched here.

     What IS touched: the reachable region now always gets teleStroke's crisp
     traced boundary on top. A player needs one unambiguous line telling them
     where the legal moves stop, and a 4%-alpha glint that skips almost half its
     own segments is not it.

     ⚠ THE WASH IS STILL GATED, AND MUST STAY GATED. The guard above exists
       because two stacked washes invalidate every luma contract in tilefx.js —
       that is an INTERIOR measurement. A stroke lands on the boundary, not the
       interior, so it cannot move those numbers. Do not "simplify" this by
       ungating both: the wash is the half that breaks things. */
  if (PAINT.move.size && !(window.BBX.tilefx && window.BBX.tilefx.drawStates)){
    teleWash(PAINT.move, '#4fd0ff', 0.13 + Math.sin(t*2.2)*0.025);
  }
  if (PAINT.move.size) teleStroke(C.move, TELE_MOVE_COL, 2.6, 10, 0.95);
  drawTelePath(t);
  drawTeleDest(t);
}

/* 👁 THE REACH PIPS, painted. See the REACH_CUE block above for WHY this is
   an air pass and why it is not a tint, a lifted contour or a dropline.

   ONE PATH, TWO STROKES, in that order: a dark casing under a bright core. The
   route ribbon's header records why — the board runs from wet asphalt to pale
   rubble to open sky, and a single bright mark reads over none of them. The
   casing is what makes the pip survive a pale far-row tile behind it.

   THE MARK IS A DOWNWARD CARET, not a dot. A dot floating in the air says
   "something is here"; a caret says "the tile UNDER me". That is the whole job
   the dropline was rejected for doing, done in three line segments per tile
   with no vertical anywhere on the board.

   SIZE SCALES WITH the tile's own projected inradius, so a far pip is a
   smaller mark than a near one. A constant screen size would make the far half
   of the region shout louder than the near half, which inverts the read.

   NO PULSE. The wash and the destination marker breathe; thirty-six
   synchronised blinking marks is a strobe, and §12.3.2's "subtle" is the
   binding constraint on a per-tile cue. `t` is taken and unused for exactly
   that reason — the signature matches its siblings so the call site reads the
   same, and the next person to reach for Math.sin(t) finds this note first. */
function drawTeleReach(t){
  if (!REACH_CUE.on) return;
  /* §12.3.6 — QUIET AT REST. PAINT.move is empty whenever nothing is selected
     (the host clears it on deselect), so a still frame of an unselected board
     is exactly the board we had before this piece. Gated on the SET, not on
     TELE.sel: the set is what the contour two passes earlier is gated on, and
     gating the two halves of one telegraph on two different conditions is how
     they come to disagree. */
  if (!PAINT.move.size) return;
  const pts = teleReachPoints();
  if (!pts.length) return;
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const p of pts){
    const r = p.r;
    /* caret: down-left shoulder → point → down-right shoulder. The POINT sits
       directly over the tile centre, so the mark aims at the tile it belongs
       to — which is the job the rejected dropline was going to do, done in
       three line segments and with no vertical anywhere on the board. */
    ctx.moveTo(p.x - r, p.y - r * 0.62);
    ctx.lineTo(p.x,     p.y + r * 0.42);
    ctx.lineTo(p.x + r, p.y - r * 0.62);
  }
  /* ONE PATH, TWO STROKES: a dark casing under a bright core, in that order.
     The route ribbon's header records why — the board runs from wet asphalt to
     pale rubble to open sky, and a single bright mark reads over none of them.
     The casing is what keeps the pip legible against a pale far-row tile.
     Line width comes from the FIRST point rather than per pip so both passes
     share one path: a per-pip width needs a stroke per pip and turns one draw
     call into thirty-six. The size difference across the board is carried by
     the caret's own geometry, which IS per pip. */
  const w = pts[0].r;
  ctx.strokeStyle = 'rgba(4,10,16,0.72)'; ctx.lineWidth = Math.max(3.0, w * 0.80); ctx.stroke();
  ctx.strokeStyle = rgba(TELE_MOVE_COL, 0.88); ctx.lineWidth = Math.max(1.4, w * 0.34); ctx.stroke();
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════════════
   👻 THE OCCLUDER GHOST — TABLETOP-BAR §12.2, the UNIT-ON-UNIT half.
   ══════════════════════════════════════════════════════════════════════════
   THE REPORT: "when units bunch together they cannot see what is around
   them". §12.2 names the mechanism: at the shipped pitch a sprite is tall
   relative to a tile's on-screen depth, so a body hides the tile behind it
   AND part of the unit behind that. The reach pips above answer the TILE half
   (a cue anchored above sprite height, painted last). This answers the other
   half — the unit that is simply not on screen because somebody is standing
   in front of it.

   WHAT IT DRAWS. The HIDDEN unit's own silhouette, in its own side colour,
   masked down to exactly the part of itself that is behind a body, with a
   bright rim traced round that patch. Where the unit is visible you still see
   its real art, untouched; where it is not, its figure continues as a
   coloured ghost. The two halves join along the occluder's silhouette, so the
   result reads as one body seen through another rather than as a sticker
   pasted over the scrum.

   🔴 WHY THE OCCLUDER IS NOT FADED, and this is a deliberate rejection.
   §12.3.5 permits ghosting the occluder ("fading or ghosting an occluder is
   legitimate; making the board mushy is not"), and that is the obvious read
   of this piece's own name. It was rejected for two reasons:
     · The occluder is usually the unit the player is ALSO looking at — in the
       crowd fixture the nearest body is a wyrm, a live piece with its own
       plate, ring and facing. Fading it to reveal a mage behind it trades one
       unreadable unit for another and the board gets mushier by exactly the
       amount it gets clearer. §12.3.5's second sentence is the binding one.
     · Fading in a painter's-algorithm canvas means re-drawing the occluder,
       which means a SECOND opinion about what it looks like. Additive ink on
       top needs none: the occluder's draw is not touched at all, so nothing
       downstream of this pass can disagree with what the actor loop painted.
   An additive x-ray costs one thing the fade would not: ink lands on the
   occluder's chest. That is paid for at GHOST_CUE.fill, kept low deliberately
   — the RIM carries the shape read, the fill only carries mass and ownership.

   🔴 THE DEPTH OPINION IS BORROWED, NEVER RE-DERIVED. §12's standing warning
   and the telegraph's own rule: every picture is a RENDERING of something the
   game already decided. "Is A in front of B" is decided once per frame by
   frame()'s painter's sort (camDepth, deepest first). GHOST_ORDER is that
   array's unit entries, in that order, captured immediately after the sort —
   so "occluder" here means literally "drawn later than me this frame". A
   second camDepth() comparison in this file would be a second opinion that
   can drift from the one the pixels came from, which is the failure §12.3.3
   rules out for the tile cue and which applies verbatim here.

   🔴 QUIET AT REST — §12.3.6. Gated on the player actually interrogating the
   board: a host selection (PAINT.sel), a local click (selected) or a hover.
   With none of those the pass returns before it touches the context, so a
   still frame of an unselected board is byte-for-byte the board we had
   before this piece. That is the negative control in
   .gauntlet/tabletop/_ghost-ab.mjs, not a claim made here.

   ⚠ WHAT IS NOT SCOPED, and why. Once engaged, EVERY occluded unit ghosts —
   not just the selection and not a radius round it. Two scopes were drafted
   (whole board when selected, hovered unit only on hover) and collapsed into
   one: the complaint is "what is AROUND them", a radius would need this file
   to own an adjacency rule it does not have (there is no HEX_DIRS on the
   board side — the board is handed sets, it does not walk the grid), and two
   behaviours keyed off two conditions is exactly how the two halves of one
   telegraph come to disagree. The noise floor is carried by GHOST_CUE.minCover
   instead, which is a measurement rather than a guess about neighbours.

   ⚠ WHERE IT SITS IN THE FRAME: after the actors, after the attack arc, after
   the nameplates, and BEFORE drawTeleReach — which stays the last board-space
   pass, as its header demands. Late for the same measured reason round 2
   moved the pips late: plates cluster exactly where bodies cluster, so a cue
   about crowding that runs before them is dimmed precisely in the crowd. It
   goes before the pips because a caret is a hairline and a ghost is a mass;
   losing 3 px of ghost under a caret costs nothing, the reverse costs the
   pip. */
const GHOST_CUE = {
  on: true,
  /* NOISE FLOOR. Fraction of the hidden unit's own screen box that has to be
     covered before it is worth any ink at all. A unit clipped by 3% of itself
     is not hidden, it is adjacent, and ghosting it would put a patch on every
     unit that merely touches a neighbour — which is how this becomes the
     checkerboard §12.3.2 already rejected once, in a different medium.
     ⚠ It is a BOX test and it OVER-counts: two occluders overlapping each
     other are both added. Both errors point the same way — toward drawing —
     and the alpha mask below is the real answer, so this is a cheap reject
     and nothing more. It must never be the thing deciding what the patch
     LOOKS like. */
  minCover: 0.07,
  /* THE FILL is the quiet half. High enough to read as a body, low enough
     that the occluder standing in front of it is still its own art and its
     own colour — §12.3.5's "must still be identifiable as a unit" applies to
     the unit being drawn OVER as much as to the one being revealed. */
  fill: 0.38,
  /* THE RIM is the loud half and it is what actually carries the shape. A
     flat patch at any alpha reads as fog; a patch with a crisp traced edge
     reads as a figure. Same division of labour as the reach caret's dark
     casing under a bright core, and for the same reason — the board runs from
     wet asphalt to pale rubble and one weight reads over neither. */
  edge: 0.95,
  /* Rim thickness as a fraction of the unit's screen height, so it scales
     with the unit the way SIL_PAD does rather than vanishing on a far row and
     fattening on a near one. ~2.7 px on a 60 px crowd unit. */
  rimK: 0.045,
  /* ⏱ THE BUDGET, and it is a real one rather than defensive padding. Each
     ghost costs one sprite render for the hidden unit plus ONE PER OCCLUDER
     for the mask, so the pass is O(units × occluders) sprite renders inside
     frame(). On the crowd fixture that is five ghosts of one or two occluders
     each and invisible. It is not bounded by anything structural: a camera
     sighting down a packed column stacks the whole file into one overlap
     chain, and this page's own load-schedule note records what a few hundred
     ms of unbroken main-thread work looks like to a player (a frozen opening
     that read as a crash).
     So the ghosts are sorted by how much of each unit is actually covered and
     the deepest-buried six are drawn. Six because that is one more than the
     crowd fixture's scrum produces, i.e. the cap cannot be what decides the
     picture in the case this piece was built for — it only truncates the tail,
     and the tail is by construction the units that were barely hidden. */
  maxGhosts: 6,
  /* Same argument one level down: a unit behind eight bodies is behind the
     three nearest of them for every pixel that matters, because the mask is a
     UNION and the nearest occluders already cover what the far ones would.
     ⚠ slice(-n), not slice(0,n): occ is built deepest-first (it is walked in
     the painter's order), so the LAST entries are the nearest bodies — the
     ones actually doing the hiding. Taking the head would keep the four
     furthest occluders and mask the ghost against units that are themselves
     behind the thing in front. */
  maxOccluders: 4
};
try { window.__bbGhost = GHOST_CUE; } catch (e) {}

/* The frame's unit drawables IN PAINTER'S ORDER — written once per frame by
   frame(), read only here. Index order IS the depth answer: a higher index was
   drawn later, therefore is nearer, therefore is an occluder. See the 🔴 note
   above about why this is captured rather than recomputed. */
let GHOST_ORDER = [];

/* Three scratch canvases, reused across units and frames. Allocating per unit
   per frame is three canvas creations × up to a handful of units × 60 fps for
   geometry that is the same size every time; setting .width is already a full
   clear, so the reuse costs nothing in correctness.
   ⚠ The transform, composite op and alpha are ALL reset on the reuse path.
   Only .width changing resets them for free, and a buffer that comes back the
   same size as last frame would otherwise inherit 'destination-in' from the
   unit before it and mask itself away — a bug that appears only when two
   units in one frame happen to have the same screen height. */
const _GHBUF = { a:null, b:null, c:null };
function ghostBuf(slot, w, h){
  let c = _GHBUF[slot];
  if (!c) c = _GHBUF[slot] = document.createElement('canvas');
  if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  const g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.clearRect(0, 0, w, h);
  return c;
}

/* Where a unit's figure lands on screen, from the SAME three lines drawUnit
   opens with. Not unitScreenBox(): that box is the NAMEPLATE's box (h × 0.8h,
   head to feet) and the figures overflow it in both axes — a wyrm's wings
   reach 0.62k either side of 0.4k, a mage's staff glow clears the head, and
   the foot ring sits below the feet entirely. A ghost built on that box is
   clipped along its own wings, which is the one artefact that would make this
   read as a rectangle instead of as a body. */
function ghostAnchor(u){
  if (!u || !u.def) return null;
  const base = gw(u.x, u.z, unitGroundY(u));
  const wy = base.y + u.y;
  const foot = project({ x:base.x, y:wy, z:base.z });
  if (!foot) return null;
  const k = unitScreenH(u.def, base, wy, foot);
  if (!(k > 0)) return null;
  return { foot, k };
}

/* Paint ONE unit's figure into an arbitrary context, in screen coordinates.
   The transform chain is drawUnit's own, minus the things that cannot matter
   to a silhouette: the device-pixel anchor snap (this buffer is already
   device-aligned by its own setTransform), the shake, the rise clip, the
   ctx.filter relight and the hit flash. Facing IS kept — a mirrored sprite is
   a different silhouette, and §12.3.4's directional read would be lying if the
   ghost faced the other way from the body it belongs to.
   ⚠ paintSprite takes its context as an argument and touches no global one;
   every procedural painter below it draws through the same `c`. That is why
   this can render offscreen at all, and it is worth not breaking.
   `ring` adds the foot ring's ellipse to the figure BEFORE the recolour, so a
   ring buried under a body comes back as part of the same patch — §12.3.4
   says nothing may bury the rings, and the honest reading of that is that the
   fix has to bring back the ones the bodies were already burying. Geometry is
   copied from drawUnit's ring deliberately and only here: it is the one place
   a second copy is unavoidable, and it is three numbers next to a comment
   saying so rather than three numbers in a fourth file. */
function ghostFigure(g, u, ring){
  const A = ghostAnchor(u); if (!A) return null;
  const k = A.k, foot = A.foot;
  if (ring){
    const isHero = !!(u.def && (u.def.hero || u.def.isHero)) || /hero/i.test(String(u.key || ''));
    const R = k * (isHero ? 0.52 : 0.42) * 0.78;   /* drawUnit: rr × 0.78 */
    g.save();
    g.translate(foot.x, foot.y);
    g.scale(1, 0.34);                              /* drawUnit: SQ */
    g.lineWidth = Math.max(2, k * 0.06);
    g.strokeStyle = '#ffffff';                     /* colour is applied later */
    g.beginPath(); g.arc(0, 0, R, 0, 6.2832); g.stroke();
    g.restore();
  }
  g.save();
  g.translate(foot.x, foot.y);
  const faceMirror = (CAM.r.x >= 0 ? 1 : -1);
  g.scale((u.face || 1) * faceMirror * (u.scaleX == null ? 1 : u.scaleX),
          (u.scaleY == null ? 1 : u.scaleY));
  try { paintSprite(g, u.key, k, u.def.color, T + (u.bob || 0)); } catch (e) {}
  g.restore();
  return A;
}

/* One hidden unit, one list of the bodies in front of it. */
function ghostOne(u, occ){
  const A = ghostAnchor(u); if (!A) return;
  const k = A.k, foot = A.foot;
  /* The region, in CSS px, sized off k rather than off any box — see
     ghostAnchor. 1.00k either side clears the widest procedural wing (0.62k)
     and the foot ring (0.41k); 1.35k above clears a mage's staff glow; 0.30k
     below clears the ring's squashed lower arc. */
  const x0 = foot.x - k * 1.00, x1 = foot.x + k * 1.00;
  const y0 = foot.y - k * 1.35, y1 = foot.y + k * 0.30;
  const bw = Math.ceil((x1 - x0) * DPR), bh = Math.ceil((y1 - y0) * DPR);
  /* A degenerate or absurd rect costs a ghost, not the board. The ceiling is
     not defensive padding: a unit projected almost edge-on to the camera can
     report a k in the thousands, and allocating that is a stall the player
     would feel as a hitch on select. */
  if (!(bw > 2) || !(bh > 2) || bw > 2048 || bh > 2048) return;

  const ink = sideInk(u);

  /* A — the hidden unit, as a solid silhouette in its own side colour.
     'source-in' over the painted figure REPLACES the colour and KEEPS the
     alpha, antialiased edges included, so the patch is the sprite's own
     outline and not a traced approximation of it. */
  const CA = ghostBuf('a', bw, bh);
  const ga = CA.getContext('2d');
  ga.setTransform(DPR, 0, 0, DPR, -x0 * DPR, -y0 * DPR);
  if (!ghostFigure(ga, u, true)) return;
  ga.setTransform(1, 0, 0, 1, 0, 0);
  ga.globalCompositeOperation = 'source-in';
  ga.fillStyle = 'rgb(' + ink.base + ')';
  ga.fillRect(0, 0, bw, bh);
  ga.globalCompositeOperation = 'source-over';

  /* B — the union of the occluders' own alpha. NOT their boxes: a box mask
     paints ghost into the gaps between a figure's legs and out past its
     shoulders, which is a smear beside the occluder rather than a body behind
     it, and it would also cover the parts of the hidden unit that are already
     visible — i.e. it would hide the very art it is meant to supplement.
     ⚠ No edge contour is requested for the mask. spriteBlit's contour grows a
     real sprite by SIL_PAD, so the mask is a pixel or two TIGHTER than what is
     actually on screen. That errs toward showing slightly more ghost than is
     strictly hidden, which is the safe direction: the alternative is a hairline
     of the hidden unit's real art with ghost on both sides of it. */
  const CB = ghostBuf('b', bw, bh);
  const gb = CB.getContext('2d');
  gb.setTransform(DPR, 0, 0, DPR, -x0 * DPR, -y0 * DPR);
  for (const o of occ) ghostFigure(gb, o, false);

  /* C — THE RIM, AND IT IS TRACED OFF THE UNMASKED FIGURE ON PURPOSE.
     Dilate A by rimK and subtract A, WHILE A IS STILL THE WHOLE UNIT, then mask
     the result with B in the same breath as A itself. So the bright line only
     ever lies on this unit's OWN outline — never along the occluder's edge.

     🔴 ROUND 1 BUILT THIS THE OTHER WAY ROUND and the picture says why it is
     wrong, so the rejected version is recorded rather than deleted. Masking
     first and tracing second outlines the PATCH, which means a hard bright
     border runs down the occluder's silhouette wherever the two figures cross.
     Rendered on the crowd fixture that turned the mage behind the wyrm into a
     blue blob with a crisp border — a solid object of its own, reading as a
     shield rather than as a body seen through a wing, which is §12.3.5's
     "identifiable AS A UNIT" failing on the cue's own output. The foe imp
     survived it only because its patch happened to be nearly its whole body,
     so the patch edge and the figure edge were almost the same line.
     Tracing the figure first costs nothing and the ghost now BLEEDS at the cut
     instead of being bordered there, which is the honest shape of the claim:
     the boundary of the patch is a fact about the occluder, not about the unit
     being revealed, so drawing a line on it states something about the wrong
     body.
     ⚠ EIGHT OFFSETS UNIONED AT FULL OPACITY IN THEIR OWN LAYER, then composited
     once — the same rule spriteEdgeCanvas records the hard way. Stamping eight
     translucent copies straight into one buffer makes the rim's alpha depend on
     how many offsets happen to overlap, i.e. thick at corners and thin along a
     straight edge: an outline whose darkness varies with the shape it outlines. */
  const p = Math.max(1, Math.round(k * GHOST_CUE.rimK * DPR));
  const q = Math.max(1, Math.round(p * 0.7));
  const CC = ghostBuf('c', bw, bh);
  const gc = CC.getContext('2d');
  const OFFS = [[p,0],[-p,0],[0,p],[0,-p],[q,q],[-q,q],[q,-q],[-q,-q]];
  for (const o of OFFS) gc.drawImage(CA, o[0], o[1]);
  gc.globalCompositeOperation = 'destination-out';
  gc.drawImage(CA, 0, 0);
  gc.globalCompositeOperation = 'source-in';
  gc.fillStyle = 'rgb(' + ink.lit + ')';
  gc.fillRect(0, 0, bw, bh);

  /* ∩ B — exactly the parts of this unit, body and outline alike, that are
     behind a body. Both buffers take the SAME mask in the same place, because
     a rim that survived where its fill did not would draw this unit's outline
     across open ground it is not hidden by. */
  ga.globalCompositeOperation = 'destination-in';
  ga.drawImage(CB, 0, 0);
  ga.globalCompositeOperation = 'source-over';
  gc.globalCompositeOperation = 'destination-in';
  gc.drawImage(CB, 0, 0);
  gc.globalCompositeOperation = 'source-over';

  /* onto the board. ctx carries the DPR transform and the buffers are
     DPR-scaled, so this is a 1:1 device blit at both alphas. */
  ctx.save();
  ctx.globalAlpha = GHOST_CUE.fill; ctx.drawImage(CA, x0, y0, x1 - x0, y1 - y0);
  ctx.globalAlpha = GHOST_CUE.edge; ctx.drawImage(CC, x0, y0, x1 - x0, y1 - y0);
  ctx.restore();
}

/* THE PASS. Own try/catch at the call site — CONTRACT R2's frameErr is a
   one-way latch, so a bad ghost costs the ghosts and not the board. */
function drawOccluderGhost(t){
  if (!GHOST_CUE.on) return;
  /* §12.3.6, and the three states are the three ways the player says "I am
     asking about this board": the host pushed a selection, the board was
     clicked directly (standalone), or the pointer is over a tile. */
  if (!PAINT.sel && selected == null && !hoverTile) return;
  const L = GHOST_ORDER;
  if (!L || L.length < 2) return;

  /* One box per unit, once. unitScreenBox IS the right tool here — this is a
     cheap overlap reject, not the mask, and the mask is alpha-accurate. */
  const BOX = [], want = [];
  for (let i = 0; i < L.length; i++){
    const u = L[i] && L[i].u;
    BOX.push((u && !u.dead && u.y > -0.9) ? unitScreenBox(u) : null);
  }
  for (let i = 0; i < L.length; i++){
    const B = BOX[i]; if (!B) continue;
    const area = B.width * B.height; if (!(area > 0)) continue;
    let cover = 0;
    const occ = [];
    /* j > i is the whole depth test: later in this array means painted later
       means nearer. */
    for (let j = i + 1; j < L.length; j++){
      const O = BOX[j]; if (!O) continue;
      const ow = Math.min(B.left + B.width, O.left + O.width) - Math.max(B.left, O.left);
      const oh = Math.min(B.top + B.height, O.top + O.height) - Math.max(B.top, O.top);
      if (!(ow > 0) || !(oh > 0)) continue;
      cover += ow * oh;
      occ.push(L[j].u);
    }
    if (!occ.length || cover / area < GHOST_CUE.minCover) continue;
    want.push({ u: L[i].u, occ, cover: cover / area });
  }
  /* most-buried first, then the budget — see GHOST_CUE.maxGhosts. Sorting by
     COVER rather than by depth is deliberate: depth says which unit is furthest
     away, cover says which one the player can least see, and the second is the
     question this piece exists to answer. */
  want.sort((a, b) => b.cover - a.cover);
  for (const w of want.slice(0, GHOST_CUE.maxGhosts))
    try { ghostOne(w.u, w.occ.slice(-GHOST_CUE.maxOccluders)); } catch (e) {}
}

/* The AIR half — the attack arc, drawn AFTER the depth-sorted actors so it
   passes over the units instead of under them (BAR R2: "drawn above the
   board"). Sampled in WORLD space and projected per sample: a curve drawn
   between two projected endpoints in SCREEN space is a different curve at
   every yaw, and at 90° it lies flat against the board. */
/* ══════════════════════════════════════════════════════════════════
   🏷 ENEMY NAMEPLATES — BAR R3: "name in caps, a segmented health bar,
   readable at distance", floating above the unit and never on hover only
   ("enemy health only visible on hover" is a named fail condition).

   ENEMIES ONLY, and that is the requirement, not a shortcut: the player's
   own roster is already spelled out in the rail with full stats, and a
   plate over every friendly would double that read while burying the
   board. The bar's own words are "enemy nameplates float above units".

   NO PIPS FOR ARMOUR/SHIELDS. R3 asks for them; this game has no per-unit
   armour or shield COUNTER to show — DEF/RES are stats, not charges — so
   inventing pips here would be the HUD asserting a mechanic that does not
   exist. Said out loud rather than faked.

   Drawn after the painter's sort, in its own pass, so a plate is never
   swallowed by the unit standing in front of its owner. Every number is
   rounded to a whole device pixel for the same reason the sprites are:
   text resampled off the pixel grid is the other half of "no blur".
   ══════════════════════════════════════════════════════════════════ */
function drawNameplates(){
  const R = v => Math.round(v * DPR) / DPR;
  /* far to near, so a nearer plate overlaps a farther one — the same
     answer the actors themselves get from the depth sort */
  const list = units.filter(u => !u.dead && u.side === 'foe' && u.uname && u.hpMax != null && u.y > -0.9)
                    .map(u => ({ u, d: camDepth(gw(u.x, u.z, 0)) }))
                    .sort((a, b) => b.d - a.d);
  for (const { u } of list){
    const box = unitScreenBox(u); if (!box) continue;
    /* ease the drawn bar toward the real value — a hit that just snaps is
       hard to notice on a plate this small */
    const want = u.hpCur / u.hpMax;
    u.hpShown = u.hpShown == null ? want : u.hpShown + (want - u.hpShown) * 0.14;
    const pct = clamp(u.hpShown, 0, 1);

    /* SIZE. CONTRACT §6.8 — the End Turn button is the loudness ceiling and
       nothing new may out-shout it. The first cut sized the plate off the
       unit at 1.25× and it dominated the field: thirteen plates as tall as
       the sprites under them. Capped at 1.0 and floored so a distant unit's
       plate stays legible (BAR R3, "readable at distance") without growing. */
    const S = clamp(box.height / 58, 0.62, 1.0);
    const nameSz = Math.max(7.5, 9 * S);
    ctx.font = '700 ' + nameSz.toFixed(1) + 'px "Cinzel", Georgia, serif';
    const nm = String(u.uname).toUpperCase();
    const tw = ctx.measureText(nm).width;
    const padX = 6 * S, barH = Math.max(2.5, 3.4 * S), gapY = 2.5 * S;
    const w = Math.max(44 * S, tw + padX * 2);
    const h = nameSz + gapY + barH + 6 * S;
    /* ⚠ CLAMPED INTO THE CANVAS, not just skipped when it leaves it. The far
       row of a 14×12 board projects within a few pixels of the top edge, so an
       un-clamped plate for the units that matter most early — the ones you
       have not reached yet — is the half that gets guillotined by the host
       rect. Clamping puts it just inside instead. */
    const cx = clamp(R(box.left + box.width / 2), w / 2 + 2, W - w / 2 - 2);
    const y0 = clamp(R(box.top - h - 7 * S), 2, H - h - 2);
    const x0 = R(cx - w / 2);

    /* 🧱 …and the plate is in the SAME depth sequence as everything else. It is
       the one drawable whose screen box is not derived from its own feet — it
       is clamped into the canvas — so the clip is asked for with the PLATE's
       rect while the depth and the footing still come from the unit. A plate
       whose unit is hidden behind a near cliff loses only the part of itself
       that is actually behind that cliff; the rest still floats above the slab,
       which is what keeps BAR R3's "readable at distance" true. */
    const _put = unitTile(u);   /* the tile under the sprite NOW, not its destination */
    const _pclip = clipBehindTerrain(gw(u.x, u.z, unitGroundY(u) + (u.y||0)), unitGroundY(u),
                                     { x0, x1: x0 + w, y0, y1: y0 + h }, _put.x, _put.z);
    /* ⚠ try/finally, matching the actor loop in frame() and for the same
       reason: ctx.save() is a STACK, and one throw between here and the
       restore leaks a frame's clip into the rest of this frame and every frame
       after it — the canvas state stack then grows for the life of the
       session. Nothing in the plate body throws today; the actor loop's
       comment says the same and it is still wrapped. */
    try {

    /* the plate. Dark, hard-edged, one thin keyline — BAR R2's chrome rule.
       Deliberately quieter than the End Turn button (CONTRACT §6.8). */
    ctx.fillStyle = 'rgba(9,8,13,0.82)';
    ctx.fillRect(x0, y0, w, h);
    ctx.lineWidth = 1 / DPR;
    ctx.strokeStyle = u.hero ? 'rgba(224,85,60,0.85)' : 'rgba(210,164,78,0.42)';
    ctx.strokeRect(x0 + 0.5 / DPR, y0 + 0.5 / DPR, w - 1 / DPR, h - 1 / DPR);

    ctx.fillStyle = u.hero ? '#f6dc95' : '#e9dab2';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(nm, cx, R(y0 + 3.5 * S));

    /* THE SEGMENTED BAR. One segment per HIT POINT while that is legible —
       which is the XCOM read the bar is asking for, "how many more hits"
       rather than "what fraction". Above 12 max HP the segments would be
       thinner than the gaps between them, so it falls back to twelfths and
       stops claiming to count individual points. */
    const segs = u.hpMax <= 12 ? u.hpMax : 12;
    const exact = u.hpMax <= 12;
    const on = exact ? Math.ceil(pct * u.hpMax) : Math.round(pct * segs);
    const bx = x0 + padX * 0.6, bw = w - padX * 1.2;
    const gap = Math.max(1 / DPR, 1.2 * S);
    const sw = (bw - gap * (segs - 1)) / segs;
    const by = R(y0 + nameSz + gapY + 3.5 * S);
    for (let i = 0; i < segs; i++){
      const sx = bx + i * (sw + gap);
      /* ⚠ ONE COLOUR FOR "ALIVE", ONE FOR "NEARLY DEAD", AND THAT IS ALL.
         The first cut ran a green→amber→red ramp like the rail's own bar, on
         a plate that is already red-keyed because the unit is an ENEMY — so a
         foe at full health showed a dark red bar and a foe at a third showed a
         brighter orange one, which reads as the wrong way round. The COUNT of
         lit segments is the information; the colour only says whether this one
         is a kill this turn. */
      ctx.fillStyle = i < on
        ? (pct <= 0.34 ? '#f0705a' : '#c9432f')
        : 'rgba(120,112,98,0.30)';
      ctx.fillRect(R(sx), by, Math.max(1 / DPR, sw), barH);
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';

    } finally { if (_pclip) ctx.restore(); }
  }
}

/* 🎯 THE TARGET FAN — every unit and hero the selected attack can reach.
   ══════════════════════════════════════════════════════════════════════════
   Asked for: on選 selecting an attack, an arrow to EVERY target in range; on
   hovering one of them, the others drop away; on leaving, they come back;
   until a target is actually chosen.

   That is three states and the renderer only has to know two of them, because
   the host already distinguishes them for it:
     TELE.arc   the FOCUSED arc — the hovered target, or the AI's own swing
     TELE.arcs  every candidate, sent while an attack is selected
   So: a focused arc wins outright and is drawn alone; with no focus, the whole
   fan is drawn. Hover and un-hover are then just the host setting or clearing
   `arc`, and "until a target is selected" falls out for free — committing the
   attack clears the attack set, so `arcs` empties on the next push.

   ⚠ THE FAN IS DIMMER, AND THAT IS THE POINT. Eight arcs at the focused arc's
     0.98 alpha is a cat's cradle nobody can read a decision out of. The fan is
     a survey ("these are your options"); the focused arc is an intent ("this
     one"). Same geometry, different weight — if they looked identical, hovering
     would appear to do nothing at all.
   ⚠ Order matters: the fan is drawn BEFORE anything focused, so a focused arc
     is never buried under its own candidates. */
function drawTeleArc(t){
  if (TELE.arc && TELE.arc.from && TELE.arc.to) { drawOneArc(TELE.arc, t, 1); return; }
  const fan = TELE.arcs || [];
  for (const a of fan) if (a && a.from && a.to) drawOneArc(a, t, 0.42);
}
function drawOneArc(a, t, weight){
  if (!a || !a.from || !a.to) return;
  const W = (weight == null) ? 1 : weight;
  /* 🏹 v121v149 — two more sides, for the AIMING arrow.
       ok  the hovered tile or unit is a LEGAL target / a legal placement
       no  it is not
     Both reuse colours the board already assigns those meanings elsewhere
     (PAINT.place green, the attack red), so the arrow agrees with the tiles
     underneath it instead of introducing a third palette. Any other value
     still falls through to the original mine/foe pair. */
  const aimOk   = (a.side === 'ok');
  const aimDeny = (a.side === 'no');
  const mine = a.side !== 'foe';
  const col  = aimOk ? '#7fe89f' : aimDeny ? '#ff5a4a' : (mine ? '#7fd8ff' : '#ff5a4a');
  const A = gw(a.from.x, a.from.z, tileElev(a.from.x, a.from.z) + 0.52);
  const B = gw(a.to.x,   a.to.z,   tileElev(a.to.x,   a.to.z)   + 0.52);
  const span = Math.hypot(B.x-A.x, B.z-A.z);
  const lift = Math.max(0.7, span * 0.44);
  const N = 30, S = [];
  for (let i=0;i<=N;i++){
    const u = i/N, v = 1-u;
    const p = project({ x: v*v*A.x + 2*v*u*((A.x+B.x)/2)        + u*u*B.x,
                        y: v*v*A.y + 2*v*u*((A.y+B.y)/2 + lift) + u*u*B.y,
                        z: v*v*A.z + 2*v*u*((A.z+B.z)/2)        + u*u*B.z });
    if (!p) return;
    S.push(p);
  }
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const w = Math.max(2.4, tileR() * S[N].s * 0.16);
  ctx.beginPath(); ctx.moveTo(S[0].x, S[0].y);
  for (let i=1;i<=N;i++) ctx.lineTo(S[i].x, S[i].y);
  ctx.strokeStyle = rgba('#04080e', 0.62 * W); ctx.lineWidth = w + 4; ctx.stroke();
  ctx.strokeStyle = rgba(col, 0.34 * W);       ctx.lineWidth = w * 2.4; ctx.stroke();
  ctx.strokeStyle = rgba(col, 0.98 * W);       ctx.lineWidth = w;       ctx.stroke();
  /* travelling charge — the arc reads as intent, not as a static rope.
     🏹 v121v149 — and that is exactly why a DENIED arrow does not get it. Flow
     toward the target reads as "this is happening"; on a tile the click is
     about to refuse, the animation would be the board contradicting the rule
     it is trying to state. Denied stays a static line with a head. */
  for (let k=0;k<3 && !aimDeny;k++){
    const u = ((t*0.85 + k/3) % 1) * N;
    const i = Math.min(N-1, u|0), f = u - i;
    const px = S[i].x + (S[i+1].x - S[i].x)*f, py = S[i].y + (S[i+1].y - S[i].y)*f;
    ctx.beginPath(); ctx.arc(px, py, w*0.9, 0, 7);
    ctx.fillStyle = rgba('#ffffff', 0.75 * W); ctx.fill();
  }
  /* head at the target end */
  const p1 = S[N], p0 = S[N-1];
  const dx = p1.x-p0.x, dy = p1.y-p0.y, len = Math.hypot(dx,dy) || 1;
  const ux = dx/len, uy = dy/len, hl = w*3.4, hw = w*1.7;
  ctx.beginPath();
  ctx.moveTo(p1.x + ux*hl*0.35, p1.y + uy*hl*0.35);
  ctx.lineTo(p1.x - ux*hl + -uy*hw, p1.y - uy*hl + ux*hw);
  ctx.lineTo(p1.x - ux*hl +  uy*hw, p1.y - uy*hl + -ux*hw);
  ctx.closePath();
  ctx.fillStyle = rgba(col, 0.98 * W); ctx.fill();
  ctx.strokeStyle = rgba('#04080e', 0.7 * W); ctx.lineWidth = 1.8; ctx.stroke();
  /* and a ring under the target's feet so ownership reads even when the arc
     crosses a crowd (BAR R2's directional foot ring, in the attack colour) */
  const f = project(gw(a.to.x, a.to.z, tileElev(a.to.x, a.to.z) + 0.02));
  if (f){
    const r = ringPx(f, tileR() * 0.72);
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale(1, 0.46);
    ctx.beginPath(); ctx.arc(0, 0, r * (0.9 + Math.sin(t*4)*0.06), 0, 7);
    ctx.strokeStyle = rgba(col, 0.9); ctx.lineWidth = 2.6; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* Re-stroke the move/attack/place/swap highlight on top of a painted surface —
   brighter and thicker than the under-ground pass so it reads through flames
   and oil sheen. Keyed off SURFACES so a clean tile is never touched twice. */
function drawPaintOverSurfaces(T){
  for (const key in SURFACES){
    if (!SURFACES[key]) continue;
    let col = null;
    if (PAINT.attack.has(key))     col = '#ff5a4a';
    /* move is not re-stroked here either — see the note in drawBoard(). The
       move region is composited by drawTeleGround(), which runs AFTER this
       function and therefore already reads through fire and oil. */
    else if (PAINT.place.has(key)) col = '#7fe89f';
    else if (PAINT.swap.has(key))  col = '#e0b64a';
    if (!col) continue;
    const c = key.split(','), gx = +c[0], gz = +c[1];
    if (!isFinite(gx) || !isFinite(gz)) continue;
    const P = tilePoly(gx, gz, 0.02); if (!P) continue;
    const pulse = 0.22 + Math.sin(T * 3 + (gx + gz) * 0.6) * 0.07;
    pathPoly(P); ctx.fillStyle = rgba(col, pulse); ctx.fill();
    pathPoly(P); ctx.strokeStyle = rgba(col, 0.95); ctx.lineWidth = 2.5; ctx.stroke();
  }
}
/* 🂠 the card back itself — a flat quad on the tile, not a billboard. Drawn in
   the ground pass so a unit standing in front still occludes it correctly. */
function drawFacedownCards(T){
  if (!FACEDOWN.length) return;
  for (const f of FACEDOWN){
    if (!f) continue;
    const P = tilePoly(f.x, f.z, 0.028); if (!P) continue;
    const cx = (P[0].x+P[1].x+P[2].x+P[3].x)/4, cy = (P[0].y+P[1].y+P[2].y+P[3].y)/4;
    /* inset toward the tile centre — a card is smaller than the square it sits on */
    const IN = 0.28;
    const q = P.map(p => ({ x: cx + (p.x-cx)*(1-IN), y: cy + (p.y-cy)*(1-IN) }));
    const foe = (f.side === 'foe');
    ctx.save();
    /* body */
    pathPoly(q);
    const g = ctx.createLinearGradient(q[0].x, q[0].y, q[2].x, q[2].y);
    g.addColorStop(0,   '#241d46');
    g.addColorStop(0.5, '#3a2f6e');
    g.addColorStop(1,   '#181334');
    ctx.fillStyle = g; ctx.fill();
    /* owner rim — the whole point of colouring it: whose trap is that? */
    pathPoly(q);
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = foe ? 'rgba(255,108,94,0.95)' : 'rgba(96,196,255,0.95)';
    ctx.stroke();
    /* inner frame + a slow sheen so it reads as a CARD and not as a painted tile */
    const q2 = q.map(p => ({ x: cx + (p.x-cx)*0.74, y: cy + (p.y-cy)*0.74 }));
    pathPoly(q2);
    ctx.lineWidth = 1.1;
    ctx.strokeStyle = foe ? 'rgba(255,150,140,0.55)' : 'rgba(150,215,255,0.55)';
    ctx.stroke();
    const sheen = 0.10 + Math.sin(T*1.6 + (f.x + f.z)*0.9)*0.06;
    pathPoly(q2);
    ctx.fillStyle = 'rgba(210,225,255,' + sheen.toFixed(3) + ')';
    ctx.fill();
    ctx.restore();
  }
}
function drawSurfaceFx(T){
  const keys = Object.keys(SURFACES);
  if (!keys.length) return;
  for (const key of keys){
    const fx = SURFACE_2D[SURFACES[key]];
    if (!fx) continue;
    const p2 = key.split(','), gx = +p2[0], gz = +p2[1];
    const quad = _sQuad(gx, gz);
    if (!quad) continue;
    /* The centre used to be the mean of EXACTLY FOUR vertices and the radius
       came out of |q1.x-q0.x| / |q2.x-q3.x|, i.e. a specific square winding.
       Both are now derived from the projection itself: the tile centre is a
       real world point, and p.s is pixels-per-world-unit at that depth, so
       SIZE*p.s is the hexagon's circumradius in pixels with no winding
       assumption left to break. */
    const cp = project(gw(gx, gz, tileElev(gx, gz) + 0.012));
    if (!cp) continue;
    const cx2 = cp.x, cy2 = cp.y;
    const r2 = Math.max(6, hexSize() * cp.s);
    ctx.save();
    ctx.beginPath();
    quad.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y));
    ctx.closePath();
    ctx.clip();
    try { fx(ctx, quad, cx2, cy2, r2, T, gx, gz); } catch (e) {}
    ctx.restore();
  }
}
/* ══════════════════════════════════════════════════════════════════════════
   ⏱ THE LOAD SCHEDULE — why the board used to freeze when a battle opened.
   ══════════════════════════════════════════════════════════════════════════
   MEASURED, standalone at 1280x800 DPR 1, an 8x7 map with 10 units and the
   dark-forest location, driving frame() by hand (three cold runs):

     board:init handler (buildStage + heightfield + defs + units)   0.6-0.8 ms
     frame 0                                              269 / 305 / 390 ms
       ├─ vista world bake (sky+land+art+post+world)         94 / 106 / 118
       ├─ bakeTerrain #1                                    107 / 130 / 145
       ├─ vista grade, first call                            56 /  56 /  59
       └─ everything else (sprites, pylons, dressing, fx)         ~10
     frame 1  (bakeTerrain #2 — tone lock iteration 2)      59 / 59 / 65
     frame 2  (bakeTerrain #3 — tone lock iteration 3)      69 / 71 / 68
     ─────────────────────────────────────────────────────────────────
     435-523 ms of blocking, of which ONE UNBROKEN BLOCK of 269-390 ms.

   Ruled OUT by the same instrumentation, so nobody re-audits them:
     backdrop plate decode + buildPlate   0.2 ms  (and already in an onload)
     sprite decode / applyDefs+applyUnits 1.2 ms  with ten 1 MB stills
     isPixelArt probe                     0.0 ms  (already budgeted 4/frame)
     layout / buildHeightfield / braziers  <0.1 ms

   So there is no single item to delete: three bakes that all have to happen.
   What was wrong is that they all happened in the SAME frame, and the two
   refinement bakes in the two frames straight after it — 435 ms in which the
   browser never got a turn, so no input was dispatched and rAF was starved,
   which is why an opening animation would have frozen along with everything
   else.

   THIS METERS THEM: at most one heavy item per frame, in the order the board
   needs them, with the pure-refinement work pushed off the first-interactive
   path entirely.

     step 0  nothing heavy   ~2 ms   ← input is live HERE, and the opening starts
     step 1  vista bake      ~106 ms
     step 2  bakeTerrain #1  ~130 ms ← the board is now correct
     step 3  vista grade     ~59 ms  ← …and correctly graded
     step 12 bakeTerrain #2  ~59 ms  ┐ the tone lock's closed-loop refinement.
     step 20 bakeTerrain #3  ~68 ms  ┘ It converges worstErr to ~2.4 luma and
             nothing else depends on it, so it is DEFERRED rather than paid
             before the player can act — 127 ms off the critical path.

   ⚠ THE SCHEDULE IS BY FRAME ORDINAL, NOT BY CLOCK. A wall-clock schedule
   cannot be verified in a pane where rAF does not fire, and it degrades badly
   on a slow device: at 20 fps a 400 ms hold would still be metering work the
   board wanted at frame 3. Ordinals stretch with the device, which is the
   behaviour that is actually wanted for a refinement.
   ⚠ Nothing here changes WHAT is drawn. Every gate below only decides WHICH
   FRAME a pass first runs on; the pass itself is untouched, and once the
   schedule retires (`LOADQ.on = false`) every call site is exactly what it
   was. A gate that is never opened would be a permanently broken board, so
   step 21 retires the whole thing unconditionally. */
const LOADQ = { on:false, step:-1, terrainAt:[2,12,20], marks:[] };
function loadBegin(){
  /* -1 because frame() increments BEFORE it reads: the first frame is step 0. */
  LOADQ.on = true; LOADQ.step = -1; LOADQ.marks.length = 0;
}
/* one call per item per frame; `what` is 'vista' | 'terrain' | 'grade'. */
function loadAllow(what){
  if (!LOADQ.on) return true;
  const s = LOADQ.step;
  if (what === 'vista')   return s >= 1;
  if (what === 'grade')   return s >= 3;
  if (what === 'terrain') return LOADQ.terrainAt.indexOf(s) >= 0;
  return true;
}

/* ══════════════════════════════════════════════════════════════════════════
   🎬 THE REVEAL — the board pulled back out of darkness.
   ══════════════════════════════════════════════════════════════════════════
   The owner's brief: "a zooming out from darkness like Yu-Gi-Oh Master Duel".

   ⚠ IT IS NOT DRIVEN BY frame(). That is the whole design decision. rAF is
   starved by exactly the work this is covering — an opening animated inside
   the render loop would stutter on the same 130 ms bakes it is there to hide,
   and an animation that hides a freeze is still a freeze. So it is TWO
   compositor-thread animations (transform on #stage, opacity on #veil, and
   nothing else: no filter, no box-shadow, no width) started BEFORE the first
   bake. Chrome runs those off the main thread, so the pull-back keeps moving
   through a 130 ms block. The schedule above is the other half — the blocks
   are now short enough that the two agree about what the frame looks like.

   ⚠ IT DOES NOT GATE INPUT. #veil is pointer-events:none, and no handler
   consults REVEAL before dispatching. Controls are live from the first frame
   after board:init — measured at ~2 ms, against 435 ms before.

   ⚠ AND IT MOVES THE PIXELS UNDER THE CURSOR. While the canvas is scaled, the
   point the player aimed at is not the point the projection expects, and a
   pick that is off by most of a tile is SILENT — the click still routes
   through board:tileClick into the game (see the note on pickTile). unzoom()
   below undoes the transform for every pick, reading the live matrix off the
   element so there is one source of truth for the curve rather than a JS
   copy of the easing that could drift from the CSS. */
const REVEAL = {
  DUR: 900, SCALE: 1.16, ORIGIN_Y: 0.46,
  run:false, reduced:false, anims:[], startedAt:0, gen:0
};
function revealReduced(){
  try { return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch (e) { return false; }
}
function revealStart(){
  const veil = document.getElementById('veil');
  if (!veil || !cv || typeof cv.animate !== 'function') return;
  /* ⚠ DO NOT RESTART AN OPENING THAT HAS BARELY BEGUN. Boot starts one and
     board:init starts the real one — and embedded those are milliseconds
     apart, because the host sends init on `board:ready`, which is posted in
     the same block as the boot call below. Restarting there is invisible. The
     guard is for the case where it would NOT be: an init that lands after the
     veil has started to lift would slam the screen back to black, which reads
     as a flicker rather than as an opening. Under 200 ms the darkness is still
     at full hold (see the veil keyframes), so continuing is indistinguishable
     from restarting and cannot flicker by construction. */
  if (REVEAL.run && REVEAL.startedAt &&
      ((window.performance && performance.now) ? performance.now() : 0) - REVEAL.startedAt < 200) return;
  /* ⚠ GENERATION, NOT A BARE FLAG. Boot starts an opening and board:init
     starts the real one a moment later, which CANCELS the first — and a
     cancelled animation REJECTS its `finished` promise. The obvious
     `.then(done, done)` therefore fired the boot opening's completion handler
     during the match opening and cleared REVEAL.run while the canvas was still
     scaled 1.16 — which switches unzoom() off mid-move and hands every pick a
     coordinate up to most of a tile out, silently. Measured: run=false with
     the live transform reading matrix(1.16,…). Only the current generation is
     allowed to end the current opening. */
  try { REVEAL.anims.forEach(a => a.cancel()); } catch (e) {}
  REVEAL.anims.length = 0;
  const gen = ++REVEAL.gen;
  REVEAL.reduced = revealReduced();
  REVEAL.startedAt = (window.performance && performance.now) ? performance.now() : 0;
  /* ♿ REDUCED MOTION: no camera move at all — the transform animation is not
     merely shortened, it is never created, so unzoom() stays a no-op and the
     pick can never be wrong for a player who asked for no motion. What is
     kept is a short opacity settle, because the alternative is a hard cut
     from black to a fully-lit battlefield, and opacity is not motion. */
  if (REVEAL.reduced){
    REVEAL.run = false;
    REVEAL.anims.push(veil.animate(
      [{ opacity:1 }, { opacity:0 }],
      { duration:220, easing:'linear', fill:'backwards' }));
    return;
  }
  REVEAL.run = true;
  /* THE CAMERA. One settle, no overshoot: a bounce reads as a UI spring, not
     as a camera coming to rest.
     ⚠ THE EASING IS THE WHOLE READ, AND THE FIRST ONE WAS WRONG.
     cubic-bezier(.16,.78,.28,1) spent 92% of the pull-back in the first 270 ms
     — measured, scale 1.16 -> 1.0315 by t=270 — which is exactly the stretch
     the veil is still opaque for. The camera had therefore finished moving
     before there was anything to see, and what the player got was a black
     screen followed by a board that was simply THERE. This is an ease-out
     QUAD, whose progress at the veil's three landmarks is 0.51 / 0.81 / 0.95:
     the board is still visibly 8% oversized when the darkness starts to lift
     and settles as it clears, so the pull-back and the reveal are the same
     gesture rather than two things that happened to be scheduled together. */
  REVEAL.anims.push(cv.animate(
    [{ transform:'scale(' + REVEAL.SCALE + ')' }, { transform:'scale(1)' }],
    { duration:REVEAL.DUR, easing:'cubic-bezier(.25,.46,.45,.94)', fill:'backwards' }));
  /* THE DARKNESS. A real hold at full black for the first 16% — that hold is
     what makes it read as a deliberate opening rather than as a page still
     loading, and it is also the window the two heavy bakes land in (steps 1
     and 2 of THE LOAD SCHEDULE, ~106 ms and ~111 ms). Then it lifts, and is
     gone by 86% so the camera's last beat happens on a clear board. */
  REVEAL.anims.push(veil.animate(
    [{ opacity:1, offset:0 }, { opacity:1, offset:0.16 },
     { opacity:0.86, offset:0.34 }, { opacity:0.30, offset:0.62 },
     { opacity:0, offset:0.86 }, { opacity:0, offset:1 }],
    { duration:REVEAL.DUR, easing:'linear', fill:'backwards' }));
  const done = () => { if (REVEAL.gen === gen) REVEAL.run = false; };
  try { REVEAL.anims[0].finished.then(done, done); }
  catch (e) { if (REVEAL.gen === gen) REVEAL.run = false; }
}
/* live scale off the element — see the warning above. 1 when nothing is running. */
function revealScale(){
  if (!REVEAL.run) return 1;
  try {
    const t = getComputedStyle(cv).transform;
    if (!t || t === 'none') return 1;
    const m = (typeof DOMMatrixReadOnly === 'function') ? new DOMMatrixReadOnly(t)
            : (typeof DOMMatrix === 'function' ? new DOMMatrix(t) : null);
    const s = m ? m.a : 1;
    return (s > 0.01 && s < 8) ? s : 1;
  } catch (e) { return 1; }
}
/* undo the opening's scale for a pick. Pure identity once it has finished. */
function unzoom(mx, my){
  const s = revealScale();
  if (Math.abs(s - 1) < 1e-4) return { x:mx, y:my };
  const ox = W * 0.5, oy = H * REVEAL.ORIGIN_Y;
  return { x: ox + (mx - ox) / s, y: oy + (my - oy) / s };
}
/* 🖱 THE PICK POLYS — DELETED BY THE BATTLEFIELD-HEX MERGE, and this one is a
   deletion that MAKES the code more correct rather than costing something.
   What stood here was seedPickPolys(), which pre-filled TERRAIN.poly with ~56
   tilePoly() calls so that clicks resolved correctly in the window BEFORE the
   first terrain bake landed (the load schedule defers that bake two frames).
   It existed only because pickTile() used to be a hit-test: it scanned the
   BAKED projected top faces in reverse paint order, so with no bake there were
   no polys and every click in that window hit nothing.
   The hex branch's pickTile() is ANALYTIC — it unprojects the cursor to a ray
   and sweeps tileElevRungs() through worldToTile()/cubeRound(), consulting no
   cache whatsoever. There is nothing to seed, nothing to invalidate on resize,
   and no cold-start window to cover: it is correct on the very first frame.
   Removed rather than left dangling because its body read TERRAIN.poly, and
   TERRAIN went with the old bake — a call would have thrown ReferenceError. */

/* ⏱ PER-SECTION FRAME COST — a ring buffer of the last 120 frames, six
   performance.now() calls a frame and nothing else. It exists because the free
   camera turned a BAKED diorama into one that can be invalidated every frame,
   and "the camera is smooth" is not a claim anyone should make from a
   screenshot. `window.__bbPerf()` returns medians in ms per section plus
   whether the camera was moving, which is the only way to tell a slow bake
   apart from a slow blit apart from a slow sky. */
const PERF = { i:0, n:0, buf:[], moving:0 };
function perfPush(rec){
  PERF.buf[PERF.i] = rec; PERF.i = (PERF.i + 1) % 120; if (PERF.n < 120) PERF.n++;
}
window.__bbPerf = () => {
  const all = PERF.buf.slice(0, PERF.n);
  /* Split by whether the camera was MOVING on that frame — averaging the two
     together is how a 6fps pan hides behind a 300fps idle. */
  const stat = rows => {
    if (!rows.length) return { frames:0 };
    const med = k => { const a = rows.map(r => r[k]).sort((x,y) => x-y); return +a[a.length>>1].toFixed(2); };
    return { frames: rows.length, total:med('total'), sky:med('sky'),
             terrainBake:med('bake'), terrainBlit:med('blit'), board:med('board'),
             fx:med('fx'), actors:med('actors'), atmos:med('atmos') };
  };
  return { moving: stat(all.filter(r => r.mov)), parked: stat(all.filter(r => !r.mov)),
           /* the bake COUNTERS — see PERFC. Integers, not medians: "how many
              bakes did that transition do" is the question they answer. */
           counters: Object.assign({}, PERFC),
           press: { id:PRESS.id, key:PRESS.key, pressMs:+PRESS.pressMs.toFixed(2), startMs:PRESS.startMs == null ? null : +PRESS.startMs.toFixed(1),
                    steps: PRESS.steps.map(x => ({ n:x.n, ms:+x.ms.toFixed(2), at:+x.at.toFixed(1), ok:x.ok })),
                    /* the last idle warm's steps, timed from the same press */
                    warmSteps: PRESS.warmSteps.map(x => ({ n:x.n, ms:+x.ms.toFixed(2), at:+x.at.toFixed(1), ok:x.ok })) },
           /* The bake's unit of work, from the LAST bake. Not a median: the
              stat rows are per frame and a cached frame bakes nothing, so a
              median over them would read zero and hide exactly the frames that
              cost. terrainBake above is what it cost; this is what it did. */
           skirt: { painted:SKIRT_STAT.painted, asked:SKIRT_STAT.asked,
                    areaKpx:+SKIRT_STAT.areaKpx.toFixed(1), maxR:+SKIRT_STAT.maxR.toFixed(1),
                    budget:SKIRT_STAT.budget, lod:SKIRT_STAT.lod,
                    cull:{ quad:SKIRT_STAT.cullQuad, screen:SKIRT_STAT.cullScreen, lod:SKIRT_STAT.cullLod } },
           /* Only meaningful after __bbTerrSec(true); zeros otherwise. */
           terrainSections: TSEC.on ? { apron:+TSEC.apron.toFixed(2), art:+TSEC.art.toFixed(2),
                                        plan:+TSEC.plan.toFixed(2), sweep:+TSEC.sweep.toFixed(2),
                                        skirt:+TSEC.skirt.toFixed(2), field:+TSEC.field.toFixed(2),
                                        tail:+TSEC.tail.toFixed(2),
                                        top:TSEC.top.slice().sort((a,b)=>b.ms-a.ms).slice(0,6) } : null };
};
window.__bbPerfReset = () => { PERF.buf.length = 0; PERF.i = 0; PERF.n = 0; for (const k in PERFC) PERFC[k] = 0; };

/* ══════════════════════════════════════════════════════════════════
   🧱 TERRAIN OCCLUSION — slabs and billboards in ONE depth sequence
   ══════════════════════════════════════════════════════════════════
   THE BUG THIS KILLS. The ground was painted whole (drawBoard) and every actor
   was painted after it, so a unit was ALWAYS in front of every slab on the map.
   At yaw 0 that is invisible, because the only terrain that can be nearer than
   a unit is also BELOW it on screen. Turn the camera and it stops being true: a
   ruin core or a rubble terrace that now sits between the eye and the unit is
   still painted first, so the pixel showing that unit's feet is terrain that
   should be in front of them — and the ground ring and shadow float on top of a
   cliff face they are behind.

   WHY A CLIP AND NOT A SECOND TERRAIN PASS. By the time the actors go down the
   ground is not just slabs any more: the surface-FX blit, the reachable-region
   paint, the threat wash, the walked route, the runes and the ground VFX are all
   composited over it. Re-painting an occluding tile with paintTile() would put
   bare terrain back over all of that, and re-blitting the baked layer has the
   same problem AND is unavailable exactly when it is most needed — drawBoard
   bypasses the cache entirely while the camera moves, by measurement. So nothing
   is re-drawn. The ACTOR is clipped instead, to the complement of the slabs that
   stand in front of it.
   Complement of a UNION is the INTERSECTION of the complements, which is exactly
   a run of `clip(viewportRect + piece, 'evenodd')` calls — one per slab. Doing it
   as a single even-odd path over several slabs would be wrong the moment two of
   them overlap on screen: even-odd counts the overlap twice and punches a hole
   back through the mask. One clip per slab has no winding-rule trap.

   THE SORT KEY FOR A BILLBOARD STANDING ON A SURFACE, and the cases that pick
   it. Both halves of the comparison are camDepth() — world z and row index are
   the thing the free camera already broke (CONTRACT §2 Tier 2.2) — but a slab
   and a billboard are not the same KIND of object, and the honest question is
   which of the two points that can actually meet at a pixel is nearer:
     · the billboard enters the sequence at its FOOT POINT, gw(x, z, elev). It
       is a figure standing on the ground, so that is the only point of it whose
       position is a fact; everything above it is a picture of a figure.
     · a slab enters at its TOP FACE, gw(x, z, e). That is the surface a ray
       through the pixel actually hits.
   So a slab hides an actor exactly when camDepth(slabTop) < camDepth(actorFoot)
   AND the slab stands higher than the ground the actor is on. That second test
   is not a tie-breaker, it is the geometry: a slab at the SAME height cannot
   hide feet that are level with it, and without it every coplanar tile nearer
   than the unit would clip the near half of its own ground ring and shadow.
   What this pair of points gets right, case by case:
     · a unit's OWN slab: same tile, skipped outright, and its top depth equals
       the foot depth anyway. The unit, its ring and its shadow draw over the
       slab top they stand on. ✔  (the hard case)
     · a TALLER slab one step nearer: top depth is a whole row nearer AND lifted
       toward the eye. Clips. ✔  (the critic's gap)
     · a taller slab BESIDE the unit, same depth row: level in z, but its top
       face is lifted toward the eye, so its depth is genuinely smaller and it
       clips the shoulder of the sprite that leans over it. ✔ Sorting these on
       the ground plane instead left them behind the sprite, and every residual
       leak the audit found before this paragraph existed was one of them.
     · a taller slab BEHIND the unit: height buys nearness at sin(pitch) per
       unit and a row costs a full row of depth, and on this board the row wins
       for every rung of the ladder — so it does NOT clip, and a unit does not
       get its head cut off by the hill it is standing in front of. ✔ Measured,
       not assumed: camCheck().occlusion counts it.
   Keying a slab by its own ground plane (y = 0) instead of its top face is the
   version that loses the third case; keying the ACTOR by its top instead of its
   feet loses the first, because the eye is above the board and height reduces
   camera depth, so every unit on high ground would be cut off by its own slab.
   The ACTOR-vs-ACTOR order in frame() is deliberately left on the ground-plane
   key it already used: that is a billboard-vs-billboard question, it is not
   what the critic named, and two sprites that swap because one is on a shelf
   is a different bug from the one being fixed here. */
const OCCL = { list: [] };

/* The convex pieces a slab actually PAINTS: its top face, plus one quad per
   cliff face that is front-facing and has something to fall to. Same six-edge
   table, same back-face test and same flush test as paintWalls — if the two
   ever disagree, the clip and the picture disagree, and that is a hairline of
   unit showing through a cliff.
   ⚠ ONE deliberate difference: inset 0, where paintWalls uses TILE_INSET. The
   inset is a hairline cell division, ~1px on screen, and a mask a hairline
   SMALLER than the paint leaks a rim of unit around every slab it hides —
   measured, that was most of the residual on the first pass. A mask a hairline
   LARGER costs at worst one pixel of sprite over a seam nobody can see. */
function slabPieces(x, z, e){
  const P = tilePoly(x, z, 0, e); if (!P) return null;
  const Wtop = hexCorners(x, z, 0, e);
  /* 📐 EVERY PIECE CARRIES THE GEOMETRY IT IS A PICTURE OF, and both users of
     it need that rather than the polygon alone:
       `.d`  camera depth of the WORLD point each screen vertex came from. The
             half-plane cut below solves for where the slab's own surface
             crosses the figure's depth, and it can only do that per VERTEX if
             the vertex knows how deep it is. It is free here — the world
             corners are already in hand — and impossible later, because a
             projected point has thrown its depth away.
       `.pl` the world PLANE the piece lies in, {x,y,z,c} for n·p = c. The
             audit ray-casts a sampled pixel against the surface actually
             drawn there; against a horizontal plane at the tile's elevation
             every cliff-face pixel answers with a point metres away from the
             wall it landed on. */
  P.d = Wtop.map(camDepth);
  P.pl = { x:0, y:1, z:0, c:e };            /* the top face is horizontal */
  const pieces = [P];
  const ctr = gw(x, z, e);
  const nb = NB6[((z % 2) + 2) % 2];
  for (let i = 0; i < 6; i++){
    const j = (i + 1) % 6;
    const mx = (Wtop[i].x + Wtop[j].x) / 2, mz = (Wtop[i].z + Wtop[j].z) / 2;
    const nx = mx - ctr.x, nz = mz - ctr.z;
    if (nx*(CAM.pos.x - mx) + nz*(CAM.pos.z - mz) <= 0) continue;   /* back-facing */
    const below = elevOf(x + nb[i][0], z + nb[i][1]);
    if (below >= e - 1e-4) continue;                                 /* flush: no face */
    const B = tilePoly(x, z, 0, below); if (!B) continue;
    const Wb = hexCorners(x, z, 0, below);
    const q = [P[i], P[j], B[j], B[i]];
    q.d = [P.d[i], P.d[j], camDepth(Wb[j]), camDepth(Wb[i])];
