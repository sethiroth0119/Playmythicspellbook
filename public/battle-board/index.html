  }
  const _t4 = performance.now();
  drawParticles();
  drawEffects('air');
  /* atmosphere */
  drawRain();
  /* BAR R1 asks for a HEAVY vignette, and .42 starting at 25% of the frame was
     not one — it read as a slight corner falloff. Pulling the inner stop in and
     the outer value up is what makes the diorama sit in a pool of light instead
     of filling a lit rectangle. */
  const vg = ctx.createRadialGradient(VIEW.cx, VIEW.cy, Math.min(W,H)*.16, VIEW.cx, VIEW.cy, Math.max(W,H)*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(.62,'rgba(0,0,0,.13)'); vg.addColorStop(1,'rgba(0,0,0,.54)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  drawEffects('screen');
  drawGuides();
  const _t5 = performance.now();
  perfPush({ total:_t5-_t0, sky:_t1-_t0, bake:(TERR.ms !== _bake0 ? TERR.ms : 0),
             blit:(_t2-_t1) - (TERR.ms !== _bake0 ? TERR.ms : 0), board:_t2-_t1,
             fx:_t3-_t2, actors:_t4-_t3, atmos:_t5-_t4, mov:CAMERA.moving?1:0 });
  } catch (err) {
    frameErr = true;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#180a0a'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#ff8a7a'; ctx.font = '600 16px monospace';
    ctx.fillText('RENDER ERROR: ' + (err && err.message || err), 26, 44);
    ((err && err.stack || '').split('\n').slice(1,4)).forEach((s,i) =>
      ctx.fillText(s.trim(), 26, 74 + i*22));
    console.error(err); return;
  }
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════
   INTERACTION — screen → tile via ray/plane intersect
   ══════════════════════════════════════════════════════════════════ */
/* Cube rounding. Rounding a fractional axial/cube coordinate axis-by-axis can
   land off the hex; the fix is to round all three, then discard and re-derive
   whichever component moved furthest, restoring x+y+z === 0. */
function cubeRound(x, y, z){
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx-x), dy = Math.abs(ry-y), dz = Math.abs(rz-z);
  if (dx > dy && dx > dz)      rx = -ry - rz;
  else if (dy > dz)            ry = -rx - rz;
  else                         rz = -rx - ry;
  return { x:rx, y:ry, z:rz };
}
/* world (x,z) on the play plane → tile. THE ANALYTIC INVERSE OF gw(),
   HEXSPEC §4 — and note what it is NOT: it does not round the column and the
   row independently. That shortcut is right in the middle of every hex and
   wrong along every edge, which is exactly the "the click landed one tile off,
   but only sometimes" bug HEXSPEC §4 calls out. Go to axial, cube-round, come
   back to the same odd-r offset scheme gw() uses. */
function worldToTile(wx, wz){
  const s = hexSize();
  /* undo the board-centre offset gw() applies, so the origin is tile (0,0) */
  const u = wx + ((MAP.cols-1)/2) * hexW();
  const v = wz + ((MAP.rows-1)/2) * hexV();
  const q = (SQRT3/3 * u - v/3) / s;
  const r = (2/3 * v) / s;
  const c = cubeRound(q, -q - r, r);
  /* axial → odd-r offset. `&` and not `%` for the parity: JS gives -1 % 2 === -1
     and the column would come back one short on every negative row. */
  const col = c.x + (c.z - (c.z & 1)) / 2;
  const row = c.z;
  /* the bounds test has to be re-derived for staggered rows: a hex board is a
     rhombus in cube space, so test the OFFSET pair, after the conversion. */
  if (col < 0 || row < 0 || col >= MAP.cols || row >= MAP.rows) return null;
  return { x:col, z:row };
}
/* ⛰ SCREEN → TILE, ELEVATION-AWARE.
   This used to intersect the y = 0 plane and stop. That is only right on a flat
   board, and it is why the elevation ladder in index.html was capped at 0.34
   world units: the top of a slab at height e projects to the same pixel as a
   ground point ~0.91·e FURTHER from the eye (the camera drops 0.914 world units
   of y per unit of −z), one hex row is hexV = 0.866 deep, so past ~0.43 of a row
   of height a click on a slab top silently resolved to the row BEHIND it. The
   art could not get taller until picking could see height, which is why this is
   the first edit and not the last.

   The fix is a plane sweep, not an iteration from the flat answer. Sweeping was
   chosen after the obvious cheaper thing was tried and rejected: "take the y=0
   tile, re-intersect at ITS height, repeat until stable" converges on the WRONG
   fixed point whenever the flat answer happens to land on a ground-level tile —
   which is the common case, because a ground tile re-intersected at y=0 is
   trivially stable and the loop exits pleased with itself before it has looked
   at the slab the user actually clicked.

   Because the ray descends monotonically, higher planes are crossed FIRST, i.e.
   nearer the eye. So walk the map's distinct heights top-down and return the
   first plane whose crossing lands on a tile that is actually that tall: that
   tile's top face is the nearest surface under the cursor, occlusion included —
   a 1.35-high ruin standing in front of a street tile takes the click, which is
   what the picture already says it should do. Falling through every rung means
   the ray met no top face, only a cliff side; the y = 0 answer is the tile whose
   flank it entered, which is the right tile anyway. */
function pickTile(mx, my){
  const ndx = (mx - VIEW.cx) / VIEW.scale;
  const ndy = -(my - VIEW.cy) / VIEW.scale;
  const dir = norm({
    x: CAM.f.x + CAM.r.x*ndx + CAM.u.x*ndy,
    y: CAM.f.y + CAM.r.y*ndx + CAM.u.y*ndy,
    z: CAM.f.z + CAM.r.z*ndx + CAM.u.z*ndy
  });
  if (Math.abs(dir.y) < 1e-5) return null;
  const at = h => {
    const t = (h - CAM.pos.y) / dir.y;
    return t > 0 ? worldToTile(CAM.pos.x + dir.x*t, CAM.pos.z + dir.z*t) : null;
  };
  const rungs = tileElevRungs();
  for (let i = 0; i < rungs.length; i++){
    const t = at(rungs[i]);
    if (t && Math.abs(tileElev(t.x, t.z) - rungs[i]) < 1e-6) return t;
  }
  return at(0);
}

/* ══════════════════════════════════════════════════════════════════
   HEX SELF-CHECK — required by HEXSPEC §4, and the only thing that
   ties gw() to worldToTile(). They are hand-derived analytic inverses
   sharing no code: flip a parity in either and the board still looks
   perfect, while the tile you CLICK slides away from the tile you
   HIGHLIGHTED, further the further you are from the origin. Nothing
   else in this file would notice.
   It lives on window rather than running at boot on purpose — a match
   must not pay for it and must not have its console spammed. Call it:
     window.__bbHexCheck()   →  { ok, tiles, centreFails, jitterFails,
                                  slabFails, occluded, rungs }
   ⛰ Second half added when the elevation ladder was opened up. The world-space
   half above only ever proves gw(…,0) ↔ worldToTile. It cannot see the bug that
   capped the ladder, because that bug is in the SCREEN → world step: pickTile
   chooses which horizontal plane to unproject onto, and choosing wrong lands on
   a real tile at a real world position — the round trip above stays green while
   every click on high ground addresses the row behind it. So the slab half runs
   the full loop the player's finger runs, project(gw(x,z,tileElev)) → pickTile,
   at each tile's OWN height and jittered across its top face rather than only at
   the centre, and it reports which rungs of the ladder it actually exercised so
   "clean" cannot mean "the map happened to be flat".
   `occluded` is counted apart from `slabFails` and is NOT a failure: a sample
   the picker answers with a taller tile nearer the eye is a sample the player
   cannot see either. It is reported rather than swallowed because a large number
   there means the generator is burying tiles, which is a gameplay problem even
   though the projection is right.

   🕳 …AND THAT LAST SENTENCE WAS A HOLE THE EXACT SHAPE OF THE BUG.
   On the shipped map this function returned ok:true, fails:[] while FOUR tiles
   — (13,5), (4,8), (3,9), (8,9) — had no reachable pixel inside their own hex
   at all, and six more had dead centres. Every one of those samples landed in
   the `occluded` bucket and was counted as acceptable. "A large number there
   means the generator is burying tiles" was true, and nothing acted on it: a
   self-check that passes on a board you cannot click is worse than no
   self-check, because it is used as evidence.
   So occlusion is still tolerated per-SAMPLE — it is genuinely correct that you
   cannot click the back half of a tile hidden behind a mound — but it is now
   counted PER TILE, and two tallies are hard failures:
     · `buriedFails`  — a tile where NOT ONE of its samples resolves to it. That
                        tile cannot be moved to, targeted, or have its unit
                        selected, while the DOM board still reaches it.
     · `deadCentres`  — a tile whose own centre pixel resolves elsewhere. Units
                        are drawn from the tile centre and picked through
                        pickTile → unitAt, so a dead centre means clicking
                        exactly on a unit's feet selects its neighbour.
   Both are in `ok`. `minVisible` (worst per-tile fraction over the whole board)
   is reported alongside so a regression shows as a slide rather than a cliff.

   ⚠ IT ANSWERS FOR THE CAMERA THAT IS ACTUALLY RUNNING, WHICH IS THE POINT AND
   ALSO A TRAP. The fit pass dollies CONFIG.camera to suit the host rect, so a
   short or narrow host flattens the pick ray and occludes more.
   ⚠⚠ AND THIS PARAGRAPH USED TO SAY "a 482×568 host (a 1100×780 window)" AS IF
   ONE EXOTIC HOST WERE THE WHOLE STORY. It is not, and reading it that way is
   how the next person to run this on a laptop mistakes a known framing limit
   for a generator regression they just caused. The honest table, default seed,
   scene=gamemap, measured not guessed — `buriedFails: 0` EVERYWHERE, and:

       viewport     board rect    deadCentres   minVisible
       2560×1440    1762×1228      0             0.529
       1920×1080    1122× 868      0             0.529
       1600× 900     802× 688      0             0.529
       1366× 768     708× 556      0             0.529
        820×1180     240× 968      0             0.412
       1440× 900     782× 688      1             0.471   ← mainstream laptop
        390× 844     240× 632      1             0.412
       1200× 800     582× 588      7             0.412
       1000× 800     382× 588     11             0.412
       1100× 780     482× 568     16             0.353

   So `ok:false` is the answer on five of the ten hosts above, 1440×900 among
   them, and on those hosts clicking exactly on the affected unit's feet selects
   the neighbouring tile. Every one of those dead centres is an HONEST occlusion
   — the occluder's own footprint really does cover the pixel, which the
   point-in-polygon test below now proves per sample rather than assuming.
   It is a true statement about that framing, not a generator regression: no
   terrain with real relief on it survives that dolly with every centre clear.
   If it has to be zero there too, the knob is the ELEVATION LADDER's rung gap,
   not the terrain shape — and that trade is relief for pickability, which is
   BAR R1 against BAR R2 and is a decision, not a fix. `buriedFails` is the one
   that must never move, and it never has.
   ══════════════════════════════════════════════════════════════════ */
/* Screen-space crossing-number test, used by hexSelfCheck to decide whether an
   occluder's projected top face really covers the pixel it was credited with.
   A null polygon (a corner behind the camera, so tilePoly bailed) answers
   FALSE, which is the safe direction here: an unprovable excuse is not an
   excuse, and the sample falls through to the hard-failure list. */
function ptInPoly(px, py, P){
  if (!P || P.length < 3) return false;
  let inside = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++){
    const yi = P[i].y, yj = P[j].y;
    if ((yi > py) !== (yj > py) &&
        px < (P[j].x - P[i].x) * (py - yi) / (yj - yi) + P[i].x) inside = !inside;
  }
  return inside;
}
function hexSelfCheck(opts){
  const rings = (opts && opts.rings) || 8;
  const centre = [], jitter = [], slab = [], buried = [], deadCentre = [];
  let occluded = 0, slabSamples = 0, minVisible = 1;
  const rungHits = {};
  for (let z = 0; z < MAP.rows; z++){
    for (let x = 0; x < MAP.cols; x++){
      const w = gw(x, z, 0);
      const t = worldToTile(w.x, w.z);
      if (!t || t.x !== x || t.z !== z)
        centre.push({ want:[x,z], got:t ? [t.x,t.z] : null,
                      world:[+w.x.toFixed(4), +w.z.toFixed(4)] });
      /* Centres alone are a weak test: an inverse that rounds col and row
         separately passes every centre and fails near the edges. Probe inside
         the tile as well, at 90% of the INRADIUS — a circle of that radius is
         strictly inside one hex and touches no other, so every sample has
         exactly one right answer. */
      for (let i = 0; i < rings; i++){
        const a = i * Math.PI * 2 / rings, rr = tileR() * 0.9;
        const t2 = worldToTile(w.x + Math.cos(a)*rr, w.z + Math.sin(a)*rr);
        if (!t2 || t2.x !== x || t2.z !== z)
          jitter.push({ want:[x,z], got:t2 ? [t2.x,t2.z] : null,
                        deg: Math.round(a*180/Math.PI) });
      }
      /* ⛰ the slab-top round trip, at this tile's own rung */
      const e = tileElev(x,z);
      rungHits[e.toFixed(3)] = (rungHits[e.toFixed(3)]||0) + 1;
      if (!CAM || !VIEW.scale) continue;
      const wt = gw(x, z, e);
      /* Two rings rather than one, at 0.45 and 0.80 of the INRADIUS, plus the
         centre. One ring at 0.7 could not distinguish "the near fringe is all
         that is left" from "the whole tile is reachable", which is the exact
         distinction this check now has to make. */
      let reach = 0, taken = 0;
      for (let i = -1; i < rings * 2; i++){
        const a = (i % rings) * Math.PI * 2 / rings;
        const rr = i < 0 ? 0 : tileR() * (i < rings ? 0.45 : 0.80);
        const sp = project({ x: wt.x + Math.cos(a)*rr, y: e, z: wt.z + Math.sin(a)*rr });
        if (!sp) continue;
        slabSamples++; taken++;
        const t3 = pickTile(sp.x, sp.y);
        if (t3 && t3.x === x && t3.z === z){ reach++; continue; }
        if (i < 0) deadCentre.push({ tile:[x,z], got:t3 ? [t3.x,t3.z] : null,
                                     elev:+e.toFixed(3) });
        /* Taller ⇒ genuinely in the way — ARGUED, then CHECKED.
           The ray's y falls monotonically, so a plane at a greater height is
           crossed EARLIER, i.e. nearer the eye. A taller answer is therefore a
           surface in front of this sample by construction — including a
           same-ROW neighbour, which an earlier version of this test wrongly
           excluded by comparing world z and then reported ten honest occlusions
           in `skirmish` as projection failures.
           ⚠ …and "by construction" was doing too much work on its own. This is
           the tolerant bucket: everything filed here is forgiven, so an answer
           that lands here without its top face actually covering the pixel is a
           picker hole wearing an excuse — the same shape as the burying bug
           this check was rewritten to catch, just smaller. So the height
           argument now has to survive a point-in-polygon test against the
           answer's own projected top face before the sample is forgiven.
           📐 AT inset 0, NOT AT TILE_INSET, and that is not a fudge — it is the
           difference between the two quantities. TILE_INSET shrinks the DRAWN
           hexagon by 0.008 of a circumradius so the cell seam has somewhere to
           live; the tile's real footprint, which is what worldToTile and
           therefore pickTile answer over, is the un-inset hex. Measured both
           ways over 18,312 interior samples a tile: against the drawn polygon
           65 samples at 1600×900 / 68 at 1440×900 / 93 at 1100×780 fall outside
           (0.35–0.51%), and every one of them is a pixel in that cosmetic
           hairline. Against the footprint the count is 0 at every host tried.
           Test the drawn polygon and this check reports a half-percent phantom
           failure for ever after. */
        if (t3 && tileElev(t3.x,t3.z) > e + 1e-6 && ptInPoly(sp.x, sp.y, tilePoly(t3.x, t3.z, 0, tileElev(t3.x,t3.z)))){
          occluded++; continue;
        }
        slab.push({ want:[x,z], got:t3 ? [t3.x,t3.z] : null, elev:+e.toFixed(3),
                    deg: i < 0 ? 'centre' : Math.round(a*180/Math.PI) });
      }
      if (taken){
        const vis = reach / taken;
        if (vis < minVisible) minVisible = vis;
        if (reach === 0) buried.push({ tile:[x,z], elev:+e.toFixed(3), samples:taken });
      }
    }
  }
  const tiles = MAP.cols * MAP.rows;
  return { cols:MAP.cols, rows:MAP.rows, tiles,
           samples: tiles * (1 + rings) + slabSamples,
           centreFails: centre.length, jitterFails: jitter.length,
           slabSamples, slabFails: slab.length, occluded,
           buriedFails: buried.length, deadCentres: deadCentre.length,
           minVisible: +minVisible.toFixed(3),
           rungs: rungHits, ladder: tileElevRungs().slice(),
           ok: centre.length === 0 && jitter.length === 0 && slab.length === 0
               && buried.length === 0 && deadCentre.length === 0,
           fails: centre.slice(0,10).concat(jitter.slice(0,10)).concat(slab.slice(0,10))
                  .concat(buried.slice(0,10)).concat(deadCentre.slice(0,10)) };
}
window.__bbHexCheck = hexSelfCheck;

/* 📐 FIT SELF-REPORT — the framing equivalent of __bbHexCheck, and on window
   for the same reason: the numbers BAR R1 is judged on (how much of the host
   rect the board covers, how wide a near-row hex is, how tall a unit reads)
   are not knowable by reading the code, only by measuring the projection that
   actually ran. A capture can be eyeballed; this can be asserted.
     window.__bbFitProbe()  →  { host, pitchDeg, dist, hexNear, unitH, board,
                                 ground, braziers }
   All lengths are CSS px inside the iframe, matching board:rects. */
function fitReport(){
  const tx = latticeCentreX(), e = boardExtent(), g = groundExtent();
  const zn = (MAP.rows-1)/2*hexV();
  const px = p => p ? { x:+p.x.toFixed(1), y:+p.y.toFixed(1) } : null;
  const a = project(gw(0, MAP.rows-1, 0)), b = project(gw(MAP.cols-1, MAP.rows-1, 0));
  const f = project({x:tx,y:0,z:-e.z}), n = project({x:tx,y:0,z:e.z});
  const u0 = project({x:tx,y:0,z:zn}), u1 = project({x:tx,y:unitWorldH({h:1.05}),z:zn});
  const dir = norm(sub(CONFIG.camera.target, CONFIG.camera.pos));
  return {
    host: { w:+VIEW.box.w.toFixed(0), h:+VIEW.box.h.toFixed(0) },
    pitchDeg: +(Math.asin(-dir.y)*180/Math.PI).toFixed(1),
    dist: +Math.hypot(CONFIG.camera.pos.y - CONFIG.camera.target.y, CONFIG.camera.pos.z).toFixed(2),
    viewShiftY: +CONFIG.viewShiftY.toFixed(1),
    hexNear: (a && b) ? +((b.x - a.x)/(MAP.cols-1)).toFixed(1) : null,
    unitH:   (u0 && u1) ? +Math.abs(u1.y - u0.y).toFixed(1) : null,
    board:   (f && n) ? { top:+f.y.toFixed(0), bottom:+n.y.toFixed(0),
                          pctH:+(100*(n.y - f.y)/VIEW.box.h).toFixed(0) } : null,
    ground:  { x:+g.x.toFixed(2), near:+g.near.toFixed(2), far:+g.far.toFixed(2) },
    /* Rebuild cost of the baked terrain layer, in ms. It is NOT a per-frame
       cost — the frame blits the cache — but it is the number to watch if the
       tile painters ever grow, because a time-of-day lerp pays it ~20 times. */
    terrainBakeMs: +TERR.ms.toFixed(2),
    braziers: braziers.map(br => {
      const q = project({ x:br.x, y:0, z:br.z });
      const t = project({ x:br.x, y:PYLON_ART.heightWorld, z:br.z });
      const w = project({ x:br.x + (PYLON_ART.img ? PYLON_ART.widthWorld : 0.9)*0.5, y:0, z:br.z });
      if (!q || !t || !w) return null;
      const half = Math.abs(w.x - q.x);
      return { base:px(q), left:+(q.x-half).toFixed(0), right:+(q.x+half).toFixed(0),
               top:+t.y.toFixed(0),
               inside: (q.x-half) >= VIEW.box.l && (q.x+half) <= VIEW.box.l+VIEW.box.w
                       && t.y >= VIEW.box.t && q.y <= VIEW.box.t+VIEW.box.h };
    })
  };
}
window.__bbFitProbe = fitReport;
/* 🎥 CAMERA PROBE — the free camera's state, and a way to drive it from a test
   without a real key event. There is no other way to assert that a capture was
   taken at the yaw it claims: yaw is not visible in a PNG, and "it looks
   turned" is not a measurement.
   `set` jumps straight to a pose (no easing, no clamp bypass — camClampPan
   still runs) so a screenshot rig can capture yaw 0 / 45 / 90 / 180 / 270
   deterministically instead of holding a key for a guessed number of ms.
   `hold` drives the real integrated path, which is what proves the easing and
   the frame-rate independence rather than the teleport. */
window.__bbCam = {
  get: () => ({
    yaw: +CAMERA.yaw.toFixed(5), yawDeg: +(CAMERA.yaw*180/Math.PI).toFixed(2),
    pan: { x:+CAMERA.pan.x.toFixed(4), z:+CAMERA.pan.z.toFixed(4) },
    vel: { x:+CAMERA.vel.x.toFixed(4), z:+CAMERA.vel.z.toFixed(4), yaw:+CAMERA.yawVel.toFixed(4) },
    moving: CAMERA.moving, reduced: CAM_REDUCED,
    held: Object.keys(CAM_HELD),
    base: { tx:+CAM_BASE.tx.toFixed(3), pitchDeg:+(CAM_BASE.pitch*180/Math.PI).toFixed(2),
            dist:+CAM_BASE.dist.toFixed(3) },
    pos: { x:+CONFIG.camera.pos.x.toFixed(3), y:+CONFIG.camera.pos.y.toFixed(3), z:+CONFIG.camera.pos.z.toFixed(3) },
    terrainKey: terrainKey()
  }),
  set: (yawDeg, px, pz) => {
    CAMERA.yaw = (+yawDeg || 0) * Math.PI/180;
    while (CAMERA.yaw > Math.PI) CAMERA.yaw -= Math.PI*2;
    while (CAMERA.yaw <= -Math.PI) CAMERA.yaw += Math.PI*2;
    CAMERA.pan.x = +px || 0; CAMERA.pan.z = +pz || 0;
    CAMERA.vel.x = CAMERA.vel.z = CAMERA.yawVel = 0;
    camClampPan(); camApply();
    return window.__bbCam.get();
  },
  key: (down, code) => { camKey(!!down, code, null); return Object.keys(CAM_HELD); },
  reset: camReset,
  check: () => camCheck()
};

/* 🎥 THE CAMERA SELF-CHECK — three assertions that are invisible in a PNG and
   silent in the console, all of which the free camera can break at an angle
   nobody screenshotted. It lives here, and not in the capture script, for the
   reason CLAUDE.md's "globals trap" spells out: every binding in this file is a
   top-level `const`/`let`, i.e. a LEXICAL global, so it is NOT on `window` and
   an outside driver cannot see MAP, gw(), project() or pickTile() at all. A
   test that cannot reach them would have to re-implement the projection, which
   would then be testing its own copy.

   1. CLICK ROUND-TRIP — pickTile() must keep resolving to the hexagon actually
      DRAWN under the cursor at any camera angle. `__bbHexCheck` proves gw() ↔
      worldToTile and the elevation plane sweep, but it asks the projection
      about itself. This asks the PICTURE: for each tile's own centre pixel,
      which tile's projected top face contains that pixel, taking the nearest
      such face because that is the one the terrain sweep painted last and
      therefore the one the player sees. Disagreement with pickTile() is a
      click landing on a tile other than the one drawn there — the single most
      likely thing to break under a camera, and it breaks silently.
   2. PAINTER ORDER — the drawable list must be sorted far-to-near in CAMERA
      depth. Rebuilt here exactly as frame() builds it. Under the old grid-z
      key this passes at yaw 0 and fails completely at 180.
   3. TERRAIN REGISTRATION — the landmine. The baked ground layer is a picture
      of one specific eye; if terrainKey() does not name the camera, the cache
      survives a camera move and the ground stays nailed to the screen while
      everything drawn live slides over it. `registered` compares the key the
      layer was actually baked with against the key for the pose now. */
function camCheck(){
  const inPoly = (P, x, y) => {
    let inside = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++){
      const xi = P[i].x, yi = P[i].y, xj = P[j].x, yj = P[j].y;
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  };
  const faces = [];
  for (let z = 0; z < MAP.rows; z++) for (let x = 0; x < MAP.cols; x++){
    const e = tileElev(x, z);
    const P = tilePoly(x, z, 0, e);
    if (P) faces.push({ x, z, P, d: camDepth(gw(x, z, e)) });
  }
  const drawnAt = (px, py) => {
    let best = null;
    for (const f of faces) if (inPoly(f.P, px, py)) if (!best || f.d < best.d) best = f;
    return best;
  };
  let samples = 0, mismatch = 0, offScreen = 0;
  const bad = [];
  for (let z = 0; z < MAP.rows; z++) for (let x = 0; x < MAP.cols; x++){
    const e = tileElev(x, z);
    const p = project(gw(x, z, e));
    if (!p || p.x < 0 || p.x > W || p.y < 0 || p.y > H){ offScreen++; continue; }
    samples++;
    const got = pickTile(p.x, p.y), drawn = drawnAt(p.x, p.y);
    const gk = got ? got.x + ',' + got.z : 'null';
    const dk = drawn ? drawn.x + ',' + drawn.z : 'null';
    if (gk !== dk && bad.length < 8) bad.push({ tile:[x,z], picked:gk, drawn:dk, at:[Math.round(p.x), Math.round(p.y)] });
    if (gk !== dk) mismatch++;
  }
  const order = [];
  for (const t of MAP.tiles) if (t.prop) order.push(camDepth(gw(t.x,t.z,0)));
  for (const u of units) order.push(camDepth(gw(u.x,u.z,0)));
  for (const tb of TOMBS) order.push(camDepth(gw(tb.x,tb.z,0)));
  for (const sc of STRUCTS) order.push(camDepth(gw(sc.x,sc.z,0)));
  for (const cp of CPS) order.push(camDepth(gw(cp.x,cp.z,0)));
  for (const ev of (MAP.events||[])) order.push(camDepth(gw(ev.x,ev.z,0)));
  for (const br of braziers) order.push(camDepth({x:br.x, y:0, z:br.z}));
  order.sort((a,b) => b - a);
  let inversions = 0;
  for (let i = 1; i < order.length; i++) if (order[i] > order[i-1] + 1e-9) inversions++;
  return {
    yawDeg: +(CAMERA.yaw*180/Math.PI).toFixed(2),
    pan: { x:+CAMERA.pan.x.toFixed(3), z:+CAMERA.pan.z.toFixed(3) },
    click: { samples, mismatch, offScreen, bad },
    painter: { items: order.length, inversions },
    /* skirtPainted sits next to bakeMs because it is the number bakeMs is made
       of: the field is a constant 168 tiles, so every ms of growth in the bake
       is a skirt cell. Reading them apart is how the pan×yaw cliff was found
       and how a return of it would be caught. */
    terrain: { registered: TERR.key === terrainKey(), bakeMs: +TERR.ms.toFixed(2),
               skirtPainted: SKIRT_STAT.painted, skirtAsked: SKIRT_STAT.asked,
               skirtAreaKpx: +SKIRT_STAT.areaKpx.toFixed(1), skirtMaxR: +SKIRT_STAT.maxR.toFixed(1),
               skirtBudget: SKIRT_STAT.budget, skirtLod: SKIRT_STAT.lod,
               skirtCull: { quad:SKIRT_STAT.cullQuad, screen:SKIRT_STAT.cullScreen, lod:SKIRT_STAT.cullLod } },
    cols: MAP.cols, rows: MAP.rows
  };
}
cv.addEventListener('mousemove', e => { hoverTile = pickTile(e.clientX, e.clientY); });
cv.addEventListener('mouseleave', () => hoverTile = null);
cv.addEventListener('click', e => {
  const t = pickTile(e.clientX, e.clientY); if (!t) { selected = null; return; }
  dispatch('tileClick', { x:t.x, z:t.z });
  if (armedCard){ summonUnit(armedCard, t.x, t.z); armedCard = null; renderHand(); return; }
  const u = unitAt(t.x, t.z);
  if (u){
    if (selected && selected !== u.id && u.side === 'foe'){ attackUnit(selected, u.id); return; }
    selected = (selected === u.id) ? null : u.id;
    dispatch('unitClick', { id:u.id });
  } else if (selected){
    moveUnit(selected, t.x, t.z);
  }
});
/* ⌨ LOCAL KEYS — the STANDALONE preview only.
   When EMBEDDED this listener is dead: the stage paints below the app and the
   iframe never holds focus, so it receives no keydown for exactly the reason it
   receives no mousedown (CONTRACT §1.4). The game forwards keys instead, as
   `board:key` / `board:camera` — see handleHostMessage. Both paths land in
   camKey()/CAM_PULSE and are integrated once, in camUpdate().
   `g` and `1`-`4` were already claimed here; WASD/QE/R were free. */
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'g' || e.key === 'G'){ showGuides = !showGuides; }
  if (e.key === '1') setTimeOfDay('dawn');
  if (e.key === '2') setTimeOfDay('day');
  if (e.key === '3') setTimeOfDay('dusk');
  if (e.key === '4') setTimeOfDay('night');
  if (camAction(e.code, e.key)){ e.preventDefault(); camKey(true, e.code, e.key); }
});
addEventListener('keyup', e => { camKey(false, e.code, e.key); });
/* A window that loses focus never delivers the keyup — without this a key held
   while the player alt-tabs stays down and the board drifts on its own. */
addEventListener('blur', camReleaseAll);

/* ══════════════════════════════════════════════════════════════════
   PUBLIC API — keep these signatures when porting
   ══════════════════════════════════════════════════════════════════ */
function dispatch(type, detail){ document.dispatchEvent(new CustomEvent('board:'+type, { detail })); }
function setTimeOfDay(key){
  if (!TIME_PRESETS[key]) return;
  BATTLE.timeOfDay = key;
  lightLerp = { from:{...LIGHT}, to:{...TIME_PRESETS[key]}, t:0, dur:2.5 };
  dispatch('timeOfDay', { key });
}
/* ══════════════════════════════════════════════════════════════════
   LOCATION CARD HOOK — call this when a LOCATION card resolves.
   Cross-fades the board art over 0.8s and applies the location's sky.
     Board.setLocation('dark-forest')
   The card's `location` field should be the key into LOCATIONS above.
   ══════════════════════════════════════════════════════════════════ */
function setLocation(id, instant){
  if (!LOCATIONS[id]) { console.warn('unknown location', id); return; }
  loadLocation(id, !!instant);
  dispatch('locationChange', { location:id, name:LOCATIONS[id].name });
}
function focusTile(x,z){ focus = {x,z}; }
function clearFocus(){ focus = null; }
window.Board = {
  buildStage, spawnUnit, summonUnit, moveUnit, attackUnit, killUnit,
  setTimeOfDay, setLocation, setPylonArt, focusTile, clearFocus, tileAt,
  spawnEvent, setEvents, triggerEvent, clearEvent, eventsAt, get eventTypes(){ return EVENT_TYPES; },
  get locations(){ return LOCATIONS; }, get map(){ return MAP; }, get units(){ return units; },
  on:(evt,fn) => document.addEventListener('board:'+evt, fn),
  get paint(){ return PAINT; }, unitScreenBox
};

/* ══════════════════════════════════════════════════════════════════
   HAND (placeholder strip — real hand comes from the existing HUD)
   ══════════════════════════════════════════════════════════════════ */
function paintCardArt(c, card, w, h, dpr){
  c.setTransform(dpr,0,0,dpr,0,0);
  const g = c.createLinearGradient(0,0,0,h);
  g.addColorStop(0, rgba(card.ec,.32)); g.addColorStop(.78,'rgba(10,7,16,.95)'); g.addColorStop(1,'rgba(6,4,10,1)');
  c.fillStyle = g; c.fillRect(0,0,w,h);
  const rg = c.createRadialGradient(w/2,h*.44,2,w/2,h*.44,w*.62);
  rg.addColorStop(0, rgba(card.ec,.34)); rg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = rg; c.fillRect(0,0,w,h);
  c.save(); c.translate(w/2, h*.80);
  paintSprite(c, card.unit, h*.52, UNIT_DEFS[card.unit].color, 0);
  c.restore();
}

function renderHand(){
  const el = document.getElementById('hand');
  el.innerHTML = HAND.map(c => `
    <div class="hcard ${armedCard===c.id?'armed':''}" data-id="${c.id}">
      <span class="cost">${c.cost}</span>
      <span class="art"><canvas width="372" height="520" style="width:186px;height:260px"></canvas></span>
      <span class="el" style="color:${c.ec}">${c.el}</span>
      <span class="nm">${UNIT_DEFS[c.unit].name}</span>
    </div>`).join('');
  el.querySelectorAll('.hcard').forEach(node => {
    const card = HAND.find(c => c.id === node.dataset.id);
    const cc = node.querySelector('canvas').getContext('2d');
    paintCardCanvas(cc, card);
    node.addEventListener('click', () => {
      armedCard = (armedCard === card.id) ? null : card.id;
      renderHand();
    });
  });
}
function paintCardCanvas(c, card){ paintCardArt(c, card, 186, 260, 2); }

/* ══════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   HOST BRIDGE — the game drives the board over postMessage.
   Embedded  = we have a parent window. In that mode the demo hand, the
   hint and the demo spawns are all suppressed and the board waits for a
   `board:init` snapshot instead of inventing one.
   Protocol (host → board), all `{ type, ... }`:
     board:init        { map, locations, location, timeOfDay, defs, units, safe }
     board:map         { map }                 rebuild the stage
     board:defs        { defs }                register unit art / sheets
     board:units       { units }               full snapshot (replaces all)
     board:location    { id }                  LOCATION CARD resolved
     board:timeOfDay   { key }                 weather flip (lerps 2.5s)
     board:spawn       { key, x, z, side, id }
     board:summon      { key, x, z, cardId }   full card→sprite ceremony
     board:move        { id, x, z }
     board:attack      { id, targetId }
     board:kill        { id }
     board:focus       { x, z } | board:clearFocus
     board:event       { action:'spawn'|'trigger'|'clear', type, x, z }
   Board → host: board:ready, board:tileClick, board:unitClick,
     board:summonComplete, board:locationChange, board:timeOfDay
   ══════════════════════════════════════════════════════════════════ */
const EMBEDDED = (() => { try { return window.parent && window.parent !== window; } catch (e) { return false; } })();
const HOST = { origin:'*' };
function post(type, detail){
  if (!EMBEDDED) return;
  try { window.parent.postMessage(Object.assign({ type:'board:' + type }, detail || {}), HOST.origin); } catch (e) {}
}
/* mirror every internal dispatch out to the host */
['tileClick','unitClick','tileHover','cardPlayed','summonComplete','locationChange','timeOfDay'].forEach(ev => {
  document.addEventListener('board:' + ev, e => post(ev, e.detail || {}));
});

function applyDefs(defs){
  if (!defs) return;
  for (const k in defs){
    const d = defs[k]; if (!d) continue;
    /* ⚠ MUTATE IN PLACE. spawnUnit stores `u.def = UNIT_DEFS[key]` by
       REFERENCE, so replacing the object here left every already-spawned unit
       pointing at the old procedural def — which is exactly why real sprites
       didn't take effect until a respawn. */
    const cur = UNIT_DEFS[k] || (UNIT_DEFS[k] = {});
    Object.assign(cur, {
      name: d.name || k,
      color: d.color || '#cfd6e4',
      h: (typeof d.h === 'number' && d.h > 0) ? d.h : 1.05,
      art: (typeof d.art === 'string' && d.art) ? d.art : null,
      sheet: d.sheet || null,
      frames: Array.isArray(d.frames) ? d.frames : null,
      fps: d.fps || 10,
      _phase: cur._phase || ((k.length * 0.137) % 1)
    });
    /* warm the textures NOW so the first paint already has real art instead
       of one procedural flash while the images decode */
    if (Array.isArray(d.frames)) for (const f of d.frames) artImage(f);
    if (typeof d.art === 'string') artImage(d.art);
    if (cur.art || cur.frames || (cur.sheet && cur.sheet.src)) delete cur._proc;   // real art wins
  }
}
/* Replace the whole unit set from a match snapshot. Units already on the
   board with the same id are MOVED rather than re-spawned, so a snapshot
   refresh never restarts an animation mid-flight. */
/* 🏷 The nameplate half of a `board:units` entry. Kept OUT of the unit
   literal in spawnUnit because it is optional: an older host — or the
   board's own standalone demo — sends no name and no hp, and a plate is
   simply not drawn for that unit rather than one reading "undefined 0/1".
   `hero` widens the plate's authority, not its size: a hero plate stays
   visible at any distance, a grunt's fades with depth. */
function applyPlate(u, msg){
  if (!u || !msg) return;
  if (typeof msg.name === 'string' && msg.name) u.uname = msg.name;
  if (msg.hpMax != null){
    const mx = Math.max(1, msg.hpMax | 0);
    const hp = Math.max(0, Math.min(mx, msg.hp | 0));
    /* animate the bar toward the new value so a hit READS as a hit; seeded
       to the first value so a unit does not drain in from full on arrival */
    if (u.hpMax == null) u.hpShown = hp / mx;
    u.hpMax = mx; u.hpCur = hp;
  }
  if (msg.hero != null) u.hero = !!msg.hero;
}
function applyUnits(list){
  if (!Array.isArray(list)) return;
  const seen = new Set();
  for (const u of list){
    if (!u || u.id == null) continue;
    seen.add(String(u.id));
    const cur = units.find(x => String(x.id) === String(u.id) && !x.dead);
    if (cur){
      applyPlate(cur, u);
      if (cur.gx !== u.x || cur.gz !== u.z) moveUnit(cur.id, u.x, u.z);
      /* 🜂 KALON TRANSFORM (and any other in-place identity change).
         The unit keeps its instance id but its CARD changes, so matching by id
         alone left the base form's art on the board forever. Swap the key and
         the def reference in place — no respawn, so position, facing and any
         running animation survive. */
      const nk = u.key || u.defKey;
      if (nk && cur.key !== nk){
        cur.key = nk;
        // If the new form's def hasn't landed yet, mint one the same way
        // spawnUnit does — otherwise paintSprite would find nothing for this
        // key and the unit would vanish instead of just looking generic.
        if (!UNIT_DEFS[nk]){
          let h = 0; for (let i = 0; i < String(nk).length; i++) h = (h * 31 + String(nk).charCodeAt(i)) | 0;
          const proc = PROC_KEYS[Math.abs(h) % PROC_KEYS.length];
          UNIT_DEFS[nk] = Object.assign({}, PROC_DEFS[proc], { name:String(nk), _proc:proc });
        }
        cur.def = UNIT_DEFS[nk];
        cur.flash = Math.max(cur.flash || 0, 0.9);   // a beat of white on the swap
      }
      continue;
    }
    const nu = spawnUnit(u.key || u.defKey || 'imp', u.x, u.z, u.side === 'foe' ? 'foe' : 'mine');
    if (nu && u.id != null) nu.id = String(u.id);
    if (nu) applyPlate(nu, u);
  }
  for (const x of units.slice()) if (!x.dead && !seen.has(String(x.id))) killUnit(x.id);
}

/* 🗺 THE ONE DOOR the host's map comes through. `board:init` and `board:map`
   both used to do a bare Object.assign(MAP, msg.map) in line, so a payload
   carrying a BAD dimension ('14', NaN, 0, -3) propagated straight into gw()
   and worldToTile(). Both return NaN for a NaN cols, project() then fails
   every test, and the whole board renders nothing at all with no error
   anywhere — exactly the silent class of failure the near clip already gives
   us. Clamped here, once.
   ⚠ Object.assign MERGES (CONTRACT §2 R18): a payload with no `cols` key at
   all does NOT fall back to BOARD_DEFAULT, it KEEPS the previous map's size,
   because there is nothing for Math.round to reject. That is deliberate — a
   `board:map` that only repaints tiles must not silently resize the board —
   but it does mean BOARD_DEFAULT is reached only at boot, or when the key is
   present and unusable. Do not read the fallback as "a dimensionless payload
   resets the board"; it does not. */
function applyMapPayload(m){
  if (!m || typeof m !== 'object') return;
  Object.assign(MAP, m);
  MAP.cols = Math.max(1, Math.round(+MAP.cols) || BOARD_DEFAULT.cols);
  MAP.rows = Math.max(1, Math.round(+MAP.rows) || BOARD_DEFAULT.rows);
}

function handleHostMessage(msg){
  if (!msg || typeof msg.type !== 'string' || msg.type.indexOf('board:') !== 0) return;
  const t = msg.type.slice(6);
  try {
    if (t === 'init'){
      if (msg.safe) Object.assign(CONFIG.SAFE, msg.safe);
      if (msg.locations) setLocations(msg.locations, true);
      applyMapPayload(msg.map);
      buildStage();
      applyDefs(msg.defs);
      loadLocation(msg.location || MAP.location || DEFAULT_LOCATION, true);
      if (msg.timeOfDay && TIME_PRESETS[msg.timeOfDay]){
        BATTLE.timeOfDay = msg.timeOfDay;
        Object.assign(LIGHT, TIME_PRESETS[msg.timeOfDay]);
      }
      applyUnits(msg.units);
      // 🗿 Real match events — after buildStage so tile elevations exist.
      if (msg.events) setEvents(msg.events);
      resize();
    }
    else if (t === 'map'){ applyMapPayload(msg.map); buildStage(); if (msg.events) setEvents(msg.events); resize(); }
    else if (t === 'events'){ setEvents(msg.events); }
    else if (t === 'defs')      applyDefs(msg.defs);
    else if (t === 'units')     applyUnits(msg.units);
    /* 🗺 LATE LOCATION REGISTRATION. `setLocation` hard-bails with "unknown
       location" when the id isn't in LOCATIONS — and the table is only built
       once, at init, from the cards that existed and had a usable image THEN.
       A location card PLAYED mid-match was therefore almost never registered,
       so the battlefield never changed. The host now sends this immediately
       before every `location` message. keepDefault=true so it MERGES rather
       than wiping the table. */
    /* 🎨 Painted tile surfaces: { "x,z": effectKey }. Whole-map replace,
       because the host already diffs and only sends on change. */
    else if (t === 'surfaces') SURFACES = (msg.tiles && typeof msg.tiles === 'object') ? msg.tiles : {};
    else if (t === 'locations') setLocations(msg.locations || {}, true);
    else if (t === 'location')  setLocation(msg.id, !!msg.instant);
    else if (t === 'timeOfDay') setTimeOfDay(msg.key);
    else if (t === 'spawn'){ const u = spawnUnit(msg.key, msg.x, msg.z, msg.side === 'foe' ? 'foe' : 'mine'); if (u && msg.id != null) u.id = String(msg.id); }
    else if (t === 'summon')    summonUnit(msg.key, msg.x, msg.z, { id:msg.id, side:msg.side, cost:msg.cost });
    else if (t === 'summonFx')  summonFx(msg.id);
    /* 🪦 Tombstones. The game owns their whole lifecycle (decay, revive
       timers, loot state); the board just renders the markers it is given. */
    else if (t === 'tombs'){
      TOMBS.length = 0;
      for (const tb of (msg.list || [])) if (tb) TOMBS.push(tb);
      for (const tb of TOMBS) if (tb.img) artImage(tb.img);   // warm the texture
    }
    /* 🏚 Lootable ruins. Whole-list replace, exactly like tombs — the host
       already JSON-diffs and only posts on change. No texture to warm: the
       art is procedural (see drawStruct for why it has to be). */
    else if (t === 'structs'){
      STRUCTS.length = 0;
      for (const sc of (msg.list || [])) if (sc) STRUCTS.push(sc);
    }
    /* 🚚 SCP control-point trucks. Whole-list replace, same as tombs and ruins
       — the host JSON-diffs and only posts on change, so this arriving at all
       means something about who holds what actually moved. `side` and `streak`
       come down with it because the board owns no rules and cannot work out
       either for itself. No texture to warm: the trucks are procedural. */
    else if (t === 'cps'){
      CPS.length = 0;
      for (const cp of (msg.list || [])) if (cp) CPS.push(cp);
    }
    else if (t === 'move')      moveUnit(msg.id, msg.x, msg.z);
    else if (t === 'attack')    attackUnit(msg.id, msg.targetId);
    else if (t === 'kill')      killUnit(msg.id);
    else if (t === 'focus')     focusTile(msg.x, msg.z);
    else if (t === 'clearFocus')clearFocus();
    /* 🎨 SURFACE PAINT — the game decides which tiles are legal targets
       (move / attack / placement / swap); the board only tints them. Sent as
       sets of "x,z" keys so lookup during the tile loop is O(1). */
    else if (t === 'paint'){
      PAINT.move  = new Set(msg.move  || []);
      PAINT.attack= new Set(msg.attack|| []);
      PAINT.place = new Set(msg.place || []);
      PAINT.swap  = new Set(msg.swap  || []);
      PAINT.sel   = msg.sel || null;
      TELE.rev++;                 /* the move CONTOUR is traced from this set */
    }
    /* 🏹 THE TELEGRAPH. Same division of authority as `paint`: the game has
       already run its pathfinder, its attack-target gate and the enemies'
       reachability, and this message is the ANSWER. The board renders it.
       `path` arrives as ordered "x,z" keys starting on the unit's own tile,
       straight from the host's getMovePath() call — the identical call
       moveUnit() makes when the move is committed. */
    else if (t === 'tele'){
      TELE.path = Array.isArray(msg.path) ? msg.path.slice() : [];
      TELE.dest = msg.dest || null;
      TELE.arc  = msg.arc  || null;
      TELE.threat = new Set(msg.threat || []);
      /* Anything that is not literally 'foe' is mine. A missing field must not
         be able to paint the player's own route in the enemy colour, which is
         the failure mode an older host (or a replay of an old payload) would
         otherwise produce. */
      TELE.side = (msg.side === 'foe') ? 'foe' : 'mine';
      TELE.rev++;
    }
    /* 🖱 FORWARDED POINTER. The stage paints BELOW the app (so the HUD stays
       on top), which means it cannot receive its own mouse events. The host
       captures them over the board area and forwards normalised coords here;
       we run the same perspective pick the canvas would have. */
    else if (t === 'pointer'){
      const mx = msg.nx * W, my = msg.ny * H;
      const tile = pickTile(mx, my);
      const hit = tile ? unitAt(tile.x, tile.z) : null;
      if (msg.kind === 'click'){
        if (tile) dispatch('tileClick', { x:tile.x, z:tile.z, unitId: hit ? String(hit.id) : null });
      } else {
        const key = (tile ? (tile.x + ',' + tile.z) : '') + '|' + (hit ? hit.id : '');
        if (key !== (window.__lastHoverKey || '')){
          window.__lastHoverKey = key;
          if (tile) focusTile(tile.x, tile.z); else clearFocus();
          dispatch('tileHover', { x: tile ? tile.x : -1, z: tile ? tile.z : -1,
                                  unitId: hit ? String(hit.id) : null,
                                  box: hit ? unitScreenBox(hit) : null });
        }
      }
    }
    /* 🎥 FORWARDED CAMERA INPUT. Same problem as the pointer above and the
       same answer: an iframe that never holds focus gets no keydown, so the
       host captures the keys over the board and forwards them. Two shapes,
       both already specified by the harness and by CONTRACT §2 Tier 2, and the
       host sends BOTH:

         board:key    {down, code, key, repeat}  — key EDGES. This is the
             frame-rate-independent path: the board keeps the held set and
             integrates it in update(dt) against its own clock. It is also the
             only one that can carry R (reset), which is an edge, not an axis.

         board:camera {dx, dz, yaw}              — resolved intent, re-sent
             every animation frame while a key is held, with the SENDER's dt
             already applied.

       ⚠ The deltas are read as an INTENT SIGN, not accumulated. Accumulating
       them would double-count against board:key (the harness sends both, and
       so does the game) and would tie camera speed to the HOST's frame rate
       rather than this document's. The pulse expires on its own after
       CAM_PULSE_TTL, so a host that stops pumping stops the camera even if its
       keyup is lost. */
    else if (t === 'camera'){
      CAM_PULSE.x = +msg.dx || 0; CAM_PULSE.z = +msg.dz || 0;
      CAM_PULSE.yaw = +msg.yaw || 0; CAM_PULSE.at = T;
    }
    else if (t === 'key'){
      if (msg.repeat) { /* the held set already covers repeats */ }
      else camKey(!!msg.down, msg.code, msg.key, 'h');
    }
    else if (t === 'event'){
      if (msg.action === 'spawn')   spawnEvent(msg.evType || msg.evtType, msg.x, msg.z);
      if (msg.action === 'trigger') triggerEvent(msg.x, msg.z, msg.unitId);
      if (msg.action === 'clear')   clearEvent(msg.x, msg.z);
    }
  } catch (e) { try { console.warn('board message failed', t, e); } catch (_) {} }
}
window.addEventListener('message', e => handleHostMessage(e.data));

try {
  /* EMBEDDED: the host sizes the iframe to the exact rect the old board
     occupied, so the stage must FILL the canvas — no UI gutters and no
     optical shift (both exist only for the standalone full-screen preview). */
  if (EMBEDDED){
    CONFIG.SAFE = { left:0, right:0, top:0, bottom:0 };
    CONFIG.viewShiftY = 0;
  }
  buildStage();
  if (EMBEDDED){
    /* the game owns the hand + hint; hide the standalone stand-ins */
    const h = document.getElementById('hand'); if (h) h.style.display = 'none';
    const hi = document.getElementById('hint'); if (hi) hi.remove();
  } else {
    /* standalone preview — a demo board so the file still opens on its own */
    spawnUnit('imp', 3, 1, 'foe');
    spawnUnit('knight', 6, 0, 'foe');
    spawnUnit('wyrm', 1, 2, 'foe');
    spawnUnit('mage', 2, 5, 'mine');
    spawnUnit('crystal', 5, 6, 'mine');
    HAND = [
      { id:'c1', cost:5, unit:'jelly',   el:'NATURE',  ec:'#8fd84a' },
      { id:'c2', cost:6, unit:'bunny',   el:'SHADOW',  ec:'#c8a8ff' },
      { id:'c3', cost:0, unit:'mage',    el:'FIRE',    ec:'#ff8a3c' },
      { id:'c4', cost:6, unit:'wyrm',    el:'MYTHIC',  ec:'#f6dc95' },
      { id:'c5', cost:2, unit:'crystal', el:'CRYSTAL', ec:'#5fe8d5' },
      { id:'c6', cost:5, unit:'knight',  el:'MYTHIC',  ec:'#f6dc95' }
    ];
    renderHand();
  }
  loadLocation(DEFAULT_LOCATION, true);
  setPylonArt(PYLON_ART.src);
  requestAnimationFrame(t => { last = t; frame(t); });
  post('ready', { cols:MAP.cols, rows:MAP.rows });
} catch (err) {
  /* never fail silently to a black screen */
  const c = cv.getContext('2d');
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = '#140a0a'; c.fillRect(0,0,cv.width,cv.height);
  c.fillStyle = '#ff8a7a'; c.font = '600 15px monospace';
  c.fillText('BATTLE BOARD FAILED TO START:', 24, 40);
  c.fillText(String(err && err.message || err), 24, 64);
  console.error(err);
}
</script>
