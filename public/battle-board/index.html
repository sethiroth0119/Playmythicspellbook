     module-absent branch, which is the fallback sky that already ships on
     every cold load while the deferred modules are still arriving. */
  if (window.BBX.vista && window.BBX.vista.draw && loadAllow('vista')){
    try { window.BBX.vista.draw(api); } catch (e) { drawSky(); drawShards(); }
  } else {
    drawSky();
    drawShards();
  }
  drawBoard(api);
  /* 🎨 Painted tile surfaces — composited HERE, between the ground and the
     depth-sorted pass, so a unit standing in fire is drawn ON TOP of it. The
     shader layer renders to its own offscreen WebGL canvas and is blitted in;
     leaving that canvas visible above the stage instead would paint the flames
     over the unit's legs.
     ⚠ if/else, not `hook?.() ?? fallback()` — a painter that returns undefined
     would make `??` run the fallback as well and double-composite every tile. */
  if (window.BBX.tilefx && window.BBX.tilefx.drawSurfaces){
    try { window.BBX.tilefx.drawSurfaces(api); } catch (e) {}
  } else {
    try { drawSurfaceFx(T); } catch (e) {}
  }
  /* 🎯 …then re-assert the legal-target highlight on the tiles that just got
     painted over. The first pass (in drawBoard) sits UNDER the ground shading
     on purpose so it reads as part of the floor — but a hazard composites
     after it and buries it, which made a fire/oil tile look unreachable even
     though it is a perfectly legal move. Only surfaced tiles are touched, so
     the rest of the board keeps the original look. THIS PASS MUST SURVIVE. */
  if (window.BBX.tilefx && window.BBX.tilefx.drawStatesOver){
    try { window.BBX.tilefx.drawStatesOver(api); } catch (e) {}
  } else {
    try { drawPaintOverSurfaces(T); } catch (e) {}
  }
  drawEffects('ground');
  /* painter's algorithm: far rows first */
  const drawables = [];
  for (const t of MAP.tiles) if (t.prop) drawables.push({ z:t.z, kind:'prop', t });
  for (const u of units) drawables.push({ z:u.z, kind:'unit', u });
  for (const tb of TOMBS) drawables.push({ z:tb.z, kind:'tomb', tb });
  /* pylons live in world z, convert to grid-space depth for one sort */
  for (const ev of (MAP.events||[])) drawables.push({ z:ev.z, kind:'event', ev });
  for (const br of braziers) drawables.push({ z: br.z + (MAP.rows-1)/2, kind:'pylon', br });
  /* 🌵 set dressing joins the SAME depth sort as units/props/tombs, so a
     boulder in row 2 is correctly occluded by a unit in row 3 and vice versa.
     build() is idempotent and cached module-side; we only re-run it when the
     map identity changes (or a module attaches late — see dressKey). */
  syncDressing(api);
  try {
    const items = (window.BBX.dressing && window.BBX.dressing.items)
      ? (window.BBX.dressing.items(api) || []) : [];
    for (const it of items) if (it) drawables.push({ z: it.z, kind:'dress', it });
  } catch (e) {}
  drawables.sort((a,b) => a.z - b.z);
  for (const d of drawables){
    if (d.kind==='prop') drawProp(d.t);
    else if (d.kind==='event') drawEvent(d.ev);
    else if (d.kind==='pylon') drawPylon(d.br);
    else if (d.kind==='tomb') drawTomb(d.tb);
    else if (d.kind==='dress'){ try { d.it.draw(api); } catch (e) {} }
    else drawUnit(d.u);
  }
  /* 📍 Publish unit screen rects to the host ~4x/sec. Every VFX and cinematic
     in the game anchors off a unit's on-screen box; with the DOM board hidden
     those lookups return stale iso coordinates, so the host needs ours. Cheap
     and rate-limited — this is position data, not a render path. */
  if (EMBEDDED && (T - (window.__rectsAt || 0)) > 0.25){
    window.__rectsAt = T;
    const map = {};
    for (const u of units){
      if (u.dead) continue;
      const b = unitScreenBox(u);
      if (b) map[String(u.id)] = { left:Math.round(b.left), top:Math.round(b.top),
                                   width:Math.round(b.width), height:Math.round(b.height) };
    }
    /* tile centres too — summon / spell cinematics anchor by grid position,
       not by unit, and those lookups hit the hidden DOM board as well. */
    const tmap = {};
    for (let z = 0; z < MAP.rows; z++){
      for (let x = 0; x < MAP.cols; x++){
        const wp = gw(x, z, tileElev(x, z));
        const p = project({ x:wp.x, y:wp.y, z:wp.z });
        if (p) tmap[x + ',' + z] = { cx: Math.round(p.x), cy: Math.round(p.y) };
      }
    }
    post('rects', { rects: map, tiles: tmap });
  }
  drawParticles();
  drawEffects('air');
  /* atmosphere — the vista module replaces this vignette with a filmic grade.
     ⚠ The fallback was `rgba(0,0,0,.42)` from a 0.25·min(W,H) inner radius.
     Two problems, both measured on the round-2 ground: it put PURE BLACK on
     the frame (the BAR forbids pure black and pure white), and because the
     8×7 field fills the viewport it darkened the left and right tile columns
     by ~25 luma — which is most of an elevation step laid across the board,
     so the outermost plateaus stopped separating from the basin. Now a softer
     cool blue-grey falloff starting further out: still a vignette, no longer
     a value gradient competing with the terrain. */
  if (window.BBX.vista && window.BBX.vista.grade && loadAllow('grade')){
    try { window.BBX.vista.grade(api); } catch (e) {}
  } else {
    const vg = ctx.createRadialGradient(VIEW.cx, VIEW.cy, Math.min(W,H)*.42, VIEW.cx, VIEW.cy, Math.max(W,H)*.82);
    vg.addColorStop(0, 'rgba(11,14,24,0)'); vg.addColorStop(1, 'rgba(11,14,24,.24)');
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  }
  drawEffects('screen');
  drawGuides();
  } catch (err) {
    /* absorb a transient throw — abandon THIS frame, keep the loop alive.
       Only a persistent fault earns the red card. */
    if (++frameErrN < FRAME_ERR_MAX){
      if (frameErrN === 1) console.error('[board] transient render error (recovering):', err);
      requestAnimationFrame(frame);
      return;
    }
    frameErr = true;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#180a0a'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#ff8a7a'; ctx.font = '600 16px monospace';
    ctx.fillText('RENDER ERROR: ' + (err && err.message || err), 26, 44);
    ((err && err.stack || '').split('\n').slice(1,4)).forEach((s,i) =>
      ctx.fillText(s.trim(), 26, 74 + i*22));
    console.error(err); return;
  }
  /* a clean frame pays down the transient-error budget, so isolated faults
     spread over a long match never accumulate into a latch */
  if (frameErrN > 0) frameErrN--;
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════
   INTERACTION — screen → tile via ray/plane intersect
   ══════════════════════════════════════════════════════════════════ */
/* even-odd point-in-polygon on a projected tile top */
function pointInPoly(px, py, P){
  let inside = false;
  for (let i=0, j=P.length-1; i<P.length; j=i++){
    const xi = P[i].x, yi = P[i].y, xj = P[j].x, yj = P[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj-xi)*(py-yi)/((yj-yi)||1e-9) + xi)) inside = !inside;
  }
  return inside;
}
function pickTile(mx, my){
  /* ⛰ ELEVATION-AWARE PICK — DO NOT REVERT TO THE PLANE-ONLY VERSION.
     This used to intersect the y=0 plane and nothing else, which was exact
     while every tile was flat. With a heightfield a raised tile is DRAWN one
     or two step-heights up the screen from where its floor footprint lands, so
     a plane-only pick returns the wrong tile for every click on a plateau —
     silently, because the click still routes through board:tileClick →
     onTileClick and the game acts on the wrong coordinate.
     So: hit-test the projected TOP faces in REVERSE paint order (near row
     first — exactly the reverse of the order bakeTerrain draws them), which
     makes the tile drawn under the cursor the tile that is returned. Anything
     not over a top face — a cliff wall, the apron — falls through to the old
     plane intersect, so nothing that used to be clickable stops being.
     Grid semantics are UNCHANGED: 8x7, square, same (x,z), same payloads. */
  const poly = TERRAIN.poly;
  if (poly){
    for (let z = MAP.rows-1; z >= 0; z--){
      for (let x = 0; x < MAP.cols; x++){
        const P = poly[x + ',' + z];
        if (P && pointInPoly(mx, my, P)) return { x:x, z:z };
      }
    }
  }
  /* unproject to a ray, intersect y=0 plane, convert to grid */
  const ndx = (mx - VIEW.cx) / VIEW.scale;
  const ndy = -(my - VIEW.cy) / VIEW.scale;
  const dir = norm({
    x: CAM.f.x + CAM.r.x*ndx + CAM.u.x*ndy,
    y: CAM.f.y + CAM.r.y*ndx + CAM.u.y*ndy,
    z: CAM.f.z + CAM.r.z*ndx + CAM.u.z*ndy
  });
  if (Math.abs(dir.y) < 1e-5) return null;
  const t = -CAM.pos.y / dir.y; if (t <= 0) return null;
  const wx = CAM.pos.x + dir.x*t, wz = CAM.pos.z + dir.z*t;
  const gx = Math.round(wx/CONFIG.tile + (MAP.cols-1)/2);
  const gz = Math.round(wz/CONFIG.tile + (MAP.rows-1)/2);
  if (gx<0 || gz<0 || gx>=MAP.cols || gz>=MAP.rows) return null;
  return { x:gx, z:gz };
}
/* ⚠ EVERY PICK GOES THROUGH unzoom(). The opening scales the canvas on the
   compositor, so clientX/clientY land on a different projected tile than the
   one the renderer computed — and a wrong pick here is silent. Identity once
   the opening has finished, and under prefers-reduced-motion always. */
cv.addEventListener('mousemove', e => { const p = unzoom(e.clientX, e.clientY); hoverTile = pickTile(p.x, p.y); });
cv.addEventListener('mouseleave', () => hoverTile = null);
cv.addEventListener('click', e => {
  const p0 = unzoom(e.clientX, e.clientY);
  const t = pickTile(p0.x, p0.y); if (!t) { selected = null; return; }
  dispatch('tileClick', { x:t.x, z:t.z });
  if (armedCard){ summonUnit(armedCard, t.x, t.z); armedCard = null; renderHand(); return; }
  const u = unitAt(t.x, t.z);
  if (u){
    if (selected && selected !== u.id && u.side === 'foe'){ attackUnit(selected, u.id); return; }
    selected = (selected === u.id) ? null : u.id;
    dispatch('unitClick', { id:u.id });
  } else if (selected){
    moveUnit(selected, t.x, t.z);
  }
});
addEventListener('keydown', e => {
  if (e.key === 'g' || e.key === 'G'){ showGuides = !showGuides; }
  if (e.key === '1') setTimeOfDay('dawn');
  if (e.key === '2') setTimeOfDay('day');
  if (e.key === '3') setTimeOfDay('dusk');
  if (e.key === '4') setTimeOfDay('night');
});

/* ══════════════════════════════════════════════════════════════════
   PUBLIC API — keep these signatures when porting
   ══════════════════════════════════════════════════════════════════ */
function dispatch(type, detail){ document.dispatchEvent(new CustomEvent('board:'+type, { detail })); }
let _lerpSeq = 0;
function setTimeOfDay(key){
  if (!TIME_PRESETS[key]) return;
  BATTLE.timeOfDay = key;
  /* `id` is monotonic and is handed to the stage through buildApi — it is how
     the vista knows one transition from the next. Re-using an id would let a
     second setTimeOfDay inherit the first one's plates. */
  lightLerp = { from:{...LIGHT}, to:{...TIME_PRESETS[key]}, t:0, dur:2.5, id:++_lerpSeq };
  dispatch('timeOfDay', { key });
}
/* ══════════════════════════════════════════════════════════════════
   LOCATION CARD HOOK — call this when a LOCATION card resolves.
   Cross-fades the board art over 0.8s and applies the location's sky.
     Board.setLocation('dark-forest')
   The card's `location` field should be the key into LOCATIONS above.
   ══════════════════════════════════════════════════════════════════ */
function setLocation(id, instant){
  if (!LOCATIONS[id]) { console.warn('unknown location', id); return; }
  loadLocation(id, !!instant);
  dispatch('locationChange', { location:id, name:LOCATIONS[id].name });
}
function focusTile(x,z){ focus = {x,z}; }
function clearFocus(){ focus = null; }
/* 🔍 Terrain smoke-test hooks. Kept because the ONE failure mode a raised board
   introduces — a click landing on a different tile than the one drawn under the
   cursor — is completely silent: the click still routes through board:tileClick
   into onTileClick and the game acts on the wrong coordinate. Round-trip check,
   from the host page or the console:
     const w = document.querySelector('iframe.bb-stage').contentWindow, D = w.__bbDebug;
     for (let z=0;z<7;z++) for (let x=0;x<8;x++){ const p = D.tileScreen(x,z);
       const g = D.pick(p.x,p.y); if (!g || g.x!==x || g.z!==z) console.error('MISPICK',x,z,g); }
   Read-only; nothing in the render path depends on it. */
window.__bbDebug = {
  /* 🖼 THE BACKDROP, READ-ONLY. THE ONE INVARIANT is only worth having if it
     can be checked from outside, and every field it constrains lives in a
     `const` that no module and no test page can see. `err` is the invariant
     itself, evaluated: each image's own horizon row as a fraction of its
     height, minus the shared `horizon` every painter reads. Both must be ~0
     (ceil() slack is < 1 plate row). Anything else is the 281 px bug back. */
  backdrop: () => {
    /* buildPlate never rescales the art — it only pads below it — so the
       horizon row of a plate is the SOURCE art's row, and its fraction of the
       plate is what every painter must be told. */
    const of = (im, srcIm, p) => !im ? null : {
      w: im.naturalWidth||im.width, h: im.naturalHeight||im.height,
      src: String(im.src||'').slice(-30),
      trueHorizon: +((clamp(p,0.05,0.95) * (srcIm ? (srcIm.naturalHeight||srcIm.height) : 0))
                     / (im.naturalHeight||im.height)).toFixed(5)
    };
    return { horizon:+BACKDROP.horizon.toFixed(5), fade:+BACKDROP.fade.toFixed(3),
             plateKey:String(BACKDROP.plateKey).slice(-24),
             img:  of(BACKDROP.img,  BACKDROP.src,     BACKDROP.srcHorizon),
             prev: of(BACKDROP.prev, BACKDROP.prevSrc, BACKDROP.prevSrcHorizon),
             srcHorizon:BACKDROP.srcHorizon, prevSrcHorizon:BACKDROP.prevSrcHorizon,
             gen:bdGen, location:MAP.location };
  },
  /* 🟫 THE GROUND, READ-ONLY — same reason as backdrop() above: GROUND is a
     `const` no test page can reach, and it carries the OTHER half of THE LOAD
     EPOCH. `key` is the location id the floor currently belongs to; when it
     disagrees with `location` a superseded load won the race. */
  ground: () => ({ key:GROUND.key, fade:+GROUND.fade.toFixed(3),
                   w: GROUND.img ? (GROUND.img.naturalWidth||0) : 0,
                   src: String((GROUND.img && GROUND.img.src) || '').slice(-24),
                   gen:bdGen, location:MAP.location }),
  /* ⏱ THE LOAD SCHEDULE, READ-ONLY — which frame each heavy pass is allowed
     on. `step` is the frame ordinal since board:init; `on` false means the
     schedule has retired and every gate is open. */
  load: () => ({ on:LOADQ.on, step:LOADQ.step, terrainAt:LOADQ.terrainAt.slice(),
                 allow:{ vista:loadAllow('vista'), terrain:loadAllow('terrain'),
                         grade:loadAllow('grade') } }),
  /* 🎬 THE OPENING, READ-ONLY AND SCRUBBABLE. rAF does not fire in a headless
     pane, so the only honest way to check the timeline is to drive it: set
     `at` to a millisecond on the animation and read back the scale the pick
     would use and the veil's opacity at that instant. It restores the live
     currentTime before returning, so scrubbing does not disturb the run. */
  reveal: (at) => {
    const veil = document.getElementById('veil');
    const A = REVEAL.anims;
    const readAt = (ms) => {
      const keep = A.map(a => a.currentTime);
      try { A.forEach(a => { a.currentTime = ms; }); } catch (e) {}
      const out = { t:ms,
        scale:+revealScale().toFixed(5),
        transform:(cv ? getComputedStyle(cv).transform : ''),
        veil:+(veil ? parseFloat(getComputedStyle(veil).opacity) : 0).toFixed(4) };
      try { A.forEach((a,i) => { a.currentTime = keep[i]; }); } catch (e) {}
      return out;
    };
    if (typeof at === 'number') return readAt(at);
    return { run:REVEAL.run, reduced:REVEAL.reduced, dur:REVEAL.DUR,
             scale0:REVEAL.SCALE, originY:REVEAL.ORIGIN_Y,
             anims:A.length, playState:A.map(a => a.playState),
             composited:A.map(a => { try { return a.effect.getComputedTiming().duration; }
                                     catch (e) { return null; } }) };
  },
  /* the same un-zoom every pick takes, exposed so the round-trip smoke test at
     the top of this object still works while the opening is running. */
  unzoom: (mx,my) => unzoom(mx,my),
  pick: (mx,my) => pickTile(mx,my),
  tileScreen: (x,z) => project(gw(x, z, tileElev(x,z))),
  tileElev: (x,z) => tileElev(x,z),
  level: (x,z) => hfLevel(x,z),
  heightfield: () => ({ key:HF.key, fromHost:HF.fromHost, maxLv:HF.maxLv, lv:HF.lv }),
  terrain: () => ({ bakeMs:+TERRAIN.ms.toFixed(2), bakes:TERRAIN.bakes, key:TERRAIN.key }),
  /* THE BAKE, ON ITS OWN. Wave 3 lost a day to arguing about whether a defect
     ("tan streaks read through the cliff wall") belonged to the terrain bake or
     to a module that draws over it. It is settled in one call: this returns the
     offscreen ground canvas with no vista, no tile states, no dressing and no
     HUD on it, so a critic can judge the terrain layer by itself. Read-only. */
  bakePng: () => { try { return TERRAIN.cv ? TERRAIN.cv.toDataURL('image/png') : null; }
                   catch (e) { return null; } },
  /* FORCE ONE RE-BAKE. The only mutator in this object, and it exists because
     both guards at the top of bakeTerrain() are keyed on (map, viewport,
     light): same inputs ⇒ early return ⇒ the canvas is not redrawn. So an A/B
     against __DBG_NOMACRO / __DBG_NORESTORE is impossible from outside without
     it — you set the flag, round-trip the time of day back to where it was,
     and diff a canvas against itself. (We did. It reported 0.000 luma delta on
     every wall pixel, which is the signature of this trap, not of a clean
     bake.) Call it, wait ~3 frames for the tone lock to re-converge, then read
     bakePng(). Nothing in the render path calls this. */
  rebake: (n) => { const k = Math.max(1, n|0 || 4); let ms = 0;
                   for (let i=0;i<k;i++){ TERRAIN.key = null; TERRAIN.at = -1e9;
                     bakeTerrain(); ms = TERRAIN.ms; }
                   return +ms.toFixed(2); },
  /* the geometry the bake actually drew: every tile's projected top face and
     the interior wall quads beneath it, in CSS px. A pixel probe needs this to
     ask "is any of the basin's material showing on a cliff face?" without
     re-deriving the projection. Read-only. */
  quads: () => ({ poly: TERRAIN.poly, walls: TERRAIN.walls,
                  level: (() => { const o = {}; for (let z=0;z<MAP.rows;z++)
                    for (let x=0;x<MAP.cols;x++) o[x+','+z] = hfLevel(x,z); return o; })() }),
  /* per-level mean/min/max luminance measured on the BAKED ground at the tile
     centres, plus the ramp each level was aiming for. This is the elevation
     read, as a number: means must separate by ≥25 and each level's min..max
     spread must stay inside ~±10. */
  /* the per-tile corrections the closed loop is carrying, and the target each
     one is aiming at. A tile whose correction keeps growing while its error
     does not shrink is a tile the loop cannot reach — that is a different bug
     from "the ramp is wrong" and the two are indistinguishable from outside
     without this. Read-only copy. */
  toneCorr: () => { const o = {}; for (let z=0;z<MAP.rows;z++) for (let x=0;x<MAP.cols;x++){
                      const k = x+','+z; o[k] = { corr:+(TONE.corr[k]||0).toFixed(1),
                        want:+toneWant(x,z).toFixed(1), L:hfLevel(x,z) }; } return o; },
  tone: () => ({ stats:TONE.stats, worstErr:+TONE.err.toFixed(2), iter:TONE.iter,
                 dead:TONE.dead, want:[0,1,2,3].map(L => +levelLuma(L).toFixed(1)) }),
  /* which tiles carry a hazard. Needed to read a luminance probe of the LIVE
     canvas honestly: a surfaced tile is painted by the hazard pass after the
     ground and reads as ice/oil/fire, not as its elevation. */
  surfaced: () => Object.keys(SURFACES || {})
};
window.Board = {
  buildStage, spawnUnit, summonUnit, moveUnit, attackUnit, killUnit,
  setTimeOfDay, setLocation, setPylonArt, focusTile, clearFocus, tileAt,
  spawnEvent, setEvents, triggerEvent, clearEvent, eventsAt, get eventTypes(){ return EVENT_TYPES; },
  get locations(){ return LOCATIONS; }, get map(){ return MAP; }, get units(){ return units; },
  on:(evt,fn) => document.addEventListener('board:'+evt, fn),
  get paint(){ return PAINT; }, unitScreenBox
};

/* ══════════════════════════════════════════════════════════════════
   HAND (placeholder strip — real hand comes from the existing HUD)
   ══════════════════════════════════════════════════════════════════ */
function paintCardArt(c, card, w, h, dpr){
  c.setTransform(dpr,0,0,dpr,0,0);
  const g = c.createLinearGradient(0,0,0,h);
  g.addColorStop(0, rgba(card.ec,.32)); g.addColorStop(.78,'rgba(10,7,16,.95)'); g.addColorStop(1,'rgba(6,4,10,1)');
  c.fillStyle = g; c.fillRect(0,0,w,h);
  const rg = c.createRadialGradient(w/2,h*.44,2,w/2,h*.44,w*.62);
  rg.addColorStop(0, rgba(card.ec,.34)); rg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = rg; c.fillRect(0,0,w,h);
  c.save(); c.translate(w/2, h*.80);
  paintSprite(c, card.unit, h*.52, UNIT_DEFS[card.unit].color, 0);
  c.restore();
}

function renderHand(){
  const el = document.getElementById('hand');
  el.innerHTML = HAND.map(c => `
    <div class="hcard ${armedCard===c.id?'armed':''}" data-id="${c.id}">
      <span class="cost">${c.cost}</span>
      <span class="art"><canvas width="372" height="520" style="width:186px;height:260px"></canvas></span>
      <span class="el" style="color:${c.ec}">${c.el}</span>
      <span class="nm">${UNIT_DEFS[c.unit].name}</span>
    </div>`).join('');
  el.querySelectorAll('.hcard').forEach(node => {
    const card = HAND.find(c => c.id === node.dataset.id);
    const cc = node.querySelector('canvas').getContext('2d');
    paintCardCanvas(cc, card);
    node.addEventListener('click', () => {
      armedCard = (armedCard === card.id) ? null : card.id;
      renderHand();
    });
  });
}
function paintCardCanvas(c, card){ paintCardArt(c, card, 186, 260, 2); }

/* ══════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   HOST BRIDGE — the game drives the board over postMessage.
   Embedded  = we have a parent window. In that mode the demo hand, the
   hint and the demo spawns are all suppressed and the board waits for a
   `board:init` snapshot instead of inventing one.
   Protocol (host → board), all `{ type, ... }`:
     board:init        { map, locations, location, timeOfDay, defs, units, safe }
     board:map         { map }                 rebuild the stage
     board:defs        { defs }                register unit art / sheets
     board:units       { units }               full snapshot (replaces all)
     board:location    { id }                  LOCATION CARD resolved
     board:timeOfDay   { key }                 weather flip (lerps 2.5s)
     board:spawn       { key, x, z, side, id }
     board:summon      { key, x, z, cardId }   full card→sprite ceremony
     board:move        { id, x, z }
     board:attack      { id, targetId }
     board:kill        { id }
     board:focus       { x, z } | board:clearFocus
     board:event       { action:'spawn'|'trigger'|'clear', type, x, z }
   Board → host: board:ready, board:tileClick, board:unitClick,
     board:summonComplete, board:locationChange, board:timeOfDay
   ══════════════════════════════════════════════════════════════════ */
const EMBEDDED = (() => { try { return window.parent && window.parent !== window; } catch (e) { return false; } })();
const HOST = { origin:'*' };
function post(type, detail){
  if (!EMBEDDED) return;
  try { window.parent.postMessage(Object.assign({ type:'board:' + type }, detail || {}), HOST.origin); } catch (e) {}
}
/* mirror every internal dispatch out to the host */
['tileClick','unitClick','tileHover','cardPlayed','summonComplete','locationChange','timeOfDay'].forEach(ev => {
  document.addEventListener('board:' + ev, e => post(ev, e.detail || {}));
});

function applyDefs(defs){
  if (!defs) return;
  for (const k in defs){
    const d = defs[k]; if (!d) continue;
    /* ⚠ MUTATE IN PLACE. spawnUnit stores `u.def = UNIT_DEFS[key]` by
       REFERENCE, so replacing the object here left every already-spawned unit
       pointing at the old procedural def — which is exactly why real sprites
       didn't take effect until a respawn. */
    const cur = UNIT_DEFS[k] || (UNIT_DEFS[k] = {});
    /* 🎞 drop the held frame when the ART ITSELF changes — see the note in
       paintSprite. The hold exists to cover a decode gap in ONE animation; it
       must not survive a def swap, or a Kalon that transforms mid-match keeps
       painting the base creature's last pose until its new frames decode. */
    try {
      const sigOld = (cur.frames && cur.frames.length ? cur.frames.join(',') : '') + '~' + (cur.art || '');
      const sigNew = (Array.isArray(d.frames) && d.frames.length ? d.frames.join(',') : '') + '~' + (d.art || '');
      if (sigOld !== sigNew) cur._lastFrame = null;
    } catch (e) { cur._lastFrame = null; }
    Object.assign(cur, {
      name: d.name || k,
      color: d.color || '#cfd6e4',
      h: (typeof d.h === 'number' && d.h > 0) ? d.h : 1.05,
      art: (typeof d.art === 'string' && d.art) ? d.art : null,
      sheet: d.sheet || null,
      frames: Array.isArray(d.frames) ? d.frames : null,
      fps: d.fps || 10,
      _phase: cur._phase || ((k.length * 0.137) % 1)
    });
    /* warm the textures NOW so the first paint already has real art instead
       of one procedural flash while the images decode */
    if (Array.isArray(d.frames)) for (const f of d.frames) artImage(f);
    if (typeof d.art === 'string') artImage(d.art);
    if (cur.art || cur.frames || (cur.sheet && cur.sheet.src)) delete cur._proc;   // real art wins
  }
}
/* Replace the whole unit set from a match snapshot. Units already on the
   board with the same id are MOVED rather than re-spawned, so a snapshot
   refresh never restarts an animation mid-flight. */
function applyUnits(list){
  if (!Array.isArray(list)) return;
  const seen = new Set();
  for (const u of list){
    if (!u || u.id == null) continue;
    seen.add(String(u.id));
    const cur = units.find(x => String(x.id) === String(u.id) && !x.dead);
    if (cur){
      if (cur.gx !== u.x || cur.gz !== u.z) moveUnit(cur.id, u.x, u.z);
      /* 🜂 KALON TRANSFORM (and any other in-place identity change).
         The unit keeps its instance id but its CARD changes, so matching by id
         alone left the base form's art on the board forever. Swap the key and
         the def reference in place — no respawn, so position, facing and any
         running animation survive. */
      const nk = u.key || u.defKey;
      if (nk && cur.key !== nk){
        cur.key = nk;
        // If the new form's def hasn't landed yet, mint one the same way
        // spawnUnit does — otherwise paintSprite would find nothing for this
        // key and the unit would vanish instead of just looking generic.
        if (!UNIT_DEFS[nk]){
          let h = 0; for (let i = 0; i < String(nk).length; i++) h = (h * 31 + String(nk).charCodeAt(i)) | 0;
          const proc = PROC_KEYS[Math.abs(h) % PROC_KEYS.length];
          UNIT_DEFS[nk] = Object.assign({}, PROC_DEFS[proc], { name:String(nk), _proc:proc });
        }
        cur.def = UNIT_DEFS[nk];
        cur.flash = Math.max(cur.flash || 0, 0.9);   // a beat of white on the swap
      }
      continue;
    }
    const nu = spawnUnit(u.key || u.defKey || 'imp', u.x, u.z, u.side === 'foe' ? 'foe' : 'mine');
    if (nu && u.id != null) nu.id = String(u.id);
  }
  for (const x of units.slice()) if (!x.dead && !seen.has(String(x.id))) killUnit(x.id);
}

function handleHostMessage(msg){
  if (!msg || typeof msg.type !== 'string' || msg.type.indexOf('board:') !== 0) return;
  const t = msg.type.slice(6);
  try {
    if (t === 'init'){
      if (msg.safe) Object.assign(CONFIG.SAFE, msg.safe);
      if (msg.locations) setLocations(msg.locations, true);
      if (msg.map) Object.assign(MAP, msg.map);
      buildStage();
      applyDefs(msg.defs);
      loadLocation(msg.location || MAP.location || DEFAULT_LOCATION, true);
      if (msg.timeOfDay && TIME_PRESETS[msg.timeOfDay]){
        BATTLE.timeOfDay = msg.timeOfDay;
        Object.assign(LIGHT, TIME_PRESETS[msg.timeOfDay]);
      }
      applyUnits(msg.units);
      // 🗿 Real match events — after buildStage so tile elevations exist.
      if (msg.events) setEvents(msg.events);
      resize();
      /* 🎬 THE BATTLE HAS ARRIVED. This — not document load — is the moment the
         board becomes this match's board, so it is where the opening starts and
         where the load schedule is armed. Both are cheap and neither blocks:
         revealStart() hands two animations to the compositor and returns, and
         loadBegin() only sets a counter. Measured at 0.6-0.8 ms for the whole
         init handler, unchanged by either. */
      loadBegin();
      revealStart();
    }
    else if (t === 'map'){ if (msg.map) Object.assign(MAP, msg.map); buildStage(); if (msg.events) setEvents(msg.events); resize(); }
    else if (t === 'events'){ setEvents(msg.events); }
    else if (t === 'defs')      applyDefs(msg.defs);
    else if (t === 'units')     applyUnits(msg.units);
    /* 🗺 LATE LOCATION REGISTRATION. `setLocation` hard-bails with "unknown
       location" when the id isn't in LOCATIONS — and the table is only built
       once, at init, from the cards that existed and had a usable image THEN.
       A location card PLAYED mid-match was therefore almost never registered,
       so the battlefield never changed. The host now sends this immediately
       before every `location` message. keepDefault=true so it MERGES rather
       than wiping the table. */
    /* 🎨 Painted tile surfaces: { "x,z": effectKey }. Whole-map replace,
       because the host already diffs and only sends on change. */
    /* 🎬 THE HOST HAS JUST MADE US VISIBLE — see the note at the `.ready` class
       in index.html. The opening that ran at init played to an opacity:0
       iframe; this is the one the player actually sees. startedAt is cleared
       so revealStart's "do not restart an opening that has barely begun" guard
       cannot swallow it — that guard exists to stop a LATE init slamming a
       lifting veil back to black, and here the veil has never been on screen
       at all. */
    else if (t === 'reveal'){ try { REVEAL.startedAt = 0; revealStart(); } catch (e) {} }
    else if (t === 'surfaces') SURFACES = (msg.tiles && typeof msg.tiles === 'object') ? msg.tiles : {};
    else if (t === 'locations') setLocations(msg.locations || {}, true);
    else if (t === 'location')  setLocation(msg.id, !!msg.instant);
    else if (t === 'timeOfDay') setTimeOfDay(msg.key);
    else if (t === 'spawn'){ const u = spawnUnit(msg.key, msg.x, msg.z, msg.side === 'foe' ? 'foe' : 'mine'); if (u && msg.id != null) u.id = String(msg.id); }
    else if (t === 'summon')    summonUnit(msg.key, msg.x, msg.z, { id:msg.id, side:msg.side, cost:msg.cost });
    else if (t === 'summonFx')  summonFx(msg.id);
    /* 🪦 Tombstones. The game owns their whole lifecycle (decay, revive
       timers, loot state); the board just renders the markers it is given. */
    else if (t === 'tombs'){
      TOMBS.length = 0;
      for (const tb of (msg.list || [])) if (tb) TOMBS.push(tb);
      for (const tb of TOMBS) if (tb.img) artImage(tb.img);   // warm the texture
    }
    else if (t === 'move')      moveUnit(msg.id, msg.x, msg.z);
    else if (t === 'attack')    attackUnit(msg.id, msg.targetId);
    else if (t === 'kill')      killUnit(msg.id);
    else if (t === 'focus')     focusTile(msg.x, msg.z);
    else if (t === 'clearFocus')clearFocus();
    /* 🎨 SURFACE PAINT — the game decides which tiles are legal targets
       (move / attack / placement / swap); the board only tints them. Sent as
       sets of "x,z" keys so lookup during the tile loop is O(1). */
    else if (t === 'paint'){
      PAINT.move  = new Set(msg.move  || []);
      PAINT.attack= new Set(msg.attack|| []);
      PAINT.place = new Set(msg.place || []);
      PAINT.swap  = new Set(msg.swap  || []);
      PAINT.sel   = msg.sel || null;
    }
    /* 🖱 FORWARDED POINTER. The stage paints BELOW the app (so the HUD stays
       on top), which means it cannot receive its own mouse events. The host
       captures them over the board area and forwards normalised coords here;
       we run the same perspective pick the canvas would have. */
    else if (t === 'pointer'){
      /* the host normalises against the stage host's rect, which does not move
         when the opening scales the canvas — so this pick needs the same
         un-zoom the direct listeners take. */
      const p0 = unzoom(msg.nx * W, msg.ny * H);
      const mx = p0.x, my = p0.y;
      const tile = pickTile(mx, my);
      const hit = tile ? unitAt(tile.x, tile.z) : null;
      if (msg.kind === 'click'){
        if (tile) dispatch('tileClick', { x:tile.x, z:tile.z, unitId: hit ? String(hit.id) : null });
      } else {
        const key = (tile ? (tile.x + ',' + tile.z) : '') + '|' + (hit ? hit.id : '');
        if (key !== (window.__lastHoverKey || '')){
          window.__lastHoverKey = key;
          if (tile) focusTile(tile.x, tile.z); else clearFocus();
          dispatch('tileHover', { x: tile ? tile.x : -1, z: tile ? tile.z : -1,
                                  unitId: hit ? String(hit.id) : null,
                                  box: hit ? unitScreenBox(hit) : null });
        }
      }
    }
    else if (t === 'event'){
      if (msg.action === 'spawn')   spawnEvent(msg.evType || msg.evtType, msg.x, msg.z);
      if (msg.action === 'trigger') triggerEvent(msg.x, msg.z, msg.unitId);
      if (msg.action === 'clear')   clearEvent(msg.x, msg.z);
    }
  } catch (e) { try { console.warn('board message failed', t, e); } catch (_) {} }
}
window.addEventListener('message', e => handleHostMessage(e.data));

try {
  /* EMBEDDED: the host sizes the iframe to the exact rect the old board
     occupied, so the stage must FILL the canvas — no UI gutters and no
     optical shift (both exist only for the standalone full-screen preview). */
  if (EMBEDDED){
    CONFIG.SAFE = { left:0, right:0, top:0, bottom:0 };
    CONFIG.viewShiftY = 0;
  }
  buildStage();
  if (EMBEDDED){
    /* the game owns the hand + hint; hide the standalone stand-ins */
    const h = document.getElementById('hand'); if (h) h.style.display = 'none';
    const hi = document.getElementById('hint'); if (hi) hi.remove();
  } else {
    /* standalone preview — a demo board so the file still opens on its own */
    spawnUnit('imp', 3, 1, 'foe');
    spawnUnit('knight', 6, 0, 'foe');
    spawnUnit('wyrm', 1, 2, 'foe');
    spawnUnit('mage', 2, 5, 'mine');
    spawnUnit('crystal', 5, 6, 'mine');
    HAND = [
      { id:'c1', cost:5, unit:'jelly',   el:'NATURE',  ec:'#8fd84a' },
      { id:'c2', cost:6, unit:'bunny',   el:'SHADOW',  ec:'#c8a8ff' },
      { id:'c3', cost:0, unit:'mage',    el:'FIRE',    ec:'#ff8a3c' },
      { id:'c4', cost:6, unit:'wyrm',    el:'MYTHIC',  ec:'#f6dc95' },
      { id:'c5', cost:2, unit:'crystal', el:'CRYSTAL', ec:'#5fe8d5' },
      { id:'c6', cost:5, unit:'knight',  el:'MYTHIC',  ec:'#f6dc95' }
    ];
    renderHand();
  }
  loadLocation(DEFAULT_LOCATION, true);
  setPylonArt(PYLON_ART.src);
  /* the standalone / pre-init boot gets the same treatment: embedded, board:init
     re-arms both a moment later, which is correct — the opening belongs to the
     match, and re-starting it cancels the boot one rather than stacking. */
  loadBegin();
  revealStart();
  requestAnimationFrame(t => { last = t; frame(t); });
  post('ready', { cols:MAP.cols, rows:MAP.rows });
} catch (err) {
  /* never fail silently to a black screen */
  const c = cv.getContext('2d');
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = '#140a0a'; c.fillRect(0,0,cv.width,cv.height);
  c.fillStyle = '#ff8a7a'; c.font = '600 15px monospace';
  c.fillText('BATTLE BOARD FAILED TO START:', 24, 40);
  c.fillText(String(err && err.message || err), 24, 64);
  console.error(err);
}
</script>
<!-- 🔌 STAGE MODULES. Served same-origin from /src/battle/stage/ (public/ is the
     deploy root, so public/src/battle/stage/x.js is /src/battle/stage/x.js and
     ../src/… resolves from /battle-board/). They are `type=module` and therefore
     DEFERRED: they attach to window.BBX after the classic script above has already
     started rendering, which is why every call site in frame() is optional-chained
     with the original code behind it. A module that 404s or throws on load leaves
     window.BBX partly empty and the board simply keeps its fallbacks — it must
     never take the battlefield down. -->
<script type="module" src="../src/battle/stage/terrain.js"></script>
<script type="module" src="../src/battle/stage/vista.js"></script>
<script type="module" src="../src/battle/stage/tilefx.js"></script>
<script type="module" src="../src/battle/stage/dressing.js"></script>
</body>
