   there. The ladder reaches 1.35 and the back row stands a clear 50px proud of
   the rim, so a far band drawn after the terrain rules a dark line straight
   across the tops of the far slabs. The bake already runs far to near, so the
   row that must occlude it is painted immediately afterwards. The other three
   edges carry no such constraint and are drawn after the blit by drawFrame(),
   because the stone apron reaches further out than they do and would cover
   them. Kept as its own function so the paintTerrain() sweep stays readable. */
function frameBand(){
  const L = lipRect();
  drawLipEdge(L, lipFarEdge(L), lightVector());
  /* pillars are depth-sorted with units — see drawPylon() */
}
/* 🧱 THE NEAR AND SIDE BANDS ARE BACK — AND THIS IS AN OVERRIDE, NOT A FIX.
   ════════════════════════════════════════════════════════════════════════
   The note that stood here was not an oversight and the next reader must not
   revert this as vandalism. It said the three bands were deleted on purpose:
   "they were the last literal statement that the battlefield is an OBJECT on a
   table … with the skirt carrying the ground past the frame edge on those three
   sides there is nothing left for them to enclose, and drawing them would cut
   the diorama in half." That is the correct argument for BAR R1, whose opening
   line is "the map IS the frame — there is no small board plate floating in the
   middle of a painting".
   TABLETOP-BAR asks the opposite question and, by the owner's call, wins here:
     §2  "The board is a finite object. Its edge is visible on at least three
          sides in the default framing. A player must see where the board STOPS."
     §7  "The playfield is framed: a border, rail or lip runs around the board,
          the way a pitch has a touchline."
     §1.4 lists the shipped picture as a defect in so many words — "the board
          has no edge and no frame; tiles ravel out into ragged half-rows left,
          right and bottom, then stop over dark water."
   The diorama is NOT cut in half, and that is the whole design of the answer:
   the skirt still terraces out past the lip to the frame edge, so nothing
   floats on a plate. What changed is that the play field now ends AT a built
   object standing on that ground, instead of dissolving into it.
   🔴 THIS IS HALF OF A PAIR. skirtAt()'s ring-1 flush rule was written to make
   the boundary dissolve and had to go at the same time — read the note there.
   A lip with a flush first ring behind it is a kerb lying on flat ground; the
   guaranteed one-rung drop is what it stands on. Revert one and revert both.
   Called from drawBoard() AFTER the terrain blit and BEFORE the tilefx early
   return, never before the blit: the stone apron reaches further out in z than
   the lip does and would paint straight over it. */
function drawFrame(){
  const L = lipRect();
  const far = lipFarEdge(L);
  const lv = lightVector();
  /* Painter's order among the three. Sorted by depth rather than by index
     because WHICH of them is nearest is a question the free camera answers:
     take a fixed order and at 90° of yaw a side band laps the near one at the
     corner they share, which shows up as a bright mitre on the wrong edge. */
  const rest = [];
  for (let i=0;i<4;i++){
    if (i === far) continue;
    const j = (i+1)%4;
    rest.push({ i:i, d: camDepth({ x:(L.out[i].x+L.out[j].x)/2, y:0, z:(L.out[i].z+L.out[j].z)/2 }) });
  }
  rest.sort((a,b) => b.d - a.d);
  for (const e of rest) drawLipEdge(L, e.i, lv);
}

/* ══════════════════════════════════════════════════════════════════
   BOARD EVENTS  ── FOR CLAUDE CODE ──
   Houses, wrecked cars and the like are NOT scenery in this game — they
   are EVENTS that occupy a tile until they are resolved. The board only
   RENDERS them; the game's event system owns their behaviour.

   WIRE THESE UP:
     Board.spawnEvent(type, x, z)   place an event on a tile (deck/turn/
                                    script driven). Fires 'board:eventSpawn'.
     Board.triggerEvent(x, z)       resolve it — call when a unit enters the
                                    tile, when the turn ticks, or when a card
                                    targets it. Fires 'board:eventTrigger'
                                    with { type, x, z, unitId } so the game
                                    can apply the actual effect (loot, ambush
                                    spawn, damage, heal, buff …).
     Board.clearEvent(x, z)         remove it once resolved/expired.
                                    Fires 'board:eventClear'.
     Board.eventsAt(x, z)           query.

   The demo auto-triggers an event when a unit finishes a move onto its
   tile — replace that call with the game's real resolution rules.
   Each event type below needs: display name, colour, icon, and whether it
   BLOCKS movement (a house/car would; a supply drop would not).
   Art: swap `icon` for the event's real sprite — the pad, pillar of light
   and float animation stay.
   ══════════════════════════════════════════════════════════════════ */
const EVENT_TYPES = {
  'supply-drop':{ name:'Supply Drop',  color:'#f0c96e', icon:'crate',  blocks:false },
  'ambush'     :{ name:'Ambush',       color:'#e04a3a', icon:'skull',  blocks:false },
  'relic'      :{ name:'Relic Cache',  color:'#a35cff', icon:'star',   blocks:false },
  'medical'    :{ name:'Medical Camp', color:'#4ad8c8', icon:'cross',  blocks:false },
  'bloom'      :{ name:'Toxic Bloom',  color:'#8fd84a', icon:'spore',  blocks:false },
  'structure'  :{ name:'Structure',    color:'#b0a48a', icon:'block',  blocks:true  }
};
const EV_ICON = {
  crate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>',
  skull:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a7 7 0 00-7 7c0 2.6 1.4 4.8 3.5 6V19h7v-3c2.1-1.2 3.5-3.4 3.5-6a7 7 0 00-7-7zm-2.5 7a1.2 1.2 0 110-2.4 1.2 1.2 0 010 2.4zm5 0a1.2 1.2 0 110-2.4 1.2 1.2 0 010 2.4z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2-6.3-4.5-6.3 4.5L8 13.8 2 9.2h7.6z"/></svg>',
  cross:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4h6v5h5v6h-5v5H9v-5H4V9h5z"/></svg>',
  spore:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><circle cx="6" cy="7" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="7" cy="18" r="2"/></svg>',
  block:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="7" width="14" height="12"/><path d="M5 11h14M12 11v8"/></svg>'
};
function eventsAt(x,z){ return (MAP.events||[]).filter(e => e.x===x && e.z===z); }
// 🗿 SET THE WHOLE EVENT LIST from the host. Called on board:init and whenever
// the game respawns events. Unknown types fall back to 'relic' rather than being
// dropped — a custom Forge event has no entry in EVENT_TYPES and must still show.
function setEvents(list){
  MAP.events = [];
  for (const e of (Array.isArray(list) ? list : [])){
    if (!e || typeof e.x !== 'number' || typeof e.z !== 'number') continue;
    spawnEvent(e.type, e.x, e.z, e);
  }
}
function spawnEvent(type, x, z, opts){
  opts = opts || {};
  if (!EVENT_TYPES[type]) type = 'relic';        // custom Forge events land here
  MAP.events = MAP.events || [];
  const ev = { x, z, type, born:T,
    // 📦 model: a PNG baked from the admin's uploaded .glb, drawn standing on
    // the tile. `scale` is an admin trim in (0,1] — it can only make it SMALLER;
    // the tile footprint is the ceiling and is enforced in drawEvent.
    art:   opts.art   || opts.model || null,
    scale: Math.max(.2, Math.min(1, +opts.scale || 1)),
    name:  opts.name  || null,
    color: opts.color || null };
  MAP.events.push(ev);
  effects.push({ k:'ring', x:gw(x,z).x, z:gw(x,z).z, t:0, dur:.8, col:EVENT_TYPES[type].color, r0:.1, r1:.9 });
  dispatch('eventSpawn', { type, x, z });
  return ev;
}
function triggerEvent(x, z, unitId){
  const list = eventsAt(x,z); if (!list.length) return;
  for (const ev of list){
    const T2 = EVENT_TYPES[ev.type];
    burst(gw(x,z).x, gw(x,z).z, .9, 30, T2.color);
    effects.push({ k:'ring', x:gw(x,z).x, z:gw(x,z).z, t:0, dur:.6, col:T2.color, r0:.15, r1:1.3 });
    effects.push({ k:'float', x:gw(x,z).x, z:gw(x,z).z, t:0, dur:1.2, txt:T2.name.toUpperCase(), col:T2.color });
    /* ← REPLACE: hand off to the game's event resolution here */
    dispatch('eventTrigger', { type:ev.type, x, z, unitId:unitId||null });
  }
  clearEvent(x,z);
}
function clearEvent(x, z){
  if (!MAP.events) return;
  const before = MAP.events.length;
  MAP.events = MAP.events.filter(e => !(e.x===x && e.z===z));
  if (MAP.events.length !== before) dispatch('eventClear', { x, z });
}
function drawEvent(ev){
  let E = EVENT_TYPES[ev.type]; if (!E) return;
  // A host event can override the palette entry's name/colour without needing a
  // new EVENT_TYPES row — custom Forge events have no row of their own.
  if (ev.color || ev.name) E = { ...E, color: ev.color || E.color, name: ev.name || E.name };
  const el = tileElev(ev.x, ev.z);
  const c = project(gw(ev.x, ev.z, el + .01));
  if (!c) return;
  const R = ringPx(c, tileR() * 0.80);          /* 0.80 of the hex inradius */
  const pulse = .5 + Math.sin(T*2.2 + ev.x + ev.z)*.5;

  /* glowing pad on the tile */
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, .44);
  const g = ctx.createRadialGradient(0,0,0,0,0,R);
  g.addColorStop(0, rgba(E.color, .38 + pulse*.22));
  g.addColorStop(.6, rgba(E.color, .16));
  g.addColorStop(1, rgba(E.color, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill();
  ctx.strokeStyle = rgba(E.color, .6 + pulse*.35); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,0,R*.86,0,7); ctx.stroke();
  ctx.setLineDash([R*.22, R*.16]); ctx.lineWidth = 1.4; ctx.rotate(T*.5);
  ctx.beginPath(); ctx.arc(0,0,R*.62,0,7); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  /* pillar of light */
  const topP = project(gw(ev.x, ev.z, el + 1.5));
  if (topP){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const pg = ctx.createLinearGradient(c.x, c.y, topP.x, topP.y);
    pg.addColorStop(0, rgba(E.color, .30 + pulse*.10));
    pg.addColorStop(1, rgba(E.color, 0));
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.moveTo(c.x-R*.6, c.y); ctx.lineTo(c.x+R*.6, c.y);
    ctx.lineTo(topP.x+R*.22, topP.y); ctx.lineTo(topP.x-R*.22, topP.y);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  /* 📦 3D MODEL — a PNG baked from the event's .glb, standing ON the tile.
     THE FIT RULE: `R` is the tile's half-width in projected pixels, so the model
     is drawn at most 2R wide (exactly one tile) and 2R*1.6 tall. Whichever limit
     binds first wins, so the aspect ratio is preserved and the footprint can
     never spill onto a neighbouring tile no matter what was uploaded. */
  const mdl = ev.art ? artImage(ev.art) : null;
  if (mdl && mdl.naturalWidth > 0){
    const maxW = R*2*ev.scale, maxH = R*3.2*ev.scale;
    const k = Math.min(maxW / mdl.naturalWidth, maxH / mdl.naturalHeight);
    const dw = mdl.naturalWidth*k, dh = mdl.naturalHeight*k;
    const bob2 = Math.sin(T*1.4 + ev.x*1.7)*(R*.05);
    ctx.save();
    /* contact shadow so it reads as standing on the tile, not floating over it */
    ctx.globalAlpha = .34; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, dw*.34, dw*.34*.42, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    /* baseline sits at the tile centre — the model stands, it does not hover */
    ctx.drawImage(mdl, c.x - dw/2, c.y - dh + bob2, dw, dh);
    ctx.restore();
    return;                       /* the model replaces the glyph badge entirely */
  }

  /* floating marker — shown when the event has no model */
  const bob = Math.sin(T*1.6 + ev.x*1.7)*.06;
  const m = project(gw(ev.x, ev.z, el + .62 + bob));
  if (m){
    const s = R*.62;
    ctx.save(); ctx.translate(m.x, m.y);
    ctx.rotate(Math.sin(T*.9 + ev.z)*.06);
    ctx.fillStyle = rgba('#07050c', .78);
    ctx.beginPath();
    for (let i=0;i<6;i++){ const a=i*Math.PI/3 - Math.PI/2;
      const px2=Math.cos(a)*s, py2=Math.sin(a)*s; i?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba(E.color, .85); ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    /* icon */
    ctx.save(); ctx.translate(m.x - s*.55, m.y - s*.55);
    const k2 = s*1.1/24;
    ctx.scale(k2,k2); ctx.strokeStyle = E.color; ctx.fillStyle = E.color; ctx.lineWidth = 1.7;
    drawEvIcon(E.icon);
    ctx.restore();
  }
}
function drawEvIcon(kind){
  ctx.beginPath();
  if (kind==='crate'){ ctx.moveTo(4,8); ctx.lineTo(12,4); ctx.lineTo(20,8); ctx.lineTo(20,16);
    ctx.lineTo(12,20); ctx.lineTo(4,16); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4,8); ctx.lineTo(12,12); ctx.lineTo(20,8); ctx.moveTo(12,12); ctx.lineTo(12,20); ctx.stroke(); }
  else if (kind==='skull'){ ctx.arc(12,10,6,0,7); ctx.fill();
    ctx.fillStyle='#07050c'; ctx.beginPath(); ctx.arc(9.6,10,1.3,0,7); ctx.arc(14.4,10,1.3,0,7); ctx.fill(); }
  else if (kind==='star'){ for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r=i%2?4:9;
      const x=12+Math.cos(a)*r, y=12+Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.closePath(); ctx.fill(); }
  else if (kind==='cross'){ ctx.moveTo(9,4); ctx.lineTo(15,4); ctx.lineTo(15,9); ctx.lineTo(20,9);
    ctx.lineTo(20,15); ctx.lineTo(15,15); ctx.lineTo(15,20); ctx.lineTo(9,20); ctx.lineTo(9,15);
    ctx.lineTo(4,15); ctx.lineTo(4,9); ctx.lineTo(9,9); ctx.closePath(); ctx.fill(); }
  else if (kind==='spore'){ ctx.arc(12,12,4,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(6,7,2,0,7); ctx.arc(18,8,2,0,7); ctx.arc(7,18,2,0,7); ctx.stroke(); }
  else { ctx.rect(5,7,14,12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(5,11); ctx.lineTo(19,11); ctx.moveTo(12,11); ctx.lineTo(12,19); ctx.stroke(); }
}

/* ══════════════════════════════════════════════════════════════════
   BRAZIER PYLON — carved stone column with gold banding and a fire bowl,
   built to match the reference art. Drawn from projected world points so
   it keeps correct perspective, and depth-sorted with units/props.
   (Three.js: replace with a GLTF pylon; keep the bowl anchor at y=1.46
   so the flame emitter position is unchanged.)
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   PYLON ART SLOT — replace the carved pylon with your own artwork:
     Board.setPylonArt('assets/pylon.png')                       // static
     Board.setPylonArt('assets/pylon_sheet.png', {frames:8, fps:12})
   NOTE ON GIFs: a 2D canvas (and a Three.js texture) will only ever show
   the FIRST frame of an animated .gif — the format can't be sampled per
   frame. Export the animation as a horizontal SPRITE SHEET (png/webp) and
   pass {frames, fps}; that's what this slot and the engine both want.
   widthWorld/heightWorld are in board tiles, so the art scales with the
   camera automatically. The flame emitter stays at PYLON.top regardless,
   so set bowlY to wherever the bowl sits in YOUR art.
   ══════════════════════════════════════════════════════════════════ */
const PYLON_ART = {
  img:null, frames:1, fps:12,
  /* Sprite is 360x489. These are measured off the bake, not guessed:      */
  widthWorld:1.72, heightWorld:2.34,   /* preserves the 0.736 aspect        */
  anchorY:0.80,        /* GROUND LINE in the sprite (the base slab sits at  */
                       /* 80% down; the last 20% is the platform's front    */
                       /* edge, which must hang toward the viewer)          */
  fireY:0.070,         /* fire bowl, fraction from the sprite TOP           */
  emitY:0.150,         /* capital gem — the hologram projector             */
  flames:true,         /* fire burns from the bowl                          */
  src:'../assets/board/pylon.png'      /* baked from pillars.glb, yaw 270° (serpent head-on) */
};
function setPylonArt(src, opts){
  Object.assign(PYLON_ART, opts||{});
  PYLON_TINT.cv = null; PYLON_TINT.key = '';      /* new art → re-grade */
  if (src === null){ PYLON_ART.img = null; return; }
  const im = new Image();
  im.onload = () => { PYLON_ART.img = im; PYLON_TINT.cv = null; PYLON_TINT.key = ''; seedBraziers(); };
  im.src = src || PYLON_ART.src;
  if (opts && typeof opts.bowlY === 'number'){ PYLON.top = opts.bowlY; seedBraziers(); }
}

/* ══════════════════════════════════════════════════════════════════
   PYLON DESERT GRADE — READ BEFORE REMOVING.
   The pillar art (assets/board/pylon.png) is baked from the OLD chrome:
   a navy-blue plinth, cyan filigree and a pale blue base. The critic:
   "the brazier props were never reskinned — the two flame pylons flanking
   the far corners still stand on navy-blue plinths with cyan filigree and
   pale blue bases, the old chrome palette, planted in a warm ochre desert
   canyon." It is the loudest wrong-world object left on the field.
   We cannot repaint the PNG (binary asset, not this piece's to own), so the
   sprite is re-graded at load into warm sandstone and cached:
     1. 'saturation' with mid grey  → strips ALL the blue/cyan chroma. This
        step is what guarantees no navy survives; a plain multiply over navy
        leaves navy, just darker.
     2. 'multiply' with a vertical ochre ramp → duotone: pale sun-bleached
        sandstone at the top where the bowl catches the key, warm brown at
        the base where it sits in its own shadow.
     3. 'lighter' with a low warm lift → nothing ends up pure black (BAR).
     4. source-atop with the current LIGHT.key → the pillar obeys the same
        time-of-day key as the ground, so it belongs to this scene.
   ⚠ EVERY blend step is followed by a destination-in redraw of the source.
   Canvas blend modes composite with source-over, so an unmasked fillRect
   paints the sprite's TRANSPARENT background solid — the pillar came out as
   a filled rectangle the first time this was written. The mask restores the
   original alpha and costs one drawImage.
   Cached on the light, so it re-grades once per time-of-day change, never
   per frame. (Three.js: drop this and tint the material instead.)
   ══════════════════════════════════════════════════════════════════ */
const PYLON_TINT = { cv:null, key:'' };
function pylonSprite(){
  const img = PYLON_ART.img;
  if (!img || !img.complete || !img.naturalWidth) return null;
  const key = [img.src, LIGHT.key, Math.round(LIGHT.keyI*10), LIGHT.ambient, LIGHT.fog].join('|');
  if (PYLON_TINT.cv && PYLON_TINT.key === key) return PYLON_TINT.cv;
  try {
    const w = img.naturalWidth, h = img.naturalHeight;
    const cv = PYLON_TINT.cv && PYLON_TINT.cv.width === w ? PYLON_TINT.cv
             : Object.assign(document.createElement('canvas'), { width:w, height:h });
    const gg = cv.getContext('2d');
    gg.setTransform(1,0,0,1,0,0);
    gg.globalCompositeOperation = 'source-over';
    gg.clearRect(0,0,w,h);
    gg.drawImage(img, 0, 0);
    const mask = () => { gg.globalCompositeOperation = 'destination-in'; gg.drawImage(img, 0, 0); };
    gg.globalCompositeOperation = 'saturation';
    gg.fillStyle = '#808080'; gg.fillRect(0,0,w,h);
    mask();
    gg.globalCompositeOperation = 'multiply';
    const dg = gg.createLinearGradient(0, 0, 0, h);
    dg.addColorStop(0,   mixHexRaw('#f0d3a2', LIGHT.key, 0.18));
    dg.addColorStop(0.55,mixHexRaw('#c69152', LIGHT.key, 0.12));
    dg.addColorStop(1,   mixHexRaw('#7d5730', LIGHT.ambient, 0.16));
    gg.fillStyle = dg; gg.fillRect(0,0,w,h);
    mask();
    gg.globalCompositeOperation = 'lighter';
    gg.fillStyle = rgba(mixHexRaw('#4a3418', LIGHT.key, 0.25), 0.16 + clamp(LIGHT.keyI,0,1.2)*0.07);
    gg.fillRect(0,0,w,h);
    mask();
    gg.globalCompositeOperation = 'source-atop';
    gg.fillStyle = rgba(LIGHT.key, 0.07 + clamp(LIGHT.keyI,0,1.2)*0.05);
    gg.fillRect(0,0,w,h);
    gg.globalCompositeOperation = 'source-over';
    PYLON_TINT.cv = cv; PYLON_TINT.key = key;
    return cv;
  } catch (e){
    /* a grade must never cost us the pillar — fall back to the raw sprite */
    PYLON_TINT.cv = null; PYLON_TINT.key = '';
    return img;
  }
}
const PYLON = { plinth:0.44, base:0.34, shaft0:0.215, shaft1:0.185, cap:0.30, bowl:0.40, rim:0.44, top:1.46 };
function bandQuad(px, pz, y0, y1, hw0, hw1){
  const a = project({x:px-hw0, y:y0, z:pz}), b = project({x:px+hw0, y:y0, z:pz});
  const c = project({x:px+hw1, y:y1, z:pz}), d = project({x:px-hw1, y:y1, z:pz});
  return (a&&b&&c&&d) ? [a,b,c,d] : null;
}
function fillBand(q, c0, c1){
  if (!q) return;
  ctx.beginPath(); ctx.moveTo(q[0].x,q[0].y); ctx.lineTo(q[1].x,q[1].y);
  ctx.lineTo(q[2].x,q[2].y); ctx.lineTo(q[3].x,q[3].y); ctx.closePath();
  const g = ctx.createLinearGradient(q[0].x, q[0].y, q[3].x, q[3].y);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.fill();
}
function drawPylon(br){
  const px = br.x, pz = br.z, P = PYLON;
  /* custom art takes over completely (sprite-sheet aware) */
  if (PYLON_ART.img && PYLON_ART.img.complete && PYLON_ART.img.naturalWidth){
    const base = project({x:px, y:0, z:pz});
    const top  = project({x:px, y:PYLON_ART.heightWorld, z:pz});
    if (base && top){
      shadowEllipse({x:px, y:0, z:pz}, .62, .85);
      /* 🎥 The billboard's WIDTH used to be measured by projecting a second
         point offset along world +X and taking the screen gap — the same idiom
         CONTRACT §2 Tier 2.1 names, and it deflates continuously to zero as the
         camera yaws toward the X axis. At 90° the pillars would be one pixel
         wide, with no error anywhere. `base.s` is already pixels-per-world-unit
         at this depth, so this is the same number at yaw 0, correct at every
         other yaw, and one projection cheaper. */
      const wpx = ringPx(base, PYLON_ART.widthWorld), hpx = Math.abs(base.y - top.y);
      /* 🔀 MERGE HYBRID (battlefield-hex). Their `wpx` above is taken — ours was
         `Math.abs(side.x - base.x)*2`, which is exactly the yaw-broken idiom
         their comment names, and it fails SILENTLY (pillars narrow to nothing
         as you turn, no error anywhere). But their `const img = PYLON_ART.img`
         is NOT taken: it drops pylonSprite(), the desert grading we ship, and
         it drops the srcW/srcH guard with it.
         ⚠ The source rect must come from PYLON_ART.img, NOT from `img`: the
         graded copy is a <canvas>, and a canvas has no naturalWidth /
         naturalHeight. Reading them off it gives undefined, drawImage throws,
         and both pillars vanish leaving their flames burning in mid-air. That
         is why srcW/srcH exist as separate names — keep them even if someone
         later decides the grading should go. */
      const img = pylonSprite() || PYLON_ART.img;
      const srcW = PYLON_ART.img.naturalWidth, srcH = PYLON_ART.img.naturalHeight;
      const fw = srcW / Math.max(1, PYLON_ART.frames);
      const fi = PYLON_ART.frames > 1 ? Math.floor(T*PYLON_ART.fps) % PYLON_ART.frames : 0;
      /* NO mirroring — every pillar faces the camera, serpent head-on.
         Anchored on the sprite's ground line so the base slab sits ON the
         floor and its front edge overhangs toward the camera. */
      const A = PYLON_ART.anchorY;
      const topY = base.y - hpx*A;
      ctx.drawImage(img, fi*fw, 0, fw, srcH,
                    base.x - wpx/2, topY, wpx, hpx);
      /* ── SPRITE-SPACE ANCHORS ──────────────────────────────────────────
         The pillar is a BILLBOARD, but a world point directly above a corner
         pillar projects further from screen-centre than its base (raising y
         reduces depth, which magnifies the x offset). Anchoring VFX to world
         coordinates therefore slides them off the side of the flat sprite.
         So the bowl/lens anchors are taken from the PAINTED sprite rect —
         the fire always sits exactly on the bowl, at any camera angle.
         (Three.js: with real geometry this goes away — use the mesh's bone
         or an empty at the bowl, and delete this block.) */
      br._spr = {
        x: base.x,
        fireY: topY + hpx*PYLON_ART.fireY,
        emitY: topY + hpx*PYLON_ART.emitY,
        s: wpx                                 /* scale unit = pillar width */
      };
    }
    if (PYLON_ART.flames) drawFlames(br);
    drawHoloBeam(br);           /* beam draws OVER its own pillar */
    return;
  }
  const lv = lightVector();
  /* stone tones react to the sun/moon */
  const stoneD = mixHex('#171219', LIGHT.key, .06);
  const stoneM = mixHex('#2e2733', LIGHT.key, .14);
  const stoneL = mixHex('#4a4150', LIGHT.key, .22);
  const goldD = mixHex('#6b4c17', LIGHT.key, .12);
  const goldM = mixHex('#c8963a', LIGHT.key, .18);
  const goldL = mixHex('#f6dc95', LIGHT.key, .10);

  /* ground shadow */
  shadowEllipse({x:px, y:0, z:pz}, .5, .85);

  /* --- stepped plinth --- */
  fillBand(bandQuad(px,pz, 0,    0.10, P.plinth, P.plinth*0.97), stoneM, stoneD);
  fillBand(bandQuad(px,pz, 0.10, 0.20, P.plinth*0.97, P.base),   stoneL, stoneM);
  /* gold line on the plinth lip */
  let q = bandQuad(px,pz, 0.195, 0.215, P.base*1.02, P.base*1.02);
  fillBand(q, goldM, goldD);

  /* --- base molding --- */
  fillBand(bandQuad(px,pz, 0.215, 0.31, P.base, P.shaft0*1.16), stoneL, stoneM);

  /* --- fluted shaft --- */
  const shaft = bandQuad(px,pz, 0.31, 1.02, P.shaft0, P.shaft1);
  if (shaft){
    ctx.beginPath(); ctx.moveTo(shaft[0].x,shaft[0].y); ctx.lineTo(shaft[1].x,shaft[1].y);
    ctx.lineTo(shaft[2].x,shaft[2].y); ctx.lineTo(shaft[3].x,shaft[3].y); ctx.closePath();
    const sg = ctx.createLinearGradient(shaft[0].x, 0, shaft[1].x, 0);
    /* lit edge follows the light direction */
    const litLeft = lv.x < 0;
    sg.addColorStop(0, litLeft ? stoneL : stoneD);
    sg.addColorStop(.42, stoneM);
    sg.addColorStop(1, litLeft ? stoneD : stoneL);
    ctx.fillStyle = sg; ctx.fill();
    /* flutes */
    ctx.strokeStyle = rgba('#0a0810',.5); ctx.lineWidth = 1;
    for (const f of [-0.5, 0, 0.5]){
      const a = project({x:px + P.shaft0*f, y:0.33, z:pz});
      const b = project({x:px + P.shaft1*f, y:1.00, z:pz});
      if (a&&b){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    /* gold bands up the shaft */
    for (const y of [0.44, 0.70]){
      const hw = lerp(P.shaft0, P.shaft1, (y-0.31)/0.71) * 1.10;
      fillBand(bandQuad(px,pz, y, y+0.035, hw, hw), goldL, goldD);
    }
  }

  /* --- capital / flare --- */
  fillBand(bandQuad(px,pz, 1.02, 1.14, P.shaft1, P.cap), stoneL, stoneM);
  fillBand(bandQuad(px,pz, 1.14, 1.175, P.cap*1.04, P.cap*1.04), goldL, goldM);

  /* --- fire bowl --- */
  fillBand(bandQuad(px,pz, 1.175, 1.40, P.cap, P.bowl), goldD, goldM);
  fillBand(bandQuad(px,pz, 1.40, P.top, P.bowl, P.rim), goldM, goldL);
  /* rim ellipse + hot interior */
  const c = project({x:px, y:P.top, z:pz});
  if (c){
    /* P.rim is the bowl's own radius in world units — a property of the pillar,
       not of the lattice, so it is NOT expressed against tileR(). */
    const R = ringPx(c, P.rim);
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, .42);
    /* bowl interior glow */
    const bg = ctx.createRadialGradient(0,0,0,0,0,R);
    bg.addColorStop(0, 'rgba(255,220,150,.95)');
    bg.addColorStop(.55, 'rgba(255,140,40,.6)');
    bg.addColorStop(1, 'rgba(120,40,10,.35)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill();
    /* gold rim */
    ctx.strokeStyle = goldL; ctx.lineWidth = Math.max(1.6, R*.14);
    ctx.beginPath(); ctx.arc(0,0,R*.99,0,7); ctx.stroke();
    ctx.strokeStyle = rgba('#f6dc95',.55); ctx.lineWidth = Math.max(1, R*.05);
    ctx.beginPath(); ctx.arc(0,0,R*.82,0,7); ctx.stroke();
    ctx.restore();
  }
  /* small gold brackets under the bowl */
  for (const s of [-1, 1]){
    const a = project({x:px + s*P.cap*0.95, y:1.10, z:pz});
    const b = project({x:px + s*P.bowl*1.02, y:1.34, z:pz});
    if (a&&b){
      ctx.strokeStyle = goldM; ctx.lineWidth = Math.max(1.4, (a.s||1)*.02);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(a.x + s*6, (a.y+b.y)/2, b.x, b.y); ctx.stroke();
    }
  }
  /* flickering light pool cast on the ground */
  const gb = project({x:px, y:0.01, z:pz});
  if (gb){
    const w = Math.abs((project({x:px+1, y:0.01, z:pz})||gb).x - gb.x);
    const flick = .17 + Math.sin(T*11 + px*3)*.045 + Math.sin(T*23.7 + pz)*.025;
    const lg = ctx.createRadialGradient(gb.x, gb.y, 0, gb.x, gb.y, w*2.6);
    lg.addColorStop(0, `rgba(255,150,60,${flick})`);
    lg.addColorStop(.5, `rgba(255,110,40,${flick*.42})`);
    lg.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.ellipse(gb.x, gb.y, w*2.6, w*1.1, 0, 0, 7); ctx.fill();
  }
  /* this pylon's flames + its projection beam */
  const bc = project({x:px, y:P.top, z:pz});
  if (bc) br._spr = { x:bc.x, fireY:bc.y, emitY:bc.y, s:ringPx(bc, P.rim)*2.6 };
  drawFlames(br);
  drawHoloBeam(br);
}

/* ══════════════════════════════════════════════════════════════════
   HOLOGRAM BEAM — each pillar projects a soft light cone onto the play
   field. Deliberately gentle: low opacity, slow breathing, feathered
   edges, drifting scan bands. It should read as ambient projection, not
   a spotlight — nothing here should ever clip to a hard edge.
   Tune with HOLO. (Three.js: a cone mesh with an additive, depth-write-off
   shader + a decal/projected texture for the floor pool. Keep the same
   alphas — they are the reason it settles instead of glaring.)
   ══════════════════════════════════════════════════════════════════ */
const HOLO = {
  emitFrac: 0.150,  /* projector height as a fraction from the sprite TOP   */
  frontOff: 0.30,   /* step the lens out along the beam, in PILLAR WIDTHS,  */
                    /* so the cone leaves the FRONT face, never the back     */
  inset:    0.34,   /* where the beam lands, as a fraction of the corner    */
  r0:       0.16,   /* beam radius at the lens, in pillar widths            */
  r1:       1.05,   /* beam radius on the floor                             */
  /* ⚠ Was 0.115. The four corner projectors lay big translucent wedges
     straight across the play field, and against the round-2 ground — where
     brightness now MEANS elevation — a wedge crossing a basin lifted it to
     the value of a plateau. Cutting the base opacity keeps the projection
     ambience (it is still clearly a beam) without letting it vote on how
     high a tile is. The cone geometry, breathing and scan bands are
     unchanged; only the master alpha moved. */
  alpha:    0.062,  /* base opacity — deliberately low                      */
  breathe:  0.030,
  period:   5.2,
  bands:    7,
  colA:  '#7fe6ff',
  colB:  '#8f7cff'
};
let holoIn = 0;      /* fades up on load so it settles in */

/* Emitter for one pillar: at the capital gem, pushed toward board centre so
   the cone visibly leaves the pillar's FRONT and never clips through it. */
function drawHoloBeam(br){
  if (holoIn <= 0.001) return;
  const S = br._spr; if (!S) return;
  const pulse = HOLO.alpha + Math.sin(T*(Math.PI*2/HOLO.period) + br.seed)*HOLO.breathe;
  const A = clamp(pulse, 0.04, 0.2) * holoIn;
  /* landing point is a real world position on the play field */
  const g = project({ x: br.x*HOLO.inset, y: 0.02, z: br.z*HOLO.inset });
  if (!g) return;
  /* lens sits on the PAINTED capital gem, then steps out along the beam so
     the cone leaves the pillar's front face instead of clipping through it */
  let o = { x: S.x, y: S.emitY, s: S.s };
  const ddx = g.x-o.x, ddy = g.y-o.y, dl = Math.hypot(ddx,ddy) || 1;
  o = { x: o.x + (ddx/dl)*S.s*HOLO.frontOff, y: o.y + (ddy/dl)*S.s*HOLO.frontOff, s: S.s };
  const dx = g.x-o.x, dy = g.y-o.y, L = Math.hypot(dx,dy) || 1;
  const nx = -dy/L, ny = dx/L;
  /* ⚠ A NEGATIVE RADIUS HERE FROZE THE ENTIRE BOARD, PERMANENTLY, AND THIS IS
     THE "it is freezing" REPORT. `g.s` is the projected scale at the beam's
     landing point, and project() hands back a NEGATIVE scale for a point that
     falls behind the camera plane — it only returns null for the points it
     rejects outright, so the `if (!g) return` above does not cover this. r1
     then goes negative and the floor pool's `arc(0,0,r1*1.3,…)` throws
     IndexSizeError. frame() does catch it, but it also latches `frameErr`,
     and a latched frameErr NEVER reschedules: one bad pylon on one frame and
     the battlefield is a still image for the rest of the match.
     Caught at r1 = -28.08, thrown the moment a defs swap re-ran the pylon
     pass — and the host re-posts defs on a 2Hz tick (_bbStagePushDefs), so
     this was reachable in an ordinary match, not just under a probe.
     A beam whose landing point is behind the camera has nothing to draw, so
     bail. The clamp stays as well, because "a radius cannot be negative" must
     not depend on one caller's arithmetic continuing to be right. */
  if (!(S.s > 0) || !(g.s > 0)) return;
  const r0 = Math.max(0, HOLO.r0 * S.s), r1 = Math.max(0, HOLO.r1 * g.s);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  /* the cone — feathered along its length, never a hard edge.
     ⚠ …except ACROSS its width, which it was: one quad with a lengthwise
     gradient has two hard side edges, and where a side edge crosses the sand
     it reads as a translucent rectangle laid on the ground. That is the
     flat-overlay look the BAR forbids, and because the edge is a step in
     VALUE it also argues with the elevation ramp the terrain now depends on.
     Three nested widths at falling alpha approximate a crosswise falloff
     without an offscreen canvas; the weights sum to 1 so the beam is exactly
     as bright as before down its centre line, and only its rim changed. */
  const CONE = [ [1.00, 0.40], [0.68, 0.34], [0.34, 0.26] ];
  for (let ci=0; ci<CONE.length; ci++){
    const wk = CONE[ci][0], ak = CONE[ci][1];
    const grad = ctx.createLinearGradient(o.x, o.y, g.x, g.y);
    grad.addColorStop(0,   rgba(HOLO.colA, A*1.25*ak));
    grad.addColorStop(.18, rgba(HOLO.colA, A*.85*ak));
    grad.addColorStop(.60, rgba(HOLO.colA, A*.42*ak));
    grad.addColorStop(1,   rgba(HOLO.colB, A*.12*ak));
    ctx.fillStyle = grad;
    const w0 = r0*wk, w1 = r1*wk;
    ctx.beginPath();
    ctx.moveTo(o.x + nx*w0, o.y + ny*w0);
    ctx.lineTo(o.x - nx*w0, o.y - ny*w0);
    ctx.lineTo(g.x - nx*w1, g.y - ny*w1);
    ctx.lineTo(g.x + nx*w1, g.y + ny*w1);
    ctx.closePath(); ctx.fill();
  }

  /* drifting scan bands */
  for (let i=0;i<HOLO.bands;i++){
    const t = (i/HOLO.bands + T*0.085) % 1;
    const fade = Math.sin(t*Math.PI);
    const t2 = Math.min(1, t + 0.035);
    const bw = lerp(r0,r1,t),  bx = lerp(o.x,g.x,t),  by = lerp(o.y,g.y,t);
    const bw2 = lerp(r0,r1,t2), bx2 = lerp(o.x,g.x,t2), by2 = lerp(o.y,g.y,t2);
    ctx.fillStyle = rgba(HOLO.colA, A*0.30*fade);
    ctx.beginPath();
    ctx.moveTo(bx + nx*bw,   by + ny*bw);
    ctx.lineTo(bx - nx*bw,   by - ny*bw);
    ctx.lineTo(bx2 - nx*bw2, by2 - ny*bw2);
    ctx.lineTo(bx2 + nx*bw2, by2 + ny*bw2);
    ctx.closePath(); ctx.fill();
  }

  /* projector lens on the pillar face */
  const lg = ctx.createRadialGradient(o.x,o.y,0, o.x,o.y, r0*5.5);
  lg.addColorStop(0,   rgba('#dffaff', A*2.6));
  lg.addColorStop(.35, rgba(HOLO.colA, A*1.1));
  lg.addColorStop(1,   rgba(HOLO.colA, 0));
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(o.x,o.y,r0*5.5,0,7); ctx.fill();

  /* floor pool + slow rings */
  ctx.save(); ctx.translate(g.x, g.y); ctx.scale(1, .44);
  const pg = ctx.createRadialGradient(0,0,0,0,0,r1*1.3);
  pg.addColorStop(0,   rgba(HOLO.colA, A*1.5));
  pg.addColorStop(.55, rgba(HOLO.colB, A*.55));
  pg.addColorStop(1,   rgba(HOLO.colB, 0));
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0,0,r1*1.3,0,7); ctx.fill();
  for (let i=0;i<3;i++){
    const rt = ((T*0.16) + i/3) % 1;
    ctx.strokeStyle = rgba(HOLO.colA, A*0.8*(1-rt));
    ctx.lineWidth = 1.6;
    /* belt and braces with the dt clamp in frame(): a radius must not be able
       to go negative even if some future caller feeds this a strange phase. */
    ctx.beginPath(); ctx.arc(0,0, Math.max(0, r1*(0.25 + rt*1.05)), 0, 7); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════
   FIRE — real flame: a live particle column per brazier. Each puff is
   born hot and white, rises + narrows, cools yellow → orange → red, then
   turns to smoke. Additive blending on the hot stages does the glow.
   (Three.js: port as a GPU particle system / instanced quads with the
   same colour ramp + the same lifetime curve.)
   ══════════════════════════════════════════════════════════════════ */
const FLAME_RAMP = [
  { p:0.00, c:[255,252,235], a:0.95 },   /* white core            */
  { p:0.16, c:[255,232,150], a:0.92 },   /* yellow                */
  { p:0.36, c:[255,170,52],  a:0.80 },   /* orange                */
  { p:0.58, c:[236,96,26],   a:0.55 },   /* deep orange           */
  { p:0.76, c:[150,44,18],   a:0.28 },   /* red, going out        */
  { p:1.00, c:[46,40,40],    a:0.00 }    /* smoke                 */
];
function flameColor(p){
  for (let i=0;i<FLAME_RAMP.length-1;i++){
    const A = FLAME_RAMP[i], B = FLAME_RAMP[i+1];
    if (p <= B.p){
      const k = (p - A.p)/(B.p - A.p || 1);
      return { r:Math.round(lerp(A.c[0],B.c[0],k)), g:Math.round(lerp(A.c[1],B.c[1],k)),
               b:Math.round(lerp(A.c[2],B.c[2],k)), a:lerp(A.a,B.a,k) };
    }
  }
  return { r:46, g:40, b:40, a:0 };
}
let braziers = [], flames = [], flameAcc = 0;
/* world height of a point given as a fraction from the sprite's TOP */
function artY(fracFromTop){
  return (PYLON_ART.anchorY - fracFromTop) * PYLON_ART.heightWorld;
}
/* Pillars must stand fully OUTSIDE the play grid. The sprite is a billboard
   whose base slab hangs BELOW its anchor, and on the far pillars that skirt
   projects DOWNWARD — i.e. straight onto the board — so the corners are
   pushed out by half the pillar width plus a gap, not just by the apron. */
function pylonClearance(){
  const halfW = PYLON_ART.img ? PYLON_ART.widthWorld*0.5 : 0.45;
  return CONFIG.wall + halfW + 0.22;
}
/* The four pylons used to sit at the apron's corners, ±(ext+clearance) in
   both axes. That was right while the board floated in the middle of the
   frame; now that it fills the frame, ±(ext.x+clearance) projects clean off
   the sides and the two NEAR pylons were simply not in the picture at all.
   A pylon is off the play grid when |x| ≥ ext.x+c OR |z| ≥ ext.z+c — not
   both — so holding z at the apron's lip and pulling x IN is legal, and it is
   the only move that keeps all four visible. One shared half-width for all
   four keeps them a rectangle, so they still read as a colonnade round the
   field instead of a scatter; the NEAR pair is the binding one (it projects
   widest), so testing that pair is enough. */
/* 🔴 THE OWNER ASKED FOR THE PILLARS AND THEIR FIRE GONE (2026-09-15, with a
   screenshot of one: carved column, gold banding, flame in the bowl).

   Switched off here rather than deleted, and the placement of the switch is the
   point. `braziers` is the ONE array both consumers iterate — the pylon draw
   and updateFlames() — so emptying it at the top of the seeder removes the
   columns AND stops the fire being simulated, rather than hiding sprites while
   particles keep burning over nothing. setPylonArt(null) would NOT have done
   this: the draw falls back to the procedural `PYLON` geometry when the art
   slot is empty, and the emitter anchors at PYLON.top regardless, so the art
   would go and four burning invisible columns would stay.

   ⚠ VERIFIED BEFORE TOUCHING IT, because the worry was reasonable: the pylons
   are NOT load-bearing for framing. applyFit() does not mention them (zero
   references in its body), seedBraziers() is always called AFTER applyFit()
   (see the resize listener), and pylonClearance() is called from nowhere else.
   They CONSUME boardExtent() and VIEW.box; they do not drive either. So the
   camera fit and the board's framing are unchanged by this.

   Everything below is kept intact — the half-width search, the all-or-nothing
   fallback, and the PYLON DESERT GRADE work — because this is a taste call the
   owner may reverse, and re-deriving that placement search from scratch would
   cost far more than the dead branch costs. Flip to true to bring them back. */
const PYLONS_ON = false;

function seedBraziers(){
  if (!PYLONS_ON){ braziers = []; flames = []; flameAcc = 0; return; }
  const c = pylonClearance();
  const ext = boardExtent();
  const tx = latticeCentreX();
  const hh = ext.z + c;
  const hw0 = ext.x + c;
  let hw = hw0;
  if (CAM && VIEW.box){
    const wHalf = (PYLON_ART.img ? PYLON_ART.widthWorld : 0.9) * 0.5;
    const tall  = PYLON_ART.img ? PYLON_ART.heightWorld : 1.4;
    const pad = 6;
    const lo = VIEW.box.l + pad, hi = VIEW.box.l + VIEW.box.w - pad;
    const top = VIEW.box.t + pad, bot = VIEW.box.t + VIEW.box.h - pad;
    const fits = w => {
      for (const zz of [hh, -hh]) for (const sgn of [-1, 1]){
        const a = project({ x:tx + sgn*w,         y:0,    z:zz });
        const c = project({ x:tx + sgn*w,         y:tall, z:zz });
        if (!a || !c) return false;
        /* 🎥 ringPx, not a projected world-X offset: the pillar's half-width in
           pixels must not shrink as the camera yaws (CONTRACT §2 Tier 2.1).
           This fit runs on every resize, and a resize can happen at any yaw. */
        const half = ringPx(a, wHalf);
        if (a.x - half < lo || a.x + half > hi) return false;
        if (c.y < top || a.y > bot) return false;
      }
      return true;
    };
    const STEPS = 48, floorW = ext.x*0.30;   /* never let a pair meet in the middle */
    let found = null;
    for (let i = 0; i <= STEPS && hw >= floorW; i++){
      if (fits(hw)){ found = hw; break; }
      hw -= hw0/STEPS;
    }
    /* All-or-nothing on purpose. If no half-width fits — which is what happens
       in the standalone/full-viewport framing, where the board already covers
       ~90% of the frame height and there is simply no room outside it — put
       them back on the apron corners rather than leaving them halfway in. A
       pylon parked at a third of the board's width is neither at a corner nor
       visible; the old placement is at least the one the art was drawn for. */
    hw = found === null ? hw0 : found;
  }
  const fireY = PYLON_ART.img ? artY(PYLON_ART.fireY) : PYLON.top;
  braziers = [ {x:tx-hw,z:-hh}, {x:tx+hw,z:-hh}, {x:tx+hw,z:hh}, {x:tx-hw,z:hh} ]
    .map((c2,i) => ({ x:c2.x, y:fireY + 0.02, z:c2.z, seed:i*2.7, id:i }));
}
/* ══════════════════════════════════════════════════════════════════
   🟥🟦 PLAYER PLATFORMS — the red dais left of the board, the blue one right.
   Owner, 2026-09-16: "Put the Red Platform on the left side on the outside and
   the blue on the outside of the right side. Make it where every time a unit is
   called from the hand the platform glow green. Red for player blue for AI. Red
   for player, Blue for Enemy in multiplayer — player that go first red, player
   that second blue."

   THE COLOUR RULE, because it is the part that is easy to get backwards:
     • COLOUR IS FIXED BY POSITION. Red is always the LEFT platform, blue always
       the RIGHT. Nothing here ever mirrors them.
     • What varies is WHO OWNS RED. Single player: the human is red. Multiplayer:
       whoever moves first is red — so a client that moved SECOND owns the BLUE
       platform on the RIGHT. The board knows neither the turn order nor whether
       this is multiplayer (it owns no rules), so the host says it in one boolean,
       `mineRed`, riding board:init and every board:units push. Missing → true,
       which is the single-player answer and the standalone demo's.
     Ownership is resolved at DRAW time (platformOwner), never baked into the
     seeded list, so a late `mineRed` needs no reseed and cannot desync.

   WHY SPRITES, NOT THE MODELS. The two .glb files are 59 MB and 1.3M triangles
   for two static props at a fixed camera, and this stage is a 2D painter with
   no depth buffer — it cannot draw a .glb at all. They are baked ORTHOGRAPHIC
   by .gauntlet/tabletop/glb2sprite.mjs (BOTH at yaw 0°, pitch 34°).
   🔴 YAW 0, RE-BAKED 2026-09-17. Owner: "the platforms — can you set them where
   they are straight and not curved". They were baked at ±35°, which turned each
   dais so its front edge ran diagonally across the frame and its long sides
   swept away from the viewer — the "curve". At yaw 0 both face the camera
   square-on, their front edges parallel to the board's own, and the pair reads
   as a matched set instead of two props aimed at different corners. The numbers
   below were re-measured from THESE bakes; a re-bake at another angle has to
   re-measure all three (span, anchorY, opaque) or the dais floats off the
   table. The sources are RedPlatform.glb / Blueplatform.glb.
   Every number in PLATFORM_ART is MEASURED, not chosen:
     span     the world width the whole square PNG covers, in MODEL units. The
              bake fits its frustum to max(projW, projH)·1.04, and projW is
              w·cos35 + d·sin35 off the model's bbox: red 1.50/1.91 → 2.325 →
              2.423; blue 1.60/1.91 → 2.406 → 2.502. The PNG is square and ortho,
              so its pixel height equals its pixel width.

              centres the bbox, so the bottom-face centre sits h/2·cos34 below
              the middle: red 0.29·0.829/2.423 = 0.0992, blue 0.30·0.829/2.502 =
              0.0994 → 0.599 both. Anchoring on this, not on the PNG's bottom, is
              what stands the dais ON the table instead of hanging it off it.

              fractions — .gauntlet/tabletop/_plat-alpha.mjs, which runs a
              synthetic negative control first. The layout clears the frame with
              THIS rect, not the PNG square: the square is ~10% empty per side
              and using it would push both platforms needlessly far out.

   ⚠ THE PILLARS ARE NOT REVIVED. PYLONS_ON stays false; this is its own prop
   with its own list. It reuses only the IDEA of seedBraziers — world-space
   props placed from boardExtent() after the fit, depth-sorted with the units.

   🔴 NOT A FRAMING INPUT, AND THAT IS LOAD-BEARING. applyFit() / fitCamera()
   never read PLATFORMS, and seedPlatforms() only ever runs AFTER applyFit()
   (buildStage and the resize listener). The platforms CONSUME the fitted camera
   and VIEW.box; they drive neither. A prop that fed the fit would re-frame every
   battle to make room for itself, which is a far bigger change than was asked.
   When there is not enough room they SHRINK — they never ask the camera for
   more.
   ══════════════════════════════════════════════════════════════════ */
const PLATFORM_ART = {
  red:  { src:'../assets/board/platforms/red-platform.png',  span:1.6086,
          opaque:{ l:0.0332, t:0.0693, r:0.9668, b:0.9805 }, img:null, cache:null },
  blue: { src:'../assets/board/platforms/blue-platform.png', span:1.6595,
          opaque:{ l:0.0186, t:0.0967, r:0.9814, b:0.9658 }, img:null, cache:null },
  /* 0.6485 (red) and 0.6505 (blue) — one number for both, as before: the two
     differ by 0.002 of a span, well under a pixel at any drawn size, and a
     per-side anchor would invite the two daises to sit at different heights. */
  anchorY: 0.6495
};
/* Layout knobs. `scale` is world units per MODEL unit and is searched from
   max down to min — the largest dais that clears the frame AND stays inside the
   host box wins. 1.6 is ~2.4 × 3 hexes of red footprint, big enough to read as
   furniture beside a 15-wide board without competing with it; below 0.7 it is a
   smudge and there is no point pretending otherwise.
   `zFracs` are the depths tried, as fractions of the lattice half-depth: level
   with the board's middle first (what "on the left side" means), then pulled
   back — the frame converges toward the far edge, so there is more table
   there. Each depth gets its own largest fitting scale and the pair is scored
   scale × (1 − backPenalty·|zFrac|): with 0.5, a dais pulled back to −0.4 has
   to come out 25% BIGGER than the centred one to win. Taking the biggest scale
   anywhere (the first version) sent both daises to the back of the table in
   the standalone view even though a perfectly good centred pair fitted. */
const PLATFORM_LAYOUT = {

  zFracs: [0, -0.2, -0.4],
  backPenalty: 0.5,
  gapPx: 10,         /* clear air between the dais and the frame, screen px */
  padPx: 6,           /* and between the dais and the host box edge          */
  reachMax: 8         /* never search further than this past the frame, world */
};
/* The glow: "a short, readable pulse" that must return to rest. A fast rise so
   the play reads the instant it happens, one soft throb, then a decay that hits
   EXACTLY zero at `dur` — platformGlowAmt returns 0 past it, and a zero skips
   every glow draw, so the rest state is pixel-identical to a platform that has
   never glowed. Driven by T (the frame clock, clamped dt, never backwards), so
   a backgrounded tab cannot strand a platform lit. */
const PLATFORM_GLOW = { dur: 1.6, rise: 0.14, throbHz: 2.2, col: '#3dff7e' };
const PLATFORMS = {
  on: true,
  mineRed: true,
  list: [],
  glowAt: { mine: null, foe: null },
  fit: null           /* what the last seed decided, for __bbFitProbe */
};

/* Whose dais is this colour. The only place the colour rule is applied. */
function platformOwner(color){
  return (color === 'red') === PLATFORMS.mineRed ? 'mine' : 'foe';
}
/* Host signal (board:platformGlow) and the demo's own hand play. Anything that
   is not literally 'mine' or 'foe' is IGNORED rather than defaulted: a glow on
   the wrong dais says "they played a card" when nobody did, which is worse than
   a missing glow. */
function platformGlow(side){
  if (side !== 'mine' && side !== 'foe') return false;
  PLATFORMS.glowAt[side] = T;
  return true;
}
function platformGlowAmt(owner){
  const t0 = PLATFORMS.glowAt[owner];
  if (t0 == null) return 0;
  const G = PLATFORM_GLOW, t = T - t0;
  if (!(t >= 0) || t >= G.dur){ if (t >= G.dur) PLATFORMS.glowAt[owner] = null; return 0; }
  const env = t < G.rise ? t / G.rise : Math.pow(1 - (t - G.rise) / (G.dur - G.rise), 1.6);
  return env * (0.8 + 0.2 * Math.cos(t * Math.PI * 2 * G.throbHz));

/* The opaque rect of a dais on screen, for a foot point and a scale. */
function platformRect(color, wx, wz, scale){
  const a = PLATFORM_ART[color];
  const base = project({ x:wx, y:0, z:wz });
  if (!base) return null;
  const wpx = ringPx(base, scale * a.span);
  const left = base.x - wpx/2, top = base.y - PLATFORM_ART.anchorY * wpx, o = a.opaque;
  return { x0: left + o.l*wpx, x1: left + o.r*wpx, y0: top + o.t*wpx, y1: top + o.b*wpx };

/* The frame's outer silhouette on one side, as screen x at a screen row. The
   kerb's top edge (out @ LIP_H) and its splayed base (foot @ LIP_FOOT, the
   height drawLipEdge paints the wall down to) are both straight world lines,
   so they are straight screen lines too; the dais must clear whichever of the
   two reaches further toward it. Rows beyond a segment's ends are clamped onto
   it — conservative, never optimistic.
   ⚠ NOT the crevice ring (L.shade). The first version kept clear of that too
   and it cost 0.6 world of table per side for nothing: the crevice is a soft
   contact shadow lying ON the table, and a dais standing in the kerb's shadow
   is not covering the frame. The table itself is y = 0 (vista.js: "the shadow
   lies ON the table"), which is where the daises stand. */
function platformFrameX(L, sgn, y){
  const segs = sgn < 0
    ? [ [L.out[0], L.out[3], LIP_H], [L.foot[0], L.foot[3], LIP_FOOT] ]
    : [ [L.out[1], L.out[2], LIP_H], [L.foot[1], L.foot[2], LIP_FOOT] ];
  let best = null;
  for (const [a, b, h] of segs){
    const pa = project({ x:a.x, y:h, z:a.z }), pb = project({ x:b.x, y:h, z:b.z });
    if (!pa || !pb) continue;
    const t = Math.abs(pb.y - pa.y) < 1e-6 ? 0 : clamp((y - pa.y) / (pb.y - pa.y), 0, 1);
    const x = pa.x + (pb.x - pa.x) * t;

}
/* One side, one depth, one scale: the smallest step out from the frame that
   clears it, and whether that position also sits inside the host box. */
function platformPlace(L, sgn, color, wz, scale){
  const LY = PLATFORM_LAYOUT, box = VIEW.box;
  const edge = latticeCentreX() + sgn * (boardExtent().x + LIP_W + LIP_BATTER);
  const halfW = scale * PLATFORM_ART[color].span * 0.5;
  for (let o = 0; o <= LY.reachMax; o += 0.05){
    const wx = edge + sgn * (halfW * 0.5 + o);
    const r = platformRect(color, wx, wz, scale);
    if (!r) return null;
    const fx0 = platformFrameX(L, sgn, r.y0), fx1 = platformFrameX(L, sgn, r.y1);
    if (fx0 === null || fx1 === null) return null;
    const clear = sgn < 0 ? r.x1 + LY.gapPx <= Math.min(fx0, fx1)
                          : r.x0 - LY.gapPx >= Math.max(fx0, fx1);
    if (!clear) continue;

/* Called only AFTER applyFit() — see the 🔴 note above. Same scale and depth

   if no scale fits both, they go in at the minimum scale still CLEAR OF THE
   FRAME, and are allowed to run off the host edge. Covering the play field is
   never an option; being partly cropped is the lesser failure, and the fit

function seedPlatforms(){
  PLATFORMS.list = []; PLATFORMS.fit = null;
  if (!PLATFORMS.on || !CAM || !VIEW.box) return;
  /* 🎥 MEASURED FROM THE HOME VIEW, WHATEVER THE CAMERA IS DOING. The resize
     listener reseeds at any yaw, and "left of the frame" is only the LEFT of
     the frame at yaw 0 — at 90° the search would be asking which world x keeps
     a dais clear of an edge that is now the near one, and the answer would move
     the daises every time a yawed player resized the window. So the search runs
     against the un-yawed, un-panned camera and the player's view is put back
     afterwards. camApply() is pure over CAMERA/CAM_BASE (it only rebuilds
     CONFIG.camera and CAM, and marks the anchor dirty), so the round trip is
     exact. The placement is WORLD space; the free camera then orbits it like
     any other prop. */
  const yaw0 = CAMERA.yaw, px0 = CAMERA.pan.x, pz0 = CAMERA.pan.z;
  const away = Math.abs(yaw0) > 1e-6 || Math.abs(px0) > 1e-6 || Math.abs(pz0) > 1e-6;
  if (away){ CAMERA.yaw = 0; CAMERA.pan.x = 0; CAMERA.pan.z = 0; camApply(); }

  finally { if (away){ CAMERA.yaw = yaw0; CAMERA.pan.x = px0; CAMERA.pan.z = pz0; camApply(); } }
}
function seedPlatformsAtHome(){
  const LY = PLATFORM_LAYOUT, ez = boardExtent().z;
  const lip = lipRect();      /* once per seed — the search asks it thousands of times */
  const tryAt = (scale, wz, needInside) => {
    const L = platformPlace(lip, -1, 'red', wz, scale), R = platformPlace(lip, 1, 'blue', wz, scale);
    if (!L || !R) return null;
    if (needInside && !(L.inside && R.inside)) return null;
    return { L, R };

  let got = null, scale = LY.scaleMin, zf = LY.zFracs[0], bestScore = -1;

    const n = Math.round((LY.scaleMax - LY.scaleMin) / LY.scaleStep);
    for (let i = 0; i <= n; i++){
      const sc = LY.scaleMax - i * LY.scaleStep;
      const g = tryAt(sc, f * ez, true);
      if (!g) continue;
      const score = sc * (1 - LY.backPenalty * Math.abs(f));
      if (score > bestScore){ bestScore = score; got = g; scale = sc; zf = f; }
      break;                  /* the largest scale at this depth is all we need */
    }

  if (!got){ scale = LY.scaleMin; zf = LY.zFracs[0]; got = tryAt(scale, 0, false); }
  if (!got) return;

    { color:'red',  x:got.L.x, z:got.L.z, scale },
    { color:'blue', x:got.R.x, z:got.R.z, scale }

/* The scaled sprite, its green silhouette and a blurred halo, cached per size
   bucket. Drawing the 1024² PNG straight into a ~150 px rect every frame would
   resample 1M texels per dais per frame (§8.9: the frame does not regress);
   this resamples once per bucket, at high quality, and the per-frame cost is
   three small blits. Buckets are 2^(1/4) apart so a zoom rebuilds a handful of
   times, not every frame, and the residual stretch is under 10%. */
function platformSprite(color, devPx){
  const a = PLATFORM_ART[color];
  if (!a.img){
    const im = new Image();
    im.decoding = 'async';
    im.src = a.src;
    a.img = im;
    return null;
  }
  const im = a.img;
  if (!im.complete || !im.naturalWidth) return null;
  const size = clamp(Math.round(Math.pow(2, Math.round(Math.log2(Math.max(16, devPx)) * 4) / 4)), 16, 1024);
  if (a.cache && a.cache.size === size) return a.cache;
  const mk = n => { const c = document.createElement('canvas'); c.width = c.height = n; return c; };

     what spills past the silhouette is ever seen — a halo the size of the
     sprite is hidden by it entirely, which round 1 measured as a 0.6-point
     move on a metric the over-drawn version moved by 19. */
  const pad = Math.ceil(size * 0.2);
  const halo = mk(size + pad * 2), hg = halo.getContext('2d');
  /* ctx.filter is absent on some engines; without it the halo is simply the
     swollen silhouette, which still reads as green — degrade, never throw. */
  if ('filter' in hg) hg.filter = 'blur(' + Math.max(2, Math.round(size * 0.05)) + 'px)';
  const sw = size * 1.18, so = pad - (sw - size) / 2;
  hg.drawImage(sil, so, so, sw, sw);
  hg.drawImage(sil, so, so, sw, sw);     /* twice: a blur thins the edge alpha */
  a.cache = { size, base, sil, halo, pad };
  return a.cache;
}
function drawPlatform(pl){
  const a = PLATFORM_ART[pl.color];

  if (!base) return;
  const wpx = ringPx(base, pl.scale * a.span);
  if (!(wpx > 4)) return;
  const spr = platformSprite(pl.color, wpx * DPR);
  shadowEllipse(foot, pl.scale * a.span * 0.34, .6);
  if (!spr) return;
  const left = base.x - wpx/2, top = base.y - PLATFORM_ART.anchorY * wpx;
  const k = platformGlowAmt(platformOwner(pl.color));
  if (k > 0){
    /* the pool of light on the table under it — squashed to the ground plane */
    const R = wpx * 0.75;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(base.x, base.y); ctx.scale(1, 0.42);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, rgba(PLATFORM_GLOW.col, 0.55 * k));
    g.addColorStop(1, rgba(PLATFORM_GLOW.col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
    /* the aura goes UNDER the dais, so it radiates from the silhouette's edge.
       Drawn over it (the first version) the green replaced the red outright for
       the length of the pulse — the glow read, but so did "the red platform
       turned into a green one", which is the colour rule briefly lying. Under it
       and the same size, it could not be seen at all — see platformSprite. */
    const s = wpx / spr.size, p = spr.pad * s;
    ctx.globalAlpha = Math.min(1, k);
    ctx.drawImage(spr.halo, left - p, top - p, wpx + p * 2, wpx + p * 2);
    ctx.drawImage(spr.halo, left - p, top - p, wpx + p * 2, wpx + p * 2);
    ctx.restore();
  }
  ctx.drawImage(spr.base, left, top, wpx, wpx);
  if (k > 0){
    /* …and the body itself lit. TWO passes, because one cannot do it:
       'lighter' alone ADDS green to red and the sum is orange (measured: the
       greenness metric moved 2 points where the over-drawn halo moved 19), so
       the body is first MIXED toward green (source-over), then brightened. At
       the peak it reads green; the red trim is still under it, and it is fully
       red again 1.6 s later. */
    ctx.save();
    ctx.globalAlpha = Math.min(1, 0.5 * k);
    ctx.drawImage(spr.sil, left, top, wpx, wpx);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(1, 0.3 * k);
    ctx.drawImage(spr.sil, left, top, wpx, wpx);
    ctx.restore();

}
/* read-only probe for the gates: where they are, who owns which, glow level */
window.__bbPlatforms = () => ({
  mineRed: PLATFORMS.mineRed, fit: PLATFORMS.fit,
  list: PLATFORMS.list.map(pl => {
    const r = platformRect(pl.color, pl.x, pl.z, pl.scale);

       glyph a judge called out as the loudest non-reference element in the
       frame, floating over the diorama rather than standing in it. Every point
       below is a WORLD point on the tile's own top face, projected: the trestle

       tile's own elevation and is lit from the same vector as the terrain.

    const dx = Math.cos(ang), dz = Math.sin(ang);
