     the fog. Columns are drawn low to high so a taller mesa's rim correctly
     overlaps its shorter neighbour's. */
  {
    const far = [];
    for (let x=0; x<cols; x++) far.push([x, tileElev(x,0)]);
    far.sort((a,b) => a[1] - b[1]);                 /* low first, high last */
    const ph1 = hfStrHash(MAP.id + '#rim', 1) * 6.283;
    const ph2 = hfStrHash(MAP.id + '#rim', 2) * 6.283;
    const ph3 = hfStrHash(MAP.id + '#rim', 3) * 6.283;
    /* ⚠ The high harmonics carry most of the amplitude on purpose. A first
       cut weighted the LOW ones and the rim came out as one smooth sine
       across the whole board — a wavy straight line is still a drawn line.
       Rock breaks at every scale, so 4.7 and 9.3 rad/unit get as much of the
       budget as 1.3, and a per-sample jitter chips the margin on top. */
    const rimD = (wx) => {
      const n = Math.sin(wx*1.3 + ph1)*0.34 + Math.sin(wx*4.7 + ph2)*0.36
              + Math.sin(wx*9.3 + ph3)*0.24;
      const env = 0.48 + 0.52*Math.sin(wx*0.53 + ph2*0.7);
      return clamp((0.34 + n*0.62) * env, 0.0, 0.95);
    };
    const INSET = 0.30;                    /* how far inside the row it starts */
    for (const [x, yT] of far){
      /* the row's OWN material, as the tile loop computed it — recomputing it
         here would be a second source of truth for the same tile */
      const M = mat[x+',0']; if (!M) continue;
      const N = 16, inner = [], outer = [];
      for (let k=0;k<=N;k++){
        const u = x - 0.5 + k/N;
        const pi = project(gw(u, -0.5 + INSET, yT));
        const jit = (_sHash(x*29 + k, 17, 41) - 0.5) * 0.13;
        const po = project(gw(u, -0.5 - Math.max(0, rimD(u) + jit), yT));
        if (pi && po){ inner.push(pi); outer.push(po); }
      }
      if (inner.length < 3) continue;
      g.beginPath();
      g.moveTo(inner[0].x, inner[0].y);
      for (let k=1;k<inner.length;k++) g.lineTo(inner[k].x, inner[k].y);
      for (let k=outer.length-1;k>=0;k--) g.lineTo(outer[k].x, outer[k].y);
      g.closePath();
      const ci = inner[(inner.length/2)|0], co = outer[(outer.length/2)|0];
      const rg = g.createLinearGradient(ci.x, ci.y, co.x, co.y);
      /* invisible where it lands on the tile, this tile's own surface across
         the old boundary, and the vista's fog by the time it reaches the sky */
      /* ⚠ THE HAZE THIS RIM FADES INTO IS WARMED FIRST. LIGHT.fog is the
         vista's atmospheric tint and it is free to be a cool slate; mixed
         straight into the rim it turned the one piece of rock on the skyline
         neutral blue-grey while the sand two tiles in front of it was ochre —
         the "far rock is grey while the near rock is ochre" split, reproduced
         inside the terrain layer. Distance desaturates and lifts; it does not
         change hue family. So the fog gets 30% of the key before it is used
         here, which keeps the rim on the ground's own hue axis whatever the
         vista does with its sky. */
      const hz = mixHexRaw(LIGHT.fog, LIGHT.key, 0.30);
      /* ⚠ WAVE 5 — THE STRIP MUST NOT LIFT THE TILE IT STARTS INSIDE.
         It begins INSET (0.3 of a tile) inside the far row on purpose — that
         is what stops a terminator forming on the row's far edge — but it used
         to start hazing immediately, at 0.80 alpha of `M.base + 10% haze` by
         the 30% mark. On this map that put ~a third of every row-0 top face
         under a pale wash and lifted the whole row: measured, 7,0 read 133.6
         against 111.7 on 7,1 at the SAME level, and 6,0 148.1 against 6,1
         131.4 — the "per-row far-field brightening" the critic named, and the
         two largest same-level neighbour steps on the board.
         `fE` is where this gradient crosses the tile's own far edge, so the
         part INSIDE the tile is now painted in the tile's own base with no
         haze in it at all — it covers without changing the value — and every
         gram of haze is spent beyond the boundary, where there is no tile to
         lift. The seam stays buried; the row stops glowing. */
      /* ⚠ AND `M.base` IS NOT WHAT THE FACE ACTUALLY MEASURES. base is the
         tile's pre-pass target; by the time the seams, the bevel falloff, the
         key wash and the grain have gone over it the face sits ~8% below that.
         Painting raw base over the far third of a row-0 tile therefore still
         lifted the row — after the haze was moved outside the boundary, rows 0
         and 1 were STILL 12-17 luma apart at the same level. Mixing a third of
         M.shd in lands the strip on what the face is really at, and the alpha
         inside the tile is held down as well: the strip only has to be opaque
         by the time it crosses the edge, not before it. */
      const fE = clamp(INSET / (INSET + Math.max(0.06, rimD(x))), 0.08, 0.92);
      /* ⚠ Tried and REVERTED: mixing LIGHT.fog into this colour to "match" the
         aerial wash. It cannot help — the tone lock measures the FINISHED bake,
         strip included, so whatever this pass does to a row-0 face is already
         inside the value the loop balances. Measured, it made the same-level
         neighbour spread slightly worse (max 16.3 -> 16.8). Leave it alone. */
      const inC = mixHexRaw(M.base, M.shd, 0.30);
      rg.addColorStop(0,                  rgba(inC, 0));
      rg.addColorStop(fE*0.70,            rgba(inC, 0.20));
      rg.addColorStop(fE,                 rgba(inC, 0.72));
      rg.addColorStop(fE + (1-fE)*0.30,   rgba(mixHexRaw(inC, hz, 0.18), 0.94));
      rg.addColorStop(fE + (1-fE)*0.72,   rgba(mixHexRaw(M.base, hz, 0.46), 0.62));
      rg.addColorStop(1,                  rgba(mixHexRaw(M.base, hz, 0.72), 0.06));
      g.fillStyle = rg; g.fill();
      /* a broken darker lip just under the outer margin: a rim is an edge of
         rock, and without it the strip reads as a flat cut-out of paper */
      g.save(); g.clip();
      for (let k=0;k<outer.length-1;k++){
        if (_sHash(x*13+k, 7, 33) < 0.34) continue;   /* broken, not continuous */
        g.strokeStyle = rgba(mixHexRaw(M.deep, mixHexRaw(LIGHT.fog, LIGHT.key, 0.30), 0.42),
                             0.10 + _sHash(x*13+k, 9, 34)*0.14);
        g.lineWidth = 1.0 + _sHash(x*13+k, 11, 35)*2.0;
        g.beginPath();
        g.moveTo(outer[k].x, outer[k].y + 1.5);
        g.lineTo(outer[k+1].x, outer[k+1].y + 1.5);
        g.stroke();
      }
      g.restore();
    }
  }

  /* ── 3c. GRAIN — THE FIELD MUST HAVE MATERIAL AT MORE THAN ONE SCALE ──
     ⚠ WAVE 3: "a regular 1px crosshatch dither covers the entire field at one
     constant scale — wallpaper, not material."
     That crosshatch is not something this file draws. It is Skia's ORDERED
     DITHER on the large gradients the whole bake is built from, it is applied
     on a fixed lattice in DEVICE space, and canvas-2D exposes no way to turn
     it off — which is why five rounds of changing what we draw never touched
     it. The only move available is to put something louder and less regular on
     top, which is also what a real surface has.
     One deterministic noise tile carries a fine octave AND a bilinear coarse
     octave, and it is laid down TWICE at different scales and rotations so its
     own 256px period cannot line up with itself or with the dither lattice.
     `source-atop` restricts it to pixels the terrain has already painted —
     ground, cliff faces, apron, talus and the far rim all get it, and nothing
     spills onto the transparent surround the vista shows through.
     Amplitude is deliberately small: toneMeasure() reads a 5x5 patch median at
     five points per tile, so grain at this scale averages out of the elevation
     ramp instead of arguing with it (verified — the level means moved <0.4).
     The tile is cached on TERRAIN.grain: it depends on nothing but its own
     hash, so it survives every re-bake, and building it is ~65k hash calls. */
  {
    const NG = 256;
    /* `window.__DBG_NOGRAIN` — fourth inert debug switch, same contract as the
       other three: nothing sets it, it exists so the grain's look and its bake
       cost can both be A/B'd from the console. */
    let NC = window.__DBG_NOGRAIN ? null : TERRAIN.grain;
    if (!NC && !window.__DBG_NOGRAIN){
      try {
        NC = TERRAIN.grain = document.createElement('canvas');
        NC.width = NC.height = NG;
        const ng = NC.getContext('2d');
        const im = ng.createImageData(NG, NG), d = im.data;
        /* coarse octave on a 32x32 lattice, bilinear so it is blobs and not
           blocks — blocks would be a second regular grid, i.e. the disease */
        const CO = 32, coarse = new Float32Array(CO*CO);
        for (let i=0;i<CO*CO;i++) coarse[i] = _sHash(i%CO, (i/CO)|0, 7);
        for (let y=0;y<NG;y++) for (let x=0;x<NG;x++){
          const cx2 = (x/NG)*CO, cy2 = (y/NG)*CO;
          const x0 = cx2|0, y0 = cy2|0, fx = cx2-x0, fy = cy2-y0;
          const c00 = coarse[(y0%CO)*CO + (x0%CO)],       c10 = coarse[(y0%CO)*CO + ((x0+1)%CO)];
          const c01 = coarse[((y0+1)%CO)*CO + (x0%CO)],   c11 = coarse[((y0+1)%CO)*CO + ((x0+1)%CO)];
          const cv = (c00*(1-fx)+c10*fx)*(1-fy) + (c01*(1-fx)+c11*fx)*fy;
          const s = (_sHash(x, y, 13)-0.5)*0.58 + (cv-0.5)*0.42;
          const k = (y*NG + x)*4;
          /* warm highlight / warm shadow, never neutral: a grey speckle over
             ochre sand desaturates it and the BAR asks for warm midtones */
          if (s > 0){ d[k]=255; d[k+1]=246; d[k+2]=226; }
          else      { d[k]=30;  d[k+1]=22;  d[k+2]=14;  }
          d[k+3] = Math.min(255, Math.abs(s) * 2 * 255 * 0.155);
        }
        ng.putImageData(im, 0, 0);
      } catch (e) { NC = TERRAIN.grain = null; }
    }
    const pat = NC ? g.createPattern(NC, 'repeat') : null;
    if (pat){
      g.save();
      /* ⚠ DEVICE PIXELS, AND NEAREST-NEIGHBOUR. Both matter and both were got
         wrong first time. Drawn through the DPR transform with the default
         imageSmoothingEnabled, the tile is BILINEARLY RESAMPLED — which turns
         per-texel noise into smooth ramps, and smooth ramps are exactly what
         Skia dithers. Measured: that version RAISED the ordered-dither share
         of the field's high-frequency energy from 0.573 to 0.588, i.e. it fed
         the disease. At identity transform with smoothing off, one texel is
         one device pixel, the grain has flat spectrum, and the share falls. */
      g.setTransform(1,0,0,1,0,0);
      g.imageSmoothingEnabled = false;
      g.globalCompositeOperation = 'source-atop';
      g.fillStyle = pat;
      g.fillRect(0, 0, pw, ph);
      /* second laydown: ~3x coarser and rotated 0.62 rad, so the two periods
         are mutually irrational on both axes and no repeat is findable */
      g.globalAlpha = 0.62;
      g.translate(pw*0.5, ph*0.5); g.rotate(0.62); g.scale(3.1, 2.7);
      g.translate(-pw*0.5, -ph*0.5);
      g.fillStyle = pat;
      g.fillRect(-pw, -ph, pw*3, ph*3);
      g.restore();
      g.setTransform(DPR,0,0,DPR,0,0);
    }
  }

  TERRAIN.poly = poly; TERRAIN.mat = mat; TERRAIN.walls = walls;
  /* ── 4. close the loop. Measure what we just drew and, if a tile centre is
     off its level's target by more than ~2.5 luma, ask for one more bake with
     a corrected per-tile offset. See the TONE block for why this is measured
     rather than predicted. Read the result with __bbDebug.tone(). */
  toneMeasure(cvT, poly);
  /* cost of one bake, for the budget check — see __bbDebug.terrain() */
  TERRAIN.ms = ((performance && performance.now) ? performance.now() : 0) - _t0;
  TERRAIN.bakes++;
}

/* ══════════════════════════════════════════════════════════════════════════
   drawBoard — blit the baked terrain, then the live tile states on top.
   ══════════════════════════════════════════════════════════════════════════ */
function drawBoard(api){
  /* A bake failure must not latch frameErr — that freezes the board on a red
     error card for the rest of the session. Fall back to the LAST GOOD bake. */
  try { bakeTerrain(); } catch (e) { try { console.warn('terrain bake failed', e); } catch (_) {} }
  if (TERRAIN.cv && TERRAIN.cv.width) ctx.drawImage(TERRAIN.cv, 0, 0, W, H);

  /* 🎯 tile states. The tilefx module paints these as soft emissive pools
     INSIDE the ground; the block below is the fallback that ships if the
     module has not attached yet (or 404s) — the original hard fill+stroke,
     kept deliberately so a missing module degrades to the old look rather
     than to an unplayable board with no legal-target highlight at all. */
  if (window.BBX.tilefx && window.BBX.tilefx.drawStates){
    try { window.BBX.tilefx.drawStates(api || buildApi(0)); } catch (e) {}
    return;
  }
  for (let z=0; z<MAP.rows; z++){
    for (let x=0; x<MAP.cols; x++){
      const P = tilePoly(x,z,0.02); if (!P) continue;
      const pk = x + ',' + z;
      let paintCol = null;
      if (PAINT.attack.has(pk))     paintCol = '#ff5a4a';
      else if (PAINT.move.has(pk))  paintCol = '#4fd0ff';
      else if (PAINT.place.has(pk)) paintCol = '#7fe89f';
      else if (PAINT.swap.has(pk))  paintCol = '#e0b64a';
      if (paintCol){
        const pulse = 0.16 + Math.sin(T * 3 + (x + z) * 0.6) * 0.05;
        pathPoly(P); ctx.fillStyle = rgba(paintCol, pulse + 0.16); ctx.fill();
        pathPoly(P); ctx.strokeStyle = rgba(paintCol, 0.85); ctx.lineWidth = 2; ctx.stroke();
      }
      if (PAINT.sel && PAINT.sel.x === x && PAINT.sel.z === z){
        pathPoly(P); ctx.strokeStyle = rgba('#f6dc95', 0.95); ctx.lineWidth = 3; ctx.stroke();
      }
      if (hoverTile && hoverTile.x===x && hoverTile.z===z){
        pathPoly(P); ctx.fillStyle = rgba('#f6dc95', .12); ctx.fill();
        ctx.strokeStyle = rgba('#f6dc95',.9); ctx.lineWidth = 2; ctx.stroke();
      }
      if (focus && focus.x===x && focus.z===z){
        pathPoly(P); ctx.strokeStyle = rgba('#7fe89f',.9); ctx.lineWidth = 2.4; ctx.stroke();
      }
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   🔌 buildApi — the object every stage hook is handed, rebuilt per frame.
   Three sibling modules are coded against these key names verbatim: do not
   rename anything here. `g` overrides the target context (the terrain bake
   passes its offscreen canvas).
   ══════════════════════════════════════════════════════════════════════════ */
/* 🌵 dressing rebuild trigger. build() is called once on boot and again
   whenever the map identity changes (board:init / board:map) OR the module
   attaches late — module scripts are deferred, so on a cold load the first
   frames run before window.BBX.dressing exists and the boot-time build() call
   is a no-op. Keying on the module reference catches that. */
let _dressKey = '', _dressRef = null;
function syncDressing(api){
  const d = window.BBX.dressing;
  if (!d || !d.build) return;
  const key = [MAP.id, MAP.cols, MAP.rows, HF.key].join('|');
  if (key === _dressKey && d === _dressRef) return;
  _dressKey = key; _dressRef = d;
  try { d.build(api || buildApi(0)); } catch (e) {}
}

function buildApi(dt, g){
  return {
    ctx: g || ctx, W, H, T, dt: dt || 0,
    MAP, LIGHT, VIEW, CONFIG,
    project, gw, pathPoly, tileAt, tileElev, tilePoly, elevAt,
    /* ⚠ `mixHex` here is the HEX-returning mixer (mixHexRaw), not the legacy
       rgba()-string one. Modules compose colours — rgba(mixHex(a,b,t), .4) —
       and an 'rgb(…)' string fed back into rgba() parses to NaN, which canvas
       silently drops on fillStyle and THROWS on addColorStop. Hex composes. */
    rgba, mixHex: mixHexRaw, clamp,
    hash: _sHash,
    lightVector,
    paint: PAINT,
    /* embedded, hover arrives as board:pointer -> focusTile(), so `focus` is
       the live hovered tile; the local canvas path uses hoverTile. */
    hover: hoverTile || focus,
    surfaces: SURFACES,
    ground: GROUND, backdrop: BACKDROP, locations: LOCATIONS,
    time: BATTLE.timeOfDay,
    /* 🌅 THE LIGHT LERP, PUBLISHED. See lightAtK. `id` is what tells the vista
       that a SECOND setTimeOfDay landed mid-transition and its plate ladder is
       now baked for a journey nobody is taking any more; without it a rapid
       dawn→day→night would cross-fade toward the wrong sky. null whenever the
       rig is steady, which is the only state the module had before. */
    lightLerp: lightLerp ? { k: clamp(lightLerp.t, 0, 1), dur: lightLerp.dur, id: lightLerp.id } : null,
    lightAt: lightAtK
  };
}

/* ══════════════════════════════════════════════════════════════════
   BOARD EVENTS  ── FOR CLAUDE CODE ──
   Houses, wrecked cars and the like are NOT scenery in this game — they
   are EVENTS that occupy a tile until they are resolved. The board only
   RENDERS them; the game's event system owns their behaviour.

   WIRE THESE UP:
     Board.spawnEvent(type, x, z)   place an event on a tile (deck/turn/
                                    script driven). Fires 'board:eventSpawn'.
     Board.triggerEvent(x, z)       resolve it — call when a unit enters the
                                    tile, when the turn ticks, or when a card
                                    targets it. Fires 'board:eventTrigger'
                                    with { type, x, z, unitId } so the game
                                    can apply the actual effect (loot, ambush
                                    spawn, damage, heal, buff …).
     Board.clearEvent(x, z)         remove it once resolved/expired.
                                    Fires 'board:eventClear'.
     Board.eventsAt(x, z)           query.

   The demo auto-triggers an event when a unit finishes a move onto its
   tile — replace that call with the game's real resolution rules.
   Each event type below needs: display name, colour, icon, and whether it
   BLOCKS movement (a house/car would; a supply drop would not).
   Art: swap `icon` for the event's real sprite — the pad, pillar of light
   and float animation stay.
   ══════════════════════════════════════════════════════════════════ */
const EVENT_TYPES = {
  'supply-drop':{ name:'Supply Drop',  color:'#f0c96e', icon:'crate',  blocks:false },
  'ambush'     :{ name:'Ambush',       color:'#e04a3a', icon:'skull',  blocks:false },
  'relic'      :{ name:'Relic Cache',  color:'#a35cff', icon:'star',   blocks:false },
  'medical'    :{ name:'Medical Camp', color:'#4ad8c8', icon:'cross',  blocks:false },
  'bloom'      :{ name:'Toxic Bloom',  color:'#8fd84a', icon:'spore',  blocks:false },
  'structure'  :{ name:'Structure',    color:'#b0a48a', icon:'block',  blocks:true  }
};
const EV_ICON = {
  crate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>',
  skull:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a7 7 0 00-7 7c0 2.6 1.4 4.8 3.5 6V19h7v-3c2.1-1.2 3.5-3.4 3.5-6a7 7 0 00-7-7zm-2.5 7a1.2 1.2 0 110-2.4 1.2 1.2 0 010 2.4zm5 0a1.2 1.2 0 110-2.4 1.2 1.2 0 010 2.4z"/></svg>',

    const w = img.naturalWidth, h = img.naturalHeight;

  fillBand(bandQuad(px,pz, 1.14, 1.175, P.cap*1.04, P.cap*1.04), goldL, goldM);

  /* --- fire bowl --- */
  fillBand(bandQuad(px,pz, 1.175, 1.40, P.cap, P.bowl), goldD, goldM);
  fillBand(bandQuad(px,pz, 1.40, P.top, P.bowl, P.rim), goldM, goldL);
  /* rim ellipse + hot interior */
  const c = project({x:px, y:P.top, z:pz});
  const e = project({x:px + P.rim, y:P.top, z:pz});
  if (c && e){
    const R = Math.abs(e.x - c.x);
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, .42);
    /* bowl interior glow */
    const bg = ctx.createRadialGradient(0,0,0,0,0,R);
    bg.addColorStop(0, 'rgba(255,220,150,.95)');
    bg.addColorStop(.55, 'rgba(255,140,40,.6)');
    bg.addColorStop(1, 'rgba(120,40,10,.35)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill();
    /* gold rim */
    ctx.strokeStyle = goldL; ctx.lineWidth = Math.max(1.6, R*.14);
    ctx.beginPath(); ctx.arc(0,0,R*.99,0,7); ctx.stroke();
    ctx.strokeStyle = rgba('#f6dc95',.55); ctx.lineWidth = Math.max(1, R*.05);
    ctx.beginPath(); ctx.arc(0,0,R*.82,0,7); ctx.stroke();
    ctx.restore();
  }
  /* small gold brackets under the bowl */
  for (const s of [-1, 1]){
    const a = project({x:px + s*P.cap*0.95, y:1.10, z:pz});
    const b = project({x:px + s*P.bowl*1.02, y:1.34, z:pz});
    if (a&&b){
      ctx.strokeStyle = goldM; ctx.lineWidth = Math.max(1.4, (a.s||1)*.02);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(a.x + s*6, (a.y+b.y)/2, b.x, b.y); ctx.stroke();
    }
  }
  /* flickering light pool cast on the ground */
  const gb = project({x:px, y:0.01, z:pz});
  if (gb){
    const w = Math.abs((project({x:px+1, y:0.01, z:pz})||gb).x - gb.x);
    const flick = .17 + Math.sin(T*11 + px*3)*.045 + Math.sin(T*23.7 + pz)*.025;
    const lg = ctx.createRadialGradient(gb.x, gb.y, 0, gb.x, gb.y, w*2.6);
    lg.addColorStop(0, `rgba(255,150,60,${flick})`);
    lg.addColorStop(.5, `rgba(255,110,40,${flick*.42})`);
    lg.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.ellipse(gb.x, gb.y, w*2.6, w*1.1, 0, 0, 7); ctx.fill();
  }
  /* this pylon's flames + its projection beam */
  const bc = project({x:px, y:P.top, z:pz});
  const bs = project({x:px + P.rim, y:P.top, z:pz});
  if (bc && bs) br._spr = { x:bc.x, fireY:bc.y, emitY:bc.y, s:Math.abs(bs.x-bc.x)*2.6 };
  drawFlames(br);
  drawHoloBeam(br);
}

/* ══════════════════════════════════════════════════════════════════
   HOLOGRAM BEAM — each pillar projects a soft light cone onto the play
   field. Deliberately gentle: low opacity, slow breathing, feathered
   edges, drifting scan bands. It should read as ambient projection, not
   a spotlight — nothing here should ever clip to a hard edge.
   Tune with HOLO. (Three.js: a cone mesh with an additive, depth-write-off
   shader + a decal/projected texture for the floor pool. Keep the same
   alphas — they are the reason it settles instead of glaring.)
   ══════════════════════════════════════════════════════════════════ */
const HOLO = {
  emitFrac: 0.150,  /* projector height as a fraction from the sprite TOP   */
  frontOff: 0.30,   /* step the lens out along the beam, in PILLAR WIDTHS,  */
                    /* so the cone leaves the FRONT face, never the back     */
  inset:    0.34,   /* where the beam lands, as a fraction of the corner    */
  r0:       0.16,   /* beam radius at the lens, in pillar widths            */
  r1:       1.05,   /* beam radius on the floor                             */
  /* ⚠ Was 0.115. The four corner projectors lay big translucent wedges
     straight across the play field, and against the round-2 ground — where
     brightness now MEANS elevation — a wedge crossing a basin lifted it to
     the value of a plateau. Cutting the base opacity keeps the projection
     ambience (it is still clearly a beam) without letting it vote on how
     high a tile is. The cone geometry, breathing and scan bands are
     unchanged; only the master alpha moved. */
  alpha:    0.062,  /* base opacity — deliberately low                      */
  breathe:  0.030,
  period:   5.2,
  bands:    7,
  colA:  '#7fe6ff',
  colB:  '#8f7cff'
};
let holoIn = 0;      /* fades up on load so it settles in */

/* Emitter for one pillar: at the capital gem, pushed toward board centre so
   the cone visibly leaves the pillar's FRONT and never clips through it. */
function drawHoloBeam(br){
  if (holoIn <= 0.001) return;
  const S = br._spr; if (!S) return;
  const pulse = HOLO.alpha + Math.sin(T*(Math.PI*2/HOLO.period) + br.seed)*HOLO.breathe;
  const A = clamp(pulse, 0.04, 0.2) * holoIn;
  /* landing point is a real world position on the play field */
  const g = project({ x: br.x*HOLO.inset, y: 0.02, z: br.z*HOLO.inset });
  if (!g) return;
  /* lens sits on the PAINTED capital gem, then steps out along the beam so
     the cone leaves the pillar's front face instead of clipping through it */
  let o = { x: S.x, y: S.emitY, s: S.s };
  const ddx = g.x-o.x, ddy = g.y-o.y, dl = Math.hypot(ddx,ddy) || 1;
  o = { x: o.x + (ddx/dl)*S.s*HOLO.frontOff, y: o.y + (ddy/dl)*S.s*HOLO.frontOff, s: S.s };
  const dx = g.x-o.x, dy = g.y-o.y, L = Math.hypot(dx,dy) || 1;
  const nx = -dy/L, ny = dx/L;
  /* ⚠ A NEGATIVE RADIUS HERE FROZE THE ENTIRE BOARD, PERMANENTLY, AND THIS IS
     THE "it is freezing" REPORT. `g.s` is the projected scale at the beam's
     landing point, and project() hands back a NEGATIVE scale for a point that
     falls behind the camera plane — it only returns null for the points it
     rejects outright, so the `if (!g) return` above does not cover this. r1
     then goes negative and the floor pool's `arc(0,0,r1*1.3,…)` throws
     IndexSizeError. frame() does catch it, but it also latches `frameErr`,
     and a latched frameErr NEVER reschedules: one bad pylon on one frame and
     the battlefield is a still image for the rest of the match.
     Caught at r1 = -28.08, thrown the moment a defs swap re-ran the pylon
     pass — and the host re-posts defs on a 2Hz tick (_bbStagePushDefs), so
     this was reachable in an ordinary match, not just under a probe.
     A beam whose landing point is behind the camera has nothing to draw, so
     bail. The clamp stays as well, because "a radius cannot be negative" must
     not depend on one caller's arithmetic continuing to be right. */
  if (!(S.s > 0) || !(g.s > 0)) return;
  const r0 = Math.max(0, HOLO.r0 * S.s), r1 = Math.max(0, HOLO.r1 * g.s);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  /* the cone — feathered along its length, never a hard edge.
     ⚠ …except ACROSS its width, which it was: one quad with a lengthwise
     gradient has two hard side edges, and where a side edge crosses the sand
     it reads as a translucent rectangle laid on the ground. That is the
     flat-overlay look the BAR forbids, and because the edge is a step in
     VALUE it also argues with the elevation ramp the terrain now depends on.
     Three nested widths at falling alpha approximate a crosswise falloff
     without an offscreen canvas; the weights sum to 1 so the beam is exactly
     as bright as before down its centre line, and only its rim changed. */
  const CONE = [ [1.00, 0.40], [0.68, 0.34], [0.34, 0.26] ];
  for (let ci=0; ci<CONE.length; ci++){
    const wk = CONE[ci][0], ak = CONE[ci][1];
    const grad = ctx.createLinearGradient(o.x, o.y, g.x, g.y);
    grad.addColorStop(0,   rgba(HOLO.colA, A*1.25*ak));
    grad.addColorStop(.18, rgba(HOLO.colA, A*.85*ak));
    grad.addColorStop(.60, rgba(HOLO.colA, A*.42*ak));
    grad.addColorStop(1,   rgba(HOLO.colB, A*.12*ak));
    ctx.fillStyle = grad;
    const w0 = r0*wk, w1 = r1*wk;
    ctx.beginPath();
    ctx.moveTo(o.x + nx*w0, o.y + ny*w0);
    ctx.lineTo(o.x - nx*w0, o.y - ny*w0);
    ctx.lineTo(g.x - nx*w1, g.y - ny*w1);
    ctx.lineTo(g.x + nx*w1, g.y + ny*w1);
    ctx.closePath(); ctx.fill();
  }

  /* drifting scan bands */
  for (let i=0;i<HOLO.bands;i++){
    const t = (i/HOLO.bands + T*0.085) % 1;
    const fade = Math.sin(t*Math.PI);
    const t2 = Math.min(1, t + 0.035);
    const bw = lerp(r0,r1,t),  bx = lerp(o.x,g.x,t),  by = lerp(o.y,g.y,t);
    const bw2 = lerp(r0,r1,t2), bx2 = lerp(o.x,g.x,t2), by2 = lerp(o.y,g.y,t2);
    ctx.fillStyle = rgba(HOLO.colA, A*0.30*fade);
    ctx.beginPath();
    ctx.moveTo(bx + nx*bw,   by + ny*bw);
    ctx.lineTo(bx - nx*bw,   by - ny*bw);
    ctx.lineTo(bx2 - nx*bw2, by2 - ny*bw2);
    ctx.lineTo(bx2 + nx*bw2, by2 + ny*bw2);
    ctx.closePath(); ctx.fill();
  }

  /* projector lens on the pillar face */
  const lg = ctx.createRadialGradient(o.x,o.y,0, o.x,o.y, r0*5.5);
  lg.addColorStop(0,   rgba('#dffaff', A*2.6));
  lg.addColorStop(.35, rgba(HOLO.colA, A*1.1));
  lg.addColorStop(1,   rgba(HOLO.colA, 0));
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(o.x,o.y,r0*5.5,0,7); ctx.fill();

  /* floor pool + slow rings */
  ctx.save(); ctx.translate(g.x, g.y); ctx.scale(1, .44);
  const pg = ctx.createRadialGradient(0,0,0,0,0,r1*1.3);
  pg.addColorStop(0,   rgba(HOLO.colA, A*1.5));
  pg.addColorStop(.55, rgba(HOLO.colB, A*.55));
  pg.addColorStop(1,   rgba(HOLO.colB, 0));
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0,0,r1*1.3,0,7); ctx.fill();
  for (let i=0;i<3;i++){
    const rt = ((T*0.16) + i/3) % 1;
    ctx.strokeStyle = rgba(HOLO.colA, A*0.8*(1-rt));
    ctx.lineWidth = 1.6;
    /* belt and braces with the dt clamp in frame(): a radius must not be able
       to go negative even if some future caller feeds this a strange phase. */
    ctx.beginPath(); ctx.arc(0,0, Math.max(0, r1*(0.25 + rt*1.05)), 0, 7); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════
   FIRE — real flame: a live particle column per brazier. Each puff is
   born hot and white, rises + narrows, cools yellow → orange → red, then
   turns to smoke. Additive blending on the hot stages does the glow.
   (Three.js: port as a GPU particle system / instanced quads with the
   same colour ramp + the same lifetime curve.)
   ══════════════════════════════════════════════════════════════════ */
const FLAME_RAMP = [
  { p:0.00, c:[255,252,235], a:0.95 },   /* white core            */
  { p:0.16, c:[255,232,150], a:0.92 },   /* yellow                */
  { p:0.36, c:[255,170,52],  a:0.80 },   /* orange                */
  { p:0.58, c:[236,96,26],   a:0.55 },   /* deep orange           */
  { p:0.76, c:[150,44,18],   a:0.28 },   /* red, going out        */
  { p:1.00, c:[46,40,40],    a:0.00 }    /* smoke                 */
];
function flameColor(p){
  for (let i=0;i<FLAME_RAMP.length-1;i++){
    const A = FLAME_RAMP[i], B = FLAME_RAMP[i+1];
    if (p <= B.p){
      const k = (p - A.p)/(B.p - A.p || 1);
      return { r:Math.round(lerp(A.c[0],B.c[0],k)), g:Math.round(lerp(A.c[1],B.c[1],k)),
               b:Math.round(lerp(A.c[2],B.c[2],k)), a:lerp(A.a,B.a,k) };
    }
  }
  return { r:46, g:40, b:40, a:0 };
}
let braziers = [], flames = [], flameAcc = 0;
/* world height of a point given as a fraction from the sprite's TOP */
function artY(fracFromTop){
  return (PYLON_ART.anchorY - fracFromTop) * PYLON_ART.heightWorld;
}
/* Pillars must stand fully OUTSIDE the play grid. The sprite is a billboard
   whose base slab hangs BELOW its anchor, and on the far pillars that skirt
   projects DOWNWARD — i.e. straight onto the board — so the corners are
   pushed out by half the pillar width plus a gap, not just by the apron. */
function pylonClearance(){
  const halfW = PYLON_ART.img ? PYLON_ART.widthWorld*0.5 : 0.45;
  return CONFIG.wall + halfW + 0.22;
}
function seedBraziers(){
  const c = pylonClearance();
  const hw = MAP.cols/2 + c, hh = MAP.rows/2 + c;
  const fireY = PYLON_ART.img ? artY(PYLON_ART.fireY) : PYLON.top;
  braziers = [ {x:-hw,z:-hh}, {x:hw,z:-hh}, {x:hw,z:hh}, {x:-hw,z:hh} ]
    .map((c2,i) => ({ x:c2.x, y:fireY + 0.02, z:c2.z, seed:i*2.7, id:i }));
}
function updateFlames(dt){
  /* Projector pillars don't burn: skip EMISSION entirely (not just drawing)
     so no particles are simulated off-screen. */
  const emitting = !(PYLON_ART.img && !PYLON_ART.flames);
  flameAcc += dt;
  const step = 1/58;
  if (!emitting) flameAcc = 0;
  while (emitting && flameAcc > step){
    flameAcc -= step;
    for (const br of braziers){
      for (let i=0;i<2;i++){
        /* all offsets are in PILLAR WIDTHS, resolved against the sprite each frame */
        const a = Math.random()*Math.PI*2, rr = Math.random()*0.085;
        flames.push({ br:br.id,
          ox: Math.cos(a)*rr, oy: rnd(-.01,.015),
          vx: Math.cos(a)*rnd(.01,.05),
          vy: rnd(.52, .92),
          t: 0, life: rnd(.48, .86),
          r0: rnd(.058, .105), r1: rnd(.015, .035),
          sway: rnd(1.6,3.4), phase: Math.random()*6.283, seed: br.seed
        });
      }
    }
  }
  for (const f of flames){
    f.t += dt;
    const p = f.t/f.life;
    /* buoyancy: accelerate upward early, then the puff stalls into smoke */
    f.vy += (p < .5 ? 1.15 : -0.24) * dt;
    f.ox += (f.vx + Math.sin(T*f.sway + f.phase)*0.075) * dt;
    f.oy += f.vy * dt;
  }
  flames = flames.filter(f => f.t < f.life);
}
function drawFlames(br){
  const A = br && br._spr; if (!A) return;
  /* oldest last so young hot puffs sit in front */
  const list = flames.filter(f => f.br === br.id).sort((a,b) => b.t - a.t);
  ctx.save();
  for (const f of list){
    const p = clamp(f.t/f.life, 0, 1);
    const col = flameColor(p);
    if (col.a <= 0.003) continue;
    /* resolve against the PAINTED bowl — always dead centre on top */
    const sx = A.x + f.ox * A.s;
    const sy = A.fireY - f.oy * A.s;
    const wr = lerp(f.r0, f.r1, easeOut(p)) * (1 + Math.sin(p*Math.PI)*0.35);
    const R = Math.max(0.6, wr * A.s);
    ctx.globalCompositeOperation = p < 0.66 ? 'lighter' : 'source-over';
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, R);
    g.addColorStop(0,   `rgba(${col.r},${col.g},${col.b},${col.a})`);
    g.addColorStop(.55, `rgba(${col.r},${col.g},${col.b},${col.a*.45})`);
    g.addColorStop(1,   `rgba(${col.r},${col.g},${col.b},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(sx, sy, R*0.78, R*1.45, 0, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

/* ── props (billboards; editor-placed) ── */
function drawProp(t){
  const base = gw(t.x, t.z, tileElev(t.x,t.z));
  const p = project(base); if (!p) return;
  const S = p.s * .5, lv = lightVector();
  /* shadow */
  shadowEllipse(base, .38, .8);
  ctx.save(); ctx.translate(p.x, p.y);
  const k = S;
  const shade = mixHex('#6a6050', LIGHT.key, .3);
  ctx.strokeStyle = rgba('#0a0810',.9); ctx.lineWidth = 1.4;
  /* NOTE: houses and wrecked cars used to live here — they are EVENTS now
     (see EVENT_TYPES / drawEvent). Only inert terrain remains as props. */
  if (t.prop === 'barricade'){
    ctx.fillStyle = shade;
    for (let i=-1;i<=1;i++){ ctx.save(); ctx.translate(i*k*.3, 0); ctx.rotate(i*.22);
      ctx.fillRect(-k*.07,-k*.5, k*.14, k*.5); ctx.strokeRect(-k*.07,-k*.5, k*.14, k*.5); ctx.restore(); }
    ctx.fillRect(-k*.5,-k*.3, k*1.0, k*.1); ctx.strokeRect(-k*.5,-k*.3, k*1.0, k*.1);
  } else if (t.prop === 'crater'){
    ctx.save(); ctx.scale(1,.46);
    const cg = ctx.createRadialGradient(0,0,0,0,0,k*.55);
    cg.addColorStop(0,'rgba(90,20,10,.9)'); cg.addColorStop(.7,'rgba(30,12,8,.85)'); cg.addColorStop(1,'rgba(20,10,6,0)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0,0,k*.55,0,7); ctx.fill();
    ctx.strokeStyle = rgba('#ff6a2a', .35 + Math.sin(T*2)*.15); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,k*.4,0,7); ctx.stroke();
    ctx.restore();
  } else if (t.prop === 'pylon'){
    const g = ctx.createLinearGradient(0,-k*1.1,0,0);
    g.addColorStop(0, rgba('#b98cff',.9)); g.addColorStop(1, rgba('#3a1c6a',.8));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0,-k*1.15); ctx.lineTo(k*.22,-k*.4); ctx.lineTo(0,0); ctx.lineTo(-k*.22,-k*.4); ctx.closePath();
    ctx.fill(); ctx.strokeStyle = rgba('#d8b8ff',.6); ctx.stroke();
  } else if (t.prop === 'bones'){
    ctx.strokeStyle = rgba('#cfc4a8',.75); ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-k*.4,-k*.05); ctx.lineTo(k*.3,-k*.2); ctx.moveTo(-k*.25,-k*.24); ctx.lineTo(k*.36,-k*.02); ctx.stroke();
    ctx.fillStyle = rgba('#cfc4a8',.8); ctx.beginPath(); ctx.arc(-k*.42,-k*.16,k*.11,0,7); ctx.fill();
  }
  ctx.restore();
}

/* ground shadow driven by the light vector */
function shadowEllipse(world, rx, alpha){
  const lv = lightVector();
  const len = clamp(1/(lv.y+.16), .8, 3.6);
  const off = { x: -lv.x*len*.42, z: -lv.z*len*.42 };
  const c = project({ x:world.x + off.x, y:world.y+.006, z:world.z + off.z }); if (!c) return;
  const e = project({ x:world.x + off.x + rx, y:world.y+.006, z:world.z + off.z }); if (!e) return;
  const R = Math.abs(e.x - c.x);
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(Math.atan2(-lv.z, lv.x)*.12); ctx.scale(1*len*.55+.6, .40);
  const g = ctx.createRadialGradient(0,0,0,0,0,R);
  g.addColorStop(0, `rgba(0,0,0,${(alpha||.75)*clamp(lv.y+.25,.25,1)})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill(); ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════
   SPRITE PAINTERS — procedural stand-ins for the real sheets.
   Drawn into a unit-local space: x ∈ [-.5,.5], y ∈ [-1,0] (feet at 0)
   ══════════════════════════════════════════════════════════════════ */
function paintSprite(c, key, k, col, t){
  /* ── REAL ART FIRST ───────────────────────────────────────────────
     A unit with `art` or a `sheet` draws its own texture, billboarded in
     the same unit-local space the procedural painters use (x -.5..+.5,
     y -1..0, feet at 0). Crispness rules from the port brief: no smoothing
     on the silhouette, and the destination rect is snapped to whole device
     pixels so slow drifts don't shimmer.
     A sheet animates by SOURCE-RECT offset (never by swapping textures). */
  const D = UNIT_DEFS[key];
  if (D && D._proc) key = D._proc;
  /* ── SPRITE ATELIER FRAMES ────────────────────────────────────────────
     The game stores an uploaded sprite as an ARRAY of full-resolution frame
     images (Forge.sprites[key][anim]), not a packed atlas, so that is the
     primary path. Timing is SECONDS-based off the shared clock — never a
     frame counter — so playback speed is identical at 30fps or 144fps, and
     each unit gets a stable phase offset so a row of the same unit doesn't
     march in lockstep.
     Quality rule: see fitSprite() and the block comment above it. Short
     version — the filter follows WHAT THE ART IS (measured once per texture),
     not which way it is being scaled, and the scale it reasons about is in
     DEVICE pixels. Do not reintroduce `dw > img.width` here. */
  if (D && Array.isArray(D.frames) && D.frames.length){
    const fps = D.fps || 10;
    const n = D.frames.length;
    const idx = n > 1 ? (Math.floor((t + (D._phase || 0)) * fps) % n) : 0;
    /* 🎞 THE BLACK FLICKER DURING PLAYBACK — this line, and it is a decode race,
       not a render bug. artImage() returns NULL until that frame's onload has
       fired, and sprite frames stream in from cloud storage on demand. So the
       ticker asks for frame 5 while only frames 0-3 are resident and gets null.
       What used to happen then was one of two visible faults, both reported as
       "flickering":
         · frame 0 IS resident → the animation SNAPS back to its first pose for
           one tick and then jumps forward again, which reads as a stutter;
         · frame 0 is not resident either → `img` is null, the draw is skipped,
           and the fall-through below returns without painting anything, so the
           unit VANISHES for that frame against a bright board.
       Holding the last frame that actually drew fixes both: playback pauses on
       a real pose instead of snapping or blanking, and once the set is resident
       the index is exact again and this never fires. One reference per def, so
       it costs nothing per frame.
       ⚠ Cleared in applyDefs whenever the frame list changes — otherwise a
       Kalon transform could hold the pre-transform creature's last pose. */

      const e = project({ ...gw(f.gx,f.gz,0), x: gw(f.gx,f.gz).x+.42 });
      if (b && t2 && e){
        const R = Math.abs(e.x-b.x) * (1 - p*.25);
        const g = ctx.createLinearGradient(b.x, b.y, t2.x, t2.y);
        g.addColorStop(0, rgba(f.col, a*.75)); g.addColorStop(.5, rgba(f.col, a*.3)); g.addColorStop(1, rgba(f.col,0));
        ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(b.x-R, b.y); ctx.lineTo(b.x+R, b.y);
        ctx.lineTo(t2.x+R*.5, t2.y); ctx.lineTo(t2.x-R*.5, t2.y); ctx.closePath(); ctx.fill(); ctx.restore();
      }
    }
    if (f.k === 'impact' && pass === 'air'){
      const c = project({x:f.x, y:.5, z:f.z});
      if (c){ ctx.save(); ctx.globalCompositeOperation='lighter';
        const g = ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,60*(1+p));
        g.addColorStop(0, `rgba(255,230,180,${a})`); g.addColorStop(1,'rgba(255,180,80,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,60*(1+p),0,7); ctx.fill(); ctx.restore(); }
    }
    if (f.k === 'float' && pass === 'air'){
      const c = project({x:f.x, y:1.1 + p*.9, z:f.z});
      if (c){ ctx.font = `700 ${Math.round(20*c.s*.06+11)}px Cinzel, serif`;
        ctx.textAlign='center'; ctx.fillStyle = rgba(f.col, a);
        ctx.strokeStyle='rgba(0,0,0,.8)'; ctx.lineWidth=3; ctx.strokeText(f.txt,c.x,c.y); ctx.fillText(f.txt,c.x,c.y); }
    }
    if (f.k === 'flash' && pass === 'screen'){
      ctx.fillStyle = `rgba(255,246,220,${a*a*.75})`; ctx.fillRect(0,0,W,H);
    }
    if (f.k === 'ember2d' && pass === 'screen'){
      ctx.fillStyle = rgba(f.col, a);
      ctx.beginPath(); ctx.arc(f.x, f.y, 2.4*a+.6, 0, 7); ctx.fill();
    }

}
function drawParticles(){
  /* dust puffs first (they sit under the sparks), back to front */
  const puffs = particles.filter(p => p.puff).sort((a,b) => a.z - b.z);
  for (const p of puffs){
    const pr = project({x:p.x, y:p.y, z:p.z}); if (!pr) continue;
    const k = clamp(p.t/p.life, 0, 1);
    const R = Math.max(1, lerp(p.r0, p.r1, easeOut(k)) * pr.s);
    /* fade in fast, hang, then fall away slowly */
    const a = Math.min(1, k/0.12) * Math.pow(1-k, 1.7) * 0.42;
    if (a <= 0.004) continue;
    const tint = mixHex(p.col, LIGHT.key, .3);
    const rgbm = tint.match(/\d+/g) || [185,165,130];
    const cr = Math.round(rgbm[0]*p.tone), cg = Math.round(rgbm[1]*p.tone), cb = Math.round(rgbm[2]*p.tone);
    const g = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, R);
    g.addColorStop(0,   `rgba(${cr},${cg},${cb},${a})`);
    g.addColorStop(.45, `rgba(${cr},${cg},${cb},${a*.55})`);
    g.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle = g;
    /* squashed against the ground plane */
    ctx.beginPath(); ctx.ellipse(pr.x, pr.y, R, R*0.46, 0, 0, 7); ctx.fill();
  }
  for (const p of particles){
    if (p.puff) continue;
    const pr = project({x:p.x, y:p.y, z:p.z}); if (!pr) continue;
    /* ⚠ AMBIENT MOTES WERE WASHING THE GROUND. At .35±.25 alpha composited
       'lighter', with an on-screen radius that scales with the projection,
       the 70 ambient motes land as ~20px bokeh discs spread over the whole
       field. Measured: they were the single largest contributor to the
       spread of tile-centre luminance on the LIVE canvas — a level-0 tile
       under one read 180 luma against its neighbours' 90 — which is exactly
       the elevation cue this round exists to protect. They also read as flat
       sprites pasted over the board, which is the look the BAR forbids.
       Halved in alpha and capped in radius: still ambience, no longer a wash.
       Combat/dust particles (p.amb false) are untouched. */
    const a = p.amb ? .17 + Math.sin(T*1.4 + p.w)*.11 : clamp(1 - p.t/p.life, 0, 1);
    ctx.globalCompositeOperation = p.soft ? 'source-over' : 'lighter';
    let s = p.size * pr.s * .045 + .6;
    if (p.amb){
      /* Ambient motes get a RADIAL falloff, not a flat disc. A hard-edged
         translucent circle sitting on the sand is a sprite pasted on the
         board — the exact read the BAR calls out — and 70 of them across the
         field was the loudest such tell in the frame. Combat and dust
         particles keep the cheap flat arc: they are short-lived, they move
         fast, and nothing about them ever sits still on the ground. */
      s = Math.min(s, 6.5);
      const mg = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, s);
      mg.addColorStop(0,   rgba(p.col, a * .9));
      mg.addColorStop(0.45,rgba(p.col, a * .38));
      mg.addColorStop(1,   rgba(p.col, 0));
      ctx.fillStyle = mg;
    } else {
      ctx.fillStyle = rgba(p.col, a * (p.soft ? .45 : .9));
    }
    ctx.beginPath(); ctx.arc(pr.x, pr.y, s, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* UI safe-area guides (dev only) */
function drawGuides(){

/* ══════════════════════════════════════════════════════════════════
   UPDATE + FRAME
   ══════════════════════════════════════════════════════════════════ */
function update(dt){
  /* cosmetic summon rise — see summonFx() */
  for (const u of units){
    if (!u.rise || u.riseT === undefined) continue;
    u.riseT += dt;
    const rt = clamp(u.riseT / 0.42, 0, 1);
    u.y = lerp(-1.1, 0, easeBack(rt));
    u.scaleX = lerp(.7, 1, easeOut(rt));
    u.scaleY = lerp(.7, 1, easeOut(rt));
    if (rt >= 1){
      u.rise = 0; u.riseT = undefined; u.y = 0;
      u.scaleY = 1.16; u.scaleX = .88;            // landing squash; springs back below
      const wp = gw(u.gx, u.gz, tileElev(u.gx, u.gz));
      effects.push({ k:'ring', x:wp.x, z:wp.z, t:0, dur:.55, col:(u.def&&u.def.color)||'#f6dc95', r0:.1, r1:1.0 });
      dust(wp.x, wp.z, 14);
    }
  }
  /* light lerp */
  if (lightLerp){
    lightLerp.t += dt/lightLerp.dur;
    LIGHT = lightAtK(lightLerp.t);
    if (lightLerp.t>=1) lightLerp = null;
  }
  for (const u of units){
    u.bob += dt;
    if (u.shake) u.shake = Math.max(0, u.shake - dt*1.6);
    if (u.flash) u.flash = Math.max(0, u.flash - dt*3);
    /* spring the squash back */
    u.scaleX += (1 - u.scaleX) * Math.min(1, dt*9);
    u.scaleY += (1 - u.scaleY) * Math.min(1, dt*9);
    if (u.tween){
      const tw = u.tween; tw.t += dt/tw.dur;
      const k = clamp(tw.t,0,1), e = easeInOut(k);
      u.x = lerp(tw.x0, tw.x1, e); u.z = lerp(tw.z0, tw.z1, e);
      u.y = Math.sin(k*Math.PI) * 0.28;
      if (k < .18) { u.scaleY = lerp(1,.86,k/.18); u.scaleX = lerp(1,1.12,k/.18); }
      if (k >= 1){
        u.tween = null; u.anim='idle'; u.x = tw.x1; u.z = tw.z1; u.y = 0;
        u.scaleY = 1.18; u.scaleX = .86;
        dust(gw(u.x,u.z).x, gw(u.x,u.z).z, 14);
        /* ← REPLACE with the game's rule for when an event resolves */
        if (eventsAt(u.gx, u.gz).length) triggerEvent(u.gx, u.gz, u.id);
      }
    } else if (!u.rise) {
      u.y = Math.sin(u.bob*1.7)*0.022;   /* idle breathe */
    }
    if (u.lunge){
      u.lunge.t += dt/u.lunge.dur;
      const k = clamp(u.lunge.t,0,1);
      const amt = Math.sin(k*Math.PI)*.34;
      u.x = u.gx + u.lunge.dx*amt; u.z = u.gz + u.lunge.dz*amt;
      if (k>=1){ u.lunge=null; u.x=u.gx; u.z=u.gz; }
    }
    if (u.dead){ u.deathT += dt; u.scaleY = Math.max(0, 1-u.deathT*1.6); }
  }
  units = units.filter(u => !u.dead || u.deathT < .8);
  for (const p of particles){
    if (p.amb){
      p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
      if (p.y > 3.8){ p.y = .05; p.x = rnd(-5,5); p.z = rnd(-4,4); }
      continue;
    }
    p.t += dt;
    if (p.puff){
      /* dust billows outward then stalls as it loses energy */
      const k = Math.pow(0.12, dt);
      p.vx *= k; p.vz *= k; p.vy *= Math.pow(0.5, dt);
      p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
      continue;
    }
    p.vy -= p.g*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    if (p.y < 0){ p.y = 0; p.vy *= -0.32; p.vx *= .6; p.vz *= .6; }
  }
  particles = particles.filter(p => p.amb || p.t < p.life);
  updateFlames(dt);
  if (GROUND.fade < 1) GROUND.fade = Math.min(1, GROUND.fade + dt/0.8);
  if (BACKDROP.fade < 1){
    BACKDROP.fade = Math.min(1, BACKDROP.fade + dt/0.9);
    /* the fade is over — drop the outgoing art so the shared horizon can go
       back to the incoming art's own best value (it is the MIN over both while
       a fade is running, see THE ONE INVARIANT). Re-plating at that point is
       visually a no-op precisely BECAUSE of the invariant: the horizon lands on
       the far edge whatever the plate height is. */
    if (BACKDROP.fade >= 1 && BACKDROP.prevSrc){
      BACKDROP.prev = null; BACKDROP.prevSrc = null; BACKDROP.plateKey = '';
    }
  }
  if (holoIn < 1) holoIn = Math.min(1, holoIn + dt/2.2);   /* settle in gently */
  for (const f of effects){
    f.t += dt;
    if (f.k === 'ember2d'){ f.x += f.vx*dt; f.y += f.vy*dt; f.vy += 40*dt; }
  }
  effects = effects.filter(f => f.t < f.dur);
}
/* ══════════════════════════════════════════════════════════════════════════
   THE TIME-OF-DAY LERP, AS A FUNCTION OF k — AND IT HAS EXACTLY ONE DEFINITION
   ⚠ WHY IT IS A FUNCTION AND NOT FOUR LINES INSIDE update(). The vista bakes
   four offscreen canvases keyed on LIGHT, and LIGHT used to change on EVERY
   frame for the whole 2.5s of a setTimeOfDay(). Even throttled to one bake per
   150ms that is 17 full-viewport bakes in the window, ~226ms apiece on the
   reference box, and it is the "the game frame lags when the sun and moon
   changes" report. The module now bakes a handful of plates at FIXED k and
   cross-fades between them — which means it has to be able to ask what the
   light IS at a k that is not the current one. That question has one correct
   answer and this is it. Computing it a second time inside the module would be
   a copy of the rig that silently drifts the first time a preset field is
   added here and not there.

   ⚠ body IS A STEP AND THAT IS DELIBERATE — AND IT IS ALSO A VISIBLE POP.
   `k>.5 ? B.body : A.body` flips sun→moon in one frame. The vista's dayness()
   reads LIGHT.body and returns 0 outright for a moon, so the whole DAY_* sky
   regrade drops out on that same frame: measured on the world plate, the sky
   steps 103/255 between k=0.487 and k=0.547 while every other 0.06 step of the
   transition moves it by at most 5.3. That step is NOT introduced by the
   cross-fade — it is here, today, in every day↔night change — and the plate
   ladder is built with a stop on each side of it so it stays exactly as it is
   rather than being smeared into a 0.6s dissolve. Softening it is a LOOK
   change and belongs in its own round. */
function lightAtK(k){
  if (!lightLerp) return LIGHT;
  const A = lightLerp.from, B = lightLerp.to;
  k = clamp(k, 0, 1);
  return {
    az:lerp(A.az,B.az,k), elev:lerp(A.elev,B.elev,k),
    key:mixHexRaw(A.key,B.key,k), keyI:lerp(A.keyI,B.keyI,k),
    ambient:mixHexRaw(A.ambient,B.ambient,k), ambI:lerp(A.ambI,B.ambI,k),
    sky:[mixHexRaw(A.sky[0],B.sky[0],k), mixHexRaw(A.sky[1],B.sky[1],k), mixHexRaw(A.sky[2],B.sky[2],k)],
    fog:mixHexRaw(A.fog,B.fog,k), rim:mixHexRaw(A.rim,B.rim,k),
    body: k>.5 ? B.body : A.body, disc:mixHexRaw(A.disc,B.disc,k), haze:lerp(A.haze,B.haze,k)
  };
}
function mixHexRaw(a,b,t){
  const A=hexRgb(a), B=hexRgb(b);
  const to = v => v.toString(16).padStart(2,'0');
  return '#'+to(Math.round(lerp(A[0],B[0],t)))+to(Math.round(lerp(A[1],B[1],t)))+to(Math.round(lerp(A[2],B[2],t)));
}

let frameErr = false;
/* 🩹 HOW MANY TRANSIENT RENDER THROWS THE BOARD SURVIVES BEFORE IT GIVES UP.
   frameErr was all-or-nothing: the first throw from anywhere in the frame
   latched it and the board never rescheduled again — a still image for the
   rest of the match. That turned every one-frame arithmetic slip into a total
   loss (see drawHoloBeam's negative radius, which is exactly how it was
   found). A transient throw is now absorbed: the frame is abandoned, the next
   one is scheduled, and only a PERSISTENT fault — FRAME_ERR_MAX throws — puts
   the red card up. The counter decays on clean frames so a single bad pylon
   an hour never accumulates into a latch. */
const FRAME_ERR_MAX = 8;
let frameErrN = 0;
/* ══════════════════════════════════════════════════════════════════════════
   🎨 TILE SURFACES — canvas-2D, painted INSIDE the stage's own pass.
   ⚠ Deliberately NOT WebGL. The shader version compiled, issued draw calls and
   still produced no fragments on real hardware (state/driver-dependent, and it
   differed between machines). The 2D canvas is the one surface this game
   provably renders everywhere — so the hazards live there too: same slot
   (above the ground, below the depth-sorted actors), same `board:surfaces`
   message, no extra GPU context, and pixel-verifiable.
   Each tile is clipped to its own projected quad; looks are seeded per tile so
   patterns don't march in lockstep, and animate off the shared clock T. */
let SURFACES = {};                 /* "x,z" -> effect key */
function _sHash(x, z, n){ let h = (x * 73856093) ^ (z * 19349663) ^ ((n || 0) * 83492791); h = (h ^ (h >> 13)) * 1274126177; h = (h ^ (h >> 16)) >>> 0; return (h % 10000) / 10000; }
function _sQuad(gx, gz){
  const e = tileElev(gx, gz) + 0.012;
  const c = [[0,0],[1,0],[1,1],[0,1]].map(o => {
    const wp = gw(gx - 0.5 + o[0], gz - 0.5 + o[1], e);
    return project({ x: wp.x, y: wp.y, z: wp.z });
  });
  return c.some(q => !q) ? null : c;
}
/* one painter per effect key — c is pre-clipped to the tile quad.
   (cx,cy) centre, r ≈ half-width in px, T = clock. */
const SURFACE_2D = {
fire(c, q, cx, cy, r, T, gx, gz){
  const fl = 0.85 + 0.15 * Math.sin(T * 11 + gx * 3 + gz);
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, 'rgba(255,214,92,' + (0.95 * fl) + ')');
  g.addColorStop(0.45, 'rgba(255,122,28,' + (0.8 * fl) + ')');
  g.addColorStop(1, 'rgba(140,20,0,0.12)');
  c.globalCompositeOperation = 'lighter';
  c.fillStyle = g; c.fillRect(cx - r, cy - r * 1.2, r * 2, r * 2.2);
  for (let i = 0; i < 5; i++){
    const a = _sHash(gx, gz, i) * 6.28, d = r * (0.15 + 0.5 * _sHash(gz, gx, i));
    const fx = cx + Math.cos(a) * d, fh = r * (0.5 + 0.5 * _sHash(gx, gz, i + 9)) * (0.8 + 0.3 * Math.sin(T * 9 + i * 2.1));
    const fg = c.createLinearGradient(fx, cy + r * 0.2, fx, cy - fh);
    fg.addColorStop(0, 'rgba(255,150,40,0.85)'); fg.addColorStop(1, 'rgba(255,220,120,0)');
    c.fillStyle = fg;
    c.beginPath(); c.moveTo(fx - r * 0.12, cy + r * 0.25); c.quadraticCurveTo(fx, cy - fh, fx + r * 0.12, cy + r * 0.25); c.fill();
  }
},
ice(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(158,204,238,0.82)'; c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineWidth = Math.max(1, r * 0.045);
  for (let i = 0; i < 4; i++){
    const a = _sHash(gx, gz, i) * 6.28;
    c.beginPath(); c.moveTo(cx, cy);
    let px = cx, py = cy;
    for (let s2 = 1; s2 <= 3; s2++){
      px += Math.cos(a + (_sHash(gx, gz, i * 3 + s2) - 0.5)) * r * 0.36;
      py += Math.sin(a + (_sHash(gz, gx, i * 3 + s2) - 0.5)) * r * 0.3;
      c.lineTo(px, py);
    }
    c.stroke();
  }
  const tw = 0.5 + 0.5 * Math.sin(T * 3 + gx + gz * 2);
  c.fillStyle = 'rgba(255,255,255,' + (0.5 * tw) + ')';
  c.beginPath(); c.arc(cx + r * 0.3, cy - r * 0.15, r * 0.06, 0, 7); c.fill();
},
web(c, q, cx, cy, r, T, gx, gz){
  c.strokeStyle = 'rgba(235,240,250,0.8)'; c.lineWidth = Math.max(1, r * 0.03);
  for (const p2 of q){ c.beginPath(); c.moveTo(cx, cy); c.lineTo((cx + p2.x) / 2 + (p2.x - cx) * 0.45, (cy + p2.y) / 2 + (p2.y - cy) * 0.45); c.stroke(); }
  for (let ring = 1; ring <= 3; ring++){
    c.beginPath();
    for (let i = 0; i <= 8; i++){
      const a = i / 8 * 6.283, rr = r * ring / 3.4 * (1 + 0.05 * Math.sin(a * 3 + gx));
      const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.62;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.stroke();
  }
},
gas(c, q, cx, cy, r, T, gx, gz){
  for (let i = 0; i < 3; i++){
    const a = T * 0.5 * (i % 2 ? 1 : -1) + i * 2.1 + _sHash(gx, gz, i) * 6;
    const bx = cx + Math.cos(a) * r * 0.3, by = cy + Math.sin(a) * r * 0.2;
    const g = c.createRadialGradient(bx, by, 0, bx, by, r * 0.7);
    g.addColorStop(0, 'rgba(168,208,60,0.5)'); g.addColorStop(1, 'rgba(80,110,20,0)');
    c.fillStyle = g; c.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
},
electric(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(20,40,90,0.45)'; c.fill();
  const seed = Math.floor(T * 7);
  c.strokeStyle = 'rgba(150,200,255,0.95)'; c.lineWidth = Math.max(1, r * 0.04);
  c.shadowColor = 'rgba(120,180,255,0.9)'; c.shadowBlur = 8;
  for (let b = 0; b < 2; b++){
    const a = _sHash(gx + seed, gz, b) * 6.28;
    let px = cx - Math.cos(a) * r * 0.8, py = cy - Math.sin(a) * r * 0.5;
    c.beginPath(); c.moveTo(px, py);
    for (let s2 = 0; s2 < 4; s2++){
      px += Math.cos(a) * r * 0.4 + (_sHash(gz + seed, gx, b * 5 + s2) - 0.5) * r * 0.5;
      py += Math.sin(a) * r * 0.25 + (_sHash(gx + seed, gz, b * 7 + s2) - 0.5) * r * 0.3;
      c.lineTo(px, py);
    }
    c.stroke();
  }
  c.shadowBlur = 0;
},
crack(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(46,36,28,0.85)'; c.fill();
  const pulse = 0.6 + 0.4 * Math.sin(T * 2 + gx * 1.5 + gz);
  c.strokeStyle = 'rgba(255,' + (90 + 60 * pulse | 0) + ',10,' + (0.75 + 0.2 * pulse) + ')';
  c.lineWidth = Math.max(1.5, r * 0.06);
  c.shadowColor = 'rgba(255,120,20,0.8)'; c.shadowBlur = 10 * pulse;
  for (let i = 0; i < 3; i++){
    const a = _sHash(gx, gz, i) * 6.28;
    let px = cx + Math.cos(a) * r * 0.15, py = cy + Math.sin(a) * r * 0.1;
    c.beginPath(); c.moveTo(px, py);

/* ══════════════════════════════════════════════════════════════════════════
   ⏱ THE LOAD SCHEDULE — why the board used to freeze when a battle opened.
   ══════════════════════════════════════════════════════════════════════════
   MEASURED, standalone at 1280x800 DPR 1, an 8x7 map with 10 units and the
   dark-forest location, driving frame() by hand (three cold runs):

     board:init handler (buildStage + heightfield + defs + units)   0.6-0.8 ms
     frame 0                                              269 / 305 / 390 ms
       ├─ vista world bake (sky+land+art+post+world)         94 / 106 / 118
       ├─ bakeTerrain #1                                    107 / 130 / 145
       ├─ vista grade, first call                            56 /  56 /  59
       └─ everything else (sprites, pylons, dressing, fx)         ~10
     frame 1  (bakeTerrain #2 — tone lock iteration 2)      59 / 59 / 65
     frame 2  (bakeTerrain #3 — tone lock iteration 3)      69 / 71 / 68
     ─────────────────────────────────────────────────────────────────
     435-523 ms of blocking, of which ONE UNBROKEN BLOCK of 269-390 ms.

   Ruled OUT by the same instrumentation, so nobody re-audits them:
     backdrop plate decode + buildPlate   0.2 ms  (and already in an onload)
     sprite decode / applyDefs+applyUnits 1.2 ms  with ten 1 MB stills
     isPixelArt probe                     0.0 ms  (already budgeted 4/frame)
     layout / buildHeightfield / braziers  <0.1 ms

   So there is no single item to delete: three bakes that all have to happen.
   What was wrong is that they all happened in the SAME frame, and the two
   refinement bakes in the two frames straight after it — 435 ms in which the
   browser never got a turn, so no input was dispatched and rAF was starved,
   which is why an opening animation would have frozen along with everything
   else.

   THIS METERS THEM: at most one heavy item per frame, in the order the board
   needs them, with the pure-refinement work pushed off the first-interactive
   path entirely.

     step 0  nothing heavy   ~2 ms   ← input is live HERE, and the opening starts
     step 1  vista bake      ~106 ms
     step 2  bakeTerrain #1  ~130 ms ← the board is now correct
     step 3  vista grade     ~59 ms  ← …and correctly graded
     step 12 bakeTerrain #2  ~59 ms  ┐ the tone lock's closed-loop refinement.
     step 20 bakeTerrain #3  ~68 ms  ┘ It converges worstErr to ~2.4 luma and
             nothing else depends on it, so it is DEFERRED rather than paid
             before the player can act — 127 ms off the critical path.

   ⚠ THE SCHEDULE IS BY FRAME ORDINAL, NOT BY CLOCK. A wall-clock schedule
   cannot be verified in a pane where rAF does not fire, and it degrades badly
   on a slow device: at 20 fps a 400 ms hold would still be metering work the
   board wanted at frame 3. Ordinals stretch with the device, which is the
   behaviour that is actually wanted for a refinement.
   ⚠ Nothing here changes WHAT is drawn. Every gate below only decides WHICH
   FRAME a pass first runs on; the pass itself is untouched, and once the
   schedule retires (`LOADQ.on = false`) every call site is exactly what it
   was. A gate that is never opened would be a permanently broken board, so
   step 21 retires the whole thing unconditionally. */
const LOADQ = { on:false, step:-1, terrainAt:[2,12,20], marks:[] };

  /* -1 because frame() increments BEFORE it reads: the first frame is step 0. */
  LOADQ.on = true; LOADQ.step = -1; LOADQ.marks.length = 0;

/* one call per item per frame; `what` is 'vista' | 'terrain' | 'grade'. */

  if (!LOADQ.on) return true;
  const s = LOADQ.step;
  if (what === 'vista')   return s >= 1;
  if (what === 'grade')   return s >= 3;
  if (what === 'terrain') return LOADQ.terrainAt.indexOf(s) >= 0;

/* ══════════════════════════════════════════════════════════════════════════
   🎬 THE REVEAL — the board pulled back out of darkness.
   ══════════════════════════════════════════════════════════════════════════
   The owner's brief: "a zooming out from darkness like Yu-Gi-Oh Master Duel".

   ⚠ IT IS NOT DRIVEN BY frame(). That is the whole design decision. rAF is

   and an animation that hides a freeze is still a freeze. So it is TWO
