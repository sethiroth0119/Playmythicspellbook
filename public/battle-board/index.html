<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythic Spellbook — Battle Board (Stage Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=EB+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   MYTHIC SPELLBOOK — BATTLE BOARD / STAGE PROTOTYPE
   Single file, no libraries, no external art. Procedural everything.

  ╔═════════════════════════════════════════════════════════════════════════╗
  ║  PORT BRIEF FOR CLAUDE CODE — THREE.JS + WEBGPU                          ║
  ║                                                                            ║
  ║  This file is the ART + BEHAVIOUR TARGET, not the shipping renderer.       ║
  ║  It is written with a hand-rolled perspective projector so the camera,     ║
  ║  lighting, sprite motion and summon choreography can be tuned and seen     ║
  ║  today. Port it to Three.js with the WebGPURenderer, keeping every         ║
  ║  number below — they are the look.                                         ║
  ║                                                                            ║
  ║  1) CAMERA — match exactly. See CONFIG.camera.                            ║
  ║       PerspectiveCamera(fov 38°, near .1, far 200)                        ║
  ║       fov 39.5° · position (0, 9.04, 9.76) · lookAt (0, 0.30, 0.20)       ║
  ║       ≈ 41° downward pitch — the low hero angle from the reference.       ║
  ║       Board is 8 wide × 7 deep, tiles of 1 world unit. NOT ortho.        ║
  ║       Keep the projection centre biased to SAFE.centre (below) so the      ║
  ║       stage sits in the gap between the UI panels.                        ║
  ║                                                                            ║
  ║  2) RENDERER — WebGPU first, WebGL2 fallback:                             ║
  ║       new THREE.WebGPURenderer({ antialias:true })                        ║
  ║       renderer.setPixelRatio(min(devicePixelRatio, 2))                    ║
  ║       ACESFilmic tone mapping, exposure 1.05, sRGB output.                ║
  ║       Post chain: bloom (strength .55, radius .4, threshold .82) →        ║
  ║       subtle vignette → film grain 0.015. The glow on runes, braziers     ║
  ║       and summons is expected to come from bloom, not from the sprites.   ║
  ║                                                                            ║
  ║  3) SPRITES — "crisp" is the requirement. Rules:                          ║
  ║       • Units are camera-facing billboards on a PlaneGeometry, NOT        ║
  ║         full 3D meshes. Use THREE.Sprite or a Y-billboarded plane so      ║
  ║         they never lean with the camera.                                  ║
  ║       • Texture filter: magFilter = NearestFilter (or LinearMipmap +      ║
  ║         anisotropy 8 for painted art). NO blur on the silhouette.         ║
  ║       • alphaTest 0.5 so edges stay hard and they cast crisp shadows.     ║
  ║       • Sprite sheets: 8-frame idle, 8-frame walk, 6-frame attack,        ║
  ║         6-frame hurt, 10-frame death, driven at 12fps by UV offset in     ║
  ║         a custom material — NOT by swapping textures per frame.           ║
  ║       • Movement is tile-to-tile with the exact easing in moveUnit():     ║
  ║         cubic ease-in-out over 340ms + a 0.28-unit hop arc + squash on    ║
  ║         take-off and land + dust burst on landing. Snap to tile centre    ║
  ║         at the end — never leave a unit off-grid.                         ║
  ║       • Position rounding: snap final screen position to whole device     ║
  ║         pixels to stop shimmer on slow drifts.                            ║
  ║                                                                            ║
  ║  4) SUMMON — the Yu-Gi-Oh beat, sequenced in summonSequence():            ║
  ║       t0     card lifts out of the hand, tilts to face the camera, glow   ║
  ║       160ms  card flies along a bezier to the target tile, rotating flat  ║
  ║       520ms  card lands face-down, tile rune circle ignites               ║
  ║       640ms  card FLIPS face-up (rotateY 180°) — the reveal               ║
  ║       780ms  white flash + shockwave ring + pillar of light from the tile ║
  ║       820ms  UNIT RISES out of the tile (y −1.1 → 0) over 420ms with a    ║
  ║              back-ease, scaling 0.7 → 1.0                                 ║
  ║       900ms  CARD DISSOLVES into embers and is destroyed. The card must   ║
  ║              never return — the sprite is now the unit of record.         ║
  ║       1350ms landing thump, dust ring, unit enters idle loop              ║
  ║       In Three.js the flying card is a textured plane in the same scene   ║
  ║       (so it lights correctly), not a DOM element.                        ║
  ║                                                                            ║
  ║  5) DYNAMIC LIGHT — the sun/moon MUST match the battle's time of day.     ║
  ║       BATTLE.timeOfDay is the source of truth and comes from the match    ║
  ║       state (the Weather card: Daytime / Dusk / Night / Dawn). Each       ║
  ║       preset in TIME_PRESETS gives azimuth, elevation, colour, intensity, ║
  ║       ambient, sky gradient and fog. Build them as:                       ║
  ║         DirectionalLight (sun or moon)  — castShadow, PCFSoft, 2048 map,  ║
  ║           shadow camera fitted to the board bounds                        ║
  ║         HemisphereLight  (sky → ground bounce)                            ║
  ║         AmbientLight     (preset.ambient)                                 ║
  ║         + rim light opposite the key, tinted by preset.rim                ║
  ║       Shadows: unit shadow direction and length are derived from the      ║
  ║       light vector (see lightVector()) — at dusk they stretch long        ║
  ║       across the tiles, at noon they pool underfoot. Braziers add         ║
  ║       PointLights (flicker 8Hz, radius 4) that survive at night when      ║
  ║       the sun preset dims out.                                            ║
  ║       When the weather card flips mid-match, LERP between presets over    ║
  ║       ~2.5s — never cut.                                                  ║
  ║                                                                            ║
  ║  6) BATTLEMAP EDITOR — THIS map object is the format. Point the editor    ║
  ║     at it and let it read/write the same JSON:                            ║
  ║         MAP = { id, name, cols, rows, timeOfDay, ground,                  ║
  ║                 tiles:[{x,z,type,prop,elev,rot}], spawns:{mine,foe} }     ║
  ║       tile.type : 'normal' | 'blocked' | 'hazard' | 'objective' | 'spawn' ║
  ║       tile.prop : null | 'house' | 'wreck' | 'crater' | 'barricade'       ║
  ║                   | 'pylon' | 'bones'                                     ║
  ║       tile.elev : world units of raise (0, .18, .36 …) — the renderer     ║
  ║                   already offsets geometry, shadows and unit feet by it.  ║
  ║       Editing a tile should hot-reload the stage with no page refresh —   ║
  ║       call buildStage() again, which is pure from MAP.                    ║
  ║       Props are billboards too; swap them for GLTF instances if you       ║
  ║       want parallax, but keep the same anchor + footprint.                ║
  ║                                                                            ║
  ║  7) UI SAFE AREAS — NO UI IS DRAWN HERE ON PURPOSE. The stage is inset    ║
  ║     to leave the gutters the existing battle HUD needs (matching the      ║
  ║     live screenshot):  left 384 · right 244 · top 78 · bottom 292 (css    ║
  ║     px at 1440p, scaled proportionally). SAFE in CONFIG. Mount the        ║
  ║     existing HUD as transparent DOM over this canvas — do not rebuild     ║
  ║     it, and do not let the stage grow into those gutters.                 ║
  ║     Press G to toggle the guide overlay while developing.                 ║
  ║                                                                            ║
  ║  8) KEEP THESE FUNCTIONS — port them 1:1, they are the game board API:    ║
  ║       buildStage()            rebuild everything from MAP                 ║
  ║       tileAt(x,z) / tileKey   grid lookup                                 ║
  ║       spawnUnit(def,x,z,side) place a unit instantly                      ║
  ║       summonUnit(cardId,x,z)  the full card→sprite ceremony               ║
  ║       moveUnit(id,x,z)        crisp tween with hop + dust                 ║
  ║       attackUnit(id,tid)      lunge, impact flash, damage float           ║
  ║       killUnit(id)            death dissolve → grave                      ║
  ║       setTimeOfDay(key)       lerp the whole lighting rig                 ║
  ║       focusTile(x,z) / clearFocus()                                       ║
  ║       Board.on('tileClick'|'unitClick'|'cardPlayed'|'summonComplete')     ║
  ║     These already dispatch CustomEvents — replace the demo bodies, keep   ║
  ║     the signatures so the HUD wiring never changes.                       ║
  ╚═════════════════════════════════════════════════════════════════════════╝ */
:root{ --gold:#d2a44e; --gold-hi:#f6dc95; }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:100%; height:100%; overflow:hidden; background:#05040a; }
body{ font-family:"EB Garamond",serif; color:#e9dab2; user-select:none; }
/* NOTE: <canvas> is a REPLACED element — `inset:0` alone does NOT stretch it
   (it falls back to the intrinsic 300x150). Always size it explicitly. */
#stage{ position:fixed; top:0; left:0; width:100vw; height:100vh; display:block; }

/* summon card — DOM overlay in the prototype; becomes a textured plane in Three.js */
.flycard{
  position:fixed; z-index:6; width:186px; height:260px; border-radius:10px;
  transform-style:preserve-3d; pointer-events:none; will-change:transform,opacity;
  transition:none;
}
.flycard .face, .flycard .back{
  position:absolute; inset:0; border-radius:7px; backface-visibility:hidden; overflow:hidden;
  border:2px solid rgba(246,220,149,.85);
  box-shadow:0 10px 26px rgba(0,0,0,.8), 0 0 26px rgba(246,220,149,.4);
}
.flycard .back{
  transform:rotateY(180deg);
  background:radial-gradient(60% 45% at 50% 45%, rgba(140,70,220,.5), transparent 70%), linear-gradient(160deg,#1b1430,#0a0714);
  display:grid; place-items:center; color:rgba(246,220,149,.75); font-size:58px;
}
.flycard .face{ display:flex; flex-direction:column; }
.flycard .art{ flex:1; display:grid; place-items:center; }
.flycard .nm{
  padding:8px 5px; text-align:center; font-family:"Cinzel",serif; font-weight:700; font-size:15px;
  letter-spacing:.04em; color:#f6dc95; background:linear-gradient(180deg, rgba(12,9,18,.9), rgba(6,4,10,.95));
  border-top:1px solid rgba(246,220,149,.4);
}

/* hand — placeholder cards so the summon can be demoed. The REAL hand is part of
   the existing HUD; Claude Code replaces this strip with it. */
.hand{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  display:flex; gap:15px; z-index:5; pointer-events:auto;
}
.hcard{
  width:186px; height:260px; border-radius:10px; position:relative; cursor:pointer;
  border:2px solid rgba(210,164,78,.6); overflow:hidden;
  background:linear-gradient(170deg,#161024,#08050e);
  box-shadow:0 10px 22px rgba(0,0,0,.75);
  transition:transform .22s cubic-bezier(.2,.9,.3,1.3), box-shadow .22s, border-color .22s;
}
.hcard:hover{ transform:translateY(-20px) scale(1.05); border-color:rgba(246,220,149,.9); box-shadow:0 18px 34px rgba(0,0,0,.8), 0 0 26px rgba(246,220,149,.35); }
.hcard.armed{ transform:translateY(-26px) scale(1.07); border-color:#f6dc95; box-shadow:0 0 0 2px rgba(246,220,149,.5), 0 0 34px rgba(246,220,149,.55); }
.hcard .cost{
  position:absolute; top:9px; left:9px; z-index:2; width:44px; height:44px; border-radius:50%;
  display:grid; place-items:center; font-family:"Cinzel",serif; font-weight:900; font-size:21px;
  color:#f6ecd2; border:1.5px solid rgba(246,220,149,.8); background:rgba(8,6,14,.9);
}
.hcard .art{ position:absolute; inset:0; display:grid; place-items:center; }
.hcard .nm{
  position:absolute; left:0; right:0; bottom:0; padding:8px 4px; text-align:center;
  font-family:"Cinzel",serif; font-weight:700; font-size:15px; color:#f6dc95;
  background:linear-gradient(180deg, rgba(10,8,16,.5), rgba(6,4,10,.96));
}
.hcard .el{
  position:absolute; left:0; right:0; bottom:34px; text-align:center;
  font-family:"Cinzel",serif; font-weight:700; font-size:12px; letter-spacing:.16em;
}

.hint{
  position:fixed; left:50%; bottom:296px; transform:translateX(-50%); z-index:7;
  font-size:12.5px; font-style:italic; color:#6e6350; white-space:nowrap;
  animation:hintFade 7s ease forwards; pointer-events:none;
}
@keyframes hintFade{ 0%,70%{ opacity:1; } 100%{ opacity:0; } }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<!-- The demo hand + hint are STANDALONE ONLY. Embedded, the real hand is
     the game's own HUD mounted as transparent DOM over this canvas. -->
<div class="hand" id="hand"></div>
<div class="hint" id="hint">click a card, then a tile — or click a unit and a tile to move it</div>


<script>window.BB_BUILD='v120x3';
"use strict";
/* ══════════════════════════════════════════════════════════════════
   CONFIG — camera + UI safe areas. Port these numbers verbatim.
   ══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  camera:{ fov:39.5*Math.PI/180, pos:{x:0,y:9.04,z:9.76}, target:{x:0,y:0.30,z:0.20} },
  /* The arena (board + its four pillars) is taller above the floor than below
     it, so it does not sit centred in the safe box on its own. This nudges the
     whole projection so the scene is optically centred, which is what lets the
     FOV be tightened without the pillar tops clipping. */
  viewShiftY: -40,
  /* gutters reserved for the EXISTING battle HUD (added by Claude Code) */
  SAFE:{ left:384, right:244, top:78, bottom:292 },
  /* `tile` is now the hex CIRCUMRADIUS (centre → vertex) in world units; it
     used to be the edge length of a square cell. 1/√3 is not arbitrary: it
     makes hexW = tile*√3 = 1.0, so one pointy-top hex is exactly as WIDE as
     the 1.0 square it replaces. Unit sprites are sized from `def.h` in world
     units and know nothing about the lattice, so keeping the width fixed is
     what keeps a unit the same size relative to its tile as before the hex
     conversion — pick any other number and every sprite silently rescales. */
  tile: 1/Math.sqrt(3), wall:0.30
};

/* ══════════════════════════════════════════════════════════════════
   MAP — THE BATTLEMAP EDITOR OWNS THIS OBJECT. Read/write as JSON.
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   LOCATIONS — a LOCATION CARD swaps the board art (and optionally the
   time of day). Register every location here; the editor and the card
   database both read this table.
     image     : ground texture, laid flat on the play plane in perspective
     backdrop  : the environment BEHIND the board — the world this location
                 sits in. Drawn behind the arena and graded by the sky, so a
                 location card changes the whole horizon, not just the floor.
     timeOfDay : null keeps the current sky, or force 'dawn|day|dusk|night'
     tint      : optional extra colour grade over the ground
   Play one with:  Board.setLocation('dark-forest')
   ══════════════════════════════════════════════════════════════════ */
const LOCATIONS = {
  'dark-forest':{ name:'The Dark Forest', image:'../assets/board/locations/dark-forest-ground.jpg', backdrop:'../assets/board/locations/dark-forest-backdrop.jpg', timeOfDay:null, tint:null },
  /* Register the rest as their art lands — same shape:
  'open-field'   :{ name:'Open Field',    image:'assets/loc/open-field.jpg',
                    backdrop:'assets/loc/open-field-bg.jpg',    timeOfDay:'day'   },
  'infected-city':{ name:'Infected City', image:'assets/loc/infected-city.jpg',timeOfDay:'dusk'  },
  'crystal-caves':{ name:'Crystal Caves', image:'assets/loc/crystal-caves.jpg',timeOfDay:'night' },
  */
};
const DEFAULT_LOCATION = 'dark-forest';
/* The HOST registers every playable location (from the card database /
   Battlemap Editor) with Board.setLocations({...}). Same shape as above. */
function setLocations(table, keepDefault){
  if (!table || typeof table !== 'object') return;
  if (!keepDefault) for (const k in LOCATIONS) if (k !== DEFAULT_LOCATION) delete LOCATIONS[k];
  for (const k in table){
    const L = table[k]; if (!L) continue;
    LOCATIONS[k] = { name:L.name || k, image:L.image || null, backdrop:L.backdrop || null,
                     timeOfDay:L.timeOfDay || null, tint:L.tint || null };
  }
}

/* 📐 BOARD SIZE — ONE source of truth in this file. HEXSPEC §7 pins the shipped
   board to BOARD_W × BOARD_H on the GAME side and requires the canvas to be FED
   from them, never to re-type them; the host does that through `board:init` /
   `board:map`. This object is only the fallback for a payload that carries no
   dimensions (the standalone preview, and any host that predates the resize).
   Do not write 14 or 12 anywhere else in this file. */
const BOARD_DEFAULT = { cols:14, rows:12 };

const MAP = {
  id:'ruins-downtown-01', name:'Overgrown Downtown',
  cols: BOARD_DEFAULT.cols, rows: BOARD_DEFAULT.rows,
  timeOfDay:'day',
  location: DEFAULT_LOCATION,
  ground:{ base:'#6b5c3e', accent:'#8a7846' },
  tiles:[
    { x:6, z:1, prop:'barricade' },
    { x:7, z:2, prop:'pylon', elev:0.18 },
    { x:0, z:3, prop:'bones' },
    { x:5, z:3, prop:'crater', type:'hazard' },
    { x:3, z:3, type:'objective' },
    { x:4, z:3, type:'objective' },
    { x:2, z:4, prop:'crater', type:'hazard' },
    { x:0, z:5, prop:'pylon', elev:0.18 },
    { x:6, z:6, prop:'bones' }
  ],
  /* live board events — the game's EVENT SYSTEM owns this list. EMPTY by design:
     the host pushes the match's real events via board:init / board:events. It used
     to hold three hardcoded demos, which is why the stage showed events that were
     not in the game. */
  events:[],
  spawns:{ mine:[[2,6],[3,6],[4,6],[5,6]], foe:[[2,0],[3,0],[4,0],[5,0]] }
};

/* ══════════════════════════════════════════════════════════════════
   TIME OF DAY — sun/moon presets. BATTLE.timeOfDay drives the rig.
   ══════════════════════════════════════════════════════════════════ */
const TIME_PRESETS = {
  dawn:{ az:-0.85, elev:0.20, key:'#ffb46a', keyI:0.95, ambient:'#3a3350', ambI:0.42,
         sky:['#1a1230','#4a2c3a','#8a5a44'], fog:'#2a1c2a', rim:'#7fa8ff', body:'sun', disc:'#ffd9a0', haze:.34 },
  day:{ az: 0.28, elev: 0.78, key:'#fff2c8', keyI:1.15, ambient:'#5a6480', ambI:0.55,
         sky:['#18243c','#31465f','#6b7f92'], fog:'#3a4454', rim:'#cfe4ff', body:'sun', disc:'#fff6d8', haze:.22 },
  dusk:{ az: 0.92, elev: 0.16, key:'#ff7a3c', keyI:1.0, ambient:'#43305a', ambI:0.44,
         sky:['#160f2c','#4a2038','#a04628'], fog:'#2c1a2c', rim:'#a06cff', body:'sun', disc:'#ff9a52', haze:.4 },
  night:{ az:-0.42, elev: 0.62, key:'#7fa6e8', keyI:0.48, ambient:'#0e1730', ambI:0.26,
         sky:['#01030b','#050b1c','#0b1530'], fog:'#050a18', rim:'#6f9ce8', body:'moon', disc:'#cfe0ff', haze:.14 }
};
const BATTLE = { timeOfDay: MAP.timeOfDay };

/* ══════════════════════════════════════════════════════════════════
   UNIT DEFS — procedural stand-ins. Swap `draw` for sprite-sheet UVs.
   data-art-slot equivalent: def.sheet = '<path to sprite sheet>'
   ══════════════════════════════════════════════════════════════════ */
/* UNIT REGISTRY — the HOST fills this. Each entry:
     { name, color, h (world-units tall), art (image URL, optional),
       sheet:{src, frames, fps, rows:{idle,walk,attack,hurt,death}} }
   `art` alone is enough: a single still is billboarded and animated by
   the procedural bob/squash. A `sheet` adds real frame animation.
   Anything with no art falls back to the procedural painter below, so a
   missing texture never leaves a hole on the board. */
const UNIT_DEFS = Object.create(null);
const PROC_KEYS = ['wyrm','imp','knight','mage','crystal','bunny','jelly'];
const PROC_DEFS = {
  wyrm:{ name:'Wyrm', color:'#7fb4ff', h:1.30 },
  imp:{ name:'Imp', color:'#8fd84a', h:0.92 },
  knight:{ name:'Knight', color:'#cfd6e4', h:1.16 },
  mage:{ name:'Mage', color:'#ff8a3c', h:1.06 },
  crystal:{ name:'Crystal', color:'#5fe8d5', h:1.12 },
  bunny:{ name:'Bunny', color:'#c8a8ff', h:0.98 },
  jelly:{ name:'Jelly', color:'#4ad8c8', h:0.86 }
};
Object.assign(UNIT_DEFS, PROC_DEFS);
/* image cache for host-supplied art / sheets */
const ART_CACHE = Object.create(null);
function artImage(src){
  if (!src) return null;
  let rec = ART_CACHE[src];
  if (!rec){
    rec = ART_CACHE[src] = { img:new Image(), ok:false };
    rec.img.onload = () => { rec.ok = true; };
    rec.img.onerror = () => { rec.ok = false; rec.bad = true; };
    if (!/^data:/.test(src)) rec.img.crossOrigin = 'anonymous';
    rec.img.src = src;
  }
  return rec.ok ? rec.img : null;
}
let HAND = [];   /* the real hand lives in the game HUD */

/* ══════════════════════════════════════════════════════════════════
   ENGINE STATE
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   GROUND / LOCATION ART
   The board texture is mapped onto the play plane in true perspective by
   slicing it into thin depth bands (a 2D canvas can only do affine
   transforms, so we integrate the projection per band). Because the
   texture lies flat in WORLD space, each band's source strip maps
   linearly to its world-z range — the result is a correct projection.
   (Three.js: this becomes a single PlaneGeometry with the texture on it —
   delete this function and set material.map. Keep setLocation().)
   ══════════════════════════════════════════════════════════════════ */
/* legal-target overlay pushed by the game each render */
const PAINT = { move:new Set(), attack:new Set(), place:new Set(), swap:new Set(), sel:null };
/* 🏹 THE XCOM TELEGRAPH — pushed by the game as board:tele.
   Everything here is a RENDER INPUT, exactly like PAINT: the board owns no
   pathfinder and must never derive a route of its own. `path` is the ordered
   tile list the game's OWN getMovePath() returned for the hovered destination
   — the same call moveUnit() makes to decide which tiles the unit walks over
   and which traps fire — so the drawn route and the walked route are the same
   array, not two answers that happen to agree today.
   ⚠ Do NOT be tempted to interpolate a straight line between unit and cursor
   when `path` is empty. An empty path means the game said "no legal route",
   and drawing one anyway is the UI-lies-about-the-rules bug in its purest
   form: the player would watch the unit walk somewhere else.
   `rev` is bumped by the message handler; the contour cache keys off it so a
   14x12 boundary trace happens on a selection change, not 60 times a second.
   `side` says WHOSE route this is — 'mine' when the player is previewing a
   move, 'foe' when the AI is walking one on its own turn. It exists because
   "where I am going" and "where IT is going" must never be the same colour,
   the same separation BAR R2 demands between the move region and the threat
   wash. It is pushed by the host, never inferred here: the board does not
   know whose turn it is. */
const TELE = { path:[], dest:null, arc:null, threat:new Set(), side:'mine', rev:0 };
/* dead units' grave markers, pushed by the game */
const TOMBS = [];
/* 🏚 lootable ruins (car / church / school / hospital / house), pushed by the
   game as board:structs. Same lifecycle rule as TOMBS: the game owns loot
   state entirely and this list is a render input, never a source of truth. */
const STRUCTS = [];
/* 🚚 the three SCP containment trucks — the control points, pushed by the game
   as board:cps. Same lifecycle rule as TOMBS and STRUCTS: the game owns the
   capture rule entirely and decides who holds what; this list is a render

function drawGroundSlices(img, alpha){

       projecting to a horizontal trapezoid — which is the entire reason the
       four corners below can be reduced to one axis-aligned drawImage rect.
       Band the ground in world Z under yaw and every rect is a sheared quad
       squeezed into an upright box, i.e. the photograph smears sideways.

/* ── responsive sizing, projection centred on the SAFE box ── */
let VIEW = { cx:0, cy:0, scale:1 };
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);

     a <canvas> is a REPLACED element: `inset:0` does not stretch it, so clientWidth
     can report the intrinsic 300x150 and collapse the whole stage.
     (clientWidth/clientHeight are also READ-ONLY — never assign to them.) */

  H = Math.max(1, window.innerHeight || cv.clientHeight || 720);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* Reserved UI gutters, scaled to the viewport. */
  const k = clamp(W/1920, .5, 1.15);
  const S = CONFIG.SAFE;
  let l = S.left*k, r = S.right*k, t = S.top*k, b = S.bottom*k;
  /* COLLAPSE GUARD: on a small window the gutters could exceed the viewport and
     invert the projection. Never let them eat more than 62% wide / 55% tall. */
  const maxH = W*0.62, maxV = H*0.55;
  if (l + r > maxH){ const s = maxH/(l+r); l *= s; r *= s; }
  if (t + b > maxV){ const s = maxV/(t+b); t *= s; b *= s; }
  VIEW.cx = l + (W - l - r)/2;
  VIEW.cy = t + (H - t - b)/2 + (CONFIG.viewShiftY || 0) * clamp(H/1080, .6, 1.2);
  VIEW.box = { l, r, t, b, w:Math.max(120, W-l-r), h:Math.max(90, H-t-b) };
  VIEW.scale = (VIEW.box.h/2) / Math.tan(CONFIG.camera.fov/2);
}

/* ══════════════════════════════════════════════════════════════════

/* ══════════════════════════════════════════════════════════════════

   shifted +½ column to the right; no other row is shifted.

/* boardExtent() — the ONE answer to "how far does the LATTICE reach", as half

   braziers, backdrop anchor); all of them were only right while a tile was one
   world unit square. Because odd rows are shifted +½ column the tile centres
   are NOT symmetric about the origin — take the wider side for both so the
   frame stays optically centred instead of leaning left.

function boardExtent(){

/* 🌍 GROUND EXTENT — how far the DIORAMA reaches. That is a different question

   lattice's edge and still call boardExtent(). The apron, the location art and
   the ground slices do not: BAR R1 is explicit that "the map IS the frame — the diorama fills the screen edge to

   and a floor that stopped at ext+wall left the bottom third of the in-game
   host rect as bare backdrop with a gold-railed plate hovering above it.
   So walk the floor out until it leaves the box: cast the screen row just
   below the box back onto y=0 and take that as the NEAR reach, then take the

   lattice, deliberately — the backdrop's horizon is anchored to it (see
   drawOneBackdrop) and pushing the floor past the horizon would erase the sky

     camera can turn, "how far away is the far edge" is the support function of
     that rectangle in the eye's own −V direction, which is |e.x·sin yaw| +
     |e.z·cos yaw|. At yaw 0 that is e.z and at 90° it is e.x — take the world

     to be under it, with the location photograph laid over the far columns. */

     from the world origin, which is where the board is. Pan the focus a third
     of the way across the field and the board's far edge is now a third of the
     field FURTHER from the quad's centre than it was; without this term the
     apron's far edge lands in the middle of the lattice and the location
     photograph is laid over the back rows. */

     (sU, sV) in the frame, so the board occupies V ∈ [sV−supV, sV+supV]: the
     far reach only has to cover supV−sV and the near reach only supV+sV.
     ⚠ THE BUG THIS REPLACES: this used |frameV(0,0)| and added it to BOTH,
     which grows the quad in the direction the board is NOT in as well. Because
     skirtRange() bounds the skirt by this quad, panning 2.67 away from the
     centre roughly DOUBLED the quad's depth and, with the same treatment on U,
     its area — and the painted skirt went from 164 cells to 342-368. Measured
     as a bake of 18-39 ms at every yaw with pan (0,0) and 130-300 ms as soon as
     pan and a non-cardinal yaw were combined, which is the one input
     combination the free camera exists to allow. Each axis had been varied with
     the other at zero, so nothing caught it.

     the FLOOR instead: out.x below is set from the frustum's own floor

     outside the frustum, i.e. not in the picture. Leaving |sU| in the floor
     forced the quad wider than the frame at every panned pose and was the last

       LATERAL distance instead and collapses the apron to nothing at 90°.

       the ceiling with the floor would let a pan clip the floor the frustum

    out.near = clamp(frameV(CAM.pos.x + d.x*t, CAM.pos.z + d.z*t),

}

}
function tileElev(x,z){ const t = tileAt(x,z); return t && t.elev ? t.elev : 0; }
function tileBlocked(x,z){
  const t = tileAt(x,z);
  if (t && (t.type==='blocked' || t.prop==='pylon')) return true;
  /* an event may block the tile (e.g. a standing structure) */
  return eventsAt(x,z).some(e => (EVENT_TYPES[e.type]||{}).blocks);
}

/* 📏 Ground-circle radius, in PIXELS.
   Every ground ring in this file used to size itself by projecting a SECOND
   point offset along world +X and measuring the screen gap. That is only the
   right length while the camera looks down -Z: as it yaws toward the X axis the
   gap shrinks continuously to zero and every ring deflates to nothing, silently
   (CONTRACT §2 Tier 2.1). `p.s` is already pixels-per-world-unit at that depth,
   so worldR*p.s is the same number at yaw 0 and stays correct at every other
   yaw — and costs one projection instead of two.
   Radii that must FIT INSIDE a tile are written as a fraction of tileR(), the
   hex INRADIUS, because that is the shortest centre→edge distance and the only
   bound that guarantees the ring stays on its own tile. On the old square cell
   the inradius happened to be 0.5, which is why those constants used to look
   like bare fractions of half a tile — they were fractions of the inradius all
   along, just never named. Radii that describe an OBJECT (a pillar's bowl rim,
   a unit's shadow) stay in world units: they scale with the prop, not the
   lattice. */
function ringPx(p, worldR){ return worldR * p.s; }

/* light direction from the preset (used for shadows + rim) */
function lightVector(){
  const az = LIGHT.az, el = LIGHT.elev;
  return { x:Math.sin(az)*Math.cos(el), y:Math.sin(el), z:-Math.cos(az)*Math.cos(el) };
}

/* ══════════════════════════════════════════════════════════════════
   STAGE BUILD — pure from MAP. Editor calls this to hot-reload.
   ══════════════════════════════════════════════════════════════════ */
/* 📏 SPRITE SCALE — how tall one unit of `def.h` reads on this lattice.
   `def.h` is authored in BOARD TILES (the same convention PYLON_ART's
   widthWorld/heightWorld states outright) and the game sends the same literal
   1.05 for every unit (index.html `_bbUnitDefs`). On the 8×7 board that read
   at ~1/13 of the stage height, because eight columns across the real in-game
   .board-area rect (802×688) leave ~75px per column. Fourteen columns leave
   ~57px, so the SAME 1.05 reads at ~1/17 — the sprites shrank with the tiles
   even though nothing about the units changed, and no camera fit can undo it:
   sprite height and hex width are locked to each other by def.h, so the only
   way to move one without the other is here. BAR R1 puts units at "roughly
   1/12 of frame height" and the user's requirement #3 is that they stay
   extremely clear on the board, so the stage scales what it DRAWS rather than
   pretending 1.05 describes the same picture at every board size. 1.30 puts a
   unit at ~1.35 hex widths tall, which is where the reference sits.
   ⚠ Read in exactly TWO places — drawUnit() and unitScreenBox() — and it has
   to stay that way. unitScreenBox is what every host-side VFX and cinematic
   anchors off (CONTRACT §1.5), so a sprite drawn at one scale and boxed at
   another puts every nameplate and every projectile in the wrong place, with
   nothing to catch it. */
const SPRITE_SCALE = 1.30;
function unitWorldH(def){ return (def && def.h || 1) * SPRITE_SCALE; }

/* x of the LATTICE's own centre. Odd rows are shifted +½ column (HEXSPEC §2),
   so the tile centres span [−(cols−1)/2 , (cols−1)/2+½] hex widths and are not
   centred on the origin. Aiming the eye at 0 makes the fit reserve frame for a
   half column that only exists on one flank, which costs ~3.5% of hex size at
   14 columns — and hex size is exactly what this wave is trying to buy back.
   boardExtent() stays symmetric because the frame band is; this is only where
   the EYE looks. fitAim() below refines it further. */
function latticeCentreX(){ return MAP.rows > 1 ? hexW()*0.25 : 0; }

/* ══════════════════════════════════════════════════════════════════
   THE FIT — solve the camera to the HOST RECT, not to a remembered board.
   ══════════════════════════════════════════════════════════════════ */
/* This used to dolly the eye straight back by max(ext.x/4.0, ext.z/3.5, 1):
   the 8×7 board's extents were the reference framing and any bigger board
   simply moved the eye away until it fit the same optical box. That holds the
   board's SCREEN AREA constant and pays for the extra tiles entirely out of
   hex size and sprite size. Measured in the real in-game rect (802×688) the
   14×12 board came out 649×279px — 81% of the host's width but 41% of its
   height — with a 46px near-row hex and 30px units, while the same scene
   forced back to 8×7 framed at 599×284 with a 75px hex. Three times the
   tiles, the same plate, smaller everything, and BAR R1 says the opposite:
   "the map IS the frame".
   So fit to the HOST:
     • DISTANCE is solved in closed form from the widest row of tile CENTRES,
       so every centre lands inside the box and it is the outermost half-hexes
       that bleed off the edge rather than the whole board retreating from it.
     • PITCH is searched steep→shallow and takes the steepest value that still
       leaves a near-row sprite at least `spriteMin` of the box height. This
       trade has to be made against a number, not by eye: a steeper pitch
       fills more of the box vertically, but the apparent height of a standing
       sprite goes as (eye.z − tile.z)/depth², which collapses as the eye comes
       over the top — at 60° the near-row units are SHORTER than the far-row
       ones. Shallower fills less and keeps sprites tall. There is no pitch
       that satisfies both at 14 columns; the search picks the boundary
       instead of a literal, and re-picks it if the board ever changes size.
     • viewShiftY is re-derived from the resulting board bbox instead of
       staying at the −40 tuned for 8×7, so the leftover height is spent as
       sky above the far edge and floor below the near edge instead of as two
       dead bands.
   Pure function of MAP.cols/rows and VIEW.box: idempotent across repeated
   board:map, which matters because `map` fires on every host map push.
   (The free camera in a later wave replaces this with a real
   focus/yaw/pitch/dist rig — this is a fit, not a camera.) */
const CAM_FIT = {
  /* The band brackets BAR R1's "low isometric three-quarter, roughly 40° down".
     At 14×12 in the in-game rect the search settles at 43°; a smaller board
     has sprite headroom to spare and rides pitchHi. */
  pitchLo: 34*Math.PI/180,
  pitchHi: 52*Math.PI/180,
  pitchStep: Math.PI/180,
  fillX: 1.0,                  /* share of box width the outermost CENTRES span */
  skyShare: 0.58,              /* of the leftover height, how much sits above    */
  spriteMin: 1/13.5,           /* near-row sprite height / box height, the floor */
  targetY: CONFIG.camera.target.y
};

/* Point the eye at (tx, targetY, 0) from `dist` away at `pitch` below level.
   Yaw is fixed at 0 here on purpose: this is the FIT's NEUTRAL view, the one
   the search solves and the one viewShiftY is derived from. The free camera
   below orbits away from it and never re-runs the search, so the framing a
   player returns to with R is bit-for-bit the framing the fit produced. */
function camAt(pitch, dist, tx){
  const c = CONFIG.camera;
  c.target.x = tx; c.target.y = CAM_FIT.targetY; c.target.z = 0;
  c.pos.x = tx;
  c.pos.y = CAM_FIT.targetY + dist*Math.sin(pitch);
  c.pos.z = dist*Math.cos(pitch);
  buildCam();
}

/* ══════════════════════════════════════════════════════════════════
   🎥 THE FREE CAMERA — BAR requirement #2: "players can move the camera
   around the map with wasd, and turn the camera with q/e".
   ══════════════════════════════════════════════════════════════════
   Shape is the one CONTRACT §2 Tier 2 asks for — focus / yaw / pitch / dist,
   re-derived into CONFIG.camera every frame — with one deliberate difference:
   PITCH AND DIST ARE NOT PLAYER CONTROLS. They stay exactly where fitCamera()
   put them. Two reasons, both load-bearing:
     · ~11 ground ellipses in this file are squashed by a hardcoded
       ctx.scale(1,k) with k ∈ {.34 … .46} and NONE of them is derived from the
       camera (CONTRACT §2 Tier 2, "breaks under pitch"). Yaw leaves every one
       of them correct; pitch silently makes all eleven wrong.
     · the whole fit — the pitch search against sprite height, viewShiftY, the
       distance solve — exists to answer "how does this board sit in this host
       rect". A player-controlled dolly would fight it every frame.
   So the player gets an ORBIT and a PAN around the fitted view. That is what
   the requirement asks for and it is the part that cannot lie about geometry.

   CAM_BASE is the fit's answer, written once by fitCamera(). CAMERA is the
   player's offset from it. Keeping them apart is what lets a window resize
   (which re-runs the fit) preserve where the player was looking. */
const CAM_BASE = { tx:0, pitch:CAM_FIT.pitchLo, dist:12 };
const CAMERA = {
  pan:{ x:0, z:0 },      /* look-at offset from the fitted aim, WORLD units */
  yaw:0,                 /* radians; 0 is the fitted three-quarter view       */
  vel:{ x:0, z:0 },      /* pan velocity, world units/sec                     */
  yawVel:0,              /* rad/sec                                           */
  moving:false           /* true while anything is actually in motion         */
};
/* Rates. Pan is expressed in HEX WIDTHS per second rather than world units so
   it reads the same on any board size, and yaw in degrees so the number in the
   source is the number a player would describe. */
const CAM_MOVE = {
  pan: 6.0,              /* hex widths / sec at full deflection */
  yaw: 78*Math.PI/180,   /* rad / sec                            */
  accel: 11,             /* e-folding rate toward the target velocity */
  /* Below this the camera is PARKED, not crawling. Not 1e-4: the velocity
     decays exponentially, so a tighter threshold buys ~0.9s of invisible
     coasting during which terrainKey() keeps changing and the ground layer
     keeps re-baking every frame for motion of 0.006°/s. 4e-3 rad/s is 0.23°/s,
     which nobody can see, and it hands the cache back about half a second
     sooner. */
  stopEps: 4e-3
};

/* ── INTENT, from three senders that must not stack ──
   The camera can be driven from the standalone page's own keydown listener,
   from host-forwarded `board:key` edges, and from host-forwarded
   `board:camera` pulses — and the harness sends the last two TOGETHER. So none
   of them integrates anything: they all write the same −1..1 intent and
   camUpdate() integrates it once, against THIS document's dt. Add a sender
   that accumulates into pan/yaw directly and it double-counts, silently, at
   whatever ratio the two clocks happen to sit at. */
const CAM_HELD = Object.create(null);      /* from key edges: fwd/back/left/right/yawL/yawR */
const CAM_PULSE = { x:0, z:0, yaw:0, at:-1e9 };   /* from board:camera */
/* A pulse is re-sent every animation frame while a key is held, so anything
   older than a few frames means the sender stopped. 150ms is ~9 frames at
   60Hz — long enough to survive a hitch, short enough that a dropped keyup
   cannot leave the camera sliding. */
const CAM_PULSE_TTL = 0.15;

const CAM_KEYS = {
  KeyW:'fwd', KeyS:'back', KeyA:'left', KeyD:'right',
  KeyQ:'yawL', KeyE:'yawR', KeyR:'reset'
};
/* `code` is the right key for a movement cluster (it is the physical key, so
   WASD stays WASD on AZERTY), but a host that forwards only `key` — or a
   synthetic event from a test — would otherwise be inert. Fall back to the
   letter. */
function camAction(code, key){
  if (code && CAM_KEYS[code]) return CAM_KEYS[code];
  const k = String(key || '').toLowerCase();
  return CAM_KEYS['Key' + k.toUpperCase()] || null;
}
/* 🔑 R RESETS THE VIEW, and it has to be SOMETHING: a player who yaws 180°,
   pans into the skirt and cannot find the board again will report the camera
   as broken. R is the convention every tactics game with a free camera uses,
   it is next to WASD, and it is not claimed here (`g` and `1`-`4` are, see the
   keydown listener at the bottom of this file). It restores the fit exactly —
   yaw 0, no pan — because the fit is the framing every other capture, every
   piece of host-side VFX anchoring and every screenshot in .gauntlet assumes. */
function camReset(){
  CAMERA.pan.x = CAMERA.pan.z = 0; CAMERA.yaw = 0;
  CAMERA.vel.x = CAMERA.vel.z = 0; CAMERA.yawVel = 0;
  for (const k in CAM_HELD) delete CAM_HELD[k];
  CAM_PULSE.x = CAM_PULSE.z = CAM_PULSE.yaw = 0; CAM_PULSE.at = -1e9;
  CAMERA.moving = false;
  camApply();
}
/* `src` is 'h' for a host-forwarded edge and 'l' for this document's own
   listener. It is stored rather than discarded because the watchdog in
   camUpdate() may only release keys whose SENDER has a heartbeat to go
   missing — see there. */
function camKey(down, code, key, src){
  const a = camAction(code, key);
  if (!a) return;
  if (a === 'reset'){ if (down) camReset(); return; }
  if (down) CAM_HELD[a] = (src === 'h' ? 'h' : 'l'); else delete CAM_HELD[a];
}
/* Held keys never survive losing focus: the keyup is delivered to whoever has
   focus now, so without this a key held while the player alt-tabs sticks down
   and the board drifts forever. The host clears its own set the same way. */
function camReleaseAll(){ for (const k in CAM_HELD) delete CAM_HELD[k]; }

/* 🐢 prefers-reduced-motion. The camera itself is the player's own input and
   is not what the media query is about; the EASING is. With reduce set, the
   velocity ramp collapses to a snap, so the view starts and — more to the
   point — STOPS exactly with the key instead of coasting. Read once and
   watched, because a page that only samples it at boot ignores a mid-session
   change. */
let CAM_REDUCED = false;
try {
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  CAM_REDUCED = !!mq.matches;
  const onMq = e => { CAM_REDUCED = !!e.matches; };
  if (mq.addEventListener) mq.addEventListener('change', onMq);
  else if (mq.addListener) mq.addListener(onMq);
} catch (e) {}

/* Derive CONFIG.camera from CAM_BASE + CAMERA and re-aim. This is the ONLY
   writer of the camera during play, and it runs before anything projects.
   ⚠ CAM.pos is a LIVE REFERENCE to CONFIG.camera.pos but CAM.f/r/u are
   SNAPSHOTS (see buildCam) — CONTRACT §2 Tier 2 names moving `pos` without
   re-aiming as the trap. Hence the buildCam() call, every time, no exceptions. */
/* 📍 Set by camApply(), cleared by the board:rects publish in frame().
   Every host-side anchor (_bbAnchorRect / _bbAnchorPoint / _bbTilePoint) is a
   screen box, and camApply() is the ONLY thing that can move all of them at
   once. Flagging it here rather than testing CAMERA.moving covers the two
   poses a `moving` test misses: the single frame where motion STOPS, and R,
   which teleports the view without ever setting moving at all — both of which
   would otherwise leave every overlay up to 250ms behind the board. */
let CAM_ANCHOR_DIRTY = true;
function camApply(){
  CAM_ANCHOR_DIRTY = true;
  const c = CONFIG.camera, B = CAM_BASE;
  const cy = Math.cos(CAMERA.yaw), sy = Math.sin(CAMERA.yaw);
  const fx = B.tx + CAMERA.pan.x, fz = CAMERA.pan.z;
  const horiz = B.dist * Math.cos(B.pitch);
  c.target.x = fx; c.target.y = CAM_FIT.targetY; c.target.z = fz;
  c.pos.x = fx + sy*horiz;
  c.pos.y = CAM_FIT.targetY + B.dist*Math.sin(B.pitch);
  c.pos.z = fz + cy*horiz;
  buildCam();
}
/* 🛑 THE CLAMP. CONTRACT R17: project() returns null at z <= 0.05 and ~40
   callers answer that with a bare `continue`, so geometry pushed out of the
   frustum vanishes with no error at all. Orbiting cannot do that (the eye
   keeps its distance from the focus), but panning can walk the focus off into
   the skirt until the board is a speck — and a player who holds W for three
   seconds and sees nothing but sky reports the camera as broken.
   The focus is therefore held inside the board's own extent. That is a hard
   guarantee that the tile under the middle of the frame is always ON the
   lattice, which is stronger than "some of the board is visible" and much
   easier to reason about than a screen-space test. */
const CAM_PAN_RANGE = 0.5;   /* of the board's half-extent, per axis */
function camClampPan(){
  /* Half the board's half-extent, not the whole of it. At the full extent the
     look-at point sits on the lattice's own edge and roughly two thirds of the
     field is off frame — the board is not LOST, but it is a corner of skirt
     with the battle pushed into one corner, which is the same complaint in a
     politer form. At half, the fit already frames the whole board and the pan
     is what it should be on a tactics map: a way to re-compose, not a way to
     go somewhere else. */
  const e = boardExtent();
  const px = clamp(CAMERA.pan.x, -e.x*CAM_PAN_RANGE, e.x*CAM_PAN_RANGE);
  const pz = clamp(CAMERA.pan.z, -e.z*CAM_PAN_RANGE, e.z*CAM_PAN_RANGE);
  /* kill the velocity INTO a wall, not along it — otherwise the camera keeps
     accelerating against the clamp and takes a visible moment to unstick when
     the player reverses. */
  if (px !== CAMERA.pan.x) CAMERA.vel.x = 0;
  if (pz !== CAMERA.pan.z) CAMERA.vel.z = 0;
  CAMERA.pan.x = px; CAMERA.pan.z = pz;
}

/* Integrated in update(dt), NOT on keydown — CONTRACT §2 Tier 2 is explicit,
   and the reason is that a per-keydown delta makes camera speed track the OS
   key-repeat rate and the frame rate at once. */
function camUpdate(dt){
  /* held keys → intent */
  let mx = (CAM_HELD.right ? 1 : 0) - (CAM_HELD.left ? 1 : 0);
  let mz = (CAM_HELD.fwd ? 1 : 0) - (CAM_HELD.back ? 1 : 0);
  let my = (CAM_HELD.yawR ? 1 : 0) - (CAM_HELD.yawL ? 1 : 0);
  /* …merged with the forwarded pulse, by MAGNITUDE and not by sum, so a host
     that sends both shapes (the harness does) drives the camera once. */
  if (T - CAM_PULSE.at < CAM_PULSE_TTL){
    /* ⚠ SIGN. board:camera's `dz` is a delta along +Z — the board's +Z is the
       NEAR edge, so S (toward the viewer) sends dz > 0 and W sends dz < 0.
       `mz` here is "away from the viewer" positive, so it is the NEGATION.
       Get this backwards and W/S are swapped in the game while they stay
       correct in the standalone preview, because only the forwarded path goes
       through this line. `dx` and `yaw` need no flip: right is right, and E is
       positive in both. */
    if (Math.abs(CAM_PULSE.x) > Math.abs(mx)) mx = Math.sign(CAM_PULSE.x);
    if (Math.abs(CAM_PULSE.z) > Math.abs(mz)) mz = -Math.sign(CAM_PULSE.z);
    if (Math.abs(CAM_PULSE.yaw) > Math.abs(my)) my = Math.sign(CAM_PULSE.yaw);
  }
  /* 🐕 WATCHDOG. A held key that never gets its keyup leaves the camera
     sliding forever with nothing pressed, and there is no error and no way for
     a player to stop it short of reloading. The host clears its set on blur and
     on unmount, but a single dropped `board:key` up would still strand us — so
     treat the pulse stream as the heartbeat it already is: the host re-sends
     board:camera every animation frame while ANY camera key is held, and
     CAM_HELD can only ever contain those keys, so a second of silence from a
     host that pumps means nothing over there is down.
     It only ever drops HOST-forwarded keys ('h'). The standalone listener and
     the __bbCam probe have no heartbeat and do not need one — their keyup is
     delivered to this same document — and dropping their keys here would make
     a held key mysteriously stop after a second. */
  if ((T - CAM_PULSE.at) > 1){
    let dropped = false;
    for (const k in CAM_HELD) if (CAM_HELD[k] === 'h'){ delete CAM_HELD[k]; dropped = true; }
    if (dropped){
      mx = (CAM_HELD.right ? 1 : 0) - (CAM_HELD.left ? 1 : 0);
      mz = (CAM_HELD.fwd ? 1 : 0) - (CAM_HELD.back ? 1 : 0);
      my = (CAM_HELD.yawR ? 1 : 0) - (CAM_HELD.yawL ? 1 : 0);
    }
  }
  const mag = Math.hypot(mx, mz) || 1;         /* no diagonal speed bonus */
  mx /= mag; mz /= mag;

  /* 🧭 PAN IN THE CAMERA PLANE, not in world axes. W has to mean "push the
     view away from me along the ground" at every yaw; if it meant −Z the
     controls would rotate under the player the moment they touched Q or E,
     which is the single most common way a free camera feels broken.
     The ground basis is the camera's own: forward is CAM.f flattened onto the
     floor, right is CAM.r (already horizontal — buildCam crosses f with world
     up, so r has no y component by construction). */
  const gf = Math.hypot(CAM.f.x, CAM.f.z) || 1;
  const fwdX = CAM.f.x/gf, fwdZ = CAM.f.z/gf;
  const speed = CAM_MOVE.pan * hexW();
  const wantX = (CAM.r.x*mx + fwdX*mz) * speed;
  const wantZ = (CAM.r.z*mx + fwdZ*mz) * speed;
  const wantY = my * CAM_MOVE.yaw;

  /* Exponential approach to the target velocity: acceleration on press, easing
     on release, and 1-e^(-k·dt) rather than min(1,k·dt) so the curve is the
     same at 30fps and at 144fps instead of merely bounded. */
  const k = CAM_REDUCED ? 1 : (1 - Math.exp(-CAM_MOVE.accel * dt));
  CAMERA.vel.x += (wantX - CAMERA.vel.x) * k;
  CAMERA.vel.z += (wantZ - CAMERA.vel.z) * k;
  CAMERA.yawVel += (wantY - CAMERA.yawVel) * k;

  const moving = Math.abs(CAMERA.vel.x) > CAM_MOVE.stopEps ||
                 Math.abs(CAMERA.vel.z) > CAM_MOVE.stopEps ||
                 Math.abs(CAMERA.yawVel) > CAM_MOVE.stopEps;
  if (!moving){
    /* park it exactly, so a resting camera produces a STABLE terrainKey and
       the baked ground layer stops rebuilding. A camera that creeps by 1e-9
       per frame re-bakes the whole diorama every frame, forever, and the only
       symptom is the frame rate. */
    CAMERA.vel.x = CAMERA.vel.z = CAMERA.yawVel = 0;
    if (CAMERA.moving){ CAMERA.moving = false; camApply(); }
    return;
  }
  CAMERA.moving = true;
  CAMERA.pan.x += CAMERA.vel.x * dt;
  CAMERA.pan.z += CAMERA.vel.z * dt;
  CAMERA.yaw += CAMERA.yawVel * dt;
  /* keep yaw in (−π, π] so the terrain key, the backdrop wrap and the fit
     probe all see a bounded number no matter how long someone leans on E */
  if (CAMERA.yaw > Math.PI) CAMERA.yaw -= Math.PI*2;
  else if (CAMERA.yaw <= -Math.PI) CAMERA.yaw += Math.PI*2;
  camClampPan();
  camApply();
}

/* 🧭 THE CAMERA-ALIGNED GROUND FRAME.
   Everything that dresses the FLOOR rather than the lattice — the stone apron,
   the location photograph, the depth bands that lay it down, the backdrop's
   horizon anchor, the skirt's reach — was written as a world-axis rectangle
   spanning ±groundExtent().x by −far…+near in world Z. That is the same thing
   as "left/right/behind/in front of the camera" only while the camera looks
   down −Z. Turn it and the apron shears off one flank, the photograph stops
   being the far horizon and slides into the foreground, and the depth bands
   (which are blitted as axis-aligned screen rects) fall apart.
   So those quads move into a frame that TURNS AND PANS WITH THE EYE:
     U  = ( cos yaw, 0, −sin yaw)   plays the old world +X ("screen right")
     V  = ( sin yaw, 0,  cos yaw)   plays the old world +Z ("toward the eye")
   with the origin at the pan offset. At yaw 0 and no pan this is the identity
   and every one of those call sites projects exactly the world point it used
   to, which is why the shipped framing is unchanged.
   Note what does NOT move into it: the lattice, the frame kerb, the braziers,
   the motes and the shards are statements about the PLAY FIELD and stay in
   world space, where they belong — they are supposed to swing past the camera
   when it turns. */
function gp(u, v, y){
  const c = Math.cos(CAMERA.yaw), s = Math.sin(CAMERA.yaw);
  return { x: CAMERA.pan.x + u*c + v*s, y: y || 0, z: CAMERA.pan.z - u*s + v*c };
}
/* world → the frame's coordinates. gp()'s inverse, split into the two
   components the callers actually need: V is depth toward the eye, U is across
   the frame. */
function frameV(wx, wz){
  const c = Math.cos(CAMERA.yaw), s = Math.sin(CAMERA.yaw);
  return (wx - CAMERA.pan.x)*s + (wz - CAMERA.pan.z)*c;
}
function frameU(wx, wz){
  const c = Math.cos(CAMERA.yaw), s = Math.sin(CAMERA.yaw);
  return (wx - CAMERA.pan.x)*c - (wz - CAMERA.pan.z)*s;
}
/* camera-space depth of a world point. The painter's algorithm's only honest
   sort key: world/grid Z is the same thing ONLY at yaw 0 (CONTRACT §2 Tier
   2.2). */
function camDepth(p){
  return (p.x - CAM.pos.x)*CAM.f.x + (p.y - CAM.pos.y)*CAM.f.y + (p.z - CAM.pos.z)*CAM.f.z;
}

/* 🧭 THE TERRAIN SWEEP'S DIRECTION, and which axis is depth at all.
   paintTerrain() has no depth buffer: its ordering IS its occlusion, and that
   ordering used to be spelled "rows ascending, columns ascending", which is
   far-to-near only while the camera looks down −Z. Turn 180° and the same loop
   paints the near row first and the relief folds inside out — every cliff face
   drawn over the row that should hide it. Turn 90° and rows stop being depth
   at all: a COLUMN is, and row-major then paints (x,z+1) over the taller
   (x+1,z) standing in front of it.
   Depth is affine in the lattice indices, so the gradient tells you both
   answers at once: the axis with the larger depth gain per step is the outer
   loop, and each axis runs in whichever direction starts furthest away.
   At yaw 0 this returns exactly `majorZ, +1, +1` — the loop it replaces. */
function sweepOrder(){
  const gx = CAM.f.x * hexW(), gz = CAM.f.z * hexV();
  return { majorZ: Math.abs(gz) >= Math.abs(gx),
           zStep: gz > 0 ? -1 : 1,
           xStep: gx > 0 ? -1 : 1 };
}
function sweepSeq(a, b, step){
  const out = [];
  if (step > 0) for (let i=a; i<=b; i++) out.push(i);
  else          for (let i=b; i>=a; i--) out.push(i);
  return out;
}

/* Smallest distance at which every tile CENTRE still lands inside the box.
   A tile at grid (gx,gz) sits at world x = px, z = pz; the eye is on the z
   axis at `dist`, so that tile's camera depth is dist + targetY·sinθ − pz·cosθ
   and its screen offset is px·scale/depth. Requiring |offset| ≤ wMax inverts
   to a distance per tile, and the fit is the largest of them. Only the first
   and last COLUMN can be extreme, so this is 2·rows work, not cols·rows. */
function fitDistance(pitch, tx){
  const scale = VIEW.scale, wMax = Math.max(40, VIEW.box.w/2 * CAM_FIT.fillX);
  const st = Math.sin(pitch), ct = Math.cos(pitch);
  /* floor: the near edge must stay a comfortable margin in front of the near
     clip, or project() starts returning null and geometry vanishes silently
     (CONTRACT §1.6 / R17). */
  let d = 1.5 - CAM_FIT.targetY*st + boardExtent().z*ct;
  for (let gz = 0; gz < MAP.rows; gz++){
    const pz = (gz - (MAP.rows-1)/2) * hexV();
    for (const gx of [0, MAP.cols-1]){
      const px = (gx + rowShift(gz) - (MAP.cols-1)/2) * hexW() - tx;
      d = Math.max(d, Math.abs(px)*scale/wMax - CAM_FIT.targetY*st + pz*ct);
    }
  }
  return d;
}

/* Where to AIM so both flanks bind equally hard.
   latticeCentreX() is the right answer under an orthographic camera. Under
   perspective it is not: the near row is odd, so it reaches half a column
   further right AND sits closer to the eye, and both effects push the same
   way. Aiming at the lattice's own centre therefore hands the right flank the
   whole width budget while the left flank finishes ~15px short, and the fit
   then backs the camera off to pay for a margin only one side is using.
   Balancing the two recovers that — worth ~2% of hex size at 14×12, which is
   the difference between a 59px near-row hex and a 60px one.
   Damped fixed point rather than algebra because the depth the correction is
   measured at depends on the distance, which depends on the aim: eight passes
   converge to under half a pixel and it only runs on a map change. */
function fitAim(pitch){
  let tx = latticeCentreX();
  let dist = fitDistance(pitch, tx);
  for (let i = 0; i < 8; i++){
    camAt(pitch, dist, tx);
    let lo = 0, hi = 0, any = false;
    for (let gz = 0; gz < MAP.rows; gz++){
      for (const gx of [0, MAP.cols-1]){
        const q = project(gw(gx, gz, 0)); if (!q) continue;
        any = true;
        lo = Math.min(lo, q.x - VIEW.cx); hi = Math.max(hi, q.x - VIEW.cx);
      }
    }
    if (!any) break;
    const off = (hi + lo)/2;                     /* px the lattice sits right of centre */
    if (Math.abs(off) < 0.5) break;
    tx += off * dist / VIEW.scale * 0.9;         /* px → world, damped */
    dist = fitDistance(pitch, tx);
  }
  return { tx, dist };
}

/* Screen height of a reference unit standing on the NEAR row — the row the
   player's own units deploy on, and the one a steep pitch flattens first. */
function fitSpriteH(pitch, dist, tx){
  camAt(pitch, dist, tx);
  const zn = (MAP.rows - 1)/2 * hexV();
  const a = project({ x:tx, y:0, z:zn });
  const b = project({ x:tx, y:unitWorldH({ h:1.05 }), z:zn });
  return (a && b) ? Math.abs(a.y - b.y) : 0;
}

function fitCamera(){
  if (!VIEW.box) resize();
  const floor = VIEW.box.h * CAM_FIT.spriteMin;
  let pitch = CAM_FIT.pitchLo, aim = fitAim(pitch);
  for (let p = CAM_FIT.pitchHi; p > CAM_FIT.pitchLo; p -= CAM_FIT.pitchStep){
    const a = fitAim(p);
    if (fitSpriteH(p, a.dist, a.tx) >= floor){ pitch = p; aim = a; break; }
  }
  const tx = aim.tx;
  camAt(pitch, aim.dist, tx);
  /* 🎥 The fit's answer, handed to the free camera. Everything below this line
     still measures the NEUTRAL view — viewShiftY has to be derived from the
     framing R returns to, not from wherever the player happens to be looking,
     or a window resize mid-pan would walk the horizon up the screen. */
  CAM_BASE.tx = tx; CAM_BASE.pitch = pitch; CAM_BASE.dist = aim.dist;
  /* Re-derive the optical shift from the board's OWN bbox. Measured with the
     shift zeroed first, so the answer never depends on the shift already in
     place — that is what makes a second board:map land on the same numbers
     instead of walking the board off the top of the screen one push at a
     time. */
  CONFIG.viewShiftY = 0; resize(); buildCam();
  const e = boardExtent();
  const far = project({ x:tx, y:0, z:-e.z }), near = project({ x:tx, y:0, z:e.z });
  if (far && near){
    const span = near.y - far.y, slack = VIEW.box.h - span;
    const wantFar = VIEW.box.t + (slack > 0 ? slack*CAM_FIT.skyShare : slack/2);
    /* resize() scales viewShiftY by this same factor, so divide it back out. */
    const kk = clamp(H/1080, .6, 1.2) || 1;
    CONFIG.viewShiftY = (wantFar - far.y) / kk;
    resize(); buildCam();
  }
  /* …and only now put the player's own pan/yaw back on top. Re-clamped rather
     than kept verbatim because the fit may have run because the MAP changed
     size, in which case the old pan could be outside the new board. */
  camClampPan();
  camApply();
}

/* resize → fit → resize. VIEW.box feeds the fit and the fit writes viewShiftY
   back through VIEW.cy, so the two only agree in that order. The window
   resize listener goes through here as well: a fit that only ran on board:map
   would be stale the moment the HUD reflowed the host rect, which is exactly
   when the framing matters most. */
function applyFit(){ resize(); fitCamera(); buildCam(); }

function buildStage(){
  rebuildTileIndex();
  /* MAP.tiles has just been replaced, so the baked terrain describes a board
     that no longer exists. Bumping the signature is the only thing that tells
     terrainLayer() so — it cannot see MAP.tiles change and re-hashing the array
     every frame would cost more than the rebuild it is avoiding. */
  MAPSIG++;
  applyFit();
  seedBraziers(); seedShards(); seedMotes();
  units = units.filter(u => u.persist);
}

/* ══════════════════════════════════════════════════════════════════
   UNITS
   ══════════════════════════════════════════════════════════════════ */
function spawnUnit(defKey, gx, gz, side){
  /* An unregistered unit still gets a body: hash its key onto one of the
     procedural silhouettes rather than throwing. */
  if (!UNIT_DEFS[defKey]){
    let hsh = 0; for (let i = 0; i < String(defKey).length; i++) hsh = (hsh * 31 + String(defKey).charCodeAt(i)) | 0;
    const proc = PROC_KEYS[Math.abs(hsh) % PROC_KEYS.length];
    UNIT_DEFS[defKey] = Object.assign({}, PROC_DEFS[proc], { name:String(defKey), _proc:proc });
  }
  const def = UNIT_DEFS[defKey];
  const u = {
    id: uid++, def, key:defKey, side: side||'mine',
    gx, gz, x:gx, z:gz, y:0, scaleX:1, scaleY:1, face: side==='foe' ? 1 : -1,
    bob: Math.random()*Math.PI*2, hp:1, anim:'idle', animT:0, tween:null, flash:0, rise:0
  };
  units.push(u);
  return u;
}
function unitAt(gx,gz){ return units.find(u => u.gx===gx && u.gz===gz && !u.dead); }

/* crisp tile-to-tile movement: cubic ease + hop arc + squash + dust */
function moveUnit(id, gx, gz){
  const u = units.find(x => x.id===id); if (!u || u.tween) return;
  if (tileBlocked(gx,gz) || unitAt(gx,gz)) { deny(u); return; }
  u.face = (gx === u.gx) ? u.face : (gx > u.gx ? 1 : -1);
  u.tween = { x0:u.x, z0:u.z, x1:gx, z1:gz, t:0, dur:0.34 };
  u.anim = 'walk';
  u.gx = gx; u.gz = gz;
  dispatch('unitMove', { id, x:gx, z:gz });
}
function deny(u){
  u.shake = 0.28;
  effects.push({ k:'ring', x:u.x, z:u.z, t:0, dur:.35, col:'#ff5a48', r0:.15, r1:.5 });
}
function attackUnit(id, targetId){
  const u = units.find(x=>x.id===id), t = units.find(x=>x.id===targetId);
  if (!u || !t) return;
  u.lunge = { t:0, dur:.42, dx:(t.x-u.x), dz:(t.z-u.z) };
  setTimeout(() => {
    t.flash = 1; t.shake = .3;
    effects.push({ k:'impact', x:t.x, z:t.z, t:0, dur:.5 });
    burst(t.x, t.z, .6, 22, '#ffd08a');
    effects.push({ k:'float', x:t.x, z:t.z, t:0, dur:1.1, txt:'-24', col:'#ff6a5a' });
  }, 180);
  dispatch('unitAttack', { id, targetId });
}
function killUnit(id){
  const u = units.find(x=>x.id===id); if (!u) return;
  u.dead = true; u.deathT = 0;
  burst(u.x, u.z, .8, 34, u.def.color);
  dispatch('unitDeath', { id });
}

/* ══════════════════════════════════════════════════════════════════
   SUMMON — the ceremony. Timings documented in the port brief.
   ══════════════════════════════════════════════════════════════════ */
let summoning = false;
/* 🌟 SUMMON ARRIVAL (cosmetic only).
   The unit is ALREADY placed by the normal roster push — this just replays the
   arrival beats on it: rune circle, white flash, pillar of light, shockwave
   ring, dust burst, then the unit rises out of the tile with a back-ease and
   a landing squash. Deliberately decoupled from spawning: if this never runs,
   the board is still correct, which is the bug that bit the first attempt. */
function summonFx(unitId){
  const u = units.find(x => String(x.id) === String(unitId) && !x.dead);
  if (!u || u.rise) return false;
  const col = (u.def && u.def.color) || '#f6dc95';
  const wp = gw(u.gx, u.gz, tileElev(u.gx, u.gz));
  effects.push({ k:'rune', x:wp.x, z:wp.z, gx:u.gx, gz:u.gz, t:0, dur:1.5, col });
  effects.push({ k:'flash', t:0, dur:.55 });
  effects.push({ k:'pillar', gx:u.gx, gz:u.gz, t:0, dur:1.0, col });
  effects.push({ k:'ring', x:wp.x, z:wp.z, t:0, dur:.7, col, r0:.2, r1:1.6 });
  burst(wp.x, wp.z, 1.0, 46, col);
  u.rise = 1; u.riseT = 0; u.y = -1.1; u.scaleX = .7; u.scaleY = .7;
  return true;
}
function summonUnit(cardId, gx, gz, opts){
  if (summoning) return;
  opts = opts || {};
  /* EMBEDDED: the host summons by UNIT KEY, not by a card in the demo hand.
     Synthesise the card the ceremony needs so the flying card shows the real
     unit's art and name. */
  let card = HAND.find(c => c.id===cardId);
  if (!card){
    const d = UNIT_DEFS[cardId];
    if (!d) return;
    card = { id:cardId, unit:cardId, ec:d.color || '#f6dc95', el:'', cost:opts.cost || 0 };
  }
  if (tileBlocked(gx,gz) || unitAt(gx,gz)) return;
  summoning = true;
  dispatch('cardPlayed', { cardId, x:gx, z:gz });

  const el = document.querySelector(`.hcard[data-id="${cardId}"]`);
  const from = el ? el.getBoundingClientRect() : { left:W/2-93, top:H-278, width:186, height:260 };
  if (el) el.style.visibility = 'hidden';

  /* flying card (Three.js: a textured plane in-scene) */
  const fly = document.createElement('div');
  fly.className = 'flycard';
  fly.innerHTML = `<div class="back">✦</div><div class="face">
      <div class="art"></div><div class="nm">${UNIT_DEFS[card.unit].name}</div></div>`;
  document.body.appendChild(fly);
  const artCv = document.createElement('canvas');
  artCv.width = 186*2; artCv.height = 226*2; artCv.style.width='186px'; artCv.style.height='226px';
  fly.querySelector('.art').appendChild(artCv);
  paintCardArt(artCv.getContext('2d'), card, 186, 226, 2);

  const wp = gw(gx, gz, tileElev(gx,gz));
  const target0 = project(wp);
  const target = target0 || { x:W/2, y:H/2, s:100 };
  const CARD_W = from.width || 186;
  /* The hand card is large; once placed it must read as a small card sitting
     ON the tile — ≈0.66 of a tile wide, so deeper tiles get a smaller card. */
  const landScale = clamp((0.66 * target.s) / CARD_W, 0.18, 0.62);
  const t0 = performance.now();
  const DUR = { fly:520, flip:640, flash:780, rise:820, dissolve:900, land:1350 };
  let ignited = false, flipped = false, flashed = false, risen = false, dissolved = false;
  let unit = null;

  (function step(now){
    const e = now - t0;
    /* 0 → fly */
    const ft = clamp(e/DUR.fly, 0, 1), fe = easeInOut(ft);
    const sx = from.left, sy = from.top;
    const mx = lerp(sx, target.x-CARD_W/2, fe), my = lerp(sy, target.y-130, fe) - Math.sin(fe*Math.PI)*215;
    const tilt = lerp(0, 62, fe);
    const scl = lerp(1, landScale, fe);
    const flipDeg = e > DUR.flip ? clamp((e-DUR.flip)/240, 0, 1)*180 : 0;
    fly.style.transform =
      `translate3d(${mx}px, ${my}px, 0) rotateX(${tilt}deg) rotateY(${180-flipDeg}deg) scale(${scl})`;

    if (!ignited && e >= DUR.fly){
      ignited = true;
      effects.push({ k:'rune', x:gx===undefined?0:gw(gx,gz).x, z:gw(gx,gz).z, gx, gz, t:0, dur:1.5, col:card.ec });
    }
    if (!flipped && e >= DUR.flip){ flipped = true; }
    if (!flashed && e >= DUR.flash){
      flashed = true;
      effects.push({ k:'flash', t:0, dur:.55 });
      effects.push({ k:'pillar', gx, gz, t:0, dur:1.0, col:card.ec });
      effects.push({ k:'ring', x:gw(gx,gz).x, z:gw(gx,gz).z, t:0, dur:.7, col:card.ec, r0:.2, r1:1.6 });
      burst(gw(gx,gz).x, gw(gx,gz).z, 1.0, 46, card.ec);
    }
    if (!risen && e >= DUR.rise){
      risen = true;
      unit = spawnUnit(card.unit, gx, gz, opts.side === 'foe' ? 'foe' : 'mine');
      if (unit && opts.id != null) unit.id = String(opts.id);   // keep the GAME's id
      unit.rise = 1; unit.y = -1.1; unit.scaleY = .7; unit.scaleX = .7;
    }
    if (!dissolved && e >= DUR.dissolve){
      dissolved = true;
      fly.style.transition = 'opacity .28s ease, transform .28s ease';
      fly.style.opacity = '0';
      const cur = fly.style.transform;
      fly.style.transform = cur + ' scale(1.18)';
      emberDissolve(target.x, target.y);
      setTimeout(() => fly.remove(), 320);
      const idx = HAND.findIndex(c => c.id===cardId);
      if (idx >= 0) HAND.splice(idx, 1);
      renderHand();
    }
    if (unit && unit.rise > 0){
      const rt = clamp((e - DUR.rise)/420, 0, 1);
      const re = easeBack(rt);
      unit.y = lerp(-1.1, 0, re);
      unit.scaleY = lerp(.7, 1, easeOut(rt));
      unit.scaleX = lerp(.7, 1, easeOut(rt));
      if (rt >= 1) unit.rise = 0;
    }
    if (e >= DUR.land && unit){
      unit.scaleY = 1.16; unit.scaleX = .88;   /* landing squash, springs back in update */
      effects.push({ k:'ring', x:gw(gx,gz).x, z:gw(gx,gz).z, t:0, dur:.55, col:card.ec, r0:.1, r1:1.0 });
      dust(gw(gx,gz).x, gw(gx,gz).z, 20);
      summoning = false;
      dispatch('summonComplete', { cardId, unitId:unit.id, x:gx, z:gz });
      return;
    }
    requestAnimationFrame(step);
  })(t0);
}

/* ══════════════════════════════════════════════════════════════════
   PARTICLES
   ══════════════════════════════════════════════════════════════════ */
function burst(wx, wz, power, n, col){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = rnd(.4,2.2)*power;
    particles.push({ x:wx, y:rnd(.05,.35), z:wz, vx:Math.cos(a)*sp, vy:rnd(1.4,4.2)*power, vz:Math.sin(a)*sp,
      life:rnd(.5,1.2), t:0, col, size:rnd(1.4,3.4), g:5.6 });
  }
}
/* DUST — real kicked-up dust: soft billowing puffs that expand, hug the
   ground, drift outward and fade, plus a little heavier grit that arcs and
   settles. (Three.js: soft-particle billboards with depth-fade + the same
   expand/fade curve; grit as a small GPU sprite burst.) */
function dust(wx, wz, n){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = rnd(.35,1.05);
    particles.push({ puff:true, x:wx, y:rnd(.01,.10), z:wz,
      vx:Math.cos(a)*sp, vz:Math.sin(a)*sp, vy:rnd(.10,.34),
      t:0, life:rnd(.75,1.35),
      r0:rnd(.09,.17), r1:rnd(.44,.78),
      col:'#b9a582', tone:rnd(.85,1.12) });
  }
  for (let i=0;i<Math.round(n*.55);i++){
    const a = Math.random()*Math.PI*2, sp = rnd(.5,1.6);
    particles.push({ x:wx, y:.03, z:wz, vx:Math.cos(a)*sp, vy:rnd(.5,1.5), vz:Math.sin(a)*sp,
      life:rnd(.35,.75), t:0, col:'#d8c9a4', size:rnd(1.1,2.2), g:4.2, soft:true });
  }
}
function emberDissolve(sx, sy){
  for (let i=0;i<28;i++){
    effects.push({ k:'ember2d', x:sx+rnd(-40,40), y:sy+rnd(-56,56),
      vx:rnd(-26,26), vy:rnd(-90,-26), t:0, dur:rnd(.6,1.2), col:'#ffcf7a' });
  }
}
/* Ambient motes drifting over the stage. The box was rnd(-5,5) x rnd(-4,4) —
   the 8×7 arena written as literals in two places (here and the recycle in
   update()), so on a bigger board the motes hugged the middle third and the
   outer rows had no atmosphere at all. moteBox() is the single description now,
   and buildStage() reseeds so a map change redistributes them immediately
   instead of waiting for each mote to drift past the ceiling. */
const AMBIENT_MOTES = 70;
function moteBox(){ const e = boardExtent(); return { x:e.x*1.25, z:e.z*1.15 }; }
function seedMotes(){
  const b = moteBox();
  particles = particles.filter(p => !p.amb);
  for (let i=0;i<AMBIENT_MOTES;i++){
    particles.push({ amb:true, soft:true, x:rnd(-b.x,b.x), y:rnd(.1,3.4), z:rnd(-b.z,b.z),
      /* `soft` drops them out of the additive pass in drawParticles(). Drifting
         ash lit by an overcast sky is not an emitter; composited with `lighter`
         even a grey mote blew out to a white bokeh disc, which is how a muted
         colour was still reading as neon. */
      vx:rnd(-.06,.06), vy:rnd(.05,.22), vz:rnd(-.06,.06), t:0, life:1e9,
      /* 🚫 NOT PURPLE. These were #b98cff / #ffcf7a — a lavender and a bright
         gold — and BAR R1 names "saturated fantasy-purple lighting" as a fail
         condition outright, with "palette muted and desaturated, one value
         range, nothing neon" as the requirement. Seventy saturated violet discs
         drifting over a grey ruin were the single most chromatic thing in the
         frame. What is actually in the air over a burnt street is ash and
         cinder, so: a cool grey ash and a dull warm ember, both low-chroma and
         both inside the ground's own value range. */
      col: Math.random()<.55 ? '#8f9298' : '#b8946a', size:rnd(.8,2.1), g:0, w:Math.random()*7 });
  }
}

/* ══════════════════════════════════════════════════════════════════
   DRAW — sky, board, tiles, props, units, fx
   ══════════════════════════════════════════════════════════════════ */
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, LIGHT.sky[0]); g.addColorStop(.55, LIGHT.sky[1]); g.addColorStop(1, LIGHT.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  /* the location backdrop covers this entirely when art is present */

  drawBackdrop();   /* the location's world sits behind the arena */

  /* ── SUN / MOON — real art, positioned from the preset so the sky always
     matches the battle's clock. Drawn AFTER the backdrop so they read as
     hanging in front of the scene. Sun gets corona shine + lens streaks;
     moon gets a cold blue moonlight halo. ── */
  const az = LIGHT.az, el = LIGHT.elev;
  /* ☀ Pinned to the UPPER-RIGHT sky and kept small. It used to swing with the
     light azimuth across the middle of the frame at a large radius, which put
     it straight over the battlefield. Now it stays in the corner, well clear of
     the play area, and only drifts a little with the light direction. */
  /* 🎥 …and it drifts with the CAMERA too, at the same rate as the backdrop.
     A sun pinned to the upper-right corner no matter which way the player
     turns is the sky-is-a-decal tell in one object. Wrapped over the same
     panorama period as the backdrop rather than over 2π so the two stay in
     register: with a repeating skyline, one sun per repeat is the consistent
     picture, and the alternative — one sun in 360° — means most angles have a
     lit scene with no light source anywhere in it. */
  const bxBase = VIEW.cx + VIEW.box.w * .40 + Math.sin(az) * VIEW.box.w * .05;
  const skyPeriod = Math.max(320, VIEW.box.w * 1.35);
  let bx = bxBase + skyShift();
  bx = bxBase + ((bx - bxBase) % skyPeriod + skyPeriod*1.5) % skyPeriod - skyPeriod*0.5;
  const by = VIEW.cy - VIEW.box.h * .40 - (el - .15) * VIEW.box.h * .16;
  const isSun = LIGHT.body === 'sun';
  const R = (isSun ? 40 : 32) * clamp(VIEW.box.h/900, .7, 1.15);
  const pulse = 1 + Math.sin(T*0.9)*0.018 + Math.sin(T*2.3)*0.008;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* broad atmospheric bloom */
  const halo = ctx.createRadialGradient(bx,by,R*0.55, bx,by,R*(isSun?7.5:5.4));
  halo.addColorStop(0,   rgba(LIGHT.disc, isSun ? .40 : .26));
  halo.addColorStop(.18, rgba(LIGHT.disc, isSun ? .17 : .12));
  halo.addColorStop(1,   rgba(LIGHT.disc, 0));
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(bx,by,R*(isSun?7.5:5.4),0,7); ctx.fill();
  /* tight inner shine right at the limb */
  const core = ctx.createRadialGradient(bx,by,R*0.72, bx,by,R*1.55);
  core.addColorStop(0, rgba(isSun?'#ffd08a':'#cfe0ff', isSun?.55:.34));
  core.addColorStop(1, rgba(isSun?'#ff9a30':'#8fb4ff', 0));
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(bx,by,R*1.55,0,7); ctx.fill();

  if (isSun){
    /* rotating corona rays */
    for (let i=0;i<16;i++){
      const a = i*Math.PI/8 + T*0.05;
      const len = R*(2.5 + Math.sin(T*1.7 + i*1.3)*0.75);
      const gg = ctx.createLinearGradient(bx,by, bx+Math.cos(a)*len, by+Math.sin(a)*len);
      gg.addColorStop(0, rgba('#ffcf7a', .16));
      gg.addColorStop(1, rgba('#ff8a20', 0));
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.lineTo(bx+Math.cos(a-.05)*len, by+Math.sin(a-.05)*len);
      ctx.lineTo(bx+Math.cos(a+.05)*len, by+Math.sin(a+.05)*len);
      ctx.closePath(); ctx.fill();
    }
    /* anamorphic lens streaks */
    const streak = (w,hh,al) => {
      const g2 = ctx.createLinearGradient(bx-w,by,bx+w,by);
      g2.addColorStop(0,'rgba(255,190,110,0)'); g2.addColorStop(.5,`rgba(255,225,170,${al})`);
      g2.addColorStop(1,'rgba(255,190,110,0)');
      ctx.fillStyle = g2; ctx.fillRect(bx-w, by-hh/2, w*2, hh);
    };
    streak(R*6.2, R*0.075, .30);
    streak(R*3.0, R*0.030, .38);
    ctx.save(); ctx.translate(bx,by); ctx.rotate(Math.PI/2); ctx.translate(-bx,-by);
    streak(R*3.4, R*0.055, .20); ctx.restore();
  } else {
    /* cold moonlight bloom + faint god-shafts */
    for (let i=0;i<9;i++){
      const a = -Math.PI/2 + (i-4)*.10 + Math.sin(T*.16+i)*.01;
      const len = VIEW.box.h*1.5;
      const gg = ctx.createLinearGradient(bx,by, bx+Math.cos(a)*len, by-Math.sin(a)*len);
      gg.addColorStop(0, rgba('#9fc0ff', .055));
      gg.addColorStop(1, rgba('#6f9ce8', 0));
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.lineTo(bx+Math.cos(a-.028)*len, by-Math.sin(a-.028)*len);
      ctx.lineTo(bx+Math.cos(a+.028)*len, by-Math.sin(a+.028)*len);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();

  /* the body itself */
  const img = isSun ? SUN_IMG : MOON_IMG;
  if (img && img.complete && img.naturalWidth){
    const d = R*2*pulse;
    if (isSun){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.drawImage(img, bx-d/2, by-d/2, d, d);
      ctx.restore();
      /* second, slowly counter-rotating pass adds churn to the surface */
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.28;
      ctx.translate(bx,by); ctx.rotate(-T*0.012); ctx.translate(-bx,-by);
      ctx.drawImage(img, bx-d*.49, by-d*.49, d*.98, d*.98);
      ctx.restore();
    } else {
      ctx.drawImage(img, bx-d/2, by-d/2, d, d);
      /* moonlight rim */
      ctx.save(); ctx.globalCompositeOperation='lighter';
      const rim = ctx.createRadialGradient(bx,by,R*.86, bx,by,R*1.12);
      rim.addColorStop(0,'rgba(180,210,255,0)'); rim.addColorStop(.6,'rgba(190,215,255,.30)');
      rim.addColorStop(1,'rgba(150,190,255,0)');
      ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(bx,by,R*1.12,0,7); ctx.fill();
      ctx.restore();
    }
  } else {
    ctx.fillStyle = LIGHT.disc; ctx.beginPath(); ctx.arc(bx,by,R,0,7); ctx.fill();
  }
  if (!isSun){
    ctx.fillStyle = rgba(LIGHT.disc,.9);
    for (let i=0;i<110;i++){
      const sx=(i*137.5)%W, sy=((i*79.3)%(H*.6));
      ctx.globalAlpha=.08+(i%5)*.11; ctx.fillRect(sx,sy,1.4,1.4);
    }
    ctx.globalAlpha=1;
  }

  /* procedural ruin silhouettes — only when the location has no backdrop art */
  if (!(BACKDROP.img && BACKDROP.img.complete)){
    ctx.fillStyle = rgba(LIGHT.fog, .92);
    const horizon = project(gp(0,-14));
    const hy = horizon ? horizon.y : H*.42;
    /* 🎥 The ruin line parallaxes with the rest of the sky. The modulo period
       is (W+200), the same span the layout already wraps on, so sliding by
       skyShift() and re-wrapping keeps exactly the 26 silhouettes it had —
       they just scroll past instead of standing still while the world turns. */
    const ruinShift = skyShift();
    for (let i=0;i<26;i++){
      const sx = ((((i*163 + 40) + ruinShift) % (W+200)) + (W+200)) % (W+200) - 100;
      const w = 26 + (i*37)%60, h = 40 + (i*91)%160;
      ctx.fillRect(sx, hy-h, w, h+30);
      if (i%3===0){ ctx.fillRect(sx+w*.3, hy-h-24, w*.28, 26); }
    }
    const fg = ctx.createLinearGradient(0,hy-60,0,hy+140);
