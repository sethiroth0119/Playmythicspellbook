        ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(mx,my,ex,ey); ctx.stroke();
        ctx.fillStyle = rgba(lit, .34);
        ctx.beginPath();
        ctx.ellipse(ex, ey, R*(.05+_sHash(x,z,382+k)*.05), R*(.035+_sHash(x,z,386+k)*.035),
                    a0, 0, 6.284);
        ctx.fill();
      }
    } else if (fam === 'radiant'){
      /* Concentric rings, thinning outward — a source rather than a stain.
         Squashed to the tile's own 0.62 ratio so the rings sit ON the ground
         plane instead of standing up off it like a decal. */
      for (let k=0;k<3;k++){
        const rr = R*(.26 + k*.21);
        ctx.strokeStyle = rgba(k===0 ? lit : S.grit, .34 - k*.08);
        ctx.lineWidth = R*(.030 - k*.006);
        ctx.beginPath(); ctx.ellipse(0, 0, rr, rr*.62, 0, 0, 6.284); ctx.stroke();
      }
      for (let i=0;i<5;i++){
        const a = _sHash(x,z,390+i)*6.283, d = R*(.20+_sHash(x,z,396+i)*.52);
        ctx.fillStyle = rgba(lit, .30);
        const sp = R*(.020+_sHash(x,z,402+i)*.026);
        ctx.beginPath();
        ctx.ellipse(Math.cos(a)*d, Math.sin(a)*d*.62, sp, sp*.7, a, 0, 6.284);
        ctx.fill();
      }
    } else {
      /* wave — parallel crests, offset per band so they read as a travelling
         front rather than as a stack of identical arcs. */
      for (let k=0;k<4;k++){
        const off = (k - 1.5) * R*.30, ph = _sHash(x,z,410+k)*6.283;
        ctx.strokeStyle = rgba(k%2 ? S.grit : lit, .30 + (k%2)*.08);
        ctx.lineWidth = R*.026;
        ctx.beginPath();
        for (let i=0;i<=10;i++){
          const px = -R*.74 + (i/10)*R*1.48;
          const py = off*.62 + Math.sin(ph + i*.68)*R*.085;
          i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
        }
        ctx.stroke();
      }
    }
  } else {
    /* dirt — wheel ruts and scrapes.
       ⚠ These used to be drawn in S.lo, the SHADOW end of the pair, at 0.42
       over a `hi` that was itself L=62. Once `hi` was lifted 2.2x the same
       stroke became a near-black bar the full width of the tile, and at crop
       level the board read as though someone had scored it with a knife. A rut
       is a shallow depression in the same material, so it is drawn in a mix of
       the pair rather than at the bottom of it, with a lit lip on one side —
       the same trick the asphalt crack uses to stop being a scratch. */
    const rut = mixHexRaw(S.lo, S.hi, .42);
    for (let k=0;k<2;k++){
      const a = _sHash(x,z,160+k)*3.14, off = (k-.5)*R*.3;
      const x0 = -Math.cos(a)*R*.8, y0 = -Math.sin(a)*R*.8 + off;
      const x1 =  Math.cos(a)*R*.8, y1 =  Math.sin(a)*R*.8 + off;
      ctx.strokeStyle = rgba(S.grit,.16); ctx.lineWidth = R*.075;
      ctx.beginPath(); ctx.moveTo(x0, y0 - R*.03); ctx.lineTo(x1, y1 - R*.03); ctx.stroke();
      ctx.strokeStyle = rgba(rut,.40); ctx.lineWidth = R*.062;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ═════════════════════════════════════════════════════════════════
   🏟 ARENA MARKINGS — the pitch painted on the ground (TABLETOP-BAR §7)
   ═════════════════════════════════════════════════════════════════
   §7: "Zones are marked on the ground the way a sport marks its field:
   deployment rows, centre line, objective points. Subtle, painted-on, UNDER
   the pieces", and "Symmetry reads — a player can see whose half is whose at a
   glance." §1.4 lists the shipped board's unmarked, unframed ground as a
   defect to remove.

   🔴 §3.4 IS IN DIRECT TENSION WITH §7 HERE, AND THIS IS THE ANSWER.
   A centre line is by nature ONE continuous stroke across the whole board,
   and §3.4 forbids a tile's art from spilling sideways — that rule is the
   whole of the seam work that just landed and it must not be undone for a
   decoration. Both hold if the markings are drawn PER TILE, from inside
   paintTileRec, CLIPPED TO THAT TILE'S OWN INSET TOP POLYGON. The plan is one
   continuous piece of world-space geometry; every pixel of it is laid down
   inside a single cell. So the line BREAKS at every gap, at every cliff face
   and at every rim — exactly like paint on real flagstones, and exactly like
   a pitch line crossing a drainage channel. Trace any tile's outline: no mark
   crosses it, because no mark is ever drawn outside the clip.

   🔴 AND WHY THIS IS NOT ONE POST-SWEEP PASS, WHICH IS THE OBVIOUS BUILD.
   paintTerrain() is a painter's algorithm with NO depth buffer; the note at
   its sweep is blunt — "Slab order is the depth sort; break it and the terrain
   folds inside out." The lattice outline a few lines below is already drawn at
   the end of each TILE rather than as a final sweep for precisely this reason.
   A markings pass stroked after the sweep would rule its lines straight across
   the tops of the near slabs and the cliff faces that are supposed to occlude
   the far ones. Same geometry, correct occlusion, one clip per affected tile.

   ⚠ WORLD POINTS, NEVER GRID INDICES — forced, not chosen. The obvious way to
   mirror a mark is (x,z) → (cols-1-x, rows-1-z). On an odd-r lattice that is
   NOT a reflection: gw() shifts odd rows +½ column, so the two partners' world
   x sum to (rowShift(z) + rowShift(rows-1-z)) * hexW — which is 0, ½ or 1 hex
   depending on the two rows' parities and is never reliably zero. A pair placed
   that way leans up to half a tile to one side, and "symmetry reads" fails on
   the single thing it was built to carry. Every position below is therefore a
   WORLD coordinate derived from MAP.cols / MAP.rows, where the mirror about the
   origin is exact at any board size.

   📐 NO 14 AND NO 12 ANYWHERE. BOARD_DEFAULT's header is explicit that the
   board size is FED IN by the host through board:init / board:map (HEXSPEC §7)
   and is not to be retyped in this file. The plan is a pure function of
   MAP.cols / MAP.rows / CONFIG.tile, memoised on exactly those three, and it
   reaches terrainKeyParts() through the `mk` term — see §10.7: a new per-tile
   input that does not reach that string never appears on a parked camera, and
   the symptom is indistinguishable from the edit not having been made. */
const MARKS = {
  /* 🏟 ON. It was false, and the reason it was false is worth keeping because
     it is the reason it is now true.
     The arena-markings piece was interrupted MID-BUILD by a release that needed
     this file quiet. The geometry below was real and measured, but nothing
     independent had ever seen it render, so the flag was parked at false with a
     note saying "inert is honest; unreviewed-but-live is not" — flip it when
     the piece finishes a round and WINS.
     That note contained a deadlock and this round is where it was noticed: a
     marking layer that is off cannot be rendered, a layer that cannot be
     rendered cannot be screenshotted, and TABLETOP-BAR §9.1 is explicit that a
     critic who did not open an image has not judged anything. "Win first, then
     switch on" is unsatisfiable — the switch is what produces the evidence.
     So the flag is the BUILD, not the reward. It is on so the pitch is in the
     frame the critic opens.
     ⚠ AND THE FAILURE PATH CHANGED WITH IT. The old note's real worry — do not
     ship an unjudged visual to players — is held by TABLETOP-BAR §8.4 instead,
     which is the constraint that actually holds it: nothing on this board
     reaches a player until the lead bumps BB_VER/BB_BUILD together at the end
     of the pass, and this piece is forbidden from touching that pair. So "on"
     here means visible to the gauntlet, not visible to players.
     🔴 IF THE CRITIC FAILS THE PITCH, THE FIX IS THE PITCH, NOT THIS FLAG.
     Setting it back to false to make a round pass would delete the only thing
     that can be judged and score it as a win, which is TABLETOP-BAR §11's
     "a gate nobody has seen fail is not evidence" inverted into a way of
     never seeing one fail at all. Retune the numbers below, or argue in
     writing that §7 does not want painted markings. Do not re-hide it. */
  on: true,
  /* deployment depth as a FRACTION of the board's rows, floored at one row:
     12 rows → 2, 8 rows → 1, 20 rows → 4. A hardcoded "2 rows" would swallow a
     quarter of a small board and disappear on a large one, and it would be the
     14/12 literal BOARD_DEFAULT forbids, wearing a different number. */
  depFrac: 0.18,
  /* 📏 HALF-WIDTH OF A PAINTED LINE, in units of hexV(). It was 0.052 — a
     tidy 8px hairline — and round 1 measured what that actually produces, which
     is the one thing worth writing down here.
     A pointy-top hex is only full width over the middle THIRD of its depth: the
     corners sit at i*60−30°, so the x-extent is ±tileR only for |dz| ≤ R/2 and
     tapers linearly to a point at |dz| = R (HEXSPEC §1). With an EVEN row count
     the centre line falls on a row BOUNDARY, i.e. exactly where both
     neighbouring rows are tapering to their tips — at z = 0 each of rows 5 and 6
     is down to about half its width, and odd-r's ½-column shift interleaves the
     two sets of tips. So a hairline there is not a line at all: it is a row of
     8px slivers cut out of alternating tile points, and at board scale it
     disappeared completely. Measured on the r1 boardshot: the band drew (the
     A/B moved 9.26% of the frame) and was invisible.
     A band wide enough to bite into the FULL-WIDTH part of both rows is the
     only version of a centre line this lattice can carry. 0.16 hexV ≈ 0.28
     world units ≈ a quarter of a tile's depth, which reads as a painted stripe
     zigzagging across the flagstones — and the zigzag is not a defect, it is
     §3.4 being obeyed in the only way a continuous mark can obey it. */
  lineW:   0.26,
  /* chalk, not white. Pure white would be the brightest thing in the frame and
     §7 reserves that for the playfield lighting, not for its markings. */
  ink:     '#ece7d6',
  /* 🔊 ALPHAS, RAISED FROM 0.34/0.26/0.26/0.115 AFTER ROUND 1 MEASURED THEM.
     §7 asks for markings that are "subtle, painted-on", and the first pass read
     that as "faint". It is the wrong reading of the word: subtle means the
     markings must not compete with the pieces, not that they must be at the
     threshold of visibility. The ground they are painted on is not a flat
     swatch — it is a 256px photographic tile plate plus a per-tile value
     jitter plus a surface texture plus baked film grain — and a 0.11 wash over
     that is indistinguishable from the grain. §7's real test is "a player can
     see whose half is whose AT A GLANCE", which is a legibility floor, and
     §1.4's is that a round which does not visibly move the frame has not
     moved. Both fail quiet. */
  /* 🧱 A LINE IS ITS EDGES, NOT ITS FILL — the third tuning, and the one that
     actually made the marks read as PAINT. The A/B heat map (_marks-ab.mjs)
     showed the first two doing exactly what they were told and still looking
     wrong: a wide soft band of uniform alpha, on a lattice where the mark can
     only live on the tapering TIPS of two interlocked rows, reads as a patch of
     haze lying across the middle of the board — which is §1.4's "hazy wash over
     everything" arriving from a new direction. Real ground marking is the
     opposite construction: a fairly quiet fill with two HARD edges, and it is
     the edges the eye reads as a drawn line.
     So the fill drops (0.66 → 0.40) and the band widens (0.16 → 0.26 hexV) so it
     bites into the full-width part of both rows rather than only their points,
     and the two long boundaries are STROKED at edgeA on top. Those strokes are
     inside the same per-tile clip as everything else, so they break at the gaps
     like the fill does — §3.4 is not weakened by making the mark crisper. */
  lineA:   0.40,       /* the centre line's fill */
  edgeA:   0.82,       /* …and its two hard edges, which are what reads */
  depA:    0.30,       /* the deployment lines — deliberately quieter */
  depEdgeA:0.62,
  ringA:   0.54,       /* objective rings */
  /* the end-zone wash came down from 0.32 once the lines had edges: it was
     doing the whole job on its own and two rows of flat colour is a bigger
     statement than §7's "subtle, painted-on" allows. */
  zoneA:   0.24,       /* the deployment-zone wash */
  /* 🌡 HOW MUCH OF ITS END ZONE'S COLOUR A DEPLOYMENT LINE TAKES.
     Measured on the r1b boardshot, and this is the fix for a real defect
     rather than a flourish: the far end zone is 32 screen px deep against the
     near one's 61 (probe: row0 y=225, the far line y=257, the near line y=490,
     row 11 y=551), because a high fixed-pitch camera compresses the far rows
     and §2 will not trade that camera away. So a flat wash carries the two
     ends' identities very unequally, and §7's "whose half is whose at a
     glance" is decided by the most VISIBLE element, which is the line and not
     the wash. Tinting the line itself puts the colour where the eye already
     is: cool-white at the far end, warm-white at the near one, at any depth
     the camera compresses them to. */
  depTint: 0.46,
  /* 🌑 AND A DARK HALO UNDER EVERY CHALK MARK. A light-only mark is legible on
     asphalt and on shadow, and vanishes on pale rubble, sand and lit stone —
     which is most of the basics §4 wants the board to be made of. The file
     already solved this problem once for the cell division: "it carries a value
     step in each direction", a dark seam with a lit lip. Same device. The halo
     is drawn a little wider than the chalk, underneath it, so the mark has an
     edge against ANY surface without ever being the brightest thing in frame. */
  haloHue: '#14121a',
  haloA:   0.30,
  haloW:   1.18,       /* the halo's width as a multiple of the chalk's */
  /* 🔵🟠 WHOSE HALF IS WHOSE. Mirrored GEOMETRY alone cannot answer §7's "at a
     glance" test — a mirror is by definition identical on both sides, so a
     board with a centre line and two matching bands still does not say which
     band is YOURS. The two end zones are therefore washed in opposite colour
     temperatures, the way a stadium paints its two ends. Held to the
     DEPLOYMENT ROWS ONLY and not to the whole half: a tint across half the
     board would be a colour grade fighting the per-tile surface work that just
     landed, which is the §3 failure this pass exists to fix.
     ⚠ Far/near here mean ROW 0 / ROW rows-1, i.e. the two PLAYERS' ends. They
     are world-space and do NOT swing with CAMERA.yaw — a player's half stays
     their half when the camera turns round behind them. */
  farHue:  '#5f87c6',
  nearHue: '#c8863a'
};
/* 🔬 A/B HOOK. §11: "a gate nobody has seen fail is not evidence" — write the
   negative control instead of assuming it. Flip __bbMarks.on from the console
   or a harness: the `mk` term in terrainKeyParts() changes, TERR's cache misses,
   and the pitch appears or disappears WITH THE CAMERA PARKED. If it does not,
   the key term is not reaching the cache and every other claim here is
   unverified. */
try { window.__bbMarks = MARKS; } catch (e) {}

/* 📊 WHAT ROUND 1 ACTUALLY MEASURED, so the next reader starts from numbers.
   ══════════════════════════════════════════════════════════════════════════
   The pitch above was written, tuned and then parked at on:false before
   anything rendered it. Round 1 turned it on and measured it rather than
   looking at it. Scene: shot.mjs --scene mixed, 1600x900, 14x12, the shipped
   ladder. Probes live in .gauntlet/tabletop/ as _am-*.mjs.

   🔴 THE FIRST NUMBER IS THE ONE THAT CHANGES HOW YOU READ EVERY OTHER ONE.
   shot.mjs IS NOT PIXEL-DETERMINISTIC. Two renders of the IDENTICAL state
   differ by 2.43% of the frame — rain, film grain and the sky all resample. So
   "the A and B moved N% of the frame" is worthless below about 3%, and the
   earlier note in MARKS.lineW that quoted 9.26% for a band it then called
   invisible was quoting a real signal and a real invisibility at once. Every
   claim below is therefore a RATIO against a control captured by rendering the
   same state twice, never a bare percentage.

   WHAT RENDERS (signal % of a 6px row band, against that same-state control):
     far end zone wash      22-56%   at 12x to 64x the control
     far deployment line    50-56%   at 15x to 49x
     centre line + circle   37-57%   at 15x to 29x
     near deployment line   46-77%   at 26x to 126x
     near end zone wash     54-77%   at 31x to 92x
     open field between them  3-7%   at 0.5x to 2.0x, i.e. NOTHING, correctly:
                                     the plan paints nothing there and does not.
   All five marks reach the frame. Every one of them breaks at the tile gaps in
   the difference image, which is section 3.4 holding: no mark spills sideways.

   WHOSE HALF IS WHOSE (section 7's real test), as a SIGNED colour shift over
   the pixels the marks moved — because a blue wash and an orange wash of equal
   strength produce the SAME "this moved" percentage, and measuring the
   percentage is the one-degree-off question this pass keeps re-learning:
     far half   dR +8.0  dG +11.4  dB +26.5   warmth (dR-dB) -18.5
     near half  dR +36.4 dG  +7.4  dB  -1.7   warmth (dR-dB) +38.1
     control (same state twice, same pixels)  warmth +0.9 and -0.6
   The two halves move in OPPOSITE colour directions at 20x and 65x the
   control. The identity is real and it is in the pixels, not just the source.

   ⚠ AND IT IS TWICE AS STRONG AT THE NEAR END. That is the camera, not a bug:
   measured in the page, one row is 20.3 screen px deep at the far edge and
   43.3 at the near one, and the two deployment zones are 63.8 px and 138.9 px
   deep. Section 2 will not trade that fixed high camera away, so DO NOT
   "fix" the far half by pushing farHue or zoneA up — the far half would then
   be the loudest thing on a board whose brightest thing is supposed to be the
   playfield lighting, and a flat wash over the far rows is exactly the hazy
   band section 1.4 exists to delete. The asymmetry in STRENGTH is perspective.
   The asymmetry that would matter is one in MEANING, and there is none: the
   plan is exact-mirrored arithmetic, asserted by _am-keycheck.mjs.

   WHAT IT COSTS (section 8.9 — prove the frame cost, do not assert it):
   the parked-camera terrain bake goes 45.1 ms to 49.5 ms, so the markings are
   +4.4 ms, +9.8%, measured by alternating the flag across 9 pairs of real
   bakeTerrainInto calls. It is paid only when the bake key moves, which on a
   parked camera is never. Medians separate; the sample ranges overlap, so
   treat 4.4 ms as the right order of magnitude and not as three digits.

   🔬 TWO FIXES THAT WERE TRIED AND REJECTED. Both are the obvious next idea,
   so they are written down to stop the next reader spending the hour again.

   1. WIDENING THE DEPLOYMENT LINE, on the theory that a band centred on a ROW
      BOUNDARY paints only the tapering TIPS of the two rows and therefore needs
      a minimum half-width of (hexV - hexSize)/2 before it touches full-width
      ground — the same argument MARKS.lineW's header makes for the centre line.
      THE THEORY IS WRONG AND ITS OWN CONTROL KILLED IT (_am-tiparea.mjs). On
      this lattice hexV is exactly 1.5 hexSize, so the two rows' tapers are
      linear and EXACTLY COMPLEMENTARY: their widths sum to a constant all the
      way across the boundary. Painted area is dead linear in half-width —
      2.001 per unit at a boundary against 2.000 per unit at a row centre, the
      control — so there is no threshold to clear and no area to win. What does
      change below that width is the SHAPE, from a solid core to a pure zigzag
      of interleaved tips; that is a taste argument, it is not the measured one
      the header makes, and the deployment line reads at 15x to 49x the control
      as it stands. Leave it alone unless a critic fails the SHAPE.

   2. SNAPPING THE OBJECTIVE RINGS TO TILE CENTRES. The rings currently sit at
      arbitrary world points, so each one straddles two to four tiles and is
      chopped into arcs by the gaps and by any elevation step under it — it
      reads more as scuffs than as a marked point, which is a fair complaint.
      Snapping would fix the look and would also put the objective somewhere a
      unit can actually stand. IT IS INCOMPATIBLE WITH EXACT MIRRORING, which
      is the property this whole plan is built around. The lattice is odd-r:
      odd rows carry a half-column x offset. With an EVEN row count the mirror
      of row g is row rows-1-g, which has the OPPOSITE parity — so the mirror
      image of a tile centre is never a tile centre. You may have exact symmetry
      or tile-centred objectives, not both, and section 7 asks for symmetry by
      name. If a critic wants whole rings, the answer is to make the ring
      survive being chopped (a filled disc, a heavier centre dot), not to move
      it onto a tile. */

let _markPlan = null;
function markPlan(){
  /* memoised on every input it has, so a board:map resize re-derives it. The
     same string is what terrainKeyParts() hands the bake cache. */
  const sig = MAP.cols + 'x' + MAP.rows + '@' + CONFIG.tile;
  if (_markPlan && _markPlan.sig === sig) return _markPlan;
  const hv = hexV(), hw = hexW();
  const dep = Math.max(1, Math.round(MAP.rows * MARKS.depFrac));
  /* world z of the boundary between the last deployment row and the first open
     one. Row gz sits at (gz - (rows-1)/2) * hexV (gw(), HEXSPEC §3), so the gap
     after row dep-1 is half a row pitch beyond its centre. Negative = the far
     side; the near line is its exact negation, which is the mirror. */
  const zDep = (dep - 0.5 - (MAP.rows - 1) / 2) * hv;
  /* the outer edge of the outermost row: hexSize() past its centre, which is
     the pointy-top CIRCUMradius (HEXSPEC §1). Overshooting costs nothing —
     every mark is clipped to a tile, so a plan reaching past the last row
     simply finds no slab to paint on. */
  const zEnd = (MAP.rows - 1) / 2 * hv + hexSize() + hv;
  /* 🎯 OBJECTIVES — a quincunx: two in each half plus one contested in the
     middle. It is the layout that reads as symmetric in BOTH axes, so it
     survives the camera turning 90°. The middle one is the centre circle below
     rather than a fifth ring, so the centre mark is one object and not two
     concentric ones.
     ⚠ THESE ARE THE ARENA'S OBJECTIVES, NOT THE MATCH'S, and that is deliberate.
     MAP.tiles carries type:'objective' records and paintTileRec already tints
     those a few lines below; they are live board state, they move per map, and
     in the shipped payload both of them sit on row 3 — so keying the painted
     marks off them would put two rings in one half and fail "symmetry reads"
     on the first real map. A pitch's markings belong to the pitch. */
  const ox = hw * MAP.cols * 0.26, oz = hv * MAP.rows * 0.24;
  const objs = [ {x:-ox,z:-oz}, {x:ox,z:-oz}, {x:-ox,z:oz}, {x:ox,z:oz} ];
  _markPlan = {
    sig, dep, zDep, zEnd, objs,
    lw: hv * MARKS.lineW,
    /* ⚠ A RADIUS THAT HAS TO FIT INSIDE A TILE IS A FRACTION OF THE INRADIUS,
       never of the circumradius — the two differ by √3/2 on a hex and the
       header at tileR() says every ground circle in this file used to get it
       wrong because on a square cell they were the same number. */
    or: tileR() * 0.80,
    /* the centre circle. It was 1.55 inradii — 1.5 tiles across — which at
       board scale reads as one more objective token sitting on the halfway
       line rather than as the mark that OWNS the centre of the pitch. 2.45
       spans about two and a half tiles, which is the proportion a real centre
       circle has to its pitch, and it is still comfortably inside the
       innermost objective ring so the two never collide. */
    cr: tileR() * 2.45
  };
  return _markPlan;
}

/* Paint whatever of the plan falls on ONE tile, inside that tile's clip.
   `e` is the tile's own elevation, so the paint sits on the slab it belongs to
   and climbs the terrain with it instead of floating on a flat y=0 plane that
   a rung-3 tile would punch through. `nd` is the tile's lambert term, so a mark
   on a shaded flank is as dim as the ground it is painted on — without it the
   chalk is the one thing on the board that ignores the light, which is how a
   decal reads as a decal. */
function paintArenaMarks(x, z, P, e, nd){
  if (!MARKS.on) return;
  const M = markPlan();
  const w = gw(x, z, 0);
  const R = hexSize(), hw = hexW();
  const zd = Math.abs(M.zDep), az = Math.abs(w.z);
  /* Cheap rejects first: ~40% of the board touches nothing in the plan and
     must not pay for a save/clip/restore to find that out. Each test is the
     mark's own half-extent plus one circumradius, i.e. "can this tile's
     footprint possibly overlap it". */
  const hitMid  = az <= M.lw * MARKS.haloW + R;
  const hitDep  = Math.abs(az - zd) <= M.lw * 0.62 * MARKS.haloW + R;
  const hitZone = az >= zd - R;
  const hitCirc = (w.x*w.x + w.z*w.z) <= (M.cr + R) * (M.cr + R);
  let hitObj = false;
  for (const o of M.objs)
    if (Math.abs(w.x - o.x) <= M.or + R && Math.abs(w.z - o.z) <= M.or + R){ hitObj = true; break; }
  if (!(hitMid || hitDep || hitZone || hitCirc || hitObj)) return;

  /* the tile's lambert, folded in so the chalk sits in the same light as the
     slab. Floored well above zero: a marking the player cannot find on the dark
     flank of the board is §7's "symmetry reads" failing exactly where the
     deployment zones are. */
  const lit = clamp(0.42 + nd * 0.58, 0.38, 1);
  const pp = (px, pz) => project({ x:px, y:e, z:pz });
  /* A band is a strip of the ground plane in world z, spanned in world x only
     as far as this tile needs — ±hexW() about its centre, which comfortably
     covers a footprint of ±hexSize() (hexW is √3 × hexSize). Narrowing it to the
     tile is not an optimisation, it is what keeps every corner well inside the
     view frustum: a strip spanning the whole board projects one of its ends
     behind the eye at a low pitch and project() answers null there. Four
     corners of one plane under a pinhole projection stay a straight-edged quad,
     so this is the exact band, not an approximation of it. */
  const band = (z0, z1, style, edge) => {
    const q = [ pp(w.x - hw, z0), pp(w.x + hw, z0), pp(w.x + hw, z1), pp(w.x - hw, z1) ];
    if (q.some(p => !p)) return;
    pathPoly(q); ctx.fillStyle = style; ctx.fill();
    /* the two LONG boundaries only — never the short ones. A closed stroke would
       draw a bar across the band at ±hexW, i.e. a rung of a ladder every time
       the band crossed a tile, which is a lattice published on top of the
       lattice. Only the edges that are the LINE's own edges get inked. */
    if (edge){
      ctx.strokeStyle = edge; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(q[0].x, q[0].y); ctx.lineTo(q[1].x, q[1].y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(q[3].x, q[3].y); ctx.lineTo(q[2].x, q[2].y); ctx.stroke();
    }
  };
  /* a chalk line = its dark halo, then the chalk inside it. `c` is the line's
     centre in world z and `h` its half-width; the halo takes MARKS.haloW of
     that, so the two are locked together and cannot drift apart when the line
     width is retuned. */
  const line = (c, h, alpha, edgeAlpha, ink) => {
    band(c - h * MARKS.haloW, c + h * MARKS.haloW, rgba(MARKS.haloHue, MARKS.haloA * lit));
    band(c - h, c + h, rgba(ink || MARKS.ink, alpha * lit),
                       rgba(ink || MARKS.ink, edgeAlpha * lit));
  };
  /* 30 segments, not an ellipse: the ground plane is under a perspective
     projection AND under an elevation, so the true outline of a world circle on
     a raised slab is not an axis-aligned ellipse. Projecting the polygon is the
     only version of this that cannot drift off the tile it is painted on. */
  const ring = (cx, cz, r, style, width, fill) => {
    const N = 30, pts = [];
    for (let i = 0; i < N; i++){
      const a = i / N * Math.PI * 2;
      const p = pp(cx + Math.cos(a) * r, cz + Math.sin(a) * r);
      if (!p) return;
      pts.push(p);
    }
    pathPoly(pts);
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
    if (style){
      /* the same halo, as a wider dark stroke under the chalk one */
      ctx.strokeStyle = rgba(MARKS.haloHue, MARKS.haloA * lit);
      ctx.lineWidth = width * MARKS.haloW + 1; ctx.stroke();
      ctx.strokeStyle = style; ctx.lineWidth = width; ctx.stroke();
    }
  };

  ctx.save();
  pathPoly(P); ctx.clip();
  /* 🟦🟧 the two end zones, first and underneath everything else, so the white
     lines read as painted ON the coloured zone rather than beside it. */
  if (hitZone)
    band(w.z < 0 ? -M.zEnd : zd, w.z < 0 ? -zd : M.zEnd,
         rgba(w.z < 0 ? MARKS.farHue : MARKS.nearHue, MARKS.zoneA * lit));
  /* the deployment lines: the inner boundary of each zone, thinner than the
     centre line because a pitch's halfway line is the one a player looks for. */
  if (hitDep) line(w.z < 0 ? -zd : zd, M.lw * 0.62, MARKS.depA, MARKS.depEdgeA,
                   mixHexRaw(MARKS.ink, w.z < 0 ? MARKS.farHue : MARKS.nearHue, MARKS.depTint));
  /* the centre circle, then the centre line through it — in that order, so the
     line is unbroken where it crosses the circle, which is how a pitch is
     painted. */
  if (hitCirc) ring(0, 0, M.cr, rgba(MARKS.ink, MARKS.lineA * 0.80 * lit), 3.0, null);
  if (hitMid)  line(0, M.lw, MARKS.lineA, MARKS.edgeA);
  if (hitObj) for (const o of M.objs){
    if (Math.abs(w.x - o.x) > M.or + R || Math.abs(w.z - o.z) > M.or + R) continue;
    ring(o.x, o.z, M.or, rgba(MARKS.ink, MARKS.ringA * lit), 2.6, null);
    ring(o.x, o.z, M.or * 0.24, null, 0, rgba(MARKS.ink, MARKS.ringA * 0.95 * lit));
  }
  ctx.restore();
}

/* ── one tile: cliff faces, slab top, texture, cell division ─────────────── */
/* Split in two when the skirt landed. paintTile() is the FIELD's entry point
   and still looks its tile up in TILE_INDEX; paintTileRec() takes the record
   directly, which is the only way an off-board skirt cell — deliberately not in
   that index, see skirtAt() — can be drawn by the same painter as the board.
   Same code, same material, same cell division: the seam between the play field
   and the world around it has to be invisible or the plate is still there. */
function paintTile(x,z,lv){ paintTileRec(x, z, tileAt(x,z), lv); }
function paintTileRec(x,z,t,lv){
  /* ⛰ ONE ELEVATION ACCESSOR — this read `t.elev` straight off the record.
     paintWalls' floor, paintShadow, elevOf and pickTile all go through
     tileElev() → HF.y, and the two only agree while the heightfield has
     actually rebuilt for THIS map (see the key note in buildHeightfield: it
     did not, from the second map of a session onward). The top face then
     floated at the new height with its cliff faces and cast shadow still at
     the old one. Fixing the split the other way — pushing t.elev into the wall
     and shadow painters — does NOT work and is worth writing down: paintWalls
     draws a quad from THIS tile's corners down to the NEIGHBOUR's elevation
     and paintShadow lands on the tile in FRONT, so both need a positional
     accessor, not a record.
     elevOf() is the union: in-bounds it is tileElev(), out-of-bounds it is
     skirtElev(). That covers our second caller for free — paintSkirtCell()
     hands us only OFF-BOARD cells (it returns early for anything the field
     owns) and their skirtAt() record IS the memo skirtElev() reads, so this is
     byte-identical for the skirt and correct for the field. */
  const e = elevOf(x,z);
  /* 🎥 CULL, the same one paintSkirtCell() has always had. It did not exist for
     FIELD tiles because the fit guaranteed all 168 were on screen — true right
     up until the camera could pan, at which point most of the board can be off
     the edge and every one of those tiles was still paying ~12 path ops plus a
     surface texture. p.s is pixels per world unit at this depth; two
     circumradii of margin covers the hex, its cliff face and its props. */
  const c = project(gw(x,z,e));
  if (!c) return;
  const m = c.s * hexSize() * 2.4 + 24;
  if (c.x < -m || c.x > W + m || c.y < -m || c.y > H + m) return;
  const P = tilePoly(x,z,TILE_INSET,e); if (!P) return;
  const S = surfOf(t);
  const surf = (t && t.surf) || 'dirt';
  const wpos = gw(x,z);
  /* lambert-ish shade: tiles further from the light read darker. The .018 is a
     gradient PER TILE, divided by the row pitch so a wider board does not clamp
     one whole flank to the floor value. */
  const nd = clamp(.55 + lv.y*.45 + ((wpos.x*lv.x + wpos.z*lv.z)/hexW())*.018, .25, 1);

  /* 🧱 CLIFF FACES are drawn before the top they hang from — but the CALL now
     sits further down this function, after `col`, and that move is the whole of
     piece tile-side-wall's first half. The wall used to be inked from a fixed
     near-black pair that took nothing from the tile: a sand cliff and an ice
     cliff were the same hole. It is now the tile's OWN lit colour stepped down,
     so the face is made of the material standing above it, and `col` does not
     exist yet up here.
     Nothing is drawn between this point and the call, so the paint order is
     unchanged: only colour math sits in between.
     ⚠ The call itself stays UNCONDITIONAL, and that was a real bug once. It was
     `if (e > 0)`, which was true while off-board was a flat floor at y=0:
     nothing at ground level could have anything to fall to. The skirt sinks
     BELOW zero, so a play-field tile at e=0 on the rim now has a real drop on
     its outward edge, and the guard was leaving a gap there — a hairline of
     apron between the last row and the world outside it, which is the plate's
     outline drawn in negative space. paintWalls() already skips every edge whose
     neighbour is flush, so the unconditional call costs six comparisons on a
     flat interior tile and nothing else. */

  /* the slab top */
  /* mixHexRaw, not mixHex — this value gets mixed again below. See the note at
     mixHex's definition; the hex/rgb() distinction is silent and fatal. */
  let col = mixHexRaw(S.lo, S.hi, clamp(nd,0,1));
  col = mixHexRaw(col, LIGHT.key, .04 + LIGHT.keyI*.05);
  /* 🌙 EXPOSURE. Without this the board sat at the same value under every
     preset — the lambert term only tracks the sun's ELEVATION, which barely
     moves between day and night, so a night battle came out as a daylit board
     with a dark sky over it. Fold in the rig's actual energy (keyI + ambI) and
     pull the shortfall toward the ambient colour, so night is darker AND cooler
     rather than just darker. day 1.10 · dusk 0.98 · dawn 0.95 · night 0.67. */
  const expo = clamp(.34 + LIGHT.keyI*.42 + LIGHT.ambI*.50, .35, 1.15);
  if (expo < 1){
    col = mixHexRaw(col, LIGHT.ambient, clamp((1-expo)*1.25, 0, .42));
    col = mixHexRaw(col, '#000000', clamp((1-expo)*.55, 0, .28));
  }
  /* high ground catches more of the key. BAR R1 wants height readable at a
     GLANCE, and a slab whose top is shaded exactly like the floor reads as a
     hole with a rim round it — the side walls only say which way is down once
     the top says it is up. Two steps, deliberately: a lift toward the surface's
     OWN highlight (a value step, which is what carries at a glance and at small
     size) and then a smaller warm wash toward the key (which is what says the
     step is height and not a different material).
     ⚠ Both coefficients are calibrated against the TOP OF THE LADDER, not
     against absolute world height, and they were re-scaled when the ladder went
     from a 0.34 ceiling to 1.35. Left alone they clamped at the second rung and
     every raised tile — kerb, rubble apron and ruin core alike — came back the
     same washed-out pale, which quietly costs BAR R1's "surface variety within
     one map": the height was legible and the MATERIAL was not. */
  if (e > 0){
    col = mixHexRaw(col, S.hi, clamp(e*.34, 0, .40));
    col = mixHexRaw(col, LIGHT.key, clamp(.05 + e*.11, 0, .20));
  } else if (e < 0){
    /* …and the same argument in reverse for the skirt. Ground that has fallen
       away from the field is in its own shadow and further from the key, so it
       loses value as it descends. Without this the terraces outside the board
       came back the same value as the street and the whole surround read as one
       flat apron again — the plate, moved outward by three rings. */
    col = mixHexRaw(col, S.lo, clamp(-e*.30, 0, .42));
    col = mixHexRaw(col, LIGHT.ambient, clamp(-e*.13, 0, .20));
  }
  /* 🌘 THE SKIRT SINKS INTO THE DARK AS IT LEAVES. `_ring` is set only by
     skirtAt(), so this is off for every one of the 168 play tiles.
     Two jobs. One is pictorial: BAR R1's reference sits its diorama in a pool
     of light with a heavy vignette, and ground that keeps its full value all
     the way to the frame edge fights the field for attention. The other is
     GAMEPLAY, and it is the real reason. The skirt is dressing — it is not in
     TILE_INDEX and a click on it returns null — so it must never look like
     somewhere the player could stand. Value is what carries that read at a
     glance: the play field is the lit ground, everything darker than it is
     scenery. */
  const ring = (t && t._ring) || 0;
  if (ring > 0) col = mixHexRaw(col, '#0a0910', clamp(.13 + ring*.115, 0, .55));

  /* 🖼 The painting, looked up HERE rather than at the point of use, because the
     cliff faces want it too: every walled-hex plate carries its own stone skirt
     in the bottom slice of the PNG (see `top` in TILE_ART) and drawTileArt()
     throws that slice away. paintWalls() puts it back on the wall it was painted
     for. One lookup, two consumers — tileArtImage() is a hash plus a cache read,
     but calling it twice per tile for no reason is how a bake gets slower by
     accident. Play field only, same rule as the top face: the skirt keeps its
     swatches so the field reads as the lit, textured thing. */
  const _art = ring ? null : tileArtImage(surf, x, z);

  /* 🧱 …and the cliff faces, now that `col` — the material this tile is made of,
     under this light, at this height — exists to cut them from. */
  paintWalls(x,z,e,P,lv,S,col,_art);

  /* 🧩 WHICH OF MY SIX EDGES ARE REAL BOUNDARIES.
     ⚠ THE BUG THIS EXISTS TO KILL: the three marks that divide a cell — the
     cross-tile value ramp, the dark seam and the lit lip — used to be applied
     to every tile UNCONDITIONALLY. So at a boundary between two tiles on the
     SAME rung the eye got a light→dark step plus a black rule, and a six-tile
     rung-2 shelf painted as six separate slabs. A critic put it exactly right:
     the field read as 168 loose hex counters rather than as terraced ground,
     which is BAR R1's "chunky slabs at SEVERAL HEIGHTS" lost to bevelling.
     paintWalls() has always done the right thing here (`if (below >= e-1e-4)
     continue` — a flush neighbour gets no cliff face) and skirtAt's cells
     already flattened their own ramp for the same reason; the play field never
     got the treatment, and the play field is where the plate read is.
     Same test, same tolerance, same neighbour table as paintWalls, so the seam
     and the cliff face can never disagree about where a drop is.
     ⚠ `((z % 2) + 2) % 2`, not `z & 1`: this painter is the SKIRT's painter too
     and skirt rows run negative. (The two happen to agree — `-1 & 1` is 1 — but
     paintSkirtShadow already spells it the safe way and two neighbour tables
     that disagree about parity is the one bug HEXSPEC exists to prevent.)
     Skipped entirely for skirt cells: `ring` cells keep their own flat ramp and
     their own faint crack, so nothing below reads drop[] for them. */
  const drop = [0,0,0,0,0,0];
  if (!ring){
    const nbE = NB6[((z % 2) + 2) % 2];
    for (let i=0;i<6;i++) drop[i] = elevOf(x+nbE[i][0], z+nbE[i][1]) < e - 1e-4 ? 1 : 0;
  }
  /* The ramp runs far→near, so only the far and near neighbours can produce a
     visible discontinuity in it: edges 1,2 face +z (toward the eye) and edges
     4,5 face −z, for both row parities (see NB6).
     ⚠ THE TWO ENDS ARE INDEPENDENT AND ONE SCALAR CANNOT SPEAK FOR BOTH. This
     was a single `rampF` averaged over the whole tile — 1, ½ or 0 — applied to
     the far stop and the near stop alike. A canvas linear gradient has an end
     at each corner and each end meets a DIFFERENT neighbour, so averaging them
     put a half-strength dark stop against a flush far neighbour and a
     half-strength bright stop against a flush near one: on the ridged map the
     generator actually ships, almost every tile drops SOMEWHERE on the ±z axis,
     so ½ was the near-universal answer and the seam came back as shading on
     both ends of a shelf the stroke fix had just joined. Split, each stop is
     chosen by its own boundary — which is the same per-EDGE rule the seam and
     the lit lip below are drawn by, and the only version of it a two-stop
     gradient can express.
     AND, not OR, at each end, and that is forced by the geometry rather than
     chosen: a gradient END is a CORNER, and each of those corners is shared by
     TWO edges — the near corner (2) by edges 1 and 2, the far corner (5) by
     edges 4 and 5. If either of the pair is flush the ground runs on past that
     corner, and a stop that steps there cuts the shelf; only when BOTH drop is
     the corner really hanging over a cliff and entitled to the lip. OR was
     tried first and measured: same-surface flush-edge seam energy went 4.00 →
     3.52 median L with OR and 4.00 → 2.40 with AND. Nothing is lost on the
     cliff edge itself, because the lit lip there is a STROKE drawn per-edge
     below and paintWalls puts its own aggregate hairline along the same line —
     this ramp was never what made a drop legible.
     Zero, not the skirt's 0.13/0.06, at a flush end: those two figures exist so
     a skirt cell that is nobody's neighbour still has some form in it, and the
     residual step they leave (~0.19 of the lo→hi range, ~4 L on dirt) is the
     whole of what was still cutting a same-rung run into counters. An interior
     tile is not featureless without them — the ±8% value jitter above, the
     surface texture, the baked film grain and the props all still land on it.
     A tile exposed both ways keeps the full 0.30/0.16 and earns its terrace
     read; a tile that drops on one end only gets a dark lip over its cliff and
     stays flush with the shelf behind it. */
  const farF  = ring ? 0 : ((drop[4]&&drop[5]) ? 1 : 0);
  const nearF = ring ? 0 : ((drop[1]&&drop[2]) ? 1 : 0);

  /* 🎲 PER-TILE VALUE JITTER. Without it every dirt tile is the identical
     swatch and the board reads as painted cardboard hexes rather than as
     ground that happens to be divided into cells — the same "grid on a photo"
     smell, arrived at from the other direction. Hashed off the tile, so it is
     stable across rebuilds.
     ⚠ It was ±17% on the field and that was too much once the ramp above was
     joined up: a swatch step that large per hex re-cuts the shelf the gradient
     fix just merged, so the counters came back as a checkerboard instead of as
     bevels. The skirt's ±8% is enough to break a flat fill without redrawing
     the lattice, so the field now uses the same number. */
  const j = (_sHash(x,z,7) - .5) * .16;
  col = mixHexRaw(col, j > 0 ? S.hi : S.lo, Math.abs(j));
  /* …and a value gradient across the tile itself, dark at the far edge and lit
     at the near one. Corner i sits at i*60−30 degrees, so on a POINTY-TOP hex
     the extreme −z (far) corner is i=5 (270°) and the extreme +z (near) corner
     is i=2 (90°). Measured on the live projection: dz = −0.577 at corner 5 and
     +0.577 at corner 2, against ±0.289 at corners 4 and 1.
     ⚠ THIS RAN P[4]→P[1] AND THAT QUIETLY UNDID THE PER-EDGE FIX ABOVE. Those
     two corners are the ±0.289 pair, so the ramp axis came out 60° off true
     far→near — it ran mostly EAST–WEST. The rampF gate below is chosen from
     drops on edges 1,2,4,5 (the ones that face ±z) precisely because that is
     where a far→near ramp can break at a shared edge; with the axis rotated,
     the ramp's biggest break landed on edges 0 and 3, the E/W pair, which the
     gate never touches. Measured on the ground layer over every flush edge of
     the shipped map: the ramp parameter stepped 0.877 across a flush E/W edge
     and only 0.235 across edges 2/5. So a run of same-rung tiles in one ROW —
     the commonest shelf there is — still met with a full light→dark step after
     the seam and the lip had been correctly removed from it, and the field kept
     reading as loose counters. Corrected the axis is 0.228 at E/W and the whole
     break moves onto 1,2,4,5, where rampF can flatten it. */
  pathPoly(P);
  const tg = ctx.createLinearGradient(P[5].x, P[5].y, P[2].x, P[2].y);
  /* Flatter across a skirt cell, and now equally flat across the INTERIOR of a
     field shelf. On an exposed tile this cross-tile ramp is what stops a hex
     reading as a flat swatch; where the neighbour is flush the same ramp draws
     a bright rim on that cell's near half, which is the cell division coming
     back as shading after it was deliberately taken out of the stroke.
     Neighbouring cells at one height have to merge into a shelf. */
  /* The skirt keeps its own 0.13/0.06 unchanged — its cells are dressing, they
     are nobody's flush neighbour on the field's own terms, and the ring darken
     above already carries them away from the play surface. The FIELD's flush
     end goes to zero instead; see the note at farF/nearF for why the skirt's
     residual is the wrong number here even though it was the right one there. */
  tg.addColorStop(0, mixHexRaw(col, S.lo, ring ? .13 : farF*.30));
  tg.addColorStop(1, mixHexRaw(col, S.hi, ring ? .06 : nearF*.16));
  ctx.globalAlpha = ring ? 1 : S.a; ctx.fillStyle = tg; ctx.fill(); ctx.globalAlpha = 1;
  /* 🖼 The painting, if this surface has one and it has loaded. Looked up above,
     beside the cliff faces, which wear the same file's skirt slice. */
  const _arted = _art ? drawTileArt(_art, P, col, x, z) : false;
  if (t && t.type === 'hazard'){ pathPoly(P); ctx.fillStyle = rgba('#5a1a0e',.34); ctx.fill(); }
  if (t && t.type === 'objective'){ pathPoly(P); ctx.fillStyle = rgba('#6a5a1e',.30); ctx.fill(); }

  if (!_arted){ ctx.save(); pathPoly(P); ctx.clip(); paintSurfTexture(x,z,e,S,surf); ctx.restore(); }
  /* 🏟 THE ARENA MARKINGS, on this tile only and inside its own clip.
     ⬇ ORDER IS THE ARGUMENT, so do not move this call.
     AFTER the slab, the painting and the surface texture: chalk goes on top of
     the ground, not under it.
     BEFORE drawTileRim(): the rim is a physical stone kerb standing at the
     tile's edge (§3.3), and paint runs UNDER a kerb rather than over it. Drawn
     after the rim the line would climb the bevel and read as a decal laid on
     the model.
     BEFORE the aerial-perspective fog below, so a marking on a far row sits in
     the same haze as the slab it is painted on.
     And of course before every unit, prop and shadow — all of those are drawn
     live on top of the terrain BAKE, which is §7's "under the pieces" for free.
     Skipped for `ring` cells for the same reason the lit lip is: the skirt is
     dressing, it is not in TILE_INDEX and a click on it answers null. Painting
     a deployment zone out there would invite the player to deploy onto ground
     the picker does not believe exists. */
  if (!ring) paintArenaMarks(x, z, P, e, nd);
  /* 🧱 and the frame that makes it a tabletop piece. After the art and the
     texture, before the fog and the seam, so the fog still settles over the whole
     piece and the rim does not sit on top of the atmosphere.
     🧨 THE ELEM_TEX GATE IS GONE (2026-09-14, piece tile-edge-physical) and that
     overrides a decision this file argued for in writing — the full argument and
     the answer to it are in drawTileRim's header. One line of it here so a
     reader of THIS line is not surprised: the rim ran on the 19 elemental
     surfaces only, so dirt, asphalt, rubble, grass, water, mud and sand — the
     ≥60% of the board §4 wants to be basics — had no rim, no bevel and no
     contact seam, which is TABLETOP-BAR §3.1 failing on the majority of the
     board. The surf key is passed now because the kerb's MATERIAL is what
     reconciles the override with the objection.
     Still skipped for ring cells: the skirt is dressing, it is not in
     TILE_INDEX, and framing it would publish a lattice over ground the picker
     answers null for — the same argument the lit lip is withheld by below. */
  if (!ring) drawTileRim(P, S, lv, surf);

  /* 🌫 AERIAL PERSPECTIVE. Far rows sit further into the fog. Without it a
     14-deep board reads as a flat sheet of the same value from the horizon to
     the player's feet, which is the "flat plate" fail condition wearing a
     texture. Row 0 is the far edge. */
  const hz = clamp(1 - z/Math.max(1,MAP.rows-1), 0, 1.25) * (.06 + LIGHT.haze*.20);
  if (hz > .004){ pathPoly(P); ctx.fillStyle = rgba(LIGHT.fog, hz); ctx.fill(); }

  /* 🔲 THE CELL DIVISION — and this is the line that used to be
     `rgba('#d2a44e', .30 + nd*.18)`, a 1.2px GOLD stroke on all 168 tiles.
     Together with a rune circle on every one of them it was the single loudest
     reason the board read as "a grid drawn on a photo" (a named BAR R1 fail):
     the brightest, most saturated thing in the frame was the lattice itself.
     The grid still has to be LEGIBLE — this is a tactics game and the player
     picks cells — so it is drawn the way paving is divided instead: a dark
     seam with a thin lit lip on the sunward side of it. That reads as the
     GROUND being divided rather than as jewellery laid on top, and it survives
     both a dark asphalt tile and a pale rubble one because it carries a value
     step in each direction. */
  /* …and the skirt gets the dark seam only, faint, with NO lit lip. The lip is
     what says "this is a cell you can pick"; drawing it out here would publish
     a 24x18 grid over a 14x12 board and invite the player to click ground the
     picker will answer null for. The faint dark seam stays because without any
     division at all the surround flattens into one poured slab — but it reads
     as a crack in the ground, not as a cell edge. */
  if (ring){
    pathPoly(P);
    ctx.strokeStyle = 'rgba(6,6,10,.13)';
    ctx.lineWidth = 1.0; ctx.stroke();
  } else {
    /* 🧱→🧩 PER-EDGE, NOT PER-TILE. The seam and its lit lip are the mark of a
       STEP, so they are drawn only where there is one — the same drop[] the
       cliff faces are chosen by, above. On a flush edge both are omitted and
       the two tops meet with nothing between them but the joined-up ramp, so a
       run of same-rung tiles paints as one continuous surface with a single
       cliff face round its outer boundary. That is the terrace read; a black
       rule on every one of the six edges was what destroyed it.
       Drawn as open segments rather than as a closed path: a closed path would
       put the stroke back on the flush edges by definition. */

     n·c > ap. Written without it — n·c > 0 — this band reported
     [0.015, 0.638] on the shipped cliff rig while the faces the renderer
     actually drew spanned [0.015, 0.153]: the +x normal is 0.39 world units

     band and diluting u by 4.5x. Measured through: median two-flank spread
     came back 3.6 L (cliff) / 2.4 L (mixed) with the loose band against
     5.3 / 4.9 with the tight one. Same factor, same constants. */
  const ap = (hexSize() - TILE_INSET) * Math.cos(Math.PI/6);

  for (let i = 0; i < 6; i++){

    const nx = Math.cos(a), nz = Math.sin(a);

       end of the band, which is the right answer for it anyway.
       ⚠ THE BAND STEPS WHEN A FACE JOINS OR LEAVES THE SILHOUETTE, and on a
       yawing camera that is a board-wide value step on the faces that stay.

       test is a copy of the renderer's own cull, so the band changes at
       exactly the yaw where a new row of cliff faces starts being painted —
       the one moment the wall values were always going to change. A face
       crossing that boundary is edge-on and contributes no pixels of its own.

       rejected as more machinery than the artefact is worth; if a future round

     the factor becomes a no-op rather than a divide-by-nothing amplifying
     numerical noise into a random per-face value. */
  if (n < 2 || hi - lo < .06){ lo = 0; hi = 1; }

     exact defect round 1 of this piece existed to remove ('the foot value did

        shipped: it bought +0.3 L of median spread and cost 3-4 L off every foot

        round wants the flanks further apart, the lever with room in it is the

    const u = clamp((lam - _band.lo) / Math.max(_band.hi - _band.lo, 1e-3), 0, 1);

       SCALED, NOT CLIPPED, AND THE FOOT GOES WITH IT. Multiplying both endpoints
       by one factor is a pure value move: hue survives (an ice cliff stays blue,
       a lava cliff stays red — the property the whole material rewrite exists
       for), the lip→foot ordering survives, and the per-rung creases follow for
       free because they are mixHexRaw(lipC,footC,f) rather than inks of their
       own. Clamping lipC alone would have inverted the OTHER pair on a shallow
       face and re-introduced the bug one layer down.
       Costs nothing on a surface that was already obeying the rule — the branch
       does not run at all. On the two frozen fixtures, with the relative floors
       above in place, it currently fires on ZERO of 174 faces: the ramp puts
       every lip under its own top face on its own. That is the intended state.
       It is kept because the floors, `tier` and the key term are all free to
       move and the ordering must not depend on them not moving — with the OLD
       absolute floor it fired on 42 of those same 174 faces. */
    const _lipL = _hexL(lipC);
    if (_lipL > _capL){
      const k = _capL / (_lipL || 1);
      lipC  = mixHexRaw(lipC,  '#000000', 1 - k);
      footC = mixHexRaw(footC, '#000000', 1 - k);
    }
    g2.addColorStop(0, lipC);
    const span = e - below;
    for (let k = 0; k < rungs.length; k++){
      const r = rungs[k];
      if (r >= e - 1e-4 || r <= below + 1e-4) continue;    /* strictly inside the drop */
      const f = clamp((e - r)/span, .04, .96);             /* rungs[] descends → f ascends */
      const band = mixHexRaw(lipC, footC, f);
      g2.addColorStop(f - .022, mixHexRaw(band, '#000000', .40));
      g2.addColorStop(f + .006, mixHexRaw(band, LIGHT.key, .18));

       AFTER the ramp, never instead of it: see paintWallArt's header. */
    if (art) paintWallArt(art, [P[i], P[j], B[j], B[i]], x, z, i);
    /* a hairline of exposed aggregate along the broken lip — the surface's own
       grit now, not one fixed stone colour, for the same reason the ramp is. */
    ctx.beginPath(); ctx.moveTo(P[i].x,P[i].y); ctx.lineTo(P[j].x,P[j].y);
    ctx.strokeStyle = rgba(mixHexRaw(_mat.grit || '#8a7f6c', LIGHT.key, .3), .10 + lam*.28);
    ctx.lineWidth = 1.4; ctx.stroke();
