/* The host draws the hover action menu in ITS document, so it needs to know
   where this unit is on screen. Same projection drawUnit uses; values are CSS
   pixels inside this iframe (ctx carries the DPR transform, W/H are CSS px),
   so the host only has to add the stage's page offset. */
function unitScreenBox(u){
  if (!u) return null;
  const base = gw(u.x, u.z, tileElev(u.gx, u.gz));
  const wy = base.y + u.y;
  const foot = project({ x:base.x, y:wy, z:base.z });
  const head = project({ x:base.x, y:wy + unitWorldH(u.def), z:base.z });
  if (!foot || !head) return null;
  const h = Math.abs(foot.y - head.y);
  const w = h * 0.8;
  return { left: foot.x - w/2, top: head.y, width: w, height: h };
}
function drawTomb(tb){
  const wp = gw(tb.x, tb.z, tileElev(tb.x, tb.z));
  const foot = project({ x:wp.x, y:wp.y, z:wp.z });
  const head = project({ x:wp.x, y:wp.y + 0.62, z:wp.z });
  if (!foot || !head) return;
  const h = Math.abs(foot.y - head.y), w = h * 0.78;
  shadowEllipse(wp, .20, .55);
  /* a glowing stone is about to revive — pulse a ring under it */
  if (tb.glowing){
    const c = project({ x:wp.x, y:wp.y + .01, z:wp.z });
    if (c){
      const R = ringPx(c, tileR() * 0.76);      /* 0.76 of the hex inradius */
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, .44);
      ctx.strokeStyle = rgba('#9fe8ff', .45 + Math.sin(T * 3.2) * .3);
      ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.stroke(); ctx.restore();
    }
  }
  const img = tb.img ? artImage(tb.img) : null;
  if (img && img.width){
    const dw = Math.round(w), dh = Math.round(h);
    const sm = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = dw <= img.width;
    ctx.drawImage(img, Math.round(foot.x - w/2), Math.round(foot.y - h), dw, dh);
    ctx.imageSmoothingEnabled = sm;
  } else {
    /* carved slab fallback so a missing texture still reads as a grave */
    ctx.save(); ctx.translate(foot.x, foot.y);
    ctx.fillStyle = rgba('#8d8a95', .92); ctx.strokeStyle = rgba('#0a0810', .9); ctx.lineWidth = Math.max(1, h*.05);
    ctx.beginPath();
    ctx.moveTo(-w*.32, 0); ctx.lineTo(-w*.32, -h*.55);
    ctx.quadraticCurveTo(-w*.32, -h*.92, 0, -h*.92);
    ctx.quadraticCurveTo(w*.32, -h*.92, w*.32, -h*.55);
    ctx.lineTo(w*.32, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = rgba('#5a5866', .95);
    ctx.fillRect(-w*.10, -h*.72, w*.20, h*.06);
    ctx.fillRect(-w*.04, -h*.80, w*.08, h*.30);
    ctx.restore();
  }
  if (tb.looted === false && tb.lootable){
    ctx.save(); ctx.translate(foot.x + w*.34, foot.y - h*.86);
    ctx.fillStyle = rgba('#ffd15a', .95); ctx.beginPath(); ctx.arc(0,0, Math.max(3, h*.09), 0, 7); ctx.fill();
    ctx.restore();
  }
}
function drawUnit(u){
  const base = gw(u.x, u.z, tileElev(u.gx,u.gz));
  const wy = base.y + u.y;
  const foot = project({ x:base.x, y:wy, z:base.z }); if (!foot) return;
  const head = project({ x:base.x, y:wy + unitWorldH(u.def), z:base.z }); if (!head) return;
  const k = Math.abs(foot.y - head.y);
  if (u.y > -0.9) shadowEllipse(base, .30, .8);

  /* 🔴 WHOSE IS WHOSE. Enemy units and heroes stand in a red pool with a red
     rim; the player's are untouched. On this board the units are painted on a
     canvas, so the DOM board's .unit.ai styling cannot reach them — this is the
     same read, done in the stage. */
  if (u.side === 'foe' && u.y > -0.9 && !u.dead){
    const isHero = !!(u.def && (u.def.hero || u.def.isHero)) || /hero/i.test(String(u.key||''));
    ctx.save();
    ctx.translate(foot.x, foot.y);
    ctx.scale(1, 0.34);
    const rr = k * (isHero ? 0.52 : 0.42);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rr);
    g.addColorStop(0, 'rgba(232,64,52,' + (isHero ? 0.42 : 0.30) + ')');
    g.addColorStop(0.6, 'rgba(226,58,48,0.16)');
    g.addColorStop(1, 'rgba(226,58,48,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.2832); ctx.fill();
    ctx.lineWidth = isHero ? 3 : 2;
    ctx.strokeStyle = 'rgba(255,86,70,' + (isHero ? 0.85 : 0.6) + ')';
    ctx.beginPath(); ctx.arc(0, 0, rr * 0.78, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  const sh = u.shake ? Math.sin(T*60)*u.shake*8 : 0;
  ctx.translate(foot.x + sh, foot.y);
  ctx.scale(u.face * u.scaleX, u.scaleY);
  /* clip below the tile while rising out of the ground */
  if (u.y < -0.02){
    ctx.save();
    ctx.beginPath(); ctx.rect(-k, -k*2.4, k*2, k*2.4 - Math.max(0, -u.y*k*0.92));
    ctx.clip();
  }
  /* rim light from the sun/moon */
  ctx.save();
  ctx.shadowColor = rgba(LIGHT.rim, .8); ctx.shadowBlur = k*.16;
  paintSprite(ctx, u.key, k, u.def.color, T + u.bob);
  ctx.restore();
  if (u.flash > 0){
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = u.flash;
    paintSprite(ctx, u.key, k, '#ffffff', T + u.bob);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  if (u.y < -0.02) ctx.restore();
  ctx.restore();

  /* selection ring */
  if (selected === u.id){
    const c = project({x:base.x, y:base.y+.01, z:base.z});
    if (c){
      const R = ringPx(c, tileR() * 0.84);      /* 0.84 of the hex inradius */
      ctx.save(); ctx.translate(c.x,c.y); ctx.scale(1,.44);
      ctx.strokeStyle = rgba('#7fe89f', .55 + Math.sin(T*3)*.25); ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.stroke(); ctx.restore();
    }
  }
}

/* ══════════════════════════════════════════════════════════════════
   EFFECTS
   ══════════════════════════════════════════════════════════════════ */
function drawEffects(pass){
  for (const f of effects){
    const p = f.t / f.dur, a = 1 - p;
    if (f.k === 'ring' && pass === 'ground'){
      const c = project({x:f.x, y:.02, z:f.z});
      /* f.r0/f.r1 are stored at the push sites as fractions of the OLD half
         tile (0.5), so ×2 reads them as fractions of tileR() — one conversion
         here beats editing a dozen effects.push() calls that never knew what
         unit they were in. */
      if (c){ const R = ringPx(c, tileR() * lerp(f.r0,f.r1,easeOut(p)) * 2);
        ctx.save(); ctx.translate(c.x,c.y); ctx.scale(1,.44);
        ctx.strokeStyle = rgba(f.col, a*.9); ctx.lineWidth = 3*a+1;
        ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.stroke(); ctx.restore(); }
    }
    if (f.k === 'rune' && pass === 'ground'){
      const c = project(gw(f.gx,f.gz,tileElev(f.gx,f.gz)+.004));
      if (c){ const R = ringPx(c, tileR() * 0.88);   /* 0.88 of the inradius */
        ctx.save(); ctx.translate(c.x,c.y); ctx.scale(1,.46); ctx.rotate(T*1.4);
        ctx.strokeStyle = rgba(f.col, a*.95); ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,R*.66,0,7); ctx.stroke();
        for (let i=0;i<12;i++){ const ang=i*Math.PI/6;
          ctx.beginPath(); ctx.moveTo(Math.cos(ang)*R*.68, Math.sin(ang)*R*.68);
          ctx.lineTo(Math.cos(ang)*R*.98, Math.sin(ang)*R*.98); ctx.stroke(); }
        ctx.restore(); }
    }
    if (f.k === 'pillar' && pass === 'air'){
      const b = project(gw(f.gx,f.gz,0)), t2 = project(gw(f.gx,f.gz,4.2));
      if (b && t2){
        const R = ringPx(b, tileR() * 0.84) * (1 - p*.25);  /* 0.84 inradius */
        const g = ctx.createLinearGradient(b.x, b.y, t2.x, t2.y);
        g.addColorStop(0, rgba(f.col, a*.75)); g.addColorStop(.5, rgba(f.col, a*.3)); g.addColorStop(1, rgba(f.col,0));
        ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(b.x-R, b.y); ctx.lineTo(b.x+R, b.y);
        ctx.lineTo(t2.x+R*.5, t2.y); ctx.lineTo(t2.x-R*.5, t2.y); ctx.closePath(); ctx.fill(); ctx.restore();
      }
    }
    if (f.k === 'impact' && pass === 'air'){
      const c = project({x:f.x, y:.5, z:f.z});
      if (c){ ctx.save(); ctx.globalCompositeOperation='lighter';
        const g = ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,60*(1+p));
        g.addColorStop(0, `rgba(255,230,180,${a})`); g.addColorStop(1,'rgba(255,180,80,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,60*(1+p),0,7); ctx.fill(); ctx.restore(); }
    }
    if (f.k === 'float' && pass === 'air'){
      const c = project({x:f.x, y:1.1 + p*.9, z:f.z});
      if (c){ ctx.font = `700 ${Math.round(20*c.s*.06+11)}px Cinzel, serif`;
        ctx.textAlign='center'; ctx.fillStyle = rgba(f.col, a);
        ctx.strokeStyle='rgba(0,0,0,.8)'; ctx.lineWidth=3; ctx.strokeText(f.txt,c.x,c.y); ctx.fillText(f.txt,c.x,c.y); }
    }
    if (f.k === 'flash' && pass === 'screen'){
      ctx.fillStyle = `rgba(255,246,220,${a*a*.75})`; ctx.fillRect(0,0,W,H);
    }
    if (f.k === 'ember2d' && pass === 'screen'){
      ctx.fillStyle = rgba(f.col, a);
      ctx.beginPath(); ctx.arc(f.x, f.y, 2.4*a+.6, 0, 7); ctx.fill();
    }
  }
}
function drawParticles(){
  /* dust puffs first (they sit under the sparks), back to front */
  const puffs = particles.filter(p => p.puff).sort((a,b) => a.z - b.z);
  for (const p of puffs){
    const pr = project({x:p.x, y:p.y, z:p.z}); if (!pr) continue;
    const k = clamp(p.t/p.life, 0, 1);
    const R = Math.max(1, lerp(p.r0, p.r1, easeOut(k)) * pr.s);
    /* fade in fast, hang, then fall away slowly */
    const a = Math.min(1, k/0.12) * Math.pow(1-k, 1.7) * 0.42;
    if (a <= 0.004) continue;
    const tint = mixHex(p.col, LIGHT.key, .3);
    const rgbm = tint.match(/\d+/g) || [185,165,130];
    const cr = Math.round(rgbm[0]*p.tone), cg = Math.round(rgbm[1]*p.tone), cb = Math.round(rgbm[2]*p.tone);
    const g = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, R);
    g.addColorStop(0,   `rgba(${cr},${cg},${cb},${a})`);
    g.addColorStop(.45, `rgba(${cr},${cg},${cb},${a*.55})`);
    g.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle = g;
    /* squashed against the ground plane */
    ctx.beginPath(); ctx.ellipse(pr.x, pr.y, R, R*0.46, 0, 0, 7); ctx.fill();
  }
  for (const p of particles){
    if (p.puff) continue;
    const pr = project({x:p.x, y:p.y, z:p.z}); if (!pr) continue;
    const a = p.amb ? .35 + Math.sin(T*1.4 + p.w)*.25 : clamp(1 - p.t/p.life, 0, 1);
    ctx.globalCompositeOperation = p.soft ? 'source-over' : 'lighter';
    ctx.fillStyle = rgba(p.col, a * (p.soft ? .45 : .9));
    const s = p.size * pr.s * .045 + .6;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, s, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* UI safe-area guides (dev only) */
function drawGuides(){
  if (!showGuides) return;
  const b = VIEW.box;
  ctx.save(); ctx.setLineDash([7,6]); ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(120,220,255,.55)';
  ctx.strokeRect(b.l, b.t, b.w, b.h);
  ctx.fillStyle = 'rgba(10,20,30,.5)';
  ctx.fillRect(0,0,b.l,H); ctx.fillRect(W-b.r,0,b.r,H); ctx.fillRect(b.l,0,b.w,b.t); ctx.fillRect(b.l,H-b.b,b.w,b.b);
  ctx.setLineDash([]); ctx.fillStyle = 'rgba(150,230,255,.85)';
  ctx.font = '600 11px Cinzel, serif'; ctx.textAlign='left';
  ctx.fillText('UI SAFE AREA — LEFT HUD ('+Math.round(b.l)+'px)', 12, 22);
  ctx.textAlign='right';
  ctx.fillText('RIGHT HUD ('+Math.round(b.r)+'px)', W-12, 22);
  ctx.textAlign='center';
  ctx.fillText('TOP HUD ('+Math.round(b.t)+'px)', b.l+b.w/2, b.t-8);
  ctx.fillText('HAND / BOTTOM HUD ('+Math.round(b.b)+'px)', b.l+b.w/2, H-b.b+18);
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════
   UPDATE + FRAME
   ══════════════════════════════════════════════════════════════════ */
function update(dt){
  /* cosmetic summon rise — see summonFx() */
  for (const u of units){
    if (!u.rise || u.riseT === undefined) continue;
    u.riseT += dt;
    const rt = clamp(u.riseT / 0.42, 0, 1);
    u.y = lerp(-1.1, 0, easeBack(rt));
    u.scaleX = lerp(.7, 1, easeOut(rt));
    u.scaleY = lerp(.7, 1, easeOut(rt));
    if (rt >= 1){
      u.rise = 0; u.riseT = undefined; u.y = 0;
      u.scaleY = 1.16; u.scaleX = .88;            // landing squash; springs back below
      const wp = gw(u.gx, u.gz, tileElev(u.gx, u.gz));
      effects.push({ k:'ring', x:wp.x, z:wp.z, t:0, dur:.55, col:(u.def&&u.def.color)||'#f6dc95', r0:.1, r1:1.0 });
      dust(wp.x, wp.z, 14);
    }
  }
  /* light lerp */
  if (lightLerp){
    lightLerp.t += dt/lightLerp.dur;
    const k = clamp(lightLerp.t, 0, 1), A = lightLerp.from, B = lightLerp.to;
    LIGHT = {
      az:lerp(A.az,B.az,k), elev:lerp(A.elev,B.elev,k),
      key:mixHexRaw(A.key,B.key,k), keyI:lerp(A.keyI,B.keyI,k),
      ambient:mixHexRaw(A.ambient,B.ambient,k), ambI:lerp(A.ambI,B.ambI,k),
      sky:[mixHexRaw(A.sky[0],B.sky[0],k), mixHexRaw(A.sky[1],B.sky[1],k), mixHexRaw(A.sky[2],B.sky[2],k)],
      fog:mixHexRaw(A.fog,B.fog,k), rim:mixHexRaw(A.rim,B.rim,k),
      body: k>.5 ? B.body : A.body, disc:mixHexRaw(A.disc,B.disc,k), haze:lerp(A.haze,B.haze,k)
    };
    if (k>=1) lightLerp = null;
  }
  for (const u of units){
    u.bob += dt;
    if (u.shake) u.shake = Math.max(0, u.shake - dt*1.6);
    if (u.flash) u.flash = Math.max(0, u.flash - dt*3);
    /* spring the squash back */
    u.scaleX += (1 - u.scaleX) * Math.min(1, dt*9);
    u.scaleY += (1 - u.scaleY) * Math.min(1, dt*9);
    if (u.tween){
      const tw = u.tween; tw.t += dt/tw.dur;
      const k = clamp(tw.t,0,1), e = easeInOut(k);
      u.x = lerp(tw.x0, tw.x1, e); u.z = lerp(tw.z0, tw.z1, e);
      u.y = Math.sin(k*Math.PI) * 0.28;
      if (k < .18) { u.scaleY = lerp(1,.86,k/.18); u.scaleX = lerp(1,1.12,k/.18); }
      if (k >= 1){
        u.tween = null; u.anim='idle'; u.x = tw.x1; u.z = tw.z1; u.y = 0;
        u.scaleY = 1.18; u.scaleX = .86;
        dust(gw(u.x,u.z).x, gw(u.x,u.z).z, 14);
        /* ← REPLACE with the game's rule for when an event resolves */
        if (eventsAt(u.gx, u.gz).length) triggerEvent(u.gx, u.gz, u.id);
      }
    } else if (!u.rise) {
      u.y = Math.sin(u.bob*1.7)*0.022;   /* idle breathe */
    }
    if (u.lunge){
      u.lunge.t += dt/u.lunge.dur;
      const k = clamp(u.lunge.t,0,1);
      const amt = Math.sin(k*Math.PI)*.34;
      u.x = u.gx + u.lunge.dx*amt; u.z = u.gz + u.lunge.dz*amt;
      if (k>=1){ u.lunge=null; u.x=u.gx; u.z=u.gz; }
    }
    if (u.dead){ u.deathT += dt; u.scaleY = Math.max(0, 1-u.deathT*1.6); }
  }
  units = units.filter(u => !u.dead || u.deathT < .8);
  for (const p of particles){
    if (p.amb){
      p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
      if (p.y > 3.8){ const b = moteBox(); p.y = .05; p.x = rnd(-b.x,b.x); p.z = rnd(-b.z,b.z); }
      continue;
    }
    p.t += dt;
    if (p.puff){
      /* dust billows outward then stalls as it loses energy */
      const k = Math.pow(0.12, dt);
      p.vx *= k; p.vz *= k; p.vy *= Math.pow(0.5, dt);
      p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
      continue;
    }
    p.vy -= p.g*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    if (p.y < 0){ p.y = 0; p.vy *= -0.32; p.vx *= .6; p.vz *= .6; }
  }
  particles = particles.filter(p => p.amb || p.t < p.life);
  updateFlames(dt);
  if (GROUND.fade < 1) GROUND.fade = Math.min(1, GROUND.fade + dt/0.8);
  if (BACKDROP.fade < 1) BACKDROP.fade = Math.min(1, BACKDROP.fade + dt/0.9);
  if (holoIn < 1) holoIn = Math.min(1, holoIn + dt/2.2);   /* settle in gently */
  for (const f of effects){
    f.t += dt;
    if (f.k === 'ember2d'){ f.x += f.vx*dt; f.y += f.vy*dt; f.vy += 40*dt; }
  }
  effects = effects.filter(f => f.t < f.dur);
}
function mixHexRaw(a,b,t){
  const A=hexRgb(a), B=hexRgb(b);
  const to = v => v.toString(16).padStart(2,'0');
  return '#'+to(Math.round(lerp(A[0],B[0],t)))+to(Math.round(lerp(A[1],B[1],t)))+to(Math.round(lerp(A[2],B[2],t)));
}

let frameErr = false;
/* ══════════════════════════════════════════════════════════════════════════
   🎨 TILE SURFACES — canvas-2D, painted INSIDE the stage's own pass.
   ⚠ Deliberately NOT WebGL. The shader version compiled, issued draw calls and
   still produced no fragments on real hardware (state/driver-dependent, and it
   differed between machines). The 2D canvas is the one surface this game
   provably renders everywhere — so the hazards live there too: same slot
   (above the ground, below the depth-sorted actors), same `board:surfaces`
   message, no extra GPU context, and pixel-verifiable.
   Each tile is clipped to its own projected quad; looks are seeded per tile so
   patterns don't march in lockstep, and animate off the shared clock T. */
let SURFACES = {};                 /* "x,z" -> effect key */
function _sHash(x, z, n){ let h = (x * 73856093) ^ (z * 19349663) ^ ((n || 0) * 83492791); h = (h ^ (h >> 13)) * 1274126177; h = (h ^ (h >> 16)) >>> 0; return (h % 10000) / 10000; }
/* The tile's clip polygon. It used to offset the GRID coordinates by ±0.5 and
   project the four corners — an offset of ±half a COLUMN, which on a staggered
   hex lattice is not a tile corner at all (and on odd rows is not even on the
   tile). Build the same hexagon tilePoly does, from the same hexCorners(), so
   the paint can never drift off the tile it belongs to. Still called _sQuad
   because the whole surface-FX API and all 17 painters take `q`; only the
   number of points in it changed. */
function _sQuad(gx, gz){
  return tilePoly(gx, gz, 0, tileElev(gx, gz) + 0.012);
}
/* one painter per effect key — c is pre-clipped to the tile quad.
   (cx,cy) centre, r ≈ half-width in px, T = clock. */
const SURFACE_2D = {
fire(c, q, cx, cy, r, T, gx, gz){
  const fl = 0.85 + 0.15 * Math.sin(T * 11 + gx * 3 + gz);
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, 'rgba(255,214,92,' + (0.95 * fl) + ')');
  g.addColorStop(0.45, 'rgba(255,122,28,' + (0.8 * fl) + ')');
  g.addColorStop(1, 'rgba(140,20,0,0.12)');
  c.globalCompositeOperation = 'lighter';
  c.fillStyle = g; c.fillRect(cx - r, cy - r * 1.2, r * 2, r * 2.2);
  for (let i = 0; i < 5; i++){
    const a = _sHash(gx, gz, i) * 6.28, d = r * (0.15 + 0.5 * _sHash(gz, gx, i));
    const fx = cx + Math.cos(a) * d, fh = r * (0.5 + 0.5 * _sHash(gx, gz, i + 9)) * (0.8 + 0.3 * Math.sin(T * 9 + i * 2.1));
    const fg = c.createLinearGradient(fx, cy + r * 0.2, fx, cy - fh);
    fg.addColorStop(0, 'rgba(255,150,40,0.85)'); fg.addColorStop(1, 'rgba(255,220,120,0)');
    c.fillStyle = fg;
    c.beginPath(); c.moveTo(fx - r * 0.12, cy + r * 0.25); c.quadraticCurveTo(fx, cy - fh, fx + r * 0.12, cy + r * 0.25); c.fill();
  }
},
ice(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(158,204,238,0.82)'; c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineWidth = Math.max(1, r * 0.045);
  for (let i = 0; i < 4; i++){
    const a = _sHash(gx, gz, i) * 6.28;
    c.beginPath(); c.moveTo(cx, cy);
    let px = cx, py = cy;
    for (let s2 = 1; s2 <= 3; s2++){
      px += Math.cos(a + (_sHash(gx, gz, i * 3 + s2) - 0.5)) * r * 0.36;
      py += Math.sin(a + (_sHash(gz, gx, i * 3 + s2) - 0.5)) * r * 0.3;
      c.lineTo(px, py);
    }
    c.stroke();
  }
  const tw = 0.5 + 0.5 * Math.sin(T * 3 + gx + gz * 2);
  c.fillStyle = 'rgba(255,255,255,' + (0.5 * tw) + ')';
  c.beginPath(); c.arc(cx + r * 0.3, cy - r * 0.15, r * 0.06, 0, 7); c.fill();
},
web(c, q, cx, cy, r, T, gx, gz){
  c.strokeStyle = 'rgba(235,240,250,0.8)'; c.lineWidth = Math.max(1, r * 0.03);
  for (const p2 of q){ c.beginPath(); c.moveTo(cx, cy); c.lineTo((cx + p2.x) / 2 + (p2.x - cx) * 0.45, (cy + p2.y) / 2 + (p2.y - cy) * 0.45); c.stroke(); }
  for (let ring = 1; ring <= 3; ring++){
    c.beginPath();
    for (let i = 0; i <= 8; i++){
      const a = i / 8 * 6.283, rr = r * ring / 3.4 * (1 + 0.05 * Math.sin(a * 3 + gx));
      const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.62;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.stroke();
  }
},
gas(c, q, cx, cy, r, T, gx, gz){
  for (let i = 0; i < 3; i++){
    const a = T * 0.5 * (i % 2 ? 1 : -1) + i * 2.1 + _sHash(gx, gz, i) * 6;
    const bx = cx + Math.cos(a) * r * 0.3, by = cy + Math.sin(a) * r * 0.2;
    const g = c.createRadialGradient(bx, by, 0, bx, by, r * 0.7);
    g.addColorStop(0, 'rgba(168,208,60,0.5)'); g.addColorStop(1, 'rgba(80,110,20,0)');
    c.fillStyle = g; c.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
},
electric(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(20,40,90,0.45)'; c.fill();
  const seed = Math.floor(T * 7);
  c.strokeStyle = 'rgba(150,200,255,0.95)'; c.lineWidth = Math.max(1, r * 0.04);
  c.shadowColor = 'rgba(120,180,255,0.9)'; c.shadowBlur = 8;
  for (let b = 0; b < 2; b++){
    const a = _sHash(gx + seed, gz, b) * 6.28;
    let px = cx - Math.cos(a) * r * 0.8, py = cy - Math.sin(a) * r * 0.5;
    c.beginPath(); c.moveTo(px, py);
    for (let s2 = 0; s2 < 4; s2++){
      px += Math.cos(a) * r * 0.4 + (_sHash(gz + seed, gx, b * 5 + s2) - 0.5) * r * 0.5;
      py += Math.sin(a) * r * 0.25 + (_sHash(gx + seed, gz, b * 7 + s2) - 0.5) * r * 0.3;
      c.lineTo(px, py);
    }
    c.stroke();
  }
  c.shadowBlur = 0;
},
crack(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(46,36,28,0.85)'; c.fill();
  const pulse = 0.6 + 0.4 * Math.sin(T * 2 + gx * 1.5 + gz);
  c.strokeStyle = 'rgba(255,' + (90 + 60 * pulse | 0) + ',10,' + (0.75 + 0.2 * pulse) + ')';
  c.lineWidth = Math.max(1.5, r * 0.06);
  c.shadowColor = 'rgba(255,120,20,0.8)'; c.shadowBlur = 10 * pulse;
  for (let i = 0; i < 3; i++){
    const a = _sHash(gx, gz, i) * 6.28;
    let px = cx + Math.cos(a) * r * 0.15, py = cy + Math.sin(a) * r * 0.1;
    c.beginPath(); c.moveTo(px, py);
    for (let s2 = 0; s2 < 3; s2++){
      px += Math.cos(a + (_sHash(gz, gx, i * 4 + s2) - 0.5) * 1.4) * r * 0.34;
      py += Math.sin(a + (_sHash(gx, gz, i * 4 + s2) - 0.5) * 1.4) * r * 0.22;
      c.lineTo(px, py);
    }
    c.stroke();
  }
  c.shadowBlur = 0;
},
oil(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(12,10,20,0.9)'; c.fill();
  const hue = (T * 30 + gx * 40 + gz * 70) % 360;
  c.globalAlpha = 0.3;
  c.fillStyle = 'hsl(' + hue + ',80%,55%)';
  c.beginPath(); c.ellipse(cx - r * 0.2, cy - r * 0.08, r * 0.5, r * 0.2, 0.5, 0, 7); c.fill();
  c.fillStyle = 'hsl(' + ((hue + 120) % 360) + ',80%,55%)';
  c.beginPath(); c.ellipse(cx + r * 0.25, cy + r * 0.12, r * 0.4, r * 0.16, -0.4, 0, 7); c.fill();
  c.globalAlpha = 1;
},
puddle(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(38,84,116,0.75)'; c.fill();
  for (const off of [0, 0.5]){
    const ph = (T * 0.5 + off + _sHash(gx, gz, 1)) % 1;
    c.strokeStyle = 'rgba(180,220,240,' + (0.7 * (1 - ph)) + ')';
    c.lineWidth = Math.max(1, r * 0.035);
    c.beginPath(); c.ellipse(cx, cy, r * ph, r * ph * 0.6, 0, 0, 7); c.stroke();
  }
},
sea(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(10,60,90,0.85)'; c.fill();
  c.strokeStyle = 'rgba(160,220,240,0.6)'; c.lineWidth = Math.max(1, r * 0.04);
  for (let w = 0; w < 2; w++){
    c.beginPath();
    for (let i = 0; i <= 10; i++){
      const px = cx - r + (i / 10) * r * 2;
      const py = cy + (w - 0.5) * r * 0.5 + Math.sin(i * 0.9 + T * 2.2 + w * 2) * r * 0.09;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.stroke();
  }
},
caltrops(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(52,42,32,0.55)'; c.fill();
  for (let i = 0; i < 6; i++){
    const px = cx + (_sHash(gx, gz, i) - 0.5) * r * 1.5;
    const py = cy + (_sHash(gz, gx, i) - 0.5) * r * 0.9;
    const sz = r * (0.08 + 0.06 * _sHash(gx, gz, i + 7));
    c.fillStyle = 'rgba(190,198,210,0.95)';
    c.beginPath(); c.moveTo(px, py - sz * 1.6); c.lineTo(px - sz, py + sz * 0.7); c.lineTo(px + sz, py + sz * 0.7); c.fill();
  }
},
blood(c, q, cx, cy, r, T, gx, gz){
  for (let i = 0; i < 3; i++){
    const bx = cx + (_sHash(gx, gz, i) - 0.5) * r * 1.1;
    const by = cy + (_sHash(gz, gx, i) - 0.5) * r * 0.65;
    const br = r * (0.3 + 0.35 * _sHash(gx, gz, i + 5));
    c.fillStyle = 'rgba(' + (110 + 40 * _sHash(gz, gx, i + 3) | 0) + ',8,10,0.8)';
    c.beginPath(); c.ellipse(bx, by, br, br * 0.6, _sHash(gx, gz, i + 11) * 3, 0, 7); c.fill();
  }
  const tw = 0.5 + 0.5 * Math.sin(T * 0.8 + gx);
  c.fillStyle = 'rgba(255,120,120,' + (0.25 * tw) + ')';
  c.beginPath(); c.arc(cx + r * 0.2, cy - r * 0.1, r * 0.05, 0, 7); c.fill();
},
void(c, q, cx, cy, r, T, gx, gz){
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, 'rgba(30,4,60,0.95)'); g.addColorStop(0.6, 'rgba(90,25,180,0.6)'); g.addColorStop(1, 'rgba(20,0,45,0.1)');
  c.fillStyle = g; c.fill();
  c.globalCompositeOperation = 'lighter';
  c.strokeStyle = 'rgba(190,110,255,0.85)'; c.lineWidth = Math.max(1, r * 0.045);
  for (let arm = 0; arm < 3; arm++){
    c.beginPath();
    for (let i = 0; i <= 9; i++){
      const t2 = i / 9, a = arm * 2.09 - T * 1.1 + t2 * 3.6, rr = r * 0.85 * t2;
      const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.62;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.stroke();
  }
},
toxic(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(30,90,20,0.75)'; c.fill();
  for (const off of [0, 0.5]){
    const ph = (T * 0.6 + off + _sHash(gx, gz, 2)) % 1;
    c.strokeStyle = 'rgba(150,255,60,' + (0.8 * (1 - ph)) + ')';
    c.lineWidth = Math.max(1, r * 0.04);
    c.beginPath(); c.ellipse(cx, cy, r * 0.9 * ph, r * 0.55 * ph, 0, 0, 7); c.stroke();
  }
},
mire(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(48,32,64,0.8)'; c.fill();
  for (let i = 0; i < 4; i++){
    const ph = (T * 0.35 + _sHash(gx, gz, i) * 3) % 1;
    const bx = cx + (_sHash(gz, gx, i) - 0.5) * r * 1.2;
    const by = cy + (_sHash(gx, gz, i + 6) - 0.5) * r * 0.7;
    c.strokeStyle = 'rgba(150,170,90,' + (0.7 * (1 - ph)) + ')';
    c.lineWidth = 1.2;
    c.beginPath(); c.arc(bx, by, r * 0.14 * ph + 0.5, 0, 7); c.stroke();
  }
},
grease(c, q, cx, cy, r, T, gx, gz){
  c.fillStyle = 'rgba(60,38,12,0.8)'; c.fill();
  const sh = Math.sin(T * 0.8 + gx - gz) * r * 0.3;
  const g = c.createLinearGradient(cx - r + sh, cy - r * 0.3, cx + r + sh, cy + r * 0.3);
  g.addColorStop(0, 'rgba(230,180,90,0)'); g.addColorStop(0.5, 'rgba(230,180,90,0.35)'); g.addColorStop(1, 'rgba(230,180,90,0)');
  c.fillStyle = g; c.fill();
},
holy(c, q, cx, cy, r, T, gx, gz){
  c.globalCompositeOperation = 'lighter';
  const glow = 0.85 + 0.15 * Math.sin(T * 2);
  c.strokeStyle = 'rgba(255,216,110,' + (0.9 * glow) + ')';
  c.lineWidth = Math.max(1.2, r * 0.05);
  c.beginPath(); c.ellipse(cx, cy, r * 0.72, r * 0.44, 0, 0, 7); c.stroke();
  c.beginPath(); c.ellipse(cx, cy, r * 0.45, r * 0.27, 0, 0, 7); c.stroke();
  const a0 = T * 0.35;
  c.beginPath();
  for (let i = 0; i < 6; i++){
    const a = a0 + i * 1.047, rr = (i % 2 ? 0.18 : 0.4) * r;
    const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.62;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath(); c.stroke();
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, r * 0.8);
  g.addColorStop(0, 'rgba(255,230,150,' + (0.28 * glow) + ')'); g.addColorStop(1, 'rgba(255,220,120,0)');
  c.fillStyle = g; c.fill();
}
};
/* Re-stroke the move/attack/place/swap highlight on top of a painted surface —
   brighter and thicker than the under-ground pass so it reads through flames
   and oil sheen. Keyed off SURFACES so a clean tile is never touched twice. */
function drawPaintOverSurfaces(T){
  for (const key in SURFACES){
    if (!SURFACES[key]) continue;
    let col = null;
    if (PAINT.attack.has(key))     col = '#ff5a4a';
    else if (PAINT.move.has(key))  col = '#4fd0ff';
    else if (PAINT.place.has(key)) col = '#7fe89f';
    else if (PAINT.swap.has(key))  col = '#e0b64a';
    if (!col) continue;
    const c = key.split(','), gx = +c[0], gz = +c[1];
    if (!isFinite(gx) || !isFinite(gz)) continue;
    const P = tilePoly(gx, gz, 0.02); if (!P) continue;

       came out of |q1.x-q0.x| / |q2.x-q3.x|, i.e. a specific square winding.

       real world point, and p.s is pixels-per-world-unit at that depth, so
       SIZE*p.s is the hexagon's circumradius in pixels with no winding
       assumption left to break. */

function frame(now){

  drawSky();
  drawShards();
  drawBoard();
  /* 🎨 Painted tile surfaces — composited HERE, between the ground and the
     depth-sorted pass, so a unit standing in fire is drawn ON TOP of it. The
     shader layer renders to its own offscreen WebGL canvas and is blitted in;
     leaving that canvas visible above the stage instead would paint the flames
     over the unit's legs. */
  try { drawSurfaceFx(T); } catch (e) {}

     painted over. The first pass (in drawBoard) sits UNDER the ground shading
     on purpose so it reads as part of the floor — but a hazard composites
     after it and buries it, which made a fire/oil tile look unreachable even
     though it is a perfectly legal move. Only surfaced tiles are touched, so
     the rest of the board keeps the original look. */

  drawEffects('ground');

  for (const tb of TOMBS) drawables.push({ z:tb.z, kind:'tomb', tb });

  for (const ev of (MAP.events||[])) drawables.push({ z:ev.z, kind:'event', ev });

     the row pitch before the offset. It used to add (rows-1)/2 to a raw world z,
     which only agreed with a grid row while a row was one world unit deep. */
  for (const br of braziers) drawables.push({ z: br.z/hexV() + (MAP.rows-1)/2, kind:'pylon', br });
  drawables.sort((a,b) => a.z - b.z);

    if (d.kind==='prop') drawProp(d.t);
    else if (d.kind==='event') drawEvent(d.ev);

    else if (d.kind==='tomb') drawTomb(d.tb);

     in the game anchors off a unit's on-screen box; with the DOM board hidden
     those lookups return stale iso coordinates, so the host needs ours. Cheap
     and rate-limited — this is position data, not a render path. */
  if (EMBEDDED && (T - (window.__rectsAt || 0)) > 0.25){
    window.__rectsAt = T;

      if (u.dead) continue;
      const b = unitScreenBox(u);

                                   width:Math.round(b.width), height:Math.round(b.height) };
    }
    /* tile centres too — summon / spell cinematics anchor by grid position,
       not by unit, and those lookups hit the hidden DOM board as well. */
    const tmap = {};
    for (let z = 0; z < MAP.rows; z++){
      for (let x = 0; x < MAP.cols; x++){
        const wp = gw(x, z, tileElev(x, z));
        const p = project({ x:wp.x, y:wp.y, z:wp.z });
        if (p) tmap[x + ',' + z] = { cx: Math.round(p.x), cy: Math.round(p.y) };
      }
    }
    post('rects', { rects: map, tiles: tmap });
  }
  drawParticles();
  drawEffects('air');
  /* atmosphere */
  drawRain();
  /* BAR R1 asks for a HEAVY vignette, and .42 starting at 25% of the frame was
     not one — it read as a slight corner falloff. Pulling the inner stop in and
     the outer value up is what makes the diorama sit in a pool of light instead
     of filling a lit rectangle. */

  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(.62,'rgba(0,0,0,.13)'); vg.addColorStop(1,'rgba(0,0,0,.54)');

  drawGuides();
  } catch (err) {
    frameErr = true;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#180a0a'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#ff8a7a'; ctx.font = '600 16px monospace';
    ctx.fillText('RENDER ERROR: ' + (err && err.message || err), 26, 44);
    ((err && err.stack || '').split('\n').slice(1,4)).forEach((s,i) =>
      ctx.fillText(s.trim(), 26, 74 + i*22));
    console.error(err); return;
  }
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════
   INTERACTION — screen → tile via ray/plane intersect
   ══════════════════════════════════════════════════════════════════ */
/* Cube rounding. Rounding a fractional axial/cube coordinate axis-by-axis can
   land off the hex; the fix is to round all three, then discard and re-derive
   whichever component moved furthest, restoring x+y+z === 0. */
function cubeRound(x, y, z){
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx-x), dy = Math.abs(ry-y), dz = Math.abs(rz-z);
  if (dx > dy && dx > dz)      rx = -ry - rz;
  else if (dy > dz)            ry = -rx - rz;
  else                         rz = -rx - ry;
  return { x:rx, y:ry, z:rz };
}
/* world (x,z) on the play plane → tile. THE ANALYTIC INVERSE OF gw(),
   HEXSPEC §4 — and note what it is NOT: it does not round the column and the
   row independently. That shortcut is right in the middle of every hex and
   wrong along every edge, which is exactly the "the click landed one tile off,
   but only sometimes" bug HEXSPEC §4 calls out. Go to axial, cube-round, come
   back to the same odd-r offset scheme gw() uses. */
function worldToTile(wx, wz){
  const s = hexSize();
  /* undo the board-centre offset gw() applies, so the origin is tile (0,0) */
  const u = wx + ((MAP.cols-1)/2) * hexW();
  const v = wz + ((MAP.rows-1)/2) * hexV();
  const q = (SQRT3/3 * u - v/3) / s;
  const r = (2/3 * v) / s;
  const c = cubeRound(q, -q - r, r);
  /* axial → odd-r offset. `&` and not `%` for the parity: JS gives -1 % 2 === -1
     and the column would come back one short on every negative row. */
  const col = c.x + (c.z - (c.z & 1)) / 2;
  const row = c.z;
  /* the bounds test has to be re-derived for staggered rows: a hex board is a
     rhombus in cube space, so test the OFFSET pair, after the conversion. */
  if (col < 0 || row < 0 || col >= MAP.cols || row >= MAP.rows) return null;
  return { x:col, z:row };
}
function pickTile(mx, my){
  /* unproject to a ray, intersect y=0 plane, convert to grid */
  const ndx = (mx - VIEW.cx) / VIEW.scale;
  const ndy = -(my - VIEW.cy) / VIEW.scale;
  const dir = norm({
    x: CAM.f.x + CAM.r.x*ndx + CAM.u.x*ndy,
    y: CAM.f.y + CAM.r.y*ndx + CAM.u.y*ndy,
    z: CAM.f.z + CAM.r.z*ndx + CAM.u.z*ndy
  });
  if (Math.abs(dir.y) < 1e-5) return null;
  const t = -CAM.pos.y / dir.y; if (t <= 0) return null;
  return worldToTile(CAM.pos.x + dir.x*t, CAM.pos.z + dir.z*t);
}

/* ══════════════════════════════════════════════════════════════════
   HEX SELF-CHECK — required by HEXSPEC §4, and the only thing that
   ties gw() to worldToTile(). They are hand-derived analytic inverses
   sharing no code: flip a parity in either and the board still looks
   perfect, while the tile you CLICK slides away from the tile you
   HIGHLIGHTED, further the further you are from the origin. Nothing
   else in this file would notice.
   It lives on window rather than running at boot on purpose — a match
   must not pay for it and must not have its console spammed. Call it:
     window.__bbHexCheck()   →  { ok, tiles, centreFails, jitterFails }
   ══════════════════════════════════════════════════════════════════ */
function hexSelfCheck(opts){
  const rings = (opts && opts.rings) || 8;
  const centre = [], jitter = [];
  for (let z = 0; z < MAP.rows; z++){
    for (let x = 0; x < MAP.cols; x++){
      const w = gw(x, z, 0);
      const t = worldToTile(w.x, w.z);
      if (!t || t.x !== x || t.z !== z)
        centre.push({ want:[x,z], got:t ? [t.x,t.z] : null,
                      world:[+w.x.toFixed(4), +w.z.toFixed(4)] });
      /* Centres alone are a weak test: an inverse that rounds col and row
         separately passes every centre and fails near the edges. Probe inside
         the tile as well, at 90% of the INRADIUS — a circle of that radius is
         strictly inside one hex and touches no other, so every sample has
         exactly one right answer. */
      for (let i = 0; i < rings; i++){
        const a = i * Math.PI * 2 / rings, rr = tileR() * 0.9;
        const t2 = worldToTile(w.x + Math.cos(a)*rr, w.z + Math.sin(a)*rr);
        if (!t2 || t2.x !== x || t2.z !== z)
          jitter.push({ want:[x,z], got:t2 ? [t2.x,t2.z] : null,
                        deg: Math.round(a*180/Math.PI) });

    }
  }
  const tiles = MAP.cols * MAP.rows;
  return { cols:MAP.cols, rows:MAP.rows, tiles,
           samples: tiles * (1 + rings),
           centreFails: centre.length, jitterFails: jitter.length,
           ok: centre.length === 0 && jitter.length === 0,
           fails: centre.slice(0,10).concat(jitter.slice(0,10)) };

/* 📐 FIT SELF-REPORT — the framing equivalent of __bbHexCheck, and on window

   are not knowable by reading the code, only by measuring the projection that
   actually ran. A capture can be eyeballed; this can be asserted.

  const a = project(gw(0, MAP.rows-1, 0)), b = project(gw(MAP.cols-1, MAP.rows-1, 0));

    host: { w:+VIEW.box.w.toFixed(0), h:+VIEW.box.h.toFixed(0) },
    pitchDeg: +(Math.asin(-dir.y)*180/Math.PI).toFixed(1),
    dist: +Math.hypot(CONFIG.camera.pos.y - CONFIG.camera.target.y, CONFIG.camera.pos.z).toFixed(2),
    viewShiftY: +CONFIG.viewShiftY.toFixed(1),
    hexNear: (a && b) ? +((b.x - a.x)/(MAP.cols-1)).toFixed(1) : null,
    unitH:   (u0 && u1) ? +Math.abs(u1.y - u0.y).toFixed(1) : null,
    board:   (f && n) ? { top:+f.y.toFixed(0), bottom:+n.y.toFixed(0),
                          pctH:+(100*(n.y - f.y)/VIEW.box.h).toFixed(0) } : null,
    ground:  { x:+g.x.toFixed(2), near:+g.near.toFixed(2), far:+g.far.toFixed(2) },

      const half = Math.abs(w.x - q.x);
      return { base:px(q), left:+(q.x-half).toFixed(0), right:+(q.x+half).toFixed(0),
               top:+t.y.toFixed(0),
               inside: (q.x-half) >= VIEW.box.l && (q.x+half) <= VIEW.box.l+VIEW.box.w

cv.addEventListener('mousemove', e => { hoverTile = pickTile(e.clientX, e.clientY); });
cv.addEventListener('mouseleave', () => hoverTile = null);
cv.addEventListener('click', e => {

  dispatch('tileClick', { x:t.x, z:t.z });

    selected = (selected === u.id) ? null : u.id;

  }

  c.setTransform(dpr,0,0,dpr,0,0);

  g.addColorStop(0, rgba(card.ec,.32)); g.addColorStop(.78,'rgba(10,7,16,.95)'); g.addColorStop(1,'rgba(6,4,10,1)');
  c.fillStyle = g; c.fillRect(0,0,w,h);

  c.fillStyle = rg; c.fillRect(0,0,w,h);

function renderHand(){

    <div class="hcard ${armedCard===c.id?'armed':''}" data-id="${c.id}">
      <span class="cost">${c.cost}</span>

      <span class="el" style="color:${c.ec}">${c.el}</span>

/* ══════════════════════════════════════════════════════════════════

/* ══════════════════════════════════════════════════════════════════
   HOST BRIDGE — the game drives the board over postMessage.
   Embedded  = we have a parent window. In that mode the demo hand, the
   hint and the demo spawns are all suppressed and the board waits for a
   `board:init` snapshot instead of inventing one.
   Protocol (host → board), all `{ type, ... }`:
     board:init        { map, locations, location, timeOfDay, defs, units, safe }
     board:map         { map }                 rebuild the stage
     board:defs        { defs }                register unit art / sheets
     board:units       { units }               full snapshot (replaces all)
     board:location    { id }                  LOCATION CARD resolved
     board:timeOfDay   { key }                 weather flip (lerps 2.5s)
     board:spawn       { key, x, z, side, id }
     board:summon      { key, x, z, cardId }   full card→sprite ceremony
     board:move        { id, x, z }
     board:attack      { id, targetId }
     board:kill        { id }
     board:focus       { x, z } | board:clearFocus
     board:event       { action:'spawn'|'trigger'|'clear', type, x, z }

     board:summonComplete, board:locationChange, board:timeOfDay

const EMBEDDED = (() => { try { return window.parent && window.parent !== window; } catch (e) { return false; } })();
const HOST = { origin:'*' };
function post(type, detail){
  if (!EMBEDDED) return;
  try { window.parent.postMessage(Object.assign({ type:'board:' + type }, detail || {}), HOST.origin); } catch (e) {}
}
/* mirror every internal dispatch out to the host */
['tileClick','unitClick','tileHover','cardPlayed','summonComplete','locationChange','timeOfDay'].forEach(ev => {
  document.addEventListener('board:' + ev, e => post(ev, e.detail || {}));
});

function applyDefs(defs){
  if (!defs) return;
  for (const k in defs){
    const d = defs[k]; if (!d) continue;
    /* ⚠ MUTATE IN PLACE. spawnUnit stores `u.def = UNIT_DEFS[key]` by
       REFERENCE, so replacing the object here left every already-spawned unit
       pointing at the old procedural def — which is exactly why real sprites
       didn't take effect until a respawn. */
    const cur = UNIT_DEFS[k] || (UNIT_DEFS[k] = {});
    Object.assign(cur, {
      name: d.name || k,
      color: d.color || '#cfd6e4',
      h: (typeof d.h === 'number' && d.h > 0) ? d.h : 1.05,
      art: (typeof d.art === 'string' && d.art) ? d.art : null,
      sheet: d.sheet || null,
      frames: Array.isArray(d.frames) ? d.frames : null,
      fps: d.fps || 10,
      _phase: cur._phase || ((k.length * 0.137) % 1)
    });
    /* warm the textures NOW so the first paint already has real art instead
       of one procedural flash while the images decode */
    if (Array.isArray(d.frames)) for (const f of d.frames) artImage(f);
    if (typeof d.art === 'string') artImage(d.art);
    if (cur.art || cur.frames || (cur.sheet && cur.sheet.src)) delete cur._proc;   // real art wins
  }
}
/* Replace the whole unit set from a match snapshot. Units already on the
   board with the same id are MOVED rather than re-spawned, so a snapshot
   refresh never restarts an animation mid-flight. */
function applyUnits(list){
  if (!Array.isArray(list)) return;
  const seen = new Set();
  for (const u of list){
    if (!u || u.id == null) continue;
    seen.add(String(u.id));
    const cur = units.find(x => String(x.id) === String(u.id) && !x.dead);
    if (cur){
      if (cur.gx !== u.x || cur.gz !== u.z) moveUnit(cur.id, u.x, u.z);
      /* 🜂 KALON TRANSFORM (and any other in-place identity change).
         The unit keeps its instance id but its CARD changes, so matching by id
         alone left the base form's art on the board forever. Swap the key and
         the def reference in place — no respawn, so position, facing and any
         running animation survive. */
      const nk = u.key || u.defKey;
      if (nk && cur.key !== nk){
        cur.key = nk;
        // If the new form's def hasn't landed yet, mint one the same way
        // spawnUnit does — otherwise paintSprite would find nothing for this
        // key and the unit would vanish instead of just looking generic.
        if (!UNIT_DEFS[nk]){
          let h = 0; for (let i = 0; i < String(nk).length; i++) h = (h * 31 + String(nk).charCodeAt(i)) | 0;
          const proc = PROC_KEYS[Math.abs(h) % PROC_KEYS.length];
          UNIT_DEFS[nk] = Object.assign({}, PROC_DEFS[proc], { name:String(nk), _proc:proc });
        }
        cur.def = UNIT_DEFS[nk];
        cur.flash = Math.max(cur.flash || 0, 0.9);   // a beat of white on the swap
      }
      continue;
    }
    const nu = spawnUnit(u.key || u.defKey || 'imp', u.x, u.z, u.side === 'foe' ? 'foe' : 'mine');
    if (nu && u.id != null) nu.id = String(u.id);
  }
  for (const x of units.slice()) if (!x.dead && !seen.has(String(x.id))) killUnit(x.id);
}

/* 🗺 THE ONE DOOR the host's map comes through. `board:init` and `board:map`
   both used to do a bare Object.assign(MAP, msg.map) in line, so a payload
   carrying a BAD dimension ('14', NaN, 0, -3) propagated straight into gw()
   and worldToTile(). Both return NaN for a NaN cols, project() then fails
   every test, and the whole board renders nothing at all with no error
   anywhere — exactly the silent class of failure the near clip already gives
   us. Clamped here, once.
   ⚠ Object.assign MERGES (CONTRACT §2 R18): a payload with no `cols` key at
   all does NOT fall back to BOARD_DEFAULT, it KEEPS the previous map's size,
   because there is nothing for Math.round to reject. That is deliberate — a
   `board:map` that only repaints tiles must not silently resize the board —
   but it does mean BOARD_DEFAULT is reached only at boot, or when the key is
   present and unusable. Do not read the fallback as "a dimensionless payload
   resets the board"; it does not. */
function applyMapPayload(m){
  if (!m || typeof m !== 'object') return;
  Object.assign(MAP, m);
  MAP.cols = Math.max(1, Math.round(+MAP.cols) || BOARD_DEFAULT.cols);
  MAP.rows = Math.max(1, Math.round(+MAP.rows) || BOARD_DEFAULT.rows);
}

function handleHostMessage(msg){
  if (!msg || typeof msg.type !== 'string' || msg.type.indexOf('board:') !== 0) return;
  const t = msg.type.slice(6);
  try {
    if (t === 'init'){
      if (msg.safe) Object.assign(CONFIG.SAFE, msg.safe);
      if (msg.locations) setLocations(msg.locations, true);
      applyMapPayload(msg.map);
      buildStage();
      applyDefs(msg.defs);
      loadLocation(msg.location || MAP.location || DEFAULT_LOCATION, true);
      if (msg.timeOfDay && TIME_PRESETS[msg.timeOfDay]){
        BATTLE.timeOfDay = msg.timeOfDay;
        Object.assign(LIGHT, TIME_PRESETS[msg.timeOfDay]);
      }
      applyUnits(msg.units);
      // 🗿 Real match events — after buildStage so tile elevations exist.
      if (msg.events) setEvents(msg.events);
      resize();
    }
    else if (t === 'map'){ applyMapPayload(msg.map); buildStage(); if (msg.events) setEvents(msg.events); resize(); }
    else if (t === 'events'){ setEvents(msg.events); }
    else if (t === 'defs')      applyDefs(msg.defs);
    else if (t === 'units')     applyUnits(msg.units);
    /* 🗺 LATE LOCATION REGISTRATION. `setLocation` hard-bails with "unknown
       location" when the id isn't in LOCATIONS — and the table is only built
       once, at init, from the cards that existed and had a usable image THEN.
       A location card PLAYED mid-match was therefore almost never registered,
       so the battlefield never changed. The host now sends this immediately
       before every `location` message. keepDefault=true so it MERGES rather
       than wiping the table. */
    /* 🎨 Painted tile surfaces: { "x,z": effectKey }. Whole-map replace,
       because the host already diffs and only sends on change. */
    else if (t === 'surfaces') SURFACES = (msg.tiles && typeof msg.tiles === 'object') ? msg.tiles : {};
    else if (t === 'locations') setLocations(msg.locations || {}, true);
    else if (t === 'location')  setLocation(msg.id, !!msg.instant);
    else if (t === 'timeOfDay') setTimeOfDay(msg.key);
    else if (t === 'spawn'){ const u = spawnUnit(msg.key, msg.x, msg.z, msg.side === 'foe' ? 'foe' : 'mine'); if (u && msg.id != null) u.id = String(msg.id); }
    else if (t === 'summon')    summonUnit(msg.key, msg.x, msg.z, { id:msg.id, side:msg.side, cost:msg.cost });
    else if (t === 'summonFx')  summonFx(msg.id);
    /* 🪦 Tombstones. The game owns their whole lifecycle (decay, revive
       timers, loot state); the board just renders the markers it is given. */
    else if (t === 'tombs'){
      TOMBS.length = 0;
      for (const tb of (msg.list || [])) if (tb) TOMBS.push(tb);
      for (const tb of TOMBS) if (tb.img) artImage(tb.img);   // warm the texture
    }
    else if (t === 'move')      moveUnit(msg.id, msg.x, msg.z);
    else if (t === 'attack')    attackUnit(msg.id, msg.targetId);
    else if (t === 'kill')      killUnit(msg.id);
    else if (t === 'focus')     focusTile(msg.x, msg.z);
    else if (t === 'clearFocus')clearFocus();
    /* 🎨 SURFACE PAINT — the game decides which tiles are legal targets
       (move / attack / placement / swap); the board only tints them. Sent as
       sets of "x,z" keys so lookup during the tile loop is O(1). */
    else if (t === 'paint'){
      PAINT.move  = new Set(msg.move  || []);
      PAINT.attack= new Set(msg.attack|| []);
      PAINT.place = new Set(msg.place || []);
      PAINT.swap  = new Set(msg.swap  || []);
      PAINT.sel   = msg.sel || null;
    }
    /* 🖱 FORWARDED POINTER. The stage paints BELOW the app (so the HUD stays
       on top), which means it cannot receive its own mouse events. The host
       captures them over the board area and forwards normalised coords here;
       we run the same perspective pick the canvas would have. */
    else if (t === 'pointer'){
      const mx = msg.nx * W, my = msg.ny * H;
      const tile = pickTile(mx, my);
      const hit = tile ? unitAt(tile.x, tile.z) : null;
      if (msg.kind === 'click'){
        if (tile) dispatch('tileClick', { x:tile.x, z:tile.z, unitId: hit ? String(hit.id) : null });
      } else {
        const key = (tile ? (tile.x + ',' + tile.z) : '') + '|' + (hit ? hit.id : '');
        if (key !== (window.__lastHoverKey || '')){
          window.__lastHoverKey = key;
          if (tile) focusTile(tile.x, tile.z); else clearFocus();
          dispatch('tileHover', { x: tile ? tile.x : -1, z: tile ? tile.z : -1,
                                  unitId: hit ? String(hit.id) : null,
                                  box: hit ? unitScreenBox(hit) : null });
        }
      }
    }
    else if (t === 'event'){
      if (msg.action === 'spawn')   spawnEvent(msg.evType || msg.evtType, msg.x, msg.z);
      if (msg.action === 'trigger') triggerEvent(msg.x, msg.z, msg.unitId);
      if (msg.action === 'clear')   clearEvent(msg.x, msg.z);
    }
  } catch (e) { try { console.warn('board message failed', t, e); } catch (_) {} }
}
window.addEventListener('message', e => handleHostMessage(e.data));

try {
  /* EMBEDDED: the host sizes the iframe to the exact rect the old board
     occupied, so the stage must FILL the canvas — no UI gutters and no
     optical shift (both exist only for the standalone full-screen preview). */
  if (EMBEDDED){
    CONFIG.SAFE = { left:0, right:0, top:0, bottom:0 };
    CONFIG.viewShiftY = 0;
  }
  buildStage();
  if (EMBEDDED){
    /* the game owns the hand + hint; hide the standalone stand-ins */
    const h = document.getElementById('hand'); if (h) h.style.display = 'none';
    const hi = document.getElementById('hint'); if (hi) hi.remove();
  } else {
    /* standalone preview — a demo board so the file still opens on its own */
    spawnUnit('imp', 3, 1, 'foe');
    spawnUnit('knight', 6, 0, 'foe');
    spawnUnit('wyrm', 1, 2, 'foe');
    spawnUnit('mage', 2, 5, 'mine');
    spawnUnit('crystal', 5, 6, 'mine');
    HAND = [
      { id:'c1', cost:5, unit:'jelly',   el:'NATURE',  ec:'#8fd84a' },
      { id:'c2', cost:6, unit:'bunny',   el:'SHADOW',  ec:'#c8a8ff' },
      { id:'c3', cost:0, unit:'mage',    el:'FIRE',    ec:'#ff8a3c' },
      { id:'c4', cost:6, unit:'wyrm',    el:'MYTHIC',  ec:'#f6dc95' },
      { id:'c5', cost:2, unit:'crystal', el:'CRYSTAL', ec:'#5fe8d5' },
      { id:'c6', cost:5, unit:'knight',  el:'MYTHIC',  ec:'#f6dc95' }
    ];
    renderHand();
  }
  loadLocation(DEFAULT_LOCATION, true);
  setPylonArt(PYLON_ART.src);
  requestAnimationFrame(t => { last = t; frame(t); });
  post('ready', { cols:MAP.cols, rows:MAP.rows });
} catch (err) {
  /* never fail silently to a black screen */
  const c = cv.getContext('2d');
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = '#140a0a'; c.fillRect(0,0,cv.width,cv.height);
  c.fillStyle = '#ff8a7a'; c.font = '600 15px monospace';
  c.fillText('BATTLE BOARD FAILED TO START:', 24, 40);
  c.fillText(String(err && err.message || err), 24, 64);
  console.error(err);
}
</script>
