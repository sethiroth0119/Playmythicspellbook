    /* the wall is VERTICAL and contains the edge i→j, so its normal is that
       edge turned a quarter turn in the ground plane. Sign is irrelevant —
       only the zero set is used. */
    const ex = Wtop[j].x - Wtop[i].x, ez = Wtop[j].z - Wtop[i].z;
    q.pl = { x:ez, y:0, z:-ex, c: ez*Wtop[i].x - ex*Wtop[i].z };
    pieces.push(q);
  }
  return pieces;
}

/* Rebuilt once per frame, before the sorted pass. Only tiles that are RAISED
   can hide a billboard at all, and only tiles on screen can hide one here, so
   the two cheap rejects run before anything else.
   ⚠ NO POLYGONS ARE BUILT HERE. A first cut called slabPieces() for every
   raised on-screen tile and cost 1.1–3.4 ms of a 2.3 ms parked frame in this
   rig — measured by no-opping the pass and re-running __bbPerf. The set of
   slabs that raise the question is ~100 tiles; the set that actually masks
   something is a handful, so the pieces are built LAZILY on the first frame a
   slab survives every reject, and the estimated box below is what does the
   rejecting. The box is deliberately GENEROUS: too small silently skips a mask
   that was needed, which is the whole bug. */
function buildOccluders(){
  const out = [];
  const tiles = MAP.tiles;
  const R = hexSize();
  if (Array.isArray(tiles)){
    for (let i = 0; i < tiles.length; i++){
      const t = tiles[i]; if (!t) continue;
      /* elevOf(), not t.elev: the cliff-hang loop eight lines down already
         goes through it for the neighbour floor, so a raw read here let the
         occluder's top and its own hang disagree whenever HF had not rebuilt.
         A mask at the wrong height does not throw — it decapitates a unit, or
         fails to clip one that is genuinely behind the slab. */
      const e = elevOf(t.x, t.z);
      if (e <= 1e-3) continue;                 /* flat ground hides nothing */
      const c = project(gw(t.x, t.z, e)); if (!c) continue;
      const m = c.s * R * 2.4 + 24;
      if (c.x < -m || c.x > W + m || c.y < -m || c.y > H + m) continue;
      /* how far the cliff faces hang below the top, in screen pixels */
      const nb = NB6[((t.z % 2) + 2) % 2];
      let low = e;
      for (let k = 0; k < 6; k++) low = Math.min(low, elevOf(t.x + nb[k][0], t.z + nb[k][1]));
      const cb = low < e ? project(gw(t.x, t.z, low)) : null;
      const r = c.s * R * 1.25;
      /* dTop is the cheap reject key — the slab's own top face. The mask's real
         decision is per-VERTEX and lives in clipPieceInFront(); nothing here
         is allowed to be the last word on whether a pixel is masked.
         dGnd is kept so the audit can say whether an occluder was in front of
         the actor or behind it, which is the number that tells a decapitation
         regression from a correct lateral clip.
         ⚠ A `dNear` (nearest top corner) used to be computed here for a single
         horizontal waterline. It is gone with the waterline: one depth for a
         whole slab is exactly the approximation that cut wedges out of heads. */
      out.push({ dTop: camDepth(gw(t.x, t.z, e)), dGnd: camDepth(gw(t.x, t.z, 0)),
                 x: t.x, z: t.z, e, pieces: null,
                 x0: c.x - r, x1: c.x + r,
                 y0: c.y - r * 0.75, y1: (cb ? cb.y : c.y) + r * 0.75 });
    }
  }
  OCCL.list = out;
}

/* A generous screen box for a billboard, in the units project() already gives
   us: p.s is pixels per world unit at that depth, so `wide`/`tall` are world
   units and the box scales with distance for free. Generous on purpose — it is
   only a reject test, and a box that is too SMALL silently skips a clip that
   was needed, which is the bug this whole block exists to remove. */
function actorBox(p, wide, tall){
  const r = p.s * wide;
  return { x0: p.x - r, x1: p.x + r, y0: p.y - p.s * tall, y1: p.y + p.s * 0.6 };
}

/* 🌊 THE CUT, and why it is NOT a screen-horizontal line.
   A standing figure is not a flat card at one depth: it is vertical, so its
   depth FALLS as you go up it (the eye is above the board). A slab whose top
   clears the unit's feet is therefore in front of its boots and behind its
   head, and masking the whole silhouette takes the head off.

   The first fix for that took ONE depth for the whole slab — its nearest top
   corner — solved for the single figure height that matched it, and cut every
   piece with a horizontal screen line. That is wrong in the direction that
   shows: the mask was bounded from ABOVE and never from the SIDE, so a slab
   whose nearest corner is nearer than the figure but whose painted body is
   further masked all of it, and a straight-edged wedge came out of a boss's
   head with flat ground showing through. Measured at 7–35 sampled pixels in
   EVERY pose, not a residual.

   So the comparison is made per PIECE and per VERTEX against that piece's own
   surface:
       f(v) = dFig(v.y) − dSlab(v)
   · dSlab(v) is exact and free — the vertex is the projection of a world
     corner and `.d` carries that corner's camDepth.
   · dFig(y) models the figure the way the renderer DRAWS it: a flat screen
     card anchored at the projected foot and scaled by pFoot.s pixels per world
     unit, so a pixel `pFoot.y − y` above the foot stands for that many
     /pFoot.s world units up, and camDepth is affine in world height with
     gradient CAM.f.y. Deliberately the same model occlusionAudit() uses, so
     the audit is not grading a different figure from the one being clipped.
   f > 0 means the FIGURE is further, i.e. the slab really is in front there →
   keep. f < 0 means the sprite owns the pixel outright → drop it from the mask.
   dFig is affine in screen y and dSlab is affine over the piece's world plane
   to within the perspective divide, so f crosses zero along ONE straight edge
   per convex piece and ordinary Sutherland–Hodgman is exact enough: over the
   ~60px a slab piece spans, both depths move a few percent of ~30 units and
   the residual curvature of the divide is far under a pixel.
   Returns P itself when nothing is cut — the common case, and no allocation. */
function clipPieceInFront(P, pFoot, dFoot){
  const D = P.d, n = P.length;
  const k = CAM.f.y / pFoot.s;         /* depth per screen pixel DOWN the card */
  const f = [];
  let pos = 0;
  for (let i = 0; i < n; i++){
    const v = dFoot + k * (pFoot.y - P[i].y) - D[i];
    f.push(v); if (v > 0) pos++;
  }
  if (pos === n) return P;             /* wholly in front of the figure */
  if (pos === 0) return null;          /* wholly behind it — masks nothing */
  const out = [];
  for (let i = 0; i < n; i++){
    const j = (i + 1) % n, a = P[i], b = P[j], fa = f[i], fb = f[j];
    if (fa > 0) out.push(a);
    if ((fa > 0) !== (fb > 0)){
      const t = fa / (fa - fb);
      out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    }
  }
  return out.length >= 3 ? out : null;
}

/* The slab pieces that genuinely stand in front of ONE actor, each already cut
   to the part of itself that does. Returns null when nothing masks the actor.
   ⚠ SHARED WITH THE AUDIT ON PURPOSE. occlusionAudit() used to re-implement
   the rejects and the cut so it could point-test them, which means the number
   that gates this work was grading a paraphrase — and the paraphrase agreed
   with the bug. There is now exactly one copy of the rule and both callers run
   it. */
function occluderMask(footWorld, footElev, box, sx, sz){
  const pFoot = project(footWorld); if (!pFoot) return null;
  const dFoot = camDepth(footWorld);
  const list = OCCL.list;
  let out = null;
  for (let i = 0; i < list.length; i++){
    const o = list[i];
    if (o.x === sx && o.z === sz) continue;    /* its own slab: never hides it */
    if (o.dTop >= dFoot) continue;             /* top face is not nearer than the feet */
    if (o.e <= footElev + 1e-3) continue;      /* not higher than what it stands on */
    if (o.x1 < box.x0 || o.x0 > box.x1 || o.y1 < box.y0 || o.y0 > box.y1) continue;
    /* survived every reject — NOW build the polygons, once per frame per slab */
    if (!o.pieces) o.pieces = slabPieces(o.x, o.z, o.e) || [];
    if (!o.pieces.length) continue;
    /* 🗡 THE GEOMETRIC CUT — see clipPieceInFront(). This is also the
       guard for the pathological direction, and it is a MEASUREMENT rather
       than the assumption the rejects above encode: a slab whose ground-plane
       key `o.dGnd` is further than the actor's can still get past `o.dTop <
       dFoot` by being tall, and that is the "a hill behind eats a head" case.
       Its surface is then further than the figure at every vertex, every
       piece comes back empty, and the slab drops out here with no mask at all
       — instead of taking a horizontal bite out of the sprite. */
    let cut = null;
    for (let k = 0; k < o.pieces.length; k++){
      const q = clipPieceInFront(o.pieces[k], pFoot, dFoot);
      if (q) (cut || (cut = [])).push(q);
    }
    if (!cut) continue;
    (out || (out = [])).push({ o, cut });
  }
  return out;
}

/* Clip ctx to everything EXCEPT the slabs standing in front of this actor.

   and must do it from a finally, because three of the draw kinds are already
   wrapped in their own try/catch for the CONTRACT R2 one-way frameErr latch. */

   slab cuts), and every clip() is a fresh coverage mask the raster process has
   to build and then apply to every draw under it. Round 5 measured that pass
   at a third of a vsync (`abl-noclip`: stage frame p50 20.0 → 16.7 ms) and
   showed that handing clip() the SAME Path2D frame after frame buys nothing
   (`abclip.json`) — Skia does not cache a clip by path identity, so the
   number of clip() calls itself has to come down.

   holes cannot overlap, and two slabs' pieces CAN: a taller near slab's wall
   and the top of the slab behind it paint over the same pixels, and under
   even-odd that doubly-covered region would count as OUTSIDE the holes, i.e.
   the sprite would leak through the wall. But that overlap is rare (a figure
   behind two stacked terraces), and it is a question that can be ASKED: every
   cut piece is convex (a convex quad or hex cut by one half-plane stays
   convex), so a separating-axis test says exactly whether two pieces share
   any area. When no piece from one slab overlaps a piece from another, the
   even-odd of ALL pieces in one path is the same region as the intersection
   of the per-slab clips (rect minus the union of the holes, both ways), and
   one clip() does what seven did. When a pair DOES overlap — a terrace, the
   higher near slab's top painting over the lower slab behind it, which the
   first cut of this merge found on most raised maps — the overlapping piece
   is replaced by its convex difference against the piece it hit
   (convexSubtract: disjoint convex parts that tile the piece minus the
   overlap), so the union of the holes is unchanged and the path stays
   even-odd-safe. The per-slab loop below survives only as the work-cap
   fallback and as the counterfactual.
   Two further exact rejects first: a cut piece whose screen box misses the
   actor's box cannot hide any pixel of it (the same box the slab reject
   already keys off), so it is dropped from the path — fewer edges, and often
   the difference between a mask and no mask at all.
   `window.__bbClip({ off: true })` is the one-flag counterfactual (the per-slab
   loop for every actor) and `__bbPerf().counters.clipOne / clipPerSlab /

const CLIPM = { off: false, eps: 0.25, cap: 2000 };   /* cap: subtraction steps per actor before the per-slab fallback */

/* convex ∩ convex, by separating axes, with a tolerance so pieces that only
   TOUCH along a shared edge (a wall hanging off the top face beside it, two
   neighbouring tops) are not counted as overlapping */

function pieceBox(pc){

/* the per-slab loop, verbatim from before the merge: one clip() per slab. */
function clipPerSlab(mask){
  for (let i = 0; i < mask.length; i++){
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    const cut = mask[i].cut;
    for (const pc of cut){
      ctx.moveTo(pc[0].x, pc[0].y);
      for (let k = 1; k < pc.length; k++) ctx.lineTo(pc[k].x, pc[k].y);
      ctx.closePath();
    }

       front-facing wall hangs below the top edge it is attached to — so
       even-odd is safe WITHIN a slab and only unsafe ACROSS slabs. */
    ctx.clip('evenodd');

/* split a convex polygon by the line a→b. Returns [inside, outside] (either
   may be null); `sgn` is the sign of cross(b−a, p−a) for the interior of the
   polygon the edge belongs to, so "inside" means "on that polygon's side".
   Vertices within eps of the line go to BOTH halves and never create a
   crossing, so a shared edge is a shared edge and not a sliver. */
function splitConvex(P, a, b, sgn, eps){

      const t = di / (di - dj);

      inn.push(x); out.push(x);

}
function polyArea(P){ let s = 0; for (let i = 0, n = P.length; i < n; i++){ const a = P[i], b = P[(i + 1) % n]; s += a.x * b.y - b.x * a.y; } return s / 2; }
/* F \ N for convex F and N, as DISJOINT convex parts: walk N's edges, and at
   each one peel off the part of what is left of F that lies outside that

   already a hole — dropped. Slivers under 0.05 px² are dropped too. */

    if (r[1] && Math.abs(polyArea(r[1])) > 0.05) parts.push(r[1]);

}
/* Which cut pieces can actually touch the actor's box, per slab, and — the
   part that makes one even-odd path exact — a piece list in which no two
   pieces from DIFFERENT slabs share any area. A piece that overlaps one
   already accepted (a terrace: the higher near slab's top paints over the
   lower far slab's top) is replaced by its convex difference against it, and
   each part goes back through the same test until nothing overlaps. Pieces
   of one slab never overlap each other (a wall hangs below the top edge it
   belongs to), so same-slab pairs are not tested. Returns null only if the
   work cap trips (the per-slab loop then runs, exactly as it used to) —
   otherwise the flat piece list, possibly empty (every piece missed the box
   → no clip needed at all). Pure — the smoke runs it. */
function mergeableCuts(mask, box, eps){
  const flat = [], owner = [];
  let dropped = 0;
  for (let i = 0; i < mask.length; i++){
    const cut = mask[i].cut;
    for (let j = 0; j < cut.length; j++){
      const pc = cut[j], bb = pc._bb || (pc._bb = pieceBox(pc));
      if (box && (bb.x1 < box.x0 || bb.x0 > box.x1 || bb.y1 < box.y0 || bb.y0 > box.y1)){ dropped++; continue; }
      flat.push(pc); owner.push(i);

        const bb = out[k]._bb;

        if (convexOverlap(q, out[k], eps)){ hit = k; break; }
      }

      else { splits++; const parts = convexSubtract(q, out[hit], eps); for (let p = 0; p < parts.length; p++) queue.push(parts[p]); }

function clipBehindTerrain(footWorld, footElev, box, sx, sz){
  const mask = occluderMask(footWorld, footElev, box, sx, sz);
  if (!mask) return false;
  if (CLIPM.off){ ctx.save(); clipPerSlab(mask); window.__bbCount && __bbCount('clipPerSlab'); return true; }
  const m = mergeableCuts(mask, box, CLIPM.eps);
  if (!m){ ctx.save(); clipPerSlab(mask); window.__bbCount && __bbCount('clipPerSlab'); return true; }
  if (m.dropped) window.__bbCount && __bbCount('clipDroppedPieces', m.dropped);
  if (m.splits) window.__bbCount && __bbCount('clipSplits', m.splits);
  if (!m.pieces.length){ window.__bbCount && __bbCount('clipNone'); return false; }   /* every piece missed the box */
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  for (let j = 0; j < m.pieces.length; j++){
    const pc = m.pieces[j];
    ctx.moveTo(pc[0].x, pc[0].y);
    for (let k = 1; k < pc.length; k++) ctx.lineTo(pc[k].x, pc[k].y);
    ctx.closePath();
  }
  ctx.clip('evenodd');
  window.__bbCount && __bbCount('clipOne');
  return true;
}

     the transient-error budget then eats eight of before latching the board
     dead. Caught in the probe before this shipped. */

/* even-odd point-in-polygon on a projected tile top */
function pointInPoly(px, py, P){
  let inside = false;
  for (let i=0, j=P.length-1; i<P.length; j=i++){
    const xi = P[i].x, yi = P[i].y, xj = P[j].x, yj = P[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj-xi)*(py-yi)/((yj-yi)||1e-9) + xi)) inside = !inside;
  }
  return inside;
}

/* Cube rounding. Rounding a fractional axial/cube coordinate axis-by-axis can
   land off the hex; the fix is to round all three, then discard and re-derive
   whichever component moved furthest, restoring x+y+z === 0. */
function cubeRound(x, y, z){
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx-x), dy = Math.abs(ry-y), dz = Math.abs(rz-z);
  if (dx > dy && dx > dz)      rx = -ry - rz;
  else if (dy > dz)            ry = -rx - rz;
  else                         rz = -rx - ry;
  return { x:rx, y:ry, z:rz };
}
/* world (x,z) on the play plane → tile. THE ANALYTIC INVERSE OF gw(),
   HEXSPEC §4 — and note what it is NOT: it does not round the column and the
   row independently. That shortcut is right in the middle of every hex and
   wrong along every edge, which is exactly the "the click landed one tile off,
   but only sometimes" bug HEXSPEC §4 calls out. Go to axial, cube-round, come
   back to the same odd-r offset scheme gw() uses. */
function worldToTile(wx, wz){
  const s = hexSize();
  /* undo the board-centre offset gw() applies, so the origin is tile (0,0) */
  const u = wx + ((MAP.cols-1)/2) * hexW();
  const v = wz + ((MAP.rows-1)/2) * hexV();
  const q = (SQRT3/3 * u - v/3) / s;
  const r = (2/3 * v) / s;
  const c = cubeRound(q, -q - r, r);
  /* axial → odd-r offset. `&` and not `%` for the parity: JS gives -1 % 2 === -1
     and the column would come back one short on every negative row. */
  const col = c.x + (c.z - (c.z & 1)) / 2;
  const row = c.z;
  /* the bounds test has to be re-derived for staggered rows: a hex board is a
     rhombus in cube space, so test the OFFSET pair, after the conversion. */
  if (col < 0 || row < 0 || col >= MAP.cols || row >= MAP.rows) return null;
  return { x:col, z:row };
}

   ground point ~0.91·e FURTHER from the eye (the camera drops 0.914 world units
   of y per unit of −z), one hex row is hexV = 0.866 deep, so past ~0.43 of a row
   of height a click on a slab top silently resolved to the row BEHIND it. The
   art could not get taller until picking could see height, which is why this is
   the first edit and not the last.

   The fix is a plane sweep, not an iteration from the flat answer. Sweeping was
   chosen after the obvious cheaper thing was tried and rejected: "take the y=0
   tile, re-intersect at ITS height, repeat until stable" converges on the WRONG
   fixed point whenever the flat answer happens to land on a ground-level tile —
   which is the common case, because a ground tile re-intersected at y=0 is
   trivially stable and the loop exits pleased with itself before it has looked
   at the slab the user actually clicked.

   Because the ray descends monotonically, higher planes are crossed FIRST, i.e.
   nearer the eye. So walk the map's distinct heights top-down and return the
   first plane whose crossing lands on a tile that is actually that tall: that
   tile's top face is the nearest surface under the cursor, occlusion included —
   a 1.35-high ruin standing in front of a street tile takes the click, which is
   what the picture already says it should do. Falling through every rung means
   the ray met no top face, only a cliff side; the y = 0 answer is the tile whose
   flank it entered, which is the right tile anyway — UNLESS the ray has already
   left the lattice, in which case y = 0 answers null and the sweep must fall
   back on the rung it rim-rejected. See the 🕳 note in pickTile(). */
/* 🩹 THE OVERHANG RIM — how wide a band of a slab's BACK edge is not really the
   slab, in screen pixels. See slabTakesSample() for what it is for and
   pickTile() for where it is applied. 1.5 px is not taste; it is measured, and
   the measurement is in the comment below. */
const PICK_EDGE_PX = 1.5;
/* 🔎 DOES THIS SLAB TOP ACTUALLY COVER THE CLICKED PIXEL — asked of the DRAWN
   polygon, not of the analytic crossing that proposed it.

   ══ THE BUG THIS EXISTS TO KILL (measured, not reasoned about) ══
   The plane sweep in pickTile() is an exact ray/terrain intersection and it
   answered the FINAL GATE's one failure: on 24 of 24 random match seeds, 1–6
   of the 168 tiles resolved their own centre pixel to the tile in FRONT of
   them, so clicking exactly on a unit's feet selected the neighbour.
   Every one of those cases was measured and every one had the same shape:

     tile      elev   answered   its elev   how far INSIDE the answer's
                                            projected top face the pixel was
     (1,1)     0.00   (2,2)      0.34       0.2 px
     (2,1)     0.34   (3,2)      0.68       0.2 px
     (12,1)    0.34   (12,2)     0.68       0.6 px
     (13,1)    0.34   (13,2)     0.68       0.8 px
     (13,2)    0.68   (12,3)     1.02       0.6 px

   ALWAYS the immediate front neighbour, ALWAYS exactly ONE rung of the ladder
   taller, ALWAYS inside by under a pixel. That is not an accident of the
   terrain, it is a resonance in the geometry: climbing one rung (0.34) walks
   the ray about 1.0 hex circumradius toward the eye at the far rows, which is
   exactly the distance from a tile's centre to the SHARED VERTEX of the two
   tiles in front of it. So the crossing lands on a triple point — a corner
   where three hexagons meet — and which of the three wins is decided by
   cube-rounding noise at the eighth decimal, not by anything the player can
   see. The occluder's claim on that pixel is a hexagon CORNER clipping it,
   and the renderer paints that corner as an antialiased hairline over a
   TILE_INSET seam. The picture does not say the slab owns that pixel. The
   analytic sweep said it did, because a mathematical point either is or is not
   inside a polygon and it has no notion of a pixel having width.

   ══ WHY THIS AND NOT THE OTHER THREE ══
   · Shrinking the elevation ladder's rung gap moves the resonance instead of
     removing it, and pays for it in BAR R1 relief. Rejected: that is a
     decision about how the board looks, not a fix to the pick.
   · A sprite-box fallback in unitAt() would make units clickable and leave
     BARE GROUND still mis-picking, i.e. the rules and the picture still
     disagreeing — the exact bug class this project exists to remove. Rejected.
   · Ray-marching the top faces in depth order is what pickTile ALREADY does;
     the plane sweep is that march, expressed over the map's distinct heights.
     Marching cell-by-cell instead gives byte-identical answers (both are exact
     first-surface intersections) and costs more. Rejected as a no-op.
   So: keep the exact analytic answer, and correct it against the drawn polygon
   set — the hybrid. The correction is the smallest one that is true: a surface
   only occludes a sample it actually covers, and coverage is a question about
   PIXELS, so it is asked in screen space against tilePoly()'s own corners.

   ══ WHY ONLY THE BACK EDGES ══
   A slab can only steal a tile's anchor across an edge that faces AWAY from
   the eye — that is the only side its top face hangs out over lower ground.
   Applying the rim to the front edges as well would hand a 1.5 px strip of
   every slab's NEAR lip to the tile in front of it, which is a lie in the
   other direction and buys nothing. Same back-face test as slabPieces() and
   paintWalls(), so the clip, the paint and the pick cannot disagree about
   which side of a slab is which.

   ══ WHY 1.5 PX ══
   Half a pixel of pointer quantisation (the browser delivers integer CSS
   pixels), half a pixel of rasterisation (the sample is a square, not a
   point), and the TILE_INSET seam the renderer draws between cells. The
   deepest real intrusion measured over the seed sweep was 0.8 px, so 1.5 px
   clears it with the same margin again to spare; a slab gives up 1.5 px of a
   ~45 px wide cell, 3%, on the side the player cannot aim at anyway.

   ══ WHAT THAT COSTS, BOARD-WIDE, STATED AS A NUMBER ══
   "1.5 px, on the back edges only" is the per-edge truth and it undersells the
   total, so here is the total, rastered at 1 px over every drawn ground pixel
   at 802×688 on the default seed: pick and picture disagree on 10,392 of
   184,215 pixels, 5.64%, against 0.00% before the rim. Every one of those is a
   back-edge hairline handed to the tile behind, which is the trade this whole
   block argues for — but 5.64% is the honest size of it, and camCheck's
   168-centre sample only ever shows it as a handful. If that number is ever to
   come down, the knob is the elevation ladder's rung gap, not this constant.
   ⚠ RAISING PICK_EDGE_PX IS NOT FREE AND IS NOT SELF-POLICING. At 8 px the
   board is measurably worse and every check in this file still passes unless
   camCheck's `rim` classifier bounds the depth — which it now does, against
   this constant. Change one and read the other. */
const _STS_D = new Float64Array(6), _STS_BACK = new Uint8Array(6);
function slabTakesSample(gx, gz, e, mx, my){
  if (e <= 1e-6) return true;                  /* flat ground overhangs nothing */
  const Wt = hexCorners(gx, gz, 0, e);
  const P = [];
  for (let i = 0; i < 6; i++){ const p = project(Wt[i]); if (!p) return true; P.push(p); }
  /* screen centroid, used to orient the edge normals inward — a projected
     hexagon is convex, so one consistent inward normal per edge is all the
     containment test needs — and to measure the cell's own projected inradius,
     which is what bounds the rim (see below). */
  let cx = 0, cy = 0;
  for (let i = 0; i < 6; i++){ cx += P[i].x; cy += P[i].y; }
  cx /= 6; cy /= 6;
  const ctr = gw(gx, gz, e);
  let inr = Infinity;
  for (let i = 0; i < 6; i++){
    const j = (i + 1) % 6;
    let nx = -(P[j].y - P[i].y), ny = (P[j].x - P[i].x);
    const L = Math.hypot(nx, ny);
    if (L < 1e-9){ _STS_D[i] = Infinity; _STS_BACK[i] = 0; continue; }
    nx /= L; ny /= L;
    const dc = nx*(cx - P[i].x) + ny*(cy - P[i].y);
    if (dc < 0){ nx = -nx; ny = -ny; }
    if (Math.abs(dc) < inr) inr = Math.abs(dc);
    _STS_D[i] = nx*(mx - P[i].x) + ny*(my - P[i].y);    /* +ve = inside */
    const mwx = (Wt[i].x + Wt[j].x)/2, mwz = (Wt[i].z + Wt[j].z)/2;
    _STS_BACK[i] = ((mwx - ctr.x)*(CAM.pos.x - mwx) + (mwz - ctr.z)*(CAM.pos.z - mwz) <= 0) ? 1 : 0;
  }
  /* 📏 THE RIM IS A HAIRLINE AND HAS TO STAY ONE AT EVERY ZOOM.
     PICK_EDGE_PX is an absolute pixel width, and an absolute width is only a
     hairline while the cells are big. On a phone-width host the fit dollies the
     board down to a 240 px rect and a cell's projected inradius falls to a
     handful of pixels, where a flat 1.5 px rim is a third of the way to the
     centre and starts eating a tile's OWN interior — measured, on the first cut
     of this: 356 slabFails at 820×1180 and 406 at 390×844, tiles losing samples
     inside their own top face because the rim reached past the 0.80 probe ring. So the rim is also capped at 0.15 of the cell's
     own projected inradius: under a sixth of the way to the centre at any zoom,
     and comfortably clear of hexSelfCheck's outermost probe ring at 0.80. */
  const rim = Math.min(PICK_EDGE_PX, 0.15 * (inr === Infinity ? 0 : inr));
  for (let i = 0; i < 6; i++) if (_STS_D[i] < (_STS_BACK[i] ? rim : 0)) return false;
  return true;
}
function pickTile(mx, my){
  const ndx = (mx - VIEW.cx) / VIEW.scale;
  const ndy = -(my - VIEW.cy) / VIEW.scale;
  const dir = norm({
    x: CAM.f.x + CAM.r.x*ndx + CAM.u.x*ndy,
    y: CAM.f.y + CAM.r.y*ndx + CAM.u.y*ndy,
    z: CAM.f.z + CAM.r.z*ndx + CAM.u.z*ndy
  });
  if (Math.abs(dir.y) < 1e-5) return null;
  const at = h => {
    const t = (h - CAM.pos.y) / dir.y;
    return t > 0 ? worldToTile(CAM.pos.x + dir.x*t, CAM.pos.z + dir.z*t) : null;
  };
  const rungs = tileElevRungs();
  /* 🕳 THE RIM MUST NEVER TURN A HIT INTO NOTHING — measured, and it did.
     The sweep below rejects a rung the sample only grazes and carries on down
     to the surface BEHIND it, which is the one the picture shows. That is
     right wherever a surface is behind it. On a tile at the BOARD PERIMETER
     there is nothing behind the outward-facing back edge: the ray leaves the
     lattice and at(0) — which an earlier version of this comment called
     "unconditional" — returns null, because worldToTile() answers null off the
     board. Rastered at 1 px over the shipped host (802×688, default seed) that
     was 1,914 of 184,215 drawn-ground pixels (1.04%) answering NOTHING, all on
     the outer ~1.5 px lip of perimeter tiles, where before the rim went in the
     answer was that tile. A click there dispatched no board:tileClick at all —
     the same bug class the rim exists to remove (pick disagreeing with
     picture), just moved from a unit's anchor to the board's edge.
     So remember the first rung that was analytically ACCEPTED and only
     rim-rejected, and fall back to it when the sweep bottoms out on nothing.
     Where a real surface sits behind the edge, at(0) wins and the rim behaves
     exactly as designed; where none does, the pre-rim answer is restored.
     hexSelfCheck's `nullOverDrawn` asserts this at 0 so it cannot come back. */
  let grazed = null;
  for (let i = 0; i < rungs.length; i++){
    const t = at(rungs[i]);
    if (t && Math.abs(tileElev(t.x, t.z) - rungs[i]) < 1e-6){
      if (slabTakesSample(t.x, t.z, rungs[i], mx, my)) return t;
      if (!grazed) grazed = t;                  /* nearest rim-rejected surface */
    }
  }
  return at(0) || grazed;
}

/* ══════════════════════════════════════════════════════════════════

   sharing no code: flip a parity in either and the board still looks
   perfect, while the tile you CLICK slides away from the tile you

   So occlusion is still tolerated per-SAMPLE — it is genuinely correct that you

     · `deadCentres`  — a tile whose own centre pixel resolves elsewhere. Units

   ⚠ "Up to yaw 45 with pan, deadCentres is 0" used to stand here and it is not

   NEUTRAL FIT deadCentres is 0 and every tile centre resolves to itself

   allowed to stand in front of an anchor, and the pick says so rather than
   lying about it.
   If those last few have to go too, the knob is the ELEVATION LADDER's rung gap

/* Screen-space crossing-number test, used by hexSelfCheck to decide whether an
   occluder's projected top face really covers the pixel it was credited with.
   A null polygon (a corner behind the camera, so tilePoly bailed) answers
   FALSE, which is the safe direction here: an unprovable excuse is not an
   excuse, and the sample falls through to the hard-failure list. */
function ptInPoly(px, py, P){
  if (!P || P.length < 3) return false;
  let inside = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++){
    const yi = P[i].y, yj = P[j].y;
    if ((yi > py) !== (yj > py) &&
        px < (P[j].x - P[i].x) * (py - yi) / (yj - yi) + P[i].x) inside = !inside;
  }
  return inside;
}
/* How far inside a projected polygon a pixel is, in PIXELS — negative outside.
   Diagnostic only (see the dead-centre post-mortem); nothing on the pick path
   calls it, because slabTakesSample() needs the per-edge answer, not the
   minimum over all six. */
function _polyDepthPx(px, py, P){
  if (!P || P.length < 3) return null;
  let best = Infinity;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++){
    const ax = P[j].x, ay = P[j].y, vx = P[i].x - ax, vy = P[i].y - ay;
    const L2 = vx*vx + vy*vy || 1;
    const t = Math.max(0, Math.min(1, ((px-ax)*vx + (py-ay)*vy) / L2));
    best = Math.min(best, Math.hypot(px - (ax + t*vx), py - (ay + t*vy)));
  }
  return +((ptInPoly(px, py, P) ? best : -best).toFixed(2));
}
/* 🖼 IS THIS TILE'S WHOLE TOP FACE INSIDE THE CANVAS?
   The invariant fitDistance() now solves for, restated as a test — because the
   off-canvas break (OPEN-BREAKS #3) survived every check in this file. The
   round trip below is a WORLD↔GRID identity and the slab half is a
   SCREEN↔GRID identity; both are perfectly happy about a tile whose pixels are
   at x = −5.7, off the left of the frame, where a real click hits the page
   behind the iframe. Nothing here looked at the frame. Now something does.
   Measured at the NEUTRAL pose only — see fitDistance's camera note: the fit is
   the guarantee, the free camera is allowed to pan a tile out of view because R
   brings the whole board back. */
function tileOffFrame(x, z){
  const P = tilePoly(x, z, 0, tileElev(x, z));
  if (!P) return true;                       /* a corner behind the camera is off-frame too */
  for (const p of P) if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) return true;
  return false;
}
/* 🕳 CAN A PIXEL THE BOARD IS DRAWN ON ANSWER *NOTHING*?
   Nothing in this file asked that until a rim fall-through in pickTile() made
   the answer yes on 1.04% of drawn ground, and every check here stayed green:
   the reach loop above never samples past 0.80 of the inradius, and camCheck
   only looks at the 168 centre pixels — and would have filed a null under
   'rim' anyway. The failure lived entirely in the outer ~1.5 px of a tile's
   drawn top face, which is precisely the band no probe ring reached.
   So probe that band directly, on EVERY edge of EVERY tile, and assert 0.
   · Against tilePoly — the polygon the renderer actually strokes — because
     "drawn" is the claim being tested. ptInPoly gates each sample so a point
     pushed inward from one edge near a sharp projected corner, and therefore
     outside another, is not counted as drawn.
   · Depths 0.15…1.5 px straddle PICK_EDGE_PX; the lip is where it breaks.
   · Only NULL is a failure. A sample answered by a taller tile in front is
     correct occlusion and is the reach loop's business, not this one.
   ~24k picks, ~0.2 s, and it is the only thing standing between the board and
   a silent dead zone around its own rim. */
function _nullOverDrawnScan(out){
  const US = [0.08, 0.25, 0.42, 0.58, 0.75, 0.92], DS = [0.15, 0.5, 1.0, 1.5];
  let samples = 0;
  for (let z = 0; z < MAP.rows; z++) for (let x = 0; x < MAP.cols; x++){
    const P = tilePoly(x, z, 0, tileElev(x, z));
    if (!P || P.length < 3) continue;
    let cx = 0, cy = 0;
    for (const p of P){ cx += p.x; cy += p.y; }
    cx /= P.length; cy /= P.length;
    for (let i = 0; i < P.length; i++){
      const j = (i + 1) % P.length;
      let nx = -(P[j].y - P[i].y), ny = P[j].x - P[i].x;
      const L = Math.hypot(nx, ny);
      if (L < 1e-9) continue;
      nx /= L; ny /= L;
      if (nx*(cx - P[i].x) + ny*(cy - P[i].y) < 0){ nx = -nx; ny = -ny; }   /* point inward */
      for (const u of US){
        const ex = P[i].x + (P[j].x - P[i].x)*u, ey = P[i].y + (P[j].y - P[i].y)*u;
        for (const d of DS){
          const sx = ex + nx*d, sy = ey + ny*d;
          if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
          if (!ptInPoly(sx, sy, P)) continue;
          samples++;
          if (!pickTile(sx, sy))
            out.push({ tile:[x,z], edge:i, at:[+sx.toFixed(1), +sy.toFixed(1)], inPx:d });
        }
      }
    }
  }
  return samples;
}
function hexSelfCheck(opts){
  const rings = (opts && opts.rings) || 8;
  const centre = [], jitter = [], slab = [], buried = [], deadCentre = [], offFrame = [];
  let occluded = 0, slabSamples = 0, minVisible = 1;
  const rungHits = {};
  for (let z = 0; z < MAP.rows; z++){
    for (let x = 0; x < MAP.cols; x++){
      const w = gw(x, z, 0);
      const t = worldToTile(w.x, w.z);
      if (!t || t.x !== x || t.z !== z)
        centre.push({ want:[x,z], got:t ? [t.x,t.z] : null,
                      world:[+w.x.toFixed(4), +w.z.toFixed(4)] });
      /* Centres alone are a weak test: an inverse that rounds col and row
         separately passes every centre and fails near the edges. Probe inside
         the tile as well, at 90% of the INRADIUS — a circle of that radius is
         strictly inside one hex and touches no other, so every sample has
         exactly one right answer. */
      for (let i = 0; i < rings; i++){
        const a = i * Math.PI * 2 / rings, rr = tileR() * 0.9;
        const t2 = worldToTile(w.x + Math.cos(a)*rr, w.z + Math.sin(a)*rr);
        if (!t2 || t2.x !== x || t2.z !== z)
          jitter.push({ want:[x,z], got:t2 ? [t2.x,t2.z] : null,
                        deg: Math.round(a*180/Math.PI) });
      }
      /* ⛰ the slab-top round trip, at this tile's own rung */
      const e = tileElev(x,z);
      rungHits[e.toFixed(3)] = (rungHits[e.toFixed(3)]||0) + 1;
      if (!CAM || !VIEW.scale) continue;
      const wt = gw(x, z, e);
      /* Two rings rather than one, at 0.45 and 0.80 of the INRADIUS, plus the
         centre. One ring at 0.7 could not distinguish "the near fringe is all
         that is left" from "the whole tile is reachable", which is the exact
         distinction this check now has to make. */
      let reach = 0, taken = 0;
      for (let i = -1; i < rings * 2; i++){
        const a = (i % rings) * Math.PI * 2 / rings;
        const rr = i < 0 ? 0 : tileR() * (i < rings ? 0.45 : 0.80);
        const sp = project({ x: wt.x + Math.cos(a)*rr, y: e, z: wt.z + Math.sin(a)*rr });
        if (!sp) continue;
        slabSamples++; taken++;
        const t3 = pickTile(sp.x, sp.y);
        if (t3 && t3.x === x && t3.z === z){ reach++; continue; }
        /* 🔬 A dead centre carries its own post-mortem. Finding out WHY the
           five in the final gate were dead took an hour of external probing to
           learn one number — how far inside the answer's projected top face
           the pixel actually was — and that number is the whole diagnosis
           (0.2–0.8 px said "triple point", which is what PICK_EDGE_PX now
           handles; 8 px would have said "the generator is burying tiles",
           which is a different fix in a different file). It is computed only
           for a FAILING sample, so it costs a clean board nothing. */
        if (i < 0) deadCentre.push({ tile:[x,z], got:t3 ? [t3.x,t3.z] : null,
                                     elev:+e.toFixed(3),
                                     gotElev: t3 ? +tileElev(t3.x,t3.z).toFixed(3) : null,
                                     insidePx: t3 ? _polyDepthPx(sp.x, sp.y,
                                         tilePoly(t3.x, t3.z, 0, tileElev(t3.x,t3.z))) : null });
        /* Taller ⇒ genuinely in the way — ARGUED, then CHECKED.
           The ray's y falls monotonically, so a plane at a greater height is
           crossed EARLIER, i.e. nearer the eye. A taller answer is therefore a
           surface in front of this sample by construction — including a
           same-ROW neighbour, which an earlier version of this test wrongly
           excluded by comparing world z and then reported ten honest occlusions
           in `skirmish` as projection failures.
           ⚠ …and "by construction" was doing too much work on its own. This is
           the tolerant bucket: everything filed here is forgiven, so an answer
           that lands here without its top face actually covering the pixel is a
           picker hole wearing an excuse — the same shape as the burying bug
           this check was rewritten to catch, just smaller. So the height
           argument now has to survive a point-in-polygon test against the
           answer's own projected top face before the sample is forgiven.
           📐 AT inset 0, NOT AT TILE_INSET, and that is not a fudge — it is the
           difference between the two quantities. TILE_INSET shrinks the DRAWN
           hexagon by 0.008 of a circumradius so the cell seam has somewhere to
           live; the tile's real footprint, which is what worldToTile and
           therefore pickTile answer over, is the un-inset hex. Measured both
           ways over 18,312 interior samples a tile: against the drawn polygon
           65 samples at 1600×900 / 68 at 1440×900 / 93 at 1100×780 fall outside
           (0.35–0.51%), and every one of them is a pixel in that cosmetic
           hairline. Against the footprint the count is 0 at every host tried.
           Test the drawn polygon and this check reports a half-percent phantom
           failure for ever after. */
        if (t3 && tileElev(t3.x,t3.z) > e + 1e-6 && ptInPoly(sp.x, sp.y, tilePoly(t3.x, t3.z, 0, tileElev(t3.x,t3.z)))){
          occluded++; continue;
        }
        slab.push({ want:[x,z], got:t3 ? [t3.x,t3.z] : null, elev:+e.toFixed(3),
                    deg: i < 0 ? 'centre' : Math.round(a*180/Math.PI) });
      }
      if (taken){
        const vis = reach / taken;
        if (vis < minVisible) minVisible = vis;
        if (reach === 0) buried.push({ tile:[x,z], elev:+e.toFixed(3), samples:taken });
      }
      /* 🖼 …and is it even ON the canvas. A hard failure, like buriedFails: a
         tile the frame cuts is a tile the player cannot fully click, while
         getValidMoves still offers it. Not folded into the reach loop above
         because that loop already skips off-canvas samples — which is how the
         board could report every tile reachable with two of them off frame. */
      if (tileOffFrame(x, z)) offFrame.push({ tile:[x,z], elev:+e.toFixed(3) });
    }
  }
  const tiles = MAP.cols * MAP.rows;
  const nullDrawn = [];
  const nullDrawnSamples = (CAM && VIEW.scale) ? _nullOverDrawnScan(nullDrawn) : 0;
  return { cols:MAP.cols, rows:MAP.rows, tiles,
           samples: tiles * (1 + rings) + slabSamples + nullDrawnSamples,
           centreFails: centre.length, jitterFails: jitter.length,
           slabSamples, slabFails: slab.length, occluded,
           buriedFails: buried.length, deadCentres: deadCentre.length,
           offFrameFails: offFrame.length,
           /* 🕳 a drawn ground pixel that answers NOTHING. Hard failure, in
              `ok` — see _nullOverDrawnScan. Unlike offFrameFails this holds at
              EVERY pose: a rim that eats clicks does not care about the fit. */
           nullOverDrawn: nullDrawn.length, nullOverDrawnSamples: nullDrawnSamples,
           nullDrawn: nullDrawn.slice(0, 12),
           /* offFrameFails is only a FAILURE at the neutral pose — a panned or
              yawed camera is allowed to push tiles out of frame. Report the pose
              beside the count so the number cannot be read out of context. */
           pose: { yawDeg: +(CAMERA.yaw*180/Math.PI).toFixed(2),
                   pan: { x:+CAMERA.pan.x.toFixed(3), z:+CAMERA.pan.z.toFixed(3) },
                   neutral: Math.abs(CAMERA.yaw) < 1e-6 && !CAMERA.pan.x && !CAMERA.pan.z },
           minVisible: +minVisible.toFixed(3),
           rungs: rungHits, ladder: tileElevRungs().slice(),
           ok: centre.length === 0 && jitter.length === 0 && slab.length === 0
               && buried.length === 0 && deadCentre.length === 0
               && offFrame.length === 0 && nullDrawn.length === 0,
           /* the dead-centre post-mortems on their own as well as inside
              `fails`: they are the one bucket whose per-entry numbers (which
              tile answered, how deep inside its drawn top face the pixel was)
              say WHICH fix applies, and digging them back out of a mixed list
              is how the last round of this took an hour it did not need to. */
           deadCentre: deadCentre.slice(0, 16),
           fails: centre.slice(0,10).concat(jitter.slice(0,10)).concat(slab.slice(0,10))
                  .concat(buried.slice(0,10)).concat(deadCentre.slice(0,10))
                  .concat(offFrame.slice(0,10)) };
}
window.__bbHexCheck = hexSelfCheck;

/* 📐 FIT SELF-REPORT — the framing equivalent of __bbHexCheck, and on window
   for the same reason: the numbers BAR R1 is judged on (how much of the host
   rect the board covers, how wide a near-row hex is, how tall a unit reads)
   are not knowable by reading the code, only by measuring the projection that
   actually ran. A capture can be eyeballed; this can be asserted.
     window.__bbFitProbe()  →  { host, pitchDeg, dist, hexNear, unitH, board,
                                 ground, braziers }
   All lengths are CSS px inside the iframe, matching board:rects. */
function fitReport(){
  const tx = latticeCentreX(), e = boardExtent(), g = groundExtent();
  const zn = (MAP.rows-1)/2*hexV();
  const px = p => p ? { x:+p.x.toFixed(1), y:+p.y.toFixed(1) } : null;
  const a = project(gw(0, MAP.rows-1, 0)), b = project(gw(MAP.cols-1, MAP.rows-1, 0));
  const f = project({x:tx,y:0,z:-e.z}), n = project({x:tx,y:0,z:e.z});
  const u0 = project({x:tx,y:0,z:zn}), u1 = project({x:tx,y:unitWorldH({h:1.05}),z:zn});
  const dir = norm(sub(CONFIG.camera.target, CONFIG.camera.pos));
  return {
    host: { w:+VIEW.box.w.toFixed(0), h:+VIEW.box.h.toFixed(0) },
    pitchDeg: +(Math.asin(-dir.y)*180/Math.PI).toFixed(1),
    dist: +Math.hypot(CONFIG.camera.pos.y - CONFIG.camera.target.y, CONFIG.camera.pos.z).toFixed(2),
    viewShiftY: +CONFIG.viewShiftY.toFixed(1),
    hexNear: (a && b) ? +((b.x - a.x)/(MAP.cols-1)).toFixed(1) : null,
    unitH:   (u0 && u1) ? +Math.abs(u1.y - u0.y).toFixed(1) : null,
    board:   (f && n) ? { top:+f.y.toFixed(0), bottom:+n.y.toFixed(0),
                          pctH:+(100*(n.y - f.y)/VIEW.box.h).toFixed(0) } : null,
    ground:  { x:+g.x.toFixed(2), near:+g.near.toFixed(2), far:+g.far.toFixed(2) },
    /* Rebuild cost of the baked terrain layer, in ms. It is NOT a per-frame
       cost — the frame blits the cache — but it is the number to watch if the
       tile painters ever grow, because a time-of-day lerp pays it ~20 times. */
    terrainBakeMs: +TERR.ms.toFixed(2),
    /* 🟥🟦 scale/depth the seed settled on, whether both fit the host box, and
       each dais's opaque screen rect — the numbers "outside the frame, not on
       the hand" is judged on. */
    platforms: window.__bbPlatforms(),
    braziers: braziers.map(br => {
      const q = project({ x:br.x, y:0, z:br.z });
      const t = project({ x:br.x, y:PYLON_ART.heightWorld, z:br.z });
      const w = project({ x:br.x + (PYLON_ART.img ? PYLON_ART.widthWorld : 0.9)*0.5, y:0, z:br.z });
      if (!q || !t || !w) return null;
      const half = Math.abs(w.x - q.x);
      return { base:px(q), left:+(q.x-half).toFixed(0), right:+(q.x+half).toFixed(0),
               top:+t.y.toFixed(0),
               inside: (q.x-half) >= VIEW.box.l && (q.x+half) <= VIEW.box.l+VIEW.box.w
                       && t.y >= VIEW.box.t && q.y <= VIEW.box.t+VIEW.box.h };
    })
  };
}
window.__bbFitProbe = fitReport;
/* 🚶 WALK PROBE — what a unit is ACTUALLY animating, and where its route came
   from. Same reason as the camera probe below: `units` and `TELE` are top-level
   lexical bindings, so a driver outside this document cannot see them, and a
   test that re-derived the tween would be testing its own copy.
   It reports `tele` alongside the tween on purpose. "The board walked the bent
   route" is only evidence that the route travelled WITH THE MOVE if the
   telegraph was demonstrably empty at the time — otherwise the old
   TELE-sourced path could be producing the same picture and the regression
   would be invisible. Read-only; it starts nothing and mutates nothing. */
window.__bbWalk = (id) => {
  const u = units.find(x => String(x.id) === String(id));
  if (!u) return null;
  const t = u.tween;
  return {
    id: String(u.id), gx: u.gx, gz: u.gz, anim: u.anim,
    tele: Array.isArray(TELE.path) ? TELE.path.slice() : [],
    tween: t ? { n: t.n, dur: +(+t.dur).toFixed(4),
                 legs: (t.legs || []).map(p => [Math.round(p.x), Math.round(p.z)]) } : null
  };
};
/* 🎥 CAMERA PROBE — the free camera's state, and a way to drive it from a test
   without a real key event. There is no other way to assert that a capture was
   taken at the yaw it claims: yaw is not visible in a PNG, and "it looks
   turned" is not a measurement.
   `set` jumps straight to a pose (no easing, no clamp bypass — camClampPan
   still runs) so a screenshot rig can capture yaw 0 / 45 / 90 / 180 / 270
   deterministically instead of holding a key for a guessed number of ms.
   `key(down, code)` drives the real integrated path, which is what proves the easing and
   the frame-rate independence rather than the teleport. */
window.__bbCam = {
  get: () => ({
    yaw: +CAMERA.yaw.toFixed(5), yawDeg: +(CAMERA.yaw*180/Math.PI).toFixed(2),
    pan: { x:+CAMERA.pan.x.toFixed(4), z:+CAMERA.pan.z.toFixed(4) },
    vel: { x:+CAMERA.vel.x.toFixed(4), z:+CAMERA.vel.z.toFixed(4), yaw:+CAMERA.yawVel.toFixed(4) },
    moving: CAMERA.moving, reduced: CAM_REDUCED,
    held: Object.keys(CAM_HELD),
    base: { tx:+CAM_BASE.tx.toFixed(3), pitchDeg:+(CAM_BASE.pitch*180/Math.PI).toFixed(2),
            dist:+CAM_BASE.dist.toFixed(3) },
    pos: { x:+CONFIG.camera.pos.x.toFixed(3), y:+CONFIG.camera.pos.y.toFixed(3), z:+CONFIG.camera.pos.z.toFixed(3) },
    terrainKey: terrainKey()
  }),
  set: (yawDeg, px, pz) => {
    CAMERA.yaw = (+yawDeg || 0) * Math.PI/180;
    while (CAMERA.yaw > Math.PI) CAMERA.yaw -= Math.PI*2;
    while (CAMERA.yaw <= -Math.PI) CAMERA.yaw += Math.PI*2;
    CAMERA.pan.x = +px || 0; CAMERA.pan.z = +pz || 0;
    CAMERA.vel.x = CAMERA.vel.z = CAMERA.yawVel = 0;
    camClampPan(); camApply();
    return window.__bbCam.get();
  },
  key: (down, code) => { camKey(!!down, code, null); return Object.keys(CAM_HELD); },
  reset: camReset,
  check: () => camCheck()
};

/* 🎥 THE CAMERA SELF-CHECK — three assertions that are invisible in a PNG and
   silent in the console, all of which the free camera can break at an angle
   nobody screenshotted. It lives here, and not in the capture script, for the
   reason CLAUDE.md's "globals trap" spells out: every binding in this file is a
   top-level `const`/`let`, i.e. a LEXICAL global, so it is NOT on `window` and
   an outside driver cannot see MAP, gw(), project() or pickTile() at all. A
   test that cannot reach them would have to re-implement the projection, which
   would then be testing its own copy.

   1. CLICK ROUND-TRIP — pickTile() must keep resolving to the hexagon actually
      DRAWN under the cursor at any camera angle. `__bbHexCheck` proves gw() ↔
      worldToTile and the elevation plane sweep, but it asks the projection
      about itself. This asks the PICTURE: for each tile's own centre pixel,
      which tile's projected top face contains that pixel, taking the nearest
      such face because that is the one the terrain sweep painted last and
      therefore the one the player sees. Disagreement with pickTile() is a
      click landing on a tile other than the one drawn there — the single most
      likely thing to break under a camera, and it breaks silently.
   2. PAINTER ORDER — the drawable list must be sorted far-to-near in CAMERA
      depth. Rebuilt here exactly as frame() builds it. Under the old grid-z
      key this passes at yaw 0 and fails completely at 180.
   3. TERRAIN REGISTRATION — the landmine. The baked ground layer is a picture
      of one specific eye; if terrainKey() does not name the camera, the cache
      survives a camera move and the ground stays nailed to the screen while
      everything drawn live slides over it. `registered` compares the key the
      layer was actually baked with against the key for the pose now. */
function camCheck(){
  const inPoly = (P, x, y) => {
    let inside = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++){
      const xi = P[i].x, yi = P[i].y, xj = P[j].x, yj = P[j].y;
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  };
  const faces = [];
  for (let z = 0; z < MAP.rows; z++) for (let x = 0; x < MAP.cols; x++){
    const e = tileElev(x, z);
    const P = tilePoly(x, z, 0, e);
    /* `pl` is the world plane the face lies in — horizontal for a top face.
       occlusionAudit ray-casts against it rather than against a height, so it
       can carry cliff-face quads in the same list. */
    if (P) faces.push({ x, z, P, d: camDepth(gw(x, z, e)), pl: { x:0, y:1, z:0, c:e } });
  }
  const drawnAt = (px, py) => {
    let best = null;
    for (const f of faces) if (inPoly(f.P, px, py)) if (!best || f.d < best.d) best = f;
    return best;
  };
  let samples = 0, mismatch = 0, offScreen = 0, rim = 0, hard = 0;
  const bad = [];
  for (let z = 0; z < MAP.rows; z++) for (let x = 0; x < MAP.cols; x++){
    const e = tileElev(x, z);
    const p = project(gw(x, z, e));
    if (!p || p.x < 0 || p.x > W || p.y < 0 || p.y > H){ offScreen++; continue; }
    samples++;
    const got = pickTile(p.x, p.y), drawn = drawnAt(p.x, p.y);
    const gk = got ? got.x + ',' + got.z : 'null';
    const dk = drawn ? drawn.x + ',' + drawn.z : 'null';
    if (gk === dk) continue;
    mismatch++;
    /* 🩹 …AND WHY `mismatch` IS NO LONGER ALLOWED TO BE THE WHOLE ANSWER.
       drawnAt() above is a ZERO-WIDTH point-in-polygon against the nearest
       face — it is deliberately NOT the rule pickTile uses, because an audit
       that re-implements the thing it audits proves nothing. Since
       PICK_EDGE_PX went in, the two definitions differ on exactly one set of
       pixels: the ≤1.5 px rim inside a slab's BACK edges, which the pick hands
       to the tile behind on purpose (see slabTakesSample). Those show up here
       as disagreements and always will.
       So the raw count stays visible — never quietly zeroed — and is split:
         · `rim`  — explained by the new rule: the drawn winner holds the pixel
                    only inside its own back-edge rim, and the pick's answer is
                    a face that really does contain the pixel. Expected.
         · `hard` — everything else. THIS is the one that must be 0; a pick
                    landing on a tile that is not drawn under the cursor at all
                    is the silent camera break this assertion exists to catch.

       ⚠ AND `rim` HAS TO BE BOUNDED BY A WIDTH OR THE ASSERTION IS CIRCULAR.
       The first cut of this classifier asked slabTakesSample() itself and
       nothing else — so ANY disagreement the rim rule produced was, by
       construction, "explained", however wide the rule's rim had grown.
       Demonstrated rather than suspected: PICK_EDGE_PX raised to 8 px made the
       pick measurably worse across the board and left every check in this file
       green, `hard === 0` included. A rule cannot be its own bound. So the
       depth is measured too: the pixel must sit within PICK_EDGE_PX of the
       drawn owner's boundary. Deeper than that and the pick is not shaving a
       hairline off an edge, it is taking a bite out of a face — counted `hard`,
       which fails, no matter what the rim rule says about it. */
    let explained = false, depth = drawn ? _polyDepthPx(p.x, p.y, drawn.P) : null;
    if (got && drawn){
      const de = tileElev(drawn.x, drawn.z);
      explained = depth !== null && depth <= PICK_EDGE_PX
                  && !slabTakesSample(drawn.x, drawn.z, de, p.x, p.y)
                  && ptInPoly(p.x, p.y, tilePoly(got.x, got.z, 0, tileElev(got.x, got.z)));
    }
    if (explained) rim++; else hard++;
    if (bad.length < 8) bad.push({ tile:[x,z], picked:gk, drawn:dk, kind: explained ? 'rim' : 'hard',
                                   at:[Math.round(p.x), Math.round(p.y)],
                                   insidePx: depth });
  }
  const order = [];
  for (const t of MAP.tiles) if (t.prop) order.push(camDepth(gw(t.x,t.z,0)));
  for (const u of units) order.push(camDepth(gw(u.x,u.z,0)));
  for (const tb of TOMBS) order.push(camDepth(gw(tb.x,tb.z,0)));
  for (const sc of STRUCTS) order.push(camDepth(gw(sc.x,sc.z,0)));
  for (const cp of CPS) order.push(camDepth(gw(cp.x,cp.z,0)));
  for (const ev of (MAP.events||[])) order.push(camDepth(gw(ev.x,ev.z,0)));
  for (const br of braziers) order.push(camDepth({x:br.x, y:0, z:br.z}));
  for (const pl of PLATFORMS.list) order.push(camDepth({x:pl.x, y:0, z:pl.z}));
  order.sort((a,b) => b - a);
  let inversions = 0;
  for (let i = 1; i < order.length; i++) if (order[i] > order[i-1] + 1e-9) inversions++;
  return {
    yawDeg: +(CAMERA.yaw*180/Math.PI).toFixed(2),
    pan: { x:+CAMERA.pan.x.toFixed(3), z:+CAMERA.pan.z.toFixed(3) },
    click: { samples, mismatch, rim, hard, offScreen, bad },
    painter: { items: order.length, inversions },
    /* 4. OCCLUSION — the measurement the picture cannot give you.
       For every unit, take the pixel its FEET land on and ask the terrain which
       slab top is drawn there (nearest containing face, i.e. the one the sweep
       painted last). If that slab is a DIFFERENT tile, is NEARER in camera depth
       than the unit's own sort key, and stands HIGHER than the ground the unit
       is standing on, then the honest picture has terrain in front of the unit
       at that pixel and the unit must be masked there. `occluded` counts those;
       `leaks` counts the ones the clip failed to catch, which is the bug this
       whole block exists to remove and is 100% of `occluded` without it. */
    occlusion: occlusionAudit(faces, inPoly),
    /* skirtPainted sits next to bakeMs because it is the number bakeMs is made
       of: the field is a constant 168 tiles, so every ms of growth in the bake
       is a skirt cell. Reading them apart is how the pan×yaw cliff was found
       and how a return of it would be caught. */
    terrain: { registered: TERR.key === terrainKey(), bakeMs: +TERR.ms.toFixed(2),
               skirtPainted: SKIRT_STAT.painted, skirtAsked: SKIRT_STAT.asked,
               skirtAreaKpx: +SKIRT_STAT.areaKpx.toFixed(1), skirtMaxR: +SKIRT_STAT.maxR.toFixed(1),
               skirtBudget: SKIRT_STAT.budget, skirtLod: SKIRT_STAT.lod,
               skirtCull: { quad:SKIRT_STAT.cullQuad, screen:SKIRT_STAT.cullScreen, lod:SKIRT_STAT.cullLod } },
    cols: MAP.cols, rows: MAP.rows
  };
}

/* The audit behind camCheck().occlusion. Kept beside camCheck rather than in
   the capture script for the same globals-trap reason the rest of the probe is
   (CLAUDE.md): MAP, gw(), project() and OCCL are lexical consts and an outside
   driver cannot see any of them.
   It rebuilds the occluder set from scratch so it audits the RULE, not a stale
   list left over from whichever frame ran last. */
/* Screen pixel → the world point where its ray meets an ARBITRARY plane
   n·p = c. Same ray construction as pickTile(), on purpose: an audit that
   built its own projector would be grading its own copy.
   ⚠ It has to take a plane and not just a height. The audit's whole job is the
   pixels where a near slab hides a unit, and those are overwhelmingly CLIFF
   FACE pixels — vertical. Meeting them with a horizontal plane at the tile's
   elevation answers with a point metres away along the ray, if it answers at
   all. Each slab piece carries its own plane in `.pl` (see slabPieces). */
function rayToPlaneN(px, py, pl){
  const ndx = (px - VIEW.cx) / VIEW.scale;
  const ndy = -(py - VIEW.cy) / VIEW.scale;
  const dir = norm({
    x: CAM.f.x + CAM.r.x*ndx + CAM.u.x*ndy,
    y: CAM.f.y + CAM.r.y*ndx + CAM.u.y*ndy,
    z: CAM.f.z + CAM.r.z*ndx + CAM.u.z*ndy
  });
  const den = pl.x*dir.x + pl.y*dir.y + pl.z*dir.z;
  if (Math.abs(den) < 1e-9) return null;
  const t = (pl.c - (pl.x*CAM.pos.x + pl.y*CAM.pos.y + pl.z*CAM.pos.z)) / den;
  if (t <= 0) return null;
  return { x: CAM.pos.x + dir.x*t, y: CAM.pos.y + dir.y*t, z: CAM.pos.z + dir.z*t };
}
/* the horizontal case, kept under its old name and signature — pickTile's
   elevation sweep and the outside probes both call it. */
function rayToPlane(px, py, h){
  return rayToPlaneN(px, py, { x:0, y:1, z:0, c:h });
}

function occlusionAudit(faces, inPoly){
  buildOccluders();
  /* Sampled over the unit's whole SCREEN BOX, not just the one pixel under its
     feet: the critic's sentence names the feet, but a billboard that punches
     through a cliff does it up its whole silhouette.

     ⚠ THE TEST DOES NOT ASK THE SORT KEY WHETHER THE SORT KEY IS RIGHT. It

     the same pixel, modelled as a VERTICAL object standing on its tile — depth

                    terrain drawn there is nearer than the FOOT POINT itself,
                    the picture is lying, full stop. This one must be zero.
       · `body`   — the rest of the silhouette, against the vertical-figure

     are overwhelmingly wall pixels, so the entire population this audit exists
     to measure sat outside it. `surf` below adds every slab's front-facing

  const surf = faces.slice();
  for (let z = 0; z < MAP.rows; z++) for (let x = 0; x < MAP.cols; x++){

       TILE the sweep painted last, exactly as the top-face test does. */
    const dT = camDepth(gw(x, z, e));

    const dKey = camDepth(gw(u.x, u.z, 0));            /* the renderer's key */
    /* the DRAWN anchor, hop included — frame() hands the clip this point and
       unitScreenBox measures from it, so the audit has to model the figure
       from it too or it grades a sprite nobody drew. */

       audit skip a tile six rows away and then flag the slab actually under the

         disagreement here is a bug in the clip and not in the two models. */

      let masked = false, byGnd = 0;

         FIGURE owns is the opposite failure from a leak and just as wrong — it
         is a unit disappearing into a slab it is standing in front of. Counted
         separately, and separately again when the slab responsible is further
         away than the unit is, which is the shape a head-eating hill would take
         if a taller elevation ladder ever let height out-buy a row of depth. */
      if (!shouldHide){
        if (masked){

                                                   px: [Math.round(px), Math.round(py)] });

         band, i.e. the slab is BESIDE the unit rather than in front of it */
      const band = camDepth(gw(drawn.x, drawn.z, 0)) >= dKey;

                                               behind: [drawn.x, drawn.z],
                                               px: [Math.round(px), Math.round(py)] });
      }
    }
    /* ⚠ THE GROUND RING AND THE SHADOW ARE UNDER THE SAME CLIP and were never
       sampled. They are not a billboard — they are a flat disc lying ON the
       unit's own tile top — so their depth is the honest camDepth of the world
       point itself, no card model in it at all. A third of the over-masking an
       independent pixel-diff found at these poses was ring, and every one of
       those samples was outside this audit. 3 radii x 12 spokes, inside the
       tile's INRADIUS so the disc cannot spill onto a neighbour and grade a
       tile it does not belong to. */
    for (let ri = 1; ri <= 3; ri++) for (let ai = 0; ai < 12; ai++){
      const rad = tileR() * (0.3 * ri), th = ai * Math.PI / 6;

         drawUnit's shadowEllipse(base, …) — so these samples stay at fe. */

      if (drawn.pl.y === 0) out.wallSamples++;
      if (drawn.x === own.x && drawn.z === own.z) continue;
      const wp = rayToPlaneN(px, py, drawn.pl); if (!wp) continue;
      const shouldHide = camDepth(wp) < camDepth(wpt) - 1e-4;
      let masked = false, byGnd = 0;
      if (mask) for (const m of mask){
        let hit = false;
        for (const pc of m.cut) if (inPoly(pc, px, py)) { hit = true; break; }
        if (!hit) continue;
        masked = true; byGnd = m.o.dGnd; break;
      }
      if (!shouldHide){
        if (masked){
          out.overMask++; out.overMaskRing++;
          if (byGnd > dKey + 1e-4) out.behind++;
          if (out.over.length < 8) out.over.push({ unit: u.id, at: [u.gx, u.gz], ring: true,
                                                   px: [Math.round(px), Math.round(py)] });

                                               behind: [drawn.x, drawn.z],

/* ⌨ LOCAL KEYS — the STANDALONE preview only.

   receives no mousedown (CONTRACT §1.4). The game forwards keys instead, as

const WASH = { every: 400, lastPost: 0, sent: 0 };

  if (now - WASH.lastPost < WASH.every) return false;
  WASH.lastPost = now; WASH.sent++;
  post('wash', { canvas: 'stage', washPct: w.washPct, whitePct: w.whitePct, avgLuma: w.avgLuma, avgAlpha: w.avgAlpha, at: w.t });

setInterval(() => { try { washTick(); } catch (e) {} }, WASH.every);

function applyDefs(defs){
  if (!defs) return;
  __bbCount('applyDefs');
  for (const k in defs){
    const d = defs[k]; if (!d) continue;
    /* ⚠ MUTATE IN PLACE. spawnUnit stores `u.def = UNIT_DEFS[key]` by
       REFERENCE, so replacing the object here left every already-spawned unit
       pointing at the old procedural def — which is exactly why real sprites
       didn't take effect until a respawn. */
    const cur = UNIT_DEFS[k] || (UNIT_DEFS[k] = {});
    /* 🎞 drop the held frame when the ART ITSELF changes — see the note in
       paintSprite. The hold exists to cover a decode gap in ONE animation; it
       must not survive a def swap, or a Kalon that transforms mid-match keeps
       painting the base creature's last pose until its new frames decode. */
    try {
      const sigOld = (cur.frames && cur.frames.length ? cur.frames.join(',') : '') + '~' + (cur.art || '');
      const sigNew = (Array.isArray(d.frames) && d.frames.length ? d.frames.join(',') : '') + '~' + (d.art || '');
      /* _lastFrameSrc goes with it — it is the edge-contour cache key for the
         frame _lastFrame holds, so a stale key would name the OLD creature's
         frame and spriteEdgeCanvas would serve that creature's contour. */
      if (sigOld !== sigNew){ cur._lastFrame = null; cur._lastFrameSrc = null; cur._vbox = null; cur._vboxAll = false; }
    } catch (e) { cur._lastFrame = null; cur._lastFrameSrc = null; cur._vbox = null; cur._vboxAll = false; }
    Object.assign(cur, {
      name: d.name || k,
      color: d.color || '#cfd6e4',
      h: (typeof d.h === 'number' && d.h > 0) ? d.h : 1.05,
      /* 📐 exactly normal | large | huge (SIZE_CLASS); anything else is normal.
         Never derived here from the art — that is the host's metadata call. */
      size: (typeof d.size === 'string' && SIZE_CLASS[d.size]) ? d.size : 'normal',
      art: (typeof d.art === 'string' && d.art) ? d.art : null,
      sheet: d.sheet || null,
      frames: Array.isArray(d.frames) ? d.frames : null,
      fps: d.fps || 10,
      _phase: cur._phase || ((k.length * 0.137) % 1)
    });

       of one procedural flash while the images decode */
    if (Array.isArray(d.frames)) for (const f of d.frames) artImage(f);
    if (typeof d.art === 'string') artImage(d.art);
    if (cur.art || cur.frames || (cur.sheet && cur.sheet.src)) delete cur._proc;   // real art wins

}
/* Replace the whole unit set from a match snapshot. Units already on the
   board with the same id are MOVED rather than re-spawned, so a snapshot
   refresh never restarts an animation mid-flight. */
/* 🏷 The nameplate half of a `board:units` entry. Kept OUT of the unit
   literal in spawnUnit because it is optional: an older host — or the
   board's own standalone demo — sends no name and no hp, and a plate is
   simply not drawn for that unit rather than one reading "undefined 0/1".
   `hero` widens the plate's authority, not its size: a hero plate stays
   visible at any distance, a grunt's fades with depth. */
function applyPlate(u, msg){
  if (!u || !msg) return;
  /* 💫 the unit's statuses, as Status Atlas names (host: _bbStatusSlugs). An
     old host sends none, which is simply "no status VFX". */
  u.st = Array.isArray(msg.st) ? msg.st.filter(x => typeof x === 'string' && /^[a-z0-9-]+$/.test(x)).slice(0, 3) : [];
  if (typeof msg.name === 'string' && msg.name) u.uname = msg.name;
  if (msg.hpMax != null){
    const mx = Math.max(1, msg.hpMax | 0);
    const hp = Math.max(0, Math.min(mx, msg.hp | 0));
    /* animate the bar toward the new value so a hit READS as a hit; seeded
       to the first value so a unit does not drain in from full on arrival */
    if (u.hpMax == null) u.hpShown = hp / mx;
    u.hpMax = mx; u.hpCur = hp;
  }
  if (msg.hero != null) u.hero = !!msg.hero;
}
function applyUnits(list){
  if (!Array.isArray(list)) return;
  const seen = new Set();
  /* 🚚 MOVES ARE DEFERRED AND ORDERED, NOT APPLIED IN LIST ORDER.
     A vortex or shockwave moves several units in ONE snapshot. moveUnit()
     refuses a destination that unitAt() says is occupied — and mid-batch it is
     occupied, by a unit further down this same list that has not been synced
     yet. The unit got deny()'d: a red refusal ring and a sprite left on the
     tile it no longer occupies, while the game state said otherwise. It only
     survived this long because the old square-diagonal shove rarely produced
     a train of units landing on each other's tiles; the hex ray does.
     So: collect the moves, then apply any whose target is free, repeatedly.
     Whatever is left after no pass makes progress is a genuine CYCLE (a swap),
     which no ordering can resolve — those go through with `force`, because a
     correct board beats a refusal animation. */
  const pending = [];
  for (const u of list){
    if (!u || u.id == null) continue;
    seen.add(String(u.id));
    const cur = units.find(x => String(x.id) === String(u.id) && !x.dead);
    if (cur){
      applyPlate(cur, u);
      if (cur.gx !== u.x || cur.gz !== u.z) pending.push({ id: cur.id, x: u.x, z: u.z, path: u.path || null });
      /* 🜂 KALON TRANSFORM (and any other in-place identity change).
         The unit keeps its instance id but its CARD changes, so matching by id
         alone left the base form's art on the board forever. Swap the key and
         the def reference in place — no respawn, so position, facing and any
         running animation survive. */
      const nk = u.key || u.defKey;
      if (nk && cur.key !== nk){
        cur.key = nk;
        // If the new form's def hasn't landed yet, mint one the same way
        // spawnUnit does — otherwise paintSprite would find nothing for this
        // key and the unit would vanish instead of just looking generic.
        if (!UNIT_DEFS[nk]){
          let h = 0; for (let i = 0; i < String(nk).length; i++) h = (h * 31 + String(nk).charCodeAt(i)) | 0;
          const proc = PROC_KEYS[Math.abs(h) % PROC_KEYS.length];
          UNIT_DEFS[nk] = Object.assign({}, PROC_DEFS[proc], { name:String(nk), _proc:proc });
        }
        cur.def = UNIT_DEFS[nk];
        cur.flash = Math.max(cur.flash || 0, 0.9);   // a beat of white on the swap
      }
      continue;
    }
    const nu = spawnUnit(u.key || u.defKey || 'imp', u.x, u.z, u.side === 'foe' ? 'foe' : 'mine');
    if (nu && u.id != null) nu.id = String(u.id);
    if (nu) applyPlate(nu, u);
  }
  /* Drain the deferred moves (see the note above). Bounded by pending.length
     passes: every pass either places at least one unit or breaks out. */
  let guard = pending.length + 1;
  while (pending.length && guard-- > 0){
    let progressed = false;
    for (let i = pending.length - 1; i >= 0; i--){
      const p = pending[i];
      const occ = unitAt(p.x, p.z);
      if (occ && String(occ.id) !== String(p.id)) continue;   /* still blocked — retry */
      moveUnit(p.id, p.x, p.z, p.path);
      pending.splice(i, 1); progressed = true;
    }
    if (!progressed) break;
  }
  for (const p of pending) moveUnit(p.id, p.x, p.z, p.path, true);
  for (const x of units.slice()) if (!x.dead && !seen.has(String(x.id))) killUnit(x.id);
}

/* 🗺 THE ONE DOOR the host's map comes through. `board:init` and `board:map`
   both used to do a bare Object.assign(MAP, msg.map) in line, so a payload
   carrying a BAD dimension ('14', NaN, 0, -3) propagated straight into gw()
   and worldToTile(). Both return NaN for a NaN cols, project() then fails
   every test, and the whole board renders nothing at all with no error
   anywhere — exactly the silent class of failure the near clip already gives
   us. Clamped here, once.
   ⚠ Object.assign MERGES (CONTRACT §2 R18): a payload with no `cols` key at
   all does NOT fall back to BOARD_DEFAULT, it KEEPS the previous map's size,
   because there is nothing for Math.round to reject. That is deliberate — a
   `board:map` that only repaints tiles must not silently resize the board —
   but it does mean BOARD_DEFAULT is reached only at boot, or when the key is
   present and unusable. Do not read the fallback as "a dimensionless payload
   resets the board"; it does not. */
function applyMapPayload(m){
  if (!m || typeof m !== 'object') return;
  Object.assign(MAP, m);
  MAP.cols = Math.max(1, Math.round(+MAP.cols) || BOARD_DEFAULT.cols);
  MAP.rows = Math.max(1, Math.round(+MAP.rows) || BOARD_DEFAULT.rows);
}

function handleHostMessage(msg){
  if (!msg || typeof msg.type !== 'string' || msg.type.indexOf('board:') !== 0) return;
  const t = msg.type.slice(6);
  try {
    if (t === 'init'){
      __bbCount('inits');
      /* 🌗 the idle warm of the likely next preset (warmNext): 1.5 s after
         init — round 3's band-sliced staging takes ~35 tasks, one a frame,
         so at 2.5 s it was still in flight when a press came 3 s in and the
         press had to finish it; the warm declines and retries on its own
         while the camera is still moving or the ground is not up yet */
      scheduleWarm(1500);
      if (msg.safe) Object.assign(CONFIG.SAFE, msg.safe);
      if (typeof msg.mineRed === 'boolean') PLATFORMS.mineRed = msg.mineRed;
      if (msg.locations) setLocations(msg.locations, true);
      applyMapPayload(msg.map);
      buildStage();
      applyDefs(msg.defs);
      loadLocation(msg.location || MAP.location || DEFAULT_LOCATION, true);
      if (msg.timeOfDay && TIME_PRESETS[msg.timeOfDay]){
        BATTLE.timeOfDay = msg.timeOfDay;
        Object.assign(LIGHT, TIME_PRESETS[msg.timeOfDay]);
      }
      applyUnits(msg.units);
      // 🗿 Real match events — after buildStage so tile elevations exist.
      if (msg.events) setEvents(msg.events);
      resize();
      /* 🎬 THE BATTLE HAS ARRIVED. This — not document load — is the moment the
         board becomes this match's board, so it is where the opening starts and
         where the load schedule is armed. Both are cheap and neither blocks:
         revealStart() hands two animations to the compositor and returns, and
         loadBegin() only sets a counter. Measured at 0.6-0.8 ms for the whole
         init handler, unchanged by either. */
      loadBegin();
      revealStart();
    }
    else if (t === 'map'){ applyMapPayload(msg.map); buildStage(); if (msg.events) setEvents(msg.events); resize(); }
    else if (t === 'events'){ setEvents(msg.events); }
    else if (t === 'defs')      applyDefs(msg.defs);
    else if (t === 'units'){
      /* 🟥🟦 the host re-states who owns red on every roster push, so a board
         that booted before the match knew its turn order still converges */
      if (typeof msg.mineRed === 'boolean') PLATFORMS.mineRed = msg.mineRed;
      applyUnits(msg.units);
    }
    /* 🟥🟦 A unit was called from a hand. The HOST decides that — only it can
       tell a hand play from a token, a raise or a summon (see _bbStagePushUnits
       in index.html). The board never infers it from a unit appearing. */
    else if (t === 'platformGlow') platformGlow(msg.side);
    /* 🗺 LATE LOCATION REGISTRATION. `setLocation` hard-bails with "unknown
       location" when the id isn't in LOCATIONS — and the table is only built
       once, at init, from the cards that existed and had a usable image THEN.
       A location card PLAYED mid-match was therefore almost never registered,
       so the battlefield never changed. The host now sends this immediately
       before every `location` message. keepDefault=true so it MERGES rather
       than wiping the table. */
    /* 🎨 Painted tile surfaces: { "x,z": effectKey }. Whole-map replace,
       because the host already diffs and only sends on change. */
    /* 🎬 THE HOST HAS JUST MADE US VISIBLE — see the note at the `.ready` class
       in index.html. The opening that ran at init played to an opacity:0
       iframe; this is the one the player actually sees. startedAt is cleared
       so revealStart's "do not restart an opening that has barely begun" guard
       cannot swallow it — that guard exists to stop a LATE init slamming a
       lifting veil back to black, and here the veil has never been on screen
       at all. */
    /* 📏 A/B CONTROL — see the PERF block. Everything here is measurement or a
       documented `__vistaOff` switch; nothing changes what ships by default. */
    else if (t === 'perf'){
      try {
        if (msg.action === 'start'){ PERF_AB.t.length = 0; PERF_AB.on = true; }
        else if (msg.action === 'stop'){ PERF_AB.on = false; }
        else if (msg.action === 'set'){
          window.__vistaOff = window.__vistaOff || {};
          if (msg.value === null || msg.value === undefined) delete window.__vistaOff[msg.key];
          else window.__vistaOff[msg.key] = msg.value;

        else if (msg.action === 'report'){
          post('perfReport', { report: perfReport(), off: Object.assign({}, window.__vistaOff || {}) });

    }
    else if (t === 'reveal'){ try { REVEAL.startedAt = 0; revealStart(); } catch (e) {} }
    else if (t === 'facedown') FACEDOWN = Array.isArray(msg.list) ? msg.list : [];
    else if (t === 'surfaces') SURFACES = (msg.tiles && typeof msg.tiles === 'object') ? msg.tiles : {};
    else if (t === 'locations') setLocations(msg.locations || {}, true);
    else if (t === 'location')  setLocation(msg.id, !!msg.instant);
    else if (t === 'timeOfDay') setTimeOfDay(msg.key);
    else if (t === 'spawn'){ const u = spawnUnit(msg.key, msg.x, msg.z, msg.side === 'foe' ? 'foe' : 'mine'); if (u && msg.id != null) u.id = String(msg.id); }
    else if (t === 'summon')    summonUnit(msg.key, msg.x, msg.z, { id:msg.id, side:msg.side, cost:msg.cost });
    else if (t === 'summonFx')  summonFx(msg.id);
    else if (t === 'summonHold') summonHold(msg.id, msg.hold);
    /* 🪦 Tombstones. The game owns their whole lifecycle (decay, revive
       timers, loot state); the board just renders the markers it is given. */
    else if (t === 'tombs'){

      for (const tb of (msg.list || [])) if (tb) TOMBS.push(tb);
      for (const tb of TOMBS) if (tb.img) artImage(tb.img);   // warm the texture
    }
    /* 🏚 Lootable ruins. Whole-list replace, exactly like tombs — the host
       already JSON-diffs and only posts on change. No texture to warm: the
       art is procedural (see drawStruct for why it has to be). */
    else if (t === 'structs'){

      for (const sc of (msg.list || [])) if (sc) STRUCTS.push(sc);
    }
    /* 🚚 SCP control-point trucks. Whole-list replace, same as tombs and ruins
       — the host JSON-diffs and only posts on change, so this arriving at all
       means something about who holds what actually moved. `side` and `streak`
       come down with it because the board owns no rules and cannot work out
       either for itself. No texture to warm: the trucks are procedural. */
    else if (t === 'cps'){
