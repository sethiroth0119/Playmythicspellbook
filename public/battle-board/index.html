<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythic Spellbook — Battle Board (Stage Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=EB+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   MYTHIC SPELLBOOK — BATTLE BOARD / STAGE PROTOTYPE
   Single file, no libraries, no external art. Procedural everything.

  ╔═════════════════════════════════════════════════════════════════════════╗
  ║  PORT BRIEF FOR CLAUDE CODE — THREE.JS + WEBGPU                          ║
  ║                                                                            ║
  ║  This file is the ART + BEHAVIOUR TARGET, not the shipping renderer.       ║
  ║  It is written with a hand-rolled perspective projector so the camera,     ║
  ║  lighting, sprite motion and summon choreography can be tuned and seen     ║
  ║  today. Port it to Three.js with the WebGPURenderer, keeping every         ║
  ║  number below — they are the look.                                         ║
  ║                                                                            ║
  ║  1) CAMERA — match exactly. See CONFIG.camera.                            ║
  ║       PerspectiveCamera(fov 38°, near .1, far 200)                        ║
  ║       fov 39.5° · position (0, 9.04, 9.76) · lookAt (0, 0.30, 0.20)       ║
  ║       ≈ 41° downward pitch — the low hero angle from the reference.       ║
  ║       Board is 8 wide × 7 deep, tiles of 1 world unit. NOT ortho.        ║
  ║       Keep the projection centre biased to SAFE.centre (below) so the      ║
  ║       stage sits in the gap between the UI panels.                        ║
  ║                                                                            ║
  ║  2) RENDERER — WebGPU first, WebGL2 fallback:                             ║
  ║       new THREE.WebGPURenderer({ antialias:true })                        ║
  ║       renderer.setPixelRatio(min(devicePixelRatio, 2))                    ║
  ║       ACESFilmic tone mapping, exposure 1.05, sRGB output.                ║
  ║       Post chain: bloom (strength .55, radius .4, threshold .82) →        ║
  ║       subtle vignette → film grain 0.015. The glow on runes, braziers     ║
  ║       and summons is expected to come from bloom, not from the sprites.   ║
  ║                                                                            ║
  ║  3) SPRITES — "crisp" is the requirement. Rules:                          ║
  ║       • Units are camera-facing billboards on a PlaneGeometry, NOT        ║
  ║         full 3D meshes. Use THREE.Sprite or a Y-billboarded plane so      ║
  ║         they never lean with the camera.                                  ║
  ║       • Texture filter: magFilter = NearestFilter (or LinearMipmap +      ║
  ║         anisotropy 8 for painted art). NO blur on the silhouette.         ║
  ║       • alphaTest 0.5 so edges stay hard and they cast crisp shadows.     ║
  ║       • Sprite sheets: 8-frame idle, 8-frame walk, 6-frame attack,        ║
  ║         6-frame hurt, 10-frame death, driven at 12fps by UV offset in     ║
  ║         a custom material — NOT by swapping textures per frame.           ║
  ║       • Movement is tile-to-tile with the exact easing in moveUnit():     ║
  ║         cubic ease-in-out over 340ms + a 0.28-unit hop arc + squash on    ║
  ║         take-off and land + dust burst on landing. Snap to tile centre    ║
  ║         at the end — never leave a unit off-grid.                         ║
  ║       • Position rounding: snap final screen position to whole device     ║
  ║         pixels to stop shimmer on slow drifts.                            ║
  ║                                                                            ║
  ║  4) SUMMON — the Yu-Gi-Oh beat, sequenced in summonSequence():            ║
  ║       t0     card lifts out of the hand, tilts to face the camera, glow   ║
  ║       160ms  card flies along a bezier to the target tile, rotating flat  ║
  ║       520ms  card lands face-down, tile rune circle ignites               ║
  ║       640ms  card FLIPS face-up (rotateY 180°) — the reveal               ║
  ║       780ms  white flash + shockwave ring + pillar of light from the tile ║
  ║       820ms  UNIT RISES out of the tile (y −1.1 → 0) over 420ms with a    ║
  ║              back-ease, scaling 0.7 → 1.0                                 ║
  ║       900ms  CARD DISSOLVES into embers and is destroyed. The card must   ║
  ║              never return — the sprite is now the unit of record.         ║
  ║       1350ms landing thump, dust ring, unit enters idle loop              ║
  ║       In Three.js the flying card is a textured plane in the same scene   ║
  ║       (so it lights correctly), not a DOM element.                        ║
  ║                                                                            ║
  ║  5) DYNAMIC LIGHT — the sun/moon MUST match the battle's time of day.     ║
  ║       BATTLE.timeOfDay is the source of truth and comes from the match    ║
  ║       state (the Weather card: Daytime / Dusk / Night / Dawn). Each       ║
  ║       preset in TIME_PRESETS gives azimuth, elevation, colour, intensity, ║
  ║       ambient, sky gradient and fog. Build them as:                       ║
  ║         DirectionalLight (sun or moon)  — castShadow, PCFSoft, 2048 map,  ║
  ║           shadow camera fitted to the board bounds                        ║
  ║         HemisphereLight  (sky → ground bounce)                            ║
  ║         AmbientLight     (preset.ambient)                                 ║
  ║         + rim light opposite the key, tinted by preset.rim                ║
  ║       Shadows: unit shadow direction and length are derived from the      ║
  ║       light vector (see lightVector()) — at dusk they stretch long        ║
  ║       across the tiles, at noon they pool underfoot. Braziers add         ║
  ║       PointLights (flicker 8Hz, radius 4) that survive at night when      ║
  ║       the sun preset dims out.                                            ║
  ║       When the weather card flips mid-match, LERP between presets over    ║
  ║       ~2.5s — never cut.                                                  ║
  ║                                                                            ║
  ║  6) BATTLEMAP EDITOR — THIS map object is the format. Point the editor    ║
  ║     at it and let it read/write the same JSON:                            ║
  ║         MAP = { id, name, cols, rows, timeOfDay, ground,                  ║
  ║                 tiles:[{x,z,type,prop,elev,rot}], spawns:{mine,foe} }     ║
  ║       tile.type : 'normal' | 'blocked' | 'hazard' | 'objective' | 'spawn' ║
  ║       tile.prop : null | 'house' | 'wreck' | 'crater' | 'barricade'       ║
  ║                   | 'pylon' | 'bones'                                     ║
  ║       tile.elev : world units of raise (0, .18, .36 …) — the renderer     ║
  ║                   already offsets geometry, shadows and unit feet by it.  ║
  ║       Editing a tile should hot-reload the stage with no page refresh —   ║
  ║       call buildStage() again, which is pure from MAP.                    ║
  ║       Props are billboards too; swap them for GLTF instances if you       ║
  ║       want parallax, but keep the same anchor + footprint.                ║
  ║                                                                            ║
  ║  7) UI SAFE AREAS — NO UI IS DRAWN HERE ON PURPOSE. The stage is inset    ║
  ║     to leave the gutters the existing battle HUD needs (matching the      ║
  ║     live screenshot):  left 384 · right 244 · top 78 · bottom 292 (css    ║
  ║     px at 1440p, scaled proportionally). SAFE in CONFIG. Mount the        ║
  ║     existing HUD as transparent DOM over this canvas — do not rebuild     ║
  ║     it, and do not let the stage grow into those gutters.                 ║
  ║     Press G to toggle the guide overlay while developing.                 ║
  ║                                                                            ║
  ║  8) KEEP THESE FUNCTIONS — port them 1:1, they are the game board API:    ║
  ║       buildStage()            rebuild everything from MAP                 ║
  ║       tileAt(x,z) / tileKey   grid lookup                                 ║
  ║       spawnUnit(def,x,z,side) place a unit instantly                      ║
  ║       summonUnit(cardId,x,z)  the full card→sprite ceremony               ║
  ║       moveUnit(id,x,z)        crisp tween with hop + dust                 ║
  ║       attackUnit(id,tid)      lunge, impact flash, damage float           ║
  ║       killUnit(id)            death dissolve → grave                      ║
  ║       setTimeOfDay(key)       lerp the whole lighting rig                 ║
  ║       focusTile(x,z) / clearFocus()                                       ║
  ║       Board.on('tileClick'|'unitClick'|'cardPlayed'|'summonComplete')     ║
  ║     These already dispatch CustomEvents — replace the demo bodies, keep   ║
  ║     the signatures so the HUD wiring never changes.                       ║
  ╚═════════════════════════════════════════════════════════════════════════╝ */
:root{ --gold:#d2a44e; --gold-hi:#f6dc95; }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:100%; height:100%; overflow:hidden; background:#05040a; }
body{ font-family:"EB Garamond",serif; color:#e9dab2; user-select:none; }
/* NOTE: <canvas> is a REPLACED element — `inset:0` alone does NOT stretch it
   (it falls back to the intrinsic 300x150). Always size it explicitly. */
#stage{ position:fixed; top:0; left:0; width:100vw; height:100vh; display:block;
        /* THE OPENING (see THE REVEAL) scales this element. transform-origin is
           the camera's optical centre, NOT 50% 50% — CONFIG.viewShiftY lifts the
           projection, so pulling back about the box centre slides the horizon.
           `will-change` is what promotes the canvas to its own compositor layer,
           which is the entire reason the opening survives a blocked main thread. */
        transform-origin:50% 46%; will-change:transform; }

/* ══════════════════════════════════════════════════════════════════════════
   THE VEIL — the darkness the board is revealed out of.
   Opacity only, on its own layer, so it animates on the COMPOSITOR. It must
   never take a pointer event: input is live from the first frame and the
   opening is not allowed to stand in front of it. */
#veil{ position:fixed; inset:0; z-index:9; pointer-events:none; opacity:0;
       will-change:opacity; contain:strict;
       background:radial-gradient(118% 88% at 50% 46%,
         rgba(3,2,7,.72) 0%, rgba(2,1,5,.94) 44%, #010104 76%); }

/* summon card — DOM overlay in the prototype; becomes a textured plane in Three.js */
.flycard{
  position:fixed; z-index:6; width:186px; height:260px; border-radius:10px;
  transform-style:preserve-3d; pointer-events:none; will-change:transform,opacity;
  transition:none;
}
.flycard .face, .flycard .back{
  position:absolute; inset:0; border-radius:7px; backface-visibility:hidden; overflow:hidden;
  border:2px solid rgba(246,220,149,.85);
  box-shadow:0 10px 26px rgba(0,0,0,.8), 0 0 26px rgba(246,220,149,.4);
}
.flycard .back{
  transform:rotateY(180deg);
  background:radial-gradient(60% 45% at 50% 45%, rgba(140,70,220,.5), transparent 70%), linear-gradient(160deg,#1b1430,#0a0714);
  display:grid; place-items:center; color:rgba(246,220,149,.75); font-size:58px;
}
.flycard .face{ display:flex; flex-direction:column; }
.flycard .art{ flex:1; display:grid; place-items:center; }
.flycard .nm{
  padding:8px 5px; text-align:center; font-family:"Cinzel",serif; font-weight:700; font-size:15px;
  letter-spacing:.04em; color:#f6dc95; background:linear-gradient(180deg, rgba(12,9,18,.9), rgba(6,4,10,.95));
  border-top:1px solid rgba(246,220,149,.4);
}

/* hand — placeholder cards so the summon can be demoed. The REAL hand is part of
   the existing HUD; Claude Code replaces this strip with it. */
.hand{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  display:flex; gap:15px; z-index:5; pointer-events:auto;
}
.hcard{
  width:186px; height:260px; border-radius:10px; position:relative; cursor:pointer;
  border:2px solid rgba(210,164,78,.6); overflow:hidden;
  background:linear-gradient(170deg,#161024,#08050e);
  box-shadow:0 10px 22px rgba(0,0,0,.75);
  transition:transform .22s cubic-bezier(.2,.9,.3,1.3), box-shadow .22s, border-color .22s;
}
.hcard:hover{ transform:translateY(-20px) scale(1.05); border-color:rgba(246,220,149,.9); box-shadow:0 18px 34px rgba(0,0,0,.8), 0 0 26px rgba(246,220,149,.35); }
.hcard.armed{ transform:translateY(-26px) scale(1.07); border-color:#f6dc95; box-shadow:0 0 0 2px rgba(246,220,149,.5), 0 0 34px rgba(246,220,149,.55); }
.hcard .cost{
  position:absolute; top:9px; left:9px; z-index:2; width:44px; height:44px; border-radius:50%;
  display:grid; place-items:center; font-family:"Cinzel",serif; font-weight:900; font-size:21px;
  color:#f6ecd2; border:1.5px solid rgba(246,220,149,.8); background:rgba(8,6,14,.9);
}
.hcard .art{ position:absolute; inset:0; display:grid; place-items:center; }
.hcard .nm{
  position:absolute; left:0; right:0; bottom:0; padding:8px 4px; text-align:center;
  font-family:"Cinzel",serif; font-weight:700; font-size:15px; color:#f6dc95;
  background:linear-gradient(180deg, rgba(10,8,16,.5), rgba(6,4,10,.96));
}
.hcard .el{
  position:absolute; left:0; right:0; bottom:34px; text-align:center;
  font-family:"Cinzel",serif; font-weight:700; font-size:12px; letter-spacing:.16em;
}

.hint{
  position:fixed; left:50%; bottom:296px; transform:translateX(-50%); z-index:7;
  font-size:12.5px; font-style:italic; color:#6e6350; white-space:nowrap;
  animation:hintFade 7s ease forwards; pointer-events:none;
}
@keyframes hintFade{ 0%,70%{ opacity:1; } 100%{ opacity:0; } }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<!-- the darkness the opening pulls out of — see THE REVEAL -->
<div id="veil" aria-hidden="true"></div>
<!-- The demo hand + hint are STANDALONE ONLY. Embedded, the real hand is
     the game's own HUD mounted as transparent DOM over this canvas. -->
<div class="hand" id="hand"></div>
<div class="hint" id="hint">click a card, then a tile — or click a unit and a tile to move it</div>


<script>window.BB_BUILD='v120x6';
"use strict";
/* 🔌 BBX — THE STAGE HOOK SEAM.
   The board page is a classic (non-module) script, so it cannot `import`.
   Optional ES modules under /src/battle/stage/*.js attach themselves here and
   this file calls them defensively, once per frame, ALWAYS with a working
   fallback behind them. Module scripts are deferred, so for the first frame or
   two none of these exist — every call site must be optional-chained. A missing
   module must degrade, never throw: `frame()` is wrapped in a one-shot crash
   guard (frameErr) and a thrown hook would freeze the board on a red error card.
     window.BBX.vista    = { draw(api), grade(api) }
     window.BBX.tilefx   = { drawStates(api), drawSurfaces(api), drawStatesOver(api) }
     window.BBX.dressing = { build(api), items(api) }
     window.BBX.terrain  = { detail(api, g, tile) }   ← baked, see bakeTerrain()
   `api` is rebuilt every frame by buildApi(). Do NOT rename any of its keys:
   three sibling modules are written against it verbatim. */
window.BBX = window.BBX || {};
/* ══════════════════════════════════════════════════════════════════
   CONFIG — camera + UI safe areas. Port these numbers verbatim.
   ══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  camera:{ fov:39.5*Math.PI/180, pos:{x:0,y:9.04,z:9.76}, target:{x:0,y:0.30,z:0.20} },
  /* The arena (board + its four pillars) is taller above the floor than below
     it, so it does not sit centred in the safe box on its own. This nudges the
     whole projection so the scene is optically centred, which is what lets the
     FOV be tightened without the pillar tops clipping. */
  viewShiftY: -40,
  /* gutters reserved for the EXISTING battle HUD (added by Claude Code) */
  SAFE:{ left:384, right:244, top:78, bottom:292 },
  tile:1.0, wall:0.30
};

/* ══════════════════════════════════════════════════════════════════
   MAP — THE BATTLEMAP EDITOR OWNS THIS OBJECT. Read/write as JSON.
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   LOCATIONS — a LOCATION CARD swaps the board art (and optionally the
   time of day). Register every location here; the editor and the card
   database both read this table.
     image     : ground texture, laid flat on the play plane in perspective
     backdrop  : the environment BEHIND the board — the world this location
                 sits in. Drawn behind the arena and graded by the sky, so a
                 location card changes the whole horizon, not just the floor.
     horizon   : 0..1 down the BACKDROP art, where its ground line sits. That
                 line is anchored to the board's far edge, so getting it wrong
                 slides the whole world up or down. Defaults to 0.62.
     timeOfDay : null keeps the current sky, or force 'dawn|day|dusk|night'
     tint      : optional extra colour grade over the ground
   Play one with:  Board.setLocation('dark-forest')
   ══════════════════════════════════════════════════════════════════ */
const LOCATIONS = {
  'dark-forest':{ name:'The Dark Forest', image:'../assets/board/locations/dark-forest-ground.jpg', backdrop:'../assets/board/locations/dark-forest-backdrop.jpg', timeOfDay:null, tint:null },
  /* Register the rest as their art lands — same shape:
  'open-field'   :{ name:'Open Field',    image:'assets/loc/open-field.jpg',
                    backdrop:'assets/loc/open-field-bg.jpg',    timeOfDay:'day'   },
  'infected-city':{ name:'Infected City', image:'assets/loc/infected-city.jpg',timeOfDay:'dusk'  },
  'crystal-caves':{ name:'Crystal Caves', image:'assets/loc/crystal-caves.jpg',timeOfDay:'night' },
  */
};
const DEFAULT_LOCATION = 'dark-forest';
/* The HOST registers every playable location (from the card database /
   Battlemap Editor) with Board.setLocations({...}). Same shape as above. */
function setLocations(table, keepDefault){
  if (!table || typeof table !== 'object') return;
  if (!keepDefault) for (const k in LOCATIONS) if (k !== DEFAULT_LOCATION) delete LOCATIONS[k];
  for (const k in table){
    const L = table[k]; if (!L) continue;
    LOCATIONS[k] = { name:L.name || k, image:L.image || null, backdrop:L.backdrop || null,
                     timeOfDay:L.timeOfDay || null, tint:L.tint || null,
                     /* 0..1 down the BACKDROP art, where its ground line is.
                        Anchored to the board's far edge — see syncBackdropPlates. */
                     horizon:(typeof L.horizon === 'number') ? L.horizon : 0.62 };
  }
}

const MAP = {
  id:'ruins-downtown-01', name:'Overgrown Downtown', cols:8, rows:7,
  timeOfDay:'day',
  location: DEFAULT_LOCATION,
  ground:{ base:'#2a2418', accent:'#4a3f24' },
  tiles:[
    { x:6, z:1, prop:'barricade' },
    { x:7, z:2, prop:'pylon', elev:0.18 },
    { x:0, z:3, prop:'bones' },
    { x:5, z:3, prop:'crater', type:'hazard' },
    { x:3, z:3, type:'objective' },
    { x:4, z:3, type:'objective' },
    { x:2, z:4, prop:'crater', type:'hazard' },
    { x:0, z:5, prop:'pylon', elev:0.18 },
    { x:6, z:6, prop:'bones' }
  ],
  /* live board events — the game's EVENT SYSTEM owns this list. EMPTY by design:
     the host pushes the match's real events via board:init / board:events. It used
     to hold three hardcoded demos, which is why the stage showed events that were
     not in the game. */
  events:[],
  spawns:{ mine:[[2,6],[3,6],[4,6],[5,6]], foe:[[2,0],[3,0],[4,0],[5,0]] }
};

/* ══════════════════════════════════════════════════════════════════
   TIME OF DAY — sun/moon presets. BATTLE.timeOfDay drives the rig.
   ══════════════════════════════════════════════════════════════════ */
const TIME_PRESETS = {
  dawn:{ az:-0.85, elev:0.20, key:'#ffb46a', keyI:0.95, ambient:'#3a3350', ambI:0.42,
         sky:['#1a1230','#4a2c3a','#8a5a44'], fog:'#2a1c2a', rim:'#7fa8ff', body:'sun', disc:'#ffd9a0', haze:.34 },
  day:{ az: 0.28, elev: 0.78, key:'#fff2c8', keyI:1.15, ambient:'#5a6480', ambI:0.55,
         sky:['#18243c','#31465f','#6b7f92'], fog:'#3a4454', rim:'#cfe4ff', body:'sun', disc:'#fff6d8', haze:.22 },
  dusk:{ az: 0.92, elev: 0.16, key:'#ff7a3c', keyI:1.0, ambient:'#43305a', ambI:0.44,
         sky:['#160f2c','#4a2038','#a04628'], fog:'#2c1a2c', rim:'#a06cff', body:'sun', disc:'#ff9a52', haze:.4 },
  night:{ az:-0.42, elev: 0.62, key:'#7fa6e8', keyI:0.48, ambient:'#0e1730', ambI:0.26,
         sky:['#01030b','#050b1c','#0b1530'], fog:'#050a18', rim:'#6f9ce8', body:'moon', disc:'#cfe0ff', haze:.14 }
};
const BATTLE = { timeOfDay: MAP.timeOfDay };

/* ══════════════════════════════════════════════════════════════════
   UNIT DEFS — procedural stand-ins. Swap `draw` for sprite-sheet UVs.
   data-art-slot equivalent: def.sheet = '<path to sprite sheet>'
   ══════════════════════════════════════════════════════════════════ */
/* UNIT REGISTRY — the HOST fills this. Each entry:
     { name, color, h (world-units tall), art (image URL, optional),
       sheet:{src, frames, fps, rows:{idle,walk,attack,hurt,death}} }
   `art` alone is enough: a single still is billboarded and animated by
   the procedural bob/squash. A `sheet` adds real frame animation.
   Anything with no art falls back to the procedural painter below, so a
   missing texture never leaves a hole on the board. */
const UNIT_DEFS = Object.create(null);
const PROC_KEYS = ['wyrm','imp','knight','mage','crystal','bunny','jelly'];
const PROC_DEFS = {
  wyrm:{ name:'Wyrm', color:'#7fb4ff', h:1.30 },
  imp:{ name:'Imp', color:'#8fd84a', h:0.92 },
  knight:{ name:'Knight', color:'#cfd6e4', h:1.16 },
  mage:{ name:'Mage', color:'#ff8a3c', h:1.06 },
  crystal:{ name:'Crystal', color:'#5fe8d5', h:1.12 },
  bunny:{ name:'Bunny', color:'#c8a8ff', h:0.98 },
  jelly:{ name:'Jelly', color:'#4ad8c8', h:0.86 }
};
Object.assign(UNIT_DEFS, PROC_DEFS);
/* image cache for host-supplied art / sheets */
const ART_CACHE = Object.create(null);
function artImage(src){
  if (!src) return null;
  let rec = ART_CACHE[src];
  if (!rec){
    rec = ART_CACHE[src] = { img:new Image(), ok:false };
    rec.img.onload = () => { rec.ok = true; };
    rec.img.onerror = () => { rec.ok = false; rec.bad = true; };
    if (!/^data:/.test(src)) rec.img.crossOrigin = 'anonymous';
    rec.img.src = src;
  }
  return rec.ok ? rec.img : null;
}

/* ══════════════════════════════════════════════════════════════════
   🖌 SPRITE FILTERING — decided by WHAT THE ART IS, not by which way it
   is being scaled. Read this before touching imageSmoothingEnabled below.
   ══════════════════════════════════════════════════════════════════
   THE RULE THAT WAS HERE, AND WHY IT WAS WRONG TWICE OVER:

       const upscaling = dw > img.width;
       c.imageSmoothingEnabled = !upscaling;   // "crisp when upscaling"

   1. `dw` IS IN CSS PIXELS AND `img.width` IS IN DEVICE PIXELS. The context
      carries the DPR transform (resize() does setTransform(DPR,…)) plus the
      unit's own scaleX/scaleY, so a sprite whose `dw` is 62 covers 124 real
      pixels at DPR 2. Measured on this page, embedded sizing, one 128px-class
      sprite (85x128 — the Atelier's small preset):
        1920x1080 @2  dw 62 vs src 85 → judged DOWNSCALE, truly 1.46x UPSCALE
        2560x1440 @2  dw 82 vs src 85 → judged DOWNSCALE, truly 1.93x UPSCALE
      So on every retina display the test reports the opposite of the truth,
      and the branch that was supposed to protect pixel art never ran — while
      pixel art got smoothed at 1.3–1.7x, which is the "my sprites went to
      mush" complaint.

       window seam: the inner loop stops one column short of each window's

    if (dw <= 0 || dh <= 0) continue;
    const sy = t0*img.naturalHeight, sh = Math.max(1, (t1-t0)*img.naturalHeight);
    ctx.drawImage(img, 0, sy, img.naturalWidth, sh, dx, dy, dw, dh);
  }
  ctx.globalAlpha = 1;
}

/* ── responsive sizing, projection centred on the SAFE box ── */
let VIEW = { cx:0, cy:0, scale:1 };
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  /* Viewport is the source of truth. clientWidth is a poor fallback here because
     a <canvas> is a REPLACED element: `inset:0` does not stretch it, so clientWidth
     can report the intrinsic 300x150 and collapse the whole stage.
     (clientWidth/clientHeight are also READ-ONLY — never assign to them.) */
  W = Math.max(1, window.innerWidth || cv.clientWidth || 1280);
  H = Math.max(1, window.innerHeight || cv.clientHeight || 720);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* Reserved UI gutters, scaled to the viewport. */
  const k = clamp(W/1920, .5, 1.15);
  const S = CONFIG.SAFE;
  let l = S.left*k, r = S.right*k, t = S.top*k, b = S.bottom*k;
  /* COLLAPSE GUARD: on a small window the gutters could exceed the viewport and
     invert the projection. Never let them eat more than 62% wide / 55% tall. */
  const maxH = W*0.62, maxV = H*0.55;
  if (l + r > maxH){ const s = maxH/(l+r); l *= s; r *= s; }
  if (t + b > maxV){ const s = maxV/(t+b); t *= s; b *= s; }
  VIEW.cx = l + (W - l - r)/2;
  VIEW.cy = t + (H - t - b)/2 + (CONFIG.viewShiftY || 0) * clamp(H/1080, .6, 1.2);
  VIEW.box = { l, r, t, b, w:Math.max(120, W-l-r), h:Math.max(90, H-t-b) };
  VIEW.scale = (VIEW.box.h/2) / Math.tan(CONFIG.camera.fov/2);
  /* the baked terrain and the cached pick polygons are in SCREEN space, so a
     viewport change invalidates both. Cleared here rather than re-baked, so a
     drag-resize costs one bake at the end instead of one per resize event. */
  if (typeof TERRAIN !== 'undefined' && TERRAIN){
    TERRAIN.key = ''; TERRAIN.poly = null;
    /* the polys are pure projection, so they can be rebuilt here for the cost
       of 56 tilePoly() calls (~0.1 ms) instead of waiting on the next bake —
       which matters now that the bake can be a scheduled frame or two away. */
    seedPickPolys();
  }
}
addEventListener('resize', resize);

/* ══════════════════════════════════════════════════════════════════
   PROJECTION — pinhole camera. (Three.js: replace with the real
   PerspectiveCamera; these are the same numbers.)
   ══════════════════════════════════════════════════════════════════ */
const sub = (a,b) => ({x:a.x-b.x, y:a.y-b.y, z:a.z-b.z});
const dot = (a,b) => a.x*b.x + a.y*b.y + a.z*b.z;
const cross = (a,b) => ({ x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x });
const norm = v => { const L = Math.hypot(v.x,v.y,v.z)||1; return {x:v.x/L, y:v.y/L, z:v.z/L}; };
let CAM = null;
function buildCam(){
  const c = CONFIG.camera;
  const f = norm(sub(c.target, c.pos));
  const r = norm(cross(f, {x:0,y:1,z:0}));
  const u = cross(r, f);
  CAM = { pos:c.pos, f, r, u };
}
function project(p){
  const d = sub(p, CAM.pos);
  const x = dot(d, CAM.r), y = dot(d, CAM.u), z = dot(d, CAM.f);
  if (z <= 0.05) return null;
  const s = VIEW.scale / z;
  return { x: VIEW.cx + x*s, y: VIEW.cy - y*s, z, s };
}
/* grid (col,row) → world. Board centred on origin. */
function gw(gx, gz, y){
  return { x:(gx - (MAP.cols-1)/2)*CONFIG.tile, y:y||0, z:(gz - (MAP.rows-1)/2)*CONFIG.tile };
}
function tileAt(x,z){ return MAP.tiles.find(t => t.x===x && t.z===z) || null; }

/* ══════════════════════════════════════════════════════════════════
   🏔 COSMETIC HEIGHTFIELD
   The game has NO elevation data. `_bbMapFromEditor()` in the host emits only
   {x,z,type,prop} and `board:init` does Object.assign(MAP,…), which replaces the
   demo tiles that used to carry elev — so every live battlefield was dead flat.
   Rather than plumb a new field through the host (out of scope: coordinates and
   every postMessage payload must stay byte-identical), the BOARD generates its
   own heightfield, deterministically from MAP.id + cols/rows.

   IT IS PURELY COSMETIC. Movement range, Chebyshev distance, blocking, pathing
   and every (x,z) key are untouched — the board still has 8×7 square tiles at
   the same grid positions. Only the y of each tile's top face changes.

   If the host EVER starts sending tile.elev we defer to it wholesale (see
   HF.fromHost) so real editor data always wins over the decoration.

   Shape: contiguous PLATEAUS, not per-tile noise — the brief is "a player must
   read at a glance which tiles are high and which are low", and salt-and-pepper
   noise reads as a broken grid, not as terrain. Built from a handful of seeded
   radial blobs with a jittered boundary, then capped per row so the near rows
   (the player's own spawn) stay low: a tall plateau in row 6 would push the
   player's units up into the hand strip and hide the foreground.
   ══════════════════════════════════════════════════════════════════ */
/* STEP HEIGHT. Measured on this camera (~41° pitch) a world-y offset of dy
   projects to dy*cos(pitch) ≈ dy*0.755 of ONE TILE'S on-screen width. Round 1
   used 0.33/0.27/0.23 steps, i.e. a one-level wall only 0.25 tile widths tall,
   and at full-frame scale every step read as a smudge rather than as a cliff.
   0.47 puts a one-level wall at ~0.355 tile widths — the smallest height at
   which the strata, the lit lip and the cast shadow are all separately legible.
   Steps stay near-uniform (0.47/0.45/0.42) because a diminishing top step made
   the level 2→3 wall a smudge again exactly where the tallest mesa is. */
const LEVEL_Y = [0, 0.47, 0.92, 1.34];
const HF = { key:'', lv:null, y:null, fromHost:false, maxLv:0 };
/* per-row ceiling — index is grid z (0 = far / foe spawn, rows-1 = near) */
function hfRowCap(z, rows){
  const fromNear = (rows - 1) - z;
  if (fromNear <= 0) return 0;   /* near row flat: the camera's foreground */
  if (fromNear === 1) return 1;
  if (fromNear === 2) return 2;
  return 3;
}
function hfStrHash(s, n){
  let h = 2166136261 ^ ((n|0) * 16777619);
  s = String(s == null ? '' : s);
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13;
  return ((h >>> 0) % 100000) / 100000;
}
function buildHeightfield(){
  const cols = MAP.cols, rows = MAP.rows;
  /* Host data wins. A single tile with a non-zero elev means the editor is
     authoring elevation for real and our decoration must get out of the way. */
  const hostElev = (MAP.tiles||[]).some(t => t && typeof t.elev === 'number' && t.elev > 0);
  const key = [MAP.id, cols, rows, hostElev?'host':'gen'].join('|');
  if (HF.key === key) return;
  HF.key = key; HF.fromHost = hostElev;
  const lv = [], yy = [];
  for (let z=0; z<rows; z++){ lv.push(new Array(cols).fill(0)); yy.push(new Array(cols).fill(0)); }

  if (hostElev){
    let mx = 0;
    for (let z=0; z<rows; z++) for (let x=0; x<cols; x++){
      const t = tileAt(x,z); const e = (t && +t.elev) || 0;
      yy[z][x] = e; lv[z][x] = e > 0 ? Math.min(3, Math.max(1, Math.round(e/0.30))) : 0;
      if (e > mx) mx = e;
    }
    HF.lv = lv; HF.y = yy; HF.maxLv = mx > 0 ? 3 : 0;
    return;
  }

  /* ── generate: 4 plateau blobs + 1 basin, seeded off MAP.id ── */
  const seedOf = n => hfStrHash(MAP.id + ':' + cols + 'x' + rows, n);
  const blobs = [];
  for (let i=0;i<4;i++){
    /* Blob 0 is PINNED to the top level and parked in the far half, and blob 1
       to the level below it. Left purely to the seed, plenty of map ids
       generated only levels 0-2 and the field lost the "three readable
       levels" read entirely — a tall mesa is the thing that sells elevation,
       so one is guaranteed. hfRowCap still keeps it out of the near rows. */
    const pinned = i === 0 ? 3 : i === 1 ? 2 : (1 + Math.floor(seedOf(i*7+4) * 2));
    blobs.push({
      cx: 0.6 + seedOf(i*7+1) * (cols - 2.2),
      cz: i === 0 ? (0.7 + seedOf(1) * 2.2)      /* far half, so the cap allows 3 */
                  : seedOf(i*7+2) * (rows - 1.6),/* biased away from the near row */
      r : (i === 0 ? 1.45 : 1.15) + seedOf(i*7+3) * 1.65,
      lv: pinned,
      w : seedOf(i*7+5) * 6.283,                 /* boundary jitter phase */
      a : 0.24 + seedOf(i*7+6) * 0.30            /* boundary jitter amount */
    });
  }
  for (let z=0; z<rows; z++){
    for (let x=0; x<cols; x++){
      let best = 0;
      for (const b of blobs){
        const dx = x - b.cx, dz = z - b.cz;
        const d = Math.hypot(dx, dz);
        /* jittered radius: a wobbly outline, so no plateau is a circle */
        const ang = Math.atan2(dz, dx);
        const rr = b.r * (1 + Math.sin(ang*2.3 + b.w)*b.a + Math.sin(ang*3.7 - b.w*1.7)*b.a*0.55);
        if (d > rr) continue;
        /* terrace inside the blob: full height in the core, one step down at
           the rim, so plateaus have a shoulder instead of a single cliff */
        const k = d / Math.max(0.001, rr);
        const l = k > 0.62 ? Math.max(1, b.lv - 1) : b.lv;
        if (l > best) best = l;
      }
      lv[z][x] = Math.min(best, hfRowCap(z, rows));
    }
  }
  /* De-speckle: a lone raised tile surrounded by lower ground reads as a glitch,
     not a plateau. Drop any tile whose 4-neighbourhood has no tile at its level. */
  for (let pass=0; pass<2; pass++){
    const snap = lv.map(r => r.slice());
    for (let z=0; z<rows; z++) for (let x=0; x<cols; x++){
      const L = snap[z][x]; if (!L) continue;
      let peers = 0;
      for (const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx = x+dx, nz = z+dz;
        if (nx<0||nz<0||nx>=cols||nz>=rows) continue;
        if (snap[nz][nx] >= L) peers++;
      }
      if (!peers) lv[z][x] = Math.max(0, L - 1);
    }
  }
  /* ⛰ OCCLUSION CLAMP — a GAMEPLAY guard first, a look choice second.
     A tile nearer the camera that is raised above the tile behind it hides
     that tile's top face, and a hidden top face cannot be clicked: pickTile
     correctly returns the tile actually drawn under the cursor, so the tile
     behind becomes partly unreachable. Only the DIRECT z+1 neighbour can
     occlude — the diagonals are a whole tile away in x and never overlap.
     Screen arithmetic: a step of dy hides dy*cos(pitch) of the tile behind,
     whose own top face is only tile*sin(pitch) ≈ 0.66 tile widths tall on
     screen, so a one-level step at the ROUND 1 height (0.33) already hid 0.38
     of it and the taller 0.47 step used here would hide 0.54 — past the
     centre, which is where the published tile centre, the hover-menu anchor
     and every player's click land.

     So round 2 goes further than round 1's "at most one level higher" and
     makes each column MONOTONIC away from the camera: a tile is never higher
     than the tile behind it. Nothing is occluded at all, every tile centre is
     visible and clickable at any step height, and the field reads as terraces
     rising away from the viewer — which is the BAR's "layered rock plateaus".
     We RAISE the far tile rather than lowering the near one, which keeps
     plateaus contiguous and keeps the near rows (the player's own spawn) low.
     Verify with the __bbDebug round-trip documented near window.Board. */
  const monotone = () => {
    for (let x=0; x<cols; x++)
      for (let z=rows-2; z>=0; z--)
        if (lv[z+1][x] > lv[z][x]) lv[z][x] = lv[z+1][x];
  };
  monotone();
  /* ── FAR CREST ────────────────────────────────────────────────────────
     The monotone pass copies each column's highest near tile straight back to
     the far edge, which made rows 0 and 1 identical: the field read as one
     profile extruded backwards, i.e. a wedding cake. Give the two far rows an
     extra step where the seed says so. It only ever RAISES, and monotone() is
     re-run afterwards, so the no-occlusion guarantee is preserved. Crests grow
     only out of ground that is already raised — a spike out of the flats is
     the salt-and-pepper read the plateau shape exists to avoid. */
  for (let z=Math.min(1, rows-1); z>=0; z--){
    const cap = hfRowCap(z, rows);
    for (let x=0; x<cols; x++){
      if (lv[z][x] === 0 || lv[z][x] >= cap) continue;
      if (hfStrHash(MAP.id + '#crest', z*31 + x) > 0.5) lv[z][x] = Math.min(cap, lv[z][x] + 1);
    }
  }
  monotone();
  let mx = 0;
  for (let z=0; z<rows; z++) for (let x=0; x<cols; x++){
    const L = lv[z][x]; if (L > mx) mx = L;
    yy[z][x] = LEVEL_Y[L] || 0;
  }
  HF.lv = lv; HF.y = yy; HF.maxLv = mx;
}
function hfLevel(x,z){
  if (!HF.lv || z<0 || x<0 || z>=HF.lv.length || x>=HF.lv[0].length) return 0;
  return HF.lv[z][x];
}
/* THE elevation accessor. Everything downstream — tilePoly, _sQuad, drawUnit's
   foot placement, drawProp, drawTomb, the published tile centres — already
   routes through this, so rewriting it here propagates elevation for free. */
function tileElev(x,z){
  if (!HF.y || z<0 || x<0 || z>=HF.y.length || x>=HF.y[0].length){
    const t = tileAt(x,z); return t && t.elev ? t.elev : 0;
  }
  return HF.y[z][x];
}
/* world position → surface height. Plateaus are stepped, so this is the height
   of the tile the point stands on — not an interpolation. Set dressing anchors
   off it for sub-tile placement. */
function elevAt(wx, wz){
  const gx = Math.round(wx/CONFIG.tile + (MAP.cols-1)/2);
  const gz = Math.round(wz/CONFIG.tile + (MAP.rows-1)/2);
  return tileElev(clamp(gx,0,MAP.cols-1), clamp(gz,0,MAP.rows-1));
}
function tileBlocked(x,z){
  const t = tileAt(x,z);
  if (t && (t.type==='blocked' || t.prop==='pylon')) return true;
  /* an event may block the tile (e.g. a standing structure) */
  return eventsAt(x,z).some(e => (EVENT_TYPES[e.type]||{}).blocks);
}

/* light direction from the preset (used for shadows + rim) */
/* ⚠ THE ARGUMENT IS OPTIONAL AND EVERY EXISTING CALLER PASSES NOTHING. It was
   added for the vista's time-of-day cross-fade, which bakes plates for lights
   that are NOT the current one (see lightAtK below) and would otherwise get
   the live sun's vector back for a plate baked at the moon's. Defaulting to
   LIGHT keeps terrain.js / tilefx.js / dressing.js — all of which call it bare
   — reading exactly what they read before. */
function lightVector(L){
  L = L || LIGHT;
  const az = L.az, el = L.elev;
  return { x:Math.sin(az)*Math.cos(el), y:Math.sin(el), z:-Math.cos(az)*Math.cos(el) };
}

/* ══════════════════════════════════════════════════════════════════
   STAGE BUILD — pure from MAP. Editor calls this to hot-reload.
   ══════════════════════════════════════════════════════════════════ */
function buildStage(){
  buildCam(); resize(); buildHeightfield(); seedBraziers();
  /* the baked terrain is keyed off the heightfield + viewport; force a re-bake
     and drop the cached pick polys so clicks follow the new geometry */
  TERRAIN.key = ''; TERRAIN.poly = null;
  _dressKey = '';                       /* re-scatter the set dressing too */
  units = units.filter(u => u.persist);
  /* …and re-seed the pick polys immediately. The bake used to be the only
     thing that filled TERRAIN.poly, and it is now scheduled two frames out;
     without this the board would be clickable but mis-picking for those two
     frames. See seedPickPolys. */
  seedPickPolys();
}

/* ══════════════════════════════════════════════════════════════════
   UNITS
   ══════════════════════════════════════════════════════════════════ */
function spawnUnit(defKey, gx, gz, side){
  /* An unregistered unit still gets a body: hash its key onto one of the
     procedural silhouettes rather than throwing. */
  if (!UNIT_DEFS[defKey]){
    let hsh = 0; for (let i = 0; i < String(defKey).length; i++) hsh = (hsh * 31 + String(defKey).charCodeAt(i)) | 0;
    const proc = PROC_KEYS[Math.abs(hsh) % PROC_KEYS.length];
    UNIT_DEFS[defKey] = Object.assign({}, PROC_DEFS[proc], { name:String(defKey), _proc:proc });
  }
  const def = UNIT_DEFS[defKey];
  const u = {
    id: uid++, def, key:defKey, side: side||'mine',
    gx, gz, x:gx, z:gz, y:0, scaleX:1, scaleY:1, face: side==='foe' ? 1 : -1,
    bob: Math.random()*Math.PI*2, hp:1, anim:'idle', animT:0, tween:null, flash:0, rise:0
  };
  units.push(u);
  return u;
}
function unitAt(gx,gz){ return units.find(u => u.gx===gx && u.gz===gz && !u.dead); }

/* crisp tile-to-tile movement: cubic ease + hop arc + squash + dust */
function moveUnit(id, gx, gz){
  const u = units.find(x => x.id===id); if (!u || u.tween) return;
  if (tileBlocked(gx,gz) || unitAt(gx,gz)) { deny(u); return; }
  u.face = (gx === u.gx) ? u.face : (gx > u.gx ? 1 : -1);
  u.tween = { x0:u.x, z0:u.z, x1:gx, z1:gz, t:0, dur:0.34 };
  u.anim = 'walk';
  u.gx = gx; u.gz = gz;
  dispatch('unitMove', { id, x:gx, z:gz });
}
function deny(u){
  u.shake = 0.28;
  effects.push({ k:'ring', x:u.x, z:u.z, t:0, dur:.35, col:'#ff5a48', r0:.15, r1:.5 });
}
function attackUnit(id, targetId){
  const u = units.find(x=>x.id===id), t = units.find(x=>x.id===targetId);
  if (!u || !t) return;
  u.lunge = { t:0, dur:.42, dx:(t.x-u.x), dz:(t.z-u.z) };
  setTimeout(() => {
    t.flash = 1; t.shake = .3;
    effects.push({ k:'impact', x:t.x, z:t.z, t:0, dur:.5 });
    burst(t.x, t.z, .6, 22, '#ffd08a');
    effects.push({ k:'float', x:t.x, z:t.z, t:0, dur:1.1, txt:'-24', col:'#ff6a5a' });
  }, 180);
  dispatch('unitAttack', { id, targetId });
}
function killUnit(id){
  const u = units.find(x=>x.id===id); if (!u) return;
  u.dead = true; u.deathT = 0;
  burst(u.x, u.z, .8, 34, u.def.color);
  dispatch('unitDeath', { id });
}

/* ══════════════════════════════════════════════════════════════════
   SUMMON — the ceremony. Timings documented in the port brief.
   ══════════════════════════════════════════════════════════════════ */
let summoning = false;
/* 🌟 SUMMON ARRIVAL (cosmetic only).
   The unit is ALREADY placed by the normal roster push — this just replays the
   arrival beats on it: rune circle, white flash, pillar of light, shockwave
   ring, dust burst, then the unit rises out of the tile with a back-ease and
   a landing squash. Deliberately decoupled from spawning: if this never runs,
   the board is still correct, which is the bug that bit the first attempt. */
function summonFx(unitId){
  const u = units.find(x => String(x.id) === String(unitId) && !x.dead);
  if (!u || u.rise) return false;
  const col = (u.def && u.def.color) || '#f6dc95';
  const wp = gw(u.gx, u.gz, tileElev(u.gx, u.gz));
  effects.push({ k:'rune', x:wp.x, z:wp.z, gx:u.gx, gz:u.gz, t:0, dur:1.5, col });
  effects.push({ k:'flash', t:0, dur:.55 });
  effects.push({ k:'pillar', gx:u.gx, gz:u.gz, t:0, dur:1.0, col });
  effects.push({ k:'ring', x:wp.x, z:wp.z, t:0, dur:.7, col, r0:.2, r1:1.6 });
  burst(wp.x, wp.z, 1.0, 46, col);
  u.rise = 1; u.riseT = 0; u.y = -1.1; u.scaleX = .7; u.scaleY = .7;
  return true;
}
function summonUnit(cardId, gx, gz, opts){
  if (summoning) return;
  opts = opts || {};
  /* EMBEDDED: the host summons by UNIT KEY, not by a card in the demo hand.
     Synthesise the card the ceremony needs so the flying card shows the real
     unit's art and name. */
  let card = HAND.find(c => c.id===cardId);
  if (!card){
    const d = UNIT_DEFS[cardId];
    if (!d) return;
    card = { id:cardId, unit:cardId, ec:d.color || '#f6dc95', el:'', cost:opts.cost || 0 };
  }
  if (tileBlocked(gx,gz) || unitAt(gx,gz)) return;
  summoning = true;
  dispatch('cardPlayed', { cardId, x:gx, z:gz });

  const el = document.querySelector(`.hcard[data-id="${cardId}"]`);
  const from = el ? el.getBoundingClientRect() : { left:W/2-93, top:H-278, width:186, height:260 };
  if (el) el.style.visibility = 'hidden';

  /* flying card (Three.js: a textured plane in-scene) */
  const fly = document.createElement('div');
  fly.className = 'flycard';
  fly.innerHTML = `<div class="back">✦</div><div class="face">
      <div class="art"></div><div class="nm">${UNIT_DEFS[card.unit].name}</div></div>`;
  document.body.appendChild(fly);
  const artCv = document.createElement('canvas');
  artCv.width = 186*2; artCv.height = 226*2; artCv.style.width='186px'; artCv.style.height='226px';
  fly.querySelector('.art').appendChild(artCv);
  paintCardArt(artCv.getContext('2d'), card, 186, 226, 2);

  const wp = gw(gx, gz, tileElev(gx,gz));
  const target0 = project(wp);
  const target = target0 || { x:W/2, y:H/2, s:100 };
  const CARD_W = from.width || 186;
  /* The hand card is large; once placed it must read as a small card sitting
     ON the tile — ≈0.66 of a tile wide, so deeper tiles get a smaller card. */
  const landScale = clamp((0.66 * target.s) / CARD_W, 0.18, 0.62);
  const t0 = performance.now();
  const DUR = { fly:520, flip:640, flash:780, rise:820, dissolve:900, land:1350 };
  let ignited = false, flipped = false, flashed = false, risen = false, dissolved = false;
  let unit = null;

  (function step(now){
    const e = now - t0;
    /* 0 → fly */
    const ft = clamp(e/DUR.fly, 0, 1), fe = easeInOut(ft);
    const sx = from.left, sy = from.top;
    const mx = lerp(sx, target.x-CARD_W/2, fe), my = lerp(sy, target.y-130, fe) - Math.sin(fe*Math.PI)*215;
    const tilt = lerp(0, 62, fe);
    const scl = lerp(1, landScale, fe);
    const flipDeg = e > DUR.flip ? clamp((e-DUR.flip)/240, 0, 1)*180 : 0;
    fly.style.transform =
      `translate3d(${mx}px, ${my}px, 0) rotateX(${tilt}deg) rotateY(${180-flipDeg}deg) scale(${scl})`;

    if (!ignited && e >= DUR.fly){
      ignited = true;
      effects.push({ k:'rune', x:gx===undefined?0:gw(gx,gz).x, z:gw(gx,gz).z, gx, gz, t:0, dur:1.5, col:card.ec });
    }
    if (!flipped && e >= DUR.flip){ flipped = true; }
    if (!flashed && e >= DUR.flash){
      flashed = true;
      effects.push({ k:'flash', t:0, dur:.55 });
      effects.push({ k:'pillar', gx, gz, t:0, dur:1.0, col:card.ec });
      effects.push({ k:'ring', x:gw(gx,gz).x, z:gw(gx,gz).z, t:0, dur:.7, col:card.ec, r0:.2, r1:1.6 });
      burst(gw(gx,gz).x, gw(gx,gz).z, 1.0, 46, card.ec);
    }
    if (!risen && e >= DUR.rise){
      risen = true;
      unit = spawnUnit(card.unit, gx, gz, opts.side === 'foe' ? 'foe' : 'mine');
      if (unit && opts.id != null) unit.id = String(opts.id);   // keep the GAME's id
      unit.rise = 1; unit.y = -1.1; unit.scaleY = .7; unit.scaleX = .7;
    }
    if (!dissolved && e >= DUR.dissolve){
      dissolved = true;
      fly.style.transition = 'opacity .28s ease, transform .28s ease';
      fly.style.opacity = '0';
      const cur = fly.style.transform;
      fly.style.transform = cur + ' scale(1.18)';
      emberDissolve(target.x, target.y);
      setTimeout(() => fly.remove(), 320);
      const idx = HAND.findIndex(c => c.id===cardId);
      if (idx >= 0) HAND.splice(idx, 1);
      renderHand();
    }
    if (unit && unit.rise > 0){
      const rt = clamp((e - DUR.rise)/420, 0, 1);
      const re = easeBack(rt);
      unit.y = lerp(-1.1, 0, re);
      unit.scaleY = lerp(.7, 1, easeOut(rt));
      unit.scaleX = lerp(.7, 1, easeOut(rt));
      if (rt >= 1) unit.rise = 0;
    }
    if (e >= DUR.land && unit){
      unit.scaleY = 1.16; unit.scaleX = .88;   /* landing squash, springs back in update */
      effects.push({ k:'ring', x:gw(gx,gz).x, z:gw(gx,gz).z, t:0, dur:.55, col:card.ec, r0:.1, r1:1.0 });
      dust(gw(gx,gz).x, gw(gx,gz).z, 20);
      summoning = false;
      dispatch('summonComplete', { cardId, unitId:unit.id, x:gx, z:gz });
      return;
    }
    requestAnimationFrame(step);
  })(t0);
}

/* ══════════════════════════════════════════════════════════════════
   PARTICLES
   ══════════════════════════════════════════════════════════════════ */
function burst(wx, wz, power, n, col){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = rnd(.4,2.2)*power;
    particles.push({ x:wx, y:rnd(.05,.35), z:wz, vx:Math.cos(a)*sp, vy:rnd(1.4,4.2)*power, vz:Math.sin(a)*sp,
      life:rnd(.5,1.2), t:0, col, size:rnd(1.4,3.4), g:5.6 });
  }
}
/* DUST — real kicked-up dust: soft billowing puffs that expand, hug the
   ground, drift outward and fade, plus a little heavier grit that arcs and
   settles. (Three.js: soft-particle billboards with depth-fade + the same
   expand/fade curve; grit as a small GPU sprite burst.) */
function dust(wx, wz, n){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = rnd(.35,1.05);
    particles.push({ puff:true, x:wx, y:rnd(.01,.10), z:wz,
      vx:Math.cos(a)*sp, vz:Math.sin(a)*sp, vy:rnd(.10,.34),
      t:0, life:rnd(.75,1.35),
      r0:rnd(.09,.17), r1:rnd(.44,.78),
      col:'#b9a582', tone:rnd(.85,1.12) });
  }
  for (let i=0;i<Math.round(n*.55);i++){
    const a = Math.random()*Math.PI*2, sp = rnd(.5,1.6);
    particles.push({ x:wx, y:.03, z:wz, vx:Math.cos(a)*sp, vy:rnd(.5,1.5), vz:Math.sin(a)*sp,
      life:rnd(.35,.75), t:0, col:'#d8c9a4', size:rnd(1.1,2.2), g:4.2, soft:true });
  }
}
function emberDissolve(sx, sy){
  for (let i=0;i<28;i++){
    effects.push({ k:'ember2d', x:sx+rnd(-40,40), y:sy+rnd(-56,56),
      vx:rnd(-26,26), vy:rnd(-90,-26), t:0, dur:rnd(.6,1.2), col:'#ffcf7a' });
  }
}
/* ambient motes floating over the stage */
for (let i=0;i<70;i++){
  particles.push({ amb:true, x:rnd(-5,5), y:rnd(.1,3.4), z:rnd(-4,4),
    vx:rnd(-.06,.06), vy:rnd(.05,.22), vz:rnd(-.06,.06), t:0, life:1e9,
    col: Math.random()<.5 ? '#b98cff' : '#ffcf7a', size:rnd(.8,2.1), g:0, w:Math.random()*7 });
}

/* ══════════════════════════════════════════════════════════════════
   DRAW — sky, board, tiles, props, units, fx
   ══════════════════════════════════════════════════════════════════ */
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, LIGHT.sky[0]); g.addColorStop(.55, LIGHT.sky[1]); g.addColorStop(1, LIGHT.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  /* the location backdrop covers this entirely when art is present */

  drawBackdrop();   /* the location's world sits behind the arena */

  /* ── SUN / MOON — real art, positioned from the preset so the sky always
     matches the battle's clock. Drawn AFTER the backdrop so they read as
     hanging in front of the scene. Sun gets corona shine + lens streaks;
     moon gets a cold blue moonlight halo. ── */
  const az = LIGHT.az, el = LIGHT.elev;
  /* ☀ Pinned to the UPPER-RIGHT sky and kept small. It used to swing with the
     light azimuth across the middle of the frame at a large radius, which put
     it straight over the battlefield. Now it stays in the corner, well clear of
     the play area, and only drifts a little with the light direction. */
  const bx = VIEW.cx + VIEW.box.w * .40 + Math.sin(az) * VIEW.box.w * .05;
  const by = VIEW.cy - VIEW.box.h * .40 - (el - .15) * VIEW.box.h * .16;
  const isSun = LIGHT.body === 'sun';
  const R = (isSun ? 40 : 32) * clamp(VIEW.box.h/900, .7, 1.15);
  const pulse = 1 + Math.sin(T*0.9)*0.018 + Math.sin(T*2.3)*0.008;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* broad atmospheric bloom */
  const halo = ctx.createRadialGradient(bx,by,R*0.55, bx,by,R*(isSun?7.5:5.4));
  halo.addColorStop(0,   rgba(LIGHT.disc, isSun ? .40 : .26));
  halo.addColorStop(.18, rgba(LIGHT.disc, isSun ? .17 : .12));
  halo.addColorStop(1,   rgba(LIGHT.disc, 0));
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(bx,by,R*(isSun?7.5:5.4),0,7); ctx.fill();
  /* tight inner shine right at the limb */
  const core = ctx.createRadialGradient(bx,by,R*0.72, bx,by,R*1.55);
  core.addColorStop(0, rgba(isSun?'#ffd08a':'#cfe0ff', isSun?.55:.34));
  core.addColorStop(1, rgba(isSun?'#ff9a30':'#8fb4ff', 0));
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(bx,by,R*1.55,0,7); ctx.fill();

  if (isSun){
    /* rotating corona rays */
    for (let i=0;i<16;i++){
      const a = i*Math.PI/8 + T*0.05;
      const len = R*(2.5 + Math.sin(T*1.7 + i*1.3)*0.75);
      const gg = ctx.createLinearGradient(bx,by, bx+Math.cos(a)*len, by+Math.sin(a)*len);
      gg.addColorStop(0, rgba('#ffcf7a', .16));
      gg.addColorStop(1, rgba('#ff8a20', 0));
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.lineTo(bx+Math.cos(a-.05)*len, by+Math.sin(a-.05)*len);
      ctx.lineTo(bx+Math.cos(a+.05)*len, by+Math.sin(a+.05)*len);
      ctx.closePath(); ctx.fill();
    }
    /* anamorphic lens streaks */
    const streak = (w,hh,al) => {
      const g2 = ctx.createLinearGradient(bx-w,by,bx+w,by);
      g2.addColorStop(0,'rgba(255,190,110,0)'); g2.addColorStop(.5,`rgba(255,225,170,${al})`);
      g2.addColorStop(1,'rgba(255,190,110,0)');
      ctx.fillStyle = g2; ctx.fillRect(bx-w, by-hh/2, w*2, hh);
    };
    streak(R*6.2, R*0.075, .30);
    streak(R*3.0, R*0.030, .38);
    ctx.save(); ctx.translate(bx,by); ctx.rotate(Math.PI/2); ctx.translate(-bx,-by);
    streak(R*3.4, R*0.055, .20); ctx.restore();
  } else {
    /* cold moonlight bloom + faint god-shafts */
    for (let i=0;i<9;i++){
      const a = -Math.PI/2 + (i-4)*.10 + Math.sin(T*.16+i)*.01;
      const len = VIEW.box.h*1.5;
      const gg = ctx.createLinearGradient(bx,by, bx+Math.cos(a)*len, by-Math.sin(a)*len);
      gg.addColorStop(0, rgba('#9fc0ff', .055));
      gg.addColorStop(1, rgba('#6f9ce8', 0));
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.lineTo(bx+Math.cos(a-.028)*len, by-Math.sin(a-.028)*len);
      ctx.lineTo(bx+Math.cos(a+.028)*len, by-Math.sin(a+.028)*len);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();

  /* the body itself */
  const img = isSun ? SUN_IMG : MOON_IMG;
  if (img && img.complete && img.naturalWidth){
    const d = R*2*pulse;
    if (isSun){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.drawImage(img, bx-d/2, by-d/2, d, d);
      ctx.restore();
      /* second, slowly counter-rotating pass adds churn to the surface */
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.28;
      ctx.translate(bx,by); ctx.rotate(-T*0.012); ctx.translate(-bx,-by);
      ctx.drawImage(img, bx-d*.49, by-d*.49, d*.98, d*.98);
      ctx.restore();
    } else {
      ctx.drawImage(img, bx-d/2, by-d/2, d, d);
      /* moonlight rim */
      ctx.save(); ctx.globalCompositeOperation='lighter';
      const rim = ctx.createRadialGradient(bx,by,R*.86, bx,by,R*1.12);
      rim.addColorStop(0,'rgba(180,210,255,0)'); rim.addColorStop(.6,'rgba(190,215,255,.30)');
      rim.addColorStop(1,'rgba(150,190,255,0)');
      ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(bx,by,R*1.12,0,7); ctx.fill();
      ctx.restore();
    }
  } else {
    ctx.fillStyle = LIGHT.disc; ctx.beginPath(); ctx.arc(bx,by,R,0,7); ctx.fill();
  }
  if (!isSun){
    ctx.fillStyle = rgba(LIGHT.disc,.9);
    for (let i=0;i<110;i++){
      const sx=(i*137.5)%W, sy=((i*79.3)%(H*.6));
      ctx.globalAlpha=.08+(i%5)*.11; ctx.fillRect(sx,sy,1.4,1.4);
    }
    ctx.globalAlpha=1;
  }

  /* procedural ruin silhouettes — only when the location has no backdrop art */
  if (!(BACKDROP.img && BACKDROP.img.complete)){
    ctx.fillStyle = rgba(LIGHT.fog, .92);
    const horizon = project({x:0,y:0,z:-14});
    const hy = horizon ? horizon.y : H*.42;
    for (let i=0;i<26;i++){
      const sx = (i*163 + 40) % (W+200) - 100;
      const w = 26 + (i*37)%60, h = 40 + (i*91)%160;
      ctx.fillRect(sx, hy-h, w, h+30);
      if (i%3===0){ ctx.fillRect(sx+w*.3, hy-h-24, w*.28, 26); }
    }
    const fg = ctx.createLinearGradient(0,hy-60,0,hy+140);
    fg.addColorStop(0, rgba(LIGHT.fog,0)); fg.addColorStop(1, rgba(LIGHT.fog,.85));
    ctx.fillStyle = fg; ctx.fillRect(0,hy-60,W,220);
  }
}

/* ══════════════════════════════════════════════════════════════════
   BACKDROP — the location's environment behind the arena. Anchored to the
   board's FAR EDGE so the world reads as continuing past the play field,
   scaled to cover, graded by the current sky, and hazed into the ground
   at its base so there is no hard seam.
   (Three.js: a large curved backdrop plane / skydome segment behind the
   board, or a cubemap face. Keep the same fade + grade.)
   ══════════════════════════════════════════════════════════════════ */
function drawOneBackdrop(img, alpha){
  /* COVER the entire viewport — no horizon cut, no empty gradient below.
     The image is scaled to fill W x H, then slid vertically so its own
     horizon lands near the board's far edge. */
  const far = project({ x:0, y:0, z:-MAP.rows/2 - CONFIG.wall });
  const anchorY = (far ? far.y : H*0.45);
  const sc = Math.max(W/img.naturalWidth, H/img.naturalHeight) * 1.02;
  const dw = img.naturalWidth*sc, dh = img.naturalHeight*sc;
  const dx = (W-dw)/2;
  /* BACKDROP.horizon = where the horizon sits in the source image (0..1) */
  let dy = anchorY - dh*BACKDROP.horizon;
  /* ⚠ THIS CLAMP USED TO BE THE BUG, AND IT IS LEFT IN AS A GUARD ONLY.
     It silently overrode the anchor by 278 px on the shipped stage until
     syncBackdropPlates() started supplying a plate tall enough for the anchor
     to be reachable; with a plate it is never the binding constraint. Do not
     "fix" the anchor by loosening this — fix the plate. */
  dy = Math.min(0, Math.max(H - dh, dy));      /* never expose an edge */
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.globalAlpha = 1;
  return { dx, dy, dw, dh, anchorY };
}
function drawBackdrop(){
  const img = BACKDROP.img;
  if (!img || !img.complete || !img.naturalWidth) return;
  ctx.save();
  if (BACKDROP.prev && BACKDROP.fade < 1 && BACKDROP.prev.complete) drawOneBackdrop(BACKDROP.prev, 1);
  const R = drawOneBackdrop(img, BACKDROP.fade);
  /* Time-of-day grade — kept LIGHT so the artwork stays readable.
     (It was previously washed out by a heavy fog pass + a full-width haze
     band; both are much gentler now.) */
  const shade = clamp(0.30 - LIGHT.keyI*0.17, 0.02, 0.34);
  ctx.fillStyle = rgba(LIGHT.fog, shade);
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rgba(LIGHT.key, 0.03 + LIGHT.keyI*0.03);
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  /* soft depth haze only right around the horizon line, never a hard band */
  const hz = ctx.createLinearGradient(0, R.anchorY - H*0.16, 0, R.anchorY + H*0.10);
  hz.addColorStop(0,  rgba(LIGHT.fog, 0));
  hz.addColorStop(.55,rgba(LIGHT.fog, .30));
  hz.addColorStop(1,  rgba(LIGHT.fog, 0));
  ctx.fillStyle = hz; ctx.fillRect(0, R.anchorY - H*0.16, W, H*0.26);
  ctx.restore();
}

/* crystal shards floating around the arena (reference art) */
const SHARDS = Array.from({length:14}, (_,i) => ({
  x: (i%2? 1:-1) * rnd(4.4, 7.4), y: rnd(.4, 3.6), z: rnd(-5, 3.4),
  s: rnd(.28,.72), r: rnd(-.5,.5), w: Math.random()*7
}));
function drawShards(){
  for (const s of SHARDS){
    const p = project({ x:s.x, y:s.y + Math.sin(T*.6+s.w)*.12, z:s.z }); if (!p) continue;
    const k = s.s * p.s * .5;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(s.r + Math.sin(T*.3+s.w)*.06);
    const g = ctx.createLinearGradient(0,-k,0,k);
    g.addColorStop(0, rgba('#b98cff',.85)); g.addColorStop(1, rgba('#4a2a8a',.5));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0,-k); ctx.lineTo(k*.42,0); ctx.lineTo(0,k); ctx.lineTo(-k*.42,0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba('#d8b8ff',.5); ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
}

function tilePoly(gx,gz,inset,y){
  const e = y!==undefined ? y : tileElev(gx,gz);
  const a = gw(gx,gz,e), h = CONFIG.tile/2 - (inset||0);
  const pts = [ {x:a.x-h,y:a.y,z:a.z-h}, {x:a.x+h,y:a.y,z:a.z-h}, {x:a.x+h,y:a.y,z:a.z+h}, {x:a.x-h,y:a.y,z:a.z+h} ];
  const pr = pts.map(project);
  return pr.some(p=>!p) ? null : pr;
}
function pathPoly(P){ ctx.beginPath(); ctx.moveTo(P[0].x,P[0].y); for (let i=1;i<P.length;i++) ctx.lineTo(P[i].x,P[i].y); ctx.closePath(); }

/* ══════════════════════════════════════════════════════════════════════════
   🏜 TERRAIN — sand-and-rock ground, real elevation, no chessboard.

   WHAT WAS HERE BEFORE, AND WHY IT IS GONE
   The old drawBoard() painted a flat plate and then advertised the grid: a
   1.2px GOLD stroke around every one of the 56 tiles, a rotating gold RUNE
   circle stamped in each tile centre, a gold rail around the stone apron and
   a gold frame band (drawFrame). That is the single loudest "this is a 2D
   grid with sprites on it" tell in the whole app, so all four are deleted.
   Tile boundaries now read ONLY as a soft crease the same hue as the ground
   plus a 1px lit bevel on the light-facing edge — barely there, no outline,
   and there is no .even/.odd checker: every tile's material is seeded from a
   deterministic per-tile hash so no two tiles are identical.

   WHY IT IS BAKED
   The camera never moves (CONFIG.camera is fixed) and the heightfield is
   static per map, so the entire ground — top faces, cliff walls, ambient
   occlusion, cast shadows, creases and grain — is rendered ONCE into an
   offscreen canvas and blitted each frame. That buys the per-tile gradient
   work, the mottling and the stipple grain that make it read as material
   instead of a fill, and still costs one drawImage per frame. It re-bakes
   only when the viewport, the map, the location or the light actually change
   (and is throttled during the 2.5s time-of-day lerp).

   WHERE THE LOCATION ART WENT
   drawGroundSlices() used to lay the location photo flat across the play
   plane in 150 affine bands. It cannot follow elevation (it assumes y=0), it
   cannot take a bevel or a contact shadow, and a literal photo under a grid
   is exactly the flat read we are killing. The location now drives the
   ground's COLOUR instead: sampleGroundTint() reads the art down to a small
   grid and transfers its chroma per tile at matched luminance, so a location
   card still repaints the field without flattening it. The vista module owns
   the horizon; drawGroundSlices is kept (unused by the ground path) because
   its projection note is still the reference for anything laying art flat.
   ══════════════════════════════════════════════════════════════════════════ */

/* palette — warm tan/ochre sand, cooler grey rock, cool blue-grey in shadow.
   Nothing here is pure black or pure white; the BAR forbids both. */
const SAND_BASE = '#a67c3d', SAND_PALE = '#dcbc80', SAND_DEEP = '#54371c';
const ROCK_BASE = '#786550', ROCK_PALE = '#9d8871', ROCK_DEEP = '#332c25';
const SHADE_COOL = '#2e3650';

function rgbHex(r,g,b){
  const to = v => Math.round(clamp(v,0,255)).toString(16).padStart(2,'0');
  return '#' + to(r) + to(g) + to(b);
}

/* ══════════════════════════════════════════════════════════════════════════
   🏔 VALUE IS ELEVATION — the rule the whole ground obeys
   ──────────────────────────────────────────────────────────────────────────
   ROUND 1 BUG, measured, not guessed. The first build drew real cliff walls,
   real strata and real cast shadows, but let the per-tile material hash own
   the top face's BRIGHTNESS. Sampling the baked canvas at all 56 projected
   tile centres gave mean luma 136.3 / 145.9 / 155.0 / 152.8 for levels 0-3
   with ±40 of spread INSIDE each level: level 3 came out DARKER than level 2,
   and a level-0 tile read 53 luma brighter than a level-3 tile. A raised top
   was therefore not a lit top, the only thing saying "this tile is higher"
   was a ~45px wall sliver, and the field read as a pale tan floor with a few
   grey ledges instead of layered rock plateaus.

   THE RULE: a top face's LUMINANCE is a function of its level and of nothing
   else. The per-tile hash keeps hue, mottle, drift, pebbles and grain — all
   the things that kill the "uniform fill" read — but its licence over VALUE

     flat grey-tan — the level ramp had made the value uniform and this made
     the hue uniform too, so a plateau read as cardboard. L*0.15 leaves the
     level a visible bias (high ground IS rockier) while the per-tile hash
     still swings the full sand↔rock range at every level. */
  const rocky = clamp(L*0.15 + h1*0.62 - 0.10, 0, 1);
  let hue = mixHexRaw(SAND_BASE, ROCK_BASE, rocky);
  /* independent temperature jitter: two tiles at the same value and the same
     sand/rock mix should still not be the same colour. Hue only. */
  hue = mixHexRaw(hue, h2 > 0.5 ? '#c08a44' : '#7b7f8c', Math.abs(h2-0.5)*0.30);
  /* warmer with every level up: a plateau top takes the key square on, a
     basin floor sits in cool bounced sky light. Hue only — the ramp below
     owns how bright each of them ends up. */
  hue = mixHexRaw(hue, LIGHT.key, 0.05 + L*0.055);
  if (L === 0) hue = mixHexRaw(hue, SHADE_COOL, 0.17);
  const tint = groundTintAt(x,z,(h2*4)|0);
  if (tint) hue = tintTo(hue, tint, 0.16);
  const t = tileAt(x,z);
  if (t && t.type === 'hazard')    hue = mixHexRaw(hue, '#3f2418', 0.45);
  if (t && t.type === 'objective') hue = mixHexRaw(hue, '#b98f3a', 0.26);

  /* ── VALUE ── the elevation ramp, ±4 luma of hash jitter (that is the
     entire licence the per-tile hash has over brightness) and the closed-loop
     correction measured off the previous bake. */
  const want = clamp(toneWant(x,z) + toneCorr(x,z), 18, 236);
  const base = setLumaHex(hue, want);
  /* lit/shd/pale/deep are RELATIVE to this tile's own value, so a mottle blob
     or a bevel can never carry a tile across a level boundary. */
  const lit  = setLumaHex(mixHexRaw(hue, LIGHT.key,   0.16 + 0.10*clamp(LIGHT.keyI,0,1.4)), want*1.10);
  const shd  = setLumaHex(mixHexRaw(hue, SHADE_COOL,  0.34), want*0.78);
  const pale = setLumaHex(mixHexRaw(hue, SAND_PALE,   0.30), want*1.20);
  const deep = setLumaHex(mixHexRaw(hue, SHADE_COOL,  0.22), want*0.70);
  return { base, lit, shd, pale, deep, hue, want, rocky, L, h0, h1, h2 };
}

function bakeTerrain(){
  /* ⏱ THE LOAD SCHEDULE owns which frame each bake runs on — see LOADQ. This
     is the FIRST line so a declined frame mutates nothing at all: TERRAIN.cv
     keeps the last good bake (null on the first two frames, which drawBoard
     already guards), TONE.pending stays set, and the bake happens intact on
     the frame the schedule opened for it. */
  if (!loadAllow('terrain')) return;
  sampleGroundTint();
  toneReset();                       /* new map / new heightfield → new loop */
  const key = terrainKey();
  /* TONE.pending overrides both guards below: the tone lock needs two or three
     back-to-back bakes to converge, and after that it is quiet, so the steady
     state is still one bake per real change. TONE.iter is the hard stop. */
  if (TERRAIN.key === key && TERRAIN.cv && !TONE.pending) return;
  /* A bake is real work (56 tiles of gradients + grain). During a 2.5s
     time-of-day LERP the key changes every frame, so throttle to ~7/s; the
     quantised LIGHT terms in terrainKey() already coalesce most of it. */
  if (TERRAIN.cv && (T - TERRAIN.at) < 0.14 && !TONE.pending) return;
  TONE.iter++;                     /* toneReset() is what zeroes this */
  TONE.pending = false;
  TERRAIN.key = key; TERRAIN.at = T;
  const _t0 = (performance && performance.now) ? performance.now() : 0;

  if (!TERRAIN.cv) TERRAIN.cv = document.createElement('canvas');
  const cvT = TERRAIN.cv;
  const pw = Math.max(1, Math.round(W*DPR)), ph = Math.max(1, Math.round(H*DPR));
  if (cvT.width !== pw || cvT.height !== ph){ cvT.width = pw; cvT.height = ph; }
  const g = cvT.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,W,H);

  const lv = lightVector();
  const cols = MAP.cols, rows = MAP.rows;
  const poly = {}, mat = {};
  /* Phases for the world-space margin noise §3's AO and cast shadows are cut
     with. Seeded off MAP.id so a map's shadow margins are stable, and SAMPLED
     IN WORLD COORDINATES rather than from a per-tile hash — that is the whole
     point: a margin derived per tile repeats tile to tile, which is the grid
     coming back in the one pass whose job is to sell the third dimension. */
  const SHNOISE = [ hfStrHash(MAP.id + '#shm', 1) * 6.283,
                    hfStrHash(MAP.id + '#shm', 2) * 6.283,
                    hfStrHash(MAP.id + '#shm', 3) * 6.283 ];

  /* ── 0. THE FIELD DISSOLVES INTO THE CANYON FLOOR ─────────────────────
     ⚠ ROUND 2 REWRITE — DO NOT PUT A RECTANGLE BACK HERE.
     Round 1 drew three nested AXIS-ALIGNED quads, and the critic read exactly
     what was drawn: "the board is a floating rectangular slab, not a canyon
     floor — all four edges of the play surface are visible as straight lines,
     a grey-brown stone apron lip across the full width at the bottom, hard
     vertical cuts down the left and right." Feathering the ALPHA of a
     rectangle does not help: a rectangle still has four straight edges, and
     the eye finds a straight edge at any contrast.
     So the apron is an IRREGULAR RING. The board perimeter is walked as a
     polyline and every sample is pushed outward by a smooth per-ring noise,
     so no ring has a straight side and no two rings nest concentrically.
     Five rings at falling alpha feather it outward, and the outermost is warm
     hazed sand — NOT the old ROCK_DEEP + ambient mix, which is the literal
     source of the "grey-brown stone apron lip".
     The board edge itself is broken separately: boundary walls lose their lit
     lip (see EDGES below) and the EDGE SPILL pass after §1b throws sand lobes
     and talus across whatever line is left. */
  const ringNoise = (t, seedN) => {
    /* three octaves of a periodic sine sum — periodic in t so the ring closes
       without a seam, and seeded so ring 1 is not ring 2 scaled up. */
    const p = (k, ph) => Math.sin(t * Math.PI * 2 * k + ph);
    const a = hfStrHash(MAP.id + '#ring', seedN * 5 + 1) * 6.283;
    const b = hfStrHash(MAP.id + '#ring', seedN * 5 + 2) * 6.283;
    const c = hfStrHash(MAP.id + '#ring', seedN * 5 + 3) * 6.283;
    return p(2, a) * 0.52 + p(3, b) * 0.30 + p(7, c) * 0.18;
  };
  const apronRing = (pad, a, seedN) => {
    const hw = cols / 2, hh = rows / 2;
    const per = 2 * (cols + rows);
    const N = 132;
    const pts = [];
    for (let i = 0; i < N; i++){
      const t = i / N;
      let d = t * per, ex, ez, nx, nz;
      if (d < cols)              { ex = -hw + d;            ez = -hh; nx = 0;  nz = -1; }
      else if (d < cols + rows)  { d -= cols;  ex =  hw;     ez = -hh + d; nx = 1;  nz = 0; }
      else if (d < 2*cols + rows){ d -= cols + rows; ex = hw - d; ez = hh; nx = 0; nz = 1; }
      else                       { d -= 2*cols + rows; ex = -hw; ez = hh - d; nx = -1; nz = 0; }
      /* outward push, never below 0.25 of the nominal pad so the ring always
         clears the tiles, and up to ~2.1x so the silhouette is genuinely ragged */
      /* ⚠ WAVE 3: THE FAR SIDE IS PULLED IN HARD (nz < 0).
         Behind the board a point at y≈0 projects HIGHER on screen the further
         out it is, so the far arc of this ring was the only part of the apron
         with sky behind it — and five nested rings all built from the same
         three harmonics (2, 3, 7) put five scalloped silhouettes on top of one
         another there. The critic read the result as "a repeating notched
         crenellation band" across the full width, which is exactly what it
         was. Out there the ring is now a hair beyond the tiles and the mesa
         rim below owns the skyline instead. */
      const k = pad * (1.15 + ringNoise(t, seedN) * 0.9) * (nz < 0 ? 0.30 : 1);
      /* tangential slide as well, so corners round off unevenly instead of
         staying four right angles with fuzz on them */
      const tg = ringNoise(t + 0.37, seedN + 9) * pad * 0.55;
      const p = project({ x: ex + nx * k - nz * tg, y: -0.012, z: ez + nz * k + nx * tg });
      if (p) pts.push(p);
    }
    if (pts.length < 8) return;
    g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
    g.closePath();
    let y0 = 1e9, y1 = -1e9;
    for (const p of pts){ if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y; }
    const gr = g.createLinearGradient(0, y0, 0, y1);
    /* warm at both ends. The far end carries the fog so it melts into the
       vista; the near end is deep sand, not stone. */
    gr.addColorStop(0, rgba(mixHexRaw(mixHexRaw(SAND_DEEP, LIGHT.fog, .46), LIGHT.key, .12), a));
    gr.addColorStop(1, rgba(mixHexRaw(mixHexRaw(SAND_DEEP, ROCK_DEEP, .32), LIGHT.key, .07), a));
    g.fillStyle = gr; g.fill();
  };
  apronRing(CONFIG.wall*5.0, 0.20, 4);
  apronRing(CONFIG.wall*3.2, 0.34, 3);
  apronRing(CONFIG.wall*2.1, 0.52, 2);
  apronRing(CONFIG.wall*1.25, 0.76, 1);
  apronRing(CONFIG.wall*0.55, 0.94, 0);

  /* ── 1. tiles: cliff walls, then the lit top face ────────────────────
     Far rows first (painter's algorithm). Within a tile the walls go down
     BEFORE the top so the top's edge covers the wall's antialiased lip. */
  const api = buildApi(0, g);
  /* Every interior wall quad we draw, kept per tile. §1b needs the exact
     footprint of a raised tile — top face PLUS walls — to put it back after a
     lower level's material pass has painted across it. See OCCLUSION RESTORE. */
  const walls = {};
  for (let z=0; z<rows; z++){
    for (let x=0; x<cols; x++){
      const P = tilePoly(x,z,0);           /* inset 0 — contiguous, no gutters */
      if (!P) continue;
      poly[x+','+z] = P;
      const M = tileMaterial(x,z,lv); mat[x+','+z] = M;
      const yTop = tileElev(x,z);
      const L = hfLevel(x,z);
      const wq = walls[x+','+z] = [];

      /* ── cliff / side walls on every EXPOSED edge. Only the three edges the
         camera can see are drawn: [2,3] near, [1,2] right, [3,0] left. The far
         edge [0,1] is hidden behind this tile's own top face, and drawing it
         would paint over the row behind. (This edge list is inherited from the
         original raised-tile code for exactly that reason.) */
      /* ⚠ The far edge [0,1] is NOT in this list and cannot be. Tried in round
         2: from a camera pitched ~41° down, the far face of a raised block
         recedes BEHIND the block's own top face on screen (down-screen from
         the far edge is the top face itself), so the quad is drawn and then
         completely painted over. There is no camera-visible geometry behind a
         raised far row; its hard silhouette against the sky is what the top of
         a mesa actually looks like from above. */
      const EDGES = [ [2,3, 0, 1], [1,2, 1, 0], [3,0, -1, 0] ];
      for (const [i,j,dx,dz] of EDGES){
        const nx = x+dx, nz = z+dz;
        const inside = nx>=0 && nz>=0 && nx<cols && nz<rows;
        const yBot = inside ? tileElev(nx,nz) : -0.012;
        if (yTop - yBot <= 0.004) continue;
        const B = tilePoly(x,z,0,yBot); if (!B) continue;
        /* lambert on the wall's own normal — with the key high and forward
           every camera-facing wall lands in shade, which is what makes the
           lit tops pop and the elevation readable at a glance */
        const n = { x:dx, y:0, z:dz };
        const face = clamp(n.x*lv.x + n.z*lv.z, -1, 1);
        /* An ambient FLOOR matters here: with the key high and forward every
           camera-facing wall has a negative lambert, so a pure lambert term
           crushes all three visible faces to near-black and the cliff reads as
           a painted navy bar instead of rock. Sky bounce lifts the top of the
           wall, contact occlusion darkens its base. */
        const wl = clamp(0.40 + face*0.30, 0.18, 0.92);
        /* ⚠ The wall's VALUE is pinned to a fraction of THIS tile's own top
           face, not chosen freely. That guarantees the three-band read a step
           has to produce — bright top / dark wall / mid-value floor below —
           at every level: at level 1 the wall runs 0.50-0.26 of a 135-luma top
           (so 68→35) against a 105-luma basin, and at level 3 it runs
           0.50-0.26 of a 195-luma top (98→51) against a 165-luma shelf. Left
           free, a high plateau's wall came out brighter than the low ground
           beside it and the step vanished. */
        /* ⚠ WAVE 3 — THE FACE WAS BLUE-GREY AGAINST AN OCHRE FLOOR.
           The base used to be 40% SHADE_COOL. Measured on the bake alone the
           wall darks came out rgb(35,32,28) — only R-B +7 — and the vista's
           shadow split-tone (which cools the darkest thing in the frame on
           purpose) then carried them the rest of the way, so the finished
           frame showed a navy cliff in a warm desert. A cliff foot in a sand
           basin is the WARMEST shadow on the field: almost all of its light is
           bounce off the lit sand a metre in front of it. So the base takes a
           warm rock and a sand-bounce term and only a trace of SHADE_COOL.
           The LUMA TARGETS ARE UNCHANGED — those are the elevation rule
           (bright top / dark wall / mid floor) and are not a colour decision. */
        const wallHue = mixHexRaw(mixHexRaw(M.hue, ROCK_BASE, 0.44), LIGHT.key, 0.08 + 0.18*wl);
        const wallTop = setLumaHex(wallHue, M.want * (0.44 + 0.16*wl));
        const wallBot = setLumaHex(mixHexRaw(mixHexRaw(wallHue, '#4a3320', 0.42), SHADE_COOL, 0.13),
                                   M.want * (0.22 + 0.10*wl));
        if (inside) wq.push([P[i], P[j], B[j], B[i]]);
        g.beginPath();
        g.moveTo(P[i].x,P[i].y); g.lineTo(P[j].x,P[j].y);
        g.lineTo(B[j].x,B[j].y); g.lineTo(B[i].x,B[i].y); g.closePath();
        const wg = g.createLinearGradient(P[i].x,P[i].y, B[i].x,B[i].y);
        wg.addColorStop(0,   rgba(wallTop, 1));
        wg.addColorStop(0.42,rgba(mixHexRaw(wallTop, wallBot, 0.45), 1));
        wg.addColorStop(1,   rgba(wallBot, 1));
        g.fillStyle = wg; g.fill();
        /* ── THE FACE HAS TO BE ROCK, NOT A PANEL ────────────────────────
           ⚠ WAVE 3 REWRITE. Round 2 drew the strata as straight strokes from
           P[i] to P[j] — the FULL WIDTH of the face, every time. Neighbouring
           tiles on the same rim drew them at the same handful of heights, the
           strokes joined across tile boundaries, and a 566px-wide interior
           cliff read as three flat blue-grey panels stacked on each other.
           Real bedding is BROKEN: a bed runs for part of a face, PINCHES OUT,
           steps across a joint and starts again at another height.
           So the face gets its own (u along the edge, t down the face) space
           and every bed is a filled band with its own u-span, its own step and
           a thickness that tapers to nothing at both ends. The seed includes
           the FACE INDEX, so two tiles sharing a rim do not line up. */
        const fw = (u,t) => ({                   /* bilinear point on the quad */
          x: (P[i].x + (P[j].x-P[i].x)*u)*(1-t) + (B[i].x + (B[j].x-B[i].x)*u)*t,
          y: (P[i].y + (P[j].y-P[i].y)*u)*(1-t) + (B[i].y + (B[j].y-B[i].y)*u)*t
        });
        const fh = (n) => _sHash(x*7 + i*131 + 5, z*11 + i*37 + 3, n);
        g.save(); g.clip();
        /* ⚠ WAVE 5 — AMPLITUDE. Wave 3 built the right GEOMETRY here (broken
           beds that pinch out, per-face seeds so two tiles on a rim do not
           comb) and then drew it at 0.16-0.40 alpha in colours only a few luma
           off the face's own gradient. Measured on the isolated bake, the ten
           largest faces came out at resSd 10.6 / resD8 9.2 — where `res` is
           the face with its own top-to-bottom ramp subtracted out, i.e. what
           the geology alone contributes. At 1:1 that is a tinted quad with a
           smudge on it, which is exactly what the critic reported.
           ⚠ AND A BED IS NOT A LINE. The first wave-5 cut just raised the
           alpha on the existing 0.020-0.105 thick bands: on a 45px face that
