function paintSurfTexture(x,z,e,S,surf){
  const B = groundBasis(x,z,e); if (!B) return;
  const R = hexSize();
  ctx.save(); ctx.transform(B.ax,B.ay,B.bx,B.by,B.c.x,B.c.y);
  /* grit — every surface has some, in its own colour */
  ctx.fillStyle = rgba(S.grit, surf==='water' ? .06 : .15);
  for (let i=0;i<22;i++){
    const a = _sHash(x,z,i*3+1)*6.283, r = Math.sqrt(_sHash(x,z,i*3+2))*R*.80;
    const s = R*(.016 + _sHash(x,z,i*3+3)*.042);
    ctx.fillRect(Math.cos(a)*r, Math.sin(a)*r, s, s);
  }
  /* …and a few larger, softer stains. Grit alone is uniform noise, which at
     this scale reads as film grain rather than as ground; the low-frequency
     blotches are what keep a 60px hex from looking like a flat swatch. */
  for (let i=0;i<3;i++){
    const a = _sHash(x,z,200+i*2)*6.283, r = _sHash(x,z,201+i*2)*R*.5;
    ctx.fillStyle = rgba(_sHash(x,z,210+i) > .5 ? S.hi : S.lo, .18);
    ctx.beginPath(); ctx.ellipse(Math.cos(a)*r, Math.sin(a)*r,
      R*(.24+_sHash(x,z,214+i)*.30), R*(.18+_sHash(x,z,218+i)*.26),
      _sHash(x,z,222+i)*3.14, 0, 6.284); ctx.fill();
  }
  if (surf === 'asphalt'){
    /* CRACKED street. Two branching fractures per tile, drawn dark and then
       re-drawn a hair offset in the grit colour so the crack has a lip — that
       lip is what makes it read as broken road rather than a scratch. */
    for (let k=0;k<2;k++){
      const a0 = _sHash(x,z,40+k)*6.283;
      let ang = a0 + Math.PI + (_sHash(x,z,44+k)-.5);
      const pts = [{x:Math.cos(a0)*R*.92, y:Math.sin(a0)*R*.92}];
      for (let s=0;s<4;s++){
        ang += (_sHash(x,z,50+k*8+s)-.5)*1.25;
        const p0 = pts[pts.length-1];
        pts.push({ x:p0.x+Math.cos(ang)*R*.42, y:p0.y+Math.sin(ang)*R*.42 });
      }
      ctx.lineWidth = R*.024; ctx.strokeStyle = rgba(S.grit,.22);
      ctx.beginPath(); ctx.moveTo(pts[0].x+R*.024, pts[0].y+R*.024);
      for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x+R*.024, pts[i].y+R*.024);
      ctx.stroke();
      ctx.lineWidth = R*.02; ctx.strokeStyle = 'rgba(6,6,9,.60)';
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }
  } else if (surf === 'grass'){
    /* moss and weed BLOTCHES, flat. The standing blades are props (see the
       'tuft' case in paintDeco) — painting upright grass into the ground plane
       is what makes overgrowth look like green paint. */
    for (let i=0;i<5;i++){
      const a = _sHash(x,z,70+i*2)*6.283, r = _sHash(x,z,71+i*2)*R*.55;
      ctx.fillStyle = rgba(i&1 ? S.hi : S.lo, .34);
      ctx.beginPath(); ctx.ellipse(Math.cos(a)*r, Math.sin(a)*r,
        R*(.20+_sHash(x,z,80+i)*.26), R*(.14+_sHash(x,z,86+i)*.22),
        _sHash(x,z,90+i)*3.14, 0, 6.284); ctx.fill();
    }
  } else if (surf === 'rubble'){
    /* the gravel bed the standing chunks sit in */
    for (let i=0;i<9;i++){
      const a = _sHash(x,z,100+i*2)*6.283, r = Math.sqrt(_sHash(x,z,101+i*2))*R*.72;
      const s = R*(.07+_sHash(x,z,120+i)*.13);
      ctx.fillStyle = rgba(_sHash(x,z,130+i) > .5 ? S.grit : S.lo, .40);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r - s, Math.sin(a)*r);
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r - s*.8);
      ctx.lineTo(Math.cos(a)*r + s, Math.sin(a)*r + s*.2);
      ctx.lineTo(Math.cos(a)*r - s*.3, Math.sin(a)*r + s*.7);
      ctx.closePath(); ctx.fill();
    }
  } else if (surf === 'water'){
    /* STANDING WATER. A dark pool with the sky lying on it: one pale band for
       the reflection, a scum rim where it meets the ground, and algae flecks.
       No animation — this is baked, and a puddle in a ruined street is not
       supposed to be doing anything. */
    ctx.fillStyle = rgba(LIGHT.sky ? LIGHT.sky[2] : '#6b7f92', .10 + LIGHT.haze*.12);
    ctx.beginPath(); ctx.ellipse(0, -R*.12, R*.62, R*.15, 0, 0, 6.284); ctx.fill();
    ctx.strokeStyle = rgba(S.grit,.28); ctx.lineWidth = R*.045;
    ctx.beginPath(); ctx.ellipse(0,0,R*.80,R*.80,0,0,6.284); ctx.stroke();
    for (let i=0;i<4;i++){
      const a = _sHash(x,z,150+i*2)*6.283, r = _sHash(x,z,151+i*2)*R*.6;
      ctx.fillStyle = rgba('#6b7a4e', .22);
      ctx.beginPath(); ctx.ellipse(Math.cos(a)*r, Math.sin(a)*r, R*.16, R*.09, a, 0, 6.284); ctx.fill();
    }
  } else {
    /* dirt — wheel ruts and scrapes */
    ctx.strokeStyle = rgba(S.lo,.42); ctx.lineWidth = R*.09;
    for (let k=0;k<2;k++){
      const a = _sHash(x,z,160+k)*3.14;
      ctx.beginPath();
      ctx.moveTo(-Math.cos(a)*R*.8, -Math.sin(a)*R*.8 + (k-.5)*R*.3);
      ctx.lineTo( Math.cos(a)*R*.8,  Math.sin(a)*R*.8 + (k-.5)*R*.3);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ── one tile: cliff faces, slab top, texture, cell division ─────────────── */
function paintTile(x,z,lv){
  const t = tileAt(x,z);
  const e = t && t.elev ? t.elev : 0;
  const P = tilePoly(x,z,TILE_INSET,e); if (!P) return;
  const S = surfOf(t);
  const surf = (t && t.surf) || 'dirt';
  const wpos = gw(x,z);
  /* lambert-ish shade: tiles further from the light read darker. The .018 is a
     gradient PER TILE, divided by the row pitch so a wider board does not clamp
     one whole flank to the floor value. */
  const nd = clamp(.55 + lv.y*.45 + ((wpos.x*lv.x + wpos.z*lv.z)/hexW())*.018, .25, 1);

  /* 🧱 CLIFF FACES, drawn before the top they hang from. */
  if (e > 0) paintWalls(x,z,e,P,lv);

  /* the slab top */
  /* mixHexRaw, not mixHex — this value gets mixed again below. See the note at
     mixHex's definition; the hex/rgb() distinction is silent and fatal. */
  let col = mixHexRaw(S.lo, S.hi, clamp(nd,0,1));
  col = mixHexRaw(col, LIGHT.key, .04 + LIGHT.keyI*.05);
  /* 🌙 EXPOSURE. Without this the board sat at the same value under every
     preset — the lambert term only tracks the sun's ELEVATION, which barely
     moves between day and night, so a night battle came out as a daylit board
     with a dark sky over it. Fold in the rig's actual energy (keyI + ambI) and
     pull the shortfall toward the ambient colour, so night is darker AND cooler
     rather than just darker. day 1.10 · dusk 0.98 · dawn 0.95 · night 0.67. */
  const expo = clamp(.34 + LIGHT.keyI*.42 + LIGHT.ambI*.50, .35, 1.15);
  if (expo < 1){
    col = mixHexRaw(col, LIGHT.ambient, clamp((1-expo)*1.25, 0, .42));
    col = mixHexRaw(col, '#000000', clamp((1-expo)*.55, 0, .28));
  }
  /* high ground catches more of the key. BAR R1 wants height readable at a
     GLANCE, and a slab whose top is shaded exactly like the floor reads as a
     hole with a rim round it — the side walls only say which way is down once
     the top says it is up. Two steps, deliberately: a lift toward the surface's
     OWN highlight (a value step, which is what carries at a glance and at small
     size) and then a smaller warm wash toward the key (which is what says the
     step is height and not a different material). */
  if (e > 0){
    col = mixHexRaw(col, S.hi, clamp(e*1.25, 0, .40));
    col = mixHexRaw(col, LIGHT.key, clamp(.05 + e*.42, 0, .20));
  }
  /* 🎲 PER-TILE VALUE JITTER. Without it every dirt tile is the identical
     swatch and the board reads as painted cardboard hexes rather than as
     ground that happens to be divided into cells — the same "grid on a photo"
     smell, arrived at from the other direction. Hashed off the tile, so it is
     stable across rebuilds. */
  const j = (_sHash(x,z,7) - .5) * .34;
  col = mixHexRaw(col, j > 0 ? S.hi : S.lo, Math.abs(j));
  /* …and a value gradient across the tile itself, dark at the far edge and lit
     at the near one. P[4] is the far corner and P[1] the near one (corner i
     sits at i*60-30 degrees, so +z — toward the eye — is corner 1). */
  pathPoly(P);
  const tg = ctx.createLinearGradient(P[4].x, P[4].y, P[1].x, P[1].y);
  tg.addColorStop(0, mixHexRaw(col, S.lo, .30));
  tg.addColorStop(1, mixHexRaw(col, S.hi, .16));
  ctx.globalAlpha = S.a; ctx.fillStyle = tg; ctx.fill(); ctx.globalAlpha = 1;
  if (t && t.type === 'hazard'){ pathPoly(P); ctx.fillStyle = rgba('#5a1a0e',.34); ctx.fill(); }
  if (t && t.type === 'objective'){ pathPoly(P); ctx.fillStyle = rgba('#6a5a1e',.30); ctx.fill(); }

  ctx.save(); pathPoly(P); ctx.clip(); paintSurfTexture(x,z,e,S,surf); ctx.restore();

  /* 🌫 AERIAL PERSPECTIVE. Far rows sit further into the fog. Without it a
     14-deep board reads as a flat sheet of the same value from the horizon to
     the player's feet, which is the "flat plate" fail condition wearing a
     texture. Row 0 is the far edge. */
  const hz = (1 - z/Math.max(1,MAP.rows-1)) * (.06 + LIGHT.haze*.20);
  if (hz > .004){ pathPoly(P); ctx.fillStyle = rgba(LIGHT.fog, hz); ctx.fill(); }

  /* 🔲 THE CELL DIVISION — and this is the line that used to be
     `rgba('#d2a44e', .30 + nd*.18)`, a 1.2px GOLD stroke on all 168 tiles.
     Together with a rune circle on every one of them it was the single loudest
     reason the board read as "a grid drawn on a photo" (a named BAR R1 fail):
     the brightest, most saturated thing in the frame was the lattice itself.
     The grid still has to be LEGIBLE — this is a tactics game and the player
     picks cells — so it is drawn the way paving is divided instead: a dark
     seam with a thin lit lip on the sunward side of it. That reads as the
     GROUND being divided rather than as jewellery laid on top, and it survives
     both a dark asphalt tile and a pale rubble one because it carries a value
     step in each direction. */
  pathPoly(P);
  ctx.strokeStyle = 'rgba(6,6,10,.38)'; ctx.lineWidth = 1.8; ctx.stroke();
  pathPoly(P);
  ctx.strokeStyle = rgba(mixHexRaw(S.grit, LIGHT.key, .35), .13 + nd*.13);
  ctx.lineWidth = .9; ctx.stroke();
}

/* 🧱 CLIFF FACES. This used to draw three quads from the fixed index pairs
   [[2,3],[1,2],[3,0]] — the front/left/right faces of a CUBE, correct only for
   an axis-aligned box seen from one frozen camera. A hexagon has six edges and
   a free camera swings past all of them, so the visible ones are chosen by
   OUTWARD NORMAL: an edge is front-facing while its normal still points back
   toward the eye. Front faces of a convex prism cannot overlap each other, so
   they need no sort among themselves.
   What is new here is the FLOOR of each face. It used to drop every wall to
   y = 0 regardless of what was next to it, so a four-tile plateau was drawn as
   four separate towers with full-height black seams ruled between them. Each
   edge now falls only as far as the tile on the other side of it, which is what
   turns a cluster of raised tiles into one slab with a terraced skirt. */
function paintWalls(x,z,e,P,lv){
  const Wtop = hexCorners(x,z,TILE_INSET,e);
  const ctr = gw(x,z,e);
  const nb = NB6[z & 1];
  const lh = Math.hypot(lv.x, lv.z) || 1;
  for (let i=0;i<6;i++){
    const j = (i+1)%6;
    const mx = (Wtop[i].x+Wtop[j].x)/2, mz = (Wtop[i].z+Wtop[j].z)/2;
    const nx = mx-ctr.x, nz = mz-ctr.z;
    if (nx*(CAM.pos.x-mx) + nz*(CAM.pos.z-mz) <= 0) continue;       /* back-facing */
    const below = elevOf(x+nb[i][0], z+nb[i][1]);
    if (below >= e - 1e-4) continue;                                 /* flush: no face */
    const B = tilePoly(x,z,TILE_INSET,below); if (!B) continue;
    const nl = Math.hypot(nx,nz) || 1;
    /* Normalise against the light's HORIZONTAL length, not its full length: a
       wall is vertical, so only lv.x/lv.z reach it, and at a high sun those two
       are most of the way to zero. Without this the whole range collapses to
       the middle at noon and "lit differently from the tops" is true in the
       code and invisible on the screen. */
    const lam = clamp(.5 + ((nx/nl)*lv.x + (nz/nl)*lv.z)/lh*.5, 0, 1);
    ctx.beginPath();
    ctx.moveTo(P[i].x,P[i].y); ctx.lineTo(P[j].x,P[j].y);
    ctx.lineTo(B[j].x,B[j].y); ctx.lineTo(B[i].x,B[i].y); ctx.closePath();
    /* vertical gradient: bright at the lip, occluded at the foot */
    const g2 = ctx.createLinearGradient(0, (P[i].y+P[j].y)/2, 0, (B[i].y+B[j].y)/2);
    g2.addColorStop(0, mixHex('#0a0810', LIGHT.key, .10 + lam*.34));
    g2.addColorStop(1, mixHex('#050409', LIGHT.key, .03 + lam*.12));
    ctx.fillStyle = g2; ctx.fill();
    /* a hairline of exposed aggregate along the broken lip */
    ctx.beginPath(); ctx.moveTo(P[i].x,P[i].y); ctx.lineTo(P[j].x,P[j].y);
    ctx.strokeStyle = rgba(mixHexRaw('#8a7f6c', LIGHT.key, .3), .10 + lam*.28);
    ctx.lineWidth = 1.4; ctx.stroke();
  }
}

/* 🌑 The shadow a slab throws onto the level below it. Drawn one row LATE (see
   paintTerrain) because it lands on the tile in FRONT of the slab, which has
   not been painted yet when the slab is. Length comes off the light's own
   elevation, so it lies down at dusk and pulls in at noon. */
function paintShadow(x,z,lv){
  const e = tileElev(x,z); if (e <= 0) return;
  const len = clamp(e/(lv.y+.22), 0, e*3.2);
  const dx = -lv.x*len, dz = -lv.z*len;
  const C = hexCorners(x,z,TILE_INSET,0);
  const nb = NB6[z & 1];
  for (let i=0;i<6;i++){
    const j = (i+1)%6;
    /* only edges the light is leaving cast anything forward */
    const mx = (C[i].x+C[j].x)/2, mz = (C[i].z+C[j].z)/2;
    const w = gw(x,z,0);
    if ((mx-w.x)*dx + (mz-w.z)*dz <= 0) continue;
    const below = elevOf(x+nb[i][0], z+nb[i][1]); if (below >= e-1e-4) continue;
    const q = [ project({x:C[i].x, y:below+.004, z:C[i].z}),
                project({x:C[j].x, y:below+.004, z:C[j].z}),
                project({x:C[j].x+dx, y:below+.004, z:C[j].z+dz}),
                project({x:C[i].x+dx, y:below+.004, z:C[i].z+dz}) ];
    if (!q.every(Boolean)) continue;
    pathPoly(q);
    const g2 = ctx.createLinearGradient(q[0].x,q[0].y, q[2].x,q[2].y);
    g2.addColorStop(0, 'rgba(0,0,0,.46)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2; ctx.fill();
  }
}

/* ── props ────────────────────────────────────────────────────────────────
   BAR R1: props "sit ON the terrain and read as SILHOUETTES — small, numerous,
   irregularly placed. They break up the grid without hiding it", and it names
   "props evenly spaced on a lattice" as a fail condition. So none of these is
   drawn at the tile centre and none at a fixed size: the generator hands every
   tile its own jittered offsets, sizes and headings (see _bbGenTerrain's `deco`
   block in index.html). They are billboards — projected from a world point on
   the slab top, then drawn in screen pixels so they stand UP out of the ground
   instead of lying in it. */
function decoInk(){
  return {
    /* all mixHexRaw: several of these are wrapped in rgba() at use */
    stone : mixHexRaw('#282621', LIGHT.key, .06 + LIGHT.keyI*.06),
    lit   : mixHexRaw('#9a8f7c', LIGHT.key, .30),
    dark  : mixHexRaw('#08070a', LIGHT.key, .02),
    plant : mixHexRaw('#23291a', LIGHT.key, .05),
    plantL: mixHexRaw('#414c2a', LIGHT.key, .10),
    rust  : mixHexRaw('#3a2a1c', LIGHT.key, .08)
  };
}
/* Per-kind size discipline, applied on TOP of the generator's own jitter. The
   generator says where a prop is and how much bigger or smaller than its
   neighbours; how large that KIND reads on screen is a rendering decision and
   belongs here, where it can be tuned against a capture without regenerating
   every map. First pass had waist-high grass and dinner-plate rubble. */
const DECO_K = { chunk:0.62, slab:0.80, kerb:0.78, rebar:0.66, scrub:0.72, tuft:0.46, reed:0.60 };
function paintDeco(x,z,INK){
  const t = tileAt(x,z); if (!t || !t.deco || !t.deco.length) return;
  const e = t.elev || 0, R = hexSize();
  const w = gw(x,z,e);
  for (let i=0;i<t.deco.length;i++){
    const d = t.deco[i];
    const p = project({ x:w.x + (d.u||0)*R, y:e, z:w.z + (d.v||0)*R });
    if (!p) continue;
    const k = p.s * R * (d.s || .5) * (DECO_K[d.k] || .7);   /* pixels, at THIS depth */
    if (k < 1.2) continue;                   /* below a pixel it is only noise */
    /* contact shadow — without it every prop hovers */
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(1,.42);
    ctx.fillStyle = 'rgba(0,0,0,.26)';
    ctx.beginPath(); ctx.arc(0,0,k*.50,0,6.284); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(0);
    paintDecoShape(d, k, INK, (d.r||0));
    ctx.restore();
  }
}
function paintDecoShape(d, k, INK, rot){
  const kind = d.k;
  if (kind === 'chunk' || kind === 'slab' || kind === 'kerb'){
    /* A broken lump of concrete: a dark body with one lit facet on top. Drawn
       as one irregular outline so it reads as a silhouette at 20px, which is
       the size most of these are on screen. */
    const wdt = kind === 'kerb' ? k*1.5 : k*1.05, hgt = kind === 'kerb' ? k*.42 : k*.95;
    const sk = Math.cos(rot)*wdt*.18;
    ctx.beginPath();
    ctx.moveTo(-wdt*.5, 0);
    ctx.lineTo(-wdt*.42 + sk, -hgt*.78);
    ctx.lineTo( wdt*.12 + sk, -hgt);
    ctx.lineTo( wdt*.5,  -hgt*.5);
    ctx.lineTo( wdt*.44, 0);
    ctx.closePath();
    /* Body dark, rim light — BAR R1 wants props that "read as silhouettes",
       and the first pass had it backwards: a big pale lit facet filling the
       whole shape made every chunk look like a flat plate lying on the ground
       rather than a lump standing on it. */
    ctx.fillStyle = INK.stone; ctx.fill();
    ctx.strokeStyle = INK.dark; ctx.lineWidth = Math.max(.6, k*.08); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-wdt*.42 + sk, -hgt*.78);
    ctx.lineTo( wdt*.12 + sk, -hgt);
    ctx.lineTo( wdt*.5,  -hgt*.5);
    ctx.strokeStyle = rgba(INK.lit, .55); ctx.lineWidth = Math.max(.7, k*.10);
    ctx.stroke();
  } else if (kind === 'rebar'){
    /* bent reinforcement bar out of a broken slab */
    ctx.strokeStyle = INK.rust; ctx.lineWidth = Math.max(.9, k*.10);
    ctx.lineCap = 'round';
    for (let i=0;i<3;i++){
      const a = rot + i*1.9;
      ctx.beginPath(); ctx.moveTo((i-1)*k*.16, 0);
      ctx.quadraticCurveTo((i-1)*k*.16 + Math.cos(a)*k*.30, -k*.72,
                           (i-1)*k*.16 + Math.cos(a)*k*.62, -k*.92);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  } else if (kind === 'scrub'){
    /* bare dead thorn bush — the reference's silhouette prop */
    ctx.strokeStyle = INK.plant; ctx.lineWidth = Math.max(.7, k*.075);
    const n = 7;
    for (let i=0;i<n;i++){
      const a = -Math.PI/2 + (i/(n-1) - .5)*2.3 + Math.sin(rot+i)*.18;
      const L = k*(.55 + ((i*7919 % 13)/13)*.55);
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(Math.cos(a)*L*.4, -Math.abs(Math.sin(a))*L*.55,
                           Math.cos(a)*L, -Math.abs(Math.sin(a))*L);
      ctx.stroke();
    }
  } else if (kind === 'tuft' || kind === 'reed'){
    const tall = kind === 'reed' ? 1.5 : 1.0;
    ctx.strokeStyle = kind === 'reed' ? INK.plant : INK.plantL;
    ctx.lineWidth = Math.max(.6, k*.07);
    const n = kind === 'reed' ? 4 : 6;
    for (let i=0;i<n;i++){
      const lean = Math.sin(rot + i*1.7)*.55;
      const L = k*tall*(.5 + ((i*104729 % 11)/11)*.6);
      ctx.beginPath(); ctx.moveTo((i-(n-1)/2)*k*.12, 0);
      ctx.quadraticCurveTo((i-(n-1)/2)*k*.12 + lean*L*.3, -L*.6,
                           (i-(n-1)/2)*k*.12 + lean*L, -L);
      ctx.stroke();
    }
  }
}

/* ── the bake ─────────────────────────────────────────────────────────────
   Row order is far to near (gz 0 is the far edge). Within a row: tops, then
   the shadows cast by the PREVIOUS row — which land on this one, and so have
   to wait until it exists — then this row's props, which the next row's tops
   will correctly occlude. */
function paintTerrain(){
  const lv = lightVector();
  const INK = decoInk();
  /* Stone apron under the grid, out to groundExtent() so the floor reaches the
     frame edges (BAR R1: "the map IS the frame"). The rail on it is now a dark
     kerb with a dim warm lip rather than a bright gold rail: a gold rail you
     can see all four sides of IS the floating plate the bar rejects. */
  const gnd = groundExtent();
  const outer = [
    project({x:-gnd.x-CONFIG.wall, y:-.02, z:-gnd.far-CONFIG.wall}),
    project({x: gnd.x+CONFIG.wall, y:-.02, z:-gnd.far-CONFIG.wall}),
    project({x: gnd.x+CONFIG.wall, y:-.02, z: gnd.near+CONFIG.wall}),
    project({x:-gnd.x-CONFIG.wall, y:-.02, z: gnd.near+CONFIG.wall})
  ];
  if (outer.every(Boolean)){
    pathPoly(outer);
    const g = ctx.createLinearGradient(0, outer[0].y, 0, outer[2].y);
    g.addColorStop(0, mixHex('#0f0c14', LIGHT.key, .10));
    g.addColorStop(1, mixHex('#050409', LIGHT.key, .04));
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = rgba('#0a0810',.85); ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = rgba('#8a6f3a',.22); ctx.lineWidth = 1; ctx.stroke();
  }

  /* ── LOCATION GROUND ART (clipped to the play plane) ── */
  const bq = [
    project({x:-gnd.x, y:0, z:-gnd.far}), project({x:gnd.x, y:0, z:-gnd.far}),
    project({x:gnd.x, y:0, z:gnd.near}),  project({x:-gnd.x, y:0, z:gnd.near})
  ];
  if (bq.every(Boolean) && GROUND.img && GROUND.img.complete && GROUND.img.naturalWidth){
    ctx.save();
    pathPoly(bq); ctx.clip();
    if (GROUND.prev && GROUND.fade < 1 && GROUND.prev.complete) drawGroundSlices(GROUND.prev, 1);
    drawGroundSlices(GROUND.img, GROUND.fade);
    /* light grade: the location sits under the battle's sky */
    const shade = clamp(0.60 - LIGHT.keyI*0.30, 0.10, 0.66);
    pathPoly(bq); ctx.fillStyle = rgba(LIGHT.fog, shade); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    pathPoly(bq); ctx.fillStyle = rgba(LIGHT.key, 0.05 + LIGHT.keyI*0.045); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    const loc = LOCATIONS[MAP.location];
    if (loc && loc.tint){ pathPoly(bq); ctx.fillStyle = loc.tint; ctx.fill(); }
    ctx.restore();
  }

  for (let z=0; z<MAP.rows; z++){
    for (let x=0; x<MAP.cols; x++) paintTile(x,z,lv);
    if (z > 0) for (let x=0; x<MAP.cols; x++) paintShadow(x,z-1,lv);
    for (let x=0; x<MAP.cols; x++) paintDeco(x,z,INK);
  }

  /* grain over the whole play plane, under the horizon fade */
  if (bq.every(Boolean)){
    const pat = noisePattern(ctx);
    if (pat){
      ctx.save(); pathPoly(bq); ctx.clip();
      ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .085;
      ctx.fillStyle = pat; ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
  }

  /* 🌫 THE FAR EDGE, DISSOLVED. groundExtent() deliberately stops the floor at
     the lattice on the far side (the backdrop's horizon is anchored there), so
     the ground used to END in a hard horizontal rule with the sky photograph
     immediately above it — which is precisely what makes a diorama read as a
     PLATE sitting in a painting rather than as the world (BAR R1's first fail
     condition). A band of the sky's own fog laid over the last few rows walks
     the terrain into the horizon instead. Screen-space and one gradient, so it
     costs nothing and it is baked with everything else. */
  /* Anchored to REAL ROW PROJECTIONS, not to a world-z guess. A first pass
     took the band's depth as `-gnd.far + hexV()*3.2` and got a 6px strip that
     sat almost entirely in the SKY — the ground plane is extremely compressed
     right at the far edge, so equal world depth is nothing like equal screen
     depth there. Asking the projector where rows 0 and 3 actually landed is the
     only version of this that cannot be wrong. */
  const yFar = project({x:0, y:0, z:-gnd.far});
  const yIn  = project(gw(0, Math.min(MAP.rows-1, 3), 0));
  if (yFar && yIn && yIn.y > yFar.y + 6){
    const top = yFar.y - 4, bot = yIn.y;
    const fade = ctx.createLinearGradient(0, top, 0, bot);
    fade.addColorStop(0, rgba(LIGHT.fog, .50));
    fade.addColorStop(.30, rgba(LIGHT.fog, .26));
    fade.addColorStop(1, rgba(LIGHT.fog, 0));
    ctx.fillStyle = fade; ctx.fillRect(0, top, W, bot - top);
  }
  /* the near row's own shadows have nothing in front of them to land on, so
     there is deliberately no trailing paintShadow pass */
}

/* ══════════════════════════════════════════════════════════════════
   drawBoard — one blit, then only what MOVES.
   ══════════════════════════════════════════════════════════════════ */
function drawBoard(){
  const layer = terrainLayer();
  if (layer) ctx.drawImage(layer, 0, 0, W, H);

  /* Everything below is per-frame, and it is deliberately driven off the PAINT
     sets rather than off a 14x12 sweep: in a normal frame nothing is painted
     and this loop runs zero times. */
  const seen = Object.create(null);
  const live = [];
  const push = (x,z,col) => {
    if (x < 0 || z < 0 || x >= MAP.cols || z >= MAP.rows) return;
    const k = x+','+z; if (seen[k]) return; seen[k] = 1; live.push({x:x,z:z,col:col});
  };
  for (const k of PAINT.attack){ const c = k.indexOf(','); push(+k.slice(0,c), +k.slice(c+1), '#ff5a4a'); }
  for (const k of PAINT.move)  { const c = k.indexOf(','); push(+k.slice(0,c), +k.slice(c+1), '#4fd0ff'); }
  for (const k of PAINT.place) { const c = k.indexOf(','); push(+k.slice(0,c), +k.slice(c+1), '#7fe89f'); }
  for (const k of PAINT.swap)  { const c = k.indexOf(','); push(+k.slice(0,c), +k.slice(c+1), '#e0b64a'); }
  for (const d of live){
    const P = tilePoly(d.x,d.z,TILE_INSET); if (!P) continue;
    const pulse = 0.16 + Math.sin(T*3 + (d.x+d.z)*0.6)*0.05;
    pathPoly(P); ctx.fillStyle = rgba(d.col, pulse + 0.16); ctx.fill();
    pathPoly(P); ctx.strokeStyle = rgba(d.col, 0.85); ctx.lineWidth = 2; ctx.stroke();
  }

  /* 🔮 RUNES BELONG ON TILES THAT MEAN SOMETHING.
     drawRune() used to be called for all 168 tiles, every frame: 168 pulsing
     gold rune circles laid over a photograph, which is exactly the "grid drawn
     on a photo" BAR R1 rejects — and ~2,500 path ops a frame for it. A rune is
     a marker, so it now marks: the objective tiles, the selected tile, and the
     focused one. Everything else is ground. */
  if (Array.isArray(MAP.tiles)){
    for (let i=0;i<MAP.tiles.length;i++){
      const t = MAP.tiles[i];
      if (t && t.type === 'objective') drawRune(t.x, t.z, .8, t);
    }
  }
  if (PAINT.sel){
    const P = tilePoly(PAINT.sel.x, PAINT.sel.z, TILE_INSET);
    if (P){ drawRune(PAINT.sel.x, PAINT.sel.z, 1, tileAt(PAINT.sel.x, PAINT.sel.z));
      pathPoly(P); ctx.strokeStyle = rgba('#f6dc95', 0.95); ctx.lineWidth = 3; ctx.stroke(); }
  }
  if (hoverTile){
    const P = tilePoly(hoverTile.x, hoverTile.z, TILE_INSET);
    if (P){ pathPoly(P); ctx.fillStyle = rgba('#f6dc95', .12); ctx.fill();
      ctx.strokeStyle = rgba('#f6dc95',.9); ctx.lineWidth = 2; ctx.stroke(); }
  }
  if (focus){
    const P = tilePoly(focus.x, focus.z, TILE_INSET);
    if (P){ drawRune(focus.x, focus.z, 1, tileAt(focus.x, focus.z));
      pathPoly(P); ctx.strokeStyle = rgba('#7fe89f',.9); ctx.lineWidth = 2.4; ctx.stroke(); }
  }
  drawFrame();
}

function drawRune(gx,gz,nd,t){
  const c = project(gw(gx,gz, tileElev(gx,gz)+.002)); if (!c) return;
  const R = ringPx(c, tileR() * 0.68);          /* 0.68 of the hex inradius */
  const pulse = .5 + Math.sin(T*1.1 + gx*.7 + gz*.9)*.5;
  const col = t && t.type==='objective' ? '#f6dc95' : '#d2a44e';
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, .46);
  ctx.strokeStyle = rgba(col, .18 + pulse*.16*nd); ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,R*.62,0,7); ctx.stroke();
  ctx.strokeStyle = rgba(col, .3 + pulse*.2*nd);
  for (let i=0;i<8;i++){
    const a = i*Math.PI/4 + T*.06;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*R*.62, Math.sin(a)*R*.62);
    ctx.lineTo(Math.cos(a)*R, Math.sin(a)*R); ctx.stroke();
  }
  ctx.beginPath();
  for (let i=0;i<4;i++){
    const a = i*Math.PI/2 + Math.PI/4 + T*.06;
    ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*R*.5, Math.sin(a)*R*.5);
  }
  ctx.stroke();
  ctx.restore();
}

/* ornate gold frame + corner brazier pylons (reference art) */
function drawFrame(){
  const ext = boardExtent();
  /* Centred on the lattice, not on the origin: odd rows are shifted +½ column
     so the hexes are not symmetric about x=0, and a frame that is would sit a
     quarter hex off to one side of the field it is framing. */
  const tx = latticeCentreX();
  const hw = ext.x + CONFIG.wall, hh = ext.z + CONFIG.wall;
  const corners = [ {x:tx-hw,z:-hh}, {x:tx+hw,z:-hh}, {x:tx+hw,z:hh}, {x:tx-hw,z:hh} ];
  /* frame band */
  const top = corners.map(c => project({x:c.x, y:.14, z:c.z}));
  const bot = corners.map(c => project({x:c.x, y:-.02, z:c.z}));
  if (top.every(Boolean) && bot.every(Boolean)){
    for (let i=0;i<4;i++){
      const j = (i+1)%4;
      ctx.beginPath();
      ctx.moveTo(top[i].x,top[i].y); ctx.lineTo(top[j].x,top[j].y);
      ctx.lineTo(bot[j].x,bot[j].y); ctx.lineTo(bot[i].x,bot[i].y); ctx.closePath();
      /* Weathered concrete kerb with a dim warm lip, not a gold rail. This band
         used to run f6dc95 -> a97f2e -> 4a3616 at half alpha, which put the
         single most saturated object in the frame around the OUTSIDE of the
         battlefield — a picture frame drawn on the world, when BAR R1 wants the
         world to BE the frame. The geometry is unchanged; only its material is. */
      const g = ctx.createLinearGradient(top[i].x,top[i].y, bot[i].x,bot[i].y);
      g.addColorStop(0, rgba(mixHexRaw('#6a6154', LIGHT.key, .22), .55));
      g.addColorStop(.45, rgba('#39332a',.5)); g.addColorStop(1, rgba('#14110d',.6));
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = rgba('#c8a765',.20); ctx.lineWidth = 1.2; ctx.stroke();
    }
  }
  /* pillars are depth-sorted with units — see drawPylon() */
}

/* ══════════════════════════════════════════════════════════════════
   BOARD EVENTS  ── FOR CLAUDE CODE ──
   Houses, wrecked cars and the like are NOT scenery in this game — they
   are EVENTS that occupy a tile until they are resolved. The board only
   RENDERS them; the game's event system owns their behaviour.

   WIRE THESE UP:
     Board.spawnEvent(type, x, z)   place an event on a tile (deck/turn/
                                    script driven). Fires 'board:eventSpawn'.
     Board.triggerEvent(x, z)       resolve it — call when a unit enters the
                                    tile, when the turn ticks, or when a card
                                    targets it. Fires 'board:eventTrigger'
                                    with { type, x, z, unitId } so the game
                                    can apply the actual effect (loot, ambush
                                    spawn, damage, heal, buff …).
     Board.clearEvent(x, z)         remove it once resolved/expired.
                                    Fires 'board:eventClear'.
     Board.eventsAt(x, z)           query.

   The demo auto-triggers an event when a unit finishes a move onto its
   tile — replace that call with the game's real resolution rules.
   Each event type below needs: display name, colour, icon, and whether it
   BLOCKS movement (a house/car would; a supply drop would not).
   Art: swap `icon` for the event's real sprite — the pad, pillar of light
   and float animation stay.
   ══════════════════════════════════════════════════════════════════ */
const EVENT_TYPES = {
  'supply-drop':{ name:'Supply Drop',  color:'#f0c96e', icon:'crate',  blocks:false },
  'ambush'     :{ name:'Ambush',       color:'#e04a3a', icon:'skull',  blocks:false },
  'relic'      :{ name:'Relic Cache',  color:'#a35cff', icon:'star',   blocks:false },
  'medical'    :{ name:'Medical Camp', color:'#4ad8c8', icon:'cross',  blocks:false },
  'bloom'      :{ name:'Toxic Bloom',  color:'#8fd84a', icon:'spore',  blocks:false },
  'structure'  :{ name:'Structure',    color:'#b0a48a', icon:'block',  blocks:true  }
};
const EV_ICON = {
  crate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>',
  skull:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a7 7 0 00-7 7c0 2.6 1.4 4.8 3.5 6V19h7v-3c2.1-1.2 3.5-3.4 3.5-6a7 7 0 00-7-7zm-2.5 7a1.2 1.2 0 110-2.4 1.2 1.2 0 010 2.4zm5 0a1.2 1.2 0 110-2.4 1.2 1.2 0 010 2.4z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2-6.3-4.5-6.3 4.5L8 13.8 2 9.2h7.6z"/></svg>',
  cross:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4h6v5h5v6h-5v5H9v-5H4V9h5z"/></svg>',
  spore:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><circle cx="6" cy="7" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="7" cy="18" r="2"/></svg>',
  block:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="7" width="14" height="12"/><path d="M5 11h14M12 11v8"/></svg>'
};
function eventsAt(x,z){ return (MAP.events||[]).filter(e => e.x===x && e.z===z); }
// 🗿 SET THE WHOLE EVENT LIST from the host. Called on board:init and whenever
// the game respawns events. Unknown types fall back to 'relic' rather than being
// dropped — a custom Forge event has no entry in EVENT_TYPES and must still show.
function setEvents(list){
  MAP.events = [];
  for (const e of (Array.isArray(list) ? list : [])){
    if (!e || typeof e.x !== 'number' || typeof e.z !== 'number') continue;
    spawnEvent(e.type, e.x, e.z, e);
  }
}
function spawnEvent(type, x, z, opts){
  opts = opts || {};
  if (!EVENT_TYPES[type]) type = 'relic';        // custom Forge events land here
  MAP.events = MAP.events || [];
  const ev = { x, z, type, born:T,
    // 📦 model: a PNG baked from the admin's uploaded .glb, drawn standing on
    // the tile. `scale` is an admin trim in (0,1] — it can only make it SMALLER;
    // the tile footprint is the ceiling and is enforced in drawEvent.
    art:   opts.art   || opts.model || null,
    scale: Math.max(.2, Math.min(1, +opts.scale || 1)),
    name:  opts.name  || null,
    color: opts.color || null };
  MAP.events.push(ev);
  effects.push({ k:'ring', x:gw(x,z).x, z:gw(x,z).z, t:0, dur:.8, col:EVENT_TYPES[type].color, r0:.1, r1:.9 });
  dispatch('eventSpawn', { type, x, z });
  return ev;
}
function triggerEvent(x, z, unitId){
  const list = eventsAt(x,z); if (!list.length) return;
  for (const ev of list){
    const T2 = EVENT_TYPES[ev.type];
    burst(gw(x,z).x, gw(x,z).z, .9, 30, T2.color);
    effects.push({ k:'ring', x:gw(x,z).x, z:gw(x,z).z, t:0, dur:.6, col:T2.color, r0:.15, r1:1.3 });
    effects.push({ k:'float', x:gw(x,z).x, z:gw(x,z).z, t:0, dur:1.2, txt:T2.name.toUpperCase(), col:T2.color });
    /* ← REPLACE: hand off to the game's event resolution here */
    dispatch('eventTrigger', { type:ev.type, x, z, unitId:unitId||null });
  }
  clearEvent(x,z);
}
function clearEvent(x, z){
  if (!MAP.events) return;
  const before = MAP.events.length;
  MAP.events = MAP.events.filter(e => !(e.x===x && e.z===z));
  if (MAP.events.length !== before) dispatch('eventClear', { x, z });
}
function drawEvent(ev){
  let E = EVENT_TYPES[ev.type]; if (!E) return;
  // A host event can override the palette entry's name/colour without needing a
  // new EVENT_TYPES row — custom Forge events have no row of their own.
  if (ev.color || ev.name) E = { ...E, color: ev.color || E.color, name: ev.name || E.name };
  const el = tileElev(ev.x, ev.z);
  const c = project(gw(ev.x, ev.z, el + .01));
  if (!c) return;
  const R = ringPx(c, tileR() * 0.80);          /* 0.80 of the hex inradius */
  const pulse = .5 + Math.sin(T*2.2 + ev.x + ev.z)*.5;

  /* glowing pad on the tile */
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, .44);
  const g = ctx.createRadialGradient(0,0,0,0,0,R);
  g.addColorStop(0, rgba(E.color, .38 + pulse*.22));
  g.addColorStop(.6, rgba(E.color, .16));
  g.addColorStop(1, rgba(E.color, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill();
  ctx.strokeStyle = rgba(E.color, .6 + pulse*.35); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,0,R*.86,0,7); ctx.stroke();
  ctx.setLineDash([R*.22, R*.16]); ctx.lineWidth = 1.4; ctx.rotate(T*.5);
  ctx.beginPath(); ctx.arc(0,0,R*.62,0,7); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  /* pillar of light */
  const topP = project(gw(ev.x, ev.z, el + 1.5));
  if (topP){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const pg = ctx.createLinearGradient(c.x, c.y, topP.x, topP.y);
    pg.addColorStop(0, rgba(E.color, .30 + pulse*.10));
    pg.addColorStop(1, rgba(E.color, 0));
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.moveTo(c.x-R*.6, c.y); ctx.lineTo(c.x+R*.6, c.y);
    ctx.lineTo(topP.x+R*.22, topP.y); ctx.lineTo(topP.x-R*.22, topP.y);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  /* 📦 3D MODEL — a PNG baked from the event's .glb, standing ON the tile.
     THE FIT RULE: `R` is the tile's half-width in projected pixels, so the model
     is drawn at most 2R wide (exactly one tile) and 2R*1.6 tall. Whichever limit
     binds first wins, so the aspect ratio is preserved and the footprint can
     never spill onto a neighbouring tile no matter what was uploaded. */
  const mdl = ev.art ? artImage(ev.art) : null;
  if (mdl && mdl.naturalWidth > 0){
    const maxW = R*2*ev.scale, maxH = R*3.2*ev.scale;
    const k = Math.min(maxW / mdl.naturalWidth, maxH / mdl.naturalHeight);
    const dw = mdl.naturalWidth*k, dh = mdl.naturalHeight*k;
    const bob2 = Math.sin(T*1.4 + ev.x*1.7)*(R*.05);
    ctx.save();
    /* contact shadow so it reads as standing on the tile, not floating over it */
    ctx.globalAlpha = .34; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, dw*.34, dw*.34*.42, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    /* baseline sits at the tile centre — the model stands, it does not hover */
    ctx.drawImage(mdl, c.x - dw/2, c.y - dh + bob2, dw, dh);
    ctx.restore();
    return;                       /* the model replaces the glyph badge entirely */
  }

  /* floating marker — shown when the event has no model */
  const bob = Math.sin(T*1.6 + ev.x*1.7)*.06;
  const m = project(gw(ev.x, ev.z, el + .62 + bob));
  if (m){
    const s = R*.62;
    ctx.save(); ctx.translate(m.x, m.y);
    ctx.rotate(Math.sin(T*.9 + ev.z)*.06);
    ctx.fillStyle = rgba('#07050c', .78);
    ctx.beginPath();
    for (let i=0;i<6;i++){ const a=i*Math.PI/3 - Math.PI/2;
      const px2=Math.cos(a)*s, py2=Math.sin(a)*s; i?ctx.lineTo(px2,py2):ctx.moveTo(px2,py2); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba(E.color, .85); ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    /* icon */
    ctx.save(); ctx.translate(m.x - s*.55, m.y - s*.55);
    const k2 = s*1.1/24;
    ctx.scale(k2,k2); ctx.strokeStyle = E.color; ctx.fillStyle = E.color; ctx.lineWidth = 1.7;
    drawEvIcon(E.icon);
    ctx.restore();
  }
}
function drawEvIcon(kind){
  ctx.beginPath();
  if (kind==='crate'){ ctx.moveTo(4,8); ctx.lineTo(12,4); ctx.lineTo(20,8); ctx.lineTo(20,16);
    ctx.lineTo(12,20); ctx.lineTo(4,16); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4,8); ctx.lineTo(12,12); ctx.lineTo(20,8); ctx.moveTo(12,12); ctx.lineTo(12,20); ctx.stroke(); }
  else if (kind==='skull'){ ctx.arc(12,10,6,0,7); ctx.fill();
    ctx.fillStyle='#07050c'; ctx.beginPath(); ctx.arc(9.6,10,1.3,0,7); ctx.arc(14.4,10,1.3,0,7); ctx.fill(); }
  else if (kind==='star'){ for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r=i%2?4:9;
      const x=12+Math.cos(a)*r, y=12+Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.closePath(); ctx.fill(); }
  else if (kind==='cross'){ ctx.moveTo(9,4); ctx.lineTo(15,4); ctx.lineTo(15,9); ctx.lineTo(20,9);
    ctx.lineTo(20,15); ctx.lineTo(15,15); ctx.lineTo(15,20); ctx.lineTo(9,20); ctx.lineTo(9,15);
    ctx.lineTo(4,15); ctx.lineTo(4,9); ctx.lineTo(9,9); ctx.closePath(); ctx.fill(); }
  else if (kind==='spore'){ ctx.arc(12,12,4,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(6,7,2,0,7); ctx.arc(18,8,2,0,7); ctx.arc(7,18,2,0,7); ctx.stroke(); }
  else { ctx.rect(5,7,14,12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(5,11); ctx.lineTo(19,11); ctx.moveTo(12,11); ctx.lineTo(12,19); ctx.stroke(); }
}

/* ══════════════════════════════════════════════════════════════════
   BRAZIER PYLON — carved stone column with gold banding and a fire bowl,
   built to match the reference art. Drawn from projected world points so
   it keeps correct perspective, and depth-sorted with units/props.
   (Three.js: replace with a GLTF pylon; keep the bowl anchor at y=1.46
   so the flame emitter position is unchanged.)
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   PYLON ART SLOT — replace the carved pylon with your own artwork:
     Board.setPylonArt('assets/pylon.png')                       // static
     Board.setPylonArt('assets/pylon_sheet.png', {frames:8, fps:12})
   NOTE ON GIFs: a 2D canvas (and a Three.js texture) will only ever show
   the FIRST frame of an animated .gif — the format can't be sampled per
   frame. Export the animation as a horizontal SPRITE SHEET (png/webp) and
   pass {frames, fps}; that's what this slot and the engine both want.
   widthWorld/heightWorld are in board tiles, so the art scales with the
   camera automatically. The flame emitter stays at PYLON.top regardless,
   so set bowlY to wherever the bowl sits in YOUR art.
   ══════════════════════════════════════════════════════════════════ */
const PYLON_ART = {
  img:null, frames:1, fps:12,
  /* Sprite is 360x489. These are measured off the bake, not guessed:      */
  widthWorld:1.72, heightWorld:2.34,   /* preserves the 0.736 aspect        */
  anchorY:0.80,        /* GROUND LINE in the sprite (the base slab sits at  */
                       /* 80% down; the last 20% is the platform's front    */
                       /* edge, which must hang toward the viewer)          */
  fireY:0.070,         /* fire bowl, fraction from the sprite TOP           */
  emitY:0.150,         /* capital gem — the hologram projector             */
  flames:true,         /* fire burns from the bowl                          */
  src:'../assets/board/pylon.png'      /* baked from pillars.glb, yaw 270° (serpent head-on) */
};
function setPylonArt(src, opts){
  Object.assign(PYLON_ART, opts||{});
  if (src === null){ PYLON_ART.img = null; return; }
  const im = new Image();
  im.onload = () => { PYLON_ART.img = im; seedBraziers(); };
  im.src = src || PYLON_ART.src;
  if (opts && typeof opts.bowlY === 'number'){ PYLON.top = opts.bowlY; seedBraziers(); }
}
const PYLON = { plinth:0.44, base:0.34, shaft0:0.215, shaft1:0.185, cap:0.30, bowl:0.40, rim:0.44, top:1.46 };
function bandQuad(px, pz, y0, y1, hw0, hw1){
  const a = project({x:px-hw0, y:y0, z:pz}), b = project({x:px+hw0, y:y0, z:pz});
  const c = project({x:px+hw1, y:y1, z:pz}), d = project({x:px-hw1, y:y1, z:pz});
  return (a&&b&&c&&d) ? [a,b,c,d] : null;
}
function fillBand(q, c0, c1){
  if (!q) return;
  ctx.beginPath(); ctx.moveTo(q[0].x,q[0].y); ctx.lineTo(q[1].x,q[1].y);
  ctx.lineTo(q[2].x,q[2].y); ctx.lineTo(q[3].x,q[3].y); ctx.closePath();
  const g = ctx.createLinearGradient(q[0].x, q[0].y, q[3].x, q[3].y);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.fill();
}
function drawPylon(br){
  const px = br.x, pz = br.z, P = PYLON;
  /* custom art takes over completely (sprite-sheet aware) */
  if (PYLON_ART.img && PYLON_ART.img.complete && PYLON_ART.img.naturalWidth){
    const base = project({x:px, y:0, z:pz});
    const top  = project({x:px, y:PYLON_ART.heightWorld, z:pz});
    const side = project({x:px + PYLON_ART.widthWorld/2, y:0, z:pz});
    if (base && top && side){
      shadowEllipse({x:px, y:0, z:pz}, .62, .85);
      const wpx = Math.abs(side.x - base.x)*2, hpx = Math.abs(base.y - top.y);
      const img = PYLON_ART.img;
      const fw = img.naturalWidth / Math.max(1, PYLON_ART.frames);
      const fi = PYLON_ART.frames > 1 ? Math.floor(T*PYLON_ART.fps) % PYLON_ART.frames : 0;
      /* NO mirroring — every pillar faces the camera, serpent head-on.
         Anchored on the sprite's ground line so the base slab sits ON the
         floor and its front edge overhangs toward the camera. */
      const A = PYLON_ART.anchorY;
      const topY = base.y - hpx*A;
      ctx.drawImage(img, fi*fw, 0, fw, img.naturalHeight,
                    base.x - wpx/2, topY, wpx, hpx);
      /* ── SPRITE-SPACE ANCHORS ──────────────────────────────────────────
         The pillar is a BILLBOARD, but a world point directly above a corner
         pillar projects further from screen-centre than its base (raising y
         reduces depth, which magnifies the x offset). Anchoring VFX to world
         coordinates therefore slides them off the side of the flat sprite.
         So the bowl/lens anchors are taken from the PAINTED sprite rect —
         the fire always sits exactly on the bowl, at any camera angle.
         (Three.js: with real geometry this goes away — use the mesh's bone
         or an empty at the bowl, and delete this block.) */
      br._spr = {
        x: base.x,
        fireY: topY + hpx*PYLON_ART.fireY,
        emitY: topY + hpx*PYLON_ART.emitY,
        s: wpx                                 /* scale unit = pillar width */
      };
    }
    if (PYLON_ART.flames) drawFlames(br);
    drawHoloBeam(br);           /* beam draws OVER its own pillar */
    return;
  }
  const lv = lightVector();
  /* stone tones react to the sun/moon */
  const stoneD = mixHex('#171219', LIGHT.key, .06);
  const stoneM = mixHex('#2e2733', LIGHT.key, .14);
  const stoneL = mixHex('#4a4150', LIGHT.key, .22);
  const goldD = mixHex('#6b4c17', LIGHT.key, .12);
  const goldM = mixHex('#c8963a', LIGHT.key, .18);
  const goldL = mixHex('#f6dc95', LIGHT.key, .10);

  /* ground shadow */
  shadowEllipse({x:px, y:0, z:pz}, .5, .85);

  /* --- stepped plinth --- */
  fillBand(bandQuad(px,pz, 0,    0.10, P.plinth, P.plinth*0.97), stoneM, stoneD);
  fillBand(bandQuad(px,pz, 0.10, 0.20, P.plinth*0.97, P.base),   stoneL, stoneM);
  /* gold line on the plinth lip */
  let q = bandQuad(px,pz, 0.195, 0.215, P.base*1.02, P.base*1.02);
  fillBand(q, goldM, goldD);

  /* --- base molding --- */
  fillBand(bandQuad(px,pz, 0.215, 0.31, P.base, P.shaft0*1.16), stoneL, stoneM);

  /* --- fluted shaft --- */
  const shaft = bandQuad(px,pz, 0.31, 1.02, P.shaft0, P.shaft1);
  if (shaft){
    ctx.beginPath(); ctx.moveTo(shaft[0].x,shaft[0].y); ctx.lineTo(shaft[1].x,shaft[1].y);
    ctx.lineTo(shaft[2].x,shaft[2].y); ctx.lineTo(shaft[3].x,shaft[3].y); ctx.closePath();
    const sg = ctx.createLinearGradient(shaft[0].x, 0, shaft[1].x, 0);
    /* lit edge follows the light direction */
    const litLeft = lv.x < 0;
    sg.addColorStop(0, litLeft ? stoneL : stoneD);
    sg.addColorStop(.42, stoneM);
    sg.addColorStop(1, litLeft ? stoneD : stoneL);
    ctx.fillStyle = sg; ctx.fill();
    /* flutes */
    ctx.strokeStyle = rgba('#0a0810',.5); ctx.lineWidth = 1;
    for (const f of [-0.5, 0, 0.5]){
      const a = project({x:px + P.shaft0*f, y:0.33, z:pz});
      const b = project({x:px + P.shaft1*f, y:1.00, z:pz});
      if (a&&b){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    /* gold bands up the shaft */
    for (const y of [0.44, 0.70]){
      const hw = lerp(P.shaft0, P.shaft1, (y-0.31)/0.71) * 1.10;
      fillBand(bandQuad(px,pz, y, y+0.035, hw, hw), goldL, goldD);
    }
  }

  /* --- capital / flare --- */
  fillBand(bandQuad(px,pz, 1.02, 1.14, P.shaft1, P.cap), stoneL, stoneM);
  fillBand(bandQuad(px,pz, 1.14, 1.175, P.cap*1.04, P.cap*1.04), goldL, goldM);

  /* --- fire bowl --- */
  fillBand(bandQuad(px,pz, 1.175, 1.40, P.cap, P.bowl), goldD, goldM);
  fillBand(bandQuad(px,pz, 1.40, P.top, P.bowl, P.rim), goldM, goldL);
  /* rim ellipse + hot interior */
  const c = project({x:px, y:P.top, z:pz});
  if (c){
    /* P.rim is the bowl's own radius in world units — a property of the pillar,
       not of the lattice, so it is NOT expressed against tileR(). */
    const R = ringPx(c, P.rim);
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, .42);
    /* bowl interior glow */
    const bg = ctx.createRadialGradient(0,0,0,0,0,R);
    bg.addColorStop(0, 'rgba(255,220,150,.95)');
    bg.addColorStop(.55, 'rgba(255,140,40,.6)');
    bg.addColorStop(1, 'rgba(120,40,10,.35)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill();
    /* gold rim */
    ctx.strokeStyle = goldL; ctx.lineWidth = Math.max(1.6, R*.14);
    ctx.beginPath(); ctx.arc(0,0,R*.99,0,7); ctx.stroke();
    ctx.strokeStyle = rgba('#f6dc95',.55); ctx.lineWidth = Math.max(1, R*.05);
    ctx.beginPath(); ctx.arc(0,0,R*.82,0,7); ctx.stroke();
    ctx.restore();
  }
  /* small gold brackets under the bowl */
  for (const s of [-1, 1]){
    const a = project({x:px + s*P.cap*0.95, y:1.10, z:pz});
    const b = project({x:px + s*P.bowl*1.02, y:1.34, z:pz});
    if (a&&b){
      ctx.strokeStyle = goldM; ctx.lineWidth = Math.max(1.4, (a.s||1)*.02);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(a.x + s*6, (a.y+b.y)/2, b.x, b.y); ctx.stroke();
    }
  }
  /* flickering light pool cast on the ground */
  const gb = project({x:px, y:0.01, z:pz});
  if (gb){
    const w = Math.abs((project({x:px+1, y:0.01, z:pz})||gb).x - gb.x);
    const flick = .17 + Math.sin(T*11 + px*3)*.045 + Math.sin(T*23.7 + pz)*.025;
    const lg = ctx.createRadialGradient(gb.x, gb.y, 0, gb.x, gb.y, w*2.6);
    lg.addColorStop(0, `rgba(255,150,60,${flick})`);
    lg.addColorStop(.5, `rgba(255,110,40,${flick*.42})`);
    lg.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.ellipse(gb.x, gb.y, w*2.6, w*1.1, 0, 0, 7); ctx.fill();
  }
  /* this pylon's flames + its projection beam */
  const bc = project({x:px, y:P.top, z:pz});
  if (bc) br._spr = { x:bc.x, fireY:bc.y, emitY:bc.y, s:ringPx(bc, P.rim)*2.6 };
  drawFlames(br);
  drawHoloBeam(br);
}

/* ══════════════════════════════════════════════════════════════════
   HOLOGRAM BEAM — each pillar projects a soft light cone onto the play
   field. Deliberately gentle: low opacity, slow breathing, feathered
   edges, drifting scan bands. It should read as ambient projection, not
   a spotlight — nothing here should ever clip to a hard edge.
   Tune with HOLO. (Three.js: a cone mesh with an additive, depth-write-off
   shader + a decal/projected texture for the floor pool. Keep the same
   alphas — they are the reason it settles instead of glaring.)
   ══════════════════════════════════════════════════════════════════ */
const HOLO = {
  emitFrac: 0.150,  /* projector height as a fraction from the sprite TOP   */
  frontOff: 0.30,   /* step the lens out along the beam, in PILLAR WIDTHS,  */
                    /* so the cone leaves the FRONT face, never the back     */
  inset:    0.34,   /* where the beam lands, as a fraction of the corner    */
  r0:       0.16,   /* beam radius at the lens, in pillar widths            */
  r1:       1.05,   /* beam radius on the floor                             */
  alpha:    0.115,  /* base opacity — deliberately low                      */
  breathe:  0.030,
  period:   5.2,
  bands:    7,
  colA:  '#7fe6ff',
  colB:  '#8f7cff'
};
let holoIn = 0;      /* fades up on load so it settles in */

/* Emitter for one pillar: at the capital gem, pushed toward board centre so
   the cone visibly leaves the pillar's FRONT and never clips through it. */
function drawHoloBeam(br){
  if (holoIn <= 0.001) return;
  const S = br._spr; if (!S) return;
  const pulse = HOLO.alpha + Math.sin(T*(Math.PI*2/HOLO.period) + br.seed)*HOLO.breathe;
  const A = clamp(pulse, 0.04, 0.2) * holoIn;
  /* landing point is a real world position on the play field */
  const g = project({ x: br.x*HOLO.inset, y: 0.02, z: br.z*HOLO.inset });
  if (!g) return;
  /* lens sits on the PAINTED capital gem, then steps out along the beam so
     the cone leaves the pillar's front face instead of clipping through it */
  let o = { x: S.x, y: S.emitY, s: S.s };
  const ddx = g.x-o.x, ddy = g.y-o.y, dl = Math.hypot(ddx,ddy) || 1;
  o = { x: o.x + (ddx/dl)*S.s*HOLO.frontOff, y: o.y + (ddy/dl)*S.s*HOLO.frontOff, s: S.s };
  const dx = g.x-o.x, dy = g.y-o.y, L = Math.hypot(dx,dy) || 1;
  const nx = -dy/L, ny = dx/L;
  const r0 = HOLO.r0 * S.s, r1 = HOLO.r1 * g.s;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  /* the cone — feathered along its length, never a hard edge */
  const grad = ctx.createLinearGradient(o.x, o.y, g.x, g.y);
  grad.addColorStop(0,   rgba(HOLO.colA, A*1.25));
  grad.addColorStop(.18, rgba(HOLO.colA, A*.85));
  grad.addColorStop(.60, rgba(HOLO.colA, A*.42));
  grad.addColorStop(1,   rgba(HOLO.colB, A*.12));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(o.x + nx*r0, o.y + ny*r0);
  ctx.lineTo(o.x - nx*r0, o.y - ny*r0);
  ctx.lineTo(g.x - nx*r1, g.y - ny*r1);
  ctx.lineTo(g.x + nx*r1, g.y + ny*r1);
  ctx.closePath(); ctx.fill();

  /* drifting scan bands */
  for (let i=0;i<HOLO.bands;i++){
    const t = (i/HOLO.bands + T*0.085) % 1;
    const fade = Math.sin(t*Math.PI);
    const t2 = Math.min(1, t + 0.035);
    const bw = lerp(r0,r1,t),  bx = lerp(o.x,g.x,t),  by = lerp(o.y,g.y,t);
    const bw2 = lerp(r0,r1,t2), bx2 = lerp(o.x,g.x,t2), by2 = lerp(o.y,g.y,t2);
    ctx.fillStyle = rgba(HOLO.colA, A*0.30*fade);
    ctx.beginPath();
    ctx.moveTo(bx + nx*bw,   by + ny*bw);
    ctx.lineTo(bx - nx*bw,   by - ny*bw);
    ctx.lineTo(bx2 - nx*bw2, by2 - ny*bw2);
    ctx.lineTo(bx2 + nx*bw2, by2 + ny*bw2);
    ctx.closePath(); ctx.fill();
  }

  /* projector lens on the pillar face */
  const lg = ctx.createRadialGradient(o.x,o.y,0, o.x,o.y, r0*5.5);
  lg.addColorStop(0,   rgba('#dffaff', A*2.6));
  lg.addColorStop(.35, rgba(HOLO.colA, A*1.1));
  lg.addColorStop(1,   rgba(HOLO.colA, 0));
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(o.x,o.y,r0*5.5,0,7); ctx.fill();

  /* floor pool + slow rings */
  ctx.save(); ctx.translate(g.x, g.y); ctx.scale(1, .44);
  const pg = ctx.createRadialGradient(0,0,0,0,0,r1*1.3);
  pg.addColorStop(0,   rgba(HOLO.colA, A*1.5));
  pg.addColorStop(.55, rgba(HOLO.colB, A*.55));
  pg.addColorStop(1,   rgba(HOLO.colB, 0));
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0,0,r1*1.3,0,7); ctx.fill();
  for (let i=0;i<3;i++){
    const rt = ((T*0.16) + i/3) % 1;
    ctx.strokeStyle = rgba(HOLO.colA, A*0.8*(1-rt));
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0,0, r1*(0.25 + rt*1.05), 0, 7); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════
   FIRE — real flame: a live particle column per brazier. Each puff is
   born hot and white, rises + narrows, cools yellow → orange → red, then
   turns to smoke. Additive blending on the hot stages does the glow.
   (Three.js: port as a GPU particle system / instanced quads with the
   same colour ramp + the same lifetime curve.)
   ══════════════════════════════════════════════════════════════════ */
const FLAME_RAMP = [
  { p:0.00, c:[255,252,235], a:0.95 },   /* white core            */
  { p:0.16, c:[255,232,150], a:0.92 },   /* yellow                */
  { p:0.36, c:[255,170,52],  a:0.80 },   /* orange                */
  { p:0.58, c:[236,96,26],   a:0.55 },   /* deep orange           */
  { p:0.76, c:[150,44,18],   a:0.28 },   /* red, going out        */
  { p:1.00, c:[46,40,40],    a:0.00 }    /* smoke                 */
];
function flameColor(p){
  for (let i=0;i<FLAME_RAMP.length-1;i++){
    const A = FLAME_RAMP[i], B = FLAME_RAMP[i+1];
    if (p <= B.p){
      const k = (p - A.p)/(B.p - A.p || 1);
      return { r:Math.round(lerp(A.c[0],B.c[0],k)), g:Math.round(lerp(A.c[1],B.c[1],k)),
               b:Math.round(lerp(A.c[2],B.c[2],k)), a:lerp(A.a,B.a,k) };
    }
  }
  return { r:46, g:40, b:40, a:0 };
}
let braziers = [], flames = [], flameAcc = 0;
/* world height of a point given as a fraction from the sprite's TOP */
function artY(fracFromTop){
  return (PYLON_ART.anchorY - fracFromTop) * PYLON_ART.heightWorld;
}
/* Pillars must stand fully OUTSIDE the play grid. The sprite is a billboard
   whose base slab hangs BELOW its anchor, and on the far pillars that skirt
   projects DOWNWARD — i.e. straight onto the board — so the corners are
   pushed out by half the pillar width plus a gap, not just by the apron. */
function pylonClearance(){
  const halfW = PYLON_ART.img ? PYLON_ART.widthWorld*0.5 : 0.45;
  return CONFIG.wall + halfW + 0.22;
}
/* The four pylons used to sit at the apron's corners, ±(ext+clearance) in
   both axes. That was right while the board floated in the middle of the
   frame; now that it fills the frame, ±(ext.x+clearance) projects clean off
   the sides and the two NEAR pylons were simply not in the picture at all.
   A pylon is off the play grid when |x| ≥ ext.x+c OR |z| ≥ ext.z+c — not
   both — so holding z at the apron's lip and pulling x IN is legal, and it is
   the only move that keeps all four visible. One shared half-width for all
   four keeps them a rectangle, so they still read as a colonnade round the
   field instead of a scatter; the NEAR pair is the binding one (it projects
   widest), so testing that pair is enough. */
function seedBraziers(){
  const c = pylonClearance();
  const ext = boardExtent();
  const tx = latticeCentreX();
  const hh = ext.z + c;
  const hw0 = ext.x + c;
  let hw = hw0;
  if (CAM && VIEW.box){
    const wHalf = (PYLON_ART.img ? PYLON_ART.widthWorld : 0.9) * 0.5;
    const tall  = PYLON_ART.img ? PYLON_ART.heightWorld : 1.4;
    const pad = 6;
    const lo = VIEW.box.l + pad, hi = VIEW.box.l + VIEW.box.w - pad;
    const top = VIEW.box.t + pad, bot = VIEW.box.t + VIEW.box.h - pad;
    const fits = w => {
      for (const zz of [hh, -hh]) for (const sgn of [-1, 1]){
        const a = project({ x:tx + sgn*w,         y:0,    z:zz });
        const b = project({ x:tx + sgn*w + wHalf, y:0,    z:zz });
        const c = project({ x:tx + sgn*w,         y:tall, z:zz });
        if (!a || !b || !c) return false;
        const half = Math.abs(b.x - a.x);
        if (a.x - half < lo || a.x + half > hi) return false;
        if (c.y < top || a.y > bot) return false;
      }
      return true;
    };
    const STEPS = 48, floorW = ext.x*0.30;   /* never let a pair meet in the middle */
    let found = null;
    for (let i = 0; i <= STEPS && hw >= floorW; i++){
      if (fits(hw)){ found = hw; break; }
      hw -= hw0/STEPS;
    }
    /* All-or-nothing on purpose. If no half-width fits — which is what happens
       in the standalone/full-viewport framing, where the board already covers
       ~90% of the frame height and there is simply no room outside it — put
       them back on the apron corners rather than leaving them halfway in. A
       pylon parked at a third of the board's width is neither at a corner nor
       visible; the old placement is at least the one the art was drawn for. */
    hw = found === null ? hw0 : found;
  }
  const fireY = PYLON_ART.img ? artY(PYLON_ART.fireY) : PYLON.top;
  braziers = [ {x:tx-hw,z:-hh}, {x:tx+hw,z:-hh}, {x:tx+hw,z:hh}, {x:tx-hw,z:hh} ]
    .map((c2,i) => ({ x:c2.x, y:fireY + 0.02, z:c2.z, seed:i*2.7, id:i }));
}
function updateFlames(dt){
  /* Projector pillars don't burn: skip EMISSION entirely (not just drawing)
     so no particles are simulated off-screen. */
  const emitting = !(PYLON_ART.img && !PYLON_ART.flames);
  flameAcc += dt;
  const step = 1/58;
  if (!emitting) flameAcc = 0;
  while (emitting && flameAcc > step){
    flameAcc -= step;
    for (const br of braziers){
      for (let i=0;i<2;i++){
        /* all offsets are in PILLAR WIDTHS, resolved against the sprite each frame */
        const a = Math.random()*Math.PI*2, rr = Math.random()*0.085;
        flames.push({ br:br.id,
          ox: Math.cos(a)*rr, oy: rnd(-.01,.015),
          vx: Math.cos(a)*rnd(.01,.05),
          vy: rnd(.52, .92),
          t: 0, life: rnd(.48, .86),
          r0: rnd(.058, .105), r1: rnd(.015, .035),
          sway: rnd(1.6,3.4), phase: Math.random()*6.283, seed: br.seed
        });
      }
    }
  }
  for (const f of flames){
    f.t += dt;
    const p = f.t/f.life;
    /* buoyancy: accelerate upward early, then the puff stalls into smoke */
    f.vy += (p < .5 ? 1.15 : -0.24) * dt;
    f.ox += (f.vx + Math.sin(T*f.sway + f.phase)*0.075) * dt;
    f.oy += f.vy * dt;
  }
  flames = flames.filter(f => f.t < f.life);
}
function drawFlames(br){
  const A = br && br._spr; if (!A) return;
  /* oldest last so young hot puffs sit in front */
  const list = flames.filter(f => f.br === br.id).sort((a,b) => b.t - a.t);
  ctx.save();
  for (const f of list){
    const p = clamp(f.t/f.life, 0, 1);
    const col = flameColor(p);
    if (col.a <= 0.003) continue;
    /* resolve against the PAINTED bowl — always dead centre on top */
    const sx = A.x + f.ox * A.s;
    const sy = A.fireY - f.oy * A.s;
    const wr = lerp(f.r0, f.r1, easeOut(p)) * (1 + Math.sin(p*Math.PI)*0.35);
    const R = Math.max(0.6, wr * A.s);
    ctx.globalCompositeOperation = p < 0.66 ? 'lighter' : 'source-over';
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, R);
    g.addColorStop(0,   `rgba(${col.r},${col.g},${col.b},${col.a})`);
    g.addColorStop(.55, `rgba(${col.r},${col.g},${col.b},${col.a*.45})`);
    g.addColorStop(1,   `rgba(${col.r},${col.g},${col.b},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(sx, sy, R*0.78, R*1.45, 0, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

/* ── props (billboards; editor-placed) ── */
function drawProp(t){
  const base = gw(t.x, t.z, tileElev(t.x,t.z));
  const p = project(base); if (!p) return;
  /* props are drawn to fit their tile, so their scale unit is the inradius —
     the .5 that used to be here was that same number back when a square cell's
     inradius happened to be 0.5. */
  const S = ringPx(p, tileR()), lv = lightVector();
  /* shadow */
  shadowEllipse(base, .38, .8);
  ctx.save(); ctx.translate(p.x, p.y);
  const k = S;
  const shade = mixHex('#6a6050', LIGHT.key, .3);
  ctx.strokeStyle = rgba('#0a0810',.9); ctx.lineWidth = 1.4;
  /* NOTE: houses and wrecked cars used to live here — they are EVENTS now
     (see EVENT_TYPES / drawEvent). Only inert terrain remains as props. */
  if (t.prop === 'barricade'){
    ctx.fillStyle = shade;
    for (let i=-1;i<=1;i++){ ctx.save(); ctx.translate(i*k*.3, 0); ctx.rotate(i*.22);
      ctx.fillRect(-k*.07,-k*.5, k*.14, k*.5); ctx.strokeRect(-k*.07,-k*.5, k*.14, k*.5); ctx.restore(); }
    ctx.fillRect(-k*.5,-k*.3, k*1.0, k*.1); ctx.strokeRect(-k*.5,-k*.3, k*1.0, k*.1);
  } else if (t.prop === 'crater'){
    ctx.save(); ctx.scale(1,.46);
    const cg = ctx.createRadialGradient(0,0,0,0,0,k*.55);
    cg.addColorStop(0,'rgba(90,20,10,.9)'); cg.addColorStop(.7,'rgba(30,12,8,.85)'); cg.addColorStop(1,'rgba(20,10,6,0)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0,0,k*.55,0,7); ctx.fill();
    ctx.strokeStyle = rgba('#ff6a2a', .35 + Math.sin(T*2)*.15); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,k*.4,0,7); ctx.stroke();
    ctx.restore();
  } else if (t.prop === 'pylon'){
    const g = ctx.createLinearGradient(0,-k*1.1,0,0);
    g.addColorStop(0, rgba('#b98cff',.9)); g.addColorStop(1, rgba('#3a1c6a',.8));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0,-k*1.15); ctx.lineTo(k*.22,-k*.4); ctx.lineTo(0,0); ctx.lineTo(-k*.22,-k*.4); ctx.closePath();
    ctx.fill(); ctx.strokeStyle = rgba('#d8b8ff',.6); ctx.stroke();
  } else if (t.prop === 'bones'){
    ctx.strokeStyle = rgba('#cfc4a8',.75); ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-k*.4,-k*.05); ctx.lineTo(k*.3,-k*.2); ctx.moveTo(-k*.25,-k*.24); ctx.lineTo(k*.36,-k*.02); ctx.stroke();
    ctx.fillStyle = rgba('#cfc4a8',.8); ctx.beginPath(); ctx.arc(-k*.42,-k*.16,k*.11,0,7); ctx.fill();
  }
  ctx.restore();
}

/* ground shadow driven by the light vector */
function shadowEllipse(world, rx, alpha){
  const lv = lightVector();
  const len = clamp(1/(lv.y+.16), .8, 3.6);
  const off = { x: -lv.x*len*.42, z: -lv.z*len*.42 };
  const c = project({ x:world.x + off.x, y:world.y+.006, z:world.z + off.z }); if (!c) return;
  /* rx is the CASTER's radius in world units (a unit, a tomb, a pillar), not a
     fraction of a tile — a sprite's shadow tracks the sprite, so this one does
     not go through tileR(). */
  const R = ringPx(c, rx);
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(Math.atan2(-lv.z, lv.x)*.12); ctx.scale(1*len*.55+.6, .40);
  const g = ctx.createRadialGradient(0,0,0,0,0,R);
  g.addColorStop(0, `rgba(0,0,0,${(alpha||.75)*clamp(lv.y+.25,.25,1)})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill(); ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════
   SPRITE PAINTERS — procedural stand-ins for the real sheets.
   Drawn into a unit-local space: x ∈ [-.5,.5], y ∈ [-1,0] (feet at 0)
   ══════════════════════════════════════════════════════════════════ */
function paintSprite(c, key, k, col, t){
  /* ── REAL ART FIRST ───────────────────────────────────────────────
     A unit with `art` or a `sheet` draws its own texture, billboarded in
     the same unit-local space the procedural painters use (x -.5..+.5,
     y -1..0, feet at 0). Crispness rules from the port brief: no smoothing
     on the silhouette, and the destination rect is snapped to whole device
     pixels so slow drifts don't shimmer.
     A sheet animates by SOURCE-RECT offset (never by swapping textures). */
  const D = UNIT_DEFS[key];
  if (D && D._proc) key = D._proc;
  /* ── SPRITE ATELIER FRAMES ────────────────────────────────────────────
     The game stores an uploaded sprite as an ARRAY of full-resolution frame
     images (Forge.sprites[key][anim]), not a packed atlas, so that is the
     primary path. Timing is SECONDS-based off the shared clock — never a
     frame counter — so playback speed is identical at 30fps or 144fps, and
     each unit gets a stable phase offset so a row of the same unit doesn't
     march in lockstep.
     Quality rule: painted sprite art is usually far larger than the drawn
     size, so downscales use high-quality smoothing; upscales turn smoothing
     OFF so a small sheet stays crisp instead of going soft. */
  if (D && Array.isArray(D.frames) && D.frames.length){
    const fps = D.fps || 10;
    const n = D.frames.length;
    const idx = n > 1 ? (Math.floor((t + (D._phase || 0)) * fps) % n) : 0;
    const img = artImage(D.frames[idx]) || artImage(D.frames[0]);
    if (img && img.width){
      const h = k, w = k * (img.width / img.height || 0.8);
      const dx = Math.round(-w / 2), dy = Math.round(-h), dw = Math.round(w), dh = Math.round(h);
      const sm = c.imageSmoothingEnabled, sq = c.imageSmoothingQuality;
      const upscaling = dw > img.width;
      c.imageSmoothingEnabled = !upscaling;
      if (!upscaling) c.imageSmoothingQuality = 'high';
      c.drawImage(img, dx, dy, dw, dh);
      c.imageSmoothingEnabled = sm; c.imageSmoothingQuality = sq;
      return;
    }
  }
  if (D && (D.art || (D.sheet && D.sheet.src))){
    const sheet = D.sheet && D.sheet.src ? D.sheet : null;
    const img = artImage(sheet ? sheet.src : D.art);
    if (img && img.width){
      const aspect = sheet && sheet.fw ? (sheet.fw / sheet.fh) : (img.width / img.height);
      const h = k, w = k * (aspect || 0.8);
      const dx = Math.round(-w / 2), dy = Math.round(-h), dw = Math.round(w), dh = Math.round(h);
      const sm = c.imageSmoothingEnabled, sq0 = c.imageSmoothingQuality;
      const up = dw > (sheet ? (sheet.fw || img.width) : img.width);
      c.imageSmoothingEnabled = !up;                /* crisp when upscaling, smooth when down */
      if (!up) c.imageSmoothingQuality = 'high';
      if (sheet){
        const fw = sheet.fw || Math.floor(img.width / (sheet.frames || 1));
        const fh = sheet.fh || img.height;
        const n  = sheet.frames || 1;
        const fps = sheet.fps || 12;
        const rowMap = sheet.rows || {};
        const row = rowMap[D._clip || 'idle'] || 0;
        const f = n > 1 ? (Math.floor(t * fps) % n) : 0;
        c.drawImage(img, f * fw, row * fh, fw, fh, dx, dy, dw, dh);
      } else {
        c.drawImage(img, dx, dy, dw, dh);
      }
      c.imageSmoothingEnabled = sm; c.imageSmoothingQuality = sq0;
      return;
    }
  }
  /* ⚠ NO PROCEDURAL FLASH. If this unit HAS real art (frames / still / sheet)
     but nothing has decoded yet, draw NOTHING this frame rather than a
     stick figure that pops into the real sprite a moment later. The ground
