  /* ============ ⚡ LIGHTNING ============
     z-index 3: above the 3D scene (1) and the vignette (2), BELOW every piece
     of UI (all chrome is 5+). That ordering is what guarantees a bolt can never
     paint over the menu, whatever it does. */
  #bolt{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:3; pointer-events:none; display:block;
  }

    position:fixed; inset:10px; z-index:6; pointer-events:none;
    border:1px solid rgba(210,164,78,.55);
    box-shadow: inset 0 0 0 1px rgba(210,164,78,.12), inset 0 0 60px rgba(0,0,0,.55);
  }
  .frame::after{
    content:""; position:absolute; inset:5px;
    border:1px solid rgba(210,164,78,.22);
  }
  .corner{
    position:fixed; z-index:7; width:74px; height:74px; pointer-events:none;
    color:var(--gold); opacity:.9;
    filter: drop-shadow(0 0 6px rgba(210,164,78,.35));
  }
  .corner svg{ width:100%; height:100%; }
  .corner.tl{ top:6px; left:6px; }
  .corner.tr{ top:6px; right:6px; transform:scaleX(-1); }
  .corner.bl{ bottom:6px; left:6px; transform:scaleY(-1); }
  .corner.br{ bottom:6px; right:6px; transform:scale(-1,-1); }

  /* ============ TITLE + MENU COLUMN ============ */
  .menu-col{
    position:fixed; z-index:5;
    top:0; bottom:0; left:0;
    width:min(560px, 44vw);
    display:flex; flex-direction:column;
    padding:56px 48px 42px 64px;
    overflow-y:auto; overflow-x:hidden;
    scrollbar-width:none;
  }
  .menu-col::-webkit-scrollbar{ display:none; }

  .title-wrap{ margin:0; line-height:0; }
  .title-logo{
    /* ⚠ BOUNDED BY HEIGHT, not just width. The 2026 lockup is square (860x858)
       where the old wordmark was 1.92:1 - on width alone it renders ~430px tall
       and pushes the whole menu column down the page. max-height + contain caps
       the vertical space it can ever claim, whatever the art's aspect is. */
    width:min(470px, 38vw);
    max-height:min(330px, 40vh);
    object-fit:contain; object-position:left center;
    max-width:100%; height:auto; display:block;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.85)) drop-shadow(0 0 26px rgba(255,246,220,.22));
    animation:titleIn 1.4s cubic-bezier(.2,.8,.2,1) both .35s;
  }
  @keyframes titleIn{ from{ opacity:0; transform:translateY(14px) scale(.98); } to{ opacity:1; transform:none; } }

  .title-rule{
    display:flex; align-items:center; gap:12px;
    margin:18px 2px 8px;
    color:var(--gold);
    animation:fadeIn 1.2s ease both .8s;
  }
  .title-rule .line{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent); box-shadow:0 0 8px rgba(210,164,78,.5); }
  .title-rule svg{ width:34px; height:34px; filter:drop-shadow(0 0 8px rgba(246,220,149,.7)); }
  .rune-strip{
    text-align:center; font-size:13px; letter-spacing:.55em;
    color:rgba(210,164,78,.55); margin-bottom:26px; text-indent:.55em;
    animation:fadeIn 1.2s ease both 1s;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }

  /* ============ NAV ============ */
  nav{ display:flex; flex-direction:column; }
  .nav-item{
    --d:0s;
    appearance:none; background:none; border:none; cursor:pointer; text-align:left;
    display:flex; align-items:center; gap:22px;
    padding:13px 18px 13px 10px;
    position:relative;
    border-bottom:1px solid rgba(210,164,78,.16);
    color:var(--parchment);
    transition:background .25s ease, padding-left .25s ease;
    animation:navIn .7s cubic-bezier(.2,.8,.2,1) both var(--d);
  }
  @keyframes navIn{ from{opacity:0; transform:translateX(-26px);} to{opacity:1; transform:none;} }
  .nav-item:first-child{ border-top:1px solid rgba(210,164,78,.16); }
  .nav-item .sigil{
    flex:0 0 auto; width:52px; height:52px; border-radius:50%;
    display:grid; place-items:center;
    border:1.5px solid rgba(210,164,78,.75);
    box-shadow: inset 0 0 0 3px rgba(10,6,16,.9), inset 0 0 0 4px rgba(210,164,78,.35), 0 0 0 1px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.5);
    background:radial-gradient(circle at 35% 30%, #241831, #0d0813 70%);
    color:var(--gold);
    transition:transform .3s cubic-bezier(.3,1.4,.5,1), box-shadow .3s ease, color .3s ease;
  }
  .nav-item .sigil svg{ width:24px; height:24px; }
  .nav-item .label{
    font-family:"Cinzel",serif; font-weight:600;
    font-size:clamp(17px, 1.45vw, 24px);
    letter-spacing:.09em;
    color:#e6d29b;
    text-shadow:0 2px 3px rgba(0,0,0,.85);
    transition:color .25s ease, text-shadow .25s ease, letter-spacing .25s ease;
  }
  .nav-item::before{ /* active gold bar */
    content:""; position:absolute; left:-14px; top:12%; bottom:12%; width:3px;
    background:linear-gradient(180deg, transparent, var(--gold-hi), transparent);
    box-shadow:0 0 12px 2px rgba(246,220,149,.7);
    opacity:0; transition:opacity .25s ease;
  }
  .nav-item:hover{ background:linear-gradient(90deg, rgba(210,164,78,.10), transparent 80%); padding-left:16px; }
  .nav-item:hover .sigil{ transform:scale(1.07); color:var(--gold-hi); }
  .nav-item:hover .label{ color:var(--gold-hi); }
  .nav-item:focus-visible{ outline:2px solid var(--gold-hi); outline-offset:-2px; }
  .nav-item.active{
    background:linear-gradient(90deg, rgba(246,220,149,.16), rgba(210,164,78,.05) 60%, transparent);
  }
  .nav-item.active::before{ opacity:1; }
  .nav-item.active .label{
    color:#fbe9b4; letter-spacing:.11em;
    text-shadow:0 0 14px rgba(246,220,149,.55), 0 2px 3px rgba(0,0,0,.9);
  }
  .nav-item.active .sigil{
    color:var(--gold-hi);
    box-shadow: inset 0 0 0 3px rgba(10,6,16,.9), inset 0 0 0 4px rgba(246,220,149,.6), 0 0 16px rgba(246,220,149,.35), 0 4px 10px rgba(0,0,0,.5);
  }

  /* ============ TOP HUD ============ */
  .hud{
    position:fixed; z-index:5; top:26px; right:34px;
    display:flex; align-items:stretch; gap:12px;
    animation:hudIn .9s cubic-bezier(.2,.8,.2,1) both .6s;
  }
  @keyframes hudIn{ from{ opacity:0; transform:translateY(-16px);} to{ opacity:1; transform:none;} }
  .hud .box{
    display:flex; align-items:center; gap:14px;
    padding:10px 18px;
    border:1px solid var(--panel-line);
    background:linear-gradient(180deg, rgba(19,12,26,.86), rgba(9,6,14,.9));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.7), inset 0 1px 0 rgba(246,220,149,.08), 0 6px 18px rgba(0,0,0,.45);
    clip-path:polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    font-family:"Cinzel",serif;
  }
  .hud .seg{ display:flex; align-items:center; gap:12px; padding:0 4px; }
  .hud .seg + .seg{ border-left:1px solid rgba(210,164,78,.25); padding-left:16px; margin-left:4px; }
  /* Player name = the account quick-menu button (settings / sync / sign out). */
  .hud .seg-btn{
    appearance:none; border:0; background:none; font:inherit; color:inherit;
    cursor:pointer; border-radius:6px; transition:color .18s, background .18s;
  }
  .hud .seg-btn:hover{ color:#fff0cf; background:rgba(210,164,78,.10); }
  .hud .seg-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .hud .seg-caret{ font-size:10px; opacity:.5; margin-left:2px; }
  .hud button.box{ cursor:pointer; transition:box-shadow .25s ease; }
  .hud button.box:hover{ box-shadow:inset 0 0 0 1px rgba(0,0,0,.7), inset 0 0 20px rgba(246,220,149,.12), 0 6px 18px rgba(0,0,0,.45); }
  .hud button.box:focus-visible{ outline:2px solid var(--gold-hi); outline-offset:2px; }
  .hud .glyph{ width:20px; height:20px; color:var(--gold); flex:0 0 auto; filter:drop-shadow(0 1px 1px rgba(0,0,0,.8)); }
  .hud .glyph.bright{ color:var(--gold-hi); filter:drop-shadow(0 0 6px rgba(246,220,149,.6)); }
  .hud .glyph.violet{ color:#b98cff; filter:drop-shadow(0 0 6px rgba(151,90,255,.7)); }
  .hud .lbl{ font-weight:700; font-size:14px; letter-spacing:.18em; color:#eeddad; text-indent:.18em; }
  .hud .val{ font-weight:600; font-size:15px; letter-spacing:.04em; color:#f2e3b8; white-space:nowrap; }
  .hud .val .sub{ color:var(--dim); font-weight:500; }
  .avatar{
    width:34px; height:34px; border-radius:50%;
    border:1.5px solid rgba(210,164,78,.8);
    background:radial-gradient(circle at 35% 25%, #3a2c50, #120a18 75%);
    display:grid; place-items:center; color:#cbb277;
    box-shadow:0 0 10px rgba(0,0,0,.7);
  }
  .avatar svg{ width:18px; height:18px; }

  .event-pill{
    position:fixed; z-index:5; top:96px; right:34px;
    animation:hudIn .9s cubic-bezier(.2,.8,.2,1) both .85s;
  }
  /* Clickable — opens the world-event briefing in the game. */
  .event-pill .box{
    display:flex; align-items:center; gap:12px;
    padding:9px 18px;
    font-family:"Cinzel",serif; font-weight:600; font-size:14px; letter-spacing:.08em;
    color:#f0d9a2;
    border:1px solid var(--panel-line);
    background:linear-gradient(180deg, rgba(19,12,26,.86), rgba(9,6,14,.9));
    clip-path:polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);
    box-shadow:inset 0 0 14px rgba(255,122,31,.08);
    cursor:pointer; transition:color .18s, box-shadow .18s, transform .18s;
  }
  .event-pill .box:hover{
    color:#fff0cf; transform:translateY(-1px);
    box-shadow:inset 0 0 20px rgba(255,122,31,.22), 0 6px 18px rgba(0,0,0,.5);
  }
  .event-pill .box:focus-visible{ outline:2px solid var(--ember); outline-offset:3px; }
  .event-pill .hintx{ font-size:11px; opacity:.5; letter-spacing:.1em; }
  .event-pill .glyph{ width:18px; height:18px; color:var(--ember); filter:drop-shadow(0 0 6px rgba(255,122,31,.7)); animation:flicker 2.2s ease-in-out infinite; }
  @keyframes flicker{ 0%,100%{opacity:1} 40%{opacity:.65} 60%{opacity:.9} 75%{opacity:.7} }
  .event-pill .time{ color:#ffd9ad; }

  /* ============ TOAST / FLASH ============ */
  .flash{
    position:fixed; inset:0; z-index:8; pointer-events:none;
    background:radial-gradient(60% 60% at 50% 50%, rgba(246,220,149,.22), transparent 70%);
    opacity:0;
  }
  .flash.go{ animation:flash .6s ease-out; }
  @keyframes flash{ 0%{opacity:0} 15%{opacity:1} 100%{opacity:0} }
  .toast{
    position:fixed; z-index:9; left:50%; bottom:52px; transform:translateX(-50%) translateY(20px);
    font-family:"Cinzel",serif; font-weight:600; letter-spacing:.22em; text-indent:.22em; font-size:14px;
    color:var(--gold-hi); text-shadow:0 0 14px rgba(246,220,149,.6);
    padding:12px 30px; border:1px solid rgba(210,164,78,.4);
    background:rgba(10,6,16,.85);
    clip-path:polygon(12px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0 50%);
    opacity:0; pointer-events:none; transition:opacity .35s ease, transform .35s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .renderer-tag{
    position:fixed; z-index:5; bottom:18px; right:34px;
    font-family:"Cinzel",serif; font-size:11px; letter-spacing:.3em; text-indent:.3em;
    color:rgba(210,164,78,.5);
  }

  /* ============ LOADING ============ */
  .loading{
    position:fixed; inset:0; z-index:20;
    background:radial-gradient(80% 80% at 50% 45%, #150c20, #070410 75%);
    display:grid; place-items:center;
    transition:opacity .9s ease; 
  }
  /* 🎴 Featured character stage — the admin-curated roster (Characters button)
     rotates here with a slow crossfade. Sits ABOVE the painted keep but UNDER
     the ember canvas, so the motes drift in front of the character. */
  /* Centred on the stage (was hugging the right edge) — the character is the
     focal point, with the nav column on the left and the HUD above. */
  .char-stage{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%);
    width:min(42vw, 720px); height:88vh;
    pointer-events:none; z-index:0;
    animation:charFloat 9s ease-in-out infinite;
  }
  @keyframes charFloat{ 0%,100%{ transform:translateX(-50%) translateY(0) } 50%{ transform:translateX(-50%) translateY(-8px) } }
  .char-img{
    position:absolute; left:0; right:0; bottom:-2vh; margin:0 auto;
    max-height:100%; max-width:100%;
    object-fit:contain; object-position:bottom center;
    opacity:0; transition:opacity 1.4s ease;
    filter:drop-shadow(0 26px 60px rgba(0,0,0,.65)) drop-shadow(0 0 46px rgba(120,60,255,.18));
  }
  .char-img.on{ opacity:1; }
  @media (max-width:900px){ .char-stage{ width:64vw; opacity:.5 } }
  .loading.done{ opacity:0; pointer-events:none; }
  /* ⏭ Repeat visits skip the intro entirely — the class is stamped by the tiny
     sync script below BEFORE first paint, so there's no flash of the overlay. */
  .skip-intro .loading{ display:none !important; }
  .loading .inner{ text-align:center; }
  .loading .ring{
    width:110px; height:110px; margin:0 auto 30px; border-radius:50%;
    border:1px solid rgba(210,164,78,.25);
    position:relative;
    animation:spin 6s linear infinite;
  }
  .loading .ring::before{
    content:""; position:absolute; inset:-1px; border-radius:50%;
    border:1px solid transparent;
    border-top-color:var(--gold-hi); border-right-color:rgba(246,220,149,.4);
    filter:drop-shadow(0 0 8px rgba(246,220,149,.7));
  }
  .loading .ring::after{
    content:"✦"; position:absolute; inset:0; display:grid; place-items:center;
    color:var(--gold); font-size:30px; animation:spin 6s linear infinite reverse;
    text-shadow:0 0 16px rgba(246,220,149,.8);
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .loading .word{
    font-family:"Cinzel Decorative",serif; font-weight:900; font-size:26px; letter-spacing:.3em; text-indent:.3em;
    background:linear-gradient(180deg,#fdf0c0, #b8862f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .loading .hint{ margin-top:16px; font-size:13px; letter-spacing:.4em; text-indent:.4em; color:rgba(210,164,78,.55); font-family:"Cinzel",serif; }

  /* ============ RESPONSIVE / MOTION ============ */
  @media (max-width: 900px){
    .title-logo{ width:min(430px, 78vw); max-height:min(300px, 34vh); }
    .menu-col{ width:100%; padding:40px 26px 30px 34px; background:linear-gradient(90deg, rgba(8,5,12,.88), rgba(8,5,12,.55)); }
    .hud{ right:16px; top:16px; flex-wrap:wrap; justify-content:flex-end; max-width:70vw; }
    .event-pill{ top:auto; bottom:16px; right:16px; }
    .renderer-tag{ display:none; }
    .corner{ width:48px; height:48px; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div class="char-stage" id="charStage" aria-hidden="true"><img class="char-img" id="charA" alt=""><img class="char-img" id="charB" alt=""></div>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<canvas id="bolt" aria-hidden="true"></canvas>
<div class="frame"></div>

<!-- corner flourishes -->
<div class="corner tl"><svg viewBox="0 0 74 74" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 70 V22 Q4 4 22 4 H70"/><path d="M10 70 V26 Q10 10 26 10 H70" opacity=".55"/><path d="M4 4 L20 20 M14 4 C22 8 26 14 26 22 M4 14 C12 18 18 22 22 26" opacity=".8"/><circle cx="30" cy="30" r="2.4" fill="currentColor" stroke="none"/></svg></div>
<div class="corner tr"><svg viewBox="0 0 74 74" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 70 V22 Q4 4 22 4 H70"/><path d="M10 70 V26 Q10 10 26 10 H70" opacity=".55"/><path d="M4 4 L20 20 M14 4 C22 8 26 14 26 22 M4 14 C12 18 18 22 22 26" opacity=".8"/><circle cx="30" cy="30" r="2.4" fill="currentColor" stroke="none"/></svg></div>
<div class="corner bl"><svg viewBox="0 0 74 74" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 70 V22 Q4 4 22 4 H70"/><path d="M10 70 V26 Q10 10 26 10 H70" opacity=".55"/><path d="M4 4 L20 20 M14 4 C22 8 26 14 26 22 M4 14 C12 18 18 22 22 26" opacity=".8"/><circle cx="30" cy="30" r="2.4" fill="currentColor" stroke="none"/></svg></div>
<div class="corner br"><svg viewBox="0 0 74 74" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 70 V22 Q4 4 22 4 H70"/><path d="M10 70 V26 Q10 10 26 10 H70" opacity=".55"/><path d="M4 4 L20 20 M14 4 C22 8 26 14 26 22 M4 14 C12 18 18 22 22 26" opacity=".8"/><circle cx="30" cy="30" r="2.4" fill="currentColor" stroke="none"/></svg></div>

<!-- top HUD -->
<div class="hud" role="toolbar" aria-label="Player status">
  <!-- Admin-only. Hidden by DEFAULT so a normal player never sees it flash
       before mm:data arrives; the game reveals it only when isAdmin is true. -->
  <button class="box" id="charactersBtn" style="display:none">
    <svg class="glyph bright" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>
    <span class="lbl">Characters</span>
  </button>
  <button class="box" id="musicBtn" title="Music" aria-pressed="true">
    <svg class="glyph bright" id="musicOnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
    <svg class="glyph" id="musicOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="display:none;opacity:.55"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path d="M3 3l18 18" stroke-width="2"/></svg>
  </button>
  <div class="box">
    <button class="seg seg-btn" id="mmAccountBtn" type="button" title="Account — settings, sync, sign out">
      <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3c4 0 6 3 6 7v3l1.5 4H4.5L6 13v-3c0-4 2-7 6-7z"/><path d="M9 12c.6 1 1.7 1.6 3 1.6s2.4-.6 3-1.6"/></svg></span>
      <span class="val" id="mmName">…</span>
      <span class="seg-caret">▾</span>
    </button>
    <span class="seg">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg>
      <span class="val" id="mmRank">Rookie <span class="sub" id="mmRr"></span></span>
    </span>
    <span class="seg">
      <svg class="glyph bright" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.6 6 6.4.5-4.9 4.3 1.5 6.2L12 16l-5.6 3.5 1.5-6.2L3 9l6.4-.5z"/></svg>
    </span>
    <span class="seg">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l2 2h3l1 3 2 2-1 3 .5 3.5L16 18l-1.5 3h-5L8 18l-3.5-1.5L5 13 4 10l2-2 1-3h3z" opacity="0"/><path d="M12 3a6 6 0 016 6c0 2-.6 3.4-1.4 4.6L18 17H6l1.4-3.4A7.6 7.6 0 016 9a6 6 0 016-6z"/><path d="M10 20h4"/></svg>
      <span class="val" id="levelVal">12</span>
    </span>
  </div>
  <div class="box">
    <svg class="glyph bright" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="5.2" opacity=".7"/><path d="M12 8.6l1 2.2 2.4.2-1.8 1.6.5 2.4-2.1-1.3-2.1 1.3.5-2.4-1.8-1.6 2.4-.2z" fill="currentColor" stroke="none"/></svg>
    <span class="val" id="goldVal">271,941</span>
  </div>
  <div class="box">
    <svg class="glyph violet" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l5.4 5.6L12 21.2 6.6 8.4z"/><path d="M6.6 8.4h10.8" stroke="#0a0610" stroke-width="1"/></svg>
    <span class="val" id="gemVal">236</span>
  </div>
</div>

<!-- event countdown -->
<div class="event-pill" id="eventPill" style="display:none">
  <button class="box" id="eventBtn" type="button" title="Open the world-event briefing">
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4L3 20h18z"/><path d="M12 12l-3.4 8M12 12l3.4 8"/></svg>
    <span><span id="eventName">Event</span> <span style="opacity:.55">·</span> <span class="time" id="eventTimer">4h 29m</span></span>
    <span class="hintx">▸</span>
  </button>
</div>

<script type="module">
/* ============================================================
   MYTHIC SPELLBOOK — Main menu scene
   Three.js WebGPURenderer (auto-falls back to WebGL2).
   ============================================================ */

const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/';
let THREE = null, rendererName = 'WebGL2';

async function loadThree(){
  const tries = [
    CDN + '0.171.0/three.webgpu.min.js',
    CDN + '0.169.0/three.webgpu.min.js',
    CDN + '0.171.0/three.module.min.js',
    CDN + '0.160.1/three.module.min.js'
  ];
  for (const url of tries){
    try { return await import(url); } catch(e){ /* next */ }
  }
  throw new Error('Three.js failed to load');
}

const canvas   = document.getElementById('scene');
const loading  = document.getElementById('loading');
const tagEl    = document.getElementById('rendererTag');
const reduced  = matchMedia('(prefers-reduced-motion: reduce)').matches;

init().catch(err => {
  console.error(err);
  loading.querySelector('.hint').textContent = 'The scene could not awaken — the menu remains yours.';
  setTimeout(()=> { loading.classList.add('done'); try { sessionStorage.setItem('mmIntroSeen', '1'); } catch(e){} }, 1200);
});

async function init(){
  THREE = await loadThree();

  let renderer;
  if (THREE.WebGPURenderer){
    renderer = new THREE.WebGPURenderer({ canvas, antialias:true, alpha:true });
    await renderer.init();
    rendererName = renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2';
  } else {
    renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  if (tagEl) tagEl.textContent = 'Rendered · ' + rendererName;   // element removed — guard

  const scene = new THREE.Scene(); // transparent — the painted backdrop shows through
  renderer.setClearColor(0x000000, 0);

  const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(1.6, 1.5, 9.2);
  const lookTarget = new THREE.Vector3(1.4, 0.9, 0);
  camera.lookAt(lookTarget);






  /* ---------- embers ---------- */
  const emberTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(32,32,0,32,32,32);
    rg.addColorStop(0,'rgba(255,230,170,1)');
    rg.addColorStop(0.35,'rgba(255,150,50,.9)');
    rg.addColorStop(1,'rgba(255,90,10,0)');
    g.fillStyle = rg; g.fillRect(0,0,64,64);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  })();
  const EMBERS = 500;
  const ePos = new Float32Array(EMBERS*3);
  const eVel = new Float32Array(EMBERS);
  const eSway = new Float32Array(EMBERS);
  const resetEmber = i => {
    const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*4.4;
    ePos[i*3]   = 1.7 + Math.cos(a)*r;
    ePos[i*3+1] = -1.6 + Math.random()*0.6;
    ePos[i*3+2] = Math.sin(a)*r;
    eVel[i]  = 0.35 + Math.random()*1.1;
    eSway[i] = Math.random()*Math.PI*2;
  };
  for (let i=0;i<EMBERS;i++){ resetEmber(i); ePos[i*3+1] = -1.6 + Math.random()*6; }
  const emberGeo = new THREE.BufferGeometry();
  emberGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
  const embers = new THREE.Points(emberGeo, new THREE.PointsMaterial({
    map:emberTex, color:0xffb060, size:0.075, transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
  }));
  scene.add(embers);

  /* (The violet smoke sprites were removed — on some GPUs they rendered as
     giant pixelated purple blobs covering the whole menu. That space is
     reserved for the featured character art, managed from the Characters
     button. Embers + parallax stay.) */

  /* ---------- animation (embers + wisps over the artwork) ---------- */
  const clock = new THREE.Clock();
  const bgEl = document.getElementById('bg');
  let mx = 0, my = 0, pulse = 0;
  addEventListener('pointermove', e => {
    mx = (e.clientX/innerWidth  - 0.5);
    my = (e.clientY/innerHeight - 0.5);
  });

  window.__pulseFire = () => { pulse = 1; };

  const baseSize = embers.material.size;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t  = clock.elapsedTime;

    if (!reduced){
      const p = emberGeo.attributes.position.array;
      for (let i=0;i<EMBERS;i++){
        p[i*3+1] += eVel[i]*dt;
        p[i*3]   += Math.sin(t*1.4 + eSway[i])*dt*0.22;
        if (p[i*3+1] > 5.2) resetEmber(i);
      }
      emberGeo.attributes.position.needsUpdate = true;

      camera.position.x = 1.6 + mx*0.7;
      camera.position.y = 1.5 - my*0.5;
      camera.lookAt(lookTarget);
      bgEl.style.transform = `scale(1.04) translate(${(-mx*14).toFixed(1)}px, ${(-my*10).toFixed(1)}px)`;
    }

    if (pulse > 0) pulse = Math.max(0, pulse - dt*1.6);
    embers.material.size    = baseSize * (1 + pulse*0.9);
    embers.material.opacity = 0.85 + pulse*0.15 + Math.sin(t*3)*0.05;

    renderer.render(scene, camera);
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  setTimeout(() => { loading.classList.add('done'); try { sessionStorage.setItem('mmIntroSeen', '1'); } catch(e){} }, 700);
}

/* ============================================================
   UI behaviour
   ============================================================ */

/* ============================================================
   GAME BRIDGE — this file is the LIVE main menu inside Mythic
   Spellbook (iframe). The parent posts real player data; nav
   clicks post back and the parent routes to the real screens.
     parent → mm:data {player:{name,rank,rr,level,cinder,aza}, event:{name,endsMs}|null}
     menu   → mm:ready · mm:nav {label} · mm:characters
   ============================================================ */
const post = (m) => { try { parent.postMessage(m, location.origin); } catch(e){} };
const fmt = (n) => Number(n || 0).toLocaleString('en-US');
let eventEndsMs = 0;
const timerEl = document.getElementById('eventTimer');
setInterval(() => {
  if (!eventEndsMs) return;
  const s = Math.max(0, Math.floor((eventEndsMs - Date.now()) / 1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  timerEl.textContent = h > 0 ? `${h}h ${m}m` : `${m}m ${s%60}s`;
  if (s <= 0) document.getElementById('eventPill').style.display = 'none';
}, 1000);
/* 🎴 Featured-character rotation — slow crossfade between the roster images.
   Characters arrive in mm:data (admin roster → owned heroes → all heroes). */
let chars = [], charIdx = 0, charFlip = false, charTimer = null;
const charEls = [document.getElementById('charA'), document.getElementById('charB')];
function showChar(i){
  if (!chars.length) return;
  charIdx = ((i % chars.length) + chars.length) % chars.length;
  const incoming = charEls[charFlip ? 1 : 0];
  const outgoing = charEls[charFlip ? 0 : 1];
  charFlip = !charFlip;
  const src = chars[charIdx].src;
  const go = () => { incoming.classList.add('on'); outgoing.classList.remove('on'); };
  if (incoming.src === src && incoming.complete) go();
  else { incoming.onload = go; incoming.onerror = () => { outgoing.classList.remove('on'); }; incoming.src = src; }
}
function setChars(list){
  const next = Array.isArray(list) ? list.filter(c => c && typeof c.src === 'string' && c.src.length > 4) : [];
  const sig = next.map(c => c.src.length + ':' + (c.name || '')).join('|');
  if (sig === setChars._sig) return;   // unchanged roster → don't restart the fade
  setChars._sig = sig;
  chars = next;
  clearInterval(charTimer); charTimer = null;
  if (!chars.length){ charEls.forEach(el => el.classList.remove('on')); return; }
  showChar(0);
  if (chars.length > 1) charTimer = setInterval(() => showChar(charIdx + 1), 8000);
}
addEventListener('message', (e) => {
  const d = e && e.data;
  if (!d || d.type !== 'mm:data') return;
  try { if (d.characters) setChars(d.characters); } catch(err){}
  try { if (typeof d.music === 'boolean') paintMusic(d.music); } catch(err){}
  // 🎭 Characters manager is an ADMIN tool — only the game may reveal it.
  try { if (typeof d.isAdmin === 'boolean') document.getElementById('charactersBtn').style.display = d.isAdmin ? '' : 'none'; } catch(err){}
  try {
    const p = d.player || {};
    if (p.name != null)  document.getElementById('mmName').textContent = p.name || 'Survivor';
    if (p.rank != null)  { document.getElementById('mmRank').firstChild.nodeValue = p.rank + ' ';
                           document.getElementById('mmRr').textContent = p.rr != null ? ('· ' + p.rr + ' RR') : ''; }
    if (p.level != null) document.getElementById('levelVal').textContent = p.level;
    if (p.cinder != null) document.getElementById('goldVal').textContent = fmt(p.cinder);
    if (p.aza != null)    document.getElementById('gemVal').textContent = fmt(p.aza);
    const pill = document.getElementById('eventPill');
    if (d.event && d.event.name && d.event.endsMs > Date.now()) {
      document.getElementById('eventName').textContent = d.event.name;
      eventEndsMs = d.event.endsMs;
      pill.style.display = '';
    } else { eventEndsMs = 0; pill.style.display = 'none'; }
  } catch(err){}
});
post({ type: 'mm:ready' });
addEventListener('load', () => post({ type: 'mm:ready' }));

// subtle UI audio (created on first interaction)
let actx = null;
function tick(freq=880, dur=0.06, gain=0.025){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

// nav behaviour — FX here, real routing in the parent
const flash = document.getElementById('flash');
const toast = document.getElementById('toast');
let toastTimer = null;
function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('pointerenter', () => tick(1200, 0.045, 0.015));
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tick(520, 0.14, 0.04); setTimeout(()=>tick(780, 0.12, 0.03), 70);
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    if (window.__pulseFire) window.__pulseFire();
    // Hand off to the game after the flash has a beat to land.
    setTimeout(() => post({ type: 'mm:nav', label: btn.dataset.label }), 190);
  });
});

document.getElementById('charactersBtn').addEventListener('click', () => {
  tick(660, 0.1, 0.03);
  post({ type: 'mm:characters' });
});

// 🌐 World-event pill → the game opens the briefing modal over the menu.
document.getElementById('eventBtn').addEventListener('click', () => {
  tick(440, 0.12, 0.035);
  post({ type: 'mm:event' });
});

// 👤 Player name → the game's account quick-menu (settings / sync / history /
// sign out). The menu itself is drawn by the parent so it can reuse the real
// handlers; we send the pill's on-screen position so it can anchor under it.
document.getElementById('mmAccountBtn').addEventListener('click', () => {
  tick(700, 0.09, 0.03);
  const r = document.getElementById('mmAccountBtn').getBoundingClientRect();
  post({ type: 'mm:account', rect: { top: r.top, bottom: r.bottom, left: r.left, right: r.right } });
});

// 🔊 Music mute — the GAME owns the setting (it's the same musicEnabled flag
// used everywhere), so we just ask it to toggle and paint whatever it reports.
function paintMusic(on){
  document.getElementById('musicOnIcon').style.display  = on ? '' : 'none';
  document.getElementById('musicOffIcon').style.display = on ? 'none' : '';
  const b = document.getElementById('musicBtn');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.title = on ? 'Music ON — click to mute' : 'Music MUTED — click to play';
}
document.getElementById('musicBtn').addEventListener('click', () => {
  tick(520, 0.08, 0.03);
  post({ type: 'mm:music' });
});

/* ==========================================================================
   ⚡ LIGHTNING — procedural bolts over the keep.
   ========================================================================== */
(function () {
  var cv = document.getElementById('bolt');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* 🗺 THE OPEN SKY. Measured live rather than hardcoded so the band tracks
     the real layout at any viewport. The left menu column and the top-right HUD
     are the two things a bolt should never flicker behind — even though it is
     painted underneath them, it reads as noise through the panel edges. */
  function band() {
    var lo = W * 0.34, hi = W * 0.95;
    try {
      var col = document.querySelector('.menu-col');
      if (col) { var r = col.getBoundingClientRect(); if (r.width) lo = Math.max(lo, r.right + 36); }
      var hud = document.querySelector('.hud');
      if (hud) { var h2 = hud.getBoundingClientRect(); if (h2.width) hi = Math.min(hi, h2.left - 36); }
    } catch (e) {}
    if (hi - lo < 140) { lo = W * 0.48; hi = W * 0.94; }   // narrow screen — fall back
    return [lo, hi];
  }

  /* Midpoint displacement: jitter the middle of each segment, recurse. This is
     what gives lightning its self-similar crookedness — a random walk looks
     like a scribble, this looks like a discharge. */
  function jag(pts, spread, depth) {
    if (depth <= 0) return pts;
    var out = [];
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i], b = pts[i + 1];
      var mx = (a.x + b.x) / 2 + (Math.random() - 0.5) * spread;
      var my = (a.y + b.y) / 2 + (Math.random() - 0.5) * spread * 0.25;
      out.push(a, { x: mx, y: my });
    }
    out.push(pts[pts.length - 1]);
    return jag(out, spread * 0.55, depth - 1);
  }

  function makeBolt() {
    var b = band();
    var x0 = b[0] + Math.random() * (b[1] - b[0]);
    var groundY = H * (0.52 + Math.random() * 0.3);
    var pts = jag([{ x: x0, y: -30 }, { x: x0 + (Math.random() - 0.5) * W * 0.14, y: groundY }],
                  Math.min(180, W * 0.12), 6);
    var forks = [];
    var n = 1 + (Math.random() * 3 | 0);
    for (var i = 0; i < n; i++) {
      var at = pts[(pts.length * (0.25 + Math.random() * 0.5)) | 0];
      if (!at) continue;
      forks.push(jag([{ x: at.x, y: at.y },
                      { x: at.x + (Math.random() - 0.5) * W * 0.13,
                        y: at.y + H * (0.08 + Math.random() * 0.16) }],
                     Math.min(90, W * 0.05), 4));
    }
    return { pts: pts, forks: forks, born: performance.now(),
             life: 260 + Math.random() * 340, seed: Math.random() };
  }

  function stroke(pts, w, col, alpha) {
    if (!pts || pts.length < 2) return;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  var live = [], nextAt = performance.now() + 900 + Math.random() * 2200, raf = 0;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    ctx.clearRect(0, 0, W, H);

    if (now >= nextAt) {
      live.push(makeBolt());
      // Storms cluster — a second bolt right behind the first now and then.
      if (Math.random() < 0.28) setTimeout(function () { live.push(makeBolt()); }, 90 + Math.random() * 220);
      nextAt = now + 2600 + Math.random() * 6500;
    }

    var flash = 0;
    for (var i = live.length - 1; i >= 0; i--) {
      var b = live[i];
      var t = (now - b.born) / b.life;
      if (t >= 1) { live.splice(i, 1); continue; }
      /* Multi-flash flicker: 3 quick pulses inside the life, each decaying.
         A single fade looks like a drawn line; the stutter is what sells it. */
      var pulse = Math.max(0, Math.sin(t * Math.PI * 3.2 + b.seed * 6.28));
      var a = pulse * (1 - t) * (1 - t);
      if (a < 0.02) continue;
      flash = Math.max(flash, a);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowColor = 'rgba(150,190,255,0.9)';
      ctx.shadowBlur = 34;
      stroke(b.pts, 8, 'rgba(90,140,255,0.30)', a * 0.55);   // outer haze
      stroke(b.pts, 3.2, 'rgba(180,215,255,0.85)', a * 0.8); // body
      ctx.shadowBlur = 12;
      stroke(b.pts, 1.3, 'rgba(255,255,255,0.98)', a);       // hot core
      for (var k = 0; k < b.forks.length; k++) {
        stroke(b.forks[k], 2.2, 'rgba(150,195,255,0.55)', a * 0.55);
        stroke(b.forks[k], 0.9, 'rgba(255,255,255,0.9)', a * 0.7);
      }
      ctx.restore();
    }

    /* Sky flash — keeps the strike feeling like it lights the whole keep.
       Deliberately weak: it is on the SAME layer as the bolts, so it can never
       wash out the menu, but a strong flash would still fight the art. */
    if (flash > 0.03) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, 'rgba(120,160,235,' + (flash * 0.13).toFixed(3) + ')');
      g.addColorStop(0.6, 'rgba(90,120,200,' + (flash * 0.05).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  /* Don't burn frames on a hidden tab — and don't let a backlog of bolts all
     resolve at once when it comes back. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) { live.length = 0; nextAt = performance.now() + 1200; raf = requestAnimationFrame(frame); }
  });
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
