<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mythic Spellbook — Pack Opener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07060b; --nebula:#1c1030; --violet:#9b5cff;
    --gold:#f5c542; --bone:#e8e2d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(1200px 700px at 50% 30%, #241338 0%, transparent 60%),
      radial-gradient(900px 900px at 80% 85%, #12081f 0%, transparent 55%),
      var(--void);
    font-family:'Cormorant Garamond', Georgia, serif;
    color:var(--bone);
    -webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed;inset:0;display:block;cursor:pointer}
  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
       justify-content:space-between;align-items:center;padding:26px 16px 34px}
  .set-name{
    font-family:'Cinzel',serif;font-weight:700;font-size:clamp(13px,2.2vw,19px);
    letter-spacing:.42em;text-indent:.42em;color:var(--gold);
    text-shadow:0 0 18px rgba(245,197,66,.35);
    opacity:.9;text-align:center;
  }
  .set-name small{
    display:block;margin-top:6px;font-family:'Cormorant Garamond',serif;font-weight:500;
    font-style:italic;font-size:.72em;letter-spacing:.28em;text-indent:.28em;color:#bba7e8;
    text-shadow:none;text-transform:uppercase;
  }
  #hint{
    font-size:clamp(16px,2.4vw,21px);font-style:italic;letter-spacing:.06em;color:#cfc3aa;
    opacity:0;transition:opacity .6s;text-align:center;
    animation:breathe 2.6s ease-in-out infinite;
  }
  #hint.show{opacity:.85}
  @keyframes breathe{50%{opacity:.45}}
  #toast{
    position:fixed;left:50%;top:12.5%;transform:translate(-50%,0) scale(.92);
    text-align:center;opacity:0;pointer-events:none;transition:opacity .28s, transform .28s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
  #toast .rarity{
    font-family:'Cinzel',serif;font-weight:700;font-size:clamp(12px,1.8vw,15px);
    letter-spacing:.5em;text-indent:.5em;margin-bottom:6px;
  }
  #toast .cname{
    font-size:clamp(19px,3vw,27px);letter-spacing:.08em;color:var(--bone);
    text-shadow:0 2px 14px rgba(0,0,0,.8);
  }
  .btns{display:flex;gap:14px;pointer-events:auto}
  button{
    pointer-events:none;cursor:pointer;
    font-family:'Cinzel',serif;font-weight:500;font-size:14px;letter-spacing:.24em;text-indent:.24em;
    color:var(--bone);background:rgba(20,12,34,.55);
    border:1px solid rgba(245,197,66,.45);border-radius:3px;
    padding:13px 26px 12px;opacity:0;transform:translateY(8px);
    transition:opacity .45s, transform .45s, background .2s, border-color .2s;
    backdrop-filter:blur(6px);
  }
  button.show{opacity:1;transform:translateY(0);pointer-events:auto}
  button:hover{background:rgba(60,36,90,.65);border-color:var(--gold)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%)}
  /* 🔎 Card detail — tap a revealed card to see what you got. */
  #cardDetail{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(6,4,12,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:20px}
  #cardDetail.show{display:flex;animation:cdIn .18s ease-out}
  @keyframes cdIn{from{opacity:0}to{opacity:1}}
  #cardDetail .cd-card{display:flex;gap:22px;max-width:720px;width:100%;align-items:center;
    background:linear-gradient(180deg,rgba(24,18,40,.96),rgba(10,7,20,.98));
    border:1px solid rgba(245,197,66,.5);border-radius:16px;padding:20px;
    box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 30px rgba(245,197,66,.14)}
  #cardDetail .cd-art{width:230px;flex:none;aspect-ratio:2/3;object-fit:cover;border-radius:12px;
    border:2px solid rgba(245,197,66,.55);background:#0c0a14;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  #cardDetail .cd-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  #cardDetail .cd-rarity{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.28em}
  #cardDetail .cd-name{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(20px,3.4vw,30px);color:#fff;line-height:1.05}
  #cardDetail .cd-chips{display:flex;flex-wrap:wrap;gap:7px}
  #cardDetail .cd-chip{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:#e8dcc4;padding:4px 10px;border:1px solid rgba(245,197,66,.4);border-radius:999px;background:rgba(245,197,66,.08)}
  #cardDetail .cd-desc{font-family:'Cormorant Garamond',serif;font-size:16px;line-height:1.4;color:#cfc6b6;max-height:34vh;overflow:auto}
  #cardDetail .cd-close{align-self:flex-start;margin-top:6px;padding:8px 16px;border-radius:999px;cursor:pointer;
    font-family:'Cinzel',serif;font-weight:700;letter-spacing:.1em;color:#0c0a06;
    background:linear-gradient(180deg,#f6d67e,#c8962e);border:0}
  #cardDetail .cd-close:hover{filter:brightness(1.08)}
  @media(max-width:620px){#cardDetail .cd-card{flex-direction:column;text-align:center}
    #cardDetail .cd-art{width:150px}#cardDetail .cd-chips{justify-content:center}#cardDetail .cd-close{align-self:center}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<div class="hud">
  <div class="set-name">MYTHIC SPELLBOOK<small>Birth of Universe · 1</small></div>
  <div id="toast"><div class="rarity"></div><div class="cname"></div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <div id="hint">Tap the pack to tear it open</div>
    <div class="btns">
      <button id="btnAll">Reveal all</button>
      <button id="btnAgain">Open another pack</button>
    </div>
  </div>
</div>
<div id="cardDetail">
  <div class="cd-card">
    <img class="cd-art" alt="">
    <div class="cd-info">
      <div class="cd-rarity"></div>
      <div class="cd-name"></div>
      <div class="cd-chips"></div>
      <div class="cd-desc"></div>
      <button class="cd-close">Close ✕</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

   suspense = reveal dwell (ms), burst = particle count. */

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduceMotion ? 0.45 : 1;
const tickers = [];   // per-frame callbacks fn(timeSeconds)

/* ---------- basic three setup ---------- */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, .1, 100);
camera.position.set(0, 0, 9.2);
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

scene.add(new THREE.AmbientLight(0xffffff, 1));

/* ---------- helpers ---------- */
const now = () => performance.now();
const easeOutCubic  = k => 1 - Math.pow(1-k, 3);
const easeInOutCubic= k => k<.5 ? 4*k*k*k : 1 - Math.pow(-2*k+2,3)/2;
const easeOutBack   = k => { const c=1.70158; return 1 + (c+1)*Math.pow(k-1,3) + c*Math.pow(k-1,2); };
const lerp = (a,b,k) => a + (b-a)*k;

const tweens = [];
function tw(dur, ease, fn, done){
  dur = Math.max(1, dur*SPEED);
  tweens.push({t0:now(), dur, ease, fn, done});
}
function wait(ms){ return new Promise(r => tw(ms, k=>k, ()=>{}, r)); }
function tweenP(dur, ease, fn){ return new Promise(r => tw(dur, ease, fn, r)); }

function loadTex(url){
  return new Promise((res,rej)=>{
    const img = new Image();
    // 🩹 WebGL needs CORS-clean images. Card art often comes from cross-origin
    // Supabase Storage URLs; drawing those onto a canvas WITHOUT crossOrigin
    // TAINTS the canvas, so the CanvasTexture uploads BLACK (the "some cards
    // don't show up" bug). data: URLs + same-origin assets ignore this. onerror
    // rejects so a bad load falls back to the placeholder instead of hanging.
    img.crossOrigin = 'anonymous';
    img.onload = ()=>res(img);
    img.onerror = ()=>rej(new Error('img load failed'));
    img.src = url;
  });
}
function roundedTex(img, rFrac){
  const w=512, h=768, c=document.createElement('canvas');
  c.width=w; c.height=h;
  const x=c.getContext('2d'), r=w*rFrac;
  x.beginPath();
  x.moveTo(r,0); x.arcTo(w,0,w,h,r); x.arcTo(w,h,0,h,r); x.arcTo(0,h,0,0,r); x.arcTo(0,0,w,0,r);
  x.closePath(); x.clip();
  x.drawImage(img,0,0,w,h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function glowDotTex(){
  const s=128, c=document.createElement('canvas'); c.width=c.height=s;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.35,'rgba(255,255,255,.7)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}
function ringTex(){
  const s=256, c=document.createElement('canvas'); c.width=c.height=s;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,s*0.30,s/2,s/2,s*0.5);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(.55,'rgba(255,255,255,.9)');
  g.addColorStop(.75,'rgba(255,255,255,.25)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}
function haloTex(){
  const s=256, c=document.createElement('canvas'); c.width=c.height=s;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,.55)');
  g.addColorStop(.5,'rgba(255,255,255,.18)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}
const TEX_DOT = glowDotTex(), TEX_RING = ringTex(), TEX_HALO = haloTex();

/* ---------- starfield ---------- */
(function stars(){
  const n=260, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    pos[i*3]=(Math.random()-.5)*40;
    pos[i*3+1]=(Math.random()-.5)*26;
    pos[i*3+2]=-8-Math.random()*20;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({map:TEX_DOT,size:.14,transparent:true,opacity:.5,
    depthWrite:false,blending:THREE.AdditiveBlending,color:0xbfa8ff});
  const p=new THREE.Points(g,m); scene.add(p);
  tickers.push(t=>{ p.rotation.z = t*0.004; m.opacity = .38 + Math.sin(t*.8)*.12; });
})();

/* ---------- particle bursts ---------- */
const bursts=[];
function burst(pos, {count=40, color=0xffffff, speed=3.2, size=.16, life=1.1, gravity=2.2, rainbow=false}={}){
  if(reduceMotion) count = Math.floor(count*0.4);
  if(count<=0) return;
  const g=new THREE.BufferGeometry();
  const p=new Float32Array(count*3), col=new Float32Array(count*3), v=[];
  const base=new THREE.Color(color), tmp=new THREE.Color();
  for(let i=0;i<count;i++){
    p[i*3]=pos.x; p[i*3+1]=pos.y; p[i*3+2]=pos.z;
    const a=Math.random()*Math.PI*2, e=(Math.random()-.35)*Math.PI, s=speed*(.35+Math.random()*.85);
    v.push(new THREE.Vector3(Math.cos(a)*Math.cos(e)*s, Math.sin(e)*s+speed*.35, Math.sin(a)*Math.cos(e)*s*.5));
    if(rainbow) tmp.setHSL(Math.random(), .9, .65); else tmp.copy(base).lerp(new THREE.Color(0xffffff), Math.random()*.5);

  g.setAttribute('color', new THREE.BufferAttribute(col,3));

function updateBursts(dt){

    const arr=b.pts.geometry.attributes.position.array;
    for(let j=0;j<b.v.length;j++){

/* ---------- audio (synthesized, no files) ---------- */
let AC=null;
function audio(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function envGain(t0,a,d,peak=1){
  const g=AC.createGain();
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(peak,t0+a);
  g.gain.exponentialRampToValueAtTime(.0001,t0+a+d);
  return g;
}
function noiseBuf(){
  const b=AC.createBuffer(1,AC.sampleRate*1.2,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
let NB=null;
function sfxTear(){
  try{ audio(); NB=NB||noiseBuf();
    const t=AC.currentTime, s=AC.createBufferSource(); s.buffer=NB;
    const f=AC.createBiquadFilter(); f.type='bandpass';
    f.frequency.setValueAtTime(2600,t); f.frequency.exponentialRampToValueAtTime(320,t+.5); f.Q.value=.8;
    const g=envGain(t,.015,.5,.5);
    s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t+.7);
  }catch(e){}
}
function sfxWhoosh(vol=.25){
  try{ audio(); NB=NB||noiseBuf();
    const t=AC.currentTime, s=AC.createBufferSource(); s.buffer=NB;
    const f=AC.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(2400,t+.18);
    const g=envGain(t,.05,.3,vol);
    s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t+.45);
  }catch(e){}
}
function sfxChime(r){
  try{ audio();
    const t=AC.currentTime;
    const freqs = r==='mythic' ? [523,659,784,1047,1319] : r==='legendary' ? [523,659,988,1319] : r==='epic' ? [523,659,1047] : r==='rare' ? [440,659] : r==='uncommon' ? [415,554] : [392];
    freqs.forEach((f0,i)=>{
      const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f0;
      const g=envGain(t+i*.07,.01,.9,.16);
      o.connect(g).connect(AC.destination); o.start(t+i*.07); o.stop(t+i*.07+1);
    });
  }catch(e){}
}
function sfxBoom(){
  try{ audio();
    const t=AC.currentTime, o=AC.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(36,t+.5);
    const g=envGain(t,.01,.55,.6);

}

<script>

function slotFor(i){

function _phCanvas(def){

  const x=c.getContext('2d');

// Load full-res art textures for the injected cards (keyed by their def object).
async function preloadPackCards(list){

function buildPack(first){

  packTop=new THREE.Mesh(gt, new THREE.MeshBasicMaterial({map:texPack,transparent:true}));

          if (!packGroup) return;                       // pack was rebuilt mid-load

          const size = box.getSize(new THREE.Vector3());

async function tearPack(){

/* ---------- cards ---------- */
function rollRarity(final){
  const table = final ? ODDS_FINAL : ODDS;
  let r=Math.random();
  for(const [k,p] of table){ if(r<p) return k; r-=p; }
  return table[table.length-1][0];
}
function drawCard(i){
  // Embedded: reveal the game's pre-rolled card at slot i, in order.
  if (PACK_CARDS.length) {
    const def = PACK_CARDS[i] || PACK_CARDS[PACK_CARDS.length-1];
    return { def, rarity: RARITY[def.rarity] ? def.rarity : 'common' };
  }
  // Standalone demo fallback.
  const def = CARD_POOL[Math.floor(Math.random()*CARD_POOL.length)];
  const rarity = CARD_POOL.length>1 ? def.rarity : rollRarity(i===CARDS_PER_PACK-1);
  return { def, rarity };
}

function spawnCards(){
  cards=[];
  for(let i=0;i<CARDS_PER_PACK;i++){
    const {def, rarity} = drawCard(i);

/* ---------- reveal ---------- */
async function reveal(card, quick){
  if(card.revealed||busy) return;

  hint.classList.remove('show');
  const R=RARITY[card.rarity];
  const g=card.group;

  // lift to center
  sfxWhoosh(.2);

  await tweenP(340, easeOutCubic, k=>{
    g.position.x=lerp(p0.x,0,k);
    g.position.y=lerp(p0.y,0.05,k);
    g.position.z=2;
    g.rotation.z=lerp(p0.rz,0,k);
    g.scale.setScalar(lerp(p0.s,1.65,k));
  });

  // suspense ring in rarity color
  const suspense = quick ? R.suspense*.45 : R.suspense;
  const ring=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_RING,
    color:card.rarity==='mythic'?0xffffff:R.color, transparent:true, opacity:0,
    depthWrite:false, blending:THREE.AdditiveBlending}));

    ring.scale.setScalar(lerp(2.5,6.5,easeOutCubic(k))*pulse);
    ring.material.opacity=Math.sin(k*Math.PI)* (card.rarity==='common'?.25:.85);
    if(card.rarity==='mythic'||card.rarity==='legendary'){
      ring.material.color.setHSL((k*2.2)%1,.85,.7);
      if(k>.6) shake(.05);
    }
    card.glow.material.opacity=k*.5;
  });
  scene.remove(ring);

  // flip
  if(card.rarity==='mythic'){ sfxBoom(); flash(.9,460); shake(.2); }
  else if(card.rarity==='legendary'||card.rarity==='epic'){ flash(.5,320); shake(.08); }
  sfxChime(card.rarity);
  burst(new THREE.Vector3(0,0.05,2.2), {
    count:R.burst, color:R.color, rainbow:(card.rarity==='mythic'||card.rarity==='legendary'),
    speed:(card.rarity==='mythic'?5:3.4), size:.17, life:1.25
  });
  await tweenP(480, easeInOutCubic, k=>{
    g.rotation.y=lerp(Math.PI,0,k);
    g.scale.setScalar(1.65+Math.sin(k*Math.PI)*.14);
  });

  showToast(card.def.name, card.rarity);

  await wait(quick?260:620);

  await tweenP(380, easeInOutCubic, k=>{
    g.position.x=lerp(0,s.x,k);
    g.position.y=lerp(0.05,s.y,k);
    g.position.z=lerp(2,s.z,k);
    g.rotation.z=lerp(0,s.rz,k);
    g.scale.setScalar(lerp(1.65,1,k));
  });

  if(cards.every(c=>c.revealed)){
    state='DONE';

    hint.classList.add('show');
  }
}

    if(hit){
      const c=hit.object.userData.card;
      if(c.revealed) showCardDetail(c.def);   // already flipped → show what it is
      else if(!busy) reveal(c,false);
    }
  }
});

/* ---------- card detail popup (tap a revealed card to see it) ---------- */
function showCardDetail(def){
  if(!def) return;
  const el=document.getElementById('cardDetail'); if(!el) return;
  const r=_rar(def.rarity);
  el.querySelector('.cd-art').src = def.art || _phCanvas(def).toDataURL('image/png');
  el.querySelector('.cd-name').textContent = def.name || 'Card';
  const rr=el.querySelector('.cd-rarity'); rr.textContent = r.label; rr.style.color = r.css;
  const chips=[];
  if(def.type)          chips.push(String(def.type).toUpperCase());
  if(def.cost!==''&&def.cost!=null) chips.push('⚡ '+def.cost);
  if(def.element)       chips.push(def.element);
  if(def.stats)         chips.push(def.stats);
  el.querySelector('.cd-chips').innerHTML = chips.map(c=>`<span class="cd-chip">${String(c).replace(/</g,'&lt;')}</span>`).join('');
  const dd=el.querySelector('.cd-desc'); dd.textContent = def.desc||''; dd.style.display = def.desc ? 'block' : 'none';
  el.classList.add('show');
}
(function(){
  const el=document.getElementById('cardDetail'); if(!el) return;
  el.addEventListener('click', e=>{ if(e.target===el || (e.target.classList&&e.target.classList.contains('cd-close'))) el.classList.remove('show'); });
})();

/* ---------- main loop ---------- */
let last=now();
function loop(){
  requestAnimationFrame(loop);
  const t=now()/1000, dt=Math.min((now()-last)/1000,.05); last=now();

  for(let i=tweens.length-1;i>=0;i--){
    const w=tweens[i], k=Math.min((now()-w.t0)/w.dur,1);
    w.fn(w.ease(k));
    if(k>=1){ tweens.splice(i,1); if(w.done) w.done(); }
  }
  tickers.forEach(fn=>fn(t));
  updateBursts(dt);

  if(shakeAmt>0.001){
    camera.position.x=(Math.random()-.5)*shakeAmt;
    camera.position.y=(Math.random()-.5)*shakeAmt;
    shakeAmt*=.88;
  } else { camera.position.x=0; camera.position.y=0; }

  renderer.render(scene,camera);
}
loop();
loadAll();

/* ============================================================
   🔌 Parent bridge — receive the game's rolled pack + signal done.
   ============================================================ */
function resetToFreshPack(){
  try {
    cards.forEach(c=>{ if(c.group) scene.remove(c.group); }); cards=[];
    if(packGroup){ scene.remove(packGroup); packGroup=null; }
    buildPack(false);
    state='IDLE'; busy=false;
    toast.classList.remove('show');
    btnAll.classList.remove('show'); btnAgain.classList.remove('show');
    hint.textContent='Tap the pack to tear it open';
    hint.classList.add('show');
  } catch(e){}
}
window.addEventListener('message', async (e)=>{
  const d=e.data; if(!d || typeof d!=='object') return;
  if(d.type==='packopen:data' && Array.isArray(d.cards)){
    PACK_CARDS = d.cards.map(c=>({
      name:  (c && c.name)   ? String(c.name) : 'Card',
      rarity:(c && RARITY[c.rarity]) ? c.rarity : 'common',
      art:   (c && c.art)    ? String(c.art)  : '',
      type:  (c && c.type)   ? String(c.type) : '',
      cost:  (c && c.cost!=null) ? c.cost : '',
      element:(c && c.element) ? String(c.element) : '',
      stats: (c && c.stats)  ? String(c.stats) : '',
      desc:  (c && c.desc)   ? String(c.desc) : '',
    }));
    CARDS_PER_PACK = Math.max(1, PACK_CARDS.length);
    if(d.packName){ const sn=document.querySelector('.set-name small'); if(sn) sn.textContent=String(d.packName); }
    // 📦 Optional 3D pack model. Rebuilds the pack so the model is picked up.
    if (typeof d.packModel === 'string' && d.packModel && d.packModel !== packModelUrl) {
      packModelUrl = d.packModel;
      try { if (typeof buildPack === 'function') buildPack(false); } catch (e) {}
    }
    if(EMBEDDED) btnAgain.textContent='✓ Collect';
    await preloadPackCards(PACK_CARDS);
    if(cards.length) resetToFreshPack();          // a previous pack was showing → reset
    else { hint.textContent='Tap the pack to tear it open'; hint.classList.add('show'); }
  }
});
try { if(EMBEDDED) parent.postMessage({type:'packopen:ready'}, '*'); } catch(e){}
</script>
