// ⚠ THE IFRAME HAS ITS OWN MAP AND IT IS THE ONE THAT FIRES. Fixing the host's
// _whReason left this one covering 10 of 31 codes with a fallback that returned
// the RAW IDENTIFIER — maxing a bay showed the player "❌ bay_maxed", and a
// blocked rpc showed them "❌ blocked". Never return r.reason: an unmapped code
// is a bug in this table, and the player should not be the one to read it.
function reasonText(r) {
  var cur = (r && r.currency === 'aza') ? 'Aza' : 'Cinder';
  var m = {
    insufficient:  'Not enough ' + cur + '.',
    no_room:       'That bay has no room left.',
    no_room_at_destination: 'Your bay cannot hold that much'
                   + (r && r.free_kg != null ? ' — only ' + Math.floor(r.free_kg).toLocaleString() + ' kg is free.' : '.'),
    too_heavy:     'That crate is too heavy for your lifter'
                   + (r && r.weight_kg ? ' (' + r.weight_kg + ' kg vs ' + r.carry_kg + ' kg).' : '.'),
    too_large:     'That load is too heavy for one run — send it in smaller batches.',
    in_transit:    'That load has not arrived yet.',
    wrong_unit:    'That crate is addressed to a different bay.',
    already_stored:'That crate has already been put away.',
    rental_expired:'That rental has run out — renew it before storing more.',
    bay_maxed:     'That bay is as large as one bay can get — the renter needs a second one.',
    tier_cap:      'This warehouse cannot hold any more bays — upgrade the building first.',
    max_tier:      'The warehouse is already fully upgraded.',
    already_owned: 'You already own that weight lifter.',
    bad_tier:      'That is not a weight lifter you can buy.',
    not_allowed:   'You are not allowed to touch that bay.',
    not_your_unit: 'That bay is not yours.',
    not_yours:     'That is not yours.',
    no_unit:       'That storage bay no longer exists.',
    no_crate:      'That crate is no longer on the van.',
    no_shipment:   'That load no longer exists.',
    no_warehouse:  'That warehouse no longer exists.',
    no_free_unit:  'There is no free bay here.',
    not_rented:    'Nobody is renting that bay.',
    still_in_grace:'That renter still has time to collect their goods.',
    nothing_there: 'There is nothing in there to take out.',
    too_late:      'That load has already been put away.',
    own_warehouse: 'That is your own warehouse.',
    closed:        'That warehouse is not taking renters.',
    empty_payload: 'Nothing was selected to send.',
    bad_origin:    'That is not a valid place to send from.',
    not_signed_in: 'You need to be signed in.',
    blocked:       'That action is not available from here.',
    rpc_failed:    'The storage network could not complete that.',
    timeout:       'The storage network did not answer.'
  };
  return (r && m[r.reason]) || 'Something went wrong.';
}

/* ══════════════════════════════════════════════════════════════════════════
   INTERACTION — pick a crate up, put it down
   ══════════════════════════════════════════════════════════════════════════ */
function nextCrate() {
  var p = (App.pendingCrates || [])[0];
  return p || null;
}
function doInteract() {
  var n = App.near;
  if (!n) return;
  if (n.kind === 'lifter') { openLifterModal(); return; }
  if (n.kind === 'upgrade') {
    if (!isOwner()) { toast('🏗 This is not your warehouse — only its owner can upgrade it.', 3200); return; }
    openUpgradeModal(); return;
  }
  if (n.kind === 'truck') {
    if (App.held) { toast('You are already carrying a crate — take it to a bay.', 2400); return; }
    var p = nextCrate();
    if (!p) {
      var st = WH.state();
      var waiting = (st.shipments || []).filter(function (s) { return new Date(s.eta_at).getTime() > Date.now(); });
      toast(waiting.length
        ? '🚚 The van is empty. The next load lands in ' + etaText(waiting[0]).replace(/<[^>]+>/g, '') + '.'
        : '🚚 The van is empty.', 3000);
      return;
    }
    var lim = carryLimit();
    if (p.c.weight_kg > lim) {
      toast('🏋 That crate is <b>' + p.c.weight_kg + ' kg</b> — your lifter tops out at <b>'
        + lim + ' kg</b>. Buy a bigger weight lifter.', 4200);
      return;
    }
    App.held = p;
    App.carried = p.c.weight_kg;
    App.heldMesh.visible = true;
    var m = App.crateMeshes[p.c.id]; if (m) { scene.remove(m); delete App.crateMeshes[p.c.id]; }
    var bn = bayNoFor(p.s.unit_id);
    toast('📦 Picked up a ' + p.c.weight_kg + ' kg crate — take it to <b>Bay ' + bn + '</b>.', 3000);
    renderHud();
    return;
  }
  if (n.kind === 'bay') {
    // Empty-handed at a bay = LOOK INSIDE IT. This is a literal clause of the
    // design ("press E and see the storage that was delivered") and it used to
    // answer "Nothing to put down", which told the player nothing at all.
    if (!App.held) { openBayModal(n.unit); return; }
    var target = n.unit;
    var want = App.held.s.unit_id;
    if (target.id !== want) {
      toast('❌ That crate is addressed to <b>Bay ' + bayNoFor(want) + '</b>, not Bay ' + target.bay_no + '.', 3400);
      return;
    }
    var crate = App.held;
    WH.rpc('wh_store_crate', { p_crate_id: crate.c.id, p_unit_id: target.id }).then(function (r) {
      if (!r || r.ok === false) {
        if (r && r.reason === 'no_room') { openNoRoomModal(target, crate.c.weight_kg, crate); return; }
        toast('❌ ' + reasonText(r), 3600);
        return;
      }
      applyStored(crate, r);
      toast('📦 Stored in Bay ' + r.bay_no + ' — ' + Math.round(r.used_kg) + '/' + r.capacity_kg + ' kg'
        + (r.shipment_done ? '. <b>Delivery complete.</b>' : '.'), 3200);
    });
  }
}

// Mirror the server's answer for one stored crate into local state, drop the
// crate from the player's hands, and rebuild what changed. Shared by the normal
// drop and by the buy-space-then-store path, so the two can never drift.
function applyStored(crate, r) {
  App.held = null; App.carried = 0; App.heldMesh.visible = false;
  var st = WH.state();
  var u = st.units.filter(function (x) { return x.id === r.unit_id; })[0];
  if (u) { u.used_kg = r.used_kg; if (r.capacity_kg) u.capacity_kg = r.capacity_kg; }
  (st.shipments || []).forEach(function (s) {
    if (s.id !== crate.s.id) return;
    s.crates = (s.crates || []).filter(function (c) { return c.id !== crate.c.id; });
    s.crates_stored = r.crates_stored;
    if (r.shipment_done) s.status = 'stored';
  });
  WH.setState(st); refreshWorld();
}

function refreshWorld() {
  // Rebuild only what the world derives from state; the player keeps standing
  // exactly where they were.
  App.colliders = App.colliders.filter(function (c) { return !c._bay; });
  App.buildBays();
  rebuildTruckCrates();
  renderHud();
}

/* ══════════════════════════════════════════════════════════════════════════
   FIRST-PERSON CONTROLLER
   ══════════════════════════════════════════════════════════════════════════ */
function bindControls() {
  var el = renderer.domElement;
  // Pointer lock is the primary control — "normal standard gaming controls".
  // Drag-look is kept as the fallback for touch and for browsers that refuse
  // the lock, so the yard is never unplayable.
  el.addEventListener('click', function () {
    if ($('modal').classList.contains('on')) return;
    if (!Ctl.locked && el.requestPointerLock) { try { el.requestPointerLock(); } catch (e) {} }
  });
  document.addEventListener('pointerlockchange', function () {
    Ctl.locked = (document.pointerLockElement === el);
    $('cross').style.display = Ctl.locked ? 'block' : 'block';
  });
  document.addEventListener('mousemove', function (e) {
    if (Ctl.locked) {
      Ctl.yaw -= e.movementX * 0.0022;
      Ctl.pitch = Math.max(-1.25, Math.min(1.25, Ctl.pitch - e.movementY * 0.0022));
    } else if (Ctl.drag) {
      Ctl.yaw -= (e.clientX - Ctl.lx) * 0.005;
      Ctl.pitch = Math.max(-1.25, Math.min(1.25, Ctl.pitch - (e.clientY - Ctl.ly) * 0.005));
      Ctl.lx = e.clientX; Ctl.ly = e.clientY;
    }
  });
  el.addEventListener('mousedown', function (e) { Ctl.drag = true; Ctl.lx = e.clientX; Ctl.ly = e.clientY; });
  addEventListener('mouseup', function () { Ctl.drag = false; });
  el.addEventListener('touchstart', function (e) {
    var t = e.touches[0]; Ctl.drag = true; Ctl.lx = t.clientX; Ctl.ly = t.clientY;
  }, { passive: true });
  addEventListener('touchmove', function (e) {
    if (!Ctl.drag) return; var t = e.touches[0];
    Ctl.yaw -= (t.clientX - Ctl.lx) * 0.006;
    Ctl.pitch = Math.max(-1.25, Math.min(1.25, Ctl.pitch - (t.clientY - Ctl.ly) * 0.006));
    Ctl.lx = t.clientX; Ctl.ly = t.clientY;
  }, { passive: true });
  addEventListener('touchend', function () { Ctl.drag = false; });

  addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    Ctl.keys[k] = true;
    if (k === 'e') { doInteract(); }
    if (k === 'q' && App.held) { dropHeld(); }
    if (k === 'escape' && $('modal').classList.contains('on')) closeModal();
    if (['w', 'a', 's', 'd', ' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(k) >= 0) e.preventDefault();
  });
  addEventListener('keyup', function (e) { Ctl.keys[(e.key || '').toLowerCase()] = false; });
  // ⚠ Losing focus mid-stride used to leave the key DOWN: hold W, switch tabs
  // for 2.5 s, come back and you had walked four metres blind. The browser
  // never sends the keyup, so the state has to be cleared by hand.
  var releaseAll = function () {
    Ctl.keys = {}; Ctl.move.f = Ctl.move.b = Ctl.move.l = Ctl.move.r = 0; Ctl.drag = false;
  };
  addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAll(); });

  // Touch thumb pad.
  var map = ['f', 'l', 'r', 'b'];
  document.querySelectorAll('#touch .pad .k').forEach(function (b, i) {
    var k = map[i];
    var on = function (ev) { ev.preventDefault(); Ctl.move[k] = 1; };
    var off = function (ev) { ev.preventDefault(); Ctl.move[k] = 0; };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
    b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
  });
  $('t-use').addEventListener('click', doInteract);
  if ('ontouchstart' in window) $('touch').classList.add('on');

  $('b-exit').onclick = function () { WH.exit(); };
  $('b-lift').onclick = openLifterModal;
  $('b-up').onclick = openUpgradeModal;
  $('prompt').addEventListener('click', doInteract);
}

function dropHeld() {
  if (!App.held) return;
  var p = App.held;
  App.held = null; App.carried = 0; App.heldMesh.visible = false;
  // Put it back on the van rather than leaving it in the mud.
  App.pendingCrates = App.pendingCrates || [];
  if (App.pendingCrates.indexOf(p) < 0) App.pendingCrates.unshift(p);
  rebuildTruckCrates(); renderHud();
  toast('📦 Crate put back on the van.', 2200);
}

/* ── movement + collision. One AABB list, swept per axis so sliding along a
      wall feels right instead of sticking. ─────────────────────────────────── */
// ⚠ THE ONLY PLACE THE YARD DECIDES WHERE A PLAYER MAY STAND.
// The back wall MOVES: shedZB() derives the shed's depth from the bay count,
// but this clamp used to be hardcoded at -19.5 and never followed it. At tier 5
// the shed reaches z -46.6 and holds 32 bays — 20 of them sat behind an
// invisible wall you could walk into but never through. 1,500,000 Cinder for 12
// walkable bays out of 32.
//
// It is a FUNCTION, and the tick loop calls it, because the reachability gate
// calls it too. The first fix left the clamp inline and taught the gate to model
// it; the gate then happily re-certified the hardcoded version, because a gate
// that reimplements a rule only ever tests its own copy of it. Same discipline
// as blocked(): the check runs the game's code, never a paraphrase of it.
function clampPos(x, z) {
  var zBack = (App.shedZB != null ? App.shedZB : -19) + 0.6;
  return { x: Math.max(-14.5, Math.min(14.5, x)),
           z: Math.max(zBack, Math.min(17.0, z)) };
}
App.clampPos = clampPos;

function blocked(x, z) {
  var R = 0.42;
  for (var i = 0; i < App.colliders.length; i++) {
    var c = App.colliders[i];
    if (Math.abs(x - c.x) < c.hw + R && Math.abs(z - c.z) < c.hd + R) return true;
  }
  return false;
}

function tick() {
  requestAnimationFrame(tick);
  var dt = Math.min(0.05, clock.getDelta());
  if (!App.ready) { renderer.render(scene, camera); return; }

  // roll the truck along its arrival / departure path
  if (App.truckDrive) {
    var d = App.truckDrive;
    // ⚠ WALL CLOCK, not `dt`. Movement caps dt at 50 ms so a stalled frame can
    // never teleport the player through a wall — but feeding that capped value
    // to a cinematic means a machine running at 2 fps takes 34 seconds to park
    // a 3.4-second animation. A cinematic should take the time it says.
    var dt2 = Math.min(1, (performance.now() - d.t0) / d.dur);
    // ease-out on arrival (it brakes), ease-in on departure (it pulls away)
    var e = d.out ? dt2 * dt2 : 1 - Math.pow(1 - dt2, 3);
    App.truck.position.lerpVectors(d.from, d.to, e);
    if (dt2 >= 1) {
      if (d.out) App.truck.visible = false;
      App.truckDrive = null;
      rebuildTruckCrates();
    }
  }
  // Smoothed look, the same way the card-shop walk (_cs3d) does it:
  //   const k = 1 - Math.exp(-dt * 14); cyaw += (yaw - cyaw) * k
  // Frame-rate independent, and it gives the head real weight instead of
  // snapping straight to the raw input.
  if (Ctl.cyaw === undefined) { Ctl.cyaw = Ctl.yaw; Ctl.cpitch = Ctl.pitch; }
  var kSm = 1 - Math.exp(-dt * 18);
  Ctl.cyaw += (Ctl.yaw - Ctl.cyaw) * kSm;
  Ctl.cpitch += (Ctl.pitch - Ctl.cpitch) * kSm;
  camera.rotation.order = 'YXZ';
  camera.rotation.x = Ctl.cpitch; camera.rotation.y = Ctl.cyaw;

  // ⚠ Reading a modal must not walk you out of the sensor that raised it.
  var modalOpen = $('modal').classList.contains('on');
  var K = modalOpen ? {} : Ctl.keys, mv = modalOpen ? { f: 0, b: 0, l: 0, r: 0 } : Ctl.move;
  var f = (K['w'] || K['arrowup'] || mv.f ? 1 : 0) - (K['s'] || K['arrowdown'] || mv.b ? 1 : 0);
  var r = (K['d'] || K['arrowright'] || mv.r ? 1 : 0) - (K['a'] || K['arrowleft'] || mv.l ? 1 : 0);
  if (f || r) {
    var spd = (K['shift'] ? SPRINT : SPEED) * (App.held ? 0.78 : 1) * dt;
    // Normalise so diagonal is not 41% faster — the classic tell of a rushed
    // controller.
    var len = Math.hypot(f, r); f /= len; r /= len;
    var fx = -Math.sin(Ctl.cyaw), fz = -Math.cos(Ctl.cyaw);
    var rx = Math.cos(Ctl.cyaw), rz = -Math.sin(Ctl.cyaw);
    var dx = (fx * f + rx * r) * spd, dz = (fz * f + rz * r) * spd;
    var nx = camera.position.x + dx, nz = camera.position.z + dz;
    if (!blocked(nx, camera.position.z)) camera.position.x = nx;
    if (!blocked(camera.position.x, nz)) camera.position.z = nz;
    // Keep the player in the yard. The clamps used to enclose 80 x 54 m around
    // a 26 x 30 m site, so three quarters of the walkable area was unlit grey
    // plane with the warehouse out of sight behind you.
    var _cp = App.clampPos(camera.position.x, camera.position.z);
    camera.position.x = _cp.x; camera.position.z = _cp.z;
    Ctl.bob += spd * 2.2;
  } else {
    Ctl.bob += dt * 1.2;
  }
  // Head bob: small enough not to nauseate, present enough that you are walking
  // rather than gliding. Carrying a crate slows the cadence and deepens it.
  var amp = (f || r) ? (App.held ? 0.035 : 0.024) : 0.004;
  camera.position.y = EYE + Math.sin(Ctl.bob) * amp;
  if (App.heldMesh.visible) {
    App.heldMesh.position.y = -0.34 + Math.sin(Ctl.bob * 0.5) * 0.018;
    App.heldMesh.rotation.z = Math.sin(Ctl.bob * 0.5) * 0.03;
  }

  // Nearest sensor → the E prompt.
  var best = null, bd = Infinity;
  for (var i = 0; i < App.sensors.length; i++) {
    var s = App.sensors[i];
    var d = Math.hypot(camera.position.x - s.x, camera.position.z - s.z);
    if (d < s.r && d < bd) { bd = d; best = s; }
  }
  if (best !== App.near) {
    App.near = best;
    var p = $('prompt');
    if (!best) p.style.display = 'none';
    else {
      p.style.display = 'block';
      p.innerHTML = 'E — ' + promptFor(best);
    }
  } else if (best) {
    $('prompt').innerHTML = 'E — ' + promptFor(best);
  }

  try {
    if ((App._saveTick = (App._saveTick || 0) + 1) % 40 === 0) {
      sessionStorage.setItem('wh_walk', JSON.stringify({
        x: camera.position.x, z: camera.position.z, yaw: Ctl.cyaw, pitch: Ctl.cpitch }));
    }
  } catch (e) {}
  // Walk the interior shadow light along with the player so its tight frustum is
  // always over what is on screen.
  //
  // ⚠ IT IS TILTED, AND BOTH REASONS MATTER.
  //
  // 1. It used to sit at (camX, 6.2, camZ) aiming at (camX, 0, camZ) — straight
  //    down. A vertical wall lit from directly overhead casts its shadow into
  //    its own footprint, hidden underneath itself, so it could not draw a
  //    contact shadow beside anything by construction. Measured: toggling
  //    castShadow moved mean frame luminance 132.60 → 132.66, Δ 0.06 of ~133.
  //    Zeroing its intensity moved it 132.6 → 121.0 — so it was contributing
  //    ~11.6 of light and ~0 of shadow.
  // 2. Straight down also means N·L = 0 on every VERTICAL face, so it lit the
  //    floor and contributed exactly nothing to the bay flanks. A causation
  //    test (zero each light, read the delta on an aisle-facing bay face)
  //    measured: hiBay 0.0, key 0.0, hemisphere 6.1, ambient 1.8, fill 2.6 —
  //    and the NEAREST shed point light 63.7 against the far one's 5.4. The
  //    only thing lighting a bay flank was distance to one of two fixtures, so
  //    between them the flanks fell to ~10 while the floor kept the ~16 that
  //    hiBay and the key were giving it, and the floor < bays < walls ladder
  //    inverted. That was the real bug; the albedo I changed was a symptom.
  //
  // So: over the player's shoulder and off to one side, aiming ahead of them.
  // ~52° elevation gives vertical faces a real N·L and throws their shadows
  // away from the player where they can be seen.
  if (App.hiBay) {
    var _hy = (Ctl.cyaw !== undefined ? Ctl.cyaw : Ctl.yaw);
    var _fx = -Math.sin(_hy), _fz = -Math.cos(_hy);      // where the player looks
    var _rx = Math.cos(_hy),  _rz = -Math.sin(_hy);      // their right
    var _tx = camera.position.x + _fx * 3.0;             // aim a little ahead
    var _tz = camera.position.z + _fz * 3.0;
    App.hiBay.position.set(_tx - _fx * 4.2 + _rx * 2.6, 6.2, _tz - _fz * 4.2 + _rz * 2.6);
    App.hiBay.target.position.set(_tx, 0, _tz);
    App.hiBay.__oldFollow = false;
    App.hiBay.target.updateMatrixWorld();
  }
  renderer.render(scene, camera);
}
function promptFor(s) {
  if (s.kind === 'lifter') return 'Weight lifters';
  if (s.kind === 'upgrade') return 'Warehouse & storage units';
  if (s.kind === 'truck') {
    if (App.held) return 'Put the crate back on the van';
    var p = nextCrate();
    return p ? ('Take a crate (' + p.c.weight_kg + ' kg → Bay ' + bayNoFor(p.s.unit_id) + ')')
             : 'The van is empty';
  }
  if (s.kind === 'bay') {
    if (!App.held) return 'Look in Bay ' + s.unit.bay_no + ' (' + bayFillText(s.unit) + (bayKnown(s.unit) ? ' kg)' : ')');
    return 'Drop in Bay ' + s.unit.bay_no;
  }
  return 'Use';
}

/* ══════════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════════ */
function start() {
  if (!window.THREE) {
    $('bootmsg').innerHTML = '3D failed to load.<br><span style="color:var(--bad)">Check the connection and reopen the warehouse.</span>';
    return;
  }
  buildScene();
  bindControls();
  App.buildBays();
  rebuildTruckCrates();
  renderHud();
  App.ready = true;
  $('boot').classList.add('gone');
  toast('🏗 <b>Your warehouse.</b> WASD to walk · mouse to look · <b>E</b> to use · Shift to run.', 6000);
  tick();
}

window.addEventListener('wh:changed', function () { renderHud(); });

// Ask the host for state. If nobody answers in 1.2 s we are standalone — build
// the mock yard and play anyway, which is also how this page gets tested.
(function boot() {
  var started = false;
  var go = function () { if (started) return; started = true; start(); };
  WH.onReady(function () { go(); });
  setTimeout(function () {
    if (!WH.state()) { WH.setState(MOCK.build()); }
    go();
  }, 1200);
})();
</script>
