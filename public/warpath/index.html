<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mythic Spellbook — Warpath</title>
<!-- WP_BUILD is a deploy probe, not decoration — same reasoning as NC_BUILD in
     public/node-city/index.html. Only a CONTENT change moves wrangler's hash,
     so bump this whenever the page 404s on the edge and grep it on the served
     page to prove the deploy actually landed. -->
<script>window.WP_BUILD = "v120g1-warpath";</script>
<!-- ════════════════════════════════════════════════════════════════════════
     WARPATH — the run-based expedition/draft mode.

     Your Hero leaves the permanent city, enters a temporary four-player world,
     pitches a camp, explores under fog of war, drafts a deck out of what it
     finds, fights through REAL Mythic Spellbook battles, and extracts home.

     HOW IT CONNECTS TO THE MAIN GAME (index.html):
       • Mounted as a same-origin iframe, exactly like public/node-city/ and
         public/ascent-map/. It holds no Supabase session of its own.
       • Everything it needs from the server goes through ONE channel:
         WarpathNet.rpc(fn, args) → postMessage → the parent's Cloud.client
         → the matching warpath_* RPC. See warpath-net.js.
       • Card battles are NOT fought here. Colliding with a hero posts
         'warpath:battle' to the parent, which builds App.battlePrep and runs
         the existing engine; the verdict comes back as 'warpath:battleResult'.
         This file contains no combat code and never will.
       • Opened directly (not in an iframe) it runs a local mock so the screen
         can be developed and reviewed without a database — same "ship as-is =
         standalone mock mode" arrangement the node city uses.

     The world is derived from warpath_runs.seed by warpath-mapgen.js, and the
     server derives the identical world in plpgsql. No tiles are transmitted.
     ════════════════════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --obsidian:#0d0b12;
    --panel:rgba(23,19,34,.88);
    --panel-solid:#1a1626;
    --edge:#2e2740;
    --ember:#ff7a2f;
    --ember-dim:#b34f1a;
    --gold:#d4af37;
    --gold-soft:#f3e7c8;
    --bone:#e8e2d5;
    --mist:#8f87a3;
    --valid:#4caf7a;
    --invalid:#c0473f;
    --arcane:#9b4dff;
    --sky:#7fb8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--obsidian);
    font-family:'Crimson Text',Georgia,serif;color:var(--bone);}
  .display{font-family:'Cinzel',Georgia,serif;letter-spacing:.1em;text-transform:uppercase;}
  button{font-family:inherit;color:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}

  /* ── Boot / entering cinematic ─────────────────────────────────────── */
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;z-index:90;background:
      radial-gradient(1100px 700px at 50% 40%, #1d1228 0%, transparent 62%), var(--obsidian);
    transition:opacity .8s;}
  #boot.done{opacity:0;pointer-events:none;}
  #boot .sig{width:56px;height:56px;border:2px solid var(--ember-dim);border-top-color:var(--ember);
    border-radius:50%;animation:spin 1.1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #bootmsg{font-size:13px;color:var(--gold);letter-spacing:.42em;text-indent:.42em;
    font-family:'Cinzel',serif;font-weight:600;}
  #bootsub{font-size:14px;color:var(--mist);font-style:italic;max-width:440px;text-align:center;
    line-height:1.5;}

  /* ── Map ───────────────────────────────────────────────────────────── */
  #map{position:absolute;inset:0;display:block;cursor:grab;touch-action:none;}
  #map.dragging{cursor:grabbing;}

  /* ── Top rail: turn, resources, deck progress ──────────────────────── */
  #top{position:absolute;top:0;left:0;right:0;z-index:6;pointer-events:none;
    padding:10px 12px 26px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;
    background:linear-gradient(180deg,rgba(13,11,18,.95),rgba(13,11,18,0));}
  .pill{display:flex;align-items:center;gap:6px;background:var(--panel);
    border:1px solid var(--edge);border-radius:7px;padding:4px 10px;font-size:13px;
    font-variant-numeric:tabular-nums;pointer-events:auto;}
  .pill .ic{font-size:13px}
  .pill .sub{font-size:10px;color:var(--mist)}
  .pill.turn{border-color:rgba(212,175,55,.55);color:var(--gold-soft)}
  .pill.moves{border-color:rgba(255,122,47,.55)}
  .pill.warn{border-color:var(--invalid);color:#ffb4ad}
  .pill .vault{color:var(--sky)}
  #runname{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.16em;color:var(--gold);
    margin-right:6px;white-space:nowrap;text-transform:uppercase;}
  #deckbar{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--edge);border-radius:7px;padding:4px 10px;font-size:12px;}
  #decktrack{position:relative;width:150px;height:6px;background:#241d33;border-radius:3px;overflow:hidden}
  #deckfill{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;
    background:linear-gradient(90deg,var(--ember-dim),var(--gold));transition:width .5s}
  #decktrack i{position:absolute;top:0;bottom:0;width:1px;background:rgba(232,226,213,.28)}

  /* ── Right dossier panel ───────────────────────────────────────────── */
  #side{position:absolute;top:0;right:0;bottom:0;width:334px;z-index:7;
    background:linear-gradient(180deg,rgba(16,13,24,.97),rgba(11,9,16,.99));
    border-left:1px solid var(--edge);display:flex;flex-direction:column;
    transform:translateX(0);transition:transform .35s cubic-bezier(.4,0,.2,1);}
  #side.hidden{transform:translateX(100%)}
  #sidetabs{display:flex;border-bottom:1px solid var(--edge);flex:0 0 auto}
  #sidetabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;
    padding:12px 4px 10px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--mist);cursor:pointer;transition:.2s}
  #sidetabs button:hover{color:var(--bone)}
  #sidetabs button.on{color:var(--gold);border-bottom-color:var(--gold);
    background:linear-gradient(180deg,rgba(212,175,55,.09),transparent)}
  #sidebody{flex:1;overflow-y:auto;padding:14px}
  #sidefoot{flex:0 0 auto;padding:12px 14px;border-top:1px solid var(--edge);
    display:flex;flex-direction:column;gap:8px}
  #sidetoggle{position:absolute;top:50%;left:-26px;width:26px;height:56px;margin-top:-28px;
    background:var(--panel-solid);border:1px solid var(--edge);border-right:0;
    border-radius:7px 0 0 7px;color:var(--mist);cursor:pointer;font-size:13px}

  h3.sec{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--edge)}
  h3.sec + p.hint{margin-top:-3px}
  p.hint{font-size:13px;color:var(--mist);font-style:italic;line-height:1.5;margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
  .kv span:first-child{color:var(--mist)}
  .kv b{font-weight:600;font-variant-numeric:tabular-nums}

  .btn{display:block;width:100%;padding:9px 12px;border-radius:7px;cursor:pointer;
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
    border:1px solid var(--edge);background:linear-gradient(180deg,#221b33,#171226);
    color:var(--bone);transition:.16s;text-align:center}
  .btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-soft);
    box-shadow:0 0 14px rgba(212,175,55,.16)}
  .btn:disabled{opacity:.36;cursor:not-allowed}
  .btn.gold{border-color:rgba(212,175,55,.6);color:var(--gold-soft);
    background:linear-gradient(180deg,rgba(120,90,30,.45),rgba(60,44,14,.5))}
  .btn.ember{border-color:rgba(255,122,47,.6);color:#ffd0b0;
    background:linear-gradient(180deg,rgba(140,60,20,.5),rgba(70,30,10,.55))}
  .btn.danger{border-color:rgba(192,71,63,.6);color:#ffb4ad}
  .btn.sm{padding:6px 9px;font-size:10px}

  /* Camp diagram — the brief's layout, drawn as it is written */
  #campgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px;
    align-items:stretch}
  .cnode{position:relative;border:1px solid var(--edge);border-radius:8px;padding:8px 6px;
    text-align:center;cursor:pointer;background:rgba(20,16,30,.8);transition:.18s;min-height:70px;
    display:flex;flex-direction:column;justify-content:center;gap:3px}
  .cnode:hover{border-color:var(--gold);background:rgba(38,30,54,.9)}
  .cnode.built{border-color:rgba(76,175,122,.5)}
  .cnode.locked{opacity:.4;cursor:not-allowed}
  .cnode.core{border-color:rgba(255,122,47,.65);background:rgba(50,26,14,.7)}
  .cnode .ci{font-size:19px;line-height:1}
  .cnode .cn{font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.06em;color:var(--bone);
    text-transform:uppercase;line-height:1.25}
  .cnode .cl{font-size:10px;color:var(--gold);font-variant-numeric:tabular-nums}
  .cnode .cl.none{color:var(--mist)}
  .cspacer{visibility:hidden}

  .res-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;
    padding:4px 0;border-bottom:1px solid rgba(46,39,64,.5)}
  .res-row:last-child{border-bottom:0}
  .res-row .nm{display:flex;align-items:center;gap:6px}
  .res-row .amt{font-variant-numeric:tabular-nums}
  .res-row .amt .c{color:var(--ember)}
  .res-row .amt .s{color:var(--sky)}
  .res-row .amt .d{color:var(--mist);font-size:11px}
  .res-row.mat{border-bottom-color:rgba(155,77,255,.22)}
  .wallets{display:grid;gap:6px;margin:0 0 10px}
  .wallets div{border:1px solid var(--edge);border-radius:7px;padding:6px 9px;background:rgba(20,16,30,.6)}
  .wallets b{display:block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:2px}
  .wallets span{font-size:12px;color:var(--mist);font-style:italic;line-height:1.4}
  .wallet.sec{color:var(--sky);border-color:rgba(127,184,255,.5)}

  .card-chip{display:flex;justify-content:space-between;align-items:center;gap:6px;
    font-size:12.5px;padding:5px 8px;border:1px solid var(--edge);border-radius:6px;
    margin-bottom:5px;background:rgba(20,16,30,.7)}
  .card-chip .src{font-size:9px;letter-spacing:.09em;text-transform:uppercase;
    font-family:'Cinzel',serif;padding:2px 5px;border-radius:4px}
  .src.starter{color:var(--mist);border:1px solid var(--edge)}
  .src.recruit{color:var(--valid);border:1px solid rgba(76,175,122,.45)}
  .src.discovery{color:var(--gold);border:1px solid rgba(212,175,55,.45)}
  .src.boss{color:var(--arcane);border:1px solid rgba(155,77,255,.5)}
  .card-chip.unsecured{border-style:dashed;opacity:.86}

  .feed div{font-size:12.5px;color:var(--mist);padding:4px 0;border-bottom:1px solid rgba(46,39,64,.4);
    line-height:1.45}
  .feed div b{color:var(--bone);font-weight:600}
  .feed div .t{color:var(--edge);font-variant-numeric:tabular-nums;font-size:11px}

  /* ── Modals: encounter draft, recruitment, extraction, summary ─────── */
  .veil{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(5,4,9,.86);backdrop-filter:blur(3px);
    animation:fade .3s ease}
  @keyframes fade{from{opacity:0}}
  .sheet{width:min(760px,100%);max-height:92vh;overflow-y:auto;background:
      radial-gradient(700px 320px at 50% 0%, #221634 0%, transparent 70%), var(--panel-solid);
    border:1px solid var(--edge);border-radius:14px;padding:26px;
    box-shadow:0 24px 70px rgba(0,0,0,.75)}
  .sheet .eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.44em;text-indent:.44em;
    color:var(--ember);text-align:center;margin-bottom:8px}
  .sheet h2{font-family:'Cinzel',serif;font-size:clamp(19px,3.2vw,27px);letter-spacing:.1em;
    text-transform:uppercase;text-align:center;color:var(--gold-soft);margin-bottom:8px;
    text-shadow:0 0 26px rgba(212,175,55,.28)}
  .sheet .lede{text-align:center;font-style:italic;color:var(--mist);font-size:15px;
    line-height:1.6;max-width:560px;margin:0 auto 22px}
  .picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .pick{border:1px solid var(--edge);border-radius:11px;padding:16px 14px;text-align:center;
    cursor:pointer;background:linear-gradient(180deg,rgba(30,24,44,.9),rgba(17,13,26,.95));
    transition:.2s;display:flex;flex-direction:column;gap:7px;align-items:center}
  .pick:hover:not(.no){border-color:var(--gold);transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(0,0,0,.55),0 0 22px rgba(212,175,55,.14)}
  .pick.no{opacity:.4;cursor:not-allowed}
  .pick .pi{font-size:34px;line-height:1}
  .pick .pn{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.07em;color:var(--gold-soft);
    text-transform:uppercase;line-height:1.35}
  .pick .pt{font-size:11px;color:var(--mist);letter-spacing:.08em;text-transform:uppercase;
    font-family:'Cinzel',serif}
  .pick .pd{font-size:12.5px;color:var(--mist);font-style:italic;line-height:1.45}
  .pick .pc{font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:2px}
  .pick .pc.bad{color:var(--invalid)}
  .pick .pc.ok{color:var(--valid)}
  /* Real card faces in the draft — the offer has to say what it IS. */
  .pick .cels{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
  .pick .cel{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-family:'Cinzel',serif;
    color:var(--e);border:1px solid var(--e);border-radius:999px;padding:1px 7px;opacity:.9}
  .pick .cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 6px;width:100%;
    margin-top:2px;font-size:10px;color:var(--mist)}
  .pick .cstats span{display:flex;flex-direction:column;align-items:center;line-height:1.15}
  .pick .cstats b{color:var(--bone);font-size:12.5px;font-variant-numeric:tabular-nums}
  .pick .ctags{font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    font-family:'Cinzel',serif;color:var(--arcane)}
  .pick .lockbadge{position:absolute;top:8px;right:9px;font-size:14px;opacity:.75}
  .pick{position:relative}
  .pick .wallet{font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-family:'Cinzel',serif;
    color:var(--ember);border:1px solid rgba(255,122,47,.5);border-radius:999px;padding:1px 6px;margin-left:4px}
  #decktrack i.full{width:2px;background:var(--gold)}
  .sheet-foot{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .sheet-foot .btn{width:auto;min-width:150px}

  /* Extraction summary — the brief's EXPEDITION COMPLETE block */
  .summary{max-width:430px;margin:0 auto 6px}
  .summary .row{display:flex;justify-content:space-between;gap:14px;padding:6px 0;
    border-bottom:1px dotted rgba(143,135,163,.28);font-size:14.5px}
  .summary .row span{color:var(--mist)}
  .summary .row b{font-variant-numeric:tabular-nums;color:var(--gold-soft);font-weight:600}
  .haul{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:16px 0 4px}
  .haul .h{border:1px solid rgba(212,175,55,.4);border-radius:6px;padding:4px 9px;font-size:12.5px;
    background:rgba(212,175,55,.07)}

  /* ── Alert ribbon (extraction warnings, discoveries) ───────────────── */
  #ribbon{position:absolute;left:50%;top:64px;transform:translate(-50%,-14px);z-index:8;
    opacity:0;transition:.4s;pointer-events:none;text-align:center;
    background:linear-gradient(180deg,rgba(50,20,10,.96),rgba(28,12,6,.96));
    border:1px solid rgba(255,122,47,.6);border-radius:9px;padding:9px 22px;
    box-shadow:0 10px 34px rgba(0,0,0,.6);max-width:min(560px,86vw)}
  #ribbon.show{opacity:1;transform:translate(-50%,0)}
  #ribbon .rt{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.24em;color:var(--ember);
    text-transform:uppercase}
  #ribbon .rb{font-size:14px;color:var(--bone);margin-top:3px}

  /* ── Bottom action rail ────────────────────────────────────────────── */
  #rail{position:absolute;left:0;bottom:0;z-index:6;right:334px;padding:14px;
    display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;
    background:linear-gradient(0deg,rgba(13,11,18,.94),transparent);}
  #rail .btn{width:auto;min-width:118px}
  #tileinfo{background:var(--panel);border:1px solid var(--edge);border-radius:8px;
    padding:8px 12px;font-size:13px;min-width:210px;line-height:1.5}
  #tileinfo .tn{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;color:var(--gold);
    text-transform:uppercase}
  #tileinfo .td{color:var(--mist);font-style:italic;font-size:12.5px}
  #bearings{flex:1 1 100%;display:flex;gap:7px;flex-wrap:wrap;margin-bottom:2px}
  .bear{background:var(--panel);border:1px solid var(--edge);border-radius:999px;
    padding:3px 11px;font-size:12.5px;color:var(--mist);cursor:pointer;transition:.16s;
    white-space:nowrap}
  .bear:hover{border-color:var(--gold);color:var(--bone)}
  .bear b{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:600}
  .bear.here{border-color:rgba(255,122,47,.6);color:#ffd0b0;cursor:default}
  #legend{position:absolute;left:14px;top:64px;z-index:5;background:var(--panel);
    border:1px solid var(--edge);border-radius:8px;padding:9px 11px;font-size:12px;
    display:none;gap:4px;flex-direction:column}
  #legend.show{display:flex}
  #legend .l{display:flex;align-items:center;gap:7px;color:var(--mist)}
  #legend .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.4)}

  #err{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
    background:rgba(48,14,12,.97);border:1px solid var(--invalid);border-radius:8px;
    padding:9px 16px;font-size:13.5px;color:#ffcfc9;opacity:0;transition:.3s;pointer-events:none;
    max-width:min(520px,88vw);text-align:center}
  #err.show{opacity:1}

  /* ⚠ PHONE. The old rule left #side at 340px over a 390px viewport with the
     rail underneath it: the dossier covered 87% of the screen, the map was a
     50px strip and MOVE HERE / PITCH CAMP / END TURN were all buried. On a
     narrow screen the panel becomes a bottom sheet that starts collapsed, and
     the rail sits above it. */
  @media (max-width:900px){
    #side{width:100%;max-width:none;top:auto;bottom:0;height:58vh;
      border-left:0;border-top:1px solid var(--edge);border-radius:14px 14px 0 0;
      transform:translateY(calc(100% - 42px))}
    #side.open{transform:translateY(0)}
    #side.hidden{transform:translateY(calc(100% - 42px))}
    #sidetabs{height:42px}
    #sidetoggle{top:-1px;left:50%;margin:0 0 0 -32px;width:64px;height:22px;
      border-radius:8px 8px 0 0;border:1px solid var(--edge);border-bottom:0}
    #rail{right:0;bottom:44px;padding:8px 8px 6px;gap:6px}
    #rail .btn{min-width:0;flex:1 1 auto;padding:8px 6px;font-size:10px}
    #rail #tileinfo{min-width:0;flex:1 1 100%;padding:6px 9px;font-size:12px}
    #bearings{margin-bottom:0}
    .bear{font-size:11px;padding:2px 8px}
    #top{padding:6px 8px 18px;gap:5px}
    .pill{padding:3px 7px;font-size:12px}
    #decktrack{width:84px}
    #runname{font-size:11px}
  }
</style>
</head>
<body>

<canvas id="map"></canvas>

<div id="top">
  <div id="runname">Warpath</div>
  <div class="pill turn"><span class="ic">🕛</span><b id="t-turn">1</b><span class="sub">/60 turns</span></div>
  <div class="pill moves"><span class="ic">👣</span><b id="t-moves">6</b><span class="sub">moves</span></div>
  <div class="pill"><span class="ic">❤️</span><b id="t-hp">100</b><span class="sub">hp</span></div>
  <div class="pill"><span class="ic">🔐</span><span class="vault" id="t-vault">0/0</span><span class="sub">vault</span></div>
  <div id="deckbar">
    <span class="ic">🃏</span><b id="t-deck">25</b>
    <div id="decktrack"><div id="deckfill"></div></div>
    <span class="sub" id="t-decknext">→ 31</span>
  </div>
  <div class="pill" id="t-mode" title="Offline mock — no database attached"><span class="sub">offline</span></div>
</div>

<div id="ribbon"><div class="rt"></div><div class="rb"></div></div>
<div id="legend"></div>

<div id="rail">
  <div id="bearings"></div>
  <div id="tileinfo"><div class="tn">—</div><div class="td">Click a tile to inspect it.</div></div>
  <button class="btn" id="b-move" disabled>Move here</button>
  <button class="btn" id="b-harvest" disabled>Harvest</button>
  <button class="btn" id="b-camp">Pitch camp</button>
  <button class="btn ember" id="b-act" disabled>—</button>

</div>

<aside id="side">
  <button id="sidetoggle" title="Collapse">›</button>
  <div id="sidetabs">

  <div id="sidefoot"></div>

  <div class="sig"></div>
