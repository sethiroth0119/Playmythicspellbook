<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
  html,body{margin:0;padding:0;height:100%;background:transparent!important;background-image:none!important;overflow:hidden}
  #fx{position:fixed;inset:0;display:block;background:transparent!important;pointer-events:none}
</style>
<title>Weather Realms</title>
<script>window.WX_BUILD="v120r7-weather";</script>
</head>
<body>
<canvas id="fx"></canvas>
<script src="../vfx/fx-core.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   WEATHER REALMS — 21 battlefield weathers, each with its own painter.

   ⚠ THIS LAYER IS ON SCREEN FOR MINUTES, not for seven seconds. Two things
   follow and they drive every decision in this file:

     1. It does more to set the game's tone than any cinematic — and it has the
        most opportunity to quietly wash the board out, because the player has
        to READ CARDS THROUGH IT for whole turns.
     2. Per-frame cost matters. Nothing here may allocate per particle. (The
        old fire_rain built 220 linear gradients EVERY FRAME; that alone was
        0.75 ms/frame, four times the cost of the heaviest rain.)

   ───────────────────────────────────────────────────────────────────────────
   THE CEILING STRUCTURE — two sealed passes, not one clamp
   ───────────────────────────────────────────────────────────────────────────
   The old build carried ONE ceiling at 0.72 over everything, and the metric
   that blessed it (`whiteWash`: alpha > 200 AND rgb > 200) could not fire:
   0.72 × 255 = 183.6, so the test was unreachable by construction. It would
   have reported 0.00% on a solid white screen. It is not used here.

   What is measured instead is the luminance the PLAYER SEES:
        compLum(BL) = BL·(1−a) + lum(rgb)·a
   at board brightnesses 40 / 90 / 140. ⚠ The weather iframe composites at
   opacity **1.0** — index.html raises it to '1' after the stamp check and the
   host div carries no opacity — so unlike the cinematics there is no 0.9 wrap
   to hide behind. The raw frame IS what lands on the board.

   So the frame is composited in two sealed passes:

     AIR  — ceiling 0.36. Every light-emitting thing: sky grade, fog banks,
            glows, motes, streaks, halos, shafts, embers, the lightning lift.
            No particle density can escape it: with a bounded to 0.36 and the
            engine's colour clamp holding luminance under ~237, the worst pixel
            this pass can put on a board of 140 is 175, and on a board of 40 is
            111. That is a structural guarantee, not a tuning value.
     FORM — ceiling 0.66. Line work and solid bodies ONLY: the sun/moon disc,
            the tornado funnel, the flood surface, the runic circles, the clock
            dial, the near-plane. These are strokes and fills at sub-0.6 written
            alpha in mid-tone colour — they are what makes a weather
            IDENTIFIABLE at a glance, and they are physically incapable of
            covering the frame the way an atmosphere can.

   `seal()` is FX.applyCeiling(AIR/FORM) called between the passes; FX.mount's
   own applyCeiling(FORM) finishes the frame, so AIR lands at exactly 0.36.
   destination-in multiplies DESTINATION ALPHA ONLY — colour is untouched, so
   it cannot divide colour up into white the way a premultiplied ceiling did.
   Core 2D blending, no GPU capability to gate on.

   TWO CONSEQUENCES THAT ONLY SHOW UP UNDER MEASUREMENT (inherited from the
   cinematics, both confirmed here):
     • The seal clamps the DARK as hard as the light. A 0.20 vignette written
       into a pass about to be multiplied by 0.36 arrives at 0.07 — i.e.
       nothing. Every dark value in the AIR pass is pre-compensated by
       IK = 1/AIR.
     • Atmosphere light must be WRITTEN BRIGHT. Writing 0.25 into that same
       pass puts 0.09 on the board — that is mechanically what "the effects
       feel thin" always was. Light carries a gain of LG and the seal is the
       guarantee that density still cannot escape.

   ───────────────────────────────────────────────────────────────────────────
   INTENSITY is meaningful across its whole range — it scales how many elements
   there are, how strongly they draw, how fast they move, AND how strong the
   structural pieces are (the flood band, the funnel, the fog). It has floors,
   so 10% is "light rain" rather than "nothing".
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {

  /* ── the two ceilings ─────────────────────────────────────────────────── */
  var AIR  = 0.36;              /* everything that emits light */
  var FORM = 0.66;              /* line work and bodies only */
  var SEAL = AIR / FORM;        /* the mid-frame destination-in */
  var IK   = 1 / AIR;           /* pre-compensation for DARK values in AIR */
  var LG   = 2.3;               /* gain for LIGHT in AIR — write bright, seal low */
  FX.CEIL  = FORM;              /* FX.mount applies this at the end of the frame */

  var cur = 'normal_rain', intensity = 0.5, bolt = { t: -9, x: 0.5, seed: 0 };

  /* ♿ prefers-reduced-motion. The field is frozen at a single well-composed
     instant rather than removed — the weather still tells you what weather it
     is, it just does not move. Lightning is skipped entirely (a frozen clock
     would hold the flash on screen forever). Live-bound, because the OS
     setting can change while a match is running. */
  var RM = false;
  try {
    var _mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    RM = !!_mq.matches;
    var _onmq = function (e) { RM = !!e.matches; };
    if (_mq.addEventListener) _mq.addEventListener('change', _onmq);
    else if (_mq.addListener) _mq.addListener(_onmq);
  } catch (e) {}

  /* deterministic scratch fields — reused by every painter, never reallocated */
  var P = FX.pool(560, function (p, i) {
    p.x = FX.hash(i, 11); p.y = FX.hash(i, 12);
    p.z = 0.30 + FX.hash(i, 13) * 0.95;        /* depth: size + speed + alpha */
    p.s = 0.5 + FX.hash(i, 14) * 1.3;
    p.r = FX.hash(i, 15) * 6.2832;
    p.w = FX.hash(i, 16);
    p.v = FX.hash(i, 17);
    p.u = FX.hash(i, 18);
  });

  /* ── intensity curves ─────────────────────────────────────────────────── */
  /* ⚠ THE FLOORS MATTER MORE THAN THE RANGE. At the old floors, 10% intensity
     painted 0.5% of the screen — indistinguishable from the effect being
     broken, which is exactly how it was reported. */
  function dens(i)   { return 0.55 + 0.45 * i; }
  /* ⚠ NOT clamped to 1 — FX.rgba clamps at the point of use. The old build
     wrote Math.min(1, (0.70+0.30i)*1.35), which pins at 1.0 for every
     intensity above 0.22: the gain never landed and the slider stopped
     moving alpha entirely. With LG applied here and the seal at AIR, an
     ISOLATED light element lands at ~115% of its old on-screen strength
     while a DENSE one is hard-capped at 0.36 instead of 0.72. */
  function alph(i)   { return (0.70 + 0.30 * i) * LG; }
  function spd(i)    { return 0.75 + 0.50 * i; }
  /* ⚠ STRUCTURAL elements — fog banks, the flood band, the funnel — are not
     particles, so they ignored dens()/alph() and the slider did nothing for the
     weathers built out of them (fog read 72% at 10% AND at 100%). */
  function struct(i) { return 0.30 + 0.70 * i; }

  /* ── the shared wind ──────────────────────────────────────────────────── */
  /* ONE slowly-varying gust that every painter reads. Rain, leaves, snow, dust
     and fog all lean the same way at the same moment, which is the difference
     between "a weather system" and "N independent particle emitters". Two
     sines, evaluated a handful of times per frame — not per particle. */
  function gust(k) {
    return Math.sin(FX.t * 0.23 + k) * 0.62 + Math.sin(FX.t * 0.071 + k * 2.3) * 0.38;
  }

  /* ── AIR helpers ──────────────────────────────────────────────────────── */

  /* THE GRADE. A dark vertical wash plus a corner vignette that frames the
     board. Both stops are DARK, so this can only ever lower luminance — the
     one direction that can never trip the white bug. Pre-compensated by IK so
     the seal does not eat it (this is the mistake the cinematics measured:
     0.20 written into a 0.36 pass arrives at 0.07). */
  function grade(ctx, W, H, cTop, cBot, k) {
    var a = Math.min(1, k * IK);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, FX.rgba(cTop, a));
    g.addColorStop(1, FX.rgba(cBot, a * 0.52));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var U = Math.max(W, H);
    var v = ctx.createRadialGradient(W * 0.5, H * 0.52, U * 0.22, W * 0.5, H * 0.52, U * 0.76);
    v.addColorStop(0, FX.rgba(cBot, 0));
    v.addColorStop(1, FX.rgba(cBot, Math.min(1, a * 1.45)));
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  /* CENTRE RELIEF — the constraint "it never obscures the board" made
     STRUCTURAL instead of a promise about particle counts. One destination-out
     radial punches the atmosphere back by ~45% over the middle of the field,
     where the cards are, and leaves it at full strength at the edges, where
     the weather reads. Costs one fill; runs before the seal so it thins the
     grade — NOT the particle field. ⚠ Running it after the painter
     punched a visible elliptical HOLE in the middle of a downpour, which is
     a worse artefact than the crowding it was meant to fix; the seal at AIR
     already holds board visibility near 80%. Order is the whole fix. */
  function relief(ctx, W, H) {
    var U = Math.max(W, H);
    var g = ctx.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, U * 0.58);
    g.addColorStop(0,    'rgba(0,0,0,0.45)');
    g.addColorStop(0.52, 'rgba(0,0,0,0.24)');
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* Falling streaks with three real depth bands and ONE shared wind, so a
     downpour reads as a single moving volume rather than N independent dots.
     ⚠ NO per-particle gradient object. Two flat segments give the same taper
     for a fraction of the time, and this loop runs 360 times a frame for
     minutes on end. */
  function streaks(ctx, W, H, n, colour, opt) {
    opt = opt || {};
    var wind = (opt.wind || 0.18) + gust(0) * (opt.gust == null ? 0.075 : opt.gust);
    var len = opt.len || 26, sp = opt.speed || 1, a = opt.alpha || 0.4, th = opt.thick || 1.5;
    ctx.lineCap = 'butt';
    for (var i = 0; i < n; i++) {
      var p = P[i % P.length];
      var z = p.z;
      var y = ((p.y + FX.t * sp * 0.42 * z) % 1);
      var x = ((p.x + FX.t * wind * 0.10 * z + Math.sin(FX.t * 0.7 + p.r) * 0.005) % 1 + 1) % 1;
      var L = len * z * (0.7 + p.s * 0.4);
      var X = x * W, Y = y * H, dx = -wind * L * 2.2;
      ctx.lineWidth = Math.max(0.7, z * th);
      ctx.strokeStyle = FX.rgba(colour, a * z * 0.95);
      ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X + dx * 0.42, Y - L * 0.42); ctx.stroke();
      /* ⚠ 0.55, not 0.34. Perceived density is TOTAL INK, not peak alpha:
         at 0.34 the two-segment taper put less on screen than the old flat
         stroke and rain read as drizzle at intensity 1. */
      ctx.strokeStyle = FX.rgba(colour, a * z * 0.55);
      ctx.beginPath(); ctx.moveTo(X + dx * 0.42, Y - L * 0.42); ctx.lineTo(X + dx, Y - L); ctx.stroke();
    }
  }

  /* THE CURTAIN — soft vertical sheets drifting across the field. It is what
     makes rain read as VOLUME instead of as a screen of lines, and it costs
     three gradients a frame rather than three hundred. */
  function curtain(ctx, W, H, n, colour, a, sp) {
    for (var i = 0; i < n; i++) {
      var p = P[(i * 31) % P.length];
      var x = (((p.x + FX.t * sp * 0.035 * (0.4 + p.z)) % 1.4) - 0.2) * W;
      var w = W * (0.10 + p.z * 0.17);
      var g = ctx.createLinearGradient(x - w, 0, x + w, 0);
      g.addColorStop(0,   FX.rgba(colour, 0));
      g.addColorStop(0.5, FX.rgba(colour, a * (0.5 + p.z * 0.5)));
      g.addColorStop(1,   FX.rgba(colour, 0));
      ctx.fillStyle = g; ctx.fillRect(x - w, 0, w * 2, H);
    }
  }

  /* Splash pops where rain lands — ring plus a vertical kick, so it reads as
     water hitting a surface rather than as an expanding circle. */
  function splashes(ctx, W, H, n, colour, a) {
    for (var i = 0; i < n; i++) {
      var p = P[(i * 7) % P.length];
      var cyc = (FX.t * (0.9 + p.s * 0.5) + p.w) % 1;
      if (cyc > 0.35) continue;
      var k = cyc / 0.35;
      var x = p.x * W, y = (0.55 + p.v * 0.42) * H;
      ctx.strokeStyle = FX.rgba(colour, a * (1 - k) * 0.62);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(x, y, 3 + k * 13, (3 + k * 13) * 0.30, 0, 0, 6.2832); ctx.stroke();
      if (k < 0.5) {
        ctx.strokeStyle = FX.rgba(colour, a * (1 - k * 2) * 0.5);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (p.u - 0.5) * 5, y - 4 - k * 9); ctx.stroke();
      }
    }
  }

  /* Rolling fog banks with parallax. FX.glowSoft is source-over, never
     'lighter' — a dozen overlapping additive fog blobs saturate toward white no
     matter how well each colour is clamped, and that is a bug this project has
     already shipped once. */
  function fogBanks(ctx, W, H, n, colour, a, speed, yBase, spread) {
    var gx = gust(1.7) * 0.03;
    for (var i = 0; i < n; i++) {
      var p = P[(i * 13) % P.length];
      var x = ((p.x + FX.t * speed * (0.2 + p.z * 0.5) * 0.05 + gx * p.z) % 1.4 - 0.2) * W;
      var y = (yBase + p.v * spread) * H;
      var r = Math.min(W, H) * (0.12 + p.z * 0.22);
      FX.glowSoft(x, y, r, colour, a * (0.4 + p.z * 0.6) * struct(intensity));
    }
  }

  /* SHAFTS that start at an ABSOLUTE inner radius. The sibling cinematics
     proved that rays drawn from a body's centre are simply painted over by the
     body — the fix is geometry, not brightness. Soft on both axes (a single
     quad has hard side edges, which is literally why the old Archon gate drew a
     grey rectangle on the board). */
  function rays(ctx, cx, cy, n, r0, r1, colour, a, base, spread, wob) {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < n; i++) {
      var f = n === 1 ? 0.5 : i / (n - 1);
      var ang = base + (f - 0.5) * spread + Math.sin(FX.t * 0.25 + i * 1.7) * (wob == null ? 0.014 : wob);
      var ca = Math.cos(ang), sa = Math.sin(ang), px = -sa, py = ca;
      var w0 = r0 * 0.05, w1 = r0 * (0.16 + FX.hash(i, 61) * 0.22);
      var k = a * (0.5 + FX.hash(i, 62) * 0.5) * (0.7 + 0.3 * FX.pulse(FX.t, 0.11 + i * 0.017));
      var g = ctx.createLinearGradient(cx + ca * r0, cy + sa * r0, cx + ca * r1, cy + sa * r1);
      g.addColorStop(0,   FX.rgba(colour, k));
      g.addColorStop(0.6, FX.rgba(colour, k * 0.35));
      g.addColorStop(1,   FX.rgba(colour, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx + ca * r0 + px * w0, cy + sa * r0 + py * w0);
      ctx.lineTo(cx + ca * r1 + px * w1, cy + sa * r1 + py * w1);
      ctx.lineTo(cx + ca * r1 - px * w1, cy + sa * r1 - py * w1);
      ctx.lineTo(cx + ca * r0 - px * w0, cy + sa * r0 - py * w0);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* The halo of a celestial body. AIR pass — it is light. */
  function discGlow(ctx, W, H, colour, r, glow, opt) {
    opt = opt || {};
    var dx = W * (opt.x || 0.84), dy = H * (opt.y || 0.22), R = Math.min(W, H) * r;
    FX.glow(dx, dy, R * (opt.halo || 3.0), colour, glow);
    return { x: dx, y: dy, r: R };
  }
  /* The body of a celestial body. FORM pass — it must read as an object.
     Moons hang to the RIGHT of the board, as asked. */
  function discBody(ctx, W, H, colour, r, opt) {
    opt = opt || {};
    var dx = W * (opt.x || 0.84), dy = H * (opt.y || 0.22), R = Math.min(W, H) * r;
    /* a dark seat behind the body so the disc reads as a silhouette with a lit
       face rather than as a bright smear on the sky */
    ctx.fillStyle = 'rgba(5,4,9,0.30)';
    ctx.beginPath(); ctx.arc(dx, dy, R * 1.16, 0, 6.2832); ctx.fill();
    /* the face — lit from one side, so it has volume */
    var g = ctx.createRadialGradient(dx - R * 0.32, dy - R * 0.30, R * 0.05, dx, dy, R);
    g.addColorStop(0, FX.rgba(colour, (opt.solid == null ? 0.58 : opt.solid)));
    g.addColorStop(0.72, FX.rgba(colour, (opt.solid == null ? 0.58 : opt.solid) * 0.72));
    g.addColorStop(1, FX.rgba(opt.limb || colour, (opt.solid == null ? 0.58 : opt.solid) * 0.34));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(dx, dy, R, 0, 6.2832); ctx.fill();
    if (opt.crater) {
      for (var c = 0; c < 7; c++) {
        var ca = FX.hash(c, 41) * 6.2832, cr = R * (0.15 + FX.hash(c, 42) * 0.5);
        ctx.fillStyle = FX.rgba(opt.crater, 0.34);
        ctx.beginPath(); ctx.arc(dx + Math.cos(ca) * cr, dy + Math.sin(ca) * cr, R * (0.06 + FX.hash(c, 43) * 0.13), 0, 6.2832); ctx.fill();
      }
    }
    if (opt.eclipse) {                                  /* the occluding body */
      ctx.fillStyle = 'rgba(6,4,10,0.97)';
      ctx.beginPath(); ctx.arc(dx - R * 0.10, dy - R * 0.05, R * 0.96, 0, 6.2832); ctx.fill();
      ctx.lineWidth = Math.max(2, R * 0.045);
      ctx.strokeStyle = FX.rgba(opt.eclipse, 0.5);
      ctx.beginPath(); ctx.arc(dx, dy, R * 1.02, 0, 6.2832); ctx.stroke();
    }
    return { x: dx, y: dy, r: R };
  }

  /* LIGHTNING. ⚠ The old version lit the whole frame with a flat fillRect —
     a full-screen light fill is the single most direct route to the bug the
     user keeps reporting. The lift is now a TOP-WEIGHTED gradient: the sky
     brightens, the board (bottom two thirds, where the cards are) barely
     moves. The strike is a real double-flash — hit, dip, brighter — and the
     bolt carries a dark halo so it reads as force rather than as a white line.
     Skipped entirely under reduced motion. */
  function lightning(ctx, W, H, colour, I, every) {
    if (RM) return;
    var gap = (every || 3.4) - I * 1.4;
    if (FX.t - bolt.t > gap) { bolt.t = FX.t; bolt.seed++; bolt.x = 0.15 + FX.hash(bolt.seed, 91) * 0.7; }
    var age = FX.t - bolt.t;
    if (age < 0 || age > 0.55) return;
    /* double-flash envelope */
    var f = age < 0.09 ? (1 - age / 0.09) * 0.75
          : age < 0.15 ? 0.10
          : (1 - (age - 0.15) / 0.40);
    if (f <= 0) return;
    var g = ctx.createLinearGradient(0, 0, 0, H * 0.86);
    g.addColorStop(0,   FX.rgba(colour, 0.30 * f * I));
    g.addColorStop(0.45, FX.rgba(colour, 0.10 * f * I));
    g.addColorStop(1,   FX.rgba(colour, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var draw = function (x0, segs, wdt, a) {
      var xx = x0, yy = -10;
      var pts = [[xx, yy]];
      for (var s = 0; s < segs; s++) {
        yy += H / segs; xx += (FX.hash(bolt.seed * 20 + s, 92) - 0.5) * W * 0.11;
        pts.push([xx, yy]);
      }
      /* dark halo first — contrast made of black, which can only lower lum */
      ctx.strokeStyle = 'rgba(3,4,10,0.5)';
      ctx.lineWidth = wdt * 3.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      for (var q = 1; q < pts.length; q++) ctx.lineTo(pts[q][0], pts[q][1]);
      ctx.stroke();
      ctx.strokeStyle = FX.rgba(colour, a * f);
      ctx.lineWidth = wdt;
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      for (var q2 = 1; q2 < pts.length; q2++) ctx.lineTo(pts[q2][0], pts[q2][1]);
      ctx.stroke();
    };
    var bx = bolt.x * W;
    draw(bx, 8, 3.0, 0.80);
    if (FX.hash(bolt.seed, 93) > 0.45) draw(bx + W * 0.06, 6, 1.7, 0.44);
  }

  /* ── FORM helpers ─────────────────────────────────────────────────────── */

  /* NEAR PLANE — a handful of large, out-of-focus elements crossing close to
     camera. It is the depth cue you cannot buy with more particles, and every
     one of them is DARK, so it can only ever lower luminance. Five soft
     gradients a frame. */
  function nearPlane(ctx, W, H, n, colour, a, sp, sq) {
    for (var i = 0; i < n; i++) {
      var p = P[(i * 47) % P.length];
      var y = (((p.y + FX.t * sp * 0.15) % 1.28) - 0.14) * H;
      var x = (((p.x + FX.t * sp * 0.028 + Math.sin(FX.t * 0.4 + p.r) * 0.02) % 1.24) - 0.12) * W;
      var r = Math.min(W, H) * (0.045 + p.z * 0.06);
      ctx.save(); ctx.translate(x, y); ctx.scale(1, sq || 1);
      FX.glowSoft(0, 0, r, colour, a * (0.5 + p.w * 0.5));
      ctx.restore();
    }
  }

  /* A horizon line — where the weather meets the ground. Cheap silhouette. */
  function surface(ctx, W, H, lvl, colour, a, amp, hz) {
    ctx.strokeStyle = FX.rgba(colour, a);
    ctx.lineWidth = 2; ctx.beginPath();
    for (var x = 0; x <= W; x += 12) {
      var yy = lvl + Math.sin((x / W) * 9 + FX.t * hz) * amp + Math.sin((x / W) * 21 - FX.t * hz * 1.4) * amp * 0.5;
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }

  /* ── the painters ─────────────────────────────────────────────────────────
     Each preset is { g:[darkTop, darkBottom, gradeStrength], air:fn, form:fn }.
     `air` may only draw light and haze; `form` may only draw line work and
     bodies. Nothing in `form` covers the frame.
     ───────────────────────────────────────────────────────────────────────── */
  var WX = {

    sunny_day: {
      g: ['#14202e', '#1b2b36', 0.55],
      air: function (ctx, W, H, I) {
        var d = discGlow(ctx, W, H, '#e8c56a', 0.085, 0.30 * I, { x: 0.82, y: 0.18, halo: 4.4 });
        /* ⚠ r0 starts OUTSIDE the disc — a shaft drawn from the centre is
           painted over by the body, which is exactly the defect the sibling
           piece found in its reveal. */
        rays(ctx, d.x, d.y, 7, d.r * 1.25, Math.max(W, H) * 1.05, '#e8d9a0', 0.17 * I, 2.30, 1.15);
        /* warm sky haze along the top only — never the middle of the board */
        var g = ctx.createLinearGradient(0, 0, 0, H * 0.62);

      g: ['#05081a', '#0b1130', 0.95],

          var p = P[i];
          var y = ((p.y + FX.t * 0.06 * p.z * spd(I)) % 1) * H;
          var x = ((p.x + Math.sin(FX.t * 0.3 + p.r) * 0.02) % 1) * W;
          ctx.fillStyle = FX.rgba('#6b5c74', 0.34 * p.z * alph(I));
          ctx.beginPath(); ctx.arc(x, y, 1 + p.z * 1.8, 0, 6.2832); ctx.fill();
        }
      },
      form: function (ctx, W, H, I) {
        discBody(ctx, W, H, '#c9a2ff', 0.10, { x: 0.84, y: 0.20, solid: 0.46, eclipse: '#d8b4ff' });
        nearPlane(ctx, W, H, 3, '#050309', 0.14 * struct(I), 0.5, 1);
      }
    },

    blood_moon: {
      g: ['#120406', '#1d080b', 1.30],
      air: function (ctx, W, H, I) {
        discGlow(ctx, W, H, '#b3384a', 0.11, 0.30 * I, { x: 0.84, y: 0.20, halo: 3.8 });
        var n = Math.round(160 * dens(I));
        for (var i = 0; i < n; i++) {
          var p = P[i];
          var y = ((p.y + FX.t * 0.07 * p.z * spd(I)) % 1) * H;
          var x = ((p.x + Math.sin(FX.t * 0.35 + p.r) * 0.025) % 1) * W;
          ctx.fillStyle = FX.rgba('#c2564a', 0.32 * p.z * alph(I));
          ctx.beginPath(); ctx.arc(x, y, 1.1 + p.z * 2, 0, 6.2832); ctx.fill();
        }
        fogBanks(ctx, W, H, Math.round(7 * dens(I)), '#4a1218', 0.22 * I, 0.4, 0.66, 0.3);
      },
      form: function (ctx, W, H, I) {
        discBody(ctx, W, H, '#b3384a', 0.11, { x: 0.84, y: 0.20, solid: 0.55, crater: '#5a1723', limb: '#68202c' });
        nearPlane(ctx, W, H, 3, '#0d0305', 0.13 * struct(I), 0.5, 1);
      }
    },

    /* ⚠ THE MEAN OFFENDER OF THE OLD BUILD. It was the ONE preset whose mean
       background luminance came out BRIGHTER than the board it sits on
       (102.6 against a board of 90) — a pale grey sheet over the whole field,
       which is precisely what "the board is washed out" means. Mist is now
       built out of DARK banks with a thin pale rim near the top, so it removes
       contrast (which is what fog does) without adding light. */
    veil: {
      g: ['#0d1016', '#151920', 1.20],
      air: function (ctx, W, H, I) {
        fogBanks(ctx, W, H, Math.round(16 * dens(I)), '#5c6673', 0.62, 0.30, 0.30, 0.55);
        fogBanks(ctx, W, H, Math.round(13 * dens(I)), '#454d5a', 0.56, 0.55, 0.60, 0.40);
        /* the pale rim only where the bank is thin, along the top */
        var g = ctx.createLinearGradient(0, H * 0.05, 0, H * 0.45);
        g.addColorStop(0, FX.rgba('#96a1b0', 0.20 * struct(I)));
        g.addColorStop(1, FX.rgba('#8a95a4', 0));
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.45);
        var n = Math.round(40 * dens(I));
        for (var i = 0; i < n; i++) {                        /* drifting wisps */
          var p = P[i];
          FX.glow(((p.x + FX.t * 0.012 * p.z + gust(0.6) * 0.01) % 1 + 1) % 1 * W,
                  ((p.y + Math.sin(FX.t * 0.2 + p.r) * 0.02) % 1) * H,
                  14 * p.z, '#9aa5b3', 0.07 * alph(I));
        }
      },
      form: function (ctx, W, H, I) {
        nearPlane(ctx, W, H, 5, '#191e26', 0.16 * struct(I), 0.22, 0.85);
      }
    },

    noosphere: {
      g: ['#070f1c', '#0c1a2c', 1.00],
      air: function (ctx, W, H, I) {
        var n = Math.round(70 * dens(I));
        for (var i = 0; i < n; i++) {
          var p = P[i];
          FX.glow(((p.x + Math.sin(FX.t * 0.25 + p.r) * 0.05) % 1) * W,
                  ((p.y + Math.cos(FX.t * 0.2 + p.r) * 0.04) % 1) * H,
                  5 + p.z * 8, i % 3 === 0 ? '#a5d8f0' : '#5ba3d0', 0.20 * alph(I));
        }
        FX.glowSoft(W / 2, H * 0.55, Math.min(W, H) * 0.5, '#0f2440', 0.30 * struct(I));
      },
      form: function (ctx, W, H, I) {
        for (var w = 0; w < 5; w++) {                        /* psychic waves */
          var ph = (FX.t * 0.14 + w * 0.2) % 1;
          var rr = Math.min(W, H) * (0.10 + ph * 0.7);
          ctx.save(); ctx.translate(W / 2, H * 0.55); ctx.scale(1, 0.42);
          ctx.strokeStyle = FX.rgba('#67b7e0', 0.24 * (1 - ph) * struct(I));
          ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.2832); ctx.stroke();
          ctx.restore();
        }
        /* filaments between the nearest motes — the "network" read */
        ctx.strokeStyle = FX.rgba('#4f93bd', 0.16 * struct(I));
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var i = 0; i < 14; i++) {
          var a = P[i * 3], b = P[i * 3 + 1];
          ctx.moveTo(((a.x + Math.sin(FX.t * 0.25 + a.r) * 0.05) % 1) * W, ((a.y + Math.cos(FX.t * 0.2 + a.r) * 0.04) % 1) * H);
          ctx.lineTo(((b.x + Math.sin(FX.t * 0.25 + b.r) * 0.05) % 1) * W, ((b.y + Math.cos(FX.t * 0.2 + b.r) * 0.04) % 1) * H);
        }
        ctx.stroke();
      }
    },

    oil_rain: {
      g: ['#080604', '#100d08', 1.25],
      air: function (ctx, W, H, I) {
        curtain(ctx, W, H, 3, '#2a2418', 0.22 * struct(I), spd(I));
        streaks(ctx, W, H, Math.round(280 * dens(I)), '#5b503c',
                { len: 34, wind: 0.2, speed: 1.4 * spd(I), alpha: 0.50 * alph(I), thick: 2.4 });
        for (var i = 0; i < Math.round(10 * dens(I)); i++) {  /* iridescence */
          var p = P[(i * 19) % P.length];
          FX.glow(p.x * W, H * (0.86 + p.v * 0.12), 26 * p.z, i % 2 ? '#3f7d6a' : '#6a4a7d', 0.10 * alph(I));
        }
      },
      form: function (ctx, W, H, I) {
        var g = ctx.createLinearGradient(0, H * 0.80, 0, H);
        g.addColorStop(0, FX.rgba('#14120c', 0));
        g.addColorStop(1, FX.rgba('#1a160e', 0.42 * struct(I)));
        ctx.fillStyle = g; ctx.fillRect(0, H * 0.80, W, H * 0.2);
        surface(ctx, W, H, H * 0.815, '#4a4230', 0.30 * struct(I), 3, 0.9);
        nearPlane(ctx, W, H, 4, '#060503', 0.15 * struct(I), 1.2, 2.2);
      }
    },

    fire_rain: {
      g: ['#150603', '#210b05', 1.20],
      air: function (ctx, W, H, I) {
        var n = Math.round(220 * dens(I));
        /* ⚠ NO per-particle gradient. The old version built one linear gradient
           for every one of these 220 embers, EVERY FRAME — 0.75 ms/frame, four
           times the cost of the heaviest rain, on a layer that stays up for
           minutes. Three flat segments read the same and cost a sixth. */
        ctx.lineCap = 'butt';
        for (var i = 0; i < n; i++) {
          var p = P[i];
          var y = ((p.y + FX.t * 0.30 * p.z * spd(I)) % 1) * H;
          var x = ((p.x + FX.t * 0.03 * p.z) % 1) * W;
          var L = 24 * p.z, dx = -L * 0.3;
          ctx.lineWidth = 1.7 * p.z;
          ctx.strokeStyle = FX.rgba('#e2732a', 0.62 * alph(I));
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx * 0.34, y - L * 0.34); ctx.stroke();
          ctx.lineWidth = 1.2 * p.z;
          ctx.strokeStyle = FX.rgba('#b8471a', 0.32 * alph(I));
          ctx.beginPath(); ctx.moveTo(x + dx * 0.34, y - L * 0.34); ctx.lineTo(x + dx * 0.68, y - L * 0.68); ctx.stroke();
          ctx.lineWidth = 0.9 * p.z;
          ctx.strokeStyle = FX.rgba('#7d2a0c', 0.16 * alph(I));
          ctx.beginPath(); ctx.moveTo(x + dx * 0.68, y - L * 0.68); ctx.lineTo(x + dx, y - L); ctx.stroke();
          if (i % 3 === 0) FX.glow(x, y, 5 * p.z, '#e88a2a', 0.32 * alph(I));
        }
        var gg = ctx.createLinearGradient(0, H * 0.78, 0, H);
        gg.addColorStop(0, FX.rgba('#c2410c', 0));
        gg.addColorStop(1, FX.rgba('#c2410c', 0.32 * struct(I)));
        ctx.fillStyle = gg; ctx.fillRect(0, H * 0.78, W, H * 0.22);
      },
      form: function (ctx, W, H, I) {
        nearPlane(ctx, W, H, 4, '#0e0402', 0.14 * struct(I), 1.6, 2.4);
      }
    },

    /* ⏳ A slow-of-time field: concentric dial rings, motes that drift in
       stutters, and a slow pulse across the board. */
    time_slow: {
      g: ['#0b0d18', '#12142a', 0.85],
      air: function (ctx, W, H, I) {
        var n = Math.round(90 * dens(I));
        for (var i = 0; i < n; i++) {                        /* stuttering motes */
          var p = P[i];
          var stut = Math.floor((FX.t * 0.5 + p.w) * 6) / 6;
          var y = ((p.y + stut * 0.12 * p.z) % 1) * H;
          var x = ((p.x + Math.sin(stut * 2 + p.r) * 0.01) % 1) * W;
          FX.glow(x, y, 3 + p.z * 5, i % 4 === 0 ? '#c9dcf0' : '#7fa8cc', 0.22 * alph(I));
        }
      },
      form: function (ctx, W, H, I) {
        var cx = W / 2, cy = H * 0.55, U = Math.min(W, H);
        for (var r = 0; r < 3; r++) {                        /* dial rings */
          var rr = U * (0.16 + r * 0.11);
          ctx.save(); ctx.translate(cx, cy); ctx.scale(1, 0.42);
          ctx.strokeStyle = FX.rgba('#7fa2c2', 0.24 * struct(I));
          ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.2832); ctx.stroke();
          ctx.strokeStyle = FX.rgba('#a8c2da', 0.26 * struct(I));
          for (var k = 0; k < 12; k++) {
            var a = (k / 12) * 6.2832;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * rr * 0.92, Math.sin(a) * rr * 0.92);
            ctx.lineTo(Math.cos(a) * rr * 1.04, Math.sin(a) * rr * 1.04);
            ctx.stroke();
          }
          ctx.restore();
        }
        /* the sweeping hand, stepping rather than gliding */
        var step = Math.floor(FX.t * 1.6) / 1.6;
        ctx.save(); ctx.translate(cx, cy); ctx.scale(1, 0.42);
        ctx.rotate(step * 0.9);
        ctx.strokeStyle = FX.rgba('#8fbfe6', 0.34 * struct(I));
        ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(U * 0.26, 0); ctx.stroke();
        ctx.restore();
        /* one slow pulse crossing the field */
        var pw = (FX.t * 0.18) % 1;
        ctx.save(); ctx.translate(cx, cy); ctx.scale(1, 0.42);
        ctx.strokeStyle = FX.rgba('#9cc0e0', 0.20 * (1 - pw) * struct(I));
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, U * 0.1 + pw * U * 0.8, 0, 6.2832); ctx.stroke();
        ctx.restore();
      }
    }
  };

  /* preset list (id → painter + label). Order drives the picker. */
  var LIST = [
    ['sunny_day', 'Sunny Day'], ['normal_rain', 'Rain'], ['thunderhead', 'Thunderstorm'],
    ['sandstorm', 'Sandstorm'], ['snow', 'Snowfall'], ['flood', 'Flood'],
    ['tornado_storm', 'Tornado'], ['magical_leaves', 'Magical Leaves'], ['stars_falling', 'Star Storm'],
    ['magic_aura_realm', 'Magic Aura'], ['holy_aura', 'Holy Aura'], ['infection_gas', 'Infection Aura'],
    ['toxic_aura', 'Toxic Gas'], ['solaris', 'Solaris'], ['eclipse', 'Eclipse'],
    ['blood_moon', 'Blood Moon'], ['veil', 'Mist / Fog'], ['noosphere', 'Noosphere'],
    ['oil_rain', 'Raining Oil'], ['fire_rain', 'Raining Fire'], ['time_slow', 'Slow of Time']
  ];

  /* ── the frame ────────────────────────────────────────────────────────── */
  FX.mount({ draw: function () {
    /* ♿ frozen field under reduced motion — a still, legible atmosphere rather
       than no atmosphere. Held at a time that has all the cycles part-way
       through, so nothing is caught mid-blink. */
    if (RM) FX.t = 4.0;

    var ctx = FX.ctx, W = FX.W, H = FX.H;
    var I = Math.max(0.05, Math.min(1, intensity));
    var wx = WX[cur] || WX.normal_rain;

    /* ── AIR ── everything that emits light, plus the dark grade */
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    grade(ctx, W, H, wx.g[0], wx.g[1], (0.055 + 0.085 * I) * wx.g[2]);
    relief(ctx, W, H);           /* ⚑ thins the GRADE only — see relief() */
    if (wx.air) wx.air(ctx, W, H, I);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    FX.applyCeiling(SEAL);            /* ⚑ the seal — AIR lands at exactly AIR */

    /* ── FORM ── line work and bodies only */
    if (wx.form) wx.form(ctx, W, H, I);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    /* FX.mount applies FX.CEIL = FORM after this returns */
  }});

  window.WeatherRealms = {
    list: function () { return LIST.map(function (r, i) { return { index: i, id: r[0], name: r[1] }; }); },
    set: function (idOrIndex) {
      var was = cur;
      if (typeof idOrIndex === 'number') { cur = (LIST[idOrIndex] || LIST[1])[0]; }
      else if (WX[idOrIndex]) { cur = idOrIndex; }
      /* a preset swap must not inherit the previous weather's strike timer, or
         a storm handed over mid-flash holds the lift on the new sky */
      if (cur !== was) { bolt.t = -9; bolt.seed = 0; }
      return cur;
    },
    setIntensity: function (v) { intensity = Math.max(0, Math.min(1, +v || 0)); },
    current: function () { var i = LIST.findIndex(function (r) { return r[0] === cur; }); return { index: i, id: cur, name: (LIST[i] || [])[1] }; },
    step: function (dt) { window.__vfxStep(dt); }
  };
})();
</script>
</body>
</html>
